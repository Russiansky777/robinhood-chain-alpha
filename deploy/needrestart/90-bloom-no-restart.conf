# Поставлено прогоном run_vps_autoupdate_guard_nl.yml по решению владельца 26.09
# (пункт 2 дневного плана): автообновления НЕ перезапускают торговые службы.
#
# ЗАЧЕМ. 26.09 в 04:53:45Z обновление curl и libexpat перезапустило
# bloom-detector, bloom-seller (дважды), dbot-detect-probe, grpc-feed-probe и
# бегунок GitHub -- без предупреждения и в непредсказуемую минуту. В торговле
# это значит: детектор теряет подписки, тёплый nonce сбрасывается, у сделки в
# воздухе на несколько секунд нет сторожа. Перезапуск наших служб решаем мы
# сами и деплоем, а не пакетный менеджер.
#
# 0 -- не перезапускать. Пакеты при этом ставятся как обычно.
$nrconf{override_rc} = {
    qr(^bloom-)            => 0,
    qr(^dbot-)             => 0,
    qr(^grpc-feed-probe)   => 0,
    qr(^actions\.runner\.) => 0,
};
