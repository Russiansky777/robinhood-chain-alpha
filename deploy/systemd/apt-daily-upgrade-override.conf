# Поставлено прогоном run_vps_autoupdate_guard_nl.yml по решению владельца 26.09
# (пункт 2 дневного плана): автообновления только в окно 03:00-04:00 UTC.
#
# ЗАЧЕМ. По умолчанию таймер бьёт в непредсказуемую минуту (случайная задержка
# до часа): 25.09 это было 06:18Z, 26.09 -- 04:53Z. Нам нужна известная минута,
# когда мы не торгуем.
[Timer]
OnCalendar=
OnCalendar=*-*-* __WINDOW__:00 UTC
RandomizedDelaySec=600
Persistent=false
