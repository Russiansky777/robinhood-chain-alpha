name: P5 LIVE -- bootstrap VPS Нидерланды (45.59.170.76)

# Владелец, 2026-09-03: релокация из-за geo-блока Lighter на США (см.
# docs/PROJECT_STATE.md, "P5 LIVE -- второй VPS (Нидерланды)"). Тот же
# SSH-ключ (extravm_dallas/VPS_SSH_KEY), тот же bootstrap-паттерн, что
# первый хост (run_vps_bootstrap.yml, 216.146.25.26) -- см. тот файл для
# подробного обоснования (интерактивная песочница не имеет TCP-доступа,
# ssh.service не sshd.service на Ubuntu 24.04, секреты только по SSH
# stdin). Держим оба хоста параллельно до отдельной команды владельца.
#
# ШАГ 7 -- КЛЮЧЕВОЕ ОТЛИЧИЕ от первого хоста: тестовый вызов Lighter API
# С НОВОГО IP (не создание ордера) -- проверка, снят ли geo-блок для
# этой юрисдикции. Выполняется НА САМОМ VPS (не на GH Actions runner'е)
# -- иначе тест ничего не докажет про IP нового хоста.
on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/sc1-pons-v2-launcher-efdbyt
    paths:
      - "data/p3_guard_cache/VPS_BOOTSTRAP_NL_REQUEST"

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: SSH key + known_hosts
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -e
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -T 10 45.59.170.76 >> ~/.ssh/known_hosts 2>/dev/null
          echo "SSH_OPTS=-i $HOME/.ssh/vps_key -o ConnectTimeout=15 -o BatchMode=yes -o StrictHostKeyChecking=accept-new" >> "$GITHUB_ENV"
          # Пункт 1 задачи -- alias vps-nl в ~/.ssh/config этого job'а
          # (для консистентности с запросом; сам раннер эфемерный, не
          # переживает job, реальная запись для владельца -- в
          # docs/PROJECT_STATE.md).
          cat >> ~/.ssh/config <<'EOF'
          Host vps-nl
              HostName 45.59.170.76
              User root
              IdentityFile ~/.ssh/vps_key
          EOF

      - name: 1-2. Подключение, идентификация хоста
        run: |
          ssh $SSH_OPTS root@45.59.170.76 '
            echo "=== hostname ==="; hostname
            echo "=== uptime ==="; uptime
            echo "=== os-release ==="; cat /etc/os-release | head -3
            echo "=== disk (до апдейта) ==="; df -h /
          '

      - name: 2. Обновление системы
        run: |
          ssh $SSH_OPTS root@45.59.170.76 '
            set -e
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get -y upgrade
            apt-get -y autoremove
          '

      - name: 3. ufw (22/tcp только) + fail2ban + отключение PasswordAuthentication
        run: |
          ssh $SSH_OPTS root@45.59.170.76 '
            set -e
            export DEBIAN_FRONTEND=noninteractive
            apt-get install -y ufw fail2ban

            ufw allow 22/tcp
            ufw default deny incoming
            ufw default allow outgoing
            ufw --force enable
            ufw status verbose

            systemctl enable --now fail2ban
            systemctl status fail2ban --no-pager | head -5

            sed -i "s/^#\?PasswordAuthentication .*/PasswordAuthentication no/" /etc/ssh/sshd_config
            grep -q "^PasswordAuthentication no" /etc/ssh/sshd_config
            # Тот же баг, что на Далласе -- Ubuntu 24.04: ssh.service, не sshd.service.
            systemctl reload ssh 2>/dev/null || systemctl reload sshd
          '

      - name: 3б. Проверка -- НОВОЕ соединение после смены sshd_config (не залочились)
        run: |
          ssh $SSH_OPTS root@45.59.170.76 'echo "новое соединение по ключу работает"'

      - name: 4-5. Пользователь bot (без sudo), зависимости, клон репозитория
        run: |
          ssh $SSH_OPTS root@45.59.170.76 '
            set -e
            export DEBIAN_FRONTEND=noninteractive
            apt-get install -y python3-venv python3-pip git

            id -u bot &>/dev/null || useradd -m -s /bin/bash bot
            id bot

            sudo -u bot git config --global --get user.name || sudo -u bot git config --global user.name "p5-live-bot"
            sudo -u bot git config --global --get user.email || sudo -u bot git config --global user.email "p5-live-bot@localhost"

            if [ -d /home/bot/robinhood-chain-alpha/.git ]; then
              sudo -u bot git -C /home/bot/robinhood-chain-alpha fetch origin claude/sc1-pons-v2-launcher-efdbyt
              sudo -u bot git -C /home/bot/robinhood-chain-alpha checkout claude/sc1-pons-v2-launcher-efdbyt
              sudo -u bot git -C /home/bot/robinhood-chain-alpha reset --hard origin/claude/sc1-pons-v2-launcher-efdbyt
            else
              sudo -u bot git clone --branch claude/sc1-pons-v2-launcher-efdbyt https://github.com/russiansky777/robinhood-chain-alpha.git /home/bot/robinhood-chain-alpha
            fi
            sudo -u bot git -C /home/bot/robinhood-chain-alpha log -1 --oneline

            sudo -u bot python3 -m venv /home/bot/robinhood-chain-alpha/venv
            sudo -u bot /home/bot/robinhood-chain-alpha/venv/bin/pip install -q --upgrade pip
            sudo -u bot /home/bot/robinhood-chain-alpha/venv/bin/pip install -q -r /home/bot/robinhood-chain-alpha/analysis/requirements.txt
            sudo -u bot /home/bot/robinhood-chain-alpha/venv/bin/pip install -q git+https://github.com/elliottech/lighter-python.git
          '

      - name: 6. Секреты -> /etc/bot/env (напрямую по SSH stdin, не через -c/echo)
        env:
          PRIVATE_KEY_NOX: ${{ secrets.PRIVATE_KEY_NOX }}
          LIGHTER_API_KEY_PUBLIC: ${{ secrets.LIGHTER_API_KEY_PUBLIC }}
          LIGHTER_API_KEY_PRIVATE: ${{ secrets.LIGHTER_API_KEY_PRIVATE }}
        run: |
          ssh $SSH_OPTS root@45.59.170.76 'mkdir -p /etc/bot && cat > /etc/bot/env && chmod 640 /etc/bot/env && chown root:bot /etc/bot/env && wc -l /etc/bot/env' <<EOF
          PRIVATE_KEY_NOX=$PRIVATE_KEY_NOX
          LIGHTER_API_KEY_PUBLIC=$LIGHTER_API_KEY_PUBLIC
          LIGHTER_API_KEY_PRIVATE=$LIGHTER_API_KEY_PRIVATE
          EOF

      - name: 7. systemd-юнит (установлен, НЕ включён -- p5_live_bot.py ещё не написан)
        run: |
          ssh $SSH_OPTS root@45.59.170.76 'cat > /etc/systemd/system/p5-live-bot.service' <<'EOF'
          [Unit]
          Description=P5 live hedged-LP bot (ETH/USDG)
          After=network-online.target
          Wants=network-online.target
          StartLimitIntervalSec=600
          StartLimitBurst=5

          [Service]
          Type=simple
          User=bot
          Group=bot
          WorkingDirectory=/home/bot/robinhood-chain-alpha
          EnvironmentFile=/etc/bot/env
          ExecStart=/home/bot/robinhood-chain-alpha/venv/bin/python /home/bot/robinhood-chain-alpha/analysis/p5_live_bot.py
          Restart=always
          RestartSec=10
          NoNewPrivileges=true

          [Install]
          WantedBy=multi-user.target
          EOF
          ssh $SSH_OPTS root@45.59.170.76 'systemctl daemon-reload && systemctl status p5-live-bot --no-pager || true'

      - name: 8. logrotate по размеру
        run: |
          ssh $SSH_OPTS root@45.59.170.76 'mkdir -p /home/bot/robinhood-chain-alpha/logs && chown bot:bot /home/bot/robinhood-chain-alpha/logs && cat > /etc/logrotate.d/p5-live-bot' <<'EOF'
          /home/bot/robinhood-chain-alpha/logs/*.log {
              size 200M
              rotate 5
              compress
              delaycompress
              missingok
              notifempty
              copytruncate
              su bot bot
          }
          EOF
          ssh $SSH_OPTS root@45.59.170.76 'logrotate -d /etc/logrotate.d/p5-live-bot 2>&1 | tail -20'

      - name: 9. Свободное место на диске
        run: |
          ssh $SSH_OPTS root@45.59.170.76 'echo "=== disk (после всей настройки) ==="; df -h /'

      - name: "10. ТЕСТ гео-блока с нового IP: (a) Step 0 [публичный account/margin read] + (b) signcheck [SignerClient, без ордера]"
        run: |
          echo "=== (a) p5_live_step0.py -- ПУБЛИЧНЫЙ эндпоинт (без подписи), тот же тип вызова весь день работал и с US IP ==="
          ssh $SSH_OPTS root@45.59.170.76 '
            cd /home/bot/robinhood-chain-alpha
            sudo -u bot bash -c "set -a; source /etc/bot/env; set +a; ./venv/bin/python analysis/p5_live_step0.py"
          '
          echo ""
          echo "=== (b) p5_live_lighter_signcheck.py -- SignerClient (подписанный запрос, НЕ ордер) -- ближе к торговому пути ==="
          ssh $SSH_OPTS root@45.59.170.76 '
            cd /home/bot/robinhood-chain-alpha
            sudo -u bot bash -c "set -a; source /etc/bot/env; set +a; ./venv/bin/python analysis/p5_live_lighter_signcheck.py"
          '

      - name: Забрать результаты с VPS для коммита
        if: always()
        run: |
          ssh $SSH_OPTS root@45.59.170.76 'cat /home/bot/robinhood-chain-alpha/data/p3_guard_cache/p5_live_step0_result.json' > /tmp/step0_nl.json || true
          ssh $SSH_OPTS root@45.59.170.76 'cat /home/bot/robinhood-chain-alpha/data/p3_guard_cache/p5_live_lighter_signcheck_result.json' > /tmp/signcheck_nl.json || true
          mkdir -p data/p3_guard_cache
          [ -s /tmp/step0_nl.json ] && cp /tmp/step0_nl.json data/p3_guard_cache/p5_live_step0_result_NL.json
          [ -s /tmp/signcheck_nl.json ] && cp /tmp/signcheck_nl.json data/p3_guard_cache/p5_live_lighter_signcheck_result_NL.json

      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/p3_guard_cache/p5_live_step0_result_NL.json data/p3_guard_cache/p5_live_lighter_signcheck_result_NL.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "P5 LIVE: bootstrap VPS Нидерланды -- результаты Step 0 + signcheck с нового IP [automated]"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected, попытка $i/5 -- git pull --rebase и повтор"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep 3
          done
          echo "не удалось запушить после 5 попыток" >&2
          exit 1
