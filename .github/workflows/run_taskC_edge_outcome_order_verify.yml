name: "Задача C -- проверка порядка исходов перед доверием к спреду (только чтение)"

on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/sc1-pons-v2-launcher-efdbyt
    paths:
      - "data/p3_guard_cache/TASKC_EDGE_OUTCOME_ORDER_VERIFY_REQUEST"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r analysis/requirements.txt
      - name: "Проверка порядка исходов (только чтение)"
        run: python -u analysis/taskC_edge_outcome_order_verify.py
      - name: Commit results
        if: always()
        run: |
          git rm -f --ignore-unmatch data/p3_guard_cache/TASKC_EDGE_OUTCOME_ORDER_VERIFY_REQUEST
          [ -e data/p3_guard_cache/taskC_edge_outcome_order_verify_result.json ] && git add data/p3_guard_cache/taskC_edge_outcome_order_verify_result.json
          git diff --cached --quiet && exit 0
          git commit -m "Задача C: проверка порядка исходов, результат [automated]"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected, попытка $i/5 -- git pull --rebase и повтор"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep 3
          done
          echo "не удалось запушить после 5 попыток" >&2
          exit 1
