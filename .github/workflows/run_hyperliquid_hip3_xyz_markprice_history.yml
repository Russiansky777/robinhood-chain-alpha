name: "Спящие референсы -- Hyperliquid HIP-3 xyz-dex, часовая история mark price + глубина книги (0 кредитов)"

on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/sc1-pons-v2-launcher-efdbyt
    paths:
      - "data/p3_guard_cache/HYPERLIQUID_HIP3_XYZ_MARKPRICE_HISTORY_REQUEST"

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r analysis/requirements.txt
      - name: "Часовая история mark price (xyz-dex, пересечение с Lighter + бонусные активы) + round-trip (только чтение, 0 кредитов)"
        run: python -u analysis/hyperliquid_hip3_xyz_markprice_history.py
      - name: Commit results
        if: always()
        run: |
          git rm -f --ignore-unmatch data/p3_guard_cache/HYPERLIQUID_HIP3_XYZ_MARKPRICE_HISTORY_REQUEST
          [ -e data/p3_guard_cache/hyperliquid_hip3_xyz_markprice_history_result.json ] && git add data/p3_guard_cache/hyperliquid_hip3_xyz_markprice_history_result.json
          [ -d data/sleeping_refs_cache ] && git add data/sleeping_refs_cache
          git diff --cached --quiet && exit 0
          git commit -m "Спящие референсы: Hyperliquid HIP-3 xyz-dex mark price история + глубина книги, результат [automated]"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected, попытка $i/5 -- git pull --rebase и повтор"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep 3
          done
          echo "не удалось запушить после 5 попыток" >&2
          exit 1
