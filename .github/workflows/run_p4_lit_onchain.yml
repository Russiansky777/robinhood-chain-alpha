name: B -- LIT onchain distribution search (Ethereum mainnet Transfer logs) + missing docs pages

# Только чтение: публичный Ethereum RPC (без ключа) + docs.lighter.xyz.
# Ключ не используется, транзакций нет.
on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/sc1-pons-v2-launcher-efdbyt
    paths:
      - "data/p3_guard_cache/P4_LIT_ONCHAIN_REQUEST"

jobs:
  recon:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests pycryptodome

      - name: LIT onchain distribution search + missing docs
        run: python analysis/p4_lit_onchain.py

      - name: Commit results
        if: always()
        run: |
          [ -e data/p3_guard_cache/p4_lit_onchain_result.json ] && git add data/p3_guard_cache/p4_lit_onchain_result.json
          git diff --cached --quiet && exit 0
          git commit -m "B: LIT onchain distribution search (Ethereum mainnet) + missing docs pages [automated]"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected, попытка $i/5 -- git pull --rebase и повтор"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep 3
          done
          echo "не удалось запушить после 5 попыток" >&2
          exit 1
