name: "Fomo -- короткие горизонты, волна, реалистичный вход/выход (без Dune)"

on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/nifty-sagan-r0polg
    paths:
      - "data/p3_guard_cache/FOMO_SHORT_HORIZON_WAVE_AND_ENTRY_REQUEST"

jobs:
  short_horizon:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r analysis/requirements.txt
      - name: "реальное время блока + волна + кривая + вход A/Б x выход"
        env:
          ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
          ALCHEMY_ROBINHOOD_RPC_URL: ${{ secrets.ALCHEMY_ROBINHOOD_RPC_URL }}
        run: python -u analysis/fomo_short_horizon_wave_and_entry.py
      - name: Commit results
        if: always()
        run: |
          git rm -f --ignore-unmatch data/p3_guard_cache/FOMO_SHORT_HORIZON_WAVE_AND_ENTRY_REQUEST
          [ -e data/fomo_short_horizon_result.json ] && git add data/fomo_short_horizon_result.json
          [ -e data/fomo_resolved_pool_keys_cache.json ] && git add data/fomo_resolved_pool_keys_cache.json
          git diff --cached --quiet && exit 0
          git commit -m "Fomo (без Dune): короткие горизонты/волна/вход A-Б, результат [automated]"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected, попытка $i/5 -- git pull --rebase и повтор"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep 3
          done
          echo "не удалось запушить после 5 попыток" >&2
          exit 1
