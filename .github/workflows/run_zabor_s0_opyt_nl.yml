name: "Забор S+0 и ГОНКА отправителей на NL-хосте (кошелёк LIVE_TESTS)"

# ЗАЧЕМ. Проверить на цепи то, что офлайн проверить нечем: садится ли покупка,
# подписанная blockhash с lastValidBlockHeight = H-1 / H / H+1, где H -- высота
# блока источника. В каждом раунде уходит ОДНА транзакция, сдвиг (-1 / 0 / +1)
# идёт по кругу по раундам: платный путь Helius на три сразу отвечает 429, а
# замеру одновременность не нужна -- у каждой отправки в отчёте своя высота в
# момент отправки и свой lastValid. Модуль -- Code-3,
# analysis/c2_zabor_s0_opyt.py (самопроверка 80/80 без сети).
#
# ЧТО ЭТОТ ПРОГОН ТРАТИТ. Настоящие SOL с кошелька опыта
# D3JuFoSXuWEMUUdCtoB5NYWnN87vjJSHtDP5rTD6qnph -- ОДНА отправка на раунд:
# комиссия плюс ЧАЕВЫЕ по минимуму отправителя (без чаевых платный путь Helius
# отказывает: -32602, минимум 200 000 лампортов). В режиме gonka на раунд уходит
# по ОДНОЙ отправке КАЖДОМУ отправителю, то есть раунд стоит столько же раз.
# Потолок расхода (0.07 SOL -- слово владельца в ночь 30.09->01.10) и остаток на
# кошельке не меньше 0.001 SOL модуль проверяет ЗАРАНЕЕ и отказывается начинать,
# если не влезает; он же отказывает, если кошелёк не тот. Торгового кошелька
# здесь нет вовсе.
#
# СЕКРЕТ. LIVE_TESTS уходит на хост ФАЙЛОМ 600 и оттуда в ОКРУЖЕНИЕ. В argv он не
# попадает ни разу (в argv его видно в `ps` любому на хосте), в журнал -- тоже:
# отдельный шаг проверяет, что его нет в захваченном выводе, и роняет прогон, если
# есть. На бегунке значение кладёт `printf` -- это ВСТРОЕННАЯ команда bash, она не
# порождает процесса и в `ps` не видна.
#
# ДВОЙНЫХ КАВЫЧЕК ВНУТРИ ssh ЗДЕСЬ НЕТ НИ ОДНОЙ. 30.09 они дважды ломали прогоны:
# внутри них подставляется и оболочка бегунка, и удалённая. Вся логика уехала в
# deploy/zabor/*.sh и приезжает по stdin (`ssh ... bash -s < файл`), а два
# оставшихся коротких вызова обёрнуты ОДИНАРНЫМИ кавычками, где подстановки нет.
# Скрипты проверяются `bash -n` ДО первого ssh.
on:
  workflow_dispatch:
    inputs:
      otpravitel:
        description: "отправитель"
        required: true
        type: choice
        default: helius
        options: [helius, astralane, blockrazor, jito, nozomi, zeroslot, triton]
      raundov:
        description: "раундов (по ОДНОЙ отправке в каждом; сдвиг -1/0/+1 по кругу)"
        required: false
        default: "15"
      rezhim:
        description: "'kolco' -- только кольцо, НИЧЕГО не отправлять; 'opyt' -- отправки одним отправителем; 'gonka' -- по одной КАЖДОМУ отправителю"
        required: false
        type: choice
        default: kolco
        options: [kolco, opyt, gonka]
      otpraviteli:
        description: "gonka: отправители через запятую (triton как ОТПРАВИТЕЛЬ у нас не настроен -- у него нет точки входа отправки)"
        required: false
        default: "helius,astralane"
      chaevye:
        description: "ПРОБА: чаевые в лампортах вместо минимума из реестра (0 -- из реестра). Потолок пробы сторожит сам модуль"
        required: false
        default: "0"
      podtverzhdenie:
        description: "для rezhim=opyt и rezhim=gonka впишите otpravlyat -- иначе отправок не будет"
        required: false
        default: ""

concurrency:
  group: zabor-s0-opyt
  cancel-in-progress: false

env:
  TARGET_HOST: 127.0.0.1
  RABOTA: /tmp/zabor_s0_opyt
  VETKA: claude/nifty-sagan-r0polg
  OUT_JSON: data/zabor_s0_opyt.json

jobs:
  opyt:
    runs-on: ${{ fromJSON('["self-hosted","nl-host"]') }}
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/nifty-sagan-r0polg

      - name: "Проверки ДО хоста: синтаксис скриптов и самопроверки"
        run: |
          set -e
          # ЧУЖОЙ ОТЧЁТ УБИРАЕТСЯ ЗДЕСЬ, В ПЕРВОМ ЖЕ ШАГЕ, И ВОТ ПОЧЕМУ ЭТОГО
          # НЕ ХВАТИЛО В ШАГЕ ОПЫТА. То же `rm -f` стоит ниже, внутри шага
          # "Опыт на хосте", и прошлый раз (30.09 15:55Z) этого хватило. Но
          # если прогон падает ДО этого шага -- например на разборе входа, --
          # шаг опыта ПРОПУСКАЕТСЯ, файл прошлого прогона остаётся, а шаг
          # "Страница и отчёт" стоит с if: always() и копирует его в отчёт.
          # ЖИВОЙ СЛУЧАЙ 10.10 15:30Z: прогон kolco отказал на числе раундов
          # (30 при пределе 20), опыт не шёл ВОВСЕ -- и в data/ уехал сырой
          # вывод прогона 30.09, затёрший исправленный свод (победитель по
          # ПАРНОМУ сравнению astralane 21:4 сменился обратно на helius "по
          # медианам", вместе с предупреждением о расхождении). Отчёт, который
          # никто не измерял, хуже отсутствия: его читают как итог.
          rm -f /tmp/zabor_out.json
          for f in deploy/zabor/na_hoste.sh deploy/zabor/zabrat.sh deploy/zabor/ubrat.sh; do
            bash -n "$f"
            echo "bash -n ok: $f"
          done
          python3 -m py_compile analysis/c2_zabor_s0_opyt.py \
            analysis/c2_zabor_gonka.py deploy/checks/zabor_s0_stranica.py
          # Страница -- чистая стандартная библиотека, её самопроверку гоняем прямо тут.
          python3 deploy/checks/zabor_s0_stranica.py --self-test | tail -2
          # Самопроверка САМОГО опыта идёт НА ХОСТЕ и на venv-питоне (deploy/zabor/
          # na_hoste.sh): ей нужен solders, а на бегунке его может не быть, и
          # проверять надо тот интерпретатор, который и будет считать.

      - name: "Вход разобран и подтверждён"
        env:
          OTPRAVITEL: ${{ inputs.otpravitel }}
          OTPRAVITELI: ${{ inputs.otpraviteli }}
          RAUNDOV: ${{ inputs.raundov }}
          REZHIM: ${{ inputs.rezhim }}
          PODTV: ${{ inputs.podtverzhdenie }}
        run: |
          set -e
          case "$OTPRAVITEL" in
            helius|astralane|blockrazor|jito|nozomi|zeroslot|triton) ;;
            *) echo "SBOY: otpravitel: $OTPRAVITEL"; exit 1;;
          esac
          if [ "$REZHIM" = gonka ]; then
            [ -n "$OTPRAVITELI" ] || { echo "SBOY: gonka bez spiska otpravitelej"; exit 1; }
            for O in $(echo "$OTPRAVITELI" | tr ',' ' '); do
              case "$O" in
                helius|astralane|blockrazor|jito|nozomi|zeroslot|triton) ;;
                *) echo "SBOY: neizvestnyj otpravitel v spiske: $O"; exit 1;;
              esac
            done
          fi
          case "$RAUNDOV" in
            ''|*[!0-9]*) echo "SBOY: raundov ne chislo: $RAUNDOV"; exit 1;;
          esac
          # GRANICA RAUNDOV RAZNAJA: u gonki na raund po odnoj otpravke KAZHDOMU
          # otpravitelju, i vladelec prosil 25. Dengi storozhit potolok rashoda v
          # module (schitaetsja DO pervoj otpravki), a eta granica -- ot promaha.
          PREDEL=20
          [ "$REZHIM" = gonka ] && PREDEL=30
          if [ "$RAUNDOV" -lt 1 ] || [ "$RAUNDOV" -gt "$PREDEL" ]; then
            echo "SBOY: raundov vne 1..$PREDEL pri rezhime $REZHIM"; exit 1
          fi
          # ОТПРАВКИ -- ТОЛЬКО ПО ЯВНОМУ СЛОВУ. Это живые SOL; промах по кнопке
          # не должен стоить денег. Гонка тратит БОЛЬШЕ опыта, поэтому слово
          # нужно и ей.
          if { [ "$REZHIM" = opyt ] || [ "$REZHIM" = gonka ]; } \
             && [ "$PODTV" != otpravlyat ]; then
            echo "SBOY: rezhim=$REZHIM trebuet podtverzhdenie=otpravlyat"
            exit 1
          fi
          echo "rezhim=$REZHIM otpravitel=$OTPRAVITEL raundov=$RAUNDOV otpraviteli=${OTPRAVITELI:-net}"

      - name: "SSH key"
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -e
          [ -n "$VPS_SSH_KEY" ] || { echo "SBOY: VPS_SSH_KEY ne zadan"; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          echo "SSH_OPTS=-i $HOME/.ssh/vps_key -o ConnectTimeout=15 -o BatchMode=yes -o StrictHostKeyChecking=accept-new" >> "$GITHUB_ENV"

      - name: "Доставка на хост: каталог, параметры, скрипт опыта"
        env:
          OTPRAVITEL: ${{ inputs.otpravitel }}
          OTPRAVITELI: ${{ inputs.otpraviteli }}
          RAUNDOV: ${{ inputs.raundov }}
          REZHIM: ${{ inputs.rezhim }}
          CHAEVYE: ${{ inputs.chaevye }}
        run: |
          set -e
          set -o pipefail
          # ЧАЕВЫЕ ПРОБЫ -- ТОЛЬКО ЦЕЛОЕ ЧИСЛО. Это значение идёт в деньги, и
          # мусор в нём должен быть отказом здесь, а не на хосте.
          case "${CHAEVYE:-0}" in
            ''|*[!0-9]*) echo "SBOY: chaevye ne celoe chislo: $CHAEVYE"; exit 1;;
          esac
          ssh -n $SSH_OPTS root@$TARGET_HOST 'rm -rf /tmp/zabor_s0_opyt; install -d -m 700 /tmp/zabor_s0_opyt'
          # Параметры отдельным файлом: тогда в команде ssh нечего подставлять.
          printf 'OTPRAVITEL=%s\nRAUNDOV=%s\nREZHIM=%s\nOTPRAVITELI=%s\nCHAEVYE=%s\n' \
            "$OTPRAVITEL" "$RAUNDOV" "$REZHIM" "$OTPRAVITELI" "${CHAEVYE:-0}" > /tmp/zabor_params
          ssh $SSH_OPTS root@$TARGET_HOST 'umask 077; cat > /tmp/zabor_s0_opyt/params' < /tmp/zabor_params
          ssh $SSH_OPTS root@$TARGET_HOST 'umask 077; cat > /tmp/zabor_s0_opyt/c2_zabor_s0_opyt.py' < analysis/c2_zabor_s0_opyt.py
          # МОДУЛЬ ГОНКИ ЕДЕТ ВСЕГДА, а не только в режиме gonka: лишний файл
          # безвреден, а забытая доставка стоила бы прогона на живых SOL.
          ssh $SSH_OPTS root@$TARGET_HOST 'umask 077; cat > /tmp/zabor_s0_opyt/c2_zabor_gonka.py' < analysis/c2_zabor_gonka.py
          ssh -n $SSH_OPTS root@$TARGET_HOST 'ls -la /tmp/zabor_s0_opyt'
          rm -f /tmp/zabor_params

      - name: "Секрет LIVE_TESTS на хост файлом 600 (не в argv, не в лог)"
        if: ${{ inputs.rezhim == 'opyt' || inputs.rezhim == 'gonka' }}
        env:
          LIVE_TESTS: ${{ secrets.LIVE_TESTS }}
        run: |
          set -e
          [ -n "$LIVE_TESTS" ] || { echo "SBOY: sekret LIVE_TESTS ne zadan"; exit 1; }
          # printf -- встроенная команда bash: значение не попадает ни в ps, ни в
          # argv отдельного процесса. Образец для поиска в журнале -- тем же способом.
          umask 077
          printf '%s' "$LIVE_TESTS" > /tmp/zabor_kljuch
          printf '%s' "$LIVE_TESTS" > /tmp/zabor_obrazec
          ssh $SSH_OPTS root@$TARGET_HOST 'umask 077; cat > /tmp/zabor_s0_opyt/kljuch' < /tmp/zabor_kljuch
          shred -u /tmp/zabor_kljuch 2>/dev/null || rm -f /tmp/zabor_kljuch
          # Без пробелов в формате -- тогда и одинарных кавычек хватит без двойных.
          ssh -n $SSH_OPTS root@$TARGET_HOST 'stat -c %a /tmp/zabor_s0_opyt/kljuch; ls -l /tmp/zabor_s0_opyt/kljuch'

      - name: "Опыт на хосте"
        id: opyt
        run: |
          set -e
          set -o pipefail
          # OTCHJOT PROSHLOGO PROGONA UBIRAETSJA DO ZAPUSKA. Pri set -o pipefail
          # padenie na_hoste.sh obryvaet shag, i zabrat.sh NE zapuskaetsja -- a
          # /tmp/zabor_out.json na begunke ostajotsja OT PROSHLOGO PROGONA.
          # Imenno tak 30.09 15:55Z progon opyt upal, a stranica sobralas iz
          # otchjota kolco: bajt v bajt ta zhe, 861 bajt, s zagolovkom "rezhim
          # kolco". Takoj otchjot huzhe otsutstvija -- ego prochli by kak itog
          # opyta. Teper upavshij progon pokazat chuzhie chisla ne mozhet.
          rm -f /tmp/zabor_out.json
          # OTCHJOT ZABIRAETSJA VSEGDA, A NE TOLKO PRI USPEHE.
          # ZACHEM. Ranshe zabrat.sh stojal posle na_hoste.sh pod set -e: opyt,
          # zakonchivshijsja OTKAZOM (kod 2), obryval shag, i otchjot ostavalsja
          # LEZHAT NA HOSTE, a na begunok ne popadal vovse. Sledujushchij shag
          # govoril "otchyota net -- stranicu ne pishem", i prichina otkaza byla
          # vidna tolko v hvoste zhurnala shaga. Tak poterjany otchjoty trjoh
          # progonov 30.09 (16:26Z, 17:02Z astralane, 17:08Z helius) -- a imenno
          # v nih i lezhat chisla "ne ushlo i pochemu". Teper kod opyta
          # zapominaetsja, otchjot zabiraetsja, i tolko potom shag padaet.
          set +e
          ssh $SSH_OPTS root@$TARGET_HOST bash -s < deploy/zabor/na_hoste.sh 2>&1 | tee /tmp/zabor_log.txt
          KOD_OPYTA=${PIPESTATUS[0]}
          set -e
          ssh $SSH_OPTS root@$TARGET_HOST bash -s < deploy/zabor/zabrat.sh > /tmp/zabor_out.json || true
          if [ -s /tmp/zabor_out.json ]; then
            echo "otchjot zabran s hosta: $(wc -c < /tmp/zabor_out.json) bajt"
          else
            echo "otchjota na hoste net -- zabirat nechego"
          fi
          echo "kod opyta: $KOD_OPYTA"
          exit "$KOD_OPYTA"

      - name: "Если хост отказал -- показать конец его журнала"
        if: failure()
        run: |
          set -e
          # ZACHEM. Prichina otkaza na hoste ostavalas tolko v zhurnale shaga, i
          # ejo prihodilos dobyvat hvostami zadnim chislom. Teper progon sam
          # pokazyvaet konec /tmp/zabor_log.txt -- sekret v njom uzhe proveren
          # otdelnym shagom, a pri padenii do nego zhurnal vsjo ravno nuzhen.
          if [ -s /tmp/zabor_log.txt ]; then
            echo "--- konec zhurnala hosta (40 strok) ---"
            tail -40 /tmp/zabor_log.txt
          else
            echo "zhurnala hosta net ili on pust -- otkaz sluchilsja do zapuska"
          fi

      - name: "Секрета в журнале нет"
        if: ${{ always() && (inputs.rezhim == 'opyt' || inputs.rezhim == 'gonka') }}
        run: |
          set -e
          if [ -s /tmp/zabor_obrazec ] && [ -s /tmp/zabor_log.txt ]; then
            if grep -q -F -f /tmp/zabor_obrazec /tmp/zabor_log.txt; then
              echo "SBOY: sekret popal v zhurnal progona -- zhurnal udalyon"
              : > /tmp/zabor_log.txt
              shred -u /tmp/zabor_obrazec 2>/dev/null || rm -f /tmp/zabor_obrazec
              exit 1
            fi
            echo "sekreta v zhurnale net"
          fi
          shred -u /tmp/zabor_obrazec 2>/dev/null || rm -f /tmp/zabor_obrazec

      - name: "Убрать за собой на хосте"
        if: always()
        run: |
          set -e
          ssh $SSH_OPTS root@$TARGET_HOST bash -s < deploy/zabor/ubrat.sh || true

      - name: "Страница и отчёт"
        if: always()
        env:
          REZHIM: ${{ inputs.rezhim }}
        run: |
          set -e
          if ! python3 -c "import json,sys; json.load(open('/tmp/zabor_out.json'))" 2>/dev/null; then
            echo "otchyota net ili on ne json -- stranicu ne pishem"
            exit 0
          fi
          # КОЛЬЦО -- СВОЙ ФАЙЛ, А НЕ ФАЙЛ ОПЫТА. Кольцо НИЧЕГО не отправляет:
          # это проверка оснастки и остатка, а не замер. Прежде оно писало в
          # тот же data/zabor_s0_opyt.json и затирало результаты настоящих
          # прогонов -- то есть замер, стоивший денег, пропадал от бесплатной
          # проверки.
          if [ "$REZHIM" = kolco ]; then
            cp /tmp/zabor_out.json data/zabor_s0_kolco.json
            echo "rezhim kolco: otchyot v data/zabor_s0_kolco.json, fajl opyta ne tronut"
            exit 0
          fi
          cp /tmp/zabor_out.json "$OUT_JSON"
          python3 deploy/checks/zabor_s0_stranica.py --otchet /tmp/zabor_out.json --katalog docs
          ls -la docs/zabor_s0_opyt_*.md | tail -3

      - name: "Коммит"
        if: always()
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # ТОЛЬКО СВОИ ФАЙЛЫ. `git add -A data` на хосте утащил бы в коммит
          # чужие изменения состояния, оказавшиеся в дереве в этот момент.
          git add docs/zabor_s0_opyt_*.md 2>/dev/null || true
          [ -f "$OUT_JSON" ] && git add "$OUT_JSON"
          [ -f data/zabor_s0_kolco.json ] && git add data/zabor_s0_kolco.json
          git diff --cached --quiet && { echo "nechego kommitit"; exit 0; }
          git commit -m "Opyt zabora S+0: tablica progona [automated]"
          for i in 1 2 3 4 5; do
            git push origin HEAD:$VETKA && exit 0
            git pull --rebase -X theirs origin $VETKA
            sleep 3
          done
          exit 1
