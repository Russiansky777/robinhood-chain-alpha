name: "Задача 4 (упрощённая) -- Шаг 1: есть ли вообще расхождение >1%"

# Владелец, 2026-09-10: упрощённый 3-шаговый дизайн, один прогон -- одно
# решение "дальше/стоп". Шаг 1: одна пара (хвостовой пул с прошлого
# Шага 1b) против самого крупного пула той же пары на Base/Arbitrum,
# без фильтра на wash-trading, один день. Да -- в Шаг 2, нет -- закрыто.

on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/sc1-pons-v2-launcher-efdbyt
    paths:
      - "data/p3_guard_cache/TASK4_STEP1_REQUEST"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r analysis/requirements.txt
      - name: "Задача 4, Шаг 1 -- есть ли расхождение >1%"
        env:
          DUNE_API_KEY: ${{ secrets.DUNE_API_KEY_MOZILA }}
          CREDIT_GUARD_NAMESPACE: task4_arb_slow_mozila
          CREDIT_GUARD_FILE: data/credits_spent_mozila.json
          OWNER_CONFIRMED_DEX_TRADES_ROBINHOOD: "yes"
        run: python -u analysis/task4_step1_divergence_check.py
      - name: Commit results
        if: always()
        run: |
          git rm -f --ignore-unmatch data/p3_guard_cache/TASK4_STEP1_REQUEST
          [ -e data/p3_guard_cache/task4_step1_result.json ] && git add data/p3_guard_cache/task4_step1_result.json
          [ -e data/credits_spent_mozila.json ] && git add data/credits_spent_mozila.json
          [ -d data/task4_arb_slow_mozila_cache ] && git add data/task4_arb_slow_mozila_cache/
          git diff --cached --quiet && exit 0
          git commit -m "Задача 4, Шаг 1: результат [automated]"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected, попытка $i/5 -- git pull --rebase и повтор"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep 3
          done
          echo "не удалось запушить после 5 попыток" >&2
          exit 1
