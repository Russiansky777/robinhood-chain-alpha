name: "Solana buyer_200 -- сбор рейтингов Fomo (4 окна) + пересечение 7д/30д"

# Только чтение -- GET к Fomo API. Не трогает основной прогон 300 покупок.

on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/nifty-sagan-r0polg
    paths:
      - "data/p3_guard_cache/SOLANA_FOMO_LEADERBOARD_COLLECT_REQUEST"

jobs:
  solana_fomo_leaderboard_collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests
      - name: "Сбор рейтингов Fomo"
        env:
          FOMO_API_KEY: ${{ secrets.FOMO_API_KEY }}
        run: python -u analysis/solana_fomo_leaderboard_collect.py
      - name: Commit results
        if: always()
        run: |
          git rm -f --ignore-unmatch data/p3_guard_cache/SOLANA_FOMO_LEADERBOARD_COLLECT_REQUEST
          [ -e data/fomo_leaderboard_raw.json ] && git add data/fomo_leaderboard_raw.json
          [ -e data/fomo_leaderboard_candidates.json ] && git add data/fomo_leaderboard_candidates.json
          [ -e data/credits_spent_fomo.json ] && git add data/credits_spent_fomo.json
          git diff --cached --quiet && exit 0
          git commit -m "Solana buyer_200: сырые рейтинги Fomo + пересечение 7д/30д [automated]"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected, попытка $i/5 -- git pull --rebase и повтор"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep 3
          done
          echo "не удалось запушить после 5 попыток" >&2
          exit 1
