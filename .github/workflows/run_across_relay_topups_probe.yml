name: Across/Relay -- поиск двух непроверенных пополнений (только чтение)

on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/sc1-pons-v2-launcher-efdbyt
    paths:
      - "data/p3_guard_cache/ACROSS_RELAY_TOPUPS_PROBE_REQUEST"

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r analysis/requirements.txt

      - name: Реальный поиск пополнений (alchemy_getAssetTransfers + eth_getLogs)
        env:
          ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
        run: python -u analysis/across_relay_topups_probe.py

      - name: Commit results
        if: always()
        run: |
          [ -e data/p3_guard_cache/across_relay_topups_probe_result.json ] && git add data/p3_guard_cache/across_relay_topups_probe_result.json
          git diff --cached --quiet && exit 0
          git commit -m "Across/Relay: поиск пополнений (asset transfers + eth_getLogs) [automated]"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected, попытка $i/5 -- git pull --rebase и повтор"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep 3
          done
          echo "не удалось запушить после 5 попыток" >&2
          exit 1
