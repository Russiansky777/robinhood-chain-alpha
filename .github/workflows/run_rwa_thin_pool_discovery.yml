name: "RWA сток-токены -- реальное обнаружение тонких пулов (Backed/Dinari/Ondo/xStocks), 0 кредитов"

on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/sc1-pons-v2-launcher-efdbyt
    paths:
      - "data/p3_guard_cache/RWA_THIN_POOL_DISCOVERY_REQUEST"

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r analysis/requirements.txt
      - name: "Реальное обнаружение тонких пулов токенизированных акций (только чтение GeckoTerminal, 0 кредитов)"
        run: python -u analysis/rwa_tokenized_stocks_thin_pool_discovery.py
      - name: Commit results
        if: always()
        run: |
          git rm -f --ignore-unmatch data/p3_guard_cache/RWA_THIN_POOL_DISCOVERY_REQUEST
          [ -e data/p3_guard_cache/rwa_tokenized_stocks_thin_pool_discovery_result.json ] && git add data/p3_guard_cache/rwa_tokenized_stocks_thin_pool_discovery_result.json
          git diff --cached --quiet && exit 0
          git commit -m "RWA сток-токены: обнаружение тонких пулов, результат [automated]"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected, попытка $i/5 -- git pull --rebase и повтор"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep 3
          done
          echo "не удалось запушить после 5 попыток" >&2
          exit 1
