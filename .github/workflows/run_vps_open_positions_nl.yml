name: "Какие позиции считаются открытыми (только чтение)"

# ЗАЧЕМ. 26.09 в 10:38Z гейт деплоя сторожа отказался перезапускать службу:
# "открытых позиций 3 (полосы 1)". В признаке жизни при этом открытых 0 --
# значит это записи, которые полоса считает зависшими. Прежде чем что-то
# трогать, надо знать, ЧТО это за три позиции.
#
# Только чтение журнала позиций на хосте. Ничего не продаёт и не меняет.
on:
  workflow_dispatch: {}

concurrency:
  group: open-positions-nl
  cancel-in-progress: false

env:
  CODE_DIR: /home/bot/bloom_executor
  ENV_DIR: /etc/bloom-executor
  TARGET_HOST: 127.0.0.1

jobs:
  look:
    runs-on: ${{ fromJSON('["self-hosted","nl-host"]') }}
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/nifty-sagan-r0polg

      - name: "SSH key"
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -e
          [ -n "$VPS_SSH_KEY" ] || { echo "СБОЙ: VPS_SSH_KEY не задан"; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          echo "SSH_OPTS=-i $HOME/.ssh/vps_key -o ConnectTimeout=15 -o BatchMode=yes -o StrictHostKeyChecking=accept-new" >> "$GITHUB_ENV"

      - name: "Разбор открытых позиций"
        run: |
          set -e
          set -o pipefail
          ssh $SSH_OPTS root@$TARGET_HOST "cat > /tmp/otkrytye_pozicii.py" < deploy/checks/otkrytye_pozicii.py
          ssh -n $SSH_OPTS root@$TARGET_HOST "
            set -a; . $ENV_DIR/env; set +a
            cd $CODE_DIR
            sudo -n -u bot env BLOOM_STATE_DIR=\$BLOOM_STATE_DIR PYTHONPATH=$CODE_DIR \
              /home/bot/robinhood-chain-alpha/venv/bin/python /tmp/otkrytye_pozicii.py
            rm -f /tmp/otkrytye_pozicii.py" | tee data/otkrytye_pozicii.json

      - name: "Коммит"
        if: always()
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -f data/otkrytye_pozicii.json ] && git add data/otkrytye_pozicii.json
          git diff --cached --quiet && { echo "нечего коммитить"; exit 0; }
          git commit -m "Otkrytye pozicii: razbor [automated]"
          for i in 1 2 3 4 5; do
            git push origin HEAD:claude/nifty-sagan-r0polg && exit 0
            git pull --rebase -X theirs origin claude/nifty-sagan-r0polg
            sleep 3
          done
          exit 1
