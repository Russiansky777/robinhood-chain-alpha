name: "P5 -- dry-run закрытия (ETH-шорт + LP 1000756, ничего не отправляется)"

on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/sc1-pons-v2-launcher-efdbyt
    paths:
      - "data/p3_guard_cache/P5_CLOSE_DRY_RUN_REQUEST"

jobs:
  dry_run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r analysis/requirements.txt
      - name: Dry-run закрытия P5 -- реальные числа, ничего не отправлено
        run: python -u analysis/p5_close_dry_run.py
      - name: Commit results
        if: always()
        run: |
          [ -e data/p3_guard_cache/p5_close_dry_run_result.json ] && git add data/p3_guard_cache/p5_close_dry_run_result.json
          git diff --cached --quiet && exit 0
          git commit -m "P5: dry-run закрытия -- реальные числа, ничего не отправлено [automated]"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected, попытка $i/5 -- git pull --rebase и повтор"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep 3
          done
          echo "не удалось запушить после 5 попыток" >&2
          exit 1
