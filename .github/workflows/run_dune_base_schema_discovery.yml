name: "Dune (Mozila) -- разведка схемы Base (Uniswap v3 / Aerodrome) для wash_share"

on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/sc1-pons-v2-launcher-efdbyt
    paths:
      - "data/p3_guard_cache/DUNE_BASE_SCHEMA_DISCOVERY_REQUEST"

jobs:
  discover:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r analysis/requirements.txt
      - name: Разведка схемы Base (LIMIT 100)
        env:
          DUNE_API_KEY: ${{ secrets.DUNE_API_KEY_MOZILA }}
        run: python -u analysis/dune_base_schema_discovery.py
      - name: Commit results
        if: always()
        run: |
          [ -e data/p3_guard_cache/dune_base_schema_discovery_result.json ] && git add data/p3_guard_cache/dune_base_schema_discovery_result.json
          [ -e data/credits_spent_mozila.json ] && git add data/credits_spent_mozila.json
          git diff --cached --quiet && exit 0
          git commit -m "Dune (Mozila): разведка схемы Base для wash_share [automated]"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected, попытка $i/5 -- git pull --rebase и повтор"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep 3
          done
          echo "не удалось запушить после 5 попыток" >&2
          exit 1
