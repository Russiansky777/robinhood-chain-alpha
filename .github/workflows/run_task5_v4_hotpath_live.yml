name: "Задача 5, LIVE -- ЧАСОВОЙ ПИЛОТ ClosedCycleExecutorV4 на mainnet (реальные транзакции, владелец кнопкой)"

# ШЕСТОЙ раунд ревью, владелец: "Я запускаю через GitHub Actions, SSH
# вручную не использую. ... Подготовь запуск часового LIVE-пилота также
# через workflow_dispatch: выбранный commit SHA, адрес проверенного
# контракта и явное подтверждение LIVE. Сам бот работает на Ohio.
# Сохраняй stdout/stderr и существующие журналы на сервере, после
# завершения забирай отчёт в GitHub Actions artifacts, чтобы я мог
# скачать его. Бюджет и торговую логику не менять."
#
# Этот workflow -- ТОЛЬКО CI-обвязка (SSH на Ohio, запуск УЖЕ
# СУЩЕСТВУЮЩЕГО analysis/task5_v4_hotpath.py с --confirm-mainnet,
# получить журналы обратно и опубликовать как ARTIFACT, а не
# закоммитить в git -- в отличие от run_task5_deploy_executor_v4.yml и
# run_task5_verify_deploy_v4.yml, которые коммитят результат). Ни
# бюджет, ни торговая логика ЗДЕСЬ НЕ МЕНЯЮТСЯ и не задаются -- все
# правила (лимит $20 газа, часовой отсчёт от bootstrap, единственная
# неподтверждённая транзакция, честный PnL по CycleExecuted и т.д.) уже
# реализованы в самом task5_v4_hotpath.py, этот workflow их не трогает.
#
# ЭТО РЕАЛЬНЫЕ, НЕОБРАТИМЫЕ, ДЕНЕЖНЫЕ ТРАНЗАКЦИИ -- намеренно ТОЛЬКО
# workflow_dispatch, БЕЗ push-триггера. Три независимых барьера:
# ЗАФИКСИРОВАННЫЙ commit SHA (та же версия, что деплой и верификация),
# ЯВНО указанный адрес ПРОВЕРЕННОГО контракта (не подставляется
# автоматически из предыдущих шагов -- владелец сам копирует его из
# результата run_task5_verify_deploy_v4.yml, all_checks_passed=true), и
# точная фраза подтверждения "LIVE_PILOT_V4".
#
# ОБРЫВ SSH НЕ ДОЛЖЕН ОБОРВАТЬ ПИЛОТ: процесс запускается на Ohio через
# `setsid nohup ... &` с перенаправлением stdin/stdout/stderr в файл --
# полностью отсоединяется от SSH-сессии (новая сессия ОС, SIGHUP
# игнорируется), поэтому переживает разрыв соединения раннера на все
# ~60+ минут. Сам этот workflow ОПРАШИВАЕТ (poll) раз в минуту, жив ли
# процесс на Ohio, вместо того чтобы держать ОДНУ foreground SSH-команду
# открытой (что сделало бы весь час одной точкой отказа при обрыве).

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'ЗАФИКСИРОВАННЫЙ полный commit SHA -- ТА ЖЕ версия, что использовалась для деплоя (run_task5_deploy_executor_v4.yml) и верификации (run_task5_verify_deploy_v4.yml). ПРАВКА (шестнадцатый раунд, владелец): default обновлён -- к быстрому отбору (кэш известных пулов + дешёвый фильтр по направленным предельным ценам, ДВЕ подтверждённые НАБЛЮДЕНИЕМ для КОНКРЕТНЫХ пулов/направлений ставки хука 0xe5e70264... -- ETH/MOSIAI 2.00%, ETH/0x35a79120 2.90%, НЕ гарантированно неизменные правила хука; хук-маршруты без подтверждённой модели -- в отдельную ограниченную очередь пересмотра, НЕ в главную) добавлено устранение обхода: маршруты, помеченные не живыми, БОЛЬШЕ НЕ идут в главную торговую очередь безусловно на каждое касание -- та же ограниченная (потолок 200) неприоритетная очередь, что и у хуков без модели; после восстановления живучести следующее касание естественно возвращается в обычный отбор. Сквозной результат (кэш -> фильтр -> recompute_route -> исполнение) подтверждён на реальном контрольном примере (форк на историческом состоянии ДО сделки конкурента, tx 0x878fb998..., независимо от сегодняшнего is_live) -- цепочка 14.5с; из них измерены отдельно: форк+реплей 0.58с, инициализация кэша 2.88с, фильтр <0.001с, recompute_route 8.50с, деплой+финансирование+отправка+ожидание рецепта одним блоком 1.00с (не разбито на под-этапы); 18 RPC -- это ТОЛЬКО котировки/gas-estimate торгового пути внутри recompute_route, не полный RPC-счёт всей цепочки (extsload кэша и cast/anvil-вызовы форка считаются отдельно, не входят). Контракт/сетки размеров/кошелёк/бюджет НЕ менялись, редеплой не требуется -- CLI не менялся.'
        required: true
        type: string
        default: '2ae37989583dc9ec653bc089e7a73e867b155821'
      contract_address:
        description: 'Адрес ClosedCycleExecutorV4, ПРОШЕДШИЙ проверку run_task5_verify_deploy_v4.yml (all_checks_passed=true) -- скопируйте из его результата (contracts/build/deploy_verification_v4.json), не вводите на глаз. Значение по умолчанию -- уже проверенный контракт пилота (тот же кошелёк/контракт, что предыдущий часовой прогон).'
        required: true
        type: string
        default: '0xAB24907bceEF4EDC366a1E4DfA15ed8aA5fdfe71'
      duration_seconds:
        description: 'ПРАВКА (шестой раунд, пункт 6 -- "короткий 15-30 мин пилот после фиксов"): длительность в секундах. По умолчанию 1200с (20 минут) -- в диапазоне, запрошенном владельцем. НЕ меняет бюджет/торговую логику -- тот же --duration-seconds, что был жёстко закодирован (3600) в предыдущих часовых прогонах, теперь параметр.'
        required: false
        type: string
        default: '1200'
      confirm:
        description: 'Введите ровно "LIVE_PILOT_V4", чтобы подтвердить: это пилот с РЕАЛЬНЫМИ транзакциями на mainnet, тратит реальный ETH/USDG с кошелька владельца (длительность -- см. duration_seconds выше).'
        required: true
        type: string

jobs:
  live_pilot_v4:
    name: "LIVE-пилот task5_v4_hotpath.py (Ohio VPS, --confirm-mainnet --duration-seconds ${{ inputs.duration_seconds }})"
    runs-on: ubuntu-latest
    # ПРАВКА (тринадцатый раунд): опрос теперь до (duration_seconds/60 +
    # 45) минут (см. шаг ожидания ниже -- честный запас на bootstrap
    # реестра, реально наблюдавшийся 27+ мин на прошлом прогоне) -- для
    # текущего default'а 1200с (20 мин) это ~65 минут опроса. 100 минут
    # общего таймаута job'а по-прежнему с запасом покрывает опрос + запуск
    # + получение/публикацию отчёта (не требует увеличения для 20-мин
    # пилота; при большем duration_seconds эту границу нужно будет поднять).
    timeout-minutes: 100
    permissions:
      contents: read
    steps:
      - name: Проверить текстовое подтверждение
        env:
          CONFIRM_INPUT: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM_INPUT" != "LIVE_PILOT_V4" ]; then
            echo "confirm != 'LIVE_PILOT_V4' -- остановлено, LIVE-пилот НЕ запущен." >&2
            exit 1
          fi

      - name: SSH key + known_hosts
        env:
          VPS_SSH_KEY_OHIO: ${{ secrets.VPS_SSH_KEY_OHIO }}
        run: |
          set -e
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY_OHIO" > ~/.ssh/vps_key_ohio
          chmod 600 ~/.ssh/vps_key_ohio
          ssh-keyscan -T 10 3.151.160.108 >> ~/.ssh/known_hosts 2>/dev/null
          # ServerAliveInterval/CountMax -- каждая SSH-команда этого
          # workflow короткая (запуск, один опрос, финальный забор
          # отчёта), но job в целом живёт значительно дольше обычного --
          # keepalive снижает риск разрыва простаивающих соединений.
          echo "SSH_OPTS=-i $HOME/.ssh/vps_key_ohio -o ConnectTimeout=15 -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=60 -o ServerAliveCountMax=10" >> "$GITHUB_ENV"

      - name: "Зафиксированный checkout + запуск task5_v4_hotpath.py в фоне на Ohio (setsid/nohup)"
        env:
          LIVE_SHA: ${{ inputs.commit_sha }}
          CONTRACT_ADDRESS: ${{ inputs.contract_address }}
          DURATION_SECONDS: ${{ inputs.duration_seconds }}
        run: |
          # RUN_TAG -- уникален для этого запуска workflow (номер run +
          # попытка), чтобы лог/PID разных запусков не перезаписывали
          # друг друга на диске Ohio. Сохраняется в GITHUB_ENV для
          # следующих шагов (опрос, забор отчёта).
          RUN_TAG="run${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          echo "RUN_TAG=$RUN_TAG" >> "$GITHUB_ENV"
          # `git checkout <ref>` БЕЗ --hard/force -- честная ошибка при
          # конфликте вместо тихого уничтожения локальных изменений (тот
          # же принцип, что в run_task5_verify_deploy_v4.yml). `set -euo
          # pipefail` В САМОМ НАЧАЛЕ удалённого скрипта -- ошибка
          # fetch/checkout прерывает запуск ДО старта торговли, а не
          # продолжает вслепую. $LIVE_SHA/$CONTRACT_ADDRESS/$RUN_TAG
          # подставляются ЭТОЙ (вызывающей, GH Actions runner) оболочкой
          # ДО отправки по SSH -- литералами, без передачи через
          # remote-side окружение (та же схема, что уже работает в
          # run_task5_deploy_executor_v4.yml и run_task5_verify_deploy_v4.yml).
          # $LOG/$PIDFILE/$!/$(...) НАРОЧНО экранированы (\$) -- это
          # переменные УДАЛЁННОГО bash, вычисляются ПОСЛЕ доставки по SSH.
          #
          # ПРАВКА (продолжение шестого раунда ревью): загрузка окружения
          # (/etc/bot/env, PRIVATE_KEY_NOX) была ПРОПУЩЕНА -- Sender внутри
          # task5_v4_hotpath.py читает PRIVATE_KEY_NOX из окружения ЭТОГО
          # процесса, а не подхватывает его сам. `set -a; . /etc/bot/env;
          # set +a` -- ДО cd/запуска Python; `: "${PRIVATE_KEY_NOX:?...}"`
          # -- явная остановка (под `set -u` внутри `set -euo pipefail`
          # это ШТАТНАЯ, не аварийная форма проверки: `:?` перехватывает
          # незаданную/пустую переменную сам, до того как nounset успеет
          # её увидеть) с понятным сообщением, БЕЗ печати значения ключа
          # -- ни здесь, ни где-либо ещё в этом шаге. `\"...\"` и `\$` --
          # то же экранирование через вложенную (outer ssh -> sudo bash -c
          # в одинарных кавычках) строку, что и везде в этом шаге.
          # `python -u` -- без буферизации stdout/stderr, чтобы лог на
          # диске отражал прогресс пилота НЕМЕДЛЕННО, а не только после
          # закрытия файлового дескриптора.
          #
          # ПРАВКА: у ЭТОГО шага (как у ЛЮБОГО `run:` в GitHub Actions)
          # оболочка по умолчанию -- `bash -e {0}` (errexit). Раньше `ssh
          # ... > out 2> err` был ПРОСТОЙ командой БЕЗ `||`/`if` -- при
          # ненулевом коде возврата errexit прерывал шаг СРАЗУ, ДО строк
          # `cat /tmp/live_launch_stdout.log` / `cat .../stderr.log` --
          # диагностика падения терялась целиком (виден был только общий
          # "Process completed with exit code 1", без единой строки
          # причины). `ssh ... || SSH_RC=$?` -- команда становится левой
          # частью `||`, поэтому её ненулевой код НЕ триггерит errexit
          # (это стандартное исключение bash для `&&`/`||`-списков);
          # `$SSH_RC` при этом сохраняет РЕАЛЬНЫЙ код возврата. stdout/
          # stderr печатаются ВСЕГДА (успех или провал), последней
          # строкой -- `exit $SSH_RC`, чтобы шаг всё равно честно
          # завершился ошибкой при провале (не "тихим успехом").
          #
          # ПРАВКА (по факту первого реального падения, run 34734750147):
          # `error: The following untracked working tree files would be
          # overwritten by checkout: data/task5_v4_pilot_wallet_prepare_result.json`
          # -- решалось уводом ОДНОГО известного файла в сторону перед
          # `git checkout $LIVE_SHA` на ОБЩЕМ рабочем дереве Ohio.
          #
          # ПРАВКА (по факту ВТОРОГО реального падения): `error: Your local
          # changes to the following files would be overwritten by checkout:
          # analysis/task5_v4_hook_prefilter_pointchecks.py, analysis/
          # task5_v4_hotpath.py, analysis/task5_v4_pilot_accounting.py` --
          # ТОТ ЖЕ общий репозиторий `/home/bot/robinhood-chain-alpha`
          # используется ОБОИМИ workflow: этим (LIVE, полный `git checkout
          # $LIVE_SHA`) И run_task5_v4_analysis_script.yml (read-only
          # диагностика, `git checkout <sha> -- analysis/` -- ТОЧЕЧНЫЙ
          # checkout ПОДКАТАЛОГА, намеренно НЕ коммитящий и НЕ сбрасывающий
          # изменения, см. её же докстринг). Каждый такой диагностический
          # прогон оставляет `analysis/*.py` в рабочем дереве Ohio
          # ИЗМЕНЁННЫМИ относительно текущего HEAD -- полный `git checkout
          # $LIVE_SHA` (переключение HEAD) честно отказывается затирать их
          # молча (round 5, non-destructive checkout сработал ПРАВИЛЬНО --
          # но теперь на файлы, изменённые НЕ ботом, а диагностикой). Общая
          # причина у обоих падений одна: LIVE и read-only диагностика
          # делят ОДНО физическое рабочее дерево.
          #
          # ИСПРАВЛЕНИЕ: LIVE больше НЕ делает `git checkout` на общем
          # дереве вообще -- `git worktree add --detach` создаёт ОТДЕЛЬНУЮ,
          # ЧИСТУЮ копию репозитория НА ЭТОТ КОНКРЕТНЫЙ коммит в новом
          # каталоге (уникальном для RUN_TAG), не трогая общее дерево
          # (используемое диагностикой) вообще -- никакого конфликта
          # локальных изменений впредь, при этом НЕ новый checkout по
          # смыслу задачи (`git worktree` -- тот же коммит, та же git
          # история, просто другая директория для файлов). venv (уже
          # установленный, ОБЩИЙ для всех воркдеревьев -- зависимости не
          # переустанавливаются), /etc/bot/env, PRIVATE_KEY_NOX,
          # /home/bot/data/* (состояние реестра/бюджета/журналов) -- ВСЕ
          # абсолютные пути, НЕ зависящие от того, где физически лежит
          # analysis/ -- НЕ меняются. `git worktree prune` -- перед add,
          # на случай если предыдущий запуск не успел убрать свою запись
          # (крах раннера и т.п.) -- безопасно, ничего не удаляет, кроме
          # мёртвых ссылок на уже несуществующие каталоги.
          # ПРАВКА (седьмой раунд, разбор владельца, пункт 5): "одна кнопка
          # перезапуска" реально утыкалась в ДВЕ немедленные причины
          # завершения, которые этот workflow раньше не устранял:
          #   1) budget.pilot_completed=true с прошлой (завершившейся)
          #      сессии -- task5_v4_hotpath.py._main() видит это ПЕРВЫМ и
          #      выходит, ничего не делая. --new-session (новый флаг,
          #      см. task5_v4_hotpath.py/task5_v4_pilot_accounting.py --
          #      PilotBudget.start_new_session()) открывает НОВУЮ сессию,
          #      сбрасывая РОВНО pilot_completed/pilot_started_at --
          #      накопленный газ/PnL/общий лимит $20 НЕ трогает (флаг САМ
          #      по себе безвреден, если пилот НЕ был завершён -- условие
          #      внутри _main() проверяет budget.pilot_completed ПЕРЕД
          #      сбросом).
          #   2) /etc/bot/STOP, оставленный ПРЕДЫДУЩИМ штатным
          #      завершением -- главный цикл видит файл на САМОЙ ПЕРВОЙ
          #      итерации и немедленно уходит в "плавную остановку", даже
          #      не начав работу. Владелец явно подтверждает НОВЫЙ LIVE-
          #      запуск (фраза confirm) -- это и есть explicit-сигнал
          #      снять файл КАК ЧАСТЬ этого же запуска (не тихая фоновая
          #      расчистка). Снимается ДО входа в контекст пользователя
          #      bot (sudo -u bot САМ не имеет прав на /etc/bot, файл
          #      root-owned) -- через sudo НАПРЯМУЮ, той же ubuntu-сессией.
          SSH_RC=0
          ssh $SSH_OPTS ubuntu@3.151.160.108 "
            set -euo pipefail
            echo '[live] пункт 5: снятие leftover STOP (если оставлен предыдущим пилотом)...'
            if sudo test -f /etc/bot/STOP; then
              sudo rm -f /etc/bot/STOP
              echo '[live] /etc/bot/STOP снят -- часть ЭТОГО подтверждённого перезапуска (confirm=LIVE_PILOT_V4)'
            else
              echo '[live] /etc/bot/STOP отсутствует -- нечего снимать'
            fi
            sudo -u bot bash -c '
              set -euo pipefail
              set -a
              . /etc/bot/env
              set +a
              : \"\${PRIVATE_KEY_NOX:?PRIVATE_KEY_NOX не загружен}\"
              cd /home/bot/robinhood-chain-alpha
              git fetch origin $LIVE_SHA
              mkdir -p /home/bot/live_worktrees
              git worktree prune
              WORKTREE_DIR=/home/bot/live_worktrees/${RUN_TAG}
              git worktree add --detach --force \"\$WORKTREE_DIR\" $LIVE_SHA
              cd \"\$WORKTREE_DIR/analysis\"
              LOG=/home/bot/data/task5_v4_hotpath_live_${RUN_TAG}.log
              PIDFILE=/home/bot/data/task5_v4_hotpath_live_${RUN_TAG}.pid
              setsid nohup /home/bot/robinhood-chain-alpha/venv/bin/python -u task5_v4_hotpath.py --contract-address $CONTRACT_ADDRESS --from-address 0x893f4a7eADBa18c2f8aA1e0E23e11eCF66208e75 --confirm-mainnet --duration-seconds $DURATION_SECONDS --new-session > \"\$LOG\" 2>&1 < /dev/null &
              echo \$! > \"\$PIDFILE\"
              sleep 1
              echo \"[live] запущен pid=\$(cat \$PIDFILE), лог=\$LOG, worktree=\$WORKTREE_DIR (общее дерево /home/bot/robinhood-chain-alpha не тронуто)\"
            '
          " > /tmp/live_launch_stdout.log 2> /tmp/live_launch_stderr.log || SSH_RC=$?
          echo "--- stdout ---"; cat /tmp/live_launch_stdout.log
          echo "--- stderr ---"; cat /tmp/live_launch_stderr.log
          echo "SSH exit code: $SSH_RC"
          exit $SSH_RC

      - name: "Ждать завершения пилота (опрос PID на Ohio раз в минуту -- переживает обрыв SSH)"
        env:
          DURATION_SECONDS: ${{ inputs.duration_seconds }}
        run: |
          # ПРАВКА (тринадцатый раунд, известное ограничение обвязки,
          # владелец): прежний запас "+15 минут" предполагался ТОЛЬКО на
          # bootstrap реестра + забор отчёта -- РЕАЛЬНО же прошлый LIVE-
          # прогон (run34771657422_1, эта же сессия) показал bootstrap
          # (восстановление состояния + discovery + ПОЛНЫЙ проход
          # живучести ВСЕХ маршрутов, refresh_liveness_all -- см. её
          # докстринг: НЕ порционный, без прогресс-счётчика) занявшим
          # 27+ минут ДО начала отсчёта часа пилота (pilot_started_at
          # выставляется ТОЛЬКО ПОСЛЕ bootstrap_registry(), см.
          # PilotBudget.ensure_pilot_started()) -- старого запаса "+15"
          # не хватило бы покрыть ТОЛЬКО bootstrap, не говоря уже про
          # саму торговую сессию поверх него. Отдельно от bootstrap'а --
          # ОБНАРУЖЕННЫЕ ускорения (быстрый RPC-путь) сокращают время
          # ОДНОЙ оценки кандидата на горячем пути, НЕ время
          # ОДНОРАЗОВОГО bootstrap'а (тот всё ещё вне торгового
          # rpc_call_trading_path -- обычный check_route_liveness/
          # discover_new_arbitrageur_routes фоновый путь, который эта
          # правка НЕ трогала, см. отчёт). Честный запас, основанный на
          # РЕАЛЬНО НАБЛЮДАВШЕЙСЯ длительности (27+ мин) плюс разумный
          # резерв -- "+45" минут (не изобретённое число "с потолка": на
          # ~1.7х больше уже подтверждённого максимума), покрывает и
          # bootstrap, и всю торговую сессию duration_seconds, и забор
          # отчёта. Ранний выход по STATUS=done срабатывает независимо
          # от этой верхней границы -- это ТОЛЬКО потолок ожидания.
          MAX_POLLS=$(( (DURATION_SECONDS / 60) + 45 ))
          echo "опрашиваем task5_v4_hotpath_live_${RUN_TAG}.pid каждые 60с (до ~${MAX_POLLS} минут -- покрывает bootstrap реестра [реально наблюдалось 27+ мин] + duration_seconds=${DURATION_SECONDS}с торговли + забор отчёта)..."
          STATUS="unknown"
          for i in $(seq 1 "$MAX_POLLS"); do
            sleep 60
            STATUS=$(ssh $SSH_OPTS ubuntu@3.151.160.108 "sudo -u bot bash -c 'PID=\$(cat /home/bot/data/task5_v4_hotpath_live_${RUN_TAG}.pid 2>/dev/null || echo 0); if kill -0 \$PID 2>/dev/null; then echo alive; else echo done; fi'" 2>/dev/null || echo "ssh_error")
            echo "[$i/$MAX_POLLS] $(date -u +%H:%M:%SZ) статус процесса на Ohio: $STATUS"
            if [ "$STATUS" = "done" ]; then
              echo "процесс на Ohio завершился."
              break
            fi
          done
          if [ "$STATUS" != "done" ]; then
            echo "::warning::процесс на Ohio НЕ подтвердил завершение за отведённое время опроса (последний статус: $STATUS) -- отчёт будет забран как есть, возможно НЕЗАВЕРШЁННЫМ."
          fi

      - name: "Забрать stdout/stderr и журналы пилота с Ohio (для artifact)"
        if: always()
        run: |
          mkdir -p /tmp/live_pilot_report
          ssh $SSH_OPTS ubuntu@3.151.160.108 "sudo -u bot cat /home/bot/data/task5_v4_hotpath_live_${RUN_TAG}.log" > /tmp/live_pilot_report/hotpath_stdout_stderr.log 2>/tmp/live_pilot_report/_fetch_log.err || true
          ssh $SSH_OPTS ubuntu@3.151.160.108 "sudo -u bot cat /home/bot/data/task5_v4_pilot_budget_state.json" > /tmp/live_pilot_report/pilot_budget_state.json 2>>/tmp/live_pilot_report/_fetch_log.err || true
          ssh $SSH_OPTS ubuntu@3.151.160.108 "sudo -u bot cat /home/bot/data/task5_v4_pilot_attempts.jsonl" > /tmp/live_pilot_report/pilot_attempts.jsonl 2>>/tmp/live_pilot_report/_fetch_log.err || true
          ssh $SSH_OPTS ubuntu@3.151.160.108 "sudo -u bot cat /home/bot/data/task5_v4_pilot_no_send_log.jsonl" > /tmp/live_pilot_report/pilot_no_send_log.jsonl 2>>/tmp/live_pilot_report/_fetch_log.err || true
          # Уборка отдельного worktree ЭТОГО запуска (см. предыдущий шаг) --
          # ТОЛЬКО если процесс подтверждённо не жив (не удаляем каталог,
          # которым процесс МОЖЕТ ещё пользоваться); безвредно при ошибке
          # (worktree просто останется до следующей ручной уборки).
          ssh $SSH_OPTS ubuntu@3.151.160.108 "sudo -u bot bash -c '
            PID=\$(cat /home/bot/data/task5_v4_hotpath_live_${RUN_TAG}.pid 2>/dev/null || echo 0)
            if kill -0 \$PID 2>/dev/null; then
              echo \"[live] процесс \$PID ещё жив -- worktree /home/bot/live_worktrees/${RUN_TAG} НЕ трогаю\"
            else
              cd /home/bot/robinhood-chain-alpha
              git worktree remove --force /home/bot/live_worktrees/${RUN_TAG} 2>&1 || true
              echo \"[live] worktree /home/bot/live_worktrees/${RUN_TAG} убран\"
            fi
          '" 2>>/tmp/live_pilot_report/_fetch_log.err || true
          {
            echo "# LIVE-пилот task5_v4_hotpath.py -- $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "commit_sha=${{ inputs.commit_sha }}"
            echo "contract_address=${{ inputs.contract_address }}"
            echo "duration_seconds=${{ inputs.duration_seconds }}"
            echo "run_tag=${RUN_TAG}"
            echo ""
            echo "## Последние 200 строк stdout/stderr"
            tail -n 200 /tmp/live_pilot_report/hotpath_stdout_stderr.log 2>/dev/null || echo "(нет данных)"
          } > /tmp/live_pilot_report/SUMMARY.md
          echo "--- SUMMARY.md ---"; cat /tmp/live_pilot_report/SUMMARY.md
          ls -la /tmp/live_pilot_report

      - name: "Опубликовать отчёт как GitHub Actions artifact"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task5-v4-live-pilot-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/live_pilot_report
          retention-days: 90
          if-no-files-found: warn
