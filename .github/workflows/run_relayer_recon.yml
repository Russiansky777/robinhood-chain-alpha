name: A -- Across relayer recon (только чтение, публичный RPC, без капитала)

# Разведка: какие маршруты/токены включены на SpokePool Robinhood Chain,
# есть ли реальная активность. НИКАКИХ транзакций, ключ не используется.
on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/sc1-pons-v2-launcher-efdbyt
    paths:
      - "data/p3_guard_cache/RELAYER_RECON_REQUEST"

jobs:
  recon:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r analysis/requirements.txt

      - name: Recon
        run: python analysis/relayer_recon.py

      - name: Commit results
        if: always()
        run: |
          [ -e data/p3_guard_cache/relayer_recon_result.json ] && git add data/p3_guard_cache/relayer_recon_result.json
          git diff --cached --quiet && exit 0
          git commit -m "A: relayer recon (routes/tokens/sample) [automated]"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected, попытка $i/5 -- git pull --rebase и повтор"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep 3
          done
          echo "не удалось запушить после 5 попыток" >&2
          exit 1
