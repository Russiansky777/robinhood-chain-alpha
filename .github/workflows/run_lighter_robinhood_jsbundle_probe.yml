name: Lighter -- поиск реального API-хоста Robinhood-инстанса (через JS-бандл фронтенда)

# Владелец, 2026-09-03: "На счету всё есть... это не сеть Lighter, а
# https://robinhoodchain.lighter.xyz/ и сеть robinhood." -- ищем
# реальный API-хост, с которым разговаривает этот фронтенд, по его
# собственному JS-бандлу (не гадаем поддомены). Только чтение.
on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/sc1-pons-v2-launcher-efdbyt
    paths:
      - "data/p3_guard_cache/LIGHTER_ROBINHOOD_JSBUNDLE_PROBE_REQUEST"

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r analysis/requirements.txt

      - name: Найти реальный API-хост в JS-бандле фронтенда
        run: python -u analysis/lighter_robinhood_jsbundle_probe.py

      - name: Commit results
        if: always()
        run: |
          [ -e data/p3_guard_cache/lighter_robinhood_jsbundle_result.json ] && git add data/p3_guard_cache/lighter_robinhood_jsbundle_result.json
          git diff --cached --quiet && exit 0
          git commit -m "Lighter: поиск реального API-хоста Robinhood-инстанса через JS-бандл [automated]"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected, попытка $i/5 -- git pull --rebase и повтор"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep 3
          done
          echo "не удалось запушить после 5 попыток" >&2
          exit 1
