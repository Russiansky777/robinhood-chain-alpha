name: "Solana buyer_200 -- 29 кандидатов: конвертация USDC-входов в SOL-эквивалент"

# Все 29 кандидатов + лидер оказались на 100% USDC-котируемых первых
# входах -- порог >=4.3 SOL буквально даёт 0 везде. Досчёт: реальный
# исторический курс SOL/USD (GeckoTerminal) на момент каждой сделки.
# Один диапазон запросов на весь 7-суточный период, без RPC/цепи.

on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/nifty-sagan-r0polg
    paths:
      - "data/p3_guard_cache/SOLANA_29_CANDIDATES_USDC_TO_SOL_REQUEST"

jobs:
  usdc_to_sol:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests
      - name: "Конвертация USDC входов в SOL-эквивалент"
        run: python -u analysis/solana_29_candidates_usdc_to_sol.py
      - name: Commit results
        if: always()
        run: |
          git rm -f --ignore-unmatch data/p3_guard_cache/SOLANA_29_CANDIDATES_USDC_TO_SOL_REQUEST
          [ -e data/solana_29_candidates_flow_7d_sol_equiv.json ] && git add data/solana_29_candidates_flow_7d_sol_equiv.json
          git diff --cached --quiet && exit 0
          git commit -m "Solana buyer_200: 29 кандидатов -- SOL-эквивалент USDC-входов [automated]"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected, попытка $i/5 -- git pull --rebase и повтор"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep 3
          done
          echo "не удалось запушить после 5 попыток" >&2
          exit 1
