name: "Форензика fomo -- шаг 1, объём 6 кошельков по сетям/месяцам (аккаунт Mozila)"

on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/sc1-pons-v2-launcher-efdbyt
    paths:
      - "data/p3_guard_cache/FOMO_FORENSICS_WALLETS_SCOPE_PROBE_REQUEST"

jobs:
  scope_probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r analysis/requirements.txt
      - name: "Шаг 1: разведка объёма 6 кошельков по сетям/месяцам (только агрегаты)"
        env:
          DUNE_API_KEY: ${{ secrets.DUNE_API_KEY_MOZILA }}
        run: python -u analysis/fomo_forensics_wallets_scope_probe.py
      - name: Commit results
        if: always()
        run: |
          git rm -f --ignore-unmatch data/p3_guard_cache/FOMO_FORENSICS_WALLETS_SCOPE_PROBE_REQUEST
          [ -e data/p3_guard_cache/fomo_forensics_wallets_scope_probe_result.json ] && git add data/p3_guard_cache/fomo_forensics_wallets_scope_probe_result.json
          [ -e data/credits_spent_mozila.json ] && git add data/credits_spent_mozila.json
          git diff --cached --quiet && exit 0
          git commit -m "Форензика fomo: шаг 1 -- объём 6 кошельков по сетям/месяцам, результат [automated]"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected, попытка $i/5 -- git pull --rebase и повтор"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep 3
          done
          echo "не удалось запушить после 5 попыток" >&2
          exit 1
