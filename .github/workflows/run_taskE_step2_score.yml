name: "Задача E -- Шаг 2: реальный Brier score (отдельный поздний запуск, только агрегаты на выход)"

# Владелец, 2026-09-10: запускать ТОЛЬКО после того, как коммит Шага 1
# (с уже заполненными llm_probability_estimate) виден в истории git.
# Скрипт сам запрашивает реальные исходы и сам считает Brier score --
# в результат попадают только агрегаты, ни одного сырого исхода.
# Публичный Polymarket API, не Dune/GT -- безопасно параллельно с
# ретро-сторожком (не тронут).
#
# 2026-09-10, реальная находка: workflow_dispatch-only воркфлоу без
# единого срабатывания на исходной ветке не регистрируется GitHub
# Actions (нет workflow_id) и не вызывается через API/UI (404) --
# это не связано с временным разделением, а с тем, как GitHub вообще
# узнаёт о существовании воркфлоу вне дефолтной ветки. Добавлен
# push-триггер на маркер-файл -- та же уже принятая в проекте схема,
# что у Шага 1 (run_taskE_step1_context_fetch.yml). Порядок реально
# соблюдён: этот файл добавляется и коммит с маркером делается уже
# ПОСЛЕ того, как коммит Шага 1 с заполненными оценками виден в git.

on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/sc1-pons-v2-launcher-efdbyt
    paths:
      - "data/p3_guard_cache/TASKE_STEP2_SCORE_REQUEST"

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests
      - name: "Задача E, Шаг 2 -- реальный Brier score (только агрегаты)"
        run: python -u analysis/taskE_step2_score.py
      - name: Commit results
        if: always()
        run: |
          git rm -f --ignore-unmatch data/p3_guard_cache/TASKE_STEP2_SCORE_REQUEST
          [ -e data/p3_guard_cache/taskE_step2_brier_result.json ] && git add data/p3_guard_cache/taskE_step2_brier_result.json
          if ! git diff --cached --quiet; then
            git commit -m "Задача E, Шаг 2: Brier score, результат [automated]"
          fi
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected, попытка $i/5 -- git pull --rebase и повтор"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep 3
          done
          echo "не удалось запушить после 5 попыток" >&2
          exit 1
