name: "Задача C -- разведка публичных API предикт-маркетов (Polymarket/Kalshi/SX Bet), только чтение"

# Владелец, 2026-09-05, Порядок: B -> C. Шаг 0 перед любым сопоставлением
# рынков -- зафиксировать РЕАЛЬНУЮ форму ответа каждого API (сделки vs
# стакан, формат цены/времени), не гадать.

on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/sc1-pons-v2-launcher-efdbyt
    paths:
      - "data/p3_guard_cache/TASKC_PREDICTION_MARKETS_PROBE_REQUEST"
      - "data/p3_guard_cache/TASKC_KALSHI_BTC_PROBE_REQUEST"
      - "data/p3_guard_cache/TASKC_POLYMARKET_BTC_PROBE_REQUEST"
      - "data/p3_guard_cache/TASKC_SPORTS_MATCH_PROBE_REQUEST"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r analysis/requirements.txt
      - name: Разведка API (Polymarket/Kalshi/SX Bet, только чтение)
        if: ${{ hashFiles('data/p3_guard_cache/TASKC_PREDICTION_MARKETS_PROBE_REQUEST') != '' }}
        run: python -u analysis/taskC_prediction_markets_probe.py
      - name: Разведка Kalshi BTC-часовых серий (только чтение)
        if: ${{ hashFiles('data/p3_guard_cache/TASKC_KALSHI_BTC_PROBE_REQUEST') != '' }}
        run: python -u analysis/taskC_kalshi_btc_probe.py
      - name: Разведка структуры BTC-рынков Polymarket (только чтение)
        if: ${{ hashFiles('data/p3_guard_cache/TASKC_POLYMARKET_BTC_PROBE_REQUEST') != '' }}
        run: python -u analysis/taskC_polymarket_btc_probe.py
      - name: Разведка форматов спортивных рынков (Kalshi vs Polymarket, только чтение)
        if: ${{ hashFiles('data/p3_guard_cache/TASKC_SPORTS_MATCH_PROBE_REQUEST') != '' }}
        run: python -u analysis/taskC_sports_match_probe.py
      - name: Commit results
        if: always()
        run: |
          git rm -f --ignore-unmatch data/p3_guard_cache/TASKC_PREDICTION_MARKETS_PROBE_REQUEST
          git rm -f --ignore-unmatch data/p3_guard_cache/TASKC_KALSHI_BTC_PROBE_REQUEST
          git rm -f --ignore-unmatch data/p3_guard_cache/TASKC_POLYMARKET_BTC_PROBE_REQUEST
          git rm -f --ignore-unmatch data/p3_guard_cache/TASKC_SPORTS_MATCH_PROBE_REQUEST
          [ -e data/p3_guard_cache/taskC_prediction_markets_probe_result.json ] && git add data/p3_guard_cache/taskC_prediction_markets_probe_result.json
          [ -e data/p3_guard_cache/taskC_kalshi_btc_probe_result.json ] && git add data/p3_guard_cache/taskC_kalshi_btc_probe_result.json
          [ -e data/p3_guard_cache/taskC_polymarket_btc_probe_result.json ] && git add data/p3_guard_cache/taskC_polymarket_btc_probe_result.json
          [ -e data/p3_guard_cache/taskC_sports_match_probe_result.json ] && git add data/p3_guard_cache/taskC_sports_match_probe_result.json
          git diff --cached --quiet && exit 0
          git commit -m "Задача C: разведка API предикт-маркетов, результат [automated]"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected, попытка $i/5 -- git pull --rebase и повтор"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep 3
          done
          echo "не удалось запушить после 5 попыток" >&2
          exit 1
