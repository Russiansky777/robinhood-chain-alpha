name: "Solana buyer_200 -- Фаза 1, Источник A: Helius на эталоне"

on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/nifty-sagan-r0polg
    paths:
      - "data/p3_guard_cache/SOLANA_SOURCE_A_HELIUS_GATE_REQUEST"

jobs:
  source_a_helius_gate:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests
      - name: "Источник A: Helius на эталоне"
        env:
          HELIUS_API: ${{ secrets.HELIUS_API }}
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          HELIUS_KEY: ${{ secrets.HELIUS_KEY }}
        run: python -u analysis/solana_source_a_helius_gate.py
      - name: Commit results
        if: always()
        run: |
          git rm -f --ignore-unmatch data/p3_guard_cache/SOLANA_SOURCE_A_HELIUS_GATE_REQUEST
          [ -e data/solana_source_a_helius_gate.json ] && git add data/solana_source_a_helius_gate.json
          git diff --cached --quiet && exit 0
          git commit -m "Solana buyer_200: Источник A (Helius) на эталоне -- результат [automated]"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected, попытка $i/5 -- git pull --rebase и повтор"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep 3
          done
          echo "не удалось запушить после 5 попыток" >&2
          exit 1
