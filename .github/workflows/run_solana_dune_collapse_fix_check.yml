name: "Solana buyer_200 -- Dune: проверка гипотезы схлопывания (без новых запросов)"

on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/nifty-sagan-r0polg
    paths:
      - "data/p3_guard_cache/SOLANA_DUNE_COLLAPSE_FIX_CHECK_REQUEST"

jobs:
  dune_collapse_fix_check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests
      - name: "Проверка гипотезы схлопывания"
        env:
          DUNE_EXPLORER_API: ${{ secrets.DUNE_EXPLORER_API }}
        run: python -u analysis/solana_dune_collapse_fix_check.py
      - name: Commit results
        if: always()
        run: |
          git rm -f --ignore-unmatch data/p3_guard_cache/SOLANA_DUNE_COLLAPSE_FIX_CHECK_REQUEST
          [ -e data/solana_dune_collapse_fix_check.json ] && git add data/solana_dune_collapse_fix_check.json
          git diff --cached --quiet && exit 0
          git commit -m "Solana buyer_200: проверка гипотезы схлопывания Dune -- результат [automated]"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected, попытка $i/5 -- git pull --rebase и повтор"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep 3
          done
          echo "не удалось запушить после 5 попыток" >&2
          exit 1
