name: "Выгрузка сделок полосы за сутки для Code-2 (только чтение)"

# ЗАЧЕМ (слово владельца 28.09, пункт 5): "раз в сутки в 06:00Z полный файл
# всех сделок полосы за сутки (все поля позиции, source_sig, buy_sig, sell_sig,
# севшая подпись, севший слот) в ветку".
#
# Журнал позиций читается ПОТОКОМ, включая ротированные .gz. Ни одной отправки,
# ни одного изменения на хосте: только чтение и коммит файла в ветку.
on:
  schedule:
    # 06:00Z каждый день. Окно берётся за прошедшие сутки от этой же метки.
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      s:
        description: "с какой метки UTC (пусто -- сутки назад от 06:00Z сегодня)"
        required: false
        default: ""
      do:
        description: "до какой метки UTC (пусто -- 06:00Z сегодня)"
        required: false
        default: ""
      predel_podpisey:
        description: "подписей пула назад для чужих продаж (300 -- обычно; больше -- только для ретроспективы, дороже по кредитам)"
        required: false
        default: "300"
      pereschitat:
        description: "'PERESCHITAT' -- сначала пересчитать итог_по_цепи у закрытых (распаковка WSOL из выручки); 'pokazat' -- только посчитать и показать"
        required: false
        default: ""
      metka_fajla:
        description: "пометка в имени файла для РАЗОВОГО прогона (пусто -- обычная суточная выгрузка)"
        required: false
        default: ""

concurrency:
  group: vygruzka-sdelok-c2
  cancel-in-progress: false

env:
  CODE_DIR: /home/bot/bloom_executor
  STATE_DIR: /home/bot/bloom_executor_live_data
  TARGET_HOST: 127.0.0.1

jobs:
  vygruzka:
    runs-on: ${{ fromJSON('["self-hosted","nl-host"]') }}
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/nifty-sagan-r0polg

      - name: "Модуль разбирается и самопроверка счёта"
        run: |
          set -e
          python3 -m py_compile deploy/checks/sdelki_polosy_vygruzka.py
          python3 deploy/checks/sdelki_polosy_vygruzka.py --self-test

      - name: "Окно суток"
        env:
          S_VHOD: ${{ inputs.s }}
          DO_VHOD: ${{ inputs.do }}
        run: |
          set -e
          # ГРАНИЦЫ СЧИТАЮТСЯ ОТ 06:00Z СЕГОДНЯ, а не от момента запуска:
          # прогон по расписанию может задержаться на минуты, и окно поехало бы.
          DO_DEF="$(date -u +%Y-%m-%dT06:00)"
          S_DEF="$(date -u -d 'yesterday' +%Y-%m-%dT06:00)"
          echo "S_OKNA=${S_VHOD:-$S_DEF}" >> "$GITHUB_ENV"
          echo "DO_OKNA=${DO_VHOD:-$DO_DEF}" >> "$GITHUB_ENV"
          # ИМЯ ФАЙЛА: РАЗОВЫЙ ПРОГОН НЕ ТРОГАЕТ СУТОЧНУЮ ВЫГРУЗКУ. Без этого
          # прогон по узкому окну (например два выброса за полчаса) записал бы
          # data/sdelki_polosy_<сегодня>.json двумя сделками вместо двадцати трёх
          # -- то есть затёр бы суточный файл, которым считают день. Ровно так
          # 29.09 был затёрт образец транзакций для самопроверки c2_common.
          METKA="${{ inputs.metka_fajla }}"
          case "$METKA" in
            "") OUT_FILE="data/sdelki_polosy_$(date -u +%Y-%m-%d).json" ;;
            *[!A-Za-z0-9._-]*) echo "СБОЙ: в metka_fajla недопустимый знак"; exit 1 ;;
            *) OUT_FILE="data/sdelki_polosy_$(date -u +%Y-%m-%d)_$METKA.json" ;;
          esac
          echo "OUT_FILE=$OUT_FILE" >> "$GITHUB_ENV"
          echo "вывод пойдёт в $OUT_FILE"

      - name: "SSH key"
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -e
          [ -n "$VPS_SSH_KEY" ] || { echo "SBOY: VPS_SSH_KEY ne zadan"; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          echo "SSH_OPTS=-i $HOME/.ssh/vps_key -o ConnectTimeout=15 -o BatchMode=yes -o StrictHostKeyChecking=accept-new" >> "$GITHUB_ENV"

      - name: "ПЕРЕСЧЁТ итога по цепи: распаковка WSOL не выручка (по слову)"
        if: ${{ inputs.pereschitat != '' }}
        # ЗАЧЕМ ЗДЕСЬ, А НЕ ОТДЕЛЬНЫМ ПРОГОНОМ: пересчёт обязан идти ДО выгрузки,
        # иначе Code-2 получит файл с прежними итогами. Запись в журнал позиций --
        # только по слову PERESCHITAT; 'pokazat' считает и ничего не меняет.
        run: |
          set -e
          set -o pipefail
          ssh $SSH_OPTS root@$TARGET_HOST "install -d -m 755 /tmp/vygr"
          ssh $SSH_OPTS root@$TARGET_HOST "cat > /tmp/vygr/peresvet_itogov.py" < deploy/checks/peresvet_itogov.py
          PIS=""
          if [ "${{ inputs.pereschitat }}" = "PERESCHITAT" ]; then PIS="--pisat PERESCHITAT"; fi
          if [ "${{ inputs.pereschitat }}" = "VERNUT" ]; then PIS="--vernut VERNUT"; fi
          echo "rezhim pereschjota: ${PIS:-tolko pokaz}"
          ssh -n $SSH_OPTS root@$TARGET_HOST "
            set -e
            set -a; . /etc/bloom-executor/env; set +a
            BLOOM_CODE_DIR='$CODE_DIR' python3 /tmp/vygr/peresvet_itogov.py               --s '$S_OKNA' $PIS --out /tmp/vygr/peresvet.json" | tail -40
          ssh -n $SSH_OPTS root@$TARGET_HOST "cat /tmp/vygr/peresvet.json 2>/dev/null || true" > /tmp/peresvet.json || true
          if python3 -c "import json; json.load(open('/tmp/peresvet.json'))" 2>/dev/null; then
            cp /tmp/peresvet.json data/peresvet_itogov.json
            echo "obnovlen data/peresvet_itogov.json"
          else
            echo "SBOY: pereschjot ne otdal json"; exit 1
          fi

      - name: "Доставить прогон и собрать выгрузку"
        run: |
          set -e
          set -o pipefail
          ssh $SSH_OPTS root@$TARGET_HOST "install -d -m 755 /tmp/vygr"
          ssh $SSH_OPTS root@$TARGET_HOST "cat > /tmp/vygr/sdelki_polosy_vygruzka.py" < deploy/checks/sdelki_polosy_vygruzka.py
          # КАРТА РЕГИОНОВ ЛИДЕРОВ ЕДЕТ ИЗ ВЕТКИ, А НЕ С ХОСТА: на хосте её нет,
          # и без неё столбец region_lidera остался бы пустым. Это база "ДО" в
          # метрике "S+0 до/после по не-EU лидерам" (владелец 29.09, п.2).
          if [ -f data/leader_regions.json ]; then
            ssh $SSH_OPTS root@$TARGET_HOST "cat > /tmp/vygr/leader_regions.json" < data/leader_regions.json
            echo "karta regionov dostavlena: epoha $(python3 -c "import json;print(json.load(open('data/leader_regions.json')).get('эпоха'))")"
          else
            echo "karty regionov v vetke net -- region_lidera ostanetsja s prichinoj"
          fi
          # env хоста нужен ради HELIUS_API_KEY: место в блоке дозаполняется
          # по цепи (getSignatureStatuses + getBlock уровня signatures), и без
          # ключа столбец остался бы пустым, как он и был до 28.09.
          ssh -n $SSH_OPTS root@$TARGET_HOST "
            set -e
            set -a; . /etc/bloom-executor/env; set +a
            BLOOM_CODE_DIR='$CODE_DIR' python3 /tmp/vygr/sdelki_polosy_vygruzka.py \
              --state-dir '$STATE_DIR' \
              --s '$S_OKNA' --do '$DO_OKNA' --polnye \
              --predel-podpisey '${{ inputs.predel_podpisey }}' \
              --karta-regionov /tmp/vygr/leader_regions.json \
              --out /tmp/vygr/sdelki.json" | tail -24
          ssh -n $SSH_OPTS root@$TARGET_HOST "cat /tmp/vygr/sdelki.json 2>/dev/null || true" > /tmp/vygr_sdelki.json || true
          if python3 -c "import json; d=json.load(open('/tmp/vygr_sdelki.json')); print('sdelok:', d['сделок'])"; then
            cp /tmp/vygr_sdelki.json "$OUT_FILE"
            echo "obnovlen $OUT_FILE"
          else
            echo "SBOY: progon ne napisal vygruzku"
            exit 1
          fi
          ssh -n $SSH_OPTS root@$TARGET_HOST "rm -rf /tmp/vygr"

      - name: "Ключей в выгрузке быть не должно"
        run: python3 deploy/checks/bez_klyuchey_v_otchete.py "$OUT_FILE"

      - name: "Коммит"
        if: always()
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -f "$OUT_FILE" ] && git add "$OUT_FILE"
          if [ -f data/peresvet_itogov.json ]; then git add data/peresvet_itogov.json; fi
          git diff --cached --quiet && { echo "nechego kommitit"; exit 0; }
          git commit -m "Vygruzka sdelok polosy za sutki dlya Code-2 [automated]"
          for i in 1 2 3 4 5; do
            git push origin HEAD:claude/nifty-sagan-r0polg && exit 0
            git pull --rebase -X theirs origin claude/nifty-sagan-r0polg
            sleep 3
          done
          exit 1
