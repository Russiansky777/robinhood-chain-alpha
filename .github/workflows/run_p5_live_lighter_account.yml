name: P5 LIVE -- Lighter аккаунт 22012 (маржа, позиции, плечо ETH-перпа, только чтение)

# Владелец, 2026-09-03: "проверь только на чтении: баланс маржи по
# account index 22012, список открытых позиций, доступное плечо по
# ETH-перпу. Ордера не отправлять." Найдено (реальный исходник SDK):
# GET /api/v1/account -- публичный эндпоинт, подпись не нужна для
# чтения. Ключи Lighter в этом прогоне НЕ используются. Ордеров нет.
on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/sc1-pons-v2-launcher-efdbyt
    paths:
      - "data/p3_guard_cache/P5_LIVE_LIGHTER_ACCOUNT_REQUEST"

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r analysis/requirements.txt

      - name: Аккаунт 22012 -- маржа, позиции, плечо ETH (публичный API, без подписи)
        run: python -u analysis/p5_live_lighter_account.py

      - name: Commit results
        if: always()
        run: |
          [ -e data/p3_guard_cache/p5_live_lighter_account_result.json ] && git add data/p3_guard_cache/p5_live_lighter_account_result.json
          git diff --cached --quiet && exit 0
          git commit -m "P5 LIVE: Lighter аккаунт 22012 -- маржа/позиции/плечо ETH (только чтение) [automated]"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected, попытка $i/5 -- git pull --rebase и повтор"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep 3
          done
          echo "не удалось запушить после 5 попыток" >&2
          exit 1
