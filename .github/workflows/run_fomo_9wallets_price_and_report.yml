name: "Fomo -- цена/направление/первые входы/бот-человек + финальный CSV (без Dune)"

on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/nifty-sagan-r0polg
    paths:
      - "data/p3_guard_cache/FOMO_9WALLETS_PRICE_AND_REPORT_REQUEST"

jobs:
  price_report:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r analysis/requirements.txt
      - name: "slot0() на исторических блоках + классификация + CSV (0 кредитов Dune)"
        env:
          ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
          ALCHEMY_ROBINHOOD_RPC_URL: ${{ secrets.ALCHEMY_ROBINHOOD_RPC_URL }}
        run: python -u analysis/fomo_9wallets_price_and_report.py
      - name: Commit results
        if: always()
        run: |
          git rm -f --ignore-unmatch data/p3_guard_cache/FOMO_9WALLETS_PRICE_AND_REPORT_REQUEST
          [ -e data/fomo_9wallets_price_and_report_result.json ] && git add data/fomo_9wallets_price_and_report_result.json
          [ -e data/fomo_9wallets_full_history_priced.csv ] && git add data/fomo_9wallets_full_history_priced.csv
          git diff --cached --quiet && exit 0
          git commit -m "Fomo (без Dune): цена/направление/первые входы/бот-человек, результат [automated]"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected, попытка $i/5 -- git pull --rebase и повтор"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep 3
          done
          echo "не удалось запушить после 5 попыток" >&2
          exit 1
