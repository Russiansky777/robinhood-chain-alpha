name: "Solana buyer_200 -- реализованный результат (эталонная ведомость сделок)"

on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/nifty-sagan-r0polg
    paths:
      - "data/p3_guard_cache/SOLANA_DBOT_REALIZED_LEDGER_REQUEST"

jobs:
  dbot_realized_ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests
      - name: "Ведомость реализованных сделок (пилот + BATCH-1/2)"
        env:
          ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
        run: python -u analysis/solana_dbot_realized_ledger.py
      - name: Commit results
        if: always()
        run: |
          git rm -f --ignore-unmatch data/p3_guard_cache/SOLANA_DBOT_REALIZED_LEDGER_REQUEST
          [ -e data/solana_dbot_realized_ledger.json ] && git add data/solana_dbot_realized_ledger.json
          git diff --cached --quiet && exit 0
          git commit -m "Solana buyer_200: ведомость реализованных сделок (пилот + BATCH-1/2) [automated]"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected, попытка $i/5 -- git pull --rebase и повтор"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep 3
          done
          echo "не удалось запушить после 5 попыток" >&2
          exit 1
