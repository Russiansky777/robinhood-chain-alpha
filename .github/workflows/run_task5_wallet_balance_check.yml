name: "Задача 5, живой бот -- проверка баланса ETH на боевом кошельке (read-only)"

# Владелец, 2026-09-13: "Инвентарь на кошельке -- проверь баланс, если
# меньше $50 в ETH -- доложить, владелец пополнит." Публичный
# eth_getBalance -- read-only. ЧЕСТНО: первая версия этого workflow
# запрашивала RPC напрямую с GH Actions runner'а -- получила HTTP 403
# (та же анти-abuse защита, что и на фиде, но здесь, похоже, IP самого
# раннера, а не отпечаток клиента -- запросы с VPS этим же простым
# requests/urllib всегда проходили). Fix -- через SSH на Ohio VPS, тот
# же путь, что все остальные RPC-вызовы этого проекта.

on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/nifty-sagan-r0polg
    paths:
      - "data/p3_guard_cache/TASK5_WALLET_BALANCE_CHECK_REQUEST"

jobs:
  balance_check:
    name: "Баланс 0x893f4a7e... (read-only eth_getBalance через Ohio VPS)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: SSH key + known_hosts
        env:
          VPS_SSH_KEY_OHIO: ${{ secrets.VPS_SSH_KEY_OHIO }}
        run: |
          set -e
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY_OHIO" > ~/.ssh/vps_key_ohio
          chmod 600 ~/.ssh/vps_key_ohio
          ssh-keyscan -T 10 3.151.160.108 >> ~/.ssh/known_hosts 2>/dev/null
          echo "SSH_OPTS=-i $HOME/.ssh/vps_key_ohio -o ConnectTimeout=15 -o BatchMode=yes -o StrictHostKeyChecking=accept-new" >> "$GITHUB_ENV"

      - name: eth_getBalance через Ohio VPS (read-only)
        run: |
          ssh $SSH_OPTS ubuntu@3.151.160.108 '
            sudo -u bot /home/bot/robinhood-chain-alpha/venv/bin/python3 - <<PYEOF
          import json
          import requests

          ADDR = "0x893f4a7eADBa18c2f8aA1e0E23e11eCF66208e75"
          RPC_URL = "https://rpc.mainnet.chain.robinhood.com"

          def rpc(method, params):
              r = requests.post(RPC_URL, json={"jsonrpc": "2.0", "method": method, "params": params, "id": 1}, timeout=15)
              r.raise_for_status()
              return r.json()["result"]

          bal_wei = int(rpc("eth_getBalance", [ADDR, "latest"]), 16)
          block = int(rpc("eth_blockNumber", []), 16)
          print(json.dumps({
              "address": ADDR, "balance_wei": bal_wei, "balance_eth": bal_wei / 1e18, "checked_at_block": block,
          }, indent=2))
          PYEOF
          ' > /tmp/balance_result.json 2> /tmp/balance_stderr.log
          echo "--- stderr ---"; cat /tmp/balance_stderr.log
          echo "--- stdout ---"; cat /tmp/balance_result.json

      - name: Commit results
        if: always()
        run: |
          mkdir -p data/p3_guard_cache
          git rm -f --ignore-unmatch data/p3_guard_cache/TASK5_WALLET_BALANCE_CHECK_REQUEST
          [ -s /tmp/balance_result.json ] && cp /tmp/balance_result.json data/p3_guard_cache/task5_wallet_balance_check_result.json
          [ -e data/p3_guard_cache/task5_wallet_balance_check_result.json ] && git add data/p3_guard_cache/task5_wallet_balance_check_result.json
          git diff --cached --quiet && exit 0
          git commit -m "Задача 5: проверка баланса ETH на боевом кошельке (через Ohio VPS) [automated]"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected, попытка $i/5 -- git pull --rebase и повтор"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep 3
          done
          echo "не удалось запушить после 5 попыток" >&2
          exit 1
