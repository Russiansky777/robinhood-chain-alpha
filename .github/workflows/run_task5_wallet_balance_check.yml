name: "Задача 5 -- проверка баланса PRIVATE_KEY_TASK5_BOT (только чтение)"

# Владелец, 2026-09-17: перед фондированным замером доставки -- ОБЯЗАТЕЛЬНО
# сначала проверить реальный баланс кошелька. Этот workflow -- ТОЛЬКО
# чтение (eth_getBalance/eth_gasPrice/eth_getTransactionCount), ничего
# не подписывает и не отправляет. PRIVATE_KEY_NOX здесь НЕ используется
# и не читается вообще -- см. докстринг analysis/task5_wallet_balance_check.py
# про реальную путаницу адресов в запросе владельца.
#
# Секрет PRIVATE_KEY_TASK5_BOT читается СНАЧАЛА из /etc/bot/env на самом
# VPS (тот же файл, что PRIVATE_KEY_NOX/LIGHTER_*, владелец root:bot,
# права 640 -- пользователь bot состоит в группе-владельце, может читать),
# ЕСЛИ он там есть; иначе -- пусто, скрипт честно сообщит "не задан".

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Полный commit SHA, из которого точечно берётся analysis/.'
        required: true
        type: string
  push:
    branches:
      - claude/nifty-sagan-r0polg
    paths:
      - "data/p3_guard_cache/WALLET_BALANCE_CHECK_REQUEST"

jobs:
  balance_check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: SSH key + known_hosts
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -e
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key_nl
          chmod 600 ~/.ssh/vps_key_nl
          ssh-keyscan -T 10 45.59.170.76 >> ~/.ssh/known_hosts 2>/dev/null
          echo "SSH_OPTS=-i $HOME/.ssh/vps_key_nl -o ConnectTimeout=15 -o BatchMode=yes -o StrictHostKeyChecking=accept-new" >> "$GITHUB_ENV"

      - name: "Точечный checkout analysis/ на VPS + проверка баланса (только чтение)"
        env:
          COMMIT_SHA: ${{ inputs.commit_sha || github.sha }}
        run: |
          ssh $SSH_OPTS root@45.59.170.76 "
            set -euo pipefail
            sudo -u bot bash -c '
              set -euo pipefail
              if [ -r /etc/bot/env ]; then set -a; source /etc/bot/env; set +a; fi
              cd /home/bot/robinhood-chain-alpha
              git fetch origin $COMMIT_SHA
              git checkout $COMMIT_SHA -- analysis/
              cd analysis
              /home/bot/robinhood-chain-alpha/venv/bin/python task5_wallet_balance_check.py
            '
          " > /tmp/balance_stdout.log 2> /tmp/balance_stderr.log
          echo "--- stdout ---"; cat /tmp/balance_stdout.log
          echo "--- stderr ---"; cat /tmp/balance_stderr.log

      - name: Забрать data/task5_wallet_balance_check_result.json с VPS (если создан)
        run: |
          ssh $SSH_OPTS root@45.59.170.76 'cat /home/bot/robinhood-chain-alpha/data/task5_wallet_balance_check_result.json 2>/dev/null || true' > /tmp/balance_result.json
          if [ -s /tmp/balance_result.json ]; then
            cp /tmp/balance_result.json data/task5_wallet_balance_check_result.json
          fi

      - name: Commit results
        if: always()
        run: |
          git rm -f --ignore-unmatch data/p3_guard_cache/WALLET_BALANCE_CHECK_REQUEST
          [ -e data/task5_wallet_balance_check_result.json ] && git add data/task5_wallet_balance_check_result.json
          git diff --cached --quiet && exit 0
          git commit -m "Задача 5: проверка баланса кошелька, результат [automated]"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected, попытка $i/5 -- git pull --rebase и повтор"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep 3
          done
          echo "не удалось запушить после 5 попыток" >&2
          exit 1
