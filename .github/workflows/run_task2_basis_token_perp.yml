name: "Задача 2 -- базис токен/перп на Robinhood chain (Lighter x v3-пул, потолок 60 кредитов Mozila)"

# Владелец, 2026-09-10: потолок 60 кредитов на эту задачу, оценка на
# коротком окне ОБЯЗАТЕЛЬНА перед полным прогоном (реализовано в самом
# скрипте -- PROBE 1 день, реальная стоимость, экстраполяция, стоп
# если > потолка). OWNER_CONFIRMED_DEX_TRADES_ROBINHOOD=yes -- то же
# явное подтверждение правило, что для Задачи 1 OOS, здесь выставлено
# постоянно в env (владелец явно авторизовал самостоятельные решения
# в рамках потолков задач без переспроса, 2026-09-10).

on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/sc1-pons-v2-launcher-efdbyt
    paths:
      - "data/p3_guard_cache/TASK2_BASIS_TOKEN_PERP_REQUEST"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r analysis/requirements.txt
      - name: "Задача 2 -- базис токен/перп (PROBE + FULL, потолок 60 кредитов Mozila)"
        env:
          DUNE_API_KEY: ${{ secrets.DUNE_API_KEY_MOZILA }}
          CREDIT_GUARD_NAMESPACE: task2_basis_mozila
          CREDIT_GUARD_FILE: data/credits_spent_mozila.json
          OWNER_CONFIRMED_DEX_TRADES_ROBINHOOD: "yes"
        run: python -u analysis/task2_basis_token_perp.py
      - name: Commit results
        if: always()
        run: |
          git rm -f --ignore-unmatch data/p3_guard_cache/TASK2_BASIS_TOKEN_PERP_REQUEST
          [ -e data/p3_guard_cache/task2_basis_token_perp_result.json ] && git add data/p3_guard_cache/task2_basis_token_perp_result.json
          [ -e data/credits_spent_mozila.json ] && git add data/credits_spent_mozila.json
          git diff --cached --quiet && exit 0
          git commit -m "Задача 2: базис токен/перп, результат [automated]"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected, попытка $i/5 -- git pull --rebase и повтор"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep 3
          done
          echo "не удалось запушить после 5 попыток" >&2
          exit 1
