name: "Solana buyer_200 -- поток сигналов по 29 кандидатам за 7 суток (только счёт)"

# Только чтение -- Solana RPC (Alchemy/публичный). Резюмируемо, чекпоинт
# на кошелёк. Не трогает основной прогон 300 покупок.

on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/nifty-sagan-r0polg
    paths:
      - "data/p3_guard_cache/SOLANA_29_CANDIDATES_FLOW_REQUEST"

jobs:
  solana_29_candidates_flow:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests
      - name: "Поток сигналов по 29 кандидатам"
        env:
          ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
        run: python -u analysis/solana_29_candidates_flow.py
      - name: Commit results
        if: always()
        run: |
          git rm -f --ignore-unmatch data/p3_guard_cache/SOLANA_29_CANDIDATES_FLOW_REQUEST
          [ -e data/solana_29_candidates_flow_7d.json ] && git add data/solana_29_candidates_flow_7d.json
          git diff --cached --quiet && exit 0
          git commit -m "Solana buyer_200: поток сигналов по 29 кандидатам -- прогресс [automated]"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected, попытка $i/5 -- git pull --rebase и повтор"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep 3
          done
          echo "не удалось запушить после 5 попыток" >&2
          exit 1
