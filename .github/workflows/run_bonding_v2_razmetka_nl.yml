name: "Кривая pump.fun: раскладка BuyExactQuoteInV2 по цепи (только чтение)"

# ЗАЧЕМ. 28.09 семь копий источника 6qudAN2k сели с ошибкой ConstraintSeeds на
# счёте associated_user_volume_accumulator: мы дали один ключ, программа ждала
# другой, и пара одна и та же во всех семи. Этот прогон выясняет ПО ЦЕПИ, на
# каком месте стоит этот счёт и из каких семян он выводится -- сначала из IDL
# программы, если он выложен, иначе перебором, годным только при совпадении
# сразу на двух подписантах.
#
# Только чтение: getTransaction, getAccountInfo, getSignaturesForAddress.
# Ни подписи, ни отправки, денежный путь не трогаем.
on:
  workflow_dispatch:
    inputs:
      podpis:
        description: "подпись нашей неудачной покупки"
        required: false
        default: "2m2psJyLs45gpNTjH8ypxXCTS67Pv3skYMaQZ93CvpE95vofgnTuVVQB5yDgsjxUVVYcPKrPWW2cBx618CChGB8G"
      mint:
        description: "минт этой сделки"
        required: false
        default: "7ncdD1BiWSPG6U1SqtuopyLeRdyNSBwt4x18xnL69XMR"
      koshelek:
        description: "наш кошелёк (пусто -- подписант сделки)"
        required: false
        default: "4dPZMbReSobZVxfrzGLcD7xJN33pZhuUZix5HkTBTh4x"
      istochnik:
        description: "источник: найти его покупку того же минта"
        required: false
        default: "6qudAN2kV8mtCcYJxb5QQ6Vr15itdHHdeVbYm99NKMhy"
      dali:
        description: "ключ, который дали мы (из журнала ошибки)"
        required: false
        default: "6HX8mmdYYYZ79YMETXcLUydFq9Eef1Dy8SyRZx9Zu2Mh"
      zhdali:
        description: "ключ, который ждала программа"
        required: false
        default: "FJiTxtBCCeQPyXJ1RPbYPaNoM2dSvpwcqvdBaRGNhvu2"
      mesta_prodazhi_mint:
        description: "минт для карты мест продажи 27-счётной (пусто -- шаг не идёт)"
        required: false
        default: ""
      mesta_prodazhi_podpis:
        description: "подпись продажи ТОГО ЖЕ пула (внутри Jupiter тоже годится)"
        required: false
        default: ""
      mesta_prodazhi_schet:
        description: "счёт токена: взять подпись покупки из его истории (надёжнее журнала)"
        required: false
        default: ""

concurrency:
  group: bonding-v2-razmetka
  cancel-in-progress: false

env:
  ENV_DIR: /etc/bloom-executor
  TARGET_HOST: 127.0.0.1
  RABOTA: /tmp/bonding_v2
  # solders есть только в окружении службы -- системному python3 он не завезён.
  PY_HOSTA: /home/bot/robinhood-chain-alpha/venv/bin/python
  OUT_FILE: data/bonding_v2_razmetka.json
  OUT_MESTA: data/krivaya_27_mesta.json

jobs:
  razmetka:
    runs-on: ${{ fromJSON('["self-hosted","nl-host"]') }}
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/nifty-sagan-r0polg

      - name: "Сборка модулей"
        run: |
          set -e
          python3 -m py_compile analysis/bonding_v2_razmetka.py
          python3 -m py_compile analysis/krivaya_27_mesta.py

      - name: "SSH key"
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -e
          [ -n "$VPS_SSH_KEY" ] || { echo "SBOY: VPS_SSH_KEY ne zadan"; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          echo "SSH_OPTS=-i $HOME/.ssh/vps_key -o ConnectTimeout=15 -o BatchMode=yes -o StrictHostKeyChecking=accept-new" >> "$GITHUB_ENV"

      - name: "Раскладка на хосте"
        if: ${{ inputs.podpis != '' }}
        run: |
          set -e
          set -o pipefail
          ssh -n $SSH_OPTS root@$TARGET_HOST "install -d -m 755 $RABOTA"
          ssh $SSH_OPTS root@$TARGET_HOST "cat > $RABOTA/bonding_v2_razmetka.py" < analysis/bonding_v2_razmetka.py
          ssh -n $SSH_OPTS root@$TARGET_HOST "set -a; . $ENV_DIR/env; set +a; $PY_HOSTA $RABOTA/bonding_v2_razmetka.py --podpis '${{ inputs.podpis }}' --mint '${{ inputs.mint }}' --koshelek '${{ inputs.koshelek }}' --istochnik '${{ inputs.istochnik }}' --dali '${{ inputs.dali }}' --zhdali '${{ inputs.zhdali }}' --obrazcy '${{ inputs.istochnik }}' --vladelcy --schet '${{ inputs.dali }}' --schet '${{ inputs.zhdali }}' --out $RABOTA/out.json" | tail -120
          ssh -n $SSH_OPTS root@$TARGET_HOST "cat $RABOTA/out.json 2>/dev/null || true" > /tmp/bonding_v2.json || true
          if python3 -c "import json; json.load(open('/tmp/bonding_v2.json'))" 2>/dev/null; then
            cp /tmp/bonding_v2.json "$OUT_FILE"
            echo "obnovlen $OUT_FILE"
          else
            echo "SBOY: raskladka ne sobralas"
            exit 1
          fi
          ssh -n $SSH_OPTS root@$TARGET_HOST "rm -rf $RABOTA"

      # КАРТА МЕСТ ПРОДАЖИ 27-СЧЁТНОЙ РАЗНОВИДНОСТИ -- ИЗМЕРЕНИЕМ (п.2 (а) 02.10).
      # Шаг идёт ТОЛЬКО по названному минту: без пары покупка+продажа одного пула
      # карты нет, и угадывать её нельзя. Самопроверка модуля -- на хосте и ДО
      # любой сети: на бегунке solders нет, и там она была бы непроверяемой.
      - name: "Карта мест продажи 27-счётной разновидности (только чтение)"
        if: ${{ inputs.mesta_prodazhi_mint != '' && inputs.mesta_prodazhi_podpis != '' }}
        run: |
          set -e
          set -o pipefail
          ssh -n $SSH_OPTS root@$TARGET_HOST "install -d -m 755 $RABOTA"
          ssh $SSH_OPTS root@$TARGET_HOST "cat > $RABOTA/bonding_v2_razmetka.py" < analysis/bonding_v2_razmetka.py
          ssh $SSH_OPTS root@$TARGET_HOST "cat > $RABOTA/krivaya_27_mesta.py" < analysis/krivaya_27_mesta.py
          ssh -n $SSH_OPTS root@$TARGET_HOST "
            cd $RABOTA && PYTHONPATH=$RABOTA $PY_HOSTA $RABOTA/krivaya_27_mesta.py --self-test | tail -3"
          ssh -n $SSH_OPTS root@$TARGET_HOST "
            set -a; . $ENV_DIR/env; set +a
            cd $RABOTA
            env BLOOM_STATE_DIR=\$BLOOM_STATE_DIR HELIUS_API_KEY=\$HELIUS_API_KEY \
              PYTHONPATH=$RABOTA $PY_HOSTA $RABOTA/krivaya_27_mesta.py \
                --mint '${{ inputs.mesta_prodazhi_mint }}' \
                --schet '${{ inputs.mesta_prodazhi_schet }}' \
                --prodazha '${{ inputs.mesta_prodazhi_podpis }}' \
                --out $RABOTA/mesta.json" 2>&1 | tail -80 || echo "MESTA_NE_OK=1" >> "$GITHUB_ENV"
          ssh -n $SSH_OPTS root@$TARGET_HOST "cat $RABOTA/mesta.json 2>/dev/null || true" > /tmp/mesta.json || true
          if python3 -c "import json; json.load(open('/tmp/mesta.json'))" 2>/dev/null; then
            cp /tmp/mesta.json "$OUT_MESTA"
            echo "obnovlen $OUT_MESTA"
          else
            echo "SBOY: svodka karty mest ne sobralas"
            exit 1
          fi
          ssh -n $SSH_OPTS root@$TARGET_HOST "rm -rf $RABOTA"

      - name: "Ключей в отчёте быть не должно"
        if: always()
        run: |
          set -e
          for F in "$OUT_FILE" "$OUT_MESTA"; do
            if [ -f "$F" ]; then python3 deploy/checks/bez_klyuchey_v_otchete.py "$F"; fi
          done

      - name: "Коммит"
        if: always()
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for F in "$OUT_FILE" "$OUT_MESTA"; do
            if [ -f "$F" ]; then git add "$F"; fi
          done
          git diff --cached --quiet && { echo "nechego kommitit"; exit 0; }
          git commit -m "Bonding V2: raskladka po cepi [automated]"
          for i in 1 2 3 4 5; do
            git push origin HEAD:claude/nifty-sagan-r0polg && exit 0
            git pull --rebase -X theirs origin claude/nifty-sagan-r0polg
            sleep 3
          done
          exit 1
