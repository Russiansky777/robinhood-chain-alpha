name: "Solana buyer_200 -- расширенный прогон (до 300 покупок, короткие горизонты)"

# Возобновляемо: run_comparison() пропускает уже посчитанные (signature,
# seconds) из ранее закоммиченного step_extended_result.json и коммитит
# прогресс раз в ~12 минут (не после каждой точки) -- если джоба не
# уложится в таймаут, повторный dispatch продолжит с места остановки.

on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/nifty-sagan-r0polg
    paths:
      - "data/p3_guard_cache/SOLANA_BUYER200_STEP_EXTENDED_REQUEST"

jobs:
  step_extended:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests
      - name: "Восстановить кэш окон пулов из предыдущего запуска"
        # Найдено на 2-м прогоне: без этого кэша каждый рестарт (после
        # таймаута/сбоя) заново перелистывал уже собранные окна горячих
        # пулов с нуля (десятки-сотни тысяч подписей на общий минт).
        # НАЙДЕНО ПОВТОРНО на 5-м прогоне: единый actions/cache@v4 не
        # сохраняет кэш, если джоба завершилась через cancel (таймаут) --
        # его собственный post-шаг получает conclusion=skipped, а не
        # success, и лог начала каждого следующего прогона честно
        # показывает "Cache not found". Поскольку наши джобы ВСЕГДА
        # заканчиваются таймаутом (90 мин), кэш не работал НИ РАЗУ.
        # Раздельные restore/save (стандартный обход именно этого случая)
        # -- save идёт отдельным шагом с if: always(), значит выполняется
        # даже при отмене по таймауту.
        id: pool_cache
        uses: actions/cache/restore@v4
        with:
          path: data/solana_buyer_200/rpc_cache
          key: solana-buyer200-rpc-cache-${{ github.run_id }}
          restore-keys: |
            solana-buyer200-rpc-cache-
      - name: "Расширенный прогон: короткие горизонты на всех отобранных покупках"
        env:
          ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
        run: python -u analysis/solana_buyer200_fast_price.py --mode step_extended
      - name: "Сохранить кэш окон пулов (даже при отмене по таймауту)"
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/solana_buyer_200/rpc_cache
          key: solana-buyer200-rpc-cache-${{ github.run_id }}
      - name: Commit final results
        if: always()
        run: |
          git rm -f --ignore-unmatch data/p3_guard_cache/SOLANA_BUYER200_STEP_EXTENDED_REQUEST
          [ -e data/solana_buyer_200/step_extended_result.json ] && git add data/solana_buyer_200/step_extended_result.json
          [ -e data/solana_buyer_200/prior/current/buyer_100/route_meta.json ] && git add data/solana_buyer_200/prior/current/buyer_100/route_meta.json
          git diff --cached --quiet && exit 0
          git commit -m "Solana buyer_200: результат расширенного прогона (финал джобы) [automated]"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected, попытка $i/5 -- git pull --rebase и повтор"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep 3
          done
          echo "не удалось запушить после 5 попыток" >&2
          exit 1
