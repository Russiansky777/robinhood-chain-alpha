name: "P6 -- шаг 2: dry-run входа (ничего не отправляется, только чтение)"

on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/sc1-pons-v2-launcher-efdbyt
    paths:
      - "data/p3_guard_cache/P6_DRY_RUN_ENTRY_REQUEST"

jobs:
  dry_run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r analysis/requirements.txt
      - name: Определить целевой капитал LP (из маркера "capital_usd=NNN", по умолчанию 250 -- см. скрипт)
        id: capital
        run: |
          val=$(grep -oE 'capital_usd=[0-9.]+' data/p3_guard_cache/P6_DRY_RUN_ENTRY_REQUEST 2>/dev/null | cut -d= -f2 || true)
          echo "value=$val" >> "$GITHUB_OUTPUT"
          echo "целевой капитал LP: ${val:-<default из скрипта>}"
      - name: Dry-run входа P6 -- реальные суммы, тик-диапазон, маржа, ликвидация, газ, Across
        env:
          P6_TARGET_CAPITAL_USD: ${{ steps.capital.outputs.value }}
        run: python -u analysis/p6_dry_run_entry.py
      - name: Commit results
        if: always()
        run: |
          [ -e data/p3_guard_cache/p6_dry_run_entry_result.json ] && git add data/p3_guard_cache/p6_dry_run_entry_result.json
          git diff --cached --quiet && exit 0
          git commit -m "P6: dry-run входа (реальные числа, ничего не отправлено) [automated]"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected, попытка $i/5 -- git pull --rebase и повтор"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep 3
          done
          echo "не удалось запушить после 5 попыток" >&2
          exit 1
