name: "NL-хост: живучесть служб (только чтение)"

# Почасовая проверка живучести. ТОЛЬКО ЧТЕНИЕ: systemctl show/is-active,
# размеры журналов, признаки жизни. Ничего не запускается, не
# перезапускается и не правится. Ни одного ордера.
#
# Проверяются все четыре службы:
#   dbot-sold-guard     -- сторож проданных позиций DBot;
#   dbot-detect-probe   -- зонд обнаружения (замер, не торговля);
#   bloom-seller        -- сторож продаж Bloom (dry-run);
#   bloom-detector      -- детектор сигналов Bloom (только журнал).
#
# Отсутствие службы -- это факт, а не сбой: пишем "не установлена" и
# идём дальше. Падает job только если служба установлена и НЕ активна.
on:
  # ПОСЛЕДНЯЯ МИЛЯ ЖИВУЧЕСТИ -- СВОИМ РАСПИСАНИЕМ, А НЕ ЧУЖОЙ САМОПРОВЕРКОЙ.
  # Таймер хоста bloom-zhivuchest-chas пишет признаки жизни КАЖДЫЙ час, но в
  # ветку их везёт этот прогон, а запускала его почасовая самопроверка агента.
  # 03.10 вечером самопроверку перевели на раз в 3 часа (слово владельца) -- и
  # копия в ветке сразу стала отставать до трёх часов, а получасовая строка
  # балансов читает именно её. Своё расписание убирает эту связку: числа на
  # хосте и копия в ветке обновляются раз в час независимо от агента.
  schedule:
    - cron: "38 * * * *"
  workflow_dispatch:
    inputs:
      tail_decisions:
        description: "сколько последних решений детектора показать (0 -- не показывать)"
        required: false
        default: "0"
      diag_min:
        description: "разбор сбоев за N минут: журнал детектора + строки HANDLER_CRASHED/UNSOLD (0 -- не делать)"
        required: false
        default: "0"
      runner:
        description: "'nl' -- свой бегунок на хосте (по умолчанию), 'cloud' -- запасной облачный"
        required: false
        default: "nl"

concurrency:
  group: vps-health-nl
  cancel-in-progress: false

# СВОЙ БЕГУНОК, А НЕ ОБЛАЧНЫЙ (слово владельца 02.10, п.6). Ночью 02->03.10
# чужая сессия заняла облачные бегунки счёта одиннадцатью параллельными
# работами, и служебные прогоны встали в очередь: учёт на 27 минут, живучесть и
# чтение кошельков -- больше часа. Служебное чтение не должно зависеть от чужой
# очереди. Облачный путь остаётся запасным: вход runner=cloud.
jobs:
  health:
    runs-on: ${{ inputs.runner == 'cloud' && 'ubuntu-latest' || fromJSON('["self-hosted","nl-host"]') }}
    env:
      HOST: ${{ inputs.runner == 'cloud' && '45.59.170.76' || '127.0.0.1' }}
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/nifty-sagan-r0polg

      - name: "SSH key"
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -e
          [ -n "$VPS_SSH_KEY" ] || { echo "VPS_SSH_KEY не задан"; exit 1; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          echo "SSH_OPTS=-i $HOME/.ssh/vps_key -o ConnectTimeout=15 -o BatchMode=yes -o StrictHostKeyChecking=accept-new" >> $GITHUB_ENV

      - name: "Состояние служб"
        run: |
          set -e
          {
            echo "=== NL-хост, живучесть служб, $(date -u +%Y-%m-%dT%H:%M:%SZ) ==="
          } > data/vps_health_nl.txt
          FAIL=0
          for SVC in dbot-sold-guard dbot-detect-probe bloom-seller bloom-detector grpc-feed-probe; do
            OUT=$(ssh -n $SSH_OPTS root@$HOST "
              if ! systemctl list-unit-files --no-legend '$SVC.service' | grep -q .; then
                echo 'не установлена'
              else
                printf 'active=%s enabled=%s restarts=%s since=%s\n' \
                  \"\$(systemctl is-active $SVC 2>/dev/null)\" \
                  \"\$(systemctl is-enabled $SVC 2>/dev/null)\" \
                  \"\$(systemctl show -p NRestarts --value $SVC)\" \
                  \"\$(systemctl show -p ActiveEnterTimestamp --value $SVC)\"
              fi" || echo "ssh не ответил")
            echo "$SVC: $OUT" | tee -a data/vps_health_nl.txt
            case "$OUT" in
              "не установлена") ;;
              *active=active*) ;;
              *) echo "  ТРЕВОГА: $SVC установлена, но не активна"; FAIL=1 ;;
            esac
          done
          echo "FAIL=$FAIL" >> $GITHUB_ENV

      # ПАМЯТЬ ХОСТА И СЛУЖБ -- ПОСЛЕ OOM 08.10 23:18:34Z. Детектор был убит
      # OOM-killer'ом при MemoryMax=512M и пике 515.1M, и ни один отчёт этого
      # заранее не показывал: в живучести памяти не было вовсе. Теперь она
      # здесь, и по этому же блоку сверяется пик после подъёма предела
      # (слово владельца 09.10, п.1). Только чтение: free и systemctl show.
      - name: "Память хоста и служб"
        run: |
          set -e
          {
            echo ""
            echo "--- память хоста (MiB) ---"
          } >> data/vps_health_nl.txt
          ssh -n $SSH_OPTS root@$HOST "free -m" >> data/vps_health_nl.txt 2>&1 || \
            echo "ssh не ответил" >> data/vps_health_nl.txt
          {
            echo ""
            echo "--- память по службам (байты; MemoryPeak -- с последнего старта) ---"
          } >> data/vps_health_nl.txt
          for SVC in bloom-detector bloom-seller dbot-sold-guard dbot-detect-probe grpc-feed-probe; do
            # БЕЗ --value, И ЭТО НЕ МЕЛОЧЬ. С четырьмя -p и --value systemd
            # печатает ЧЕТЫРЕ ЧИСЛА БЕЗ ИМЁН, и порядок не тот, в котором
            # заданы флаги. 09.10 я на этом прочитал "MemoryMax=infinity,
            # MemoryHigh=512M" там, где в юните стоит MemoryMax=512M и
            # MemoryHigh не задан вовсе. Имя рядом со значением -- обязательно.
            OUT=$(ssh -n $SSH_OPTS root@$HOST "
              systemctl show $SVC -p MemoryCurrent -p MemoryPeak -p MemoryMax -p MemoryHigh \
                | tr '\n' ' '" || echo "ssh не ответил")
            echo "$SVC: $OUT" | tee -a data/vps_health_nl.txt
          done
          # ОТКУДА ВЗЯТ ПРЕДЕЛ. 09.10 живой юнит детектора показал
          # MemoryMax=infinity при MemoryHigh=512M, хотя прогон деплоя пишет
          # MemoryMax=512M: значит действует не то, что в прогоне, а врезка
          # (drop-in) или юнит от прежней версии. Без этих двух строк такое
          # расхождение не видно вовсе, а предел памяти -- это причина OOM.
          {
            echo ""
            echo "--- откуда предел памяти детектора ---"
          } >> data/vps_health_nl.txt
          ssh -n $SSH_OPTS root@$HOST "
            systemctl show bloom-detector -p FragmentPath -p DropInPaths
            grep -n -E 'Memory(Max|High|Limit)' /etc/systemd/system/bloom-detector.service \
              /etc/systemd/system/bloom-detector.service.d/*.conf 2>/dev/null \
              || echo 'строк Memory* в юните и врезках не найдено'" \
            >> data/vps_health_nl.txt 2>&1 || echo "ssh не ответил" >> data/vps_health_nl.txt

      - name: "Признаки жизни и журналы"
        run: |
          set -e
          {
            echo ""
            echo "--- признаки жизни ---"
            echo "(в списке и два файла СОСТОЯНИЯ денежного пути: реестр"
            echo " обкатки круга 0.01 и запомненные связанные накопители"
            echo " кривой v2 -- по ним сверяется вывод места 21, слово"
            echo " владельца 03.10 п.4. Ключей в них нет: это адреса.)"
          } >> data/vps_health_nl.txt
          ssh -n $SSH_OPTS root@$HOST "
            for f in /home/bot/bloom_executor_live_data/detector_status.json \
                     /home/bot/bloom_executor_live_data/seller_heartbeat.json \
                     /home/bot/bloom_executor_live_data/samoproverka_hosta.json \
                     /home/bot/bloom_executor_live_data/own_sell_obkatany.json \
                     /home/bot/bloom_executor_live_data/bonding_v2_assoc.json \
                     /home/bot/dbot_detect_probe/status.json \
                     /home/bot/grpc_feed_probe_data/heartbeat.json; do
              if [ -s \"\$f\" ]; then
                printf '%s (изменён %s):\n' \"\$f\" \"\$(date -u -r \"\$f\" +%Y-%m-%dT%H:%M:%SZ)\"
                # 24 000 знаков, а не 6 000: признак жизни детектора вырос, и
                # на 6 000 он обрывался ровно перед блоком own_send -- то есть
                # перед пределами полосы, её кошельком, пулом и nonce. Для
                # доклада по гейту нужен весь файл, а ключей в нём нет (это
                # проверяет отдельный шаг ниже).
                # СРЕЗ ГОВОРИТ О СЕБЕ. 03.10 на этом молчании я потерял час:
                # признак жизни детектора перерос 24 000 знаков, срез прошёл
                # внутри own_send, а поля тревог пишутся последними -- и по
                # собранному файлу выходило, что их нет вовсе. Я трижды искал
                # поломку в тревогах, которой не было, и один раз зря перезапускал
                # службу. Поэтому предел поднят, а при срезе печатается строка:
                # сколько показано из сколького. Молчаливый срез -- это ложь в
                # отчёте, пусть и без злого умысла; тот же комментарий выше уже
                # рассказывал про 6 000, и урок тогда взяли только наполовину.
                ZNAKOV=\$(wc -c < \"\$f\")
                head -c 120000 \"\$f\"; echo
                if [ \"\$ZNAKOV\" -gt 120000 ]; then
                  echo \"ОБРЕЗАНО: показано 120000 из \$ZNAKOV знаков -- конца файла НЕ видно\"
                else
                  echo \"показан ЦЕЛИКОМ: \$ZNAKOV знаков\"
                fi
              else
                echo \"\$f: нет или пуст\"
              fi
            done
            echo '--- размеры журналов ---'
            for f in /home/bot/bloom_executor_live_data/decisions.jsonl \
                     /home/bot/bloom_executor_live_data/positions.jsonl \
                     /home/bot/dbot_detect_probe/events.jsonl; do
              if [ -s \"\$f\" ]; then printf '%s: %s строк\n' \"\$f\" \"\$(wc -l < \"\$f\")\"; else echo \"\$f: нет или пуст\"; fi
            done
          " 2>&1 | tee -a data/vps_health_nl.txt

      - name: "Сводка решений детектора по кодам (только счётчики)"
        run: |
          set -e
          {
            echo ""
            echo "--- решения детектора по кодам ---"
          } >> data/vps_health_nl.txt
          # Без heredoc и без вложенного python: тело heredoc обязано стоять
          # в нулевой колонке и ломает YAML внутри блока run. Коды достаются
          # grep-ом -- журнал построчный JSON, этого достаточно для счётчиков.
          ssh -n $SSH_OPTS root@$HOST "
            F=/home/bot/bloom_executor_live_data/decisions.jsonl
            if [ -s \"\$F\" ]; then
              printf 'всего решений: %s\n' \"\$(wc -l < \"\$F\")\"
              printf 'первое: %s\n' \"\$(head -n 1 \"\$F\" | grep -oE '\"ts_utc\": ?\"[^\"]*\"' | head -n 1)\"
              printf 'последнее: %s\n' \"\$(tail -n 1 \"\$F\" | grep -oE '\"ts_utc\": ?\"[^\"]*\"' | head -n 1)\"
              echo 'по кодам:'
              grep -oE '\"code\": ?\"[^\"]*\"' \"\$F\" | sed 's/.*: *\"//; s/\"\$//' | sort | uniq -c | sort -rn
              echo 'по задачам источника:'
              grep -oE '\"source_task\": ?\"[^\"]*\"' \"\$F\" | sed 's/.*: *\"//; s/\"\$//' | sort | uniq -c | sort -rn
            else
              echo 'журнал решений пуст'
            fi
          " 2>&1 | tee -a data/vps_health_nl.txt

      - name: "Расход кредитов Helius по службам хоста"
        run: |
          set -e
          mkdir -p data/helius_usage
          # Осколки лежат в каталоге состояния: дерево репозитория службе
          # недоступно (ProtectHome=read-only). Забираем их поимённо, чтобы
          # расход хоста попал в тот же учёт, что и расход прогонов.
          # Имена переменных ТОЛЬКО латиницей: bash требует
          # [a-zA-Z_][a-zA-Z0-9_]*, а "СПИСОК=..." он разбирает как попытку
          # запустить команду с таким именем -- шаг падал молча, и bash -n
          # этого не видел.
          shards=$(ssh -n $SSH_OPTS root@$HOST "ls -1 /home/bot/bloom_executor_live_data/helius_usage/*.json 2>/dev/null || true")
          if [ -z "$shards" ]; then
            echo "осколков учёта на хосте нет" | tee -a data/vps_health_nl.txt
          else
            for f in $shards; do
              name=$(basename "$f")
              ssh -n $SSH_OPTS root@$HOST "cat $f" > "data/helius_usage/$name"
              echo "забран $name ($(wc -c < "data/helius_usage/$name") байт)" | tee -a data/vps_health_nl.txt
            done
          fi
          {
            echo ""
            echo "--- расход Helius за сегодня по всем службам ---"
          } >> data/vps_health_nl.txt
          python3 analysis/helius_usage_report.py | tee -a data/vps_health_nl.txt

      - name: "Забрать работу хостовых таймеров: выгрузка полосы, учёт, живучесть"
        if: always()
        run: |
          set -e
          # ПОСЛЕДНЯЯ МИЛЯ ДО ВЕТКИ ЕДЕТ ИМЕННО ЗДЕСЬ, И ЭТО НАЗВАНО, А НЕ
          # ОБОЙДЕНО. Работу делают таймеры хоста (bloom-uchet-chas,
          # bloom-zhivuchest-chas, bloom-vygruzka-sutki) -- их расписание не
          # зависит от планировщика GitHub, который за ночь 01->02.10 пропустил
          # пять назначенных прогонов учёта. Но САМ ХОСТ НА ВЕТКУ ПУШИТЬ НЕ
          # МОЖЕТ: он не рабочий клон нашей ветки, токена записи у него нет, и
          # заводить токен на торговой машине без слова владельца нельзя --
          # прямой пуш с хоста означал бы ключ с правом записи в репозиторий
          # рядом с ключами кошельков. Поэтому файлы ЗАБИРАЕТ этот прогон, как
          # он уже забирает осколки расхода Helius. Пропал этот прогон -- отстаёт
          # КОПИЯ в ветке, а не сами числа: они лежат на хосте и догонятся
          # следующим забором.
          # always() у шага значит, что он идёт и после падения шага выше. Без
          # ключа ssh он сделать ничего не может, и молчать об этом нельзя.
          [ -n "$SSH_OPTS" ] || { echo "SSH_OPTS пуст: шаг ключа не отработал"; exit 1; }
          TAJM_DIR=/home/bot/host_tajmery
          {
            echo ""
            echo "--- работа хостовых таймеров ---"
          } >> data/vps_health_nl.txt
          if ! ssh -n $SSH_OPTS root@$HOST "test -d $TAJM_DIR"; then
            echo "каталога хостовых таймеров нет: их ставит деплой детектора" \
              | tee -a data/vps_health_nl.txt
            exit 0
          fi
          # ИМЕНА ТАЙМЕРОВ БЕРУТСЯ ИЗ УСТАНОВЩИКА, А НЕ ИЗ ЭТОГО ФАЙЛА.
          # Здесь руками стояли три имени, а установщик ставит ПЯТЬ: два
          # таймера уборщика ренты (bloom-uborshchik-chas и
          # bloom-uborshchik-itog-sutki) эта проверка не смотрела вовсе.
          # В ночь 04.10 я увидел в отчёте "3 timers listed" и чуть не доложил
          # пропажу таймеров как тревогу -- а пропали они только из списка.
          # Проверка, которая смотрит не все таймеры и молчит об остальных,
          # хуже отсутствующей: она даёт ложное спокойствие. Поэтому имена
          # выводятся из deploy/hostovye_tajmery.py -- одного источника с
          # установщиком и с гейтом деплоя.
          IMENA=$(python3 -c "import re,pathlib; print(' '.join(\"'\" + и + \".timer'\" for и in re.findall(r'\"имя\":\s*\"([a-z0-9-]+)\"', pathlib.Path('deploy/hostovye_tajmery.py').read_text(encoding='utf-8'))))")
          [ -n "$IMENA" ] || { echo "ОТКАЗ: имён таймеров из установщика не добыто"; exit 1; }
          echo "имена таймеров из установщика: $IMENA" | tee -a data/vps_health_nl.txt
          ssh -n $SSH_OPTS root@$HOST "systemctl list-timers --all $IMENA --no-pager" \
            2>&1 | tee -a data/vps_health_nl.txt
          # СКОЛЬКО ЖДАЛИ, СТОЛЬКО И ДОЛЖНО БЫТЬ. Иначе "N timers listed"
          # читается как норма при любом N.
          #
          # СПРАШИВАЕМ КАЖДЫЙ ТАЙМЕР ПО ИМЕНИ, А НЕ РАЗБИРАЕМ ТАБЛИЦУ.
          # В list-timers последняя колонка -- ACTIVATES, то есть имя
          # .service, а не .timer. Я на этом уже спотыкался в гейте деплоя 188:
          # сравнение имени .timer с колонкой .service не совпадает НИКОГДА, и
          # проверка роняла зелёный деплой при живых таймерах. Здесь было бы
          # наоборот -- вечное "таймеров нет". Поэтому systemctl show по имени:
          # LoadState=loaded значит юнит есть, not-found значит его нет.
          ZHDALI=$(printf '%s\n' $IMENA | wc -l | tr -d ' ')
          SPISOK=$(printf '%s' "$IMENA" | tr -d "'")
          SOST=$(ssh -n $SSH_OPTS root@$HOST "for T in $SPISOK; do echo \"\$T \$(systemctl show \$T -p LoadState --value) \$(systemctl show \$T -p ActiveState --value)\"; done" 2>&1 || true)
          printf '%s\n' "$SOST" | tee -a data/vps_health_nl.txt
          NET=$(printf '%s\n' "$SOST" | awk '$2 != "loaded" {printf " %s", $1}')
          if [ -n "$NET" ]; then
            echo "ТАЙМЕРОВ НЕТ НА ХОСТЕ (ждали $ZHDALI):$NET" | tee -a data/vps_health_nl.txt
          else
            echo "все $ZHDALI таймеров установщика на месте (LoadState=loaded)" | tee -a data/vps_health_nl.txt
          fi
          # ДОКЛАД ЖИВУЧЕСТИ И СВЕЖИЙ ФАЙЛ УЧЁТА -- ПОД СВОИМИ ИМЕНАМИ.
          # ledger_status.json в ветке пишет прогон ledger_hourly.yml; затирать
          # его копией хоста нельзя -- это два разных счёта, и молча подменять
          # один другим значит потерять расхождение между ними.
          # ЖИВЫЕ ПОЛИТИКИ ГРУПП -- ПОД СВОИМ ИМЕНЕМ sources_live.json (слово
          # владельца 03.10, добавка п.4). ЗАЧЕМ. В ветке лежала копия
          # sources_2026-09-25.json, сделанная 28.09: в ней пять групп и нет ни
          # cand*, ни krug_001, ни konveyer -- то есть любой разбор по ней читал
          # вчерашний стенд и не знал об этом. Копия переименована в
          # sources_2026-09-25_USTAREL_2809.json, а живой файл забирается здесь
          # и зовётся live. Секретов в нём нет по построению: адреса источников и
          # числа политики, ключей кошельков там не бывает -- и шаг "ключей в
          # отчёте быть не должно" проверяет это у всего, что прогон коммитит.
          for PARA in "$TAJM_DIR/zhivuchest/zhivuchest.json data/zhivuchest_hosta.json" \
                      "/home/bot/data/sources_2026-09-25.json data/sources_live.json" \
                      "$TAJM_DIR/uchet/data/ledger_status.json data/ledger_status_hosta.json" \
                      "$TAJM_DIR/uborshchik_sutki.json data/uborshchik_sutki_hosta.json" \
                      "/home/bot/bloom_executor_live_data/trevogi.jsonl data/trevogi_hosta.jsonl" \
                      "/home/bot/bloom_executor_live_data/zapusk_zhurnal.jsonl data/zapusk_zhurnal_hosta.jsonl"; do
            OTKUDA=$(echo "$PARA" | cut -d' ' -f1)
            KUDA=$(echo "$PARA" | cut -d' ' -f2)
            if ssh -n $SSH_OPTS root@$HOST "test -s $OTKUDA"; then
              ssh -n $SSH_OPTS root@$HOST "cat $OTKUDA" > "$KUDA"
              # .jsonl -- ЭТО НЕ JSON ЦЕЛИКОМ, А ПО СТРОКЕ НА ОБЪЕКТ. Здесь
              # стоял один json.load на всё, и журнал тревог валил прогон
              # живучести каждый раз: "Extra data: line 2 column 1". Проверка
              # осталась настоящей -- просто разбирает тем же разбором, каким
              # файл написан, и падает на ПЕРВОЙ непригодной строке.
              python3 deploy/checks/json_ili_jsonl.py "$KUDA" || {
                echo "SBOY: $OTKUDA ne razbiraetsja -- fajl ne kommitim"
                rm -f "$KUDA"; exit 1; }
              echo "забран $OTKUDA -> $KUDA ($(wc -c < "$KUDA") байт)" | tee -a data/vps_health_nl.txt
            else
              echo "$OTKUDA: нет или пуст -- таймер ещё не отработал" | tee -a data/vps_health_nl.txt
            fi
          done
          # СУТОЧНАЯ ВЫГРУЗКА sdelki_polosy_<дата>: её ждёт Code-2 для сверки v6.
          # Берутся ВСЕ файлы каталога выгрузок, а не только сегодняшний: если
          # этот прогон пропустил сутки, вчерашняя выгрузка тоже должна доехать.
          FAJLY=$(ssh -n $SSH_OPTS root@$HOST "ls -1 $TAJM_DIR/vygruzki/sdelki_polosy_*.json 2>/dev/null || true")
          if [ -z "$FAJLY" ]; then
            echo "выгрузок полосы на хосте нет: таймер 06:00Z ещё не отрабатывал" \
              | tee -a data/vps_health_nl.txt
          fi
          for F in $FAJLY; do
            IMYA=$(basename "$F")
            # УЖЕ ЕСТЬ В ВЕТКЕ -- НЕ ЗАТИРАЕМ, А КЛАДЁМ РЯДОМ И ГОВОРИМ ЭТО.
            # Тот же файл умеет писать прогон run_vygruzka_sdelok_c2_nl.yml; если
            # он успел, его файл -- не хуже, и подменять его молча нельзя. Ровно
            # так 29.09 был затёрт образец транзакций для самопроверки c2_common.
            if [ -e "data/$IMYA" ]; then
              KUDA="data/${IMYA%.json}_s_hosta.json"
              echo "data/$IMYA уже в ветке (его написал прогон GitHub) -- копия хоста ляжет как $KUDA" \
                | tee -a data/vps_health_nl.txt
            else
              KUDA="data/$IMYA"
            fi
            ssh -n $SSH_OPTS root@$HOST "cat $F" > "$KUDA"
            SDELOK=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['сделок'])" "$KUDA") || {
              echo "SBOY: $F ne razbiraetsja kak vygruzka -- fajl ne kommitim"
              rm -f "$KUDA"; exit 1; }
            # Ключей в забранном файле быть не должно -- проверяем КАЖДЫЙ сразу,
            # а не образцом по каталогу: образец зацепил бы и прежние файлы
            # ветки, и весь прогон живучести падал бы из-за чужой строки.
            python3 deploy/checks/bez_klyuchey_v_otchete.py "$KUDA"
            echo "забрана выгрузка $IMYA -> $KUDA, сделок $SDELOK" | tee -a data/vps_health_nl.txt
          done
          python3 deploy/checks/bez_klyuchey_v_otchete.py data/zhivuchest_hosta.json data/ledger_status_hosta.json

      - name: "Свежесть признаков жизни (порог 10 минут)"
        if: always()
        run: |
          set -e
          {
            echo ""
            echo "--- возраст признаков жизни (порог 600 с) ---"
          } >> data/vps_health_nl.txt
          # Возраст СЧИТАЕТСЯ НА ХОСТЕ: часы бегунка и часы хоста -- разные
          # часы, и вычитать одно из другого значит мерить их расхождение.
          OUT=$(ssh -n $SSH_OPTS root@$HOST "
            NOW=\$(date +%s)
            for f in /home/bot/bloom_executor_live_data/detector_status.json \
                     /home/bot/bloom_executor_live_data/seller_heartbeat.json \
                     /home/bot/dbot_detect_probe/status.json \
                     /home/bot/grpc_feed_probe_data/heartbeat.json; do
              if [ -s \"\$f\" ]; then
                AGE=\$(( NOW - \$(stat -c %Y \"\$f\") ))
                if [ \"\$AGE\" -gt 600 ]; then STATE=СТАРШЕ_10_МИНУТ; else STATE=свежий; fi
                printf '%s: %s с (%s)\n' \"\$f\" \"\$AGE\" \"\$STATE\"
              else
                echo \"\$f: нет или пуст\"
              fi
            done")
          echo "$OUT" | tee -a data/vps_health_nl.txt
          case "$OUT" in
            *СТАРШЕ_10_МИНУТ*) echo "ТРЕВОГА: признак жизни старше 10 минут"; echo "STALE=1" >> $GITHUB_ENV ;;
            *) echo "STALE=0" >> $GITHUB_ENV ;;
          esac

      - name: "Службы новее модулей (старт позже mtime)"
        if: always()
        run: |
          set -e
          # ЗАЧЕМ. Деплой умеет доставить модуль и НЕ перезапустить службу:
          # тогда на хосте лежит новый код, а в памяти работает старый, и
          # снаружи это выглядит как "правка не работает". Проверяется прямо:
          # самый свежий модуль каталога кода против момента старта каждой
          # службы, которая эти модули читает. Оба времени берутся НА ХОСТЕ --
          # часы бегунка и часы хоста разные часы.
          #
          # МОДУЛИ ТАЙМЕРОВ В СЧЁТ НЕ ИДУТ, И ЭТО НЕ ПОСЛАБЛЕНИЕ. В каталоге
          # кода лежат не только модули служб: bloom_host_stroki.py зовут
          # хостовые юниты (получасовая строка и часовая самопроверка), а ни
          # детектор, ни сторож его не импортируют -- детектор читает только
          # ФАЙЛ его вердикта. 03.10 в 01:47Z этот модуль обновился, и проверка
          # с 02:10Z писала ТРЕВОГУ "служба работает со старым кодом" сразу у
          # двух служб, хотя их код не менялся. Ложная тревога здесь хуже
          # отсутствующей: она приучает не читать строку, и настоящий случай
          # пройдёт незамеченным. Поэтому такие модули из счёта исключены
          # СПИСКОМ, и список печатается рядом вместе с их временем -- спрятать
          # обновление файла он не может.
          {
            echo ""
            echo "--- старт служб против mtime модулей ---"
          } >> data/vps_health_nl.txt
          OUT=$(ssh -n $SSH_OPTS root@$HOST "
            NE_SLUZHB='bloom_host_stroki.py'
            MAXM=\$(stat -c '%Y %n' /home/bot/bloom_executor/*.py \
                   | grep -v -F \"/\$NE_SLUZHB\" | sort -n | tail -1)
            MAXT=\$(echo \"\$MAXM\" | cut -d' ' -f1)
            MAXF=\$(echo \"\$MAXM\" | cut -d' ' -f2-)
            printf 'самый свежий модуль служб: %s (%s)\n' \"\$MAXF\" \"\$(date -u -d @\$MAXT +%Y-%m-%dT%H:%M:%SZ)\"
            for N in \$NE_SLUZHB; do
              F=/home/bot/bloom_executor/\$N
              if [ -e \"\$F\" ]; then
                printf 'в счёт НЕ идёт (его зовут таймеры, службы не импортируют): %s (%s)\n' \
                  \"\$N\" \"\$(date -u -r \"\$F\" +%Y-%m-%dT%H:%M:%SZ)\"
              fi
            done
            for S in bloom-detector bloom-seller; do
              TS=\$(systemctl show -p ActiveEnterTimestamp --value \$S)
              if [ -z \"\$TS\" ]; then echo \"\$S: не запускалась\"; continue; fi
              ST=\$(date -d \"\$TS\" +%s)
              if [ \"\$ST\" -ge \"\$MAXT\" ]; then STATE=старт_позже_модулей; else STATE=СТАРЫЙ_КОД_В_ПАМЯТИ; fi
              printf '%s: старт %s, модули %s, %s (%s с)\n' \"\$S\" \"\$(date -u -d @\$ST +%Y-%m-%dT%H:%M:%SZ)\" \"\$(date -u -d @\$MAXT +%Y-%m-%dT%H:%M:%SZ)\" \"\$STATE\" \"\$(( ST - MAXT ))\"
            done")
          echo "$OUT" | tee -a data/vps_health_nl.txt
          case "$OUT" in
            *СТАРЫЙ_КОД_В_ПАМЯТИ*) echo "ТРЕВОГА: служба работает со старым кодом" ;;
            *) echo "все службы стартовали позже своих модулей" ;;
          esac

      - name: "Теневой журнал запусков: свод за час (только чтение)"
        if: always()
        run: |
          set -e
          # ЗАЧЕМ. Журнал пишется на хосте построчно, и без свода "он работает"
          # пришлось бы брать на веру. Здесь числа: созданий, из них с покупкой
          # создателя, сколько SOL создатели вложили и наш отрыв в слотах.
          # Окно -- последний час по часам БЕГУНКА: журнал пишет ts_utc, и
          # сравнение идёт строкой ISO, как и в воронке полосы.
          {
            echo ""
            echo "--- теневой журнал запусков: свод за час ---"
          } >> data/vps_health_nl.txt
          if [ ! -s data/zapusk_zhurnal_hosta.jsonl ]; then
            echo "журнала запусков на хосте нет или он пуст -- свода не будет" \
              | tee -a data/vps_health_nl.txt
          else
            S=$(python3 -c "import time; print(time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime(time.time()-3600)))")
            echo "окно: с $S" | tee -a data/vps_health_nl.txt
            PYTHONPATH=analysis python3 analysis/c1_zapusk_zhurnal.py --svod \
              data/zapusk_zhurnal_hosta.jsonl "$S" | tee -a data/vps_health_nl.txt
            echo "--- он же за весь журнал ---" | tee -a data/vps_health_nl.txt
            PYTHONPATH=analysis python3 analysis/c1_zapusk_zhurnal.py --svod \
              data/zapusk_zhurnal_hosta.jsonl | tee -a data/vps_health_nl.txt
          fi

      - name: "Врезка кривой v2/v3 жива на хосте (только чтение)"
        if: always()
        run: |
          set -e
          # ЗАЧЕМ. Деплой доставляет МОДУЛЬ и отдельно ДАННЫЕ, которые модуль
          # читает файлом. Сборщик по IDL берёт раскладки из /home/bot/data/idl;
          # без них врезка отказывает на каждом сигнале кривой, а снаружи это
          # молчание полосы -- ровно так она стояла 08.10. Проверка идёт ОТ
          # ПОЛЬЗОВАТЕЛЯ СЛУЖБЫ и его питоном: файл, доставленный root'ом с
          # чужими правами, служба не прочтёт, и узнать это надо здесь.
          #
          # Скрипт уходит на хост через stdin, поэтому кавычек в ssh нет вовсе.
          {
            echo ""
            echo "--- врезка кривой v2/v3 на хосте ---"
          } >> data/vps_health_nl.txt
          set +e
          OUT=$(ssh $SSH_OPTS root@$HOST "sudo -u bot env PYTHONPATH=/home/bot/bloom_executor /home/bot/robinhood-chain-alpha/venv/bin/python -" < deploy/checks/vrezka_krivoj_na_hoste.py 2>&1)
          RC=$?
          set -e
          echo "$OUT" | tee -a data/vps_health_nl.txt
          if [ "$RC" = "0" ]; then
            echo "врезка кривой на хосте: жива" | tee -a data/vps_health_nl.txt
          else
            echo "ТРЕВОГА: врезка кривой на хосте НЕ жива (код $RC)" | tee -a data/vps_health_nl.txt
          fi

      - name: "Разбор сбоев за окно (только чтение)"
        if: ${{ always() && inputs.diag_min != '0' && inputs.diag_min != '' }}
        run: |
          set -e
          {
            echo ""
            echo "--- сбои за последние ${{ inputs.diag_min }} минут ---"
          } >> data/vps_health_nl.txt
          # Решения: коды сбоев за окно. Журнал построчный JSON, поэтому
          # отбор grep-ом -- по коду, а окно -- по метке времени в строке.
          # ОТБОР ПО ВРЕМЕНИ, а не только по коду: без него шаг печатал
          # строки любой давности под заголовком "за последние N минут" --
          # то есть заголовок врал. Граница считается НА ХОСТЕ его же часами.
          CUTOFF=$(ssh -n $SSH_OPTS root@$HOST "date -u -d '-${{ inputs.diag_min }} min' +%Y-%m-%dT%H:%M:%SZ")
          echo "граница окна: $CUTOFF"
          ssh -n $SSH_OPTS root@$HOST "
            F=/home/bot/bloom_executor_live_data/decisions.jsonl
            if [ -s \"\$F\" ]; then
              FOUND=\$(grep -E 'HANDLER_CRASHED|UNSOLD|AUTO_PAUSE' \"\$F\" | awk -v c='$CUTOFF' 'match(\$0, /\"ts_utc\": ?\"[^\"]*\"/) { t = substr(\$0, RSTART, RLENGTH); gsub(/.*\"ts_utc\": ?\"/, \"\", t); gsub(/\".*/, \"\", t); if (t >= c) print }' | tail -n 20)
              if [ -n \"\$FOUND\" ]; then echo \"\$FOUND\"; else echo 'сбоев в окне нет'; fi
            else
              echo 'журнал решений пуст'
            fi
            echo '--- сторож продаж: UNSOLD и автопауза ---'
            # ЖУРНАЛ СТОРОЖА -- seller.jsonl, а НЕ seller_log.jsonl. Прежнего
            # имени на хосте нет вовсе, поэтому проверка печатала строку про
            # отсутствие журнала и при живых записях UNSOLD: греп был слепым с
            # самого начала (замечено 29.09).
            #
            # ВНУТРИ ЭТОЙ КОМАНДЫ НЕТ НИ ОДНОЙ НЕЭКРАНИРОВАННОЙ ДВОЙНОЙ КАВЫЧКИ,
            # ДАЖЕ В КОММЕНТАРИЯХ: команда ssh открыта двойной кавычкой, и любая
            # такая кавычка её закрывает, а остаток уезжает в локальную оболочку.
            # Ровно на этом прогон 11:24:36Z напечатал пустой раздел, и ровно это
            # поймала самопроверка кавычек при деплое.
            G=/home/bot/bloom_executor_live_data/seller.jsonl
            # ВЫВОД ЧЕРЕЗ ПЕРЕМЕННУЮ, А НЕ ЧЕРЕЗ || ПОСЛЕ КОНВЕЙЕРА: код
            # возврата у конвейера grep-tail -- это код tail, то есть всегда 0,
            # и ветка отсутствия строк не срабатывала бы вовсе.
            if [ -s \"\$G\" ]; then
              NAJD=\$(grep -E 'UNSOLD|автопауз' \"\$G\" | tail -n 10)
              if [ -n \"\$NAJD\" ]; then echo \"\$NAJD\"; else echo 'строк UNSOLD и автопауз в журнале сторожа нет'; fi
            else echo \"журнала сторожа \$G нет или он пуст\"; fi
          " 2>&1 | tee -a data/vps_health_nl.txt
          # Журнал службы: ТОЛЬКО он несёт traceback (log.exception). Берём
          # во временный файл и чистим от ключей ДО того, как он попадёт в
          # отчёт: в URL Helius ключ стоит прямо в строке запроса.
          ssh -n $SSH_OPTS root@$HOST "journalctl -u bloom-detector --since '-${{ inputs.diag_min }} min' --no-pager | tail -n 300" \
            > /tmp/detector_journal.txt 2>&1 || true
          python3 - <<'PY'
          import re, pathlib
          сырое = pathlib.Path("/tmp/detector_journal.txt").read_text(encoding="utf-8", errors="replace")
          чистое = re.sub(r"api-key=[A-Za-z0-9._\-]+", "api-key=СКРЫТ", сырое)
          чистое = re.sub(r"(?i)(x-token[\"']?\s*[:=]\s*)[A-Za-z0-9._\-]{8,}", r"\1СКРЫТ", чистое)
          чистое = re.sub(r"(?i)(bearer\s+)[A-Za-z0-9._\-]{8,}", r"\1СКРЫТ", чистое)
          отчёт = pathlib.Path("data/vps_health_nl.txt")
          отчёт.write_text(отчёт.read_text(encoding="utf-8", errors="replace")
                            + "\n--- журнал детектора (ключи вычищены) ---\n" + чистое,
                            encoding="utf-8")
          print("журнал детектора добавлен, строк:", чистое.count("\n"))
          PY

      - name: "Ключей в отчёте быть не должно"
        if: always()
        run: |
          set -e
          python3 - <<'PY'
          import re, sys, pathlib
          п = pathlib.Path("data/vps_health_nl.txt")
          т = п.read_text(encoding="utf-8", errors="replace") if п.exists() else ""
          плохо = [и for и, о in (("api-key", r"api-key=[A-Za-z0-9._\-]{8,}"),
                                   ("x-token", r"x-token[\"']?\s*[:=]\s*[A-Za-z0-9._\-]{8,}"),
                                   ("bearer", r"(?i)bearer\s+[A-Za-z0-9._\-]{20,}"))
                    if re.search(о, т)]
          if плохо:
              print("в отчёте видны значения: " + ", ".join(плохо)); sys.exit(1)
          print("ключей в отчёте нет")
          PY

      - name: "Хвост решений (по запросу)"
        # always(): если шаг выше упал, хвост журнала всё равно нужен --
        # именно он отвечает на вопрос про слоты.
        if: ${{ always() && inputs.tail_decisions != '0' && inputs.tail_decisions != '' }}
        run: |
          set -e
          {
            echo ""
            echo "--- последние ${{ inputs.tail_decisions }} решений ---"
          } >> data/vps_health_nl.txt
          ssh -n $SSH_OPTS root@$HOST "tail -n ${{ inputs.tail_decisions }} /home/bot/bloom_executor_live_data/decisions.jsonl 2>/dev/null || echo 'журнала нет'" \
            | tee -a data/vps_health_nl.txt

      - name: "Коммит отчёта"
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -f data/vps_health_nl.txt ] && git add data/vps_health_nl.txt
          # Осколки расхода тоже в репозиторий: иначе сводка печатается на
          # бегунке и исчезает вместе с ним, а проверить её потом нечем.
          git add -A data/helius_usage 2>/dev/null || true
          # РАБОТА ХОСТОВЫХ ТАЙМЕРОВ. Это и есть та последняя миля, которую хост
          # сам пройти не может: пушить на ветку ему нечем (токена нет, и
          # заводить его без слова владельца нельзя), поэтому его файлы
          # коммитятся отсюда. Суточные выгрузки берутся по образцу, а не
          # поимённо: их имя содержит дату.
          # СПИСОК КОММИТА -- ОБРАЗЦОМ, А НЕ ПОИМЁННО. Здесь стояли три
          # имени, а шаг забора выше возит уже четыре файла. 04.10 в 09:25Z
          # я добавил в забор журнал уборщика ренты, не заглянув в этот
          # список: файл приезжал на бегунок (278 байт в логе) и исчезал
          # вместе с ним, а в ветке его не было. Половина правки была
          # мёртвой, и отчёт при этом честно писал "забран" -- то есть лог
          # говорил правду, а проверить по ветке было нечего.
          # Образец data/*_hosta.json накрывает всё, что цикл забора
          # складывает под своим именем, включая то, что я добавлю позже.
          # git add неизменённого файла в diff не попадает, поэтому старые
          # копии образец не тащит.
          git add data/*_hosta.json 2>/dev/null || true
          # ЖУРНАЛ ТРЕВОГ -- .jsonl, И ПРЕЖНИЙ ШАБЛОН ЕГО НЕ БРАЛ. Ровно на
          # расхождении списка ЗАБОРА и списка КОММИТА я уже спотыкался 04.10
          # утром: файл уборщика приезжал на бегунок ("забран" в журнале) и
          # пропадал вместе с ним. Поэтому шаблон расширен, а не дописан
          # отдельным именем.
          git add data/*_hosta.jsonl 2>/dev/null || true
          [ -f data/sources_live.json ] && git add data/sources_live.json
          git add data/sdelki_polosy_*.json 2>/dev/null || true
          git diff --cached --quiet && { echo "нечего коммитить"; exit 0; }
          git commit -m "NL-хост: проверка живучести служб [automated]"
          for i in 1 2 3 4 5; do
            git push origin HEAD:claude/nifty-sagan-r0polg && exit 0
            git pull --rebase -X theirs origin claude/nifty-sagan-r0polg
            sleep 3
          done
          exit 1

      - name: "Итог: падаем, если служба мертва или признак жизни протух"
        run: |
          [ "$FAIL" = "0" ] || { echo "есть мёртвые службы -- см. отчёт выше"; exit 1; }
          [ "$STALE" = "0" ] || { echo "признак жизни старше 10 минут -- см. отчёт выше"; exit 1; }
          echo "все установленные службы активны, признаки жизни свежие"
