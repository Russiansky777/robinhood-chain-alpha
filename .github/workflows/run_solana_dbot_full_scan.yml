name: "Solana buyer_200 -- DBot: пагинация лидера, сверка с RPC, при сходимости скан 217"

on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/nifty-sagan-r0polg
    paths:
      - "data/p3_guard_cache/SOLANA_DBOT_FULL_SCAN_REQUEST"

jobs:
  dbot_full_scan:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests
      - name: "DBot пагинация + сверка с RPC + (если сошлось) скан 217"
        env:
          DBOT_API_KEY: ${{ secrets.DBOT_API_KEY }}
          ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: python -u analysis/solana_dbot_full_scan.py
      - name: Commit results
        if: always()
        run: |
          git rm -f --ignore-unmatch data/p3_guard_cache/SOLANA_DBOT_FULL_SCAN_REQUEST
          [ -e data/solana_dbot_full_scan.json ] && git add data/solana_dbot_full_scan.json
          git diff --cached --quiet && exit 0
          git commit -m "Solana buyer_200: DBot -- пагинация/сверка/скан 217 -- результат [automated]"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected, попытка $i/5 -- git pull --rebase и повтор"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep 3
          done
          echo "не удалось запушить после 5 попыток" >&2
          exit 1
