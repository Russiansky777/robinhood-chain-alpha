name: "Solana buyer_200 -- разведка Bitquery (Trading.Pairs/Trading.Trades, последние ~30 дней)"

# Узкая проверка (владелец, 2026-09-18): НЕ повтор уже закрытой линии
# Bitquery для Arc (docs/PROJECT_STATE.md, "ЗАКРЫТО ОКОНЧАТЕЛЬНО,
# 2026-09-17" -- тот вывод был про АРХИВНЫЕ данные). Здесь проверяется
# другая гипотеза: секундные свечи/сделки за последние ~30 дней через
# отдельный источник Trading.Pairs/Trading.Trades. Не трогает
# основной прогон (run_solana_buyer200_step_extended.yml).

on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/nifty-sagan-r0polg
    paths:
      - "data/p3_guard_cache/SOLANA_BITQUERY_PROBE_REQUEST"

jobs:
  solana_bitquery_probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests
      - name: "Разведка Bitquery: схема + сверка цен на известной покупке"
        env:
          BITQUERY_APIKEY: ${{ secrets.BITQUERY_APIKEY }}
        run: python -u analysis/solana_bitquery_probe.py
      - name: Commit results
        if: always()
        run: |
          git rm -f --ignore-unmatch data/p3_guard_cache/SOLANA_BITQUERY_PROBE_REQUEST
          [ -e data/solana_bitquery_probe_result.json ] && git add data/solana_bitquery_probe_result.json
          [ -e data/credits_spent_bitquery.json ] && git add data/credits_spent_bitquery.json
          git diff --cached --quiet && exit 0
          git commit -m "Solana buyer_200: результат разведки Bitquery (Trading.Pairs/Trades) [automated]"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected, попытка $i/5 -- git pull --rebase и повтор"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep 3
          done
          echo "не удалось запушить после 5 попыток" >&2
          exit 1
