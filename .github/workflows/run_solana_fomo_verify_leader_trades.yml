name: "Solana buyer_200 -- сверка истории сделок лидера через Fomo API"

# Только чтение -- GET к Fomo API, сверка с уже собранными данными с цепи.

on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/nifty-sagan-r0polg
    paths:
      - "data/p3_guard_cache/SOLANA_FOMO_VERIFY_LEADER_TRADES_REQUEST"

jobs:
  solana_fomo_verify_leader_trades:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests
      - name: "Сверка истории сделок лидера через Fomo"
        env:
          FOMO_API_KEY: ${{ secrets.FOMO_API_KEY }}
        run: python -u analysis/solana_fomo_verify_leader_trades.py
      - name: Commit results
        if: always()
        run: |
          git rm -f --ignore-unmatch data/p3_guard_cache/SOLANA_FOMO_VERIFY_LEADER_TRADES_REQUEST
          [ -e data/solana_fomo_verify_leader_trades_result.json ] && git add data/solana_fomo_verify_leader_trades_result.json
          git diff --cached --quiet && exit 0
          git commit -m "Solana buyer_200: сверка истории сделок лидера через Fomo [automated]"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected, попытка $i/5 -- git pull --rebase и повтор"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep 3
          done
          echo "не удалось запушить после 5 попыток" >&2
          exit 1
