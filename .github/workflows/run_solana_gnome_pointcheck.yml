name: "Solana buyer_200 -- точечная проверка докупки GNOME (~995 USDC, 18.09 ~15:31 UTC)"

# Разовая точечная проверка тем же методом, что основной прогон --
# не трогает основной прогон 300 покупок.

on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/nifty-sagan-r0polg
    paths:
      - "data/p3_guard_cache/SOLANA_GNOME_POINTCHECK_REQUEST"

jobs:
  solana_gnome_pointcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests
      - name: "Точечная проверка GNOME"
        env:
          ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
        run: python -u analysis/solana_gnome_pointcheck.py
      - name: Commit results
        if: always()
        run: |
          git rm -f --ignore-unmatch data/p3_guard_cache/SOLANA_GNOME_POINTCHECK_REQUEST
          [ -e data/solana_buyer_200/gnome_pointcheck_result.json ] && git add data/solana_buyer_200/gnome_pointcheck_result.json
          [ -e data/solana_buyer_200/prior/current/buyer_100/route_meta.json ] && git add data/solana_buyer_200/prior/current/buyer_100/route_meta.json
          git diff --cached --quiet && exit 0
          git commit -m "Solana buyer_200: результат точечной проверки GNOME [automated]"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected, попытка $i/5 -- git pull --rebase и повтор"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep 3
          done
          echo "не удалось запушить после 5 попыток" >&2
          exit 1
