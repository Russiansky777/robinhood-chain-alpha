name: "Задача 5, Путь А (минимальный) -- захват + гистограмма роутеров через relay (read-only)"

# Владелец, 2026-09-12 ('добавка'): "Гистограмма по уже собранным 5919
# сообщениям dry-run (диск, ноль сети)". ЧЕСТНО: тех сообщений на диске
# нет (см. докстринг task5_bot_router_capture.py) -- этот workflow делает
# РЕАЛЬНЫЙ новый захват через УЖЕ работающий локальный relay
# (ws://127.0.0.1:9642, loopback, БЕЗ кулдауна на переподключение) --
# relay НЕ трогается (ни один docker-вызов), ровно та же читающая
# нагрузка, что и обычный dry-run бота. Захват пишет decoded (to,data) на
# диск, гистограмма считается ПОСЛЕ, полностью офлайн (второй шаг этого
# workflow вообще не открывает сеть).
#
# Намеренно ТОЛЬКО workflow_dispatch, но БЕЗ текстового confirm-барьера --
# это read-only измерение (не деньги, не сигнатуры), тот же уровень
# осторожности, что run_task5_feed_relay_diag.yml/dryrun_smoketest.

on:
  workflow_dispatch:
    inputs:
      duration_seconds:
        description: 'Сколько секунд слушать relay для захвата (по умолчанию 300 = 5 минут).'
        required: false
        default: '300'
        type: string

jobs:
  capture_and_histogram:
    name: "Захват через relay + офлайн-гистограмма (Ohio VPS)"
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: SSH key + known_hosts
        env:
          VPS_SSH_KEY_OHIO: ${{ secrets.VPS_SSH_KEY_OHIO }}
        run: |
          set -e
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY_OHIO" > ~/.ssh/vps_key_ohio
          chmod 600 ~/.ssh/vps_key_ohio
          ssh-keyscan -T 10 3.151.160.108 >> ~/.ssh/known_hosts 2>/dev/null
          echo "SSH_OPTS=-i $HOME/.ssh/vps_key_ohio -o ConnectTimeout=15 -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 -o ServerAliveCountMax=6" >> "$GITHUB_ENV"

      - name: Подтянуть актуальный код на Ohio
        run: |
          ssh $SSH_OPTS ubuntu@3.151.160.108 '
            sudo -u bot git -C /home/bot/robinhood-chain-alpha fetch origin claude/nifty-sagan-r0polg
            sudo -u bot git -C /home/bot/robinhood-chain-alpha checkout claude/nifty-sagan-r0polg
            sudo -u bot git -C /home/bot/robinhood-chain-alpha reset --hard origin/claude/nifty-sagan-r0polg
            sudo -u bot git -C /home/bot/robinhood-chain-alpha log -1 --oneline
            sudo -u bot /home/bot/robinhood-chain-alpha/venv/bin/pip install -q -r /home/bot/robinhood-chain-alpha/analysis/requirements.txt
          '

      - name: "Захват decoded to/data через ws://127.0.0.1:9642 (relay, loopback, не трогаем контейнер)"
        run: |
          ssh $SSH_OPTS ubuntu@3.151.160.108 "
            sudo -u bot bash -c '
              cd /home/bot/robinhood-chain-alpha
              rm -f data/task5_bot_router_capture/dump.jsonl.gz data/task5_bot_router_capture_summary.json
              ./venv/bin/python analysis/task5_bot_router_capture.py --duration-seconds ${{ inputs.duration_seconds }} --feed-url ws://127.0.0.1:9642
            '
          " > /tmp/capture_stdout.log 2> /tmp/capture_stderr.log
          echo "--- stdout ---"; cat /tmp/capture_stdout.log
          echo "--- stderr ---"; cat /tmp/capture_stderr.log

      - name: "Офлайн-гистограмма (диск, ноль сети)"
        if: always()
        run: |
          ssh $SSH_OPTS ubuntu@3.151.160.108 '
            sudo -u bot bash -c "
              cd /home/bot/robinhood-chain-alpha
              ./venv/bin/python analysis/task5_bot_router_histogram.py
            "
          ' > /tmp/histogram_stdout.log 2> /tmp/histogram_stderr.log
          echo "--- stdout ---"; cat /tmp/histogram_stdout.log
          echo "--- stderr ---"; cat /tmp/histogram_stderr.log

      - name: Забрать результаты
        if: always()
        run: |
          ssh $SSH_OPTS ubuntu@3.151.160.108 'sudo -u bot cat /home/bot/robinhood-chain-alpha/data/task5_bot_router_capture_summary.json 2>/dev/null' > /tmp/capture_summary.json || true
          ssh $SSH_OPTS ubuntu@3.151.160.108 'sudo -u bot cat /home/bot/robinhood-chain-alpha/data/task5_bot_router_histogram_result.json 2>/dev/null' > /tmp/histogram_result.json || true
          ssh $SSH_OPTS ubuntu@3.151.160.108 'sudo -u bot cat /home/bot/robinhood-chain-alpha/data/task5_bot_router_capture/dump.jsonl.gz 2>/dev/null' > /tmp/dump.jsonl.gz || true

      - name: Commit results
        if: always()
        run: |
          mkdir -p data/p3_guard_cache data/task5_bot_router_capture
          {
            echo "# Захват + гистограмма роутеров через relay -- $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo ""
            echo "## capture stdout"; cat /tmp/capture_stdout.log 2>/dev/null || echo "(нет данных)"
            echo ""
            echo "## capture stderr"; cat /tmp/capture_stderr.log 2>/dev/null || echo "(нет данных)"
            echo ""
            echo "## histogram stdout"; cat /tmp/histogram_stdout.log 2>/dev/null || echo "(нет данных)"
            echo ""
            echo "## histogram stderr"; cat /tmp/histogram_stderr.log 2>/dev/null || echo "(нет данных)"
          } > data/p3_guard_cache/task5_bot_router_histogram_log.txt
          git add data/p3_guard_cache/task5_bot_router_histogram_log.txt

          if [ -s /tmp/capture_summary.json ] && python3 -c "import json; json.load(open('/tmp/capture_summary.json'))" 2>/dev/null; then
            cp /tmp/capture_summary.json data/task5_bot_router_capture_summary.json
            git add data/task5_bot_router_capture_summary.json
          fi
          if [ -s /tmp/histogram_result.json ] && python3 -c "import json; json.load(open('/tmp/histogram_result.json'))" 2>/dev/null; then
            cp /tmp/histogram_result.json data/task5_bot_router_histogram_result.json
            git add data/task5_bot_router_histogram_result.json
          fi
          if [ -s /tmp/dump.jsonl.gz ]; then
            cp /tmp/dump.jsonl.gz data/task5_bot_router_capture/dump.jsonl.gz
            git add data/task5_bot_router_capture/dump.jsonl.gz
          fi

          git diff --cached --quiet && exit 0
          git commit -m "Задача 5, Путь А: захват + гистограмма to x selector через relay [automated]"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected, попытка $i/5 -- git pull --rebase и повтор"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep 3
          done
          echo "не удалось запушить после 5 попыток" >&2
          exit 1
