name: "Fomo -- проверка комиссии 11% по реальному Swap-событию + хуки"

on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/nifty-sagan-r0polg
    paths:
      - "data/p3_guard_cache/FOMO_VERIFY_SWAP_FEE_HOOKS_REQUEST"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r analysis/requirements.txt
      - name: "фактическая комиссия из события Swap + хуки по битам адреса"
        env:
          ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
          ALCHEMY_ROBINHOOD_RPC_URL: ${{ secrets.ALCHEMY_ROBINHOOD_RPC_URL }}
        run: python -u analysis/fomo_verify_swap_fee_hooks.py
      - name: Commit results
        if: always()
        run: |
          git rm -f --ignore-unmatch data/p3_guard_cache/FOMO_VERIFY_SWAP_FEE_HOOKS_REQUEST
          [ -e data/fomo_fee_verification_result.json ] && git add data/fomo_fee_verification_result.json
          git diff --cached --quiet && exit 0
          git commit -m "Fomo: проверка комиссии 11% по реальному Swap-событию + хуки, результат [automated]"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected, попытка $i/5 -- git pull --rebase и повтор"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep 3
          done
          echo "не удалось запушить после 5 попыток" >&2
          exit 1
