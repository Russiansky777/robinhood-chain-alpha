name: "Форензика fomo -- п.2 базовая ставка (случайная выборка 2000 из универсума, кап 60 кредитов)"

on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/sc1-pons-v2-launcher-efdbyt
    paths:
      - "data/p3_guard_cache/FOMO_FORENSICS_P2_BASE_RATE_REQUEST"

jobs:
  base_rate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r analysis/requirements.txt
      - name: "п.2 базовая ставка (аккаунт Mozila, материализация + агрегат + выборка 2000, ручной кап 60 кредитов)"
        env:
          DUNE_API_KEY: ${{ secrets.DUNE_API_KEY_MOZILA }}
        run: python -u analysis/fomo_forensics_p2_base_rate.py
      - name: Commit results
        if: always()
        run: |
          git rm -f --ignore-unmatch data/p3_guard_cache/FOMO_FORENSICS_P2_BASE_RATE_REQUEST
          [ -e data/p3_guard_cache/fomo_forensics_p2_base_rate_result.json ] && git add data/p3_guard_cache/fomo_forensics_p2_base_rate_result.json
          [ -e data/p3_guard_cache/fomo_forensics_p2_sample_addresses.json ] && git add data/p3_guard_cache/fomo_forensics_p2_sample_addresses.json
          [ -e data/credits_spent_mozila.json ] && git add data/credits_spent_mozila.json
          git diff --cached --quiet && exit 0
          git commit -m "Форензика fomo: п.2 базовая ставка, результат [automated]"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected, попытка $i/5 -- git pull --rebase и повтор"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep 3
          done
          echo "не удалось запушить после 5 попыток" >&2
          exit 1
