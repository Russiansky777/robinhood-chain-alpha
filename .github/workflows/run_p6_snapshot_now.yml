name: "P6 -- запустить снимок один раз вручную (сразу после входа, не ждать cron)"

on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/sc1-pons-v2-launcher-efdbyt
    paths:
      - "data/p3_guard_cache/P6_SNAPSHOT_NOW_REQUEST"

jobs:
  snapshot_now:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: SSH key + known_hosts
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -e
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -T 10 45.59.170.76 >> ~/.ssh/known_hosts 2>/dev/null
          echo "SSH_OPTS=-i $HOME/.ssh/vps_key -o ConnectTimeout=15 -o BatchMode=yes -o StrictHostKeyChecking=accept-new" >> "$GITHUB_ENV"

      - name: Обновить репозиторий на VPS и запустить снимок один раз
        run: |
          ssh $SSH_OPTS root@45.59.170.76 '
            set -e
            sudo -u bot git -C /home/bot/robinhood-chain-alpha fetch origin claude/sc1-pons-v2-launcher-efdbyt
            sudo -u bot git -C /home/bot/robinhood-chain-alpha reset --hard origin/claude/sc1-pons-v2-launcher-efdbyt
            sudo -u bot /home/bot/bin/p6_hourly_snapshot.sh
          '

      - name: Забрать результат с VPS
        if: always()
        run: |
          ssh $SSH_OPTS root@45.59.170.76 'cat /home/bot/p6_live_data/p6_fee_accrual.jsonl' > /tmp/p6_fee_accrual.jsonl || true
          ssh $SSH_OPTS root@45.59.170.76 'cat /home/bot/robinhood-chain-alpha/data/p3_guard_cache/p6_live_snapshot_result.json' > /tmp/p6_live_snapshot_result.json || true
          mkdir -p data/p3_guard_cache
          [ -s /tmp/p6_fee_accrual.jsonl ] && cp /tmp/p6_fee_accrual.jsonl data/p6_fee_accrual.jsonl
          [ -s /tmp/p6_live_snapshot_result.json ] && cp /tmp/p6_live_snapshot_result.json data/p3_guard_cache/p6_live_snapshot_result.json

      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm -f --ignore-unmatch data/p3_guard_cache/P6_SNAPSHOT_NOW_REQUEST
          git add data/p6_fee_accrual.jsonl data/p3_guard_cache/p6_live_snapshot_result.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "P6: снимок вручную сразу после входа [automated]"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected, попытка $i/5 -- git pull --rebase и повтор"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep 3
          done
          echo "не удалось запушить после 5 попыток" >&2
          exit 1
