name: "Задача 5 -- гипотеза Mint/Burn ликвидности как альтернативного катализатора (RPC, без Dune)"

on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/nifty-sagan-r0polg
    paths:
      - "data/p3_guard_cache/TASK5_LIQUIDITY_CATALYST_CHECK_REQUEST"

jobs:
  liquidity_catalyst_check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests pycryptodome python-dotenv
      - name: "Mint/Burn в предыдущих 100 блоках относительно Swap-транзакций (реальный eth_getLogs)"
        env:
          ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
          ALCHEMY_ROBINHOOD_RPC_URL: ${{ secrets.ALCHEMY_ROBINHOOD_RPC_URL }}
        run: python -u analysis/task5_liquidity_catalyst_check.py
      - name: Commit results
        if: always()
        run: |
          git rm -f --ignore-unmatch data/p3_guard_cache/TASK5_LIQUIDITY_CATALYST_CHECK_REQUEST
          [ -e data/task5_liquidity_catalyst_check_result.json ] && git add data/task5_liquidity_catalyst_check_result.json
          git diff --cached --quiet && exit 0
          git commit -m "Задача 5: Mint/Burn ликвидность как катализатор -- результат [automated]"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected, попытка $i/5 -- git pull --rebase и повтор"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep 3
          done
          echo "не удалось запушить после 5 попыток" >&2
          exit 1
