name: "Polymarket lab-ams: суточный артефакт сырого (30) и пуш производных"

# ЗАЧЕМ (пункт 2 владельца 16.10): суточный артефакт сырого с retention 30 и
# пуш производных рядов в ветку -- ПРОГОНОМ НА БЕГУНКЕ lab-ams. Токен выдаёт
# сам GitHub на время прогона (GITHUB_TOKEN у actions/checkout), на диск машины
# он не ложится и после прогона не остаётся. Именно поэтому строка
# ExecStartPost с --push из документа Code-3 в юнит НЕ ставилась.
#
# ПОРЯДОК ШАГОВ ИЗ ДОКУМЕНТА, И МЕНЯТЬ ЕГО НЕЛЬЗЯ:
#   1) упаковать сырое за сутки;
#   2) загрузить артефакт (retention-days: 30 -- слово владельца, не 90);
#   3) ТОЛЬКО ЕСЛИ шаг 2 прошёл -- поставить отметку --otmetit-artefakt;
#   4) чистка (--rotacija) -- ОТДЕЛЬНЫМ таймером на машине в 05:11Z, здесь её
#      нет вовсе. Скрипт удаляет сырое только там, где отметка есть.
# Отметка после загрузки -- не формальность: без неё ротация не удалит ничего
# и назовёт сутки вслух ("ЖДУТ АРТЕФАКТА"), а пустая отметка (без имени
# артефакта) отбивается самим скриптом.
#
# СЫРОЕ В ВЕТКУ НЕ ИДЁТ ВОВСЕ. В коммит едут только data/polymarket/proizvodnye
# и data/polymarket/artefakty; архив сырого лежит в $RUNNER_TEMP, то есть ВНЕ
# рабочего дерева, и попасть в коммит не может. Ниже стоит отдельная проверка,
# которая отказывается пушить, если в индексе оказался хоть один путь сырого.
#
# РАСПИСАНИЕ GITHUB В ЭТОМ РЕПОЗИТОРИИ ОПАЗДЫВАЕТ НА ЧАСЫ -- замерено: 02:17Z
# у трендингов срабатывало в 07:28-09:27Z. Поэтому 03:23Z -- это "не раньше",
# а не "в". Для суточного артефакта это безразлично: сутки уже закрыты, а
# производные к этому времени посчитал таймер на машине.
on:
  schedule:
    # 03:23Z выбран документом Code-3: не 02:17Z (там суточный пуш трендингов
    # на lab-miami) и не 07:17Z (тяжёлые проходы архива).
    - cron: "23 3 * * *"
  workflow_dispatch:
    inputs:
      koren:
        description: "клон регистратора на lab-ams"
        required: false
        default: "/opt/polymarket-put"
      sutki:
        description: "сутки ГГГГ-ММ-ДД; пусто -- вчерашние по UTC"
        required: false
        default: ""
      otmechat:
        description: "'no' -- не ставить отметку об артефакте (только упаковать и загрузить)"
        required: false
        default: "yes"

concurrency:
  group: polymarket-ams-artefakt
  cancel-in-progress: false

env:
  KOREN_PM: "/opt/polymarket-put"
  VETKA_KODA: "claude/stroiteli"
  PUT_PROIZVODNYH: "data/polymarket/proizvodnye"
  PUT_OTMETOK: "data/polymarket/artefakty"
  OTMECHAT: "yes"
  TORGOVYJ_ZAPRESHCHEN: 45.59.170.76

jobs:
  artefakt:
    # МЕТКА ВЗЯТА ИЗ ЗАМЕРА, А НЕ УГАДАНА: имя службы бегунка на ящике
    # печатает сводка прогона установки. Прогон с несуществующей меткой не
    # краснеет, а ВИСИТ В ОЧЕРЕДИ -- то есть ошибка была бы молчаливой.
    # fromJSON -- тем же приёмом, каким задана метка у суточного пуша
    # трендингов на lab-miami.
    # ЗАМЕР: прогон 38939399893 напечатал METKA_BEGUNKA=lab-ams. Догадка
    # была другой (nl-host -- в репозитории есть прогон с такой меткой),
    # и она оказалась НЕВЕРНОЙ -- поэтому и мерили.
    runs-on: ${{ fromJSON('["self-hosted","lab-ams"]') }}
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/stroiteli
          fetch-depth: 1
          # ТОКЕН НА ДИСКЕ ЯЩИКА: СКАЗАНО ТОЧНО, А НЕ УМОЛЧАНО. При умолчании
          # persist-credentials действие кладёт токен прогона в .git/config
          # чекаута как http.extraheader И САМО УБИРАЕТ ЕГО в post-шаге --
          # это видно в журнале прогона 38940966546 строкой
          # 'git config --local --unset-all http.https://github.com/.extraheader'.
          # То есть секрета после прогона на диске не остаётся, но ВНУТРИ
          # прогона он там лежит. Альтернатива (persist-credentials: false и
          # токен в URL пуша) хуже: он попал бы в аргументы процесса, видимые
          # в ps. Тем же путём живёт суточный пуш трендингов на lab-miami.
          persist-credentials: true
          # ВЫБОРКА ТОЛЬКО ПРОИЗВОДНЫХ И ОТМЕТОК. По исходнику действия
          # (src/git-source-provider.ts): если filter не задан, но задан
          # sparseCheckout, fetchOptions.filter становится 'blob:none', то
          # есть выборка blobless включается сама. Дерево репозитория -- 8.77
          # ГБ, и тащить его на двухъядерный ящик незачем.
          # cone-mode выключен намеренно: в cone-режиме к выборке добавляются
          # файлы прямо в data/, а это сотни мегабайт мимо дела.
          sparse-checkout: |
            /data/polymarket/proizvodnye/
            /data/polymarket/artefakty/
          sparse-checkout-cone-mode: false

      - name: "ПРЕДОХРАНИТЕЛЬ: это не торговый хост"
        id: predohranitel
        run: |
          set -e
          # Прогон идёт НА МАШИНЕ, поэтому адрес проверяем у самой машины, а
          # не у переменной: сверяем все её адреса с торговым.
          SVOI=$(hostname -I 2>/dev/null || echo "")
          echo "adresa mashiny: ${SVOI:-neizvestny}"
          # ПРЕДОХРАНИТЕЛЬ НЕ ИМЕЕТ ПРАВА ОТКАЗЫВАТЬ "В ПОЛЬЗУ ПРОДОЛЖЕНИЯ".
          # Прежде при пустом выводе hostname -I цикл не выполнялся ни разу, и
          # шаг печатал "торгового среди адресов не найден" -- не проверив
          # ничего. Нет адресов -- нет и проверки, значит стоп.
          if [ -z "$SVOI" ]; then
            echo "STOP: adresa mashiny ne prochitalis, proverit nechem."
            exit 1
          fi
          for A in $SVOI; do
            if [ "$A" = "$TORGOVYJ_ZAPRESHCHEN" ]; then
              echo "STOP: eto torgovyj host. Nichego zdes ne delaem."
              exit 1
            fi
          done
          echo "hostname: $(hostname)"
          echo "torgovyj $TORGOVYJ_ZAPRESHCHEN sredi adresov ne najden -- prodolzhaem"

      - name: "Параметры: вход прогона сильнее умолчания"
        id: parametry
        env:
          VHOD_KOREN: ${{ inputs.koren }}
          VHOD_SUTKI: ${{ inputs.sutki }}
          VHOD_OTMECHAT: ${{ inputs.otmechat }}
        run: |
          set -e
          [ -n "$VHOD_KOREN" ] && echo "KOREN_PM=$VHOD_KOREN" >> "$GITHUB_ENV"
          [ -n "$VHOD_OTMECHAT" ] && echo "OTMECHAT=$VHOD_OTMECHAT" >> "$GITHUB_ENV"
          # СУТКИ ПО УМОЛЧАНИЮ -- ВЧЕРАШНИЕ ПО UTC: на 03:23Z они уже закрыты,
          # а сегодняшние ещё пишутся, и артефакт вышел бы неполным.
          if [ -n "$VHOD_SUTKI" ]; then
            SUTKI="$VHOD_SUTKI"
          else
            SUTKI=$(date -u -d yesterday +%F)
          fi
          case "$SUTKI" in
            [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]) : ;;
            *) echo "SBOJ: sutki '$SUTKI' ne pohozhi na GGGG-MM-DD"; exit 1 ;;
          esac
          echo "SUTKI=$SUTKI" >> "$GITHUB_ENV"
          echo "sutki: $SUTKI"
          echo "koren: ${VHOD_KOREN:-$KOREN_PM}"
          df -h / | tail -1

      - name: "1. Упаковать сырое за сутки (архив -- вне рабочего дерева)"
        id: pack
        run: |
          set -e
          set -o pipefail
          KOREN="$KOREN_PM"
          ARHIV="$RUNNER_TEMP/polymarket-syroe-$SUTKI.tar.gz"
          # АРХИВ ЛЕЖИТ В $RUNNER_TEMP, А НЕ В РЕПОЗИТОРИИ, и это не вкус:
          # из рабочего дерева он мог бы попасть в коммит, а сырое в ветку не
          # идёт вовсе (340 МБ в сутки при 100 рынках).
          case "$ARHIV" in
            "$GITHUB_WORKSPACE"/*) echo "SBOJ: arhiv vnutri rabochego dereva"; exit 1 ;;
          esac
          # ИСКЛЮЧАЕМ ПРОИЗВОДНЫЕ И ОТМЕТКИ: они едут в ветку коммитом, и в
          # архиве сырого им делать нечего. Раскрой у них такой же
          # (<каталог>/<дата>/), поэтому без исключения они бы попали.
          KATALOGI=$(cd "$KOREN" && find data/polymarket -mindepth 2 -maxdepth 2 \
                     -type d -name "$SUTKI" \
                     -not -path 'data/polymarket/proizvodnye/*' \
                     -not -path 'data/polymarket/artefakty/*' | sort)
          if [ -z "$KATALOGI" ]; then
            echo "SBOJ: za $SUTKI syryh katalogov net ni u odnogo spiska."
            echo "Eto ne pustaja formalnost: sutki bez syrogo znachat, chto sbor"
            echo "stojal -- imenno takuju tihuju poterju i lovim."
            exit 1
          fi
          echo "--- chto upakovyvaem ---"
          printf '%s\n' "$KATALOGI" | sed 's/^/  /'
          # ПУСТОЕ СЫРОЕ -- НЕ ПОВОД СТАВИТЬ ОТМЕТКУ (замечание Code-4).
          # Каталоги суток могут СУЩЕСТВОВАТЬ и быть пустыми: таймер создал
          # их и не записал ни байта (ровно так вышло 15.10, когда диск был
          # полон). Отметка означает "сырое за эти сутки уехало в артефакт" и
          # ОТКРЫВАЕТ ротации удаление; поставить её на пустые сутки значит
          # разрешить удалить то, чего и не было, и записать в историю ложь.
          # Поэтому считаем ФАЙЛЫ и БАЙТЫ, а не каталоги, и при нуле
          # отказываемся ДО загрузки -- тогда и шаг отметки не пойдёт.
          FAJLOV_SYROGO=0
          BAJT_SYROGO=0
          while IFS= read -r K; do
            [ -n "$K" ] || continue
            N=$(find "$KOREN/$K" -type f -name '*.jsonl.gz' 2>/dev/null | wc -l)
            B=$(find "$KOREN/$K" -type f -name '*.jsonl.gz' -printf '%s\n' 2>/dev/null \
                | awk '{s += $1} END {printf "%d", s + 0}')
            FAJLOV_SYROGO=$((FAJLOV_SYROGO + N))
            BAJT_SYROGO=$((BAJT_SYROGO + B))
          done <<SPISOK
          $KATALOGI
          SPISOK
          echo "syryh fajlov za $SUTKI: $FAJLOV_SYROGO, bajt: $BAJT_SYROGO"
          if [ "$FAJLOV_SYROGO" -eq 0 ] || [ "$BAJT_SYROGO" -eq 0 ]; then
            echo "SBOJ: katalogi za $SUTKI est, a syrogo v nih NET (fajlov"
            echo "$FAJLOV_SYROGO, bajt $BAJT_SYROGO). Artefakt ne gruzim i otmetku NE"
            echo "stavim: otmetka otkryvaet rotacii udalenie, i na pustyh sutkah ona"
            echo "razreshila by udalit to, chego ne bylo."
            exit 1
          fi
          # gzip -1: тела снимков УЖЕ в gzip, второй проход почти ничего не
          # жмёт, а на двухъядерном ящике стоит времени.
          printf '%s\n' "$KATALOGI" \
            | tar -I 'gzip -1' -cf "$ARHIV" -C "$KOREN" -T -
          RAZMER=$(stat -c %s "$ARHIV")
          echo "arhiv: $ARHIV, $RAZMER B ($((RAZMER / 1048576)) MB)"
          echo "arhiv=$ARHIV" >> "$GITHUB_OUTPUT"
          echo "sutki=$SUTKI" >> "$GITHUB_OUTPUT"
          echo "razmer=$RAZMER" >> "$GITHUB_OUTPUT"
          echo "syryh_fajlov=$FAJLOV_SYROGO" >> "$GITHUB_OUTPUT"
          # ОПИСЬ АРХИВА -- В ФАЙЛ, А НЕ В КОНВЕЙЕР С head, И ЭТО ЗАМЕР, А НЕ
          # ОСТОРОЖНОСТЬ. Прогон 38940276494 упал ровно здесь: было
          # 'tar -tzf "$ARHIV" | head -5', head закрыл конвейер после пятой
          # строки, tar получил EPIPE и напечатал "tar: stdout: write error",
          # а при set -o pipefail это код шага 2 -- и загрузку артефакта
          # ПРОПУСТИЛИ, хотя архив был собран (5 333 669 Б, девять списков).
          # Своя же локальная проверка этого не поймала: в подставном архиве
          # было 4 записи, и head -5 конвейер не закрывал. Теперь один проход
          # tar в файл, и оба числа читаются из него.
          OPIS="$RUNNER_TEMP/opis-$SUTKI.txt"
          tar -tzf "$ARHIV" > "$OPIS"
          sed -n '1,5p' "$OPIS" | sed 's/^/  v arhive: /'
          echo "fajlov v arhive: $(wc -l < "$OPIS")"

      - name: "2. Загрузить артефакт (retention 30 -- слово владельца)"
        id: up
        uses: actions/upload-artifact@v4
        with:
          name: polymarket-syroe-${{ steps.pack.outputs.sutki }}
          path: ${{ steps.pack.outputs.arhiv }}
          retention-days: 30
          # error, А НЕ warn: отметка об артефакте ставится следующим шагом, и
          # поставить её без загруженного артефакта -- значит открыть ротации
          # удаление сырого, которого больше нигде нет.
          if-no-files-found: error
          # Содержимое уже сжато (tar.gz из gzip-снимков) -- второй проход zip
          # не даёт почти ничего, а время на двух ядрах стоит.
          compression-level: 0

      - name: "3. Отметка -- ТОЛЬКО после удачной загрузки"
        if: ${{ success() && env.OTMECHAT != 'no' }}
        run: |
          set -e
          set -o pipefail
          KOREN="$KOREN_PM"
          ID="${{ steps.up.outputs.artifact-id }}"
          URL="${{ steps.up.outputs.artifact-url }}"
          # ПУСТОЙ id -- ОТКАЗ. Пустая отметка (без имени артефакта) отбивается
          # и самим скриптом, но ловить её надо здесь: иначе шаг прошёл бы
          # "успешно", ничего не подтвердив.
          if [ -z "$ID" ]; then
            echo "SBOJ: zagruzka ne vernula artifact-id -- otmetku ne stavlju"
            exit 1
          fi
          echo "artefakt id: $ID"
          echo "artefakt url: ${URL:-net}"
          cd "$KOREN"
          python3 analysis/polymarket_put.py --otmetit-artefakt "$SUTKI" --artefakt "$ID"
          echo "--- otmetka na mashine ---"
          ls -l "$KOREN/$PUT_OTMETOK" | tail -5

      - name: "Производные и отметки -- в рабочее дерево ветки (без --delete)"
        id: perenos
        # ПЕРЕНОС НЕ ИМЕЕТ ПРАВА ИДТИ ПОВЕРХ КРАСНОГО ПРЕДОХРАНИТЕЛЯ. Голый
        # always() здесь был дырой ровно того же вида, какую я закрыл на шаг
        # ниже: если предохранитель отказал (адрес совпал с торговым либо
        # hostname -I ничего не выдал) или параметры не разобрались, перенос
        # всё равно шёл, выходил зелёным -- и ОТКРЫВАЛ пуш, потому что пуш
        # опирается на исход переноса. Теперь перенос требует зелёных
        # предохранителя и параметров, но по-прежнему НЕ зависит от упаковки и
        # загрузки артефакта: производные к ним отношения не имеют.
        if: ${{ always() && job.status != 'cancelled'
                && steps.predohranitel.outcome == 'success'
                && steps.parametry.outcome == 'success' }}
        run: |
          set -e
          set -o pipefail
          KOREN="$KOREN_PM"
          mkdir -p "$PUT_PROIZVODNYH/$SUTKI" "$PUT_OTMETOK"
          # ПЕРЕНОСИМ ТОЛЬКО НАЗВАННЫЕ СУТКИ, И ЭТО НЕ АККУРАТНОСТЬ, А
          # ИСПРАВЛЕНИЕ ПОДТВЕРЖДЁННОЙ НАХОДКИ. Прежде перенос забирал ВЕСЬ
          # каталог производных, и каждая ночь уносила в ветку заново все
          # часовые файлы всех суток, какие ещё есть в сыром. Почему: юнит на
          # ящике зовёт --proizvodnye БЕЗ --sutki, то есть пересчитывает все
          # сутки, а питоновский gzip-писатель штампует в заголовок MTIME
          # текущее время -- замерено: два пересчёта ОДНИХ И ТЕХ ЖЕ данных
          # дают разные sha256. Значит для git это новые блобы: при 30 сутках
          # сырого выходило около 720 файлов за ночь, и так каждую ночь, в
          # дерево, которое и без того 8.77 ГБ. Проверка предела 95 МБ этого
          # не ловила -- она смотрит размер ОДНОГО файла.
          # Старые сутки от этого не теряются: каждые сутки уехали своей
          # ночью, а пропущенные догоняются ручным запуском с sutki=<дата>.
          if [ -d "$KOREN/$PUT_PROIZVODNYH/$SUTKI" ]; then
            rsync -a "$KOREN/$PUT_PROIZVODNYH/$SUTKI/" "$PUT_PROIZVODNYH/$SUTKI/" \
              || cp -r "$KOREN/$PUT_PROIZVODNYH/$SUTKI/." "$PUT_PROIZVODNYH/$SUTKI/"
          else
            echo "VNIMANIE: na mashine net $PUT_PROIZVODNYH/$SUTKI -- tajmer"
            echo "polymarket-proizvodnye v 03:23Z libo ne shjol, libo nechego bylo schitat."
          fi
          # Отметка -- один файл за эти сутки, а не весь каталог отметок.
          if [ -f "$KOREN/$PUT_OTMETOK/$SUTKI.json" ]; then
            cp -f "$KOREN/$PUT_OTMETOK/$SUTKI.json" "$PUT_OTMETOK/$SUTKI.json"
          fi
          echo "--- chto polozheno ---"
          echo "proizvodnyh na mashine za $SUTKI: $(find "$KOREN/$PUT_PROIZVODNYH/$SUTKI" -type f 2>/dev/null | wc -l)"
          echo "proizvodnyh na mashine vsego:     $(find "$KOREN/$PUT_PROIZVODNYH" -type f 2>/dev/null | wc -l)"
          echo "za $SUTKI v dereve:               $(find "$PUT_PROIZVODNYH/$SUTKI" -type f 2>/dev/null | wc -l)"
          echo "otmetka za $SUTKI v dereve:       $([ -f "$PUT_OTMETOK/$SUTKI.json" ] && echo est || echo net)"
          # ПРЕДЕЛ GITHUB ПРОВЕРЯЕТСЯ ДО ПУША: файл крупнее 100 МБ сервер
          # отвергает наотрез, и узнать об этом из отказа пуша хуже, чем из
          # своей же проверки с названным размером.
          PREDEL=$((95 * 1024 * 1024))
          KRUPNYE=$(find "$PUT_PROIZVODNYH/$SUTKI" "$PUT_OTMETOK" -type f \
                    -size +$((PREDEL / 1024))k -printf '%s %p\n' 2>/dev/null || true)
          if [ -n "$KRUPNYE" ]; then
            echo "OTKAZ: est fajly krupnee 95 MB -- GitHub ih ne primet:"
            echo "$KRUPNYE" | awk '{printf "  %8.1f MB  %s\n", $1/1048576, $2}'
            exit 1
          fi
          echo "fajlov krupnee 95 MB net"
          # СЫРОЕ ЕСТЬ, А ПРОИЗВОДНЫХ НЕТ -- ЭТО НЕ ПОВОД ВЫЙТИ ЗЕЛЁНЫМ.
          # Упаковка выше доказала, что за эти сутки сырьё на ящике ЕСТЬ.
          # Значит таймер polymarket-proizvodnye обязан был их посчитать
          # (юнит зовёт --proizvodnye без --sutki, то есть пересчитывает все
          # сутки). Если производных за эти сутки нет -- таймер не шёл либо
          # упал, и ночь прошла бы впустую при зелёном прогоне. Молчаливая
          # потеря -- худший исход, её и ловим.
          # На плановом прогоне это ОТКАЗ; на ручном запуске (dispatch)
          # громкое предупреждение: вручную мы часто целимся в сегодняшние
          # сутки, которых таймер ещё не считал.
          ZA_SUTKI=$(find "$PUT_PROIZVODNYH/$SUTKI" -type f 2>/dev/null | wc -l)
          if [ "$ZA_SUTKI" -eq 0 ]; then
            echo "VNIMANIE: za $SUTKI syroe upakovano, a proizvodnyh NET ni odnoj."
            echo "Znachit tajmer polymarket-proizvodnye za eti sutki ne schital."
            if [ "${GITHUB_EVENT_NAME:-}" = "schedule" ]; then
              echo "SBOJ: planovyj progon -- eto otkaz, a ne zamechanie."
              exit 1
            fi
            echo "(ruchnoj zapusk -- prodolzhaju, no chislo nazvano)"
          else
            echo "proizvodnyh za $SUTKI: $ZA_SUTKI"
          fi

      - name: "Пуш производных в ветку claude/stroiteli (токен от GitHub)"
        # ЗАВИСИМОСТЬ ОТ ПЕРЕНОСА -- НЕ ФОРМАЛЬНОСТЬ. При одном always()
        # проверка предела 95 МБ внутри переноса НИЧЕГО не останавливала:
        # перенос краснел, а пуш всё равно шёл и уносил в ветку то, что
        # проверка забраковала. Теперь пуш идёт только после зелёного
        # переноса, но по-прежнему не зависит от упаковки и загрузки
        # артефакта -- производные к ним отношения не имеют.
        if: ${{ always() && job.status != 'cancelled' && steps.perenos.outcome == 'success' }}
        run: |
          set -e
          set -o pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # ПУТИ КОММИТА СОБИРАЮТСЯ ИЗ ТОГО, ЧТО РЕАЛЬНО ЕСТЬ, И ЭТО ЗАМЕР:
          # 'git commit -- data/polymarket/artefakty' по пути, под которым нет
          # ни одного файла, отказывает с "pathspec did not match any file(s)
          # known to git" -- проверено у себя, код 1. А на ветке
          # claude/stroiteli каталога data/polymarket нет ВОВСЕ, то есть
          # первый же прогон с производными и без отметки (otmechat: no) упал
          # бы ровно здесь. Путь попадает в список, только если под ним есть
          # файлы на диске либо он уже отслеживается в ветке.
          #
          # И СОБИРАЮТСЯ ДО ПРАВКИ ИНДЕКСА -- тот же урок, что у суточного
          # пуша трендингов: посчитать после правки значит потерять путь,
          # который правка только что опустошила.
          # ПУТИ -- ТОЛЬКО ЗА НАЗВАННЫЕ СУТКИ: каталог производных этих
          # суток и один файл отметки. Иначе коммит уносил бы все сутки
          # заново (см. причину в шаге переноса), а сообщение коммита при
          # этом врало бы: оно называет $SUTKI.
          SOBRAT_PUTI() {
            for P in "$PUT_PROIZVODNYH/$SUTKI" "$PUT_OTMETOK/$SUTKI.json"; do
              if [ -n "$(find "$P" -type f -print -quit 2>/dev/null)" ] \
                 || [ -f "$P" ] \
                 || git ls-files --error-unmatch -- "$P" >/dev/null 2>&1; then
                printf '%s ' "$P"
              fi
            done
          }
          # --ignore-removal: ЧТОБЫ ПЕРЕНОС ОСТАЛСЯ ДОБАВЛЯЮЩИМ. С git 2.0
          # обычный 'git add <путь>' заносит И УДАЛЕНИЯ -- проверено у себя
          # ('D d/b.txt'), а с --ignore-removal индекс чист. Внутри цикла
          # повторов мы делаем reset на НОВУЮ вершину ветки, и файл, который
          # кто-то положил туда между нашим checkout и пушем, оказался бы
          # удалён нашим же коммитом.
          STAVIM() {
            # shellcheck disable=SC2086
            git add --ignore-removal -- $1
          }
          PUTI_TEK=$(SOBRAT_PUTI)
          if [ -z "$PUTI_TEK" ]; then
            echo "nechego pushit za $SUTKI: ni proizvodnyh, ni otmetki -- ni na mashine, ni v vetke"
            echo "NASH_KOMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "puti kommita: $PUTI_TEK"
          STAVIM "$PUTI_TEK"
          # СЫРОЕ В ИНДЕКСЕ -- ОТКАЗ, И ЭТО ПРОВЕРКА, А НЕ ОБЕЩАНИЕ. В ветку
          # едут только производные и отметки; всё прочее под data/polymarket
          # (книги, цены, сделки) -- сырое, 340 МБ в сутки, ему в истории git
          # места нет.
          # ПРОВЕРЯЕМ ВЕСЬ ИНДЕКС, А НЕ ТОЛЬКО data/polymarket: ниже коммит
          # идёт БЕЗ путей, из индекса, и этот замок должен покрывать всё.
          LISHNEE=$(git diff --cached --name-only \
                    | grep -vE "^($PUT_PROIZVODNYH/$SUTKI/|$PUT_OTMETOK/$SUTKI[.]json$)" || true)
          if [ -n "$LISHNEE" ]; then
            echo "OTKAZ: v indekse puti vne proizvodnyh i otmetok:"
            printf '%s\n' "$LISHNEE" | sed -n '1,10p' | sed 's/^/  /'
            exit 1
          fi
          # shellcheck disable=SC2086
          if git diff --cached --quiet -- $PUTI_TEK; then
            echo "novogo net: v vetke uzhe to zhe samoe"
            echo "NASH_KOMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
            exit 0
          fi
          # shellcheck disable=SC2086
          FAJLOV=$(git diff --cached --numstat -- $PUTI_TEK | wc -l)
          echo "fajlov k pushu: $FAJLOV"
          for POPYTKA in 1 2 3 4 5 6 7 8; do
            git fetch -q --depth=1 origin "$VETKA_KODA"
            git reset -q FETCH_HEAD
            # ПЕРЕСЧЁТ СРАЗУ ПОСЛЕ reset: индекс теперь равен новой вершине
            # ветки, и путь, который там появился, снова виден.
            PUTI_TEK=$(SOBRAT_PUTI)
            STAVIM "$PUTI_TEK"
            # shellcheck disable=SC2086
            if git diff --cached --quiet -- $PUTI_TEK; then
              echo "uzhe v vetke (popytka $POPYTKA)"
              echo "NASH_KOMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
              exit 0
            fi
            # КОММИТ ИЗ ИНДЕКСА, БЕЗ ПУТЕЙ, И ЭТО ИСПРАВЛЕНИЕ ПО ЗАМЕРУ.
            # 'git commit -- <путь>' -- это ЧАСТИЧНЫЙ коммит: он берёт
            # состояние РАБОЧЕГО ДЕРЕВА по этому пути, а не индекс. После
            # 'git reset FETCH_HEAD' в HEAD уже лежит то, что кто-то запушил
            # между нашим checkout и пушем, но в дереве этого файла нет -- и
            # частичный коммит записывает его УДАЛЁННЫМ. Проверено у себя на
            # настоящем origin: чужой файл data/polymarket/proizvodnye/
            # 2026-10-15/09.jsonl.gz исчез из ветки после нашего пуша.
            # --ignore-removal у git add от этого не спасает: он про индекс, а
            # дело было в частичном коммите. Индекс же после reset плюс наш
            # add равен "вершина ветки плюс наши файлы" -- ровно то, что нужно,
            # а замок выше гарантирует, что в индексе нет ничего лишнего.
            git commit -q -m "Polymarket: proizvodnye i otmetki za $SUTKI ($FAJLOV fajlov) [automated]"
            # git push БЕЗ КОНВЕЙЕРА: 'git push | tail' отдаёт код tail, то
            # есть 0 даже на отказе, и отчёт о пуше врал бы.
            if git push -q origin HEAD:"$VETKA_KODA"; then
              echo "push gotov s popytki $POPYTKA"
              echo "NASH_KOMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "popytka $POPYTKA: push otklonjon, dogonjaju vetku"
            sleep $((POPYTKA * 2))
          done
          echo "SBOJ: push ne proshjol za vosem popytok"
          exit 1

      - name: "ДОКАЗАТЕЛЬСТВО ПУША: наш коммит виден в ветке"
        if: ${{ always() && job.status != 'cancelled' && steps.perenos.outcome == 'success' }}
        run: |
          set -e
          set -o pipefail
          # КОДУ git push ВЕРИМ НЕ НА СЛОВО. Сверяем с вершиной ветки, какой
          # её отдаёт сервер: либо наш коммит и есть вершина, либо он её предок.
          [ -n "${NASH_KOMMIT:-}" ] || { echo "SBOJ: shag pusha ne nazval svoj kommit"; exit 1; }
          git fetch -q --depth=50 origin "$VETKA_KODA"
          VERSHINA=$(git rev-parse FETCH_HEAD)
          echo "nash kommit: $NASH_KOMMIT"
          echo "vershina vetki: $VERSHINA"
          if [ "$NASH_KOMMIT" = "$VERSHINA" ]; then
            echo "DOKAZANO: nash kommit -- vershina vetki"
          elif git merge-base --is-ancestor "$NASH_KOMMIT" "$VERSHINA"; then
            echo "DOKAZANO: nash kommit -- predok vershiny (poverh legli chuzhie)"
          else
            echo "SBOJ: nashego kommita v vetke net"
            exit 1
          fi
          git reset -q "$VERSHINA"

      - name: "СВОДКА ПРОГОНА: всё главное одним куском в конце"
        if: ${{ always() }}
        run: |
          set -e
          echo "sutki:                 ${SUTKI:-?}"
          echo "arhiv syrogo:          ${{ steps.pack.outputs.razmer }} B"
          echo "syryh fajlov za sutki: ${{ steps.pack.outputs.syryh_fajlov }}"
          echo "artefakt id:           ${{ steps.up.outputs.artifact-id }}"
          echo "otmetku stavili:       ${OTMECHAT:-yes}"
          echo "proizvodnyh za sutki:  $(find "$PUT_PROIZVODNYH/$SUTKI" -type f 2>/dev/null | wc -l)"
          echo "otmetka za sutki:      $([ -f "$PUT_OTMETOK/$SUTKI.json" ] && echo est || echo net)"
          echo "nash kommit:           ${NASH_KOMMIT:-net}"
          echo "rotacija zdes NE delaetsja -- ona otdelnym tajmerom na mashine v 05:11Z"
