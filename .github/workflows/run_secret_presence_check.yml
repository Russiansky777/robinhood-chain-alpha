name: "Проверка наличия секретов (значения не печатаются)"

# Отвечает ровно на один вопрос: задан секрет под таким именем или нет.
# Значение не печатается никогда и никуда: наружу идут только имя, факт
# "задан/пуст" и длина. Длина нужна, чтобы отличить настоящий ключ от
# случайно вставленного пробела, и по ней ключ не восстановить.
on:
  workflow_dispatch:

concurrency:
  group: secret-presence-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: "Наличие"
        env:
          BLOOM_API_KEY: ${{ secrets.BLOOM_API_KEY }}
          BLOOM_API_KEY_PUBLIC: ${{ secrets.BLOOM_API_KEY_PUBLIC }}
          BLOOM_API_KEY_PRIVATE: ${{ secrets.BLOOM_API_KEY_PRIVATE }}
          BLOOM_API: ${{ secrets.BLOOM_API }}
          BLOOM_KEY: ${{ secrets.BLOOM_KEY }}
          DBOT_API_KEY: ${{ secrets.DBOT_API_KEY }}
          HELIUS_API: ${{ secrets.HELIUS_API }}
        run: |
          for NAME in BLOOM_API_KEY BLOOM_API_KEY_PUBLIC BLOOM_API_KEY_PRIVATE \
                      BLOOM_API BLOOM_KEY DBOT_API_KEY HELIUS_API; do
            VALUE="${!NAME}"
            if [ -z "$VALUE" ]; then
              echo "$NAME: НЕ ЗАДАН"
            else
              echo "$NAME: задан, длина ${#VALUE}"
            fi
          done
