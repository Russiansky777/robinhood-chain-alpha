name: Run Sprint G1 (graduation-momentum retro-test)

on:
  workflow_dispatch:
    inputs:
      step:
        description: "Какой шаг запустить"
        required: true
        default: "recon"
        type: choice
        options:
          - audit
          - recover_quote_full
          - recover_full_extract
          - recon
          - verify
          - count
          - semantics
          - factory_fate
          - v2_recon
          - v2_postfilter
          - smoke
          - full
          - report

jobs:
  run-sprint-g1:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Постоянный кэш для G1 (data/sprintG1_cache/) коммитится сразу
      # после каждой оплаченной операции (см. dune_client.py) -- этот
      # шаг только для эфемерного query_id-кэша create_query, дополнение,
      # не основная защита.
      - name: Restore Dune query cache
        uses: actions/cache@v4
        with:
          path: analysis/output/cache
          key: dune-cache-${{ github.run_id }}
          restore-keys: |
            dune-cache-
          save-always: true

      - name: Install dependencies
        run: pip install -r analysis/requirements.txt

      # Владелец, 2026-09-01: расхождение 2138.84 (Dune) vs 1823.26
      # (внутренний леджер) -- аудит НИЧЕГО не исполняет (execute()), только
      # бесплатные GET /query/{id} метаданные + defensive account/usage
      # пробы. Безопасно гонять сколько угодно раз, 0 кредитов.
      - name: Audit Dune account (schedules/leaks, 0 credits)
        if: ${{ github.event.inputs.step == 'audit' }}
        env:
          DUNE_API_KEY: ${{ secrets.DUNE_API_KEY }}
          CREDIT_GUARD_NAMESPACE: sprintG1
        run: python analysis/audit_dune_account.py

      # Владелец, 2026-09-01, решение 3: g1_v2_quote_distribution_full УЖЕ
      # оплачен в run #18 (execute 20.089 кредита), но 2x-гард остановил
      # пайплайн ДО чтения результата -- ОДНО дешёвое дополнительное чтение
      # вместо повторного execute. Идемпотентно (пропускает, если кэш уже
      # восстановлен) -- безопасно гонять повторно.
      - name: Recover already-paid g1_v2_quote_distribution_full result
        if: ${{ github.event.inputs.step == 'recover_quote_full' }}
        env:
          DUNE_API_KEY: ${{ secrets.DUNE_API_KEY }}
          CREDIT_GUARD_NAMESPACE: sprintG1
        run: python analysis/recover_g1_v2_quote_distribution_full.py

      # Run #20: g1_v2_full_extract УЖЕ оплачен (execute 34.230 кредита),
      # >2x-гард с абсолютным минимумом 25 остановил пайплайн ДО чтения --
      # то же восстановление, что recover_quote_full, но для 896x26.
      - name: Recover already-paid g1_v2_full_extract result
        if: ${{ github.event.inputs.step == 'recover_full_extract' }}
        env:
          DUNE_API_KEY: ${{ secrets.DUNE_API_KEY }}
          CREDIT_GUARD_NAMESPACE: sprintG1
        run: python analysis/recover_g1_v2_full_extract.py

      - name: Run recon (Step 1)
        if: ${{ github.event.inputs.step == 'recon' }}
        env:
          DUNE_API_KEY: ${{ secrets.DUNE_API_KEY }}
          CREDIT_GUARD_NAMESPACE: sprintG1
        run: python analysis/g1_recon.py

      - name: Verify pons.family factory on-chain (blocking condition 3)
        if: ${{ github.event.inputs.step == 'verify' }}
        env:
          DUNE_API_KEY: ${{ secrets.DUNE_API_KEY }}
          CREDIT_GUARD_NAMESPACE: sprintG1
        run: python analysis/g1_verify_factory.py

      - name: Full-period graduation event counts + N gate (blocking condition 4)
        if: ${{ github.event.inputs.step == 'count' }}
        env:
          DUNE_API_KEY: ${{ secrets.DUNE_API_KEY }}
          CREDIT_GUARD_NAMESPACE: sprintG1
        run: python analysis/g1_graduation_events.py

      - name: Event semantics check (TokenLaunched vs TokenDeployed, delay distribution)
        if: ${{ github.event.inputs.step == 'semantics' }}
        env:
          DUNE_API_KEY: ${{ secrets.DUNE_API_KEY }}
          CREDIT_GUARD_NAMESPACE: sprintG1
        run: python analysis/g1_event_semantics.py

      - name: Factory fate after 2026-08-12 (docs check done free, on-chain scan here)
        if: ${{ github.event.inputs.step == 'factory_fate' }}
        env:
          DUNE_API_KEY: ${{ secrets.DUNE_API_KEY }}
          CREDIT_GUARD_NAMESPACE: sprintG1
        run: python analysis/g1_factory_fate.py

      - name: V2 recon (PoolGraduated event, daily counts, close-the-loop, fee stack)
        if: ${{ github.event.inputs.step == 'v2_recon' }}
        env:
          DUNE_API_KEY: ${{ secrets.DUNE_API_KEY }}
          CREDIT_GUARD_NAMESPACE: sprintG1
        run: python analysis/g1_v2_recon.py

      - name: V2 post-filter N (full 896-event set, tradability filter, N gate)
        if: ${{ github.event.inputs.step == 'v2_postfilter' }}
        env:
          DUNE_API_KEY: ${{ secrets.DUNE_API_KEY }}
          CREDIT_GUARD_NAMESPACE: sprintG1
        run: python analysis/g1_v2_postfilter.py

      # Владелец, 2026-09-01, решение 4: смоук -> (если факт <=2x оценки и
      # данные осмысленны) автономно полный прогон -> статистика §2.6 ->
      # вердикт §2.7 -> docs/RESULTS.md, ОДНИМ запуском этого шага.
      # Возврат в штаб только на: N<200 (UNDERPOWERED), перерасход >2x,
      # либо пустой результат -- см. analysis/sprint_g1.py.
      - name: Run smoke test, then autonomously full pipeline + report (Step 2-5)
        if: ${{ github.event.inputs.step == 'smoke' }}
        env:
          DUNE_API_KEY: ${{ secrets.DUNE_API_KEY }}
          CREDIT_GUARD_NAMESPACE: sprintG1
        run: python analysis/sprint_g1.py --stage smoke

      # Ручная точка входа для переисполнения после первого успешного смоука
      # (--stage full тоже начинает со смоука -- но он теперь ПОСТОЯННЫЙ
      # кэш-хит, 0 кредитов, если SQL не менялся -- дальше сразу полный
      # прогон/статистика/отчёт как в --stage smoke).
      - name: Run full pipeline (re-entry, smoke stage is a cache-hit)
        if: ${{ github.event.inputs.step == 'full' }}
        env:
          DUNE_API_KEY: ${{ secrets.DUNE_API_KEY }}
          CREDIT_GUARD_NAMESPACE: sprintG1
        run: python analysis/sprint_g1.py --stage full

      - name: Report stage (no-op -- report is written inline by smoke/full)
        if: ${{ github.event.inputs.step == 'report' }}
        env:
          DUNE_API_KEY: ${{ secrets.DUNE_API_KEY }}
          CREDIT_GUARD_NAMESPACE: sprintG1
        run: python analysis/sprint_g1.py --stage report

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/RESULTS.md docs/G1_DESIGN.md
          if [ -d data ]; then git add data/; fi
          git diff --cached --quiet || git commit -m "Update Sprint G1 results [automated]"
          git push
