name: "Задача 5, деплой -- read-only проверка ЗАДЕПЛОЕННОГО ClosedCycleExecutorV4 (eth_getCode/owner()/poolManager(), без подписи)"

# После реального деплоя (scripts/deploy_executor_v4.sh, владелец,
# workflow_dispatch) -- независимая проверка НА ЦЕПИ: код по адресу
# совпадает с deployedBytecode.txt (с учётом ДВУХ immutable-плейсхолдеров
# -- owner и poolManager, см. task5_verify_deploy_v4.py), owner() и
# poolManager() возвращают ожидаемые адреса. Только eth_getCode/eth_call
# (read-only), НИКАКОЙ подписи/отправки.

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'ЗАФИКСИРОВАННЫЙ полный commit SHA (та же версия, что деплой) -- пусто -- текущий HEAD ветки claude/nifty-sagan-r0polg (обратная совместимость, напр. при push-триггере).'
        required: false
        default: ''
  push:
    branches:
      - claude/nifty-sagan-r0polg
    paths:
      - "data/p3_guard_cache/TASK5_VERIFY_DEPLOY_V4_REQUEST"

jobs:
  verify_deploy_v4:
    name: "eth_getCode + owner()/poolManager() для ClosedCycleExecutorV4 (Ohio VPS)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: SSH key + known_hosts
        env:
          VPS_SSH_KEY_OHIO: ${{ secrets.VPS_SSH_KEY_OHIO }}
        run: |
          set -e
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY_OHIO" > ~/.ssh/vps_key_ohio
          chmod 600 ~/.ssh/vps_key_ohio
          ssh-keyscan -T 10 3.151.160.108 >> ~/.ssh/known_hosts 2>/dev/null
          echo "SSH_OPTS=-i $HOME/.ssh/vps_key_ohio -o ConnectTimeout=15 -o BatchMode=yes -o StrictHostKeyChecking=accept-new" >> "$GITHUB_ENV"

      - name: Подтянуть зафиксированную версию и проверить деплой на цепи
        env:
          VERIFY_REF: ${{ inputs.commit_sha }}
        run: |
          # Пятый раунд ревью, пункт 4: "не используй git reset --hard
          # как обязательный шаг запуска -- подготовь checkout выбранного
          # коммита без уничтожения локальных изменений." `git checkout
          # <ref>` (БЕЗ --hard/force) отказывается молча затирать
          # конфликтующие незакоммиченные изменения (честная ошибка
          # вместо тихого уничтожения) -- этого достаточно, раз рабочее
          # дерево бота не редактируется вручную между запусками.
          # REF -- ЗАФИКСИРОВАННЫЙ commit SHA (та же версия, что деплой),
          # если явно передан; иначе -- ветка (обратная совместимость с
          # push-триггером, где commit_sha не задаётся).
          if [ -z "$VERIFY_REF" ]; then VERIFY_REF="claude/nifty-sagan-r0polg"; fi
          ssh $SSH_OPTS ubuntu@3.151.160.108 "
            set -e
            sudo -u bot git -C /home/bot/robinhood-chain-alpha fetch origin '$VERIFY_REF'
            sudo -u bot git -C /home/bot/robinhood-chain-alpha checkout '$VERIFY_REF'
            sudo -u bot bash -c '
              set -e
              cd /home/bot/robinhood-chain-alpha/analysis
              /home/bot/robinhood-chain-alpha/venv/bin/python task5_verify_deploy_v4.py
              cat /home/bot/robinhood-chain-alpha/contracts/build/deploy_verification_v4.json
            '
          " > /tmp/verify_deploy_v4_stdout.log 2> /tmp/verify_deploy_v4_stderr.log
          echo "--- stdout ---"; cat /tmp/verify_deploy_v4_stdout.log
          echo "--- stderr ---"; cat /tmp/verify_deploy_v4_stderr.log

      - name: Забрать deploy_verification_v4.json
        if: always()
        run: |
          ssh $SSH_OPTS ubuntu@3.151.160.108 'sudo -u bot cat /home/bot/robinhood-chain-alpha/contracts/build/deploy_verification_v4.json' > /tmp/deploy_verification_v4.json || true

      - name: Commit results
        if: always()
        run: |
          git rm -f --ignore-unmatch data/p3_guard_cache/TASK5_VERIFY_DEPLOY_V4_REQUEST
          if [ -s /tmp/deploy_verification_v4.json ] && python3 -c "import json; json.load(open('/tmp/deploy_verification_v4.json'))" 2>/dev/null; then
            cp /tmp/deploy_verification_v4.json contracts/build/deploy_verification_v4.json
            git add contracts/build/deploy_verification_v4.json
          fi
          git diff --cached --quiet && exit 0
          git commit -m "Задача 5: результат проверки задеплоенного ClosedCycleExecutorV4 на цепи [automated]"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected, попытка $i/5 -- git pull --rebase и повтор"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep 3
          done
          echo "не удалось запушить после 5 попыток" >&2
          exit 1
