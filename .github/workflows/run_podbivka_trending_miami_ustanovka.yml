name: "Трендинги Code-2: установка на lab-miami (юниты и таймеры) + первый доклад"

# ЗАЧЕМ (пункт 1 владельца 12.10, консервация): поставить регистратор трендингов
# Code-2 на ЛАБОРАТОРНЫЙ хост lab-miami по docs/podbivka_trending_ustanovka.md
# из ветки claude/podbivka. Без BIRDEYE_API_KEY -- слово владельца.
#
# НА ТОРГОВЫЙ ХОСТ ЭТО НЕ СТАВИТСЯ И ПОСТАВЛЕНО БЫТЬ НЕ МОЖЕТ. Адрес хоста
# зашит в env как HOST_LAB (169.128.191.158), торговый 45.59.170.76 здесь не
# упоминается вовсе, и шаг-предохранитель ниже отказывается работать, если
# адрес совпал с торговым.
#
# КОШЕЛЬКОВЫХ КЛЮЧЕЙ СКРИПТ НЕ ПРОСИТ И НЕ ЧИТАЕТ: все запросы -- публичные GET
# (проверено: из импортов только стандартная библиотека, urllib.request).
# Ни одного секрета на машину этот прогон не кладёт -- см. шаг про пуш.
#
# ПУШ В ВЕТКУ -- БЕЗ СЕКРЕТА НА МАШИНЕ, И ЭТО РЕШЕНИЕ, А НЕ УПУЩЕНИЕ.
# В docs/podbivka_trending_ustanovka.md третий таймер (podbivka-trending-push)
# пушит data/trending в ветку сам с машины. Чтобы он мог пушить, на машину надо
# положить токен записи в репозиторий -- это НОВЫЙ СЕКРЕТ НА ХОСТЕ, а владелец
# сказал "ключи и секреты -- никогда". Поэтому юнит и таймер пуша СТАВЯТСЯ (как
# в документе), но таймер пуша НЕ ВКЛЮЧАЕТСЯ, а последняя миля до ветки едет
# отдельным прогоном run_podbivka_trending_push_miami.yml: он идёт на бегунке
# lab-miami, где токен выдаёт сам GitHub на время прогона и на диске не остаётся.
on:
  push:
    # ЗАПУСК ФАЙЛОМ-МЕТКОЙ, А НЕ КНОПКОЙ, И ЭТО НЕ ВКУС. Прогон с
    # workflow_dispatch GitHub регистрирует ТОЛЬКО когда файл лежит на ветке по
    # умолчанию (здесь это claude/robinhood-copytrading-hypothesis-awjj0g, где
    # 440 прогонов из наших 571). Нового прогона там нет, и dispatch отвечает
    # 404 -- замерено. Событие push берёт файл прогона ИЗ ТОГО КОММИТА, которым
    # он пришёл, то есть работает с нашей ветки; тем же приёмом живут
    # run_podbivka2_miami.yml и run_fetch_vps_position_state.yml.
    branches:
      - claude/nifty-sagan-r0polg
    paths:
      - "data/konservaciya/zapusk/trending_miami_*.json"
  workflow_dispatch:
    inputs:
      vetka_podbivki:
        description: "ветка Code-2 с регистратором"
        required: false
        default: "claude/podbivka"
      koren:
        description: "куда ставить клон на lab-miami"
        required: false
        default: "/opt/robinhood-chain-alpha"
      probno:
        description: "'yes' -- сразу прогнать --probno и показать доклад"
        required: false
        default: "yes"

concurrency:
  group: podbivka-trending-miami
  cancel-in-progress: false

env:
  # ТОЛЬКО ДИАГНОЗ, И ЭТО НЕ УДОБСТВО. 16.10 диск lab-miami занят на 100 %,
  # и шаг клона отказывает на 'failed to write .git/shallow.lock: No space
  # left on device'. Ставить что-либо на полный диск нельзя, а мерить --
  # нужно. С 'yes' прогон делает ТОЛЬКО читающие шаги и выходит зелёным.
  TOLKO_DIAGNOZ: "no"
  VETKA_PODBIVKI: "claude/podbivka"
  KOREN_PODBIVKI: "/opt/robinhood-chain-alpha"
  PROBNO: "yes"
  # ВЛАДЕЛЕЦ ПРОСИЛ 12.10 И 13.10, "за 14-16.10 данных нет -- так и
  # записать". ЗАМЕР ЭТО ПОПРАВИЛ, и записываем замер, а не ожидание:
  # прогон 38930238689 нашёл на диске суточные файлы и за 14.10 (8 штук),
  # и за 15.10 (6), и за 16.10 (8) -- данные ЕСТЬ, просто их крохи
  # (14.10 ~4.7 МБ, 15.10 ~0.8 МБ и три файла по 0 байт против 598 МБ за
  # 12.10). Поэтому таблицу считаем за все пять суток и печатаем объём по
  # дням: пусть в записи будет число, а не слово "нет".
  DATY_PERVYH: "2026-10-12 2026-10-13 2026-10-14 2026-10-15 2026-10-16"
  HOST_LAB: 169.128.191.158
  TORGOVYJ_ZAPRESHCHEN: 45.59.170.76

jobs:
  ustanovka:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/nifty-sagan-r0polg

      - name: "ПРЕДОХРАНИТЕЛЬ: это не торговый хост"
        run: |
          set -e
          if [ "$HOST_LAB" = "$TORGOVYJ_ZAPRESHCHEN" ]; then
            echo "STOP: adres sovpal s torgovym hostom. Registrator na torgovuju mashinu ne stavitsja."
            exit 1
          fi
          echo "stavim na lab-miami $HOST_LAB; torgovyj $TORGOVYJ_ZAPRESHCHEN ne tragaetsja"

      - name: "SSH key lab-miami"
        env:
          KLJUCH_MIAMI: ${{ secrets.VPS_SSH_KEY_MIAMI }}
        run: |
          set -e
          [ -n "$KLJUCH_MIAMI" ] || { echo "SBOJ: sekreta VPS_SSH_KEY_MIAMI net"; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KLJUCH_MIAMI" > ~/.ssh/miami_key
          chmod 600 ~/.ssh/miami_key
          ssh-keyscan -T 10 "$HOST_LAB" >> ~/.ssh/known_hosts 2>/dev/null
          echo "SSH_OPTS=-i $HOME/.ssh/miami_key -o ConnectTimeout=20 -o BatchMode=yes -o StrictHostKeyChecking=accept-new" >> "$GITHUB_ENV"

      - name: "ДИАГНОЗ ДИСКА lab-miami (только чтение, до любых правок)"
        # ЗАЧЕМ. 13.10 суточный пуш упал с "No space left on device" на
        # /home/ghrunner/actions-runner/_diag, 14 и 15.10 бегунок уже не
        # отвечал серверу -- признак забитого диска. Чем занято, по
        # репозиторию видно только наполовину, поэтому меряем на машине и ДО
        # того, как этот же прогон начнёт писать. Только чтение: df, du, ls.
        if: always()
        run: |
          set -e
          set -o pipefail
          ssh $SSH_OPTS root@"$HOST_LAB" 'bash -s' <<'DIAGNOZ' 2>&1 | tee diagnoz_miami.txt
            set +e
            echo "=== 1. MESTO NA DISKAH ==="
            df -h | head -12
            echo
            echo "=== 2. CHEM ZANJAT KOREN: verhnij uroven ==="
            du -sh /* 2>/dev/null | sort -rh | head -12
            echo
            echo "=== 2a. /home PO POLZOVATELJAM ==="
            # БЕЗ ЭТОГО РАЗБОРА ПРОШЛЫЙ ЗАМЕР НИЧЕГО НЕ ОБЪЯСНИЛ: /home дал
            # 126 ГБ, рабочий каталог бегунка -- 23 ГБ, и сто гигабайт
            # остались безымянными. Чьё место -- вопрос к владельцу, и
            # отвечать на него надо именами, а не догадкой.
            du -sh /home/* 2>/dev/null | sort -rh | head -10
            echo "--- vtoroj uroven /home ---"
            du -sh /home/*/* 2>/dev/null | sort -rh | head -20
            echo "--- samye tjazhelye katalogi mashiny (do 3 urovnej, bez chuzhih FS) ---"
            du -x -d3 / 2>/dev/null | sort -rn | head -25
            echo "--- samye krupnye OTDELNYE fajly ---"
            find / -xdev -type f -size +500M -printf '%10s %p\n' 2>/dev/null \
              | sort -rn | head -15
            echo "--- zhurnal systemd i kesh apt ---"
            journalctl --disk-usage 2>/dev/null
            du -sh /var/cache/apt /var/lib/docker 2>/dev/null
            echo
            echo "=== 3. RABOCHIE KATALOGI BEGUNKA (po progonu) ==="
            ls -d /home/*/actions-runner/_work/*/ 2>/dev/null
            du -sh /home/*/actions-runner/_work/* 2>/dev/null | sort -rh | head -12
            echo "--- _diag begunka (tuda i ne hvatilo mesta) ---"
            du -sh /home/*/actions-runner/_diag 2>/dev/null
            echo
            echo "=== 4. KLON REGISTRATORA v /opt ==="
            du -sh /opt/robinhood-chain-alpha 2>/dev/null
            du -sh /opt/robinhood-chain-alpha/* 2>/dev/null | sort -rh | head -8
            echo "--- iz nego nuzhen tolko analysis i data/trending ---"
            du -sh /opt/robinhood-chain-alpha/analysis /opt/robinhood-chain-alpha/data/trending 2>/dev/null
            echo
            echo "=== 5. SNIMKI REGISTRATORA: skolko i za kakie dni ==="
            find /opt/robinhood-chain-alpha/data/trending -type f -printf '%TY-%Tm-%Td %10s %p\n' 2>/dev/null | sort | head -40
            echo "fajlov: $(find /opt/robinhood-chain-alpha/data/trending -type f 2>/dev/null | wc -l)"
            echo
            echo "=== 5a. SNIMKI PO SUTKAM, SVODKOJ ==="
            # По суткам одной строкой: владелец просил размеры по дням, а не
            # простыню по файлам. Считается сложением, а не на глаз.
            find /opt/robinhood-chain-alpha/data/trending -type f -name '*.jsonl.gz' \
              -printf '%f %s\n' 2>/dev/null \
              | awk '{d=substr($1,1,10); b[d]+=$2; n[d]++} END {for (d in b) printf "  %s: fajlov %d, %10.2f MB\n", d, n[d], b[d]/1048576}' \
              | sort
            echo
            echo "=== 6. ZHIV LI BEGUNOK I POCHEMU NE BERJOT ZADANIJA ==="
            systemctl list-units 'actions.runner.*' --all --no-pager 2>/dev/null | head -5
            echo "--- sostojanie sluzhby begunka podrobno ---"
            SL=$(systemctl list-units 'actions.runner.*' --all --no-legend --plain 2>/dev/null | awk '{print $1}' | head -1)
            if [ -n "$SL" ]; then
              systemctl show "$SL" -p ActiveState -p SubState -p NRestarts \
                -p ExecMainStartTimestamp -p ExecMainPID -p MemoryCurrent 2>/dev/null
              echo "--- poslednie 25 strok zhurnala sluzhby ---"
              journalctl -u "$SL" -n 25 --no-pager 2>/dev/null | tail -25
            else
              echo "sluzhby begunka ne nashel vovse"
            fi
            echo "--- zhurnal slushatelja begunka (_diag), poslednie stroki ---"
            ls -1t /home/*/actions-runner/_diag/Runner_*.log 2>/dev/null | head -2
            tail -n 12 "$(ls -1t /home/*/actions-runner/_diag/Runner_*.log 2>/dev/null | head -1)" 2>/dev/null \
              || echo "zhurnala slushatelja net"
            echo
            echo "=== 6a. PAMJAT I NAGRUZKA ==="
            free -h 2>/dev/null
            echo "--- srednjaja nagruzka i vremja raboty ---"
            uptime 2>/dev/null
            echo "--- ubitye po pamjati za nedelju (OOM) ---"
            journalctl --since '-7 days' --no-pager 2>/dev/null | grep -ciE 'out of memory|oom-kill' \
              || echo 0
            echo
            echo "=== 7. TAJMERY REGISTRATORA ==="
            systemctl list-timers 'podbivka-trending*' --all --no-pager 2>/dev/null | head -6
          DIAGNOZ
          echo "--- stroka s mestom ---"
          grep -E '/$|/home|/opt' diagnoz_miami.txt | head -6 || true

      - name: "Параметры: вход прогона сильнее метки, метка сильнее умолчания"
        env:
          VHODY: ${{ toJSON(inputs) }}
        run: |
          set -e
          # ПОРЯДОК СТАРШИНСТВА НАЗВАН, А НЕ УГАДЫВАЕТСЯ: вход workflow_dispatch
          # сильнее файла-метки, метка сильнее значения по умолчанию из env
          # прогона. На событии push входов нет вовсе -- тогда решает метка.
          # ВСЁ НА jq, А НЕ НА python3 -c: многострочная строка в двойных
          # кавычках начинается с нулевой колонки и ЗАКРЫВАЕТ блок YAML.
          # Проверено -- на этом разбор прогона падал дважды.
          # СВЕЖЕСТЬ МЕТКИ -- ПО ИМЕНИ, А НЕ ПО ВРЕМЕНИ ФАЙЛА. 'ls -1t' здесь
          # обманчив: в свежем чекауте время правки у ВСЕХ файлов одно (момент
          # выкладки), и порядок решается уже не датой, а разбором ничьей --
          # у GNU ls это имя по возрастанию, то есть выбралась бы САМАЯ СТАРАЯ
          # метка. А в метке лежит и tolko_diagnoz: старая метка 12.10 стоит в
          # 'yes', и установка молча не делалась бы вовсе. Имена меток
          # кончаются датой ГГГГ-ММ-ДД, поэтому обычная сортировка по имени
          # даёт ровно то, что нужно: последняя строка -- самая поздняя дата.
          METKA_FAJL=$(ls -1 data/konservaciya/zapusk/trending_miami_*.json 2>/dev/null | sort | tail -1 || true)
          echo "fajl-metka: ${METKA_FAJL:-net}"
          for IMJA in VETKA_PODBIVKI KOREN_PODBIVKI PROBNO TOLKO_DIAGNOZ; do
            KLJUCH=$(printf '%s' "$IMJA" | tr 'A-Z' 'a-z')
            NOVO=$(printf '%s' "$VHODY" | jq -r --arg k "$KLJUCH" '((. // {})[$k] // "") | tostring' 2>/dev/null || true)
            if [ -z "$NOVO" ] && [ -n "$METKA_FAJL" ]; then
              NOVO=$(jq -r --arg k "$KLJUCH" '((. // {})[$k] // "") | tostring' "$METKA_FAJL" 2>/dev/null || true)
            fi
            if [ -n "$NOVO" ] && [ "$NOVO" != "null" ]; then
              echo "$IMJA=$NOVO" >> "$GITHUB_ENV"
              echo "  $IMJA: bylo '${!IMJA}', stalo '$NOVO'"
            else
              echo "  $IMJA: '${!IMJA}' (po umolchaniju)"
            fi
          done

      - name: "Машина: кто мы, место, python, systemd"
        run: |
          set -e
          set -o pipefail
          ssh -n $SSH_OPTS root@"$HOST_LAB" "hostname; nproc; df -h /opt | tail -1; python3 -V; systemctl --version | head -1"

      - name: "Пользователь podbivka и клон ветки Code-2"
        if: ${{ env.TOLKO_DIAGNOZ != 'yes' }}
        run: |
          set -e
          set -o pipefail
          VETKA="$VETKA_PODBIVKI"
          KOREN="$KOREN_PODBIVKI"
          # КЛОН МЕЛКИЙ И ОДНОВЕТОЧНЫЙ. Репозиторий весит 7.13 ГиБ историей
          # (её делают исследовательские архивы data/podbivka и
          # data/sprintG1_cache), и полный клон на лабораторную машину тащить
          # незачем: регистратору нужен рабочий каталог, чтобы ПИСАТЬ снимки,
          # а историю он не читает. Пуш в ветку идёт прогоном, не с машины.
          ssh $SSH_OPTS root@"$HOST_LAB" "VETKA='$VETKA' KOREN='$KOREN' bash -s" <<'STAVIM'
            set -e
            id podbivka >/dev/null 2>&1 || useradd --system --create-home --shell /usr/sbin/nologin podbivka
            id podbivka
            if [ -d "$KOREN/.git" ]; then
              echo "klon uzhe est, obnovljaju"
              cd "$KOREN"
              # ЧУЖОЙ ВЛАДЕЛЕЦ КАТАЛОГА -- И git ОТКАЗЫВАЕТСЯ РАБОТАТЬ ВООБЩЕ.
              # Замерено прогоном 38196856917: "fatal: detected dubious
              # ownership in repository at /opt/robinhood-chain-alpha", код
              # 128 на первой же команде. Причина: клон отдан пользователю
              # podbivka (uid 999), чтобы таймер мог ПИСАТЬ снимки, а эта
              # сессия идёт от root. Первый прогон этого показать не мог --
              # тогда он делал клон с нуля и владельцем был сам.
              # Отметка ставится РОВНО ОДИН РАЗ: --add без проверки копит
              # повторы в ~/.gitconfig при каждой перепостановке.
              git config --global --get-all safe.directory 2>/dev/null \
                | grep -qxF "$KOREN" \
                || git config --global --add safe.directory "$KOREN"
              git remote -v | head -2
              # СЕТЬ С ЯЩИКА БЫВАЕТ НЕДОСТУПНА, И ЭТО НЕ ДОГАДКА: прогон
              # 38975558290 упал ровно здесь -- "fatal: unable to access ...
              # Failed to connect to github.com port 443 after 133597 ms".
              # Не права, не диск и не ssh: ssh доехал, удалённый bash
              # отработал, упёрся исходящий HTTPS с ящика. Три попытки с
              # паузой; если сеть не вернулась -- отказ громкий, а не
              # установка на непроверенном коде.
              POPYTKA=1
              until git fetch -q --depth=1 origin "$VETKA"; do
                if [ "$POPYTKA" -ge 3 ]; then
                  echo "SBOJ: git fetch ne proshjol s treh popytok -- set s jashchika do github.com nedostupna"
                  exit 1
                fi
                echo "fetch ne proshjol (popytka $POPYTKA) -- zhdu 15 s i probuju snova"
                POPYTKA=$((POPYTKA + 1))
                sleep 15
              done
              # ВЕТКУ ДОГОНЯЕМ reset-ом, А КОД ЗАБИРАЕМ ПО ПУТЯМ, и это не вкус.
              # Прежний checkout -B FETCH_HEAD отказывал бы начиная с первого
              # суточного пуша: пуш положил data/trending/*/ДАТА.jsonl.gz В
              # ВЕТКУ, а на машине те же самые файлы дописываются каждую минуту
              # таймером. Для git это "локальные изменения отслеживаемых
              # файлов", и checkout отказывается их затирать -- шаг упал бы с
              # set -e, перепостановка не прошла бы, а снимки за день мог бы
              # затереть. reset двигает вершину ветки и НЕ трогает рабочее
              # дерево; код из ветки доносит checkout по каталогу analysis,
              # где и живёт регистратор. Тот же приём у шага пуша в
              # run_podbivka_trending_svodka_miami.yml.
              git reset -q FETCH_HEAD
              git checkout -q -- analysis
              echo "snimkov s mestnymi izmenenijami (tak i dolzhno byt):"
              git status --porcelain -- data/trending | wc -l
              echo "raznica v kode posle obnovlenija (dolzhno byt 0 strok):"
              git status --porcelain -- analysis | head -5
            else
              echo "kloniruju $VETKA v $KOREN (melkij, odnovetochnyj)"
              rm -rf "$KOREN"
              git clone -q --depth 1 --single-branch -b "$VETKA" \
                https://github.com/Russiansky777/robinhood-chain-alpha.git "$KOREN"
              cd "$KOREN"
            fi
            git rev-parse --abbrev-ref HEAD
            git log --oneline -1
            mkdir -p "$KOREN/data/trending"
            chown -R podbivka:podbivka "$KOREN"
            # КАТАЛОГ СНИМКОВ ДОЛЖЕН БЫТЬ ПИСАБЕЛЕН БЕГУНКУ, И ЭТО НЕ
            # ПЕРЕСТРАХОВКА. Суточный пуш (run_podbivka_trending_push_miami.yml)
            # убирает снимки старше двух суток ПОСЛЕ доказанного пуша, и идёт
            # он под пользователем бегунка, а клон отдан пользователю podbivka.
            # Удаление файла требует права записи НА КАТАЛОГ, а не на файл, --
            # поэтому группой каталогов ставим группу бегунка и даём ей запись.
            # Бит setgid на каталогах нужен отдельно: без него завтрашний
            # файл, созданный таймером от podbivka, лёг бы с группой podbivka,
            # и уборка через сутки опять упёрлась бы в права.
            # Воспроизведено на теле шага под не-root: без этого выходит
            # "rm: cannot remove ...: Permission denied", шаг краснеет, данные
            # при этом целы -- отказ в безопасную сторону, но работа не идёт.
            # Имя пользователя бегунка НЕ УГАДЫВАЕТСЯ: берём владельца его
            # рабочего каталога, и только если не нашли -- ghrunner, какой
            # замерен в журнале прогона 38192956775.
            RAB_BEGUNKA=$(ls -d /home/*/actions-runner/_work 2>/dev/null | head -1)
            if [ -n "$RAB_BEGUNKA" ]; then
              BEGUNOK=$(stat -c %U "$RAB_BEGUNKA")
            else
              BEGUNOK=ghrunner
            fi
            echo "polzovatel begunka: $BEGUNOK (po $RAB_BEGUNKA)"
            if id "$BEGUNOK" >/dev/null 2>&1; then
              chgrp -R "$BEGUNOK" "$KOREN/data/trending"
              find "$KOREN/data/trending" -type d -exec chmod 2775 {} +
              find "$KOREN/data/trending" -type f -exec chmod 664 {} + 2>/dev/null || true
              echo "prava na katalogi snimkov:"
              ls -ld "$KOREN/data/trending"
              find "$KOREN/data/trending" -mindepth 1 -maxdepth 1 -type d \
                -printf '  %M %u:%g %p\n' | head -20 || true
            else
              echo "VNIMANIE: polzovatelja $BEGUNOK na mashine net -- prava snimkov"
              echo "ne mennjalis, i sutochnaja uborka upadet na Permission denied."
            fi
            test -f "$KOREN/analysis/podbivka_trending.py" \
              || { echo "SBOJ: v klone net analysis/podbivka_trending.py"; exit 1; }
            test -x "$KOREN/analysis/podbivka_trending_push.sh" \
              || chmod +x "$KOREN/analysis/podbivka_trending_push.sh"
            echo "klon gotov, vladelec podbivka"
          STAVIM

      - name: "САМОПРОВЕРКА ДО УСТАНОВКИ: красная -- юнитов не ставим"
        if: ${{ env.TOLKO_DIAGNOZ != 'yes' }}
        run: |
          set -e
          set -o pipefail
          KOREN="$KOREN_PODBIVKI"
          # СЛОВО ВЛАДЕЛЬЦА: "самопроверка --samoproverka перед установкой".
          # Место шага выбрано, а не случайно: ПОСЛЕ клона (иначе проверялся бы
          # старый код, а часовой раскрой пришёл только коммитом cb9614425) и ДО
          # юнитов -- если раскрой или потолок файла сломаны, таймеры ставить
          # нельзя. Сети самопроверка не просит; пишет в data/trending/
          # _samoproverka и убирает за собой (проверено у себя: 0 файлов
          # осталось), так что живым снимкам она не мешает. Запуск от
          # podbivka -- от того же, кто будет писать по таймеру.
          ssh -n $SSH_OPTS root@"$HOST_LAB" \
            "cd $KOREN && sudo -u podbivka /usr/bin/python3 analysis/podbivka_trending.py --samoproverka" \
            2>&1 | tee samoproverka_miami.txt
          # КОД ВОЗВРАТА ssh -- ЭТО КОД САМОПРОВЕРКИ, а pipefail включён выше,
          # так что красная самопроверка валит шаг сама. Слова ищем вторым
          # ключом: вывод мог бы оборваться на зелёном коде.
          grep -q 'самопроверка прошла' samoproverka_miami.txt \
            || { echo "SBOJ: v vyvode net slov o projdennoj samoproverke"; exit 1; }
          echo "--- itog samoproverki ---"
          grep -cE '^  (ОК|СБОЙ)' samoproverka_miami.txt | sed 's/^/strok proverok: /'
          grep -E '^  СБОЙ' samoproverka_miami.txt && { echo "SBOJ: est krasnye strochki"; exit 1; } || true
          tail -2 samoproverka_miami.txt

      - name: "Юниты и таймеры systemd"
        if: ${{ env.TOLKO_DIAGNOZ != 'yes' }}
        run: |
          set -e
          set -o pipefail
          KOREN="$KOREN_PODBIVKI"
          # ЮНИТЫ ПИШУТСЯ ЗДЕСЬ, НА БЕГУНКЕ, И УЕЗЖАЮТ ФАЙЛАМИ. Соблазн был
          # сделать их heredoc-ом внутри heredoc-а ssh -- и он не работает:
          # внутренний ограничитель уходит на хост С ОТСТУПОМ, а systemd-bash
          # ждёт его в нулевой колонке. Проверено локально: bash на хосте
          # сказал бы "here-document delimited by end-of-file (wanted UNIT)",
          # то есть юниты вышли бы пустыми, а прогон -- зелёным.
          mkdir -p junity
          # UMask=0002 -- ИЗ-ЗА ЧАСОВОГО РАСКРОЯ, А НЕ ДЛЯ КРАСОТЫ. Снимки
          # теперь ложатся в data/trending/<источник>/<ДАТА>/<ЧЧ>.jsonl.gz, то
          # есть КАЖДЫЕ СУТКИ таймер создаёт новый каталог -- сам, от
          # пользователя podbivka. Бит setgid на родителе отдаёт новому
          # каталогу группу бегунка, но НЕ право записи для группы: при
          # обычном umask 022 он выйдет 2755, и суточная уборка сырого
          # (старше 60 суток, идёт под пользователем бегунка) упрётся в
          # "Permission denied" -- удаление файла требует записи НА КАТАЛОГ.
          # С umask 002 новые каталоги выходят 2775, файлы 664.
          OBSHCHEE_SLUZHBY=$(printf '%s\n' \
            "Type=oneshot" "User=podbivka" "WorkingDirectory=$KOREN" \
            "Nice=10" "UMask=0002" "PrivateTmp=yes" "NoNewPrivileges=yes" \
            "ProtectSystem=strict" "ReadWritePaths=$KOREN")

          # --- минутные списки
          {
            printf '%s\n' "[Unit]" "Description=Трендинги: минутные списки" \
              "After=network-online.target" "" "[Service]"
            printf '%s\n' "$OBSHCHEE_SLUZHBY"
            printf '%s\n' \
              "ExecStart=/usr/bin/python3 analysis/podbivka_trending.py --kazhdye минута --pauza 0.4" \
              "TimeoutStartSec=50"
          } > junity/podbivka-trending-min.service
          printf '%s\n' "[Unit]" "Description=Трендинги каждую минуту" "" \
            "[Timer]" "OnCalendar=*:0/1" "AccuracySec=1s" "Persistent=false" "" \
            "[Install]" "WantedBy=timers.target" \
            > junity/podbivka-trending-min.timer

          # --- пятиминутные списки. BIRDEYE_API_KEY НЕ СТАВИТСЯ (слово
          # владельца): Environment= и EnvironmentFile= с ним здесь нет.
          # Birdeye ляжет в снимок строкой "нет ключа BIRDEYE_API_KEY" -- это
          # снимок с названной причиной, а не пропуск.
          {
            printf '%s\n' "[Unit]" "Description=Трендинги: пятиминутные списки" \
              "After=network-online.target" "" "[Service]"
            printf '%s\n' "$OBSHCHEE_SLUZHBY"
            printf '%s\n' \
              "ExecStart=/usr/bin/python3 analysis/podbivka_trending.py --kazhdye пять --pauza 0.6" \
              "TimeoutStartSec=120"
          } > junity/podbivka-trending-5min.service
          printf '%s\n' "[Unit]" "Description=Трендинги каждые пять минут" "" \
            "[Timer]" "OnCalendar=*:0/5" "AccuracySec=5s" "Persistent=false" "" \
            "[Install]" "WantedBy=timers.target" \
            > junity/podbivka-trending-5min.timer

          # --- суточная таблица первых появлений, 02:05Z (до пуша в 02:17Z)
          # ЗДЕСЬ heredoc, А НЕ printf, И ПРИЧИНА В ОДНОЙ СТРОКЕ ExecStart:
          # в ней есть $(date ...), который должен уехать в юнит БУКВАЛЬНО, и
          # знак процента, который systemd ждёт удвоенным (%%F). Кавычек в
          # строке три вида; printf с ними читается хуже, чем закрытый
          # heredoc, где не раскрывается ничего. ТЕЛО И ОГРАНИЧИТЕЛЬ СТОЯТ НА
          # ОТСТУПЕ БЛОКА run, а не в нулевой колонке: YAML снимает общий
          # отступ блока, и bash всё равно видит нулевую колонку, а вот строка,
          # написанная в нулевой колонке по-настоящему, ОБРЫВАЕТ блок YAML --
          # поймано своей же проверкой разбора ("could not find expected ':'").
          # Внутрь heredoc-а ssh такой приём не годится, здесь ssh нет.
          cat > junity/podbivka-trending-pervye.service <<'PERVYE_GOLOVA'
          [Unit]
          Description=Трендинги: суточная таблица первых появлений

          [Service]
          PERVYE_GOLOVA
          printf '%s\n' "$OBSHCHEE_SLUZHBY" >> junity/podbivka-trending-pervye.service
          cat >> junity/podbivka-trending-pervye.service <<'PERVYE_HVOST'
          # За ВЧЕРА: сутки уже закрыты. Повтор безопасен -- файл суток
          # перезаписывается целиком, сети не нужно.
          ExecStart=/bin/sh -c '/usr/bin/python3 analysis/podbivka_trending.py --pervye "$(date -u -d yesterday +%%F)"'
          TimeoutStartSec=1800
          PERVYE_HVOST
          printf '%s\n' "[Unit]" "Description=Трендинги: таблица первых появлений в 02:05 UTC" "" \
            "[Timer]" "OnCalendar=*-*-* 02:05:00 UTC" "Persistent=true" "" \
            "[Install]" "WantedBy=timers.target" \
            > junity/podbivka-trending-pervye.timer

          # --- суточный пуш: юнит СТАВИТСЯ, таймер НЕ ВКЛЮЧАЕТСЯ (см. голову)
          printf '%s\n' "[Unit]" "Description=Трендинги: суточный пуш в ветку" "" \
            "[Service]" "Type=oneshot" "User=podbivka" "WorkingDirectory=$KOREN" \
            "Environment=PODB_KOREN=$KOREN" "Environment=PODB_VETKA=claude/podbivka" \
            "ExecStart=$KOREN/analysis/podbivka_trending_push.sh" "TimeoutStartSec=900" \
            > junity/podbivka-trending-push.service
          printf '%s\n' "[Unit]" "Description=Трендинги: суточный пуш в 02:17 UTC" "" \
            "[Timer]" "OnCalendar=*-*-* 02:17:00 UTC" "Persistent=true" "" \
            "[Install]" "WantedBy=timers.target" \
            > junity/podbivka-trending-push.timer

          echo "--- chto napisali ---"
          for F in junity/*; do
            echo "=== $F ==="
            cat "$F"
          done
          # ПРОВЕРКА ДО ОТПРАВКИ: ни один юнит не пуст и у каждого есть секция.
          for F in junity/*; do
            [ -s "$F" ] || { echo "SBOJ: $F pust"; exit 1; }
            grep -q '^\[Unit\]' "$F" || { echo "SBOJ: v $F net sekcii [Unit]"; exit 1; }
          done
          scp -i ~/.ssh/miami_key -o StrictHostKeyChecking=accept-new \
            junity/podbivka-trending-min.service junity/podbivka-trending-min.timer \
            junity/podbivka-trending-5min.service junity/podbivka-trending-5min.timer \
            junity/podbivka-trending-pervye.service junity/podbivka-trending-pervye.timer \
            junity/podbivka-trending-push.service junity/podbivka-trending-push.timer \
            root@"$HOST_LAB":/etc/systemd/system/
          echo "juniti dostavleny"

      - name: "Включить таймеры сбора (таймер пуша -- нет, и это названо)"
        if: ${{ env.TOLKO_DIAGNOZ != 'yes' }}
        run: |
          set -e
          set -o pipefail
          ssh $SSH_OPTS root@"$HOST_LAB" 'bash -s' <<'VKLJUCHAEM'
            set -e
            chmod 644 /etc/systemd/system/podbivka-trending-*.service \
                      /etc/systemd/system/podbivka-trending-*.timer
            systemctl daemon-reload
            # ПРОВЕРЯЕМ ВСЕ ЧЕТЫРЕ СЛУЖБЫ, А НЕ ОДНУ, И СМОТРИМ НА СЛОВА
            # "fatal error". Повод: в юните таблицы первых появлений есть
            # знак процента ($(date -u -d yesterday +%%F)), а systemd читает
            # процент как свой спецификатор -- неудвоенный развалил бы юнит,
            # и таймер молча не пошёл бы. Проверено у себя с отрицательным
            # контролем: удвоенный даёт код 0, подложенный %Q -- "Failed to
            # resolve unit specifiers ... Invalid slot" и код 1. На код
            # возврата целиком не опираемся: verify ворчит и на безвредное.
            PLOHIH=0
            for U in min 5min pervye push; do
              F="/etc/systemd/system/podbivka-trending-$U.service"
              echo "--- verify $U ---"
              VYVOD=$(systemd-analyze verify "$F" 2>&1 || true)
              printf '%s\n' "${VYVOD:-(bez zamechanij)}" | head -6
              case "$VYVOD" in
                *"fatal error"*) echo "SBOJ: $F ne razbiraetsja systemd"; PLOHIH=$((PLOHIH + 1)) ;;
              esac
            done
            [ "$PLOHIH" -eq 0 ] || { echo "SBOJ: plohih junitov $PLOHIH -- tajmery ne vkljuchaju"; exit 1; }
            # ВКЛЮЧАЕТСЯ ТОЛЬКО СБОР ДАННЫХ. Таймер пуша поставлен, но НЕ
            # включён: включить его значит положить на машину токен записи в
            # репозиторий, то есть новый секрет на хосте.
            # Таймер таблицы первых появлений ВКЛЮЧАЕТСЯ: он сети не просит и
            # токена не требует -- считает по уже лежащим снимкам, 02:05Z, до
            # пуша в 02:17Z, чтобы таблица уехала в ветку тем же пушем.
            systemctl enable --now podbivka-trending-min.timer podbivka-trending-5min.timer \
                                   podbivka-trending-pervye.timer
            systemctl disable podbivka-trending-push.timer 2>/dev/null || true
            echo "--- tajmery ---"
            systemctl list-timers 'podbivka-trending*' --all --no-pager
            echo "--- sostojanie ---"
            for T in podbivka-trending-min.timer podbivka-trending-5min.timer \
                     podbivka-trending-pervye.timer podbivka-trending-push.timer; do
              printf '%s: enabled=%s active=%s\n' "$T" \
                "$(systemctl is-enabled "$T" 2>&1)" "$(systemctl is-active "$T" 2>&1)"
            done
          VKLJUCHAEM

      - name: "ПРОБА КАНДИДАТОВ KOTH: какой путь pump.fun ещё жив (только чтение)"
        if: ${{ env.TOLKO_DIAGNOZ != 'yes' }}
        # ЗАЧЕМ ОТДЕЛЬНЫЙ ШАГ, А НЕ ПРАВКА ПО ДОГАДКЕ. Замерено 12.10 с этой же
        # машины: /coins/king-of-the-hill отдал 404 (157 байт), а
        # /coins/currently-live на том же хосте -- 200 и 50 элементов. То есть
        # хост жив, а путь KOTH изменился или убран. Угадывать новый путь
        # нельзя: спросить pump.fun из контейнера агента НЕЧЕМ -- сетевая
        # политика окружения отказывает CONNECT к *.pump.fun с кодом 403
        # (замерено), и любой "404" оттуда ничего бы не доказал. Единственная
        # машина, которая в pump.fun ходит по-настоящему, -- эта.
        #
        # Кандидаты взяты из СПИСКА ЭНДПОИНТОВ, а не из головы: сообщество
        # описывает /coins/king-of-the-hill с ОБЯЗАТЕЛЬНЫМ параметром
        # includeNsfw (у нас он не передаётся вовсе -- вот первый кандидат), а
        # рядом живут /coins/featured на advanced-api-v2 и те же самые
        # параметры, с какими у нас уже работает currently-live.
        # ПЕРВЫЙ И ПОСЛЕДНИЙ КАНДИДАТЫ -- КОНТРОЛЬНЫЕ: один обязан дать 200
        # (иначе машина в pump.fun не ходит вовсе, и отказы ничего не значат),
        # второй обязан дать 404 (иначе сравнивать не с чем).
        run: |
          set -e
          set -o pipefail
          ssh $SSH_OPTS root@"$HOST_LAB" 'bash -s' <<'KOTHPROBA' 2>&1 | tee koth_proba.txt
            set -e
            command -v curl >/dev/null 2>&1 || { echo "curl na mashine net -- probu propuskaju"; exit 0; }
            AGENT='podbivka-trending/1.0 (+chain analytics, read-only)'
            KANDIDATY='https://frontend-api-v3.pump.fun/coins/currently-live?offset=0&limit=50&includeNsfw=false
          https://frontend-api-v3.pump.fun/coins/king-of-the-hill?includeNsfw=false
          https://frontend-api-v3.pump.fun/coins/king-of-the-hill?includeNsfw=true
          https://frontend-api-v3.pump.fun/coins?sort=market_cap&order=DESC&limit=50&includeNsfw=false
          https://advanced-api-v2.pump.fun/coins/featured?offset=0&limit=50&keywordSearchActive=false
          https://frontend-api-v3.pump.fun/coins/king-of-the-hill'
            echo "$KANDIDATY" | while read -r U; do
              [ -n "$U" ] || continue
              # ТЕЛО ОБНУЛЯЕТСЯ ПЕРЕД КАЖДЫМ КАНДИДАТОМ: иначе отказ
              # соединения оставил бы тело ПРЕДЫДУЩЕГО, и проба показала бы
              # чужие минты как свои.
              : > /tmp/koth_proba.json
              OTVET=$(curl -sS -m 25 -o /tmp/koth_proba.json                 -w '%{http_code} %{size_download}'                 -H 'accept: application/json' -A "$AGENT" "$U" 2>/dev/null || true)
              [ -n "$OTVET" ] || OTVET='000 0 (curl ne otvetil vovse)'
              MINTOV=$(grep -o '"mint"' /tmp/koth_proba.json 2>/dev/null | wc -l)
              NACHALO=$(head -c 140 /tmp/koth_proba.json 2>/dev/null | tr -d '\n' | tr -d '\r')
              echo "KANDIDAT $U"
              echo "   kod_i_bajt: $OTVET   mintov_v_tele: $MINTOV"
              echo "   nachalo_tela: $NACHALO"
            done
          KOTHPROBA
          echo "--- itog proby ---"
          # || true НА ОБОИХ ГРЕПАХ, И ЭТО НЕ ПЕРЕСТРАХОВКА: при set -e плюс
          # pipefail grep без находок возвращает 1 и валит ШАГ, то есть пустая
          # проба выглядела бы сбоем прогона, а не пустой пробой.
          grep -c 'KANDIDAT' koth_proba.txt || true
          grep -A1 'KANDIDAT' koth_proba.txt | grep 'kod_i_bajt' | sort | uniq -c | head || true

      - name: "ПЕРВЫЙ ДОКЛАД: --probno сразу (сколько из 16 списков отдают данные)"
        # ДВА УСЛОВИЯ СЛИТЫ В ОДНО: два ключа if у одного шага -- это
        # дубль ключа в YAML, второй молча затирает первый, и выключатель
        # диагноза не сработал бы вовсе. Поймано своей же проверкой разбора.
        if: ${{ env.TOLKO_DIAGNOZ != 'yes' && env.PROBNO == 'yes' }}
        run: |
          set -e
          set -o pipefail
          KOREN="$KOREN_PODBIVKI"
          # --probno НИЧЕГО НЕ ПИШЕТ, только печатает по строке на список.
          # Запускается от того же пользователя, что и таймер: иначе проверили
          # бы доступ не того, кто ходит в сеть по-настоящему.
          ssh -n $SSH_OPTS root@"$HOST_LAB" \
            "cd $KOREN && sudo -u podbivka /usr/bin/python3 analysis/podbivka_trending.py --kazhdye все --probno" \
            2>&1 | tee probno_miami.txt
          echo "--- itog ---"
          grep -E 'итого|otdali' probno_miami.txt || tail -3 probno_miami.txt

      - name: "Первый прогон таймеров: убедиться, что снимки ложатся на диск"
        if: ${{ env.TOLKO_DIAGNOZ != 'yes' }}
        run: |
          set -e
          set -o pipefail
          KOREN="$KOREN_PODBIVKI"
          ssh $SSH_OPTS root@"$HOST_LAB" "KOREN='$KOREN' bash -s" <<'PROBA'
            set -e
            systemctl start podbivka-trending-min.service || true
            sleep 3
            systemctl status podbivka-trending-min.service --no-pager -n 12 2>&1 | head -20 || true
            echo "--- chto leglo ---"
            find "$KOREN/data/trending" -type f -printf '%s %p\n' 2>/dev/null \
              | sort -rn | head -20 | awk '{printf "%8d B  %s\n", $1, $2}'
            echo "fajlov: $(find "$KOREN/data/trending" -type f 2>/dev/null | wc -l)"
            du -sh "$KOREN/data/trending" 2>/dev/null || true
          PROBA

      - name: "СТОРОЖ ДИСКА: скрипт на машину и часовой таймер (пункт 4)"
        if: ${{ env.TOLKO_DIAGNOZ != 'yes' }}
        run: |
          set -e
          set -o pipefail
          KOREN="$KOREN_PODBIVKI"
          # ЗАЧЕМ (пункт 4 владельца): без свободного места регистратор молча
          # терял снимки -- 12.10 598 МБ, 13.10 256, 14.10 4.7, 15.10 0.8 и три
          # файла по 0 байт, при ЖИВЫХ таймерах и успешных юнитах. Сторож раз в
          # час смотрит df и при свободе меньше порога ОСТАНАВЛИВАЕТ таймеры
          # регистратора и кладёт маркер data/trending/DISK_STOP -- его
          # подхватывает суточный пуш, то есть потеря становится видна из ветки.
          # ОТ root, А НЕ ОТ podbivka: остановка таймеров -- право root. В сеть
          # сторож не ходит, ключей не просит, торгового хоста не касается.
          scp -i ~/.ssh/miami_key -o StrictHostKeyChecking=accept-new \
            deploy/lab_storozh_diska.sh \
            root@"$HOST_LAB":/usr/local/sbin/lab_storozh_diska.sh
          mkdir -p junity_storozh
          printf '%s\n' "[Unit]" \
            "Description=Сторож диска: мало места -- остановить регистратор" "" \
            "[Service]" "Type=oneshot" \
            "Environment=PODB_KOREN=$KOREN" "Environment=STOROZH_POROG_GB=10" \
            "ExecStart=/usr/local/sbin/lab_storozh_diska.sh" \
            "TimeoutStartSec=120" "Nice=10" \
            > junity_storozh/podbivka-storozh-diska.service
          # :47, А НЕ :00 -- чтобы не толкаться с минутным таймером и часовыми
          # проходами на :09/:17/:39, которые на этой машине уже стоят.
          printf '%s\n' "[Unit]" "Description=Сторож диска раз в час" "" \
            "[Timer]" "OnCalendar=*-*-* *:47:00 UTC" "AccuracySec=30s" "Persistent=true" "" \
            "[Install]" "WantedBy=timers.target" \
            > junity_storozh/podbivka-storozh-diska.timer
          for F in junity_storozh/*; do
            echo "=== $F ==="; cat "$F"
            [ -s "$F" ] || { echo "SBOJ: $F pust"; exit 1; }
          done
          scp -i ~/.ssh/miami_key -o StrictHostKeyChecking=accept-new \
            junity_storozh/podbivka-storozh-diska.service \
            junity_storozh/podbivka-storozh-diska.timer \
            root@"$HOST_LAB":/etc/systemd/system/
          ssh $SSH_OPTS root@"$HOST_LAB" 'bash -s' <<'STOROZH' 2>&1 | tee storozh_miami.txt
            set -e
            chmod 755 /usr/local/sbin/lab_storozh_diska.sh
            chmod 644 /etc/systemd/system/podbivka-storozh-diska.service \
                      /etc/systemd/system/podbivka-storozh-diska.timer
            systemctl daemon-reload
            VYVOD=$(systemd-analyze verify /etc/systemd/system/podbivka-storozh-diska.service 2>&1 || true)
            printf '%s\n' "${VYVOD:-(bez zamechanij)}" | head -6
            case "$VYVOD" in
              *"fatal error"*) echo "SBOJ: junit storozha ne razbiraetsja"; exit 1 ;;
            esac
            systemctl enable --now podbivka-storozh-diska.timer
            echo "--- proba storozha pri zhivom diske (dolzhen tolko napechatat svobodu) ---"
            systemctl start podbivka-storozh-diska.service
            journalctl -u podbivka-storozh-diska.service --no-pager -n 10 | tail -6
            echo "--- sostojanie ---"
            printf 'tajmer: enabled=%s active=%s\n' \
              "$(systemctl is-enabled podbivka-storozh-diska.timer 2>&1)" \
              "$(systemctl is-active podbivka-storozh-diska.timer 2>&1)"
            systemctl list-timers 'podbivka-*' --all --no-pager | head -8
            echo "--- marker (dolzhen otsutstvovat pri svobodnom diske) ---"
            ls -l /opt/robinhood-chain-alpha/data/trending/DISK_STOP 2>&1 || echo "markera net -- tak i dolzhno byt"
          STOROZH

      - name: "ЦЕЛОСТНОСТЬ СНИМКОВ: какие .jsonl.gz побились на полном диске"
        if: ${{ env.TOLKO_DIAGNOZ != 'yes' }}
        run: |
          set -e
          set -o pipefail
          KOREN="$KOREN_PODBIVKI"
          # ЗАЧЕМ ЭТОТ ШАГ ПОЯВИЛСЯ. Прогон описи Code-2 38825166870 (попытка 3,
          # 16.10 16:07Z) дошёл до самого скрипта и упал на чтении снимка:
          # "zlib.error: Error -3 while decompressing data: invalid distance too
          # far back" в podbivka_trending_svod.py. Это оборванный gzip -- запись
          # прервалась на полном диске. Тут только ЗАМЕР: какие файлы биты и за
          # какие сутки. Ничего не удаляем и не правим -- данные чужие (Code-2),
          # а решение о них за владельцем.
          ssh $SSH_OPTS root@"$HOST_LAB" "KOREN='$KOREN' bash -s" <<'CELOST' 2>&1 | tee celost_miami.txt
            set -e
            VR=$(mktemp -d)
            trap 'rm -rf "$VR"' EXIT
            find "$KOREN/data/trending" -type f -name '*.jsonl.gz' | sort > "$VR/vse.txt"
            echo "fajlov vsego: $(wc -l < "$VR/vse.txt")"
            : > "$VR/bityye.txt"
            while IFS= read -r F; do
              gzip -t "$F" 2>/dev/null || printf '%s\n' "$F" >> "$VR/bityye.txt"
            done < "$VR/vse.txt"
            echo "bityh: $(wc -l < "$VR/bityye.txt")"
            if [ -s "$VR/bityye.txt" ]; then
              echo "--- bityye fajly: razmer, chitaemyh strok do obryva, put ---"
              # ЧИТАЕМЫХ СТРОК -- ЭТО НЕ ЛЮБОПЫТСТВО: от этого числа зависит,
              # есть ли смысл спасать сутки. Обрыв в конце gzip означает, что
              # начало файла цело; zcat отдаёт его и падает на обрыве, поэтому
              # ошибку глушим, а строки считаем.
              while IFS= read -r F; do
                printf '%10s B  strok %7s  %s\n' "$(stat -c %s "$F")" \
                  "$(zcat "$F" 2>/dev/null | wc -l)" "$F"
              done < "$VR/bityye.txt"
              echo "--- bityh po sutkam ---"
              sed -E 's#.*/([0-9]{4}-[0-9]{2}-[0-9]{2})(/.*)?[.]jsonl[.]gz#\1#; s#.*/([0-9]{4}-[0-9]{2}-[0-9]{2})/.*#\1#' \
                "$VR/bityye.txt" | sort | uniq -c
            else
              echo "vse snimki chitajutsja gzip -t"
            fi
          CELOST

      - name: "ТАБЛИЦА ПЕРВЫХ ПОЯВЛЕНИЙ ЗАДНИМ ЧИСЛОМ (12.10 и 13.10)"
        if: ${{ env.TOLKO_DIAGNOZ != 'yes' }}
        run: |
          set -e
          set -o pipefail
          KOREN="$KOREN_PODBIVKI"
          # СЛОВО ВЛАДЕЛЬЦА: "посчитать --pervye задним числом за 12.10 и 13.10
          # (за 14-16.10 данных нет -- так и записать)". Отсутствие данных не
          # домысливаем: шаг СЧИТАЕТ файлы за каждые сутки и печатает число.
          # Каждая дата -- отдельной попыткой: падение на одной (битый gzip) не
          # должно скрывать другую, поэтому запуск стоит в условии if, где
          # errexit не действует.
          ssh $SSH_OPTS root@"$HOST_LAB" \
            "KOREN='$KOREN' DATY='$DATY_PERVYH' bash -s" \
            <<'PERVYE' 2>&1 | tee pervye_miami.txt
            set -e
            cd "$KOREN"
            for D in $DATY; do
              echo "=== $D ==="
              CHAS=$(find "$KOREN/data/trending" -mindepth 3 -path "*/$D/*" -name '*.jsonl.gz' 2>/dev/null | wc -l)
              SUT=$(find "$KOREN/data/trending" -mindepth 2 -maxdepth 2 -name "$D.jsonl.gz" \
                    -not -path "*/pervye/*" 2>/dev/null | wc -l)
              # ОБЪЁМ ПО ДНЯМ -- ЧИСЛОМ: именно он отличает полные сутки от
              # суток, которые регистратор "писал" на кончившийся диск.
              BAJT=$(find "$KOREN/data/trending" \( -path "*/$D/*" -o -name "$D.jsonl.gz" \) \
                     -type f -name '*.jsonl.gz' -not -path "*/pervye/*" -printf '%s\n' 2>/dev/null \
                     | awk '{s += $1} END {printf "%d", s + 0}')
              echo "snimochnyh fajlov: chasovyh $CHAS, sutochnyh $SUT, vsego $(( BAJT / 1048576 )) MB"
              if [ "$((CHAS + SUT))" -eq 0 ]; then
                echo "ITOG $D: snimkov net, tablicu schitat ne iz chego"
                continue
              fi
              # ВЫВОД ЛОВИМ В ПЕРЕМЕННУЮ, А ПРИЧИНУ КЛАДЁМ В СТРОКУ ИТОГА.
              # Прежде итог говорил "причина выше (см. traceback)" -- и это
              # бесполезно: из контейнера читается только ХВОСТ журнала, а
              # traceback остаётся выше окна. Замер прогона 38942430142:
              # после правки Code-2 (5d87ee55) поднялись 14.10 и 16.10, а
              # 13.10 и 15.10 по-прежнему падают -- и ПОЧЕМУ, из журнала было
              # не узнать. Теперь последняя строка ошибки стоит в самом итоге.
              if VYVOD=$(sudo -u podbivka /usr/bin/python3 analysis/podbivka_trending.py --pervye "$D" 2>&1); then
                printf '%s\n' "$VYVOD" | tail -3
                T="$KOREN/data/trending/pervye/$D.jsonl.gz"
                if [ -f "$T" ]; then
                  echo "ITOG $D: tablica $(stat -c %s "$T") B, strok $(zcat "$T" | wc -l)"
                else
                  echo "ITOG $D: skript proshel, a fajla $T net"
                fi
              else
                printf '%s\n' "$VYVOD" | tail -6 | sed 's/^/    /'
                echo "ITOG $D: --pervye upal: $(printf '%s' "$VYVOD" | tail -1 | cut -c1-160)"
              fi
            done
            echo "--- chasovoj raskroj jupiter: pervyj i poslednij fajl ---"
            # ВРЕМЕННОЕ -- ЧЕРЕЗ mktemp С trap, А НЕ ФАЙЛОМ В /tmp НАУГАД:
            # на лабораторной машине от меня уже остался мусор (/tomato),
            # второй раз так не делаем.
            VR2=$(mktemp -d)
            trap 'rm -rf "$VR2"' EXIT
            find "$KOREN/data/trending/jupiter" -mindepth 2 -type f -name '*.jsonl.gz' 2>/dev/null \
              | sort > "$VR2/jup.txt" || true
            if [ -s "$VR2/jup.txt" ]; then
              # Первый и последний часовой файл; если он один -- печатаем один
              # раз, а не дважды (uniq по полному пути).
              { head -1 "$VR2/jup.txt"; tail -1 "$VR2/jup.txt"; } | awk '!v[$0]++' > "$VR2/pokaz.txt"
              while IFS= read -r F; do
                printf '%10s B  strok %6s  %s\n' "$(stat -c %s "$F")" \
                  "$(zcat "$F" 2>/dev/null | wc -l)" "$F"
              done < "$VR2/pokaz.txt"
              echo "chasovyh fajlov jupiter vsego: $(wc -l < "$VR2/jup.txt")"
            else
              echo "chasovyh fajlov jupiter net -- raskroj tolko nachalsja libo tajmer ne shjol"
            fi
          PERVYE
          echo "--- itogovye stroki ---"
          grep -E '^(ITOG|PROVERKA)' pervye_miami.txt || true

      - name: "Выложить первый доклад артефактом"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: podbivka-trending-miami-probno
          path: |
            probno_miami.txt
            samoproverka_miami.txt
            celost_miami.txt
            pervye_miami.txt
            storozh_miami.txt
          retention-days: 90
          if-no-files-found: warn

      - name: "СВОДКА ПРОГОНА: всё главное одним куском в конце"
        # ЗАЧЕМ ОТДЕЛЬНЫЙ ШАГ В КОНЦЕ. Архив журналов прогона из этого
        # контейнера недоступен: прокси отвечает Forbidden и на
        # results-receiver.actions.githubusercontent.com (gh run view --log), и
        # на хранилище артефактов (gh run download). Читается ТОЛЬКО ХВОСТ
        # журнала через API заданий -- значит главное должно лежать в хвосте,
        # иначе замеры середины прогона просто нечем прочесть.
        if: ${{ always() }}
        run: |
          set -e
          # МАШИНА И ДИСК -- ПЕРВОЙ СТРОКОЙ СВОДКИ. Из контейнера читается
          # только ХВОСТ журнала задания, а df печатается шагом диагноза в
          # середине -- то есть выше окна хвоста. В утреннем докладе 17.10
          # свободного места на miami просто не оказалось чем подтвердить, и
          # пришлось гонять прогон второй раз. У установщика ams такой раздел
          # есть с самого начала; здесь его не было.
          echo "=== 0. MASHINA I DISK ==="
          if [ -f diagnoz_miami.txt ]; then
            grep -E '^(Filesystem|/dev/|tmpfs .* /$)' diagnoz_miami.txt | head -6 || true
            grep -E '^(miami|nproc|Python|systemd)' diagnoz_miami.txt | head -4 || true
          else
            echo "(shag diagnoza ne shjol)"
          fi
          echo "=== 1. SAMOPROVERKA DO USTANOVKI ==="
          if [ -f samoproverka_miami.txt ]; then
            grep -cE '^  ОК' samoproverka_miami.txt | sed 's/^/strok OK: /'
            grep -E '^  СБОЙ' samoproverka_miami.txt || echo "strok SBOJ: 0"
            tail -1 samoproverka_miami.txt
          else
            echo "(shag ne shjol)"
          fi
          echo "=== 2. CELOSTNOST SNIMKOV (gzip -t) ==="
          if [ -f celost_miami.txt ]; then
            grep -E '^(fajlov vsego|bityh|vse snimki)' celost_miami.txt || true
            grep -E '^ *[0-9]+ B  strok' celost_miami.txt || true
            sed -n '/bityh po sutkam/,$p' celost_miami.txt | tail -8
          else
            echo "(shag ne shjol)"
          fi
          echo "=== 3. TABLICY PERVYH POJAVLENIJ ==="
          if [ -f pervye_miami.txt ]; then
            grep -E '^(=== 20|snimochnyh fajlov|ITOG |    [0-9]+ B  strok|chasovyh fajlov jupiter)' \
              pervye_miami.txt || true
          else
            echo "(shag ne shjol)"
          fi
          echo "=== 4. STOROZH DISKA ==="
          if [ -f storozh_miami.txt ]; then
            grep -E '^(tajmer:|storozh diska:|MALO MESTA|marker polozhen|markera net)' storozh_miami.txt || true
            grep -E 'podbivka-storozh-diska' storozh_miami.txt | head -3 || true
          else
            echo "(shag ne shjol)"
          fi
          echo "=== 5. PROBA ENDPOINTOV (--probno) ==="
          if [ -f probno_miami.txt ]; then
            grep -E 'итого' probno_miami.txt || tail -2 probno_miami.txt
          else
            echo "(shag ne shjol)"
          fi
