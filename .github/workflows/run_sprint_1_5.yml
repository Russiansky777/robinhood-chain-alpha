name: Run Sprint 1.5 (final copytrading kill-test)

on:
  workflow_dispatch: {}

jobs:
  run-sprint-1-5:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Тот же кэш, что и у Sprint 1 (см. run_pipeline.yml) -- один
      # общий префикс "dune-cache-", чтобы Sprint 1.5 подхватывал уже
      # материализованные 02/01/03 из прошлых прогонов ЛЮБОГО из двух
      # workflow, если SQL совпадает байт-в-байт.
      - name: Restore Dune query cache
        uses: actions/cache@v4
        with:
          path: analysis/output/cache
          key: dune-cache-${{ github.run_id }}
          restore-keys: |
            dune-cache-

      - name: Install dependencies
        run: pip install -r analysis/requirements.txt

      - name: Run Sprint 1.5
        env:
          DUNE_API_KEY: ${{ secrets.DUNE_API_KEY }}
        run: python analysis/sprint_1_5.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/RESULTS.md
          if [ -d data ]; then git add data/; fi
          git diff --cached --quiet || git commit -m "Update Sprint 1.5 results [automated]"
          git push
