name: Run Sprint 1.5 (final copytrading kill-test)

on:
  workflow_dispatch: {}

jobs:
  run-sprint-1-5:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Тот же кэш, что и у Sprint 1 (см. run_pipeline.yml) -- один
      # общий префикс "dune-cache-", чтобы Sprint 1.5 подхватывал уже
      # материализованные 02/01/03 из прошлых прогонов ЛЮБОГО из двух
      # workflow, если SQL совпадает байт-в-байт.
      - name: Restore Dune query cache
        uses: actions/cache@v4
        with:
          path: analysis/output/cache
          key: dune-cache-${{ github.run_id }}
          restore-keys: |
            dune-cache-
          # save-always: без этого actions/cache пропускает сохранение,
          # если джоб завершился с ненулевым кодом -- а BudgetGuardStop
          # всегда выходит с ненулевым (см. docs/COST_POSTMORTEM.md,
          # ревизия 4). Основная защита теперь -- постоянный закоммиченный
          # data/sprint15_cache/ (см. dune_client.py), это дополнительная.
          save-always: true

      - name: Install dependencies
        run: pip install -r analysis/requirements.txt

      # Одноразовое бесплатное восстановление query_id для 01/02/03 (см.
      # docs/COST_POSTMORTEM.md): run #13 (последний успешный Sprint 1)
      # выполнился ДО появления шага "Restore Dune query cache" выше --
      # его query_ids.json умер вместе с контейнером. Только status+query
      # GET (0 кредитов), пишет и коммитит data/query_ids_recovered.json
      # НАВСЕГДА -- идемпотентно, безопасно гонять на каждом прогоне.
      - name: Recover Sprint 1 query_ids (0 credits)
        env:
          DUNE_API_KEY: ${{ secrets.DUNE_API_KEY }}
        run: python analysis/recover_query_ids.py

      # Одноразовое дешёвое (~0.26 кредита) восстановление уже
      # оплаченного результата 03b_cohort_selection (execution_id из
      # run #3) в постоянный кэш -- см. docs/COST_POSTMORTEM.md,
      # ревизия 4. Идемпотентно: если постоянный файл уже есть, ничего
      # не делает и не тратит.
      - name: Recover 03b result into permanent cache (~0.26 credits)
        env:
          DUNE_API_KEY: ${{ secrets.DUNE_API_KEY }}
        run: python analysis/recover_03b_result.py

      - name: Run Sprint 1.5
        env:
          DUNE_API_KEY: ${{ secrets.DUNE_API_KEY }}
        run: python analysis/sprint_1_5.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/RESULTS.md
          if [ -d data ]; then git add data/; fi
          git diff --cached --quiet || git commit -m "Update Sprint 1.5 results [automated]"
          git push
