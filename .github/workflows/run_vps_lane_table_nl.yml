name: "Полоса: таблица покупок (слот, место, кто довёз, время) -- только чтение"

# Владелец 25.09: "По всем покупкам полосы с 15:13Z: слот относительно
# источника, место в блоке, кто довёз, время от сигнала до посадки. Таблицей."
#
# ПРОГОН ТОЛЬКО ЧИТАЕТ. Копия журнала позиций с хоста, разбор локальным модулем
# analysis/lane_table.py, таблица в data/ и (по входу) одним сообщением в
# Telegram. Ни одной записи на хост, ни одной покупки, ни одного обращения к
# DBot.
#
# ИДЁТ С ОБЛАЧНОГО БЕГУНКА, а не со своего на хосте. Причина простая: свой
# бегунок занимают долгие замеры (зонд BAM держит его два часа), и часовая
# таблица вставала бы в очередь за ними. Хост читается по внешнему адресу тем
# же ключом VPS_SSH_KEY.
on:
  workflow_dispatch:
    inputs:
      since:
        description: "только покупки с этого UTC (например 2026-09-25T15:13)"
        required: false
        default: ""
      telegram:
        description: "'yes' -- послать таблицу в основной чат владельца (по умолчанию yes)"
        required: false
        default: "yes"
      telegram_rows:
        description: "сколько последних покупок в сообщении Telegram"
        required: false
        default: "12"

concurrency:
  group: lane-table
  cancel-in-progress: false

env:
  HOST: 45.59.170.76
  STATE_DIR: /home/bot/bloom_executor_live_data

jobs:
  table:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/nifty-sagan-r0polg

      - name: "SSH key"
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -e
          [ -n "$VPS_SSH_KEY" ] || { echo "СБОЙ: VPS_SSH_KEY не задан"; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          echo "SSH_OPTS=-i $HOME/.ssh/vps_key -o ConnectTimeout=15 -o BatchMode=yes -o StrictHostKeyChecking=accept-new" >> "$GITHUB_ENV"

      - name: "Копия журнала позиций (только чтение)"
        run: |
          set -e
          set -o pipefail
          mkdir -p /tmp/bloom_state
          ssh -n $SSH_OPTS root@$HOST "cat $STATE_DIR/positions.jsonl" > /tmp/bloom_state/positions.jsonl
          echo "positions.jsonl: $(wc -c < /tmp/bloom_state/positions.jsonl) байт, строк $(wc -l < /tmp/bloom_state/positions.jsonl)"

      - name: "Питон с requests (на облачном бегунке его нет в системе)"
        run: |
          set -e
          if python3 -c "import requests" 2>/dev/null; then
            echo "PY=python3" >> "$GITHUB_ENV"
          else
            python3 -m venv "$RUNNER_TEMP/tbl_venv"
            "$RUNNER_TEMP/tbl_venv/bin/pip" install -q requests
            echo "PY=$RUNNER_TEMP/tbl_venv/bin/python" >> "$GITHUB_ENV"
          fi

      - name: "Таблица покупок полосы"
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Отправка в чат у оповещателя закрыта общим выключателем: без него
          # он молчит совсем (и первый прогон таблицы честно сказал об этом
          # словами). Здесь выключатель ставится ТОЛЬКО для этого прогона --
          # на хосте он свой, и деплой его не касается.
          BLOOM_TELEGRAM_LIVE_TEST: "1"
        run: |
          set -e
          set -o pipefail
          mkdir -p data
          # Кошелёк полосы берём с хоста: в записях позиций в поле wallet лежит
          # адрес ИСПОЛНИТЕЛЯ, и проверка токенов по нему смотрит не туда.
          LANE_WALLET=$(ssh -n $SSH_OPTS root@$HOST "set -a; . /etc/bloom-executor/env; set +a; printf %s \$OWN_SEND_WALLET")
          echo "кошелёк полосы: $LANE_WALLET"
          TG=""
          if [ "${{ inputs.telegram }}" = "yes" ]; then
            [ -n "$TELEGRAM_BOT_TOKEN" ] || { echo "СБОЙ: TELEGRAM_BOT_TOKEN пуст, а таблицу просили в чат"; exit 1; }
            TG="--telegram --telegram-rows ${{ inputs.telegram_rows }}"
          fi
          "$PY" analysis/lane_table.py \
            --positions /tmp/bloom_state/positions.jsonl \
            --since '${{ inputs.since }}' --chain --wallet "$LANE_WALLET" \
            --out-md data/lane_table.md \
            --out-json data/lane_table.json \
            --raw-json data/lane_table_raw.json $TG | tail -45

      - name: "Коммит таблицы"
        if: always()
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/lane_table.md data/lane_table.json data/lane_table_raw.json 2>/dev/null || true
          git diff --cached --quiet && { echo "нечего коммитить"; exit 0; }
          git commit -m "Polosa: tablitsa pokupok (slot, mesto, kto dovyoz) [automated]"
          for i in 1 2 3 4 5; do
            git push origin HEAD:claude/nifty-sagan-r0polg && exit 0
            git pull --rebase -X theirs origin claude/nifty-sagan-r0polg
            sleep 3
          done
          exit 1
