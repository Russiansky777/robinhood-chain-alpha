name: "Полоса: таблица покупок (слот, место, кто довёз, время) -- только чтение"

# Владелец 25.09: "По всем покупкам полосы с 15:13Z: слот относительно
# источника, место в блоке, кто довёз, время от сигнала до посадки. Таблицей."
#
# ПРОГОН ТОЛЬКО ЧИТАЕТ. Копия журнала позиций с хоста, разбор локальным модулем
# analysis/lane_table.py, таблица в data/. Ни одной записи на хост, ни одной
# покупки, ни одного обращения к DBot.
on:
  workflow_dispatch:
    inputs:
      since:
        description: "только покупки с этого UTC (например 2026-09-25T15:13)"
        required: false
        default: ""

concurrency:
  group: lane-table
  cancel-in-progress: false

env:
  HOST: 127.0.0.1
  STATE_DIR: /home/bot/bloom_executor_live_data

jobs:
  table:
    runs-on: ${{ fromJSON('["self-hosted","nl-host"]') }}
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/nifty-sagan-r0polg

      - name: "SSH key"
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -e
          [ -n "$VPS_SSH_KEY" ] || { echo "СБОЙ: VPS_SSH_KEY не задан"; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          echo "SSH_OPTS=-i $HOME/.ssh/vps_key -o ConnectTimeout=15 -o BatchMode=yes -o StrictHostKeyChecking=accept-new" >> "$GITHUB_ENV"

      - name: "Копия журнала позиций (только чтение)"
        run: |
          set -e
          set -o pipefail
          mkdir -p /tmp/bloom_state
          ssh -n $SSH_OPTS root@$HOST "cat $STATE_DIR/positions.jsonl" > /tmp/bloom_state/positions.jsonl
          echo "positions.jsonl: $(wc -c < /tmp/bloom_state/positions.jsonl) байт, строк $(wc -l < /tmp/bloom_state/positions.jsonl)"

      - name: "Таблица покупок полосы"
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API }}
        run: |
          set -e
          set -o pipefail
          mkdir -p data
          python3 analysis/lane_table.py \
            --positions /tmp/bloom_state/positions.jsonl \
            --since '${{ inputs.since }}' --chain \
            --out-md data/lane_table.md \
            --out-json data/lane_table.json \
            --raw-json data/lane_table_raw.json | tail -40

      - name: "Коммит таблицы"
        if: always()
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/lane_table.md data/lane_table.json data/lane_table_raw.json 2>/dev/null || true
          git diff --cached --quiet && { echo "нечего коммитить"; exit 0; }
          git commit -m "Polosa: tablitsa pokupok (slot, mesto, kto dovyoz) [automated]"
          for i in 1 2 3 4 5; do
            git push origin HEAD:claude/nifty-sagan-r0polg && exit 0
            git pull --rebase -X theirs origin claude/nifty-sagan-r0polg
            sleep 3
          done
          exit 1
