name: "Задача B -- фандинг на сток-перпах Lighter (только чтение, публичный API, без капитала)"

# Владелец, 2026-09-05, после бэкфилла Lighter x Hyperliquid, "из
# истории, без капитала": фандинг на сток-перпах Lighter (api.rh.lighter.xyz,
# та же площадка, что уже используется для хеджа P5/логгера спреда --
# капитал заперт в конкретной позиции до закрытия, допустима по
# ограничению владельца на CEX-кастодиальный риск).

on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/sc1-pons-v2-launcher-efdbyt
    paths:
      - "data/p3_guard_cache/LIGHTER_STOCK_PERP_FUNDING_REQUEST"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r analysis/requirements.txt
      - name: Фандинг на сток-перпах Lighter (только чтение)
        run: python -u analysis/lighter_stock_perp_funding.py
      - name: Commit results
        if: always()
        run: |
          git rm -f --ignore-unmatch data/p3_guard_cache/LIGHTER_STOCK_PERP_FUNDING_REQUEST
          [ -e data/p3_guard_cache/lighter_stock_perp_funding_result.json ] && git add data/p3_guard_cache/lighter_stock_perp_funding_result.json
          git diff --cached --quiet && exit 0
          git commit -m "Задача B: фандинг на сток-перпах Lighter, результат [automated]"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected, попытка $i/5 -- git pull --rebase и повтор"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep 3
          done
          echo "не удалось запушить после 5 попыток" >&2
          exit 1
