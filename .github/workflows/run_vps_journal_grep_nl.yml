name: "Журнал решений: выборка по строкам (только чтение, потоком)"

# ЗАЧЕМ. Журнал решений на хосте 635 МБ, и почти каждый ночной расчёт упирается
# в один вопрос: "покажи записи по этой подписи / этому минту / этому окну".
# Читать его в память нельзя -- 25.09 в 16:23Z это уже съело хост и уронило
# бегунок. Здесь чтение ТОЛЬКО потоком: grep -F по фиксированным строкам на
# хосте под nice/ionice, наружу уходят только совпавшие строки.
#
# Только чтение: ни одной записи на хост, ни одного обращения к цепи, ни одной
# покупки. Службы не трогаются.
on:
  workflow_dispatch:
    inputs:
      patterns:
        description: "фиксированные строки через запятую (подпись, минт, адрес)"
        required: true
      file:
        description: "'decisions' (по умолчанию), 'positions' или 'seller' (журнал продавца)"
        required: false
        default: "decisions"
      fields:
        description: "какие ключи печатать через запятую (пусто -- запись целиком)"
        required: false
        default: ""
      limit:
        description: "сколько последних совпавших строк взять"
        required: false
        default: "40"
      rotated:
        description: "'yes' -- искать и в ротированных .gz (история за прошлые сутки)"
        required: false
        default: "no"
      runner:
        description: "'nl' -- свой бегунок на хосте (по умолчанию), 'cloud' -- запасной облачный"
        required: false
        default: "nl"

concurrency:
  group: journal-grep-nl
  cancel-in-progress: false

# СВОЙ БЕГУНОК, А НЕ ОБЛАЧНЫЙ (слово владельца 02.10, п.6). Ночью 02->03.10
# чужая сессия заняла облачные бегунки счёта одиннадцатью параллельными
# работами, и служебные прогоны -- учёт, живучесть, выборка из журнала -- встали
# в очередь на час. Служебное чтение не должно зависеть от чужой очереди.
# Облачный путь остаётся запасным: вход runner=cloud.
env:
  STATE_DIR: /home/bot/bloom_executor_live_data

jobs:
  grep:
    runs-on: ${{ inputs.runner == 'cloud' && 'ubuntu-latest' || fromJSON('["self-hosted","nl-host"]') }}
    # АДРЕС ХОСТА ЗАВИСИТ ОТ БЕГУНКА: со своего бегунка он сам себе loopback
    # (так же, как у прогонов деплоя), из облака -- публичный адрес.
    env:
      HOST: ${{ inputs.runner == 'cloud' && '45.59.170.76' || '127.0.0.1' }}
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/nifty-sagan-r0polg

      - name: "SSH key"
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -e
          [ -n "$VPS_SSH_KEY" ] || { echo "СБОЙ: VPS_SSH_KEY не задан"; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          echo "SSH_OPTS=-i $HOME/.ssh/vps_key -o ConnectTimeout=20 -o BatchMode=yes -o StrictHostKeyChecking=accept-new" >> "$GITHUB_ENV"

      - name: "Выборка потоком с хоста"
        env:
          OBRAZCY: ${{ inputs.patterns }}
        run: |
          set -e
          set -o pipefail
          case "${{ inputs.file }}" in
            positions) SRC="$STATE_DIR/positions.jsonl" ;;
            # ЖУРНАЛ ПРОДАВЦА -- ТРЕТИЙ ФАЙЛ СОСТОЯНИЯ. Решения детектора и
            # записи позиций не отвечают на вопрос "что делал продавец с этой
            # позицией и послал ли он строку владельцу": это seller.jsonl.
            # 04.10 вечером разбор списания упёрся ровно в это.
            seller)    SRC="$STATE_DIR/seller.jsonl" ;;
            *)         SRC="$STATE_DIR/decisions.jsonl" ;;
          esac
          # ОБРАЗЦЫ -- ФАЙЛОМ, А НЕ СПИСКОМ -e. Здесь стояло
          # `for P in $(echo "$patterns" | tr ',' ' ')`, и образец со ПРОБЕЛОМ
          # распадался на два: «предел полосы» искалось как «предел» ИЛИ
          # «полосы». Выборка при этом выглядела полной -- ровно limit строк, --
          # и по ней можно было посчитать что угодно. Теперь образцы делятся
          # ТОЛЬКО по запятой, уезжают на хост файлом через stdin и читаются
          # `grep -F -f`: ни пробелы, ни кавычки, ни кириллица больше ничего не
          # ломают, а каждый образец печатается в журнал прогона, чтобы видеть,
          # что именно искали.
          mkdir -p /tmp/jgrep
          : > /tmp/jgrep/patterns.txt
          # ДЕЛИМ ТОЛЬКО ПО ЗАПЯТОЙ: IFS=, оставляет пробелы внутри образца на
          # месте. Без этого «предел полосы» распадалось на два образца.
          STAR_IFS=$IFS
          IFS=','
          set -- $OBRAZCY
          IFS=$STAR_IFS
          for P in "$@"; do
            P=$(printf '%s' "$P" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')
            [ -n "$P" ] && printf '%s\n' "$P" >> /tmp/jgrep/patterns.txt
          done
          [ -s /tmp/jgrep/patterns.txt ] || { echo "СБОЙ: образцов нет"; exit 1; }
          echo "--- образцы (по строке на образец) ---"
          cat -A /tmp/jgrep/patterns.txt | sed 's/\$$//'
          # ПУСТОЙ ОБРАЗЕЦ СОВПАЛ БЫ С КАЖДОЙ СТРОКОЙ, и выборка выглядела бы
          # полной. Такой образец -- отказ, а не "нашли всё".
          if grep -qx "" /tmp/jgrep/patterns.txt; then
            echo "СБОЙ: среди образцов есть пустой -- он совпал бы с каждой строкой"
            exit 1
          fi
          ssh $SSH_OPTS root@$HOST "umask 077; cat > /tmp/jgrep_patterns.txt" < /tmp/jgrep/patterns.txt
          ssh -n $SSH_OPTS root@$HOST "wc -l < /tmp/jgrep_patterns.txt"
          # nice/ionice: детектор на этом же хосте торгует, и замер не должен
          # его тормозить. Вывод идёт потоком сразу в файл на бегунке.
          # Сначала ФАКТ о файле: есть ли он и какого размера. Без этого пустая
          # выборка читается как "совпадений нет", хотя причина может быть в
          # пути или в том, что журнал переехал.
          ssh -n $SSH_OPTS root@$HOST "ls -l $SRC; wc -l < $SRC; \
            echo '--- каталог состояния ---'; ls -la $STATE_DIR | head -40; \
            echo '--- место на диске ---'; df -h / /tmp | tail -3; \
            echo '--- первая и последняя строка журнала ---'; \
            head -1 $SRC | cut -c1-160; tail -1 $SRC | cut -c1-160"
          # ionice есть не везде: если его нет, команда упала бы целиком и
          # выборка молча вышла бы пустой. Поэтому запускаем через nice, а
          # ionice добавляем только когда он есть.
          # РОТАЦИЯ. На хосте стоит logrotate: в 22:00Z сутки уезжают в
          # decisions.jsonl.1.gz, и текущий файл начинается заново. Искать
          # только в текущем значит терять историю -- 25.09 это дало пустую
          # выборку по подписи 21:07Z и выглядело как "записи нет".
          ROT=""
          [ "${{ inputs.rotated }}" = "yes" ] && ROT="yes"
          # ПОРЯДОК ПОТОКА РЕШАЕТ, ЧТО ОСТАВИТ tail. Здесь текущий журнал шёл
          # ПЕРВЫМ, а ротированные -- после него, и `tail -n limit` оставлял
          # самые СТАРЫЕ совпадения, хотя вход называется "сколько ПОСЛЕДНИХ".
          # Живой счёт 03.10: выборка по трём источникам упёрлась в предел 4000
          # и вернула окно 24-28.09 вместо последних трёх суток -- то есть по
          # ней можно было посчитать "за 72 часа" и получить числа почти
          # недельной давности, и ничто бы об этом не сказало. Теперь поток идёт
          # ПО ВРЕМЕНИ: сперва ротированные от самого старого, текущий -- последним.
          #
          # ПОРЯДОК РОТИРОВАННЫХ. logrotate нумерует .1 самым СВЕЖИМ, поэтому
          # обратная сортировка версий (10, 9, ... 1) и даёт хронологию.
          ssh -n $SSH_OPTS root@$HOST \
            "ION=\$(command -v ionice >/dev/null 2>&1 && echo 'ionice -c3' || true); \
             { if [ -n \"$ROT\" ]; then \
                 for G in \$(ls -1 $SRC.*.gz 2>/dev/null | sort -V -r); do \
                   [ -e \"\$G\" ] || continue; \
                   nice -n 15 \$ION zgrep -F -f /tmp/jgrep_patterns.txt \"\$G\" || true; done; \
               fi; \
               nice -n 15 \$ION grep -F -f /tmp/jgrep_patterns.txt $SRC; } \
             | tail -n ${{ inputs.limit }}" \
            > /tmp/jgrep/hits.jsonl && RC=0 || RC=$?
          # grep без совпадений отдаёт 1 -- это не сбой, это ответ "нет такого".
          # Любой другой код -- сбой, и он виден, а не съеден.
          ssh -n $SSH_OPTS root@$HOST "rm -f /tmp/jgrep_patterns.txt" || true
          echo "выборка завершилась кодом $RC"
          case "$RC" in 0|1) ;; *) echo "СБОЙ выборки"; exit "$RC" ;; esac
          echo "совпало строк: $(wc -l < /tmp/jgrep/hits.jsonl)"
          echo "байт: $(wc -c < /tmp/jgrep/hits.jsonl)"

      - name: "Печать и файл"
        env:
          FIELDS: ${{ inputs.fields }}
          PATTERNS: ${{ inputs.patterns }}
          SRCFILE: ${{ inputs.file }}
          LIMIT: ${{ inputs.limit }}
        run: |
          set -e
          python3 - <<'PY'
          import json, pathlib, os
          поля = [п.strip() for п in os.environ.get("FIELDS", "").split(",") if п.strip()]
          строки = []
          путь = pathlib.Path("/tmp/jgrep/hits.jsonl")
          for s in путь.read_text(encoding="utf-8", errors="replace").splitlines():
              s = s.strip()
              if not s.startswith("{"):
                  continue
              try:
                  з = json.loads(s)
              except json.JSONDecodeError:
                  continue
              строки.append({к: з.get(к) for к in поля} if поля else з)
          # ОКНО И УСЕЧЕНИЕ -- В САМОЙ ВЫБОРКЕ, А НЕ В ГОЛОВЕ ЧИТАТЕЛЯ. Выборка,
          # упёршаяся в предел, выглядит точно так же, как полная: ровно limit
          # записей и ни слова о том, что осталось за краем. По такой выборке
          # 03.10 можно было посчитать "за 72 часа" по данным 24-28.09. Теперь
          # рядом с записями лежат границы окна и честный признак усечения.
          предел = int(os.environ.get("LIMIT") or 0)
          вр = sorted(з.get("ts_utc") for з in строки if з.get("ts_utc"))
          усечено = bool(предел) and len(строки) >= предел
          окно = {"ot": (вр[0] if вр else None), "do": (вр[-1] if вр else None),
                   "zapisej": len(строки), "predel": предел or None,
                   "usecheno": усечено,
                   "chem_grozit": ("предел достигнут -- за краем остались записи "
                                    "СТАРШЕ границы 'ot'; окно считать по этим "
                                    "границам, а не по задуманному"
                                    if усечено else None)}
          pathlib.Path("data").mkdir(exist_ok=True)
          pathlib.Path("data/journal_grep.json").write_text(
              json.dumps({"patterns": os.environ.get("PATTERNS", ""),
                          "file": os.environ.get("SRCFILE", ""),
                          "okno": окно,
                          "rows": строки}, ensure_ascii=False, indent=1),
              encoding="utf-8")
          print(f"записей разобрано: {len(строки)}")
          print("окно: " + json.dumps(окно, ensure_ascii=False))
          for з in строки[-40:]:
              print(json.dumps(з, ensure_ascii=False)[:1200])
          PY

      - name: "Коммит выборки"
        if: always()
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -f data/journal_grep.json ] && git add data/journal_grep.json
          git diff --cached --quiet && { echo "нечего коммитить"; exit 0; }
          git commit -m "Журнал: выборка по строкам [automated]"
          for i in 1 2 3 4 5; do
            git push origin HEAD:claude/nifty-sagan-r0polg && exit 0
            git pull --rebase -X theirs origin claude/nifty-sagan-r0polg
            sleep 3
          done
          exit 1
