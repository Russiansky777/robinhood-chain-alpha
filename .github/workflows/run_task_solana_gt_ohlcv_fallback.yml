name: "Solana -- честный фолбэк: цена по горизонтам через GeckoTerminal OHLCV"

on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/nifty-sagan-r0polg
    paths:
      - "data/p3_guard_cache/TASK_SOLANA_GT_OHLCV_FALLBACK_REQUEST"

jobs:
  gt_fallback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests
      - name: "Цена по горизонтам через GT OHLCV (после провала прямого RPC-decode на объёме пула)"
        run: python -u analysis/task_solana_gt_ohlcv_fallback.py
      - name: Commit results
        if: always()
        run: |
          git rm -f --ignore-unmatch data/p3_guard_cache/TASK_SOLANA_GT_OHLCV_FALLBACK_REQUEST
          [ -e data/task_solana_gt_ohlcv_fallback_result.json ] && git add data/task_solana_gt_ohlcv_fallback_result.json
          git diff --cached --quiet && exit 0
          git commit -m "Solana: GT OHLCV фолбэк для горизонтов, результат [automated]"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected, попытка $i/5 -- git pull --rebase и повтор"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep 3
          done
          echo "не удалось запушить после 5 попыток" >&2
          exit 1
