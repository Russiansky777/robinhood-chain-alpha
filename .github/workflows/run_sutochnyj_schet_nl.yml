name: "Суточный счёт полосы до позиции и последние подписи кошелька (чтение)"

# ЗАЧЕМ (слово владельца 29.09, п.А): стоп 00:49:48Z "суточный убыток
# -2.189326375 при пороге -1.5" -- подтвердить, что это перезапуск сторожа, а не
# новая сделка, и разложить число по сделкам рядом с потерей по цепи.
#
# Считает ТОЙ ЖЕ формулой, что и стоп, позиция за позицией, и показывает
# последние подписи кошелька полосы с цепи: была ли после 22:40:43Z хоть одна
# сделка или только закрытия счетов.
#
# Только чтение. Ни подписей, ни отправок, ни правок состояния.
on:
  workflow_dispatch:
    inputs:
      podpisej:
        description: "сколько последних подписей кошелька разобрать"
        required: false
        default: "12"

concurrency:
  group: sutochnyj-schet
  cancel-in-progress: false

env:
  ENV_DIR: /etc/bloom-executor
  TARGET_HOST: 127.0.0.1
  CODE_DIR: /home/bot/bloom_executor
  # ПИТОН СЛУЖБЫ, А НЕ СИСТЕМНЫЙ: solders живёт только в её venv.
  VENV: /home/bot/robinhood-chain-alpha/venv/bin
  STATE_DIR: /home/bot/bloom_executor_live_data
  RABOTA: /tmp/sutochnyj_schet
  OUT_FILE: data/sutochnyj_schet_polosy.json

jobs:
  schet:
    runs-on: ${{ fromJSON('["self-hosted","nl-host"]') }}
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/nifty-sagan-r0polg

      - name: "Сборка модуля"
        run: python3 -m py_compile deploy/checks/sutochnyj_schet_polosy.py

      - name: "SSH key"
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -e
          [ -n "$VPS_SSH_KEY" ] || { echo "SBOY: VPS_SSH_KEY ne zadan"; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          echo "SSH_OPTS=-i $HOME/.ssh/vps_key -o ConnectTimeout=15 -o BatchMode=yes -o StrictHostKeyChecking=accept-new" >> "$GITHUB_ENV"

      - name: "Счёт на хосте"
        run: |
          set -e
          set -o pipefail
          ssh -n $SSH_OPTS root@$TARGET_HOST "rm -rf $RABOTA; install -d -m 777 $RABOTA"
          ssh $SSH_OPTS root@$TARGET_HOST "cat > $RABOTA/sutochnyj_schet_polosy.py" < deploy/checks/sutochnyj_schet_polosy.py
          ssh -n $SSH_OPTS root@$TARGET_HOST "set -a; . $ENV_DIR/env; set +a; cd $CODE_DIR && sudo -u bot -E env PYTHONPATH=$CODE_DIR BLOOM_CODE_DIR=$CODE_DIR $VENV/python $RABOTA/sutochnyj_schet_polosy.py --state-dir $STATE_DIR --podpisej '${{ inputs.podpisej }}' --out $RABOTA/out.json" | tail -60
          ssh -n $SSH_OPTS root@$TARGET_HOST "cat $RABOTA/out.json 2>/dev/null || true" > /tmp/sutochnyj_schet.json || true
          if python3 -c "import json; json.load(open('/tmp/sutochnyj_schet.json'))" 2>/dev/null; then
            cp /tmp/sutochnyj_schet.json "$OUT_FILE"
            echo "obnovlen $OUT_FILE"
          else
            echo "SBOY: schjot ne sobralsya"
            exit 1
          fi
          ssh -n $SSH_OPTS root@$TARGET_HOST "rm -rf $RABOTA"

      - name: "Коммит"
        if: always()
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -f "$OUT_FILE" ] && git add "$OUT_FILE"
          git diff --cached --quiet && { echo "nechego kommitit"; exit 0; }
          git commit -m "Sutochnyj schjot polosy do pozicii [automated]"
          for i in 1 2 3 4 5; do
            git push origin HEAD:claude/nifty-sagan-r0polg && exit 0
            git pull --rebase -X theirs origin claude/nifty-sagan-r0polg
            sleep 3
          done
          exit 1
