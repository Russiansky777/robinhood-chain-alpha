name: SC1 -- Pons V2 launcher (dry-run по умолчанию, реальная отправка -- ТОЛЬКО явное подтверждение)

# Два пути запуска, ОБА требуют явного, отдельного действия -- ни один
# не срабатывает от рутинного коммита в этой ветке:
#
# 1. workflow_dispatch (ручной "Run workflow" в Actions tab) --
#    работает после мержа этой ветки в дефолтную (см.
#    docs/PROJECT_STATE.md про ограничение workflow_dispatch API).
#    send_real по умолчанию "no" = всегда dry-run, даже если input
#    забыт -- fail-safe в сторону dry-run.
#
# 2. push в ОТДЕЛЬНЫЙ маркер data/p3_guard_cache/SC1_LAUNCH_CONFIRM_REQUEST
#    (добавлен 2026-09-02, владелец прямо попросил "запустим 1 токен
#    ончейн" -- ветка ещё не смержена, workflow_dispatch недоступен).
#    Содержимое маркера -- JSON с параметрами ЭТОГО конкретного
#    подтверждённого запуска (symbols/limit/gas_ceiling_usd),
#    закоммиченное явно перед пушем -- сам факт коммита в этот файл
#    И есть подтверждение, аудируемо в истории git. ВСЕГДА
#    --confirm-mainnet -- этот маркер не используется ни для чего,
#    кроме реальной отправки; для read-only recon/dry-run есть
#    отдельный SC1_V2_RECON_REQUEST (run_sc1_v2_recon.yml), не путать.
on:
  workflow_dispatch:
    inputs:
      symbols:
        description: "Через запятую, напр. NVX или NVX,QRT. Пусто = все 20."
        required: false
        default: ""
      limit:
        description: "Максимум РЕАЛЬНЫХ отправок за прогон (игнорируется в dry-run)."
        required: false
        default: "1"
      send_real:
        description: 'Реальная mainnet-отправка -- ТОЛЬКО буквально "yes" включает её. Любое другое значение = dry-run.'
        required: false
        default: "no"
      gas_ceiling_usd:
        description: "Потолок стоимости газа в USD на один запуск."
        required: false
        default: "5.0"
  push:
    branches:
      - claude/sc1-pons-v2-launcher-efdbyt
    paths:
      - "data/p3_guard_cache/SC1_LAUNCH_CONFIRM_REQUEST"

jobs:
  launch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Git identity (НАЙДЕНО 2026-09-02, run 33612440836-- нужна ДО Launcher, не только в финальном Push, т.к. sc1_launcher.py сам коммитит построчно)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r analysis/requirements.txt

      - name: Determine run parameters (workflow_dispatch inputs ИЛИ SC1_LAUNCH_CONFIRM_REQUEST маркер)
        id: params
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "Триггер: push в SC1_LAUNCH_CONFIRM_REQUEST -- ЭТО РЕАЛЬНАЯ MAINNET-ОТПРАВКА, подтверждена содержимым маркера (см. git log этого файла)."
            SYMBOLS=$(jq -r '.symbols' data/p3_guard_cache/SC1_LAUNCH_CONFIRM_REQUEST)
            LIMIT=$(jq -r '.limit' data/p3_guard_cache/SC1_LAUNCH_CONFIRM_REQUEST)
            GAS_CEILING=$(jq -r '.gas_ceiling_usd' data/p3_guard_cache/SC1_LAUNCH_CONFIRM_REQUEST)
            SEND_REAL="yes"
          else
            echo "Триггер: workflow_dispatch."
            SYMBOLS="${{ github.event.inputs.symbols }}"
            LIMIT="${{ github.event.inputs.limit }}"
            GAS_CEILING="${{ github.event.inputs.gas_ceiling_usd }}"
            SEND_REAL="${{ github.event.inputs.send_real }}"
          fi
          echo "symbols=$SYMBOLS" >> "$GITHUB_OUTPUT"
          echo "limit=$LIMIT" >> "$GITHUB_OUTPUT"
          echo "gas_ceiling=$GAS_CEILING" >> "$GITHUB_OUTPUT"
          echo "send_real=$SEND_REAL" >> "$GITHUB_OUTPUT"

      - name: Launcher
        env:
          # ключ передаётся В ОКРУЖЕНИЕ ТОЛЬКО этого шага -- скрипт сам
          # читает его из env ТОЛЬКО если --confirm-mainnet передан (см.
          # sc1_launcher.py::send_one -- prepare_one/dry-run его вообще
          # не трогает). Секрет должен существовать в репозитории под
          # именем PRIVATE_KEY_NOX (см. задание владельца).
          PRIVATE_KEY_NOX: ${{ secrets.PRIVATE_KEY_NOX }}
        run: |
          ARGS="--gas-ceiling-usd ${{ steps.params.outputs.gas_ceiling }} --limit ${{ steps.params.outputs.limit }}"
          if [ -n "${{ steps.params.outputs.symbols }}" ]; then
            ARGS="$ARGS --symbols ${{ steps.params.outputs.symbols }}"
          fi
          if [ "${{ steps.params.outputs.send_real }}" = "yes" ]; then
            echo "::warning::РЕАЛЬНАЯ mainnet-отправка включена этим прогоном."
            ARGS="$ARGS --confirm-mainnet"
          else
            echo "dry-run (send_real != 'yes')"
          fi
          python analysis/sc1_launcher.py $ARGS

      - name: Push (реестр коммитится скриптом построчно -- здесь только push накопленного)
        if: always()   # реестр (если что-то реально отправилось) должен уйти в origin, даже если сам launcher вернул ненулевой код (напр. частичный успех при --symbols из нескольких токенов)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected, попытка $i/5 -- git pull --rebase и повтор"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep 3
          done
          echo "не удалось запушить после 5 попыток -- ЛОКАЛЬНЫЕ коммиты реестра могут быть впереди origin, проверить вручную" >&2
          exit 1
