name: "Bloom: пары А/Б мы против DBot по цепи (только чтение)"

# На одном событии источника: наш вход и выход, вход и выход DBot, слот и
# индекс в блоке у обоих, число чужих покупок между источником и нами.
# Только чтение: журнал копируется с хоста, в цепь уходят getBlock,
# getTransaction и getSignaturesForAddress, ни один ордер не отправляется.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "сколько последних настоящих позиций свести в пары"
        required: false
        default: "5"

concurrency:
  group: bloom-ab-pairs
  cancel-in-progress: false

env:
  HOST: 45.59.170.76
  STATE_DIR: /home/bot/bloom_executor_live_data

jobs:
  pairs:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/nifty-sagan-r0polg

      - name: "Самопроверки ДО обращений в цепь"
        run: |
          set -e
          python3 analysis/bloom_ab_pairs.py --self-test
          python3 analysis/bloom_block_position.py --self-test | tail -1

      - name: "SSH key"
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -e
          [ -n "$VPS_SSH_KEY" ] || { echo "VPS_SSH_KEY не задан"; exit 1; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          echo "SSH_OPTS=-i $HOME/.ssh/vps_key -o ConnectTimeout=15 -o BatchMode=yes -o StrictHostKeyChecking=accept-new" >> $GITHUB_ENV

      - name: "Копия журналов с хоста (только чтение)"
        run: |
          set -e
          mkdir -p /tmp/bloom_state
          for f in positions.jsonl decisions.jsonl; do
            ssh -n $SSH_OPTS root@$HOST "cat $STATE_DIR/$f" > "/tmp/bloom_state/$f" || true
            echo "$f: $(wc -c < /tmp/bloom_state/$f) байт"
          done

      - name: "Пары по цепи"
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API }}
        run: |
          set -e
          pip install -q requests
          python3 analysis/bloom_ab_pairs.py \
            --state-dir /tmp/bloom_state \
            --limit ${{ inputs.limit }} \
            --config data/final/20260923T145755Z/konfig.json \
            --out data/bloom_ab_pairs.json

      - name: "Коммит пар"
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -f data/bloom_ab_pairs.json ] && git add data/bloom_ab_pairs.json
          git diff --cached --quiet && { echo "нечего коммитить"; exit 0; }
          git commit -m "Bloom: пары А/Б мы против DBot [automated]"
          for i in 1 2 3 4 5; do
            git push origin HEAD:claude/nifty-sagan-r0polg && exit 0
            git pull --rebase -X theirs origin claude/nifty-sagan-r0polg
            sleep 3
          done
          exit 1
