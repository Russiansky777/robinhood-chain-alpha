name: "Solana buyer_200 -- сито Fomo-кандидатов: прямая торговля на Solana + первые входы"

# Только чтение -- Solana RPC (Alchemy/публичный). Резюмируемо -- как
# основной конвейер 300 покупок, с чекпоинтом на каждый кандидат.

on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/nifty-sagan-r0polg
    paths:
      - "data/p3_guard_cache/SOLANA_FOMO_ONCHAIN_FILTER_REQUEST"

jobs:
  solana_fomo_onchain_filter:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests
      - name: "Сито Fomo-кандидатов: торговля на Solana + первые входы"
        env:
          ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
        run: python -u analysis/solana_fomo_onchain_filter.py
      - name: Commit results
        if: always()
        run: |
          git rm -f --ignore-unmatch data/p3_guard_cache/SOLANA_FOMO_ONCHAIN_FILTER_REQUEST
          [ -e data/fomo_leaderboard_candidates.json ] && git add data/fomo_leaderboard_candidates.json
          git diff --cached --quiet && exit 0
          git commit -m "Solana buyer_200: сито Fomo-кандидатов -- прогресс [automated]"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected, попытка $i/5 -- git pull --rebase и повтор"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep 3
          done
          echo "не удалось запушить после 5 попыток" >&2
          exit 1
