name: "II.9: продажа по закрытым сделкам (только чтение)"

# ЗАЧЕМ. Владелец 25.09: "продажа по закрытым сделкам с 24.09: время от таймера
# до посадки, проскальзывание, комиссии, выгода своей сборки". Всё считается
# ТОЛЬКО по журналу позиций: ни одной продажи, ни одного обращения в цепь.
#
# Ротация учтена: logrotate уводит сутки в positions.jsonl.1.gz в 22:00Z, и без
# склейки замер видел бы только последние часы.
on:
  workflow_dispatch:
    inputs:
      since:
        description: "только позиции с этого UTC (например 2026-09-24T00:00:00Z)"
        required: false
        default: "2026-09-24T00:00:00Z"
      quote_min_pct:
        description: "котировка меньше этой доли входа (%) -- в проскальзывание не идёт"
        required: false
        default: "1.0"
      rows:
        description: "сколько последних продаж печатать"
        required: false
        default: "20"

concurrency:
  group: sell-timing-nl
  cancel-in-progress: false

env:
  HOST: 45.59.170.76
  STATE_DIR: /home/bot/bloom_executor_live_data

jobs:
  timing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/nifty-sagan-r0polg

      - name: "SSH key"
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -e
          [ -n "$VPS_SSH_KEY" ] || { echo "СБОЙ: VPS_SSH_KEY не задан"; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          echo "SSH_OPTS=-i $HOME/.ssh/vps_key -o ConnectTimeout=20 -o BatchMode=yes -o StrictHostKeyChecking=accept-new" >> "$GITHUB_ENV"

      - name: "Копия журнала позиций с ротированными (только чтение)"
        run: |
          set -e
          set -o pipefail
          mkdir -p /tmp/bloom_state
          ssh -n $SSH_OPTS root@$HOST \
            "for G in \$(ls -tr $STATE_DIR/positions.jsonl.*.gz 2>/dev/null); do zcat \"\$G\"; done; \
             cat $STATE_DIR/positions.jsonl" > /tmp/bloom_state/positions.jsonl
          echo "строк: $(wc -l < /tmp/bloom_state/positions.jsonl)"

      - name: "Замер продажи"
        run: |
          set -e
          python3 analysis/sell_timing.py \
            --positions /tmp/bloom_state/positions.jsonl \
            --since "${{ inputs.since }}" \
            --quote-min-pct "${{ inputs.quote_min_pct }}" \
            --rows "${{ inputs.rows }}" \
            --out data/sell_timing.json

      - name: "Коммит замера"
        if: always()
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -f data/sell_timing.json ] && git add data/sell_timing.json
          git diff --cached --quiet && { echo "нечего коммитить"; exit 0; }
          git commit -m "II.9: prodazha po zakrytym sdelkam [automated]"
          for i in 1 2 3 4 5; do
            git push origin HEAD:claude/nifty-sagan-r0polg && exit 0
            git pull --rebase -X theirs origin claude/nifty-sagan-r0polg
            sleep 3
          done
          exit 1
