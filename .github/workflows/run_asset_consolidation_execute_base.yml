name: "Консолидация активов -- ИСПОЛНЕНИЕ Base (cbBTC->WETH, USDC->WETH, реальные транзакции)"

# Владелец дал "да" на свапы, 2026-09-05. РЕАЛЬНЫЕ ТРАНЗАКЦИИ на Base.

on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/sc1-pons-v2-launcher-efdbyt
    paths:
      - "data/p3_guard_cache/ASSET_CONSOLIDATION_EXECUTE_BASE_REQUEST"

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r analysis/requirements.txt
      - name: "ИСПОЛНЕНИЕ: cbBTC->WETH, USDC->WETH на Base (реальные транзакции)"
        env:
          PRIVATE_KEY_NOX: ${{ secrets.PRIVATE_KEY_NOX }}
        run: python -u analysis/asset_consolidation_execute_base.py
      - name: Commit results
        if: always()
        run: |
          git rm -f --ignore-unmatch data/p3_guard_cache/ASSET_CONSOLIDATION_EXECUTE_BASE_REQUEST
          [ -e data/p3_guard_cache/asset_consolidation_execute_base_result.json ] && git add data/p3_guard_cache/asset_consolidation_execute_base_result.json
          git diff --cached --quiet && exit 0
          git commit -m "Консолидация активов: исполнение Base -- результат [automated]"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected, попытка $i/5 -- git pull --rebase и повтор"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep 3
          done
          echo "не удалось запушить после 5 попыток" >&2
          exit 1
