name: "Спящие референсы -- обнаружение реальных Hyperliquid HIP-3 сток-перпов (0 кредитов)"

on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/sc1-pons-v2-launcher-efdbyt
    paths:
      - "data/p3_guard_cache/HYPERLIQUID_HIP3_STOCK_PERP_DISCOVERY_REQUEST"

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r analysis/requirements.txt
      - name: "Обнаружение HIP-3 perp-DEX'ов и сток-подобных активов (только чтение, 0 кредитов)"
        run: python -u analysis/hyperliquid_hip3_stock_perp_discovery.py
      - name: Commit results
        if: always()
        run: |
          git rm -f --ignore-unmatch data/p3_guard_cache/HYPERLIQUID_HIP3_STOCK_PERP_DISCOVERY_REQUEST
          [ -e data/p3_guard_cache/hyperliquid_hip3_stock_perp_discovery_result.json ] && git add data/p3_guard_cache/hyperliquid_hip3_stock_perp_discovery_result.json
          git diff --cached --quiet && exit 0
          git commit -m "Спящие референсы: обнаружение Hyperliquid HIP-3 сток-перпов, результат [automated]"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected, попытка $i/5 -- git pull --rebase и повтор"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep 3
          done
          echo "не удалось запушить после 5 попыток" >&2
          exit 1
