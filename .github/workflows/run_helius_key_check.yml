name: "Helius: сверка ключа, серия getSlot и доставка на сервер"

# Зачем. Владелец перевёл Helius на тариф Developer и заменил ключ в
# секрете. Прежде чем переводить на него службы, надо убедиться, что:
#   1) ключ в секрете действительно рабочий (серия вызовов, не одна точка);
#   2) на сервере лежит ТОТ ЖЕ ключ -- иначе зонд продолжит биться в старый;
#   3) вызов С САМОГО СЕРВЕРА проходит -- прошлая версия проверки читала
#      ключ с сервера, но запрос слала с раннера, и строка "сервер NL" в
#      отчёте означала не то, чем выглядела.
#
# САМ КЛЮЧ НИГДЕ НЕ ПЕЧАТАЕТСЯ -- только код ответа и последние 4 символа.
on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "'no' -- только проверить, на сервер не класть (по умолчанию кладём при 12/12)"
        required: false
        default: ""

concurrency:
  group: helius-key-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/nifty-sagan-r0polg

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Зависимости
        run: pip install -q requests

      - name: SSH key + known_hosts
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -e
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -T 10 45.59.170.76 >> ~/.ssh/known_hosts 2>/dev/null
          echo "SSH_OPTS=-i $HOME/.ssh/vps_key -o ConnectTimeout=15 -o BatchMode=yes -o StrictHostKeyChecking=accept-new" >> "$GITHUB_ENV"

      - name: "1. Какие секреты с ключом вообще заданы (только хвосты)"
        env:
          S_HELIUS_API: ${{ secrets.HELIUS_API }}
          S_HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          S_HELIUS_KEY: ${{ secrets.HELIUS_KEY }}
        run: |
          python - <<'PY'
          import os
          for name in ("HELIUS_API", "HELIUS_API_KEY", "HELIUS_KEY"):
              v = (os.environ.get("S_" + name) or "").strip()
              tail = f"...{v[-4:]}" if len(v) >= 4 else "(не задан)"
              print(f"секрет {name}: {tail}  (длина {len(v)})")
          PY

      - name: "2. Серия getSlot ключом из секрета -- С РАННЕРА"
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API }}
        run: |
          python - <<'PY'
          import json, os, pathlib, time
          import requests

          key = (os.environ.get("HELIUS_API_KEY") or "").strip()
          tail = f"...{key[-4:]}" if len(key) >= 4 else "(пусто)"
          url = f"https://mainnet.helius-rpc.com/?api-key={key}"

          codes, bodies = [], []
          for i in range(12):
              try:
                  r = requests.post(url, json={"jsonrpc": "2.0", "id": 1,
                                                "method": "getSlot", "params": []}, timeout=30)
                  codes.append(r.status_code)
                  if r.status_code != 200 and len(bodies) < 3:
                      bodies.append(r.text[:200].replace(key, "<КЛЮЧ>"))
              except Exception as exc:
                  codes.append(None)
                  if len(bodies) < 3:
                      bodies.append(f"сеть: {type(exc).__name__}")
              if i < 11:
                  time.sleep(1.0)

          ok = sum(1 for c in codes if c == 200)
          print(f"ключ {tail}, серия из 12 с паузой 1 с")
          print(f"коды: {codes}")
          print(f"успехов {ok}, отказов 429 {sum(1 for c in codes if c == 429)}")
          for b in bodies:
              print("  ответ не-200:", b)

          out = {"проверено_utc": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
                 "откуда": "раннер GitHub", "хвост_ключа_секрета": tail,
                 "коды": codes, "успехов": ok,
                 "отказов_429": sum(1 for c in codes if c == 429),
                 "примеры_ответов_не_200": bodies}
          pathlib.Path("data/helius_key_check.json").write_text(
              json.dumps(out, ensure_ascii=False, indent=2))
          pathlib.Path("/tmp/series_ok").write_text("1" if ok == 12 else "0")
          PY
          echo "SERIES_ALL_OK=$(cat /tmp/series_ok)" >> "$GITHUB_ENV"

      - name: "3. Ключ на сервер (только при 12/12 и если не запрещено)"
        if: env.SERIES_ALL_OK == '1' && github.event.inputs.deploy != 'no'
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API }}
        run: |
          set -e
          # Ключ уходит по stdin, ни разу не попадая в аргументы команды и
          # в лог. На сервере правим ТОЛЬКО строку с ключом, остальные
          # переменные в env-файлах не трогаем.
          printf '%s' "$HELIUS_API_KEY" | ssh $SSH_OPTS root@45.59.170.76 \
            'umask 077 && cat > /root/.helius_new && chmod 600 /root/.helius_new'
          ssh -n $SSH_OPTS root@45.59.170.76 '
            set -e
            K=$(cat /root/.helius_new)
            for f in /etc/dbot-detect-probe/env /etc/dbot-guard/env; do
              [ -f "$f" ] || continue
              cp -a "$f" "$f.bak.$(date +%s)"
              # Обновляем оба имени, если они там были; если не было -- дописываем.
              for n in HELIUS_API_KEY HELIUS_API; do
                if grep -qE "^${n}=" "$f"; then
                  sed -i "s|^${n}=.*|${n}=${K}|" "$f"
                else
                  printf "%s=%s\n" "$n" "$K" >> "$f"
                fi
              done
              echo "обновлён $f: строк $(wc -l < "$f")"
            done
            shred -u /root/.helius_new 2>/dev/null || rm -f /root/.helius_new
            systemctl restart dbot-detect-probe 2>/dev/null && echo "зонд перезапущен" || echo "зонд: службы нет"
                      '

      - name: "3a. ГЕЙТ: открытые позиции ПРЯМО СЕЙЧАС -- перед перезапуском сторожа"
        if: env.SERIES_ALL_OK == '1' && github.event.inputs.deploy != 'no'
        run: |
          # Сторож -- боевая служба: перезапуск в момент, когда позиция в
          # работе, может стоить денег. Проверяем состояние В МОМЕНТ
          # РЕСТАРТА, а не по снимку учёта: сторож сам опрашивает DBot и
          # знает, что у него на руках. Безопасно -- только когда ноль.
          ssh -n $SSH_OPTS root@45.59.170.76 '
            set -a; . /etc/dbot-guard/env; set +a
            /home/bot/robinhood-chain-alpha/venv/bin/python -u /home/bot/dbot_sold_guard/dbot_sold_position_guard.py --check-only 2>&1 | tail -40
          ' > /tmp/guard_gate.txt 2>&1 || true
          cat /tmp/guard_gate.txt
          python - <<'PYGATE'
          import pathlib, re, sys
          t = pathlib.Path("/tmp/guard_gate.txt").read_text()
          m = re.search(r"\u0438\u0437 \u043d\u0438\u0445 \u043d\u0430\u0448\u0438 \u043a\u043e\u0448\u0435\u043b\u044c\u043a\u0438=(\d+)", t)
          if not m:
              print("::warning::\u0447\u0438\u0441\u043b\u043e \u043f\u043e\u0437\u0438\u0446\u0438\u0439 \u043d\u0435 \u043f\u0440\u043e\u0447\u0438\u0442\u0430\u043b\u043e\u0441\u044c -- \u043f\u0435\u0440\u0435\u0437\u0430\u043f\u0443\u0441\u043a \u041d\u0415 \u0434\u0435\u043b\u0430\u044e")
              pathlib.Path("/tmp/guard_gate_ok").write_text("0")
              sys.exit(0)
          n = int(m.group(1))
          print("\u0441\u0442\u043e\u0440\u043e\u0436 \u0434\u0435\u0440\u0436\u0438\u0442 \u043f\u043e\u0437\u0438\u0446\u0438\u0439:", n)
          pathlib.Path("/tmp/guard_gate_ok").write_text("1" if n == 0 else "0")
          PYGATE
          echo "GUARD_GATE_OK=$(cat /tmp/guard_gate_ok)" >> "$GITHUB_ENV"

      - name: "3b. Перезапуск сторожа -- ТОЛЬКО при пустом гейте"
        if: env.SERIES_ALL_OK == '1' && github.event.inputs.deploy != 'no' && env.GUARD_GATE_OK == '1'
        run: |
          ssh -n $SSH_OPTS root@45.59.170.76 '
            systemctl restart dbot-sold-guard && echo "сторож перезапущен"
            sleep 3
            journalctl -u dbot-sold-guard --no-pager -n 8
          '

      - name: "3в. Сторож НЕ перезапущен -- сказать прямо"
        if: env.SERIES_ALL_OK == '1' && github.event.inputs.deploy != 'no' && env.GUARD_GATE_OK != '1'
        run: |
          echo "Сторож НЕ перезапущен: на момент проверки у него были позиции в работе"
          echo "или их число не удалось прочитать. Новый ключ в env-файле уже лежит и"
          echo "подхватится при следующем штатном перезапуске. Это НЕ ошибка, это гейт."

      - name: "4. getSlot С САМОГО СЕРВЕРА (не с раннера)"
        if: env.SERIES_ALL_OK == '1' && github.event.inputs.deploy != 'no'
        run: |
          # Запрос уходит с сервера NL его собственным ключом из env-файла.
          # Печатаем только код ответа и хвост -- ключ не покидает сервер.
          ssh -n $SSH_OPTS root@45.59.170.76 '
            set -a; . /etc/dbot-detect-probe/env; set +a
            K="${HELIUS_API_KEY:-$HELIUS_API}"
            echo "хвост ключа на сервере: ...${K: -4}"
            for i in 1 2 3; do
              code=$(curl -s -o /tmp/hout -w "%{http_code}" -X POST \
                "https://mainnet.helius-rpc.com/?api-key=${K}" \
                -H "Content-Type: application/json" \
                -d "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"getSlot\",\"params\":[]}")
              echo "с сервера, вызов $i: код $code"
              if [ "$code" != "200" ]; then sed "s|${K}|<КЛЮЧ>|g" /tmp/hout | head -c 200; echo; fi
              sleep 1
            done
            rm -f /tmp/hout
          ' 2>&1 | tee data/helius_from_server.txt

      - name: "Итог"
        if: always()
        run: |
          if [ "$SERIES_ALL_OK" = "1" ]; then
            echo "Серия 12/12 прошла -- ключ рабочий."
          else
            echo "::error::Серия НЕ 12/12. Ключ на сервер не клали, службы не переводим."
            exit 4
          fi

      - name: "Коммит результата"
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in data/helius_key_check.json data/helius_from_server.txt; do
            [ -f "$f" ] && git add "$f"
          done
          git diff --cached --quiet && { echo "нечего коммитить"; exit 0; }
          git stash -q || true
          git pull --rebase origin claude/nifty-sagan-r0polg || true
          git stash pop -q || true
          for f in data/helius_key_check.json data/helius_from_server.txt; do
            [ -f "$f" ] && git add "$f"
          done
          git commit -m "Helius: сверка ключа и проверка с сервера [automated]" || true
          for i in 1 2 3 4 5; do
            git push origin HEAD:claude/nifty-sagan-r0polg && exit 0
            git pull --rebase origin claude/nifty-sagan-r0polg
            sleep 3
          done
          exit 1
