name: "Консервация: остановить службы торгового хоста, подтвердить нуль и баланс"

# ЗАЧЕМ (пункт 5 владельца 12.10). ПОСЛЕ бэкапа: остановить детектор, продавца и
# сторожей на торговом хосте, подтвердить, что позиций ноль, снять баланс по
# ЦЕПИ и получить список токенов в состоянии spisana, оставшихся на кошельке.
#
# ЮНИТЫ НЕ УДАЛЯЮТСЯ -- слово владельца "без удаления". Службы и таймеры
# останавливаются и выключаются (stop + disable); файлы юнитов, код, env и
# состояние остаются на месте, и обратное включение -- одна команда.
#
# ПРЕДОХРАНИТЕЛЬ ОДИН, И ОН НЕ ОБХОДИТСЯ СЛУЧАЙНО: вход podtverzhdenie должен
# быть ровно словом OSTANOVIT. Прогон, который глушит торговые службы, не
# должен срабатывать от нажатия "Run workflow" по ошибке.
#
# ПОРЯДОК ВАЖЕН И ОН НЕ СЛУЧАЙНЫЙ. Сначала снимок состояния и гейт нуля позиций,
# и только потом остановка: глушить продавца при открытой позиции значит
# оставить купленное без выхода. Если позиции есть -- прогон ОТКАЗЫВАЕТ и
# называет их, а не останавливает.
on:
  push:
    # ЗАПУСК ФАЙЛОМ-МЕТКОЙ, А НЕ КНОПКОЙ, И ЭТО НЕ ВКУС. Прогон с
    # workflow_dispatch GitHub регистрирует ТОЛЬКО когда файл лежит на ветке по
    # умолчанию (здесь это claude/robinhood-copytrading-hypothesis-awjj0g, где
    # 440 прогонов из наших 571). Нового прогона там нет, и dispatch отвечает
    # 404 -- замерено. Событие push берёт файл прогона ИЗ ТОГО КОММИТА, которым
    # он пришёл, то есть работает с нашей ветки; тем же приёмом живут
    # run_podbivka2_miami.yml и run_fetch_vps_position_state.yml.
    branches:
      - claude/nifty-sagan-r0polg
    paths:
      - "data/konservaciya/zapusk/OSTANOVIT_*.json"
  workflow_dispatch:
    inputs:
      podtverzhdenie:
        description: "введите ровно OSTANOVIT -- иначе прогон откажет"
        required: true
        default: ""
      ostanovit_pri_otkrytyh:
        description: "'yes' -- глушить даже при открытых позициях (по умолчанию нет)"
        required: false
        default: "no"
      cep:
        description: "'yes' -- спросить цепь: баланс и токен-счета кошелька"
        required: false
        default: "yes"

concurrency:
  group: konservaciya-ostanovka
  cancel-in-progress: false

env:
  PODTVERZHDENIE: ""
  OSTANOVIT_PRI_OTKRYTYH: "no"
  CEP: "yes"
  HOST: 45.59.170.76
  CODE_DIR: /home/bot/bloom_executor
  STATE_DIR: /home/bot/bloom_executor_live_data
  HOST_PY: /home/bot/robinhood-chain-alpha/venv/bin/python
  OUT: data/konservaciya_ostanovka.txt

jobs:
  ostanovka:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/nifty-sagan-r0polg

      - name: "Параметры: вход прогона сильнее метки, метка сильнее умолчания"
        env:
          VHODY: ${{ toJSON(inputs) }}
        run: |
          set -e
          # ПОРЯДОК СТАРШИНСТВА НАЗВАН, А НЕ УГАДЫВАЕТСЯ: вход workflow_dispatch
          # сильнее файла-метки, метка сильнее значения по умолчанию из env
          # прогона. На событии push входов нет вовсе -- тогда решает метка.
          # ВСЁ НА jq, А НЕ НА python3 -c: многострочная строка в двойных
          # кавычках начинается с нулевой колонки и ЗАКРЫВАЕТ блок YAML.
          # Проверено -- на этом разбор прогона падал дважды.
          METKA_FAJL=$(ls -1t data/konservaciya/zapusk/OSTANOVIT_*.json 2>/dev/null | head -1 || true)
          echo "fajl-metka: ${METKA_FAJL:-net}"
          for IMJA in PODTVERZHDENIE OSTANOVIT_PRI_OTKRYTYH CEP; do
            KLJUCH=$(printf '%s' "$IMJA" | tr 'A-Z' 'a-z')
            NOVO=$(printf '%s' "$VHODY" | jq -r --arg k "$KLJUCH" '((. // {})[$k] // "") | tostring' 2>/dev/null || true)
            if [ -z "$NOVO" ] && [ -n "$METKA_FAJL" ]; then
              NOVO=$(jq -r --arg k "$KLJUCH" '((. // {})[$k] // "") | tostring' "$METKA_FAJL" 2>/dev/null || true)
            fi
            if [ -n "$NOVO" ] && [ "$NOVO" != "null" ]; then
              echo "$IMJA=$NOVO" >> "$GITHUB_ENV"
              echo "  $IMJA: bylo '${!IMJA}', stalo '$NOVO'"
            else
              echo "  $IMJA: '${!IMJA}' (po umolchaniju)"
            fi
          done

      - name: "ПРЕДОХРАНИТЕЛЬ: подтверждение словом"
        run: |
          set -e
          if [ "$PODTVERZHDENIE" != "OSTANOVIT" ]; then
            echo "STOP: vhod podtverzhdenie ne raven OSTANOVIT -- nichego ne delaju."
            exit 1
          fi
          echo "podtverzhdenie prinjato"

      - name: "Git identity"
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          : > "$OUT"
          {
            echo "# Консервация: остановка служб торгового хоста"
            echo
            echo "Прогон ${{ github.run_id }}, $(date -u +%Y-%m-%dT%H:%M:%SZ)."
            echo
          } >> "$OUT"

      - name: "SSH key"
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -e
          [ -n "$VPS_SSH_KEY" ] || { echo "SBOJ: VPS_SSH_KEY ne zadan"; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -T 10 "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          echo "SSH_OPTS=-i $HOME/.ssh/vps_key -o ConnectTimeout=20 -o BatchMode=yes -o StrictHostKeyChecking=accept-new" >> "$GITHUB_ENV"

      - name: "СНИМОК ДО: позиции, зависшие, СПИСАННЫЕ"
        run: |
          set -e
          set -o pipefail
          # Скрипт уезжает файлом, а не heredoc-ом внутри ssh: вложенный
          # heredoc уходит на хост с отступом и там не закрывается.
          #
          # БЕЗ КЛЮЧА -n, И ЭТО НЕ МЕЛОЧЬ. Первый прогон 12.10 стоял с ssh -n,
          # а -n подменяет stdin на /dev/null: файл уехал ПУСТОЙ, python на нём
          # напечатал ничего и вышел с нулём, а упал следующий шаг -- на разборе
          # пустого json. Снимок при этом вышел пустым, и если бы прогон на этом
          # не упал, он пошёл бы глушить службы, НЕ ПОСМОТРЕВ на позиции.
          # Деплой кладёт файлы той же строкой и ровно без -n.
          ssh $SSH_OPTS root@"$HOST" "cat > /tmp/konservaciya_sostojanie.py" \
            < deploy/checks/konservaciya_sostojanie.py
          # И СРАЗУ ПРОВЕРКА, ЧТО ДОЕХАЛО: пустой файл -- отказ здесь, а не
          # тишина в снимке.
          STROK=$(ssh -n $SSH_OPTS root@"$HOST" "wc -l < /tmp/konservaciya_sostojanie.py")
          echo "skript na hoste: strok $STROK"
          if [ "$STROK" -lt 50 ]; then
            echo "SBOJ: skript ne doehal (strok $STROK) -- snimok delat nechem"
            exit 1
          fi
          {
            echo "## Снимок состояния ДО остановки"
            echo
            echo '```'
          } >> "$OUT"
          ssh -n $SSH_OPTS root@"$HOST" \
            "cd $CODE_DIR && PYTHONPATH=$CODE_DIR BLOOM_STATE_DIR=$STATE_DIR $HOST_PY /tmp/konservaciya_sostojanie.py" \
            2>&1 | tee -a "$OUT"
          echo '```' >> "$OUT"
          ssh -n $SSH_OPTS root@"$HOST" \
            "cd $CODE_DIR && PYTHONPATH=$CODE_DIR BLOOM_STATE_DIR=$STATE_DIR $HOST_PY /tmp/konservaciya_sostojanie.py --json" \
            > sostojanie_do.json
          # ОДНОСТРОЧНИКИ, А НЕ МНОГОСТРОЧНЫЙ python3 -c. Многострочная
          # строка в двойных кавычках внутри блока YAML начинается с нулевой
          # колонки и ЗАКРЫВАЕТ блок: проверено, разбор прогона падал на ней.
          python3 -c "import json;d=json.load(open('sostojanie_do.json'));print('otkrytyh',d['otkrytyh'],'spisannyh',d['spisannyh'])"
          python3 -c "import json;d=json.load(open('sostojanie_do.json'));open('minty_spisannyh.txt','w').write(''.join(m+chr(10) for m in d['minty_spisannyh']))"
          wc -l < minty_spisannyh.txt
          echo "OTKRYTYH=$(python3 -c "import json;print(json.load(open('sostojanie_do.json'))['otkrytyh'])")" >> "$GITHUB_ENV"
          echo "SPISANNYH=$(python3 -c "import json;print(json.load(open('sostojanie_do.json'))['spisannyh'])")" >> "$GITHUB_ENV"

      - name: "ГЕЙТ НУЛЯ ПОЗИЦИЙ -- тот же, что у деплоя"
        run: |
          set -e
          set -o pipefail
          # ОХРАНА ТА ЖЕ САМАЯ, а не своя копия: расходятся именно копии.
          # Она требует нуля открытых и нуля зависших по всем группам и
          # признака жизни детектора не старше 10 минут.
          {
            echo
            echo "## Гейт нуля позиций (deploy/checks/pered_perezapuskom_sluzhby.py)"
            echo
            echo '```'
          } >> "$OUT"
          # ТОТ ЖЕ КЛЮЧ -n, И ЗДЕСЬ ОН БЫЛ БЫ ХУЖЕ ВСЕГО. Пустой файл гейта
          # python исполняет без ошибки и выходит с НУЛЁМ -- то есть гейт сказал
          # бы "можно" НЕ ПОСМОТРЕВ НИ НА ОДНУ ПОЗИЦИЮ, и службы заглушились бы
          # при открытых. Нашёл у себя после первого прогона; проверка доставки
          # стоит ниже и падает на пустом файле.
          ssh $SSH_OPTS root@"$HOST" "cat > /tmp/pered_perezapuskom_sluzhby.py" \
            < deploy/checks/pered_perezapuskom_sluzhby.py
          STROK_G=$(ssh -n $SSH_OPTS root@"$HOST" "wc -l < /tmp/pered_perezapuskom_sluzhby.py")
          echo "gejt na hoste: strok $STROK_G"
          if [ "$STROK_G" -lt 50 ]; then
            echo "SBOJ: gejt ne doehal (strok $STROK_G) -- pustoj gejt skazal by 'mozhno'"
            exit 1
          fi
          GEJT_OK=yes
          ssh -n $SSH_OPTS root@"$HOST" "python3 /tmp/pered_perezapuskom_sluzhby.py" \
            2>&1 | tee -a "$OUT" || GEJT_OK=no
          echo '```' >> "$OUT"
          ssh -n $SSH_OPTS root@"$HOST" "rm -f /tmp/pered_perezapuskom_sluzhby.py"
          echo "gejt: $GEJT_OK, otkrytyh po snimku: $OTKRYTYH"
          # ГЛУШИТЬ УЖЕ НЕЧЕГО -- ГЕЙТ НЕ ТРЕБУЕТСЯ, И ЭТО НЕ ПОСЛАБЛЕНИЕ.
          # Замерено 12.10: после удачной остановки повторный прогон НИКОГДА не
          # пройдёт гейт -- тот требует признак жизни детектора не старше 600 с,
          # а детектор остановлен, и признак протухает (вышло 655 с). Гейт при
          # этом ПРАВ: без свежего признака числам о позициях верить нельзя.
          # Но охранять нечего, когда обе службы уже inactive: остановка в этом
          # случае -- пустая работа, а не риск.
          AKTIVNYH=0
          for S in bloom-detector bloom-seller dbot-sold-guard dbot-detect-probe grpc-feed-probe; do
            if [ "$(ssh -n $SSH_OPTS root@"$HOST" "systemctl is-active $S" 2>&1)" = "active" ]; then
              AKTIVNYH=$(( AKTIVNYH + 1 ))
            fi
          done
          echo "aktivnyh nashih sluzhb sejchas: $AKTIVNYH"
          echo "AKTIVNYH=$AKTIVNYH" >> "$GITHUB_ENV"
          if [ "$AKTIVNYH" -eq 0 ]; then
            {
              echo
              echo "Глушить нечего: все три службы уже inactive. Гейт нуля"
              echo "позиций не требуется -- он охраняет ОСТАНОВКУ, а её не будет."
              echo "Признак жизни протух ($GEJT_OK) именно потому, что детектор"
              echo "остановлен раньше."
            } >> "$OUT"
            echo "nechego glushit -- shag ostanovki projdjot vpustuju"
          elif [ "$GEJT_OK" != "yes" ] || [ "$OTKRYTYH" != "0" ]; then
            if [ "$OSTANOVIT_PRI_OTKRYTYH" != "yes" ]; then
              {
                echo
                echo "**ОТКАЗ: службы НЕ остановлены.** Гейт нуля позиций: $GEJT_OK,"
                echo "открытых по снимку: $OTKRYTYH. Глушить продавца при открытой"
                echo "позиции значит оставить купленное без выхода."
              } >> "$OUT"
              echo "STOP: pozicii est ili gejt krasnyj -- sluzhby ne ostanavlivaju"
              exit 1
            fi
            echo "pozicii est, no vhod ostanovit_pri_otkrytyh=yes -- prodolzhaju po slovu vladelca"
            {
              echo
              echo "ВНИМАНИЕ: остановка сделана при открытых ($OTKRYTYH) по явному"
              echo "входу ostanovit_pri_otkrytyh=yes."
            } >> "$OUT"
          fi

      - name: "ОСТАНОВИТЬ службы и таймеры (юниты НЕ удаляются)"
        run: |
          set -e
          set -o pipefail
          {
            echo
            echo "## Остановка"
            echo
            echo '```'
          } >> "$OUT"
          ssh $SSH_OPTS root@"$HOST" 'bash -s' <<'GLUSHIM' 2>&1 | tee -a "$OUT"
            set -e
            # СПИСОК ОДНИМ МЕСТОМ, А НЕ ЧЕТЫРЬМЯ: он перечислен в прогоне
            # четыре раза (глушим, печатаем состояние, сверяем), и четыре копии
            # расходятся -- зонды я и пропустил именно так.
            # ДВА СПИСКА, А НЕ ОДИН, И ЭТО ПРО ТО, ЧТО ОХРАНЯЕТ ГЕЙТ.
            # Гейт нуля позиций охраняет ровно одно: не заглушить ПРОДАВЦА,
            # пока жива купленная позиция. Детектор, продавец и сторож DBot
            # стоят на денежном пути -- они за гейтом. Зонды не покупают, не
            # продают и позиций не держат: требовать от них свежий признак
            # жизни ДЕТЕКТОРА -- неверный предохранитель. Нашёл это на своём
            # прогоне: детектор уже остановлен, признак протух навсегда, и
            # гейт отказывал, а шаг остановки ЗОНДОВ пропускался вместе с ним.
            DENEZHNYE="bloom-detector bloom-seller dbot-sold-guard"
            ZONDY="dbot-detect-probe grpc-feed-probe"
            NASHI_SLUZHBY="$DENEZHNYE $ZONDY"
            echo "=== DO: chto aktivno ==="
            systemctl list-units --type=service --state=running --no-pager \
              | grep -E 'bloom|shred|dbot|grpc' || echo "aktivnyh nashih sluzhb net"
            systemctl list-timers --all --no-pager | grep -E 'bloom|lab-' || echo "nashih tajmerov net"

            # ПОРЯДОК: СНАЧАЛА ДЕТЕКТОР (перестаёт покупать), ПОТОМ ПРОДАВЕЦ,
            # ПОТОМ СТОРОЖ DBot. Наоборот нельзя: детектор успел бы купить,
            # когда продавца уже нет.
            #
            # dbot-sold-guard -- ЭТО СТОРОЖ, И ОН НАЗВАН СЛОВОМ ВЛАДЕЛЬЦА
            # ("службы детектора/продавца/сторожей"). Первый прогон остановки
            # его пропустил: я перечислил только две службы, а он остался
            # running -- увидел это по строке "DO: chto aktivno".
            # ЗДЕСЬ -- ТОЛЬКО ДЕНЕЖНЫЕ. Зонды глушит отдельный шаг, не за
            # гейтом: по слову владельца 12.10 "зонды остановить и выключить
            # (без удаления)". Они ходят в Helius по websocket и тратят кредиты
            # каждый час, а проект консервируется. Юниты остаются на диске.
            for S in $DENEZHNYE; do
              if systemctl list-unit-files "$S.service" --no-legend | grep -q "$S"; then
                echo "--- $S: stop + disable ---"
                systemctl stop "$S" || true
                systemctl disable "$S" 2>&1 | tail -1 || true
              else
                echo "$S: junita net"
              fi
            done

            # ТАЙМЕРЫ -- ВСЕ НАШИ, СПИСКОМ С МАШИНЫ, а не перечислением в
            # прогоне: перечисление устареет, а машина знает, что на ней стоит.
            TAJMERY=$(systemctl list-unit-files --no-legend 'bloom-*.timer' 'lab-*.timer' \
              | awk '{print $1}' | sort -u)
            echo "--- tajmery: $TAJMERY ---"
            for T in $TAJMERY; do
              systemctl stop "$T" || true
              systemctl disable "$T" 2>&1 | tail -1 || true
            done

            echo "=== POSLE: chto aktivno ==="
            OSTALOS=$(systemctl list-units --type=service --state=running --no-pager \
              | grep -cE 'bloom-detector|bloom-seller' || true)
            echo "aktivnyh torgovyh sluzhb ostalos: $OSTALOS"
            echo "(zondy glushit sledujushchij shag -- oni ne za gejtom)"
            for S in $NASHI_SLUZHBY; do
              printf '%s: active=%s enabled=%s\n' "$S" \
                "$(systemctl is-active "$S" 2>&1)" "$(systemctl is-enabled "$S" 2>&1)"
            done
            echo "=== chto ESHCHJO bezhit (zondy: ne torgujut, no tratjat kredity) ==="
            systemctl list-units --type=service --state=running --no-pager \
              | grep -E 'bloom|shred|dbot|grpc' || echo "nashih sluzhb v running net"
            systemctl list-timers --all --no-pager | grep -E 'bloom|lab-' || echo "aktivnyh tajmerov net"
            echo "=== juniti na meste (ne udaleny) ==="
            ls -1 /etc/systemd/system/ | grep -E '^(bloom|lab)' | sed 's/^/  /'
            echo "=== kod, sostojanie i env na meste ==="
            ls -ld /home/bot/bloom_executor /home/bot/bloom_executor_live_data /etc/bloom-executor
          GLUSHIM
          echo '```' >> "$OUT"

      - name: "ЗОНДЫ: остановить и выключить (не за гейтом -- позиций не держат)"
        # НЕ ЗА ГЕЙТОМ, И ЭТО НАЗВАНО. Гейт нуля позиций охраняет продавца при
        # живой позиции; зонды не покупают, не продают и позиций не держат, а
        # признак жизни детектора после его остановки протухает НАВСЕГДА -- то
        # есть гейт запретил бы остановку зондов уже никогда не отпуская.
        # Предохранитель у шага всё равно есть: слово OSTANOVIT на весь прогон.
        if: always()
        run: |
          set -e
          set -o pipefail
          {
            echo
            echo "## Зонды: остановка (слово владельца 12.10)"
            echo
            echo '```'
          } >> "$OUT"
          ssh $SSH_OPTS root@"$HOST" 'bash -s' <<'ZONDY' 2>&1 | tee -a "$OUT"
            set -e
            for S in dbot-detect-probe grpc-feed-probe; do
              if systemctl list-unit-files "$S.service" --no-legend 2>/dev/null | grep -q "$S"; then
                echo "--- $S: stop + disable ---"
                systemctl stop "$S" || true
                systemctl disable "$S" 2>&1 | tail -1 || true
              else
                echo "$S: junita net"
              fi
            done
            echo "=== posle ==="
            for S in dbot-detect-probe grpc-feed-probe; do
              printf '%s: active=%s enabled=%s\n' "$S" \
                "$(systemctl is-active "$S" 2>&1)" "$(systemctl is-enabled "$S" 2>&1)"
            done
            echo "=== juniti zondov na meste (ne udaleny) ==="
            ls -1 /etc/systemd/system/ | grep -E '^(dbot|grpc|shred)' | sed 's/^/  /' \
              || echo "junitov zondov v /etc/systemd/system net"
          ZONDY
          echo '```' >> "$OUT"

      - name: "ПРОВЕРКА: торговые службы точно не бегут"
        if: always()
        run: |
          set -e
          set -o pipefail
          # СЧЁТ РАЗДЕЛЬНЫЙ: денежные службы и зонды -- разные вещи, и валить
          # прогон за живой зонд, назвав его "торговой службой", значило бы
          # соврать в собственном отчёте.
          BEGUT=0
          ZONDOV=0
          for S in bloom-detector bloom-seller dbot-sold-guard; do
            SOST=$(ssh -n $SSH_OPTS root@"$HOST" "systemctl is-active $S" 2>&1 || true)
            echo "denezhnaja $S: $SOST"
            if [ "$SOST" = "active" ]; then
              BEGUT=$(( BEGUT + 1 ))
            fi
          done
          for S in dbot-detect-probe grpc-feed-probe; do
            SOST=$(ssh -n $SSH_OPTS root@"$HOST" "systemctl is-active $S" 2>&1 || true)
            echo "zond $S: $SOST"
            if [ "$SOST" = "active" ]; then
              ZONDOV=$(( ZONDOV + 1 ))
            fi
          done
          {
            echo
            echo "Денежных служб в active после остановки: **$BEGUT**."
            echo "Зондов в active после остановки: **$ZONDOV**."
          } >> "$OUT"
          if [ "$BEGUT" -ne 0 ] || [ "$ZONDOV" -ne 0 ]; then
            echo "SBOJ: ostalos aktivnyh -- denezhnyh $BEGUT, zondov $ZONDOV"
            exit 1
          fi
          echo "denezhnye sluzhby i zondy ostanovleny"

      - name: "АУДИТ HELIUS: что на хосте ещё может пойти в Helius"
        # ТОЛЬКО ЧТЕНИЕ, идёт всегда. Владелец просил ПОДТВЕРДИТЬ СТРОКОЙ, что
        # на торговом хосте не осталось ничего, что ходит в Helius. Утверждать
        # это по памяти нельзя -- строка должна опираться на замер, поэтому
        # считаются ЧЕТЫРЕ источника запуска, а не один:
        #   1. живые процессы (кто ходит СЕЙЧАС);
        #   2. службы systemd в enabled (пойдут после перезагрузки);
        #   3. таймеры systemd в enabled (пойдут по расписанию);
        #   4. crontab root и bot плюс /etc/cron.d (своё расписание, мимо
        #      systemd) -- по инвентарю хоста там стоят строки коллекторов.
        # И отдельно -- живые соединения на 443 у наших процессов.
        if: always()
        run: |
          set -e
          set -o pipefail
          ssh $SSH_OPTS root@"$HOST" 'bash -s' <<'AUDIT' 2>&1 | tee audit_helius.txt
            set -e
            echo "=== 1. ZHIVYE PROCESSY nashih modulej ==="
            pgrep -af 'bloom_detector|bloom_seller|dbot_|shred|grpc_feed|solana_ledger|c1_zapusk|podbivka' \
              || echo "nashih processov NET"
            echo
            echo "=== 2. SLUZHBY: active / enabled ==="
            for S in bloom-detector bloom-seller dbot-sold-guard dbot-detect-probe \
                     grpc-feed-probe shred-listener; do
              if systemctl list-unit-files "$S.service" --no-legend 2>/dev/null | grep -q "$S"; then
                printf '%-22s active=%-10s enabled=%s\n' "$S" \
                  "$(systemctl is-active "$S" 2>&1)" "$(systemctl is-enabled "$S" 2>&1)"
              fi
            done
            echo
            echo "=== 3. TAJMERY: enabled ili net ==="
            for T in $(systemctl list-unit-files --no-legend 'bloom-*.timer' 'lab-*.timer' 2>/dev/null | awk '{print $1}' | sort -u); do
              printf '%-34s active=%-10s enabled=%s\n' "$T" \
                "$(systemctl is-active "$T" 2>&1)" "$(systemctl is-enabled "$T" 2>&1)"
            done
            echo "tajmerov v active:"
            systemctl list-timers --all --no-pager 2>/dev/null | grep -cE 'bloom|lab-' || echo 0
            echo
            echo "=== 4. CRON: root, bot, /etc/cron.d ==="
            echo "--- crontab root ---"
            crontab -l 2>/dev/null | grep -vE '^\s*#|^\s*$' || echo "pust"
            echo "--- crontab bot ---"
            crontab -u bot -l 2>/dev/null | grep -vE '^\s*#|^\s*$' || echo "pust"
            echo "--- /etc/cron.d ---"
            ls -1 /etc/cron.d/ 2>/dev/null || echo "pust"
            echo
            echo "=== 5. KTO IZ CRON-STROK HODIT V HELIUS ==="
            # ИДЁМ ПО .sh И ПО .py, А НЕ ТОЛЬКО ПО .py. Первая версия этого
            # шага искала в cron-строке файл с расширением .py -- а ВСЕ шесть
            # живых строк зовут .sh. Шаг напечатал шесть раз "ne nashel .py",
            # и мой же итог посчитал это за чистоту: вывод "в Helius ничего не
            # ходит" НЕ БЫЛ ЗАРАБОТАН. Теперь: читается сам .sh, из него
            # вытаскивается зовомый .py, и грепается ОН ТОЖЕ; а строка, которую
            # прочитать не удалось, считается НЕЯСНОЙ и ломает подтверждение.
            CRON_SROK=$( { crontab -l 2>/dev/null; crontab -u bot -l 2>/dev/null; } \
              | grep -vE '^\s*#|^\s*$' || true)
            if [ -z "$CRON_SROK" ]; then
              echo "cron-strok net vovse -- v Helius iz cron idti nechemu"
            else
              echo "$CRON_SROK" | while read -r STROKA; do
                KOMANDA=$(echo "$STROKA" | grep -oE '/[A-Za-z0-9_/.-]+\.(sh|py)' | head -1)
                if [ -z "$KOMANDA" ]; then
                  echo "  [NEJASNO] ni .sh ni .py v stroke: $(echo "$STROKA" | cut -c1-80)"
                  continue
                fi
                if [ ! -f "$KOMANDA" ]; then
                  echo "  [net fajla] $KOMANDA -- stroka cron mertvaja"
                  continue
                fi
                # ЧИТАЕМ САМУ КОМАНДУ
                if grep -qE 'HELIUS|helius' "$KOMANDA" 2>/dev/null; then
                  echo "  [HELIUS!] $KOMANDA chitaet Helius naprjamuju"
                  continue
                fi
                # И ТО, ЧТО ОНА ЗОВЁТ: любой .py из её тела
                ZOVET=$(grep -ohE '[A-Za-z0-9_/.-]+\.py' "$KOMANDA" 2>/dev/null | sort -u)
                NASHLI=net
                CHITALI=0
                for PY in $ZOVET; do
                  for BAZA in /home/bot/robinhood-chain-alpha /home/bot/bloom_executor /home/bot; do
                    if [ -f "$BAZA/$PY" ]; then
                      CHITALI=$(( CHITALI + 1 ))
                      if grep -qE 'HELIUS|helius' "$BAZA/$PY" 2>/dev/null; then
                        echo "  [HELIUS!] $KOMANDA -> $BAZA/$PY chitaet Helius"
                        NASHLI=da
                      fi
                      break
                    fi
                  done
                done
                if [ "$NASHLI" = "da" ]; then
                  continue
                fi
                if [ -z "$ZOVET" ]; then
                  echo "  [bez Helius] $KOMANDA -- .py ne zovjot vovse"
                elif [ "$CHITALI" -eq 0 ]; then
                  echo "  [NEJASNO] $KOMANDA zovjot .py ($ZOVET), no fajlov ne nashel"
                else
                  echo "  [bez Helius] $KOMANDA -> $ZOVET (prochitano $CHITALI)"
                fi
              done
            fi

            echo "=== 6. ZHIVYE SOEDINENIJA nashih processov na 443 ==="
            ss -tnp 2>/dev/null | grep -E ':443' | grep -E 'python|bloom|dbot|grpc' \
              || echo "soedinenij nashih processov na 443 NET"
            echo
            echo "=== 7. KOGDA POSLEDNIJ RAZ TRATILI KREDITY ==="
            ls -l --time-style=+%Y-%m-%dT%H:%M:%SZ \
              /home/bot/bloom_executor_live_data/helius_usage/ 2>/dev/null \
              || echo "kataloga ucheta kreditov net"
          AUDIT
          # ИТОГОВАЯ СТРОКА СЧИТАЕТСЯ, А НЕ ПИШЕТСЯ РУКАМИ.
          PROC=$(grep -c "nashih processov NET" audit_helius.txt || true)
          ENABLED=$(grep -cE 'enabled=enabled' audit_helius.txt || true)
          AKTIV=$(grep -cE 'active=active' audit_helius.txt || true)
          CRON_H=$(grep -c "\[HELIUS!\]" audit_helius.txt || true)
          # НЕЯСНОЕ -- НЕ ЧИСТОЕ. Строка, которую не удалось прочитать, ломает
          # подтверждение: ровно на этом мой прошлый итог соврал.
          NEJASNO=$(grep -c "\[NEJASNO\]" audit_helius.txt || true)
          SOED=$(grep -c "soedinenij nashih processov na 443 NET" audit_helius.txt || true)
          echo "processov net: $PROC, enabled: $ENABLED, active: $AKTIV, cron s Helius: $CRON_H, nejasnyh cron-strok: $NEJASNO, soedinenij net: $SOED"
          {
            echo
            echo "## Аудит Helius: что на хосте ещё может пойти в Helius"
            echo
            echo '```'
            cat audit_helius.txt
            echo '```'
            echo
            if [ "$PROC" -ge 1 ] && [ "$ENABLED" -eq 0 ] && [ "$AKTIV" -eq 0 ] \
               && [ "$CRON_H" -eq 0 ] && [ "$NEJASNO" -eq 0 ] && [ "$SOED" -ge 1 ]; then
              echo "**ПОДТВЕРЖДЕНО: на торговом хосте не осталось ничего, что ходит"
              echo "в Helius.** Замерено по пяти источникам запуска: живых процессов"
              echo "наших модулей НЕТ, служб в active НЕТ, служб и таймеров в enabled"
              echo "НЕТ, cron-строк, читающих Helius, НЕТ (и неясных строк НЕТ:"
              echo "каждая прочитана до вызываемого .py), живых соединений наших"
              echo "процессов на 443 НЕТ."
            else
              echo "**НЕ ПОДТВЕРЖДЕНО.** Числа: процессов-нет=$PROC, в enabled=$ENABLED,"
              echo "в active=$AKTIV, cron с Helius=$CRON_H, неясных cron-строк=$NEJASNO,"
              echo "соединений-нет=$SOED."
              echo "Разбор -- в блоке выше; строку \"ничего не ходит в Helius\" я не"
              echo "пишу, пока она не следует из замера."
            fi
          } >> "$OUT"

      - name: "ПУБЛИЧНЫЕ АДРЕСА с хоста: кошельки и nonce-счета, именами и значениями"
        # ТОЛЬКО ЧТЕНИЕ, И ПОТОМУ НЕ ЗА ГЕЙТОМ. Замерено 12.10: гейт нуля
        # позиций отказал (признак жизни протух после остановки детектора), и
        # вместе с ним пропустились шаги, которые НИЧЕГО не меняют -- адреса и
        # баланс. Владелец просил баланс и список; читать их гейт не мешает.
        if: always()
        run: |
          set -e
          set -o pipefail
          # ЗАЧЕМ ОТДЕЛЬНЫМ ШАГОМ. Владелец просил "список nonce-счетов и
          # ПУБЛИЧНЫЕ АДРЕСА КОШЕЛЬКОВ". Публичный адрес кошелька полосы живёт
          # ТОЛЬКО в окружении хоста (OWN_SEND_WALLET / BLOOM_LANE_WALLET), в
          # репозитории его нет: константой лежит лишь EXECUTOR_WALLET
          # (analysis/bloom_exec_state.py:45).
          #
          # ПОЧЕМУ ЗДЕСЬ МОЖНО ТО, ЧЕГО НЕЛЬЗЯ БЫЛО В БЭКАПЕ. В бэкапе я убрал
          # WALLET из списка имён: 32-байтный СИД в base58 -- ровно 43-44 знака,
          # то есть по длине от адреса не отличается. Здесь различитель другой и
          # настоящий: КАЖДОЕ значение сверяется по цепи, и сид на цепи счёта не
          # имеет. Плюс имя обязано НЕ содержать KEY/SECRET/PRIV/SEED/MNEMONIC.
          ssh -n $SSH_OPTS root@"$HOST" \
            "grep -hoE '^[[:space:]]*[A-Z0-9_]*(WALLET|NONCE|ADDRESS|PUBKEY|RECIPIENT)[A-Z0-9_]*=[1-9A-HJ-NP-Za-km-z]{32,44}$' /etc/bloom-executor/env /etc/bloom-executor/env.* 2>/dev/null | grep -vE '(KEY|SECRET|PRIV|SEED|MNEMONIC|TOKEN|PASS)[A-Z0-9_]*=' | sort -u" \
            > adresa_hosta.txt || true
          echo "IMJA=ADRES, strok: $(wc -l < adresa_hosta.txt)"
          cut -d= -f2 adresa_hosta.txt | sort -u > adresa_tolko.txt
          # КОНСТАНТА КОДА -- ТУДА ЖЕ: кошелёк исполнителя публичен и в репозитории.
          grep -oE '"[1-9A-HJ-NP-Za-km-z]{32,44}"' analysis/bloom_exec_state.py \
            | tr -d '"' | head -1 >> adresa_tolko.txt
          sort -u adresa_tolko.txt -o adresa_tolko.txt
          wc -l < adresa_tolko.txt

      - name: "ЦЕПЬ: баланс кошелька и токен-счета (списанные -- по минтам)"
        # ТОЖЕ ТОЛЬКО ЧТЕНИЕ: идёт и тогда, когда гейт отказал.
        if: ${{ always() && env.CEP == 'yes' }}
        env:
          # ИМЯ СЕКРЕТА -- HELIUS_API, А НЕ HELIUS_API_KEY, И ЭТО ЗАМЕРЕНО:
          # первый прогон получил HELIUS_API_KEY ПУСТЫМ и честно отказался
          # сверять адрес непроверенным. По репозиторию secrets.HELIUS_API
          # стоит в 116 местах, secrets.HELIUS_API_KEY -- в 7.
          HELIUS_API_KEY: ${{ secrets.HELIUS_API }}
        run: |
          set -e
          set -o pipefail
          [ -n "$HELIUS_API_KEY" ] || { echo "SBOJ: HELIUS_API_KEY ne zadan"; exit 1; }
          python3 -m pip install -q requests solders 2>&1 | tail -1 || true
          # ТОКЕН-СЧЕТА -- ГОТОВЫМ МОДУЛЕМ, он только читает цепь и ничего не
          # закрывает: закрытие счёта это транзакция кошелька.
          python3 analysis/bloom_token_accounts.py --out data/konservaciya_token_accounts.json \
            2>&1 | tee token_accounts.txt || true
          {
            echo
            echo "## Цепь: баланс и токен-счета кошелька исполнителя"
            echo
            echo '```'
            cat token_accounts.txt
            echo '```'
          } >> "$OUT"
          # БАЛАНС SOL -- ОТДЕЛЬНЫМ ЗАПРОСОМ, по тому же ключу.
          python3 - <<'BALANS' | tee balans.txt
          import json, os, urllib.request
          KOSHELEK = "4s87RRC2V2XAJD6R8U2dP8kQH99Z2wA6fg88ZVfV4j4N"
          URL = "https://mainnet.helius-rpc.com/?api-key=" + os.environ["HELIUS_API_KEY"]

          def zov(metod, parametry):
              telo = json.dumps({"jsonrpc": "2.0", "id": 1,
                                  "method": metod, "params": parametry}).encode()
              zapros = urllib.request.Request(
                  URL, data=telo, headers={"Content-Type": "application/json"})
              with urllib.request.urlopen(zapros, timeout=30) as otvet:
                  return json.load(otvet)

          b = zov("getBalance", [KOSHELEK])
          lamporty = (b.get("result") or {}).get("value")
          print(f"koshelek ispolnitelja: {KOSHELEK}")
          print(f"balans: {lamporty} lamportov = {lamporty / 1e9:.9f} SOL"
                if lamporty is not None else f"balans ne prochitan: {b}")
          try:
              minty = [m.strip() for m in open("minty_spisannyh.txt") if m.strip()]
          except OSError:
              minty = []
          print(f"mintov spisannyh pozicij: {len(minty)}")
          itog = []
          for m in minty:
              r = zov("getTokenAccountsByOwner",
                      [KOSHELEK, {"mint": m}, {"encoding": "jsonParsed"}])
              scheta = (r.get("result") or {}).get("value") or []
              for s in scheta:
                  info = (((s.get("account") or {}).get("data") or {})
                          .get("parsed") or {}).get("info") or {}
                  summa = (info.get("tokenAmount") or {})
                  itog.append({"mint": m, "schet": s.get("pubkey"),
                                "amount": summa.get("amount"),
                                "ui": summa.get("uiAmountString"),
                                "lamportov_renty": (s.get("account") or {}).get("lamports")})
          print(f"token-schetov po etim mintam na koshelke: {len(itog)}")
          s_ostatkom = [i for i in itog if str(i.get("amount") or "0") != "0"]
          print(f"iz nih S NENULEVYM ostatkom: {len(s_ostatkom)}")
          for i in itog:
              print(f"  {i['mint']} schet={i['schet']} amount={i['amount']} "
                    f"ui={i['ui']} renta={i['lamportov_renty']}")
          json.dump({"koshelek": KOSHELEK, "lamportov": lamporty,
                      "sol": (lamporty / 1e9 if lamporty is not None else None),
                      "minty_spisannyh": minty, "scheta_spisannyh": itog,
                      "s_nenulevym_ostatkom": s_ostatkom},
                     open("data/konservaciya_cep.json", "w"),
                     ensure_ascii=False, indent=2)
          BALANS
          # БАЛАНС КАЖДОГО ПУБЛИЧНОГО АДРЕСА, А НЕ ОДНОГО. Первый прогон дал
          # по кошельку исполнителя 0 SOL, и этого мало для ответа "баланс по
          # цепи": деньги полосы лежат на ЕЁ кошельке, а его адрес -- в
          # окружении хоста. Здесь сверяются и адреса, и балансы.
          # СВЕРКА ИДЁТ ДО ЗАПИСИ В ОТЧЁТ, А НЕ ПОСЛЕ. Отчёт коммитится в
          # ветку, то есть попадает в репозиторий навсегда. Непроверенное
          # значение туда писать нельзя: если цепь счёта не подтвердила, это не
          # адрес, и в отчёте его быть не должно вовсе.
          ADRESA_OK=yes
          python3 deploy/checks/adresa_sushchestvujut.py adresa_tolko.txt \
            > adresa_balansy.txt 2>&1 || ADRESA_OK=no
          cat adresa_balansy.txt
          {
            echo
            echo "## Публичные адреса с хоста и их балансы по цепи"
            echo
          } >> "$OUT"
          if [ "$ADRESA_OK" = "yes" ]; then
            {
              echo '```'
              echo "ИМЯ=АДРЕС из окружения хоста (значения -- публичные адреса):"
              cat adresa_hosta.txt
              echo
              cat adresa_balansy.txt
              echo '```'
            } >> "$OUT"
          else
            {
              echo "**Адреса в отчёт НЕ записаны:** цепь подтвердила не все."
              echo "Непроверенное значение в репозиторий не кладём -- если счёта"
              echo "на цепи нет, это не адрес. Разбор -- в журнале прогона."
            } >> "$OUT"
            echo "SBOJ: ne vse adresa podtverzhdeny cepju -- v otchjot ne pishem"
          fi
          {
            echo
            echo "## Баланс и списанные на кошельке"
            echo
            echo '```'
            cat balans.txt
            echo '```'
          } >> "$OUT"

      - name: "Коммит отчёта"
        if: always()
        run: |
          set -e
          {
            echo
            echo "## Что НЕ сделано намеренно"
            echo
            echo "Юниты systemd, код в /home/bot/bloom_executor, состояние в"
            echo "/home/bot/bloom_executor_live_data и /etc/bloom-executor"
            echo "ОСТАВЛЕНЫ на месте: слово владельца \"без удаления\"."
            echo "Обратное включение -- systemctl enable --now bloom-detector bloom-seller"
            echo "и нужные таймеры."
          } >> "$OUT"
          # ПУШ НЕ ЧЕРЕЗ КОНВЕЙЕР, И ЭТО НЕ СТИЛЬ. Было
          # `if git push ... | tail -2`, а в этом шаге стоит set -e БЕЗ
          # pipefail: статус конвейера -- это статус tail, то есть НОЛЬ даже
          # когда пуш отвергнут. Прогон 12.10 так и сказал "success", а отчёта
          # в ветке не появилось: пуш отвергли (пока он шёл, в ветку лёг чужой
          # коммит), tail это скрыл, и шаг вышел с нулём. Теперь pipefail стоит,
          # пуш идёт БЕЗ конвейера, а в конце СВЕРКА: коммит правда на ветке.
          set -o pipefail
          git add "$OUT" data/konservaciya_*.json 2>/dev/null || git add "$OUT"
          git commit -q -m "Konservaciya: ostanovka sluzhb, nul pozicij i balans [automated]" || {
            echo "nechego kommitit"; exit 0; }
          NASH=$(git rev-parse HEAD)
          ULOZHEN=no
          for POPYTKA in 1 2 3 4 5; do
            if git push origin "HEAD:claude/nifty-sagan-r0polg"; then
              ULOZHEN=yes
              break
            fi
            echo "push otvergnut, popytka $POPYTKA -- dogonjaju vetku"
            git fetch -q origin claude/nifty-sagan-r0polg
            git rebase FETCH_HEAD || { git rebase --abort || true; }
            NASH=$(git rev-parse HEAD)
            sleep $(( 2 ** POPYTKA ))
          done
          if [ "$ULOZHEN" != "yes" ]; then
            echo "SBOJ: otchjot ne ulozhen v vetku posle 5 popytok"
            exit 1
          fi
          # СВЕРКА: наш коммит правда на ветке, а не "push сказал ок".
          git fetch -q origin claude/nifty-sagan-r0polg
          if ! git merge-base --is-ancestor "$NASH" FETCH_HEAD; then
            echo "SBOJ: push proshel, no kommita $NASH na vetke net"
            exit 1
          fi
          echo "otchjot na vetke: $NASH"

      - name: "Итог одной строкой"
        if: always()
        run: |
