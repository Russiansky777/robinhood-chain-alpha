name: "Bloom: деплой сторожа продаж на NL-хост (по умолчанию dry-run)"

# Первый коммит задачи B: на хост ставится ТОЛЬКО сторож продаж. Кода,
# способного что-то купить, на хосте ещё нет вообще -- тормоза раньше газа.
#
# Чего нет в прежних деплой-workflow и что добавлено здесь:
#   * бэкап env перед правкой (cp -a), а не перезапись без копии;
#   * проверка НЕПУСТОТЫ секретов до записи env -- иначе служба падает уже
#     на хосте со строкой KEY= в файле;
#   * сверка sha256 доставленного кода с падением job при расхождении, а не
#     печать обеих сумм в лог;
#   * systemctl is-active --quiet || exit 1 -- прежние шаги были
#     информационными и возвращали 0 при любом содержимом;
#   * гейт "нет открытых позиций" перед перезапуском;
#   * concurrency, чтобы два деплоя боевой службы не шли одновременно;
#   * ужесточение юнита: ProtectSystem, ProtectHome, PrivateTmp,
#     ReadWritePaths, NoNewPrivileges, лимит памяти.
#
# Вместе со сторожем на хост кладётся и детектор (bloom_detector.py) --
# он ничего не покупает, ни одного POST в Bloom из него не уходит, службы
# для него пока нет. Кода, способного КУПИТЬ, на хосте по-прежнему нет.
#
# BLOOM_LIVE_SELL=0 по умолчанию: сторож считает и пишет, но не продаёт.
on:
  workflow_dispatch:
    inputs:
      zavisshie_fantomy:
        description: "yes -- разово пропустить ЗАВИСШИЕ позиции, у которых токена на цепи уже нет (фантомы). Открытые позиции не пропускаются ничем. Ставит человек, по умолчанию пусто"
        required: false
        default: ""
      vtoroe_mnenie_pervyj_deploj:
        description: "'yes' -- РАЗОВО пропустить гейт «модуль второго мнения загружен» (поле пишет только сторож с этой правкой)"
        required: false
        default: "no"
      runner:
        description: "'nl' -- свой раннер на хосте (по умолчанию), 'cloud' -- запасной облачный путь"
        required: false
        default: "nl"
      enable_service:
        description: "'yes' -- включить и перезапустить службу"
        required: false
        default: "no"
      live_sell:
        description: "'1' -- РЕАЛЬНЫЕ продажи сторожем (по умолчанию 0)"
        required: false
        default: "0"
      sell_after_s:
        description: "горизонт продажи, с (для справки в env)"
        required: false
        default: "28.8"
      allow_live_test_restart:
        description: "'yes' -- перезапуск разрешён, если ВСЕ открытые позиции live-test"
        required: false
        default: "no"
      max_attempts:
        description: "сколько неудачных попыток до UNSOLD (по умолчанию 2)"
        required: false
        default: "2"
      telegram_log_chat_id:
        description: "ID журнальной группы Telegram (пусто -- оставить прежний с хоста)"
        required: false
        default: ""
      telegram_live_test:
        description: "'1' -- строки о событиях стенда в Telegram (по умолчанию 1)"
        required: false
        default: "1"
      via_jupiter:
        description: "'1' -- второй путь выхода через Jupiter Ultra (нужен секрет EXEC_WALLET_KEY)"
        required: false
        default: "0"
      keep_env:
        description: "env на хосте НЕ трогать: ТОЛЬКО 'yes'. Иное значение требует perepisat_env"
        required: false
        default: "yes"
      perepisat_env:
        description: "ПЕРЕПИСАТЬ env целиком -- ровно слово PEREPISAT, иначе деплой откажется"
        required: false
        default: ""
      allow_lane_restart:
        description: "'yes' -- перезапуск разрешён, если ВСЕ открытые позиции -- позиции полосы"
        required: false
        default: "no"

concurrency:
  group: bloom-seller-deploy
  cancel-in-progress: false

env:
  HOST: 45.59.170.76
  SVC: bloom-seller
  CODE_DIR: /home/bot/bloom_executor
  STATE_DIR: /home/bot/bloom_executor_live_data
  ENV_DIR: /etc/bloom-executor

jobs:
  deploy:
    # Свой раннер стоит НА хосте: файлы не едут через океан, круг
    # деплоя падает с ~95 до ~50 секунд (замерено 24.09 на зонде).
    # Облачный путь остаётся запасным входом runner=cloud.
    runs-on: ${{ inputs.runner == 'cloud' && 'ubuntu-latest' || fromJSON('["self-hosted","nl-host"]') }}
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/nifty-sagan-r0polg

      - name: "ГЕЙТ: переписывать env можно только по явному слову"
        # ЗАЧЕМ (слово владельца 28.09 ночью, п.3): "keep_env=yes сделать
        # умолчанием деплоя; вход без него невозможен. Два раза за два дня гейт
        # спасал ключи -- третьего не должно быть". Деплой с пустыми входами
        # 23:15:31Z начал переписывать env и потерял бы 34 строки, включая
        # ключи кошельков: спас только гейт сверки ключей. Теперь умолчание --
        # НЕ ТРОГАТЬ env, а перезапись требует отдельного слова.
        run: |
          set -e
          KEEP="${{ inputs.keep_env }}"
          SLOVO="${{ inputs.perepisat_env }}"
          if [ "$KEEP" = "yes" ]; then
            echo "env ne trogaem -- eto umolchanie"
            exit 0
          fi
          if [ "$SLOVO" = "PEREPISAT" ]; then
            echo "VNIMANIE: env budet perepisan celikom po yavnomu slovu vladelca"
            exit 0
          fi
          echo "DEPLOJ OTMENJON: keep_env='$KEEP' bez slova PEREPISAT v perepisat_env."
          echo "Perezapis env teryaet stroki, kotoryh net vo vhodah: 28.09 tak"
          echo "poteryalis by 34 klyucha, sredi nih klyuchi koshelkov."
          exit 1


      - name: "Адрес хоста и питон"
        run: |
          set -e
          # На своём раннере ssh идёт по петле: файлы не едут через океан.
          # На облачном -- по внешнему адресу, как раньше.
          if [ "${{ inputs.runner }}" = "cloud" ]; then
            echo "TARGET_HOST=$HOST" >> "$GITHUB_ENV"
            echo "где выполняюсь: облачный бегунок"
          else
            echo "TARGET_HOST=127.0.0.1" >> "$GITHUB_ENV"
            echo "где выполняюсь: свой раннер на NL-хосте"
          fi
          # Системный python3 на хосте может быть без requests: ставим не в
          # систему, а во временное окружение прогона.
          if python3 -c "import requests" 2>/dev/null; then
            echo "PY=python3" >> "$GITHUB_ENV"
          else
            python3 -m venv "$RUNNER_TEMP/selftest_venv"
            "$RUNNER_TEMP/selftest_venv/bin/pip" install -q requests
            echo "PY=$RUNNER_TEMP/selftest_venv/bin/python" >> "$GITHUB_ENV"
          fi

      - name: "Самопроверки ДО доставки (без сети)"
        run: |
          set -e
          cd analysis
          "$PY" bloom_exec_state.py --self-test
          "$PY" bloom_api.py --self-test
          "$PY" bloom_seller.py --self-test
          "$PY" bloom_detector.py --self-test
          "$PY" check_shell_ascii.py --self-test
          python3 check_shell_ascii.py ../.github/workflows ../deploy
          # ПЕРЕНОС СТРОКИ EXEC_WALLET_KEY ПРИ ПОЛНОЙ ПЕРЕЗАПИСИ env ПРОВЕРЯЕТСЯ
          # ЗДЕСЬ, А НЕ ГЛАЗАМИ. Самопроверка установщика хостовых таймеров читает
          # ЭТОТ прогон и падает, если имени EXEC_WALLET_KEY нет в отборе прежних
          # значений: именно так оно и было до 02.10 -- разбор строки стоял, а
          # grep её не пропускал, и ключ при перезаписи пропадал.
          "$PY" ../deploy/hostovye_tajmery.py --self-test
          "$PY" ../deploy/zhivuchest_na_hoste.py --self-test

      - name: "Секреты не пусты (значения не печатаются)"
        env:
          BLOOM_API_KEY: ${{ secrets.BLOOM_API_KEY }}
          HELIUS_API_KEY: ${{ secrets.HELIUS_API }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -e
          fail=0
          for NAME in BLOOM_API_KEY HELIUS_API_KEY VPS_SSH_KEY; do
            V="${!NAME}"
            if [ -z "$V" ]; then echo "$NAME: НЕ ЗАДАН"; fail=1
            else echo "$NAME: задан, длина ${#V}"; fi
          done
          [ "$fail" = "0" ] || { echo "деплой остановлен: нет обязательных секретов"; exit 1; }

      - name: "SSH key + known_hosts"
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -e
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          echo "SSH_OPTS=-i $HOME/.ssh/vps_key -o ConnectTimeout=15 -o BatchMode=yes -o StrictHostKeyChecking=accept-new" >> "$GITHUB_ENV"

      - name: "Каталоги и владельцы"
        run: |
          ssh -n $SSH_OPTS root@$TARGET_HOST "
            set -e
            id -u bot >/dev/null 2>&1 || useradd -m -s /bin/bash bot
            mkdir -p $CODE_DIR $STATE_DIR $ENV_DIR
            chown -R bot:bot $CODE_DIR $STATE_DIR
            chmod 750 $CODE_DIR $STATE_DIR
            chown root:root $ENV_DIR && chmod 711 $ENV_DIR
            # 711, а не 750: служба работает от bot и обязана ПРОЧИТАТЬ
            # файл рубильника. При 750 root:root bot не мог войти в
            # каталог, exists() бросал PermissionError, fail-closed
            # запрещал покупки -- снаружи это выглядело как тишина.
            # Сам env остаётся 600 root:root: systemd читает его root-ом.
          "

      - name: "Все нужные модули есть в списке доставки"
        # ЗАЧЕМ. 27.09 первый настоящий двухшаговый сигнал пропал на
        # ModuleNotFoundError: bloom_lane_two_step.py не было в списке ниже.
        # Проверка ловит весь этот класс: по объединению списков обоих
        # прогонов транзитивно ищутся импорты наших модулей.
        run: python3 analysis/check_deploy_modules.py

      - name: "Доставка кода + СВЕРКА sha256 (расхождение = падение)"
        run: |
          set -e
          # Сумма пустого файла: если она появится, значит доставка
          # прошла «успешно», но ничего не доставила -- называем это прямо.
          EMPTY_SHA=e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
          # solana_rpc_client -- ради УЖЕ согласованной модели кредитов Helius.
          # Без него службы работают, но расход не попадает в учёт, и
          # почасовая проверка кредитов смотрит на четверть картины.
          #
          # c2_itog_po_cepi, c2_swap_build, c2_shadow_build -- СТОРОЖ ИХ
          # ИМПОРТИРУЕТ, а в списке их не было. Работало это по случайности:
          # продавец и детектор лежат в ОДНОМ каталоге (/home/bot/bloom_executor),
          # и файлы туда привозил деплой детектора. То есть деплой продавца в
          # одиночку привозил сторожа НОВОГО, а правило 13 (итог по цепи) --
          # СТАРОЕ, и расхождение было бы молчаливым: итог по цепи просто не
          # дописался бы, а суточный стоп читал бы прежнее число. Список теперь
          # полный, и деплой продавца самодостаточен.
          #
          # РАССВЕТ 02.10: СВОЙ ПРОДАВЕЦ НА ВСЕ ТИПЫ. vtoroe_mnenie_reestr --
          # слой адресации (его в списке не было ВОВСЕ, то есть на хосте его не
          # было никогда); c3_kotirovka_prodazhi и c3_prodavec_sborka -- котировка
          # и сборка продажи Code-3, две точки врезки правила 4. Остальные
          # добавленные -- то, что эти два модуля импортируют ЛЕНИВО, по типу
          # пула: c2_common и c2_pool_programs нужны всем, c2_cl_quote -- DAMM v2,
          # строители -- CLMM/Whirlpool/AMM v4/DBC, два c2_dlmm -- DLMM,
          # c2_nalog_2022 -- минтам с налогом. Они и раньше приезжали деплоем
          # детектора в тот же каталог; теперь продавец не зависит от его порядка.
          for f in bloom_notify.py bloom_jupiter_sell.py dbot_rescue.py bloom_exec_state.py bloom_api.py bloom_seller.py bloom_detector.py bloom_telegram_cmd.py solana_rpc_client.py bloom_close_on_sell.py bloom_tg_format.py bloom_tg_format3.py bloom_doklad.py bloom_own_send.py bloom_lane_two_step.py bloom_lane_sell.py bloom_vtoroe_mnenie.py c2_itog_po_cepi.py c2_swap_build.py c2_shadow_build.py c3_bilet_ot_rezerva.py vtoroe_mnenie_reestr.py c3_kotirovka_prodazhi.py c3_prodavec_sborka.py c2_common.py c2_pool_programs.py c2_cl_quote.py c2_clmm_stroitel.py c2_whirlpool_stroitel.py c2_ammv4_stroitel.py c2_dbc_stroitel.py c2_dlmm_bez_chteniy.py c2_dlmm_odno_chtenie.py c2_nalog_2022.py; do
            [ -s "analysis/$f" ] || { echo "СБОЙ: локальный analysis/$f пуст"; exit 1; }
            local_sum=$(sha256sum "analysis/$f" | cut -d' ' -f1)
            # БЕЗ -n: -n подменяет stdin на /dev/null и перекрывает < файл,
            # то есть на хост уезжает пустота. Первый прогон именно так и
            # упал -- сверка sha256 показала сумму пустого файла.
            # СОВПАЛО -- НЕ ПЕРЕПИСЫВАЕМ: тот же файл с новым mtime выглядит
            # как новый код, и проверка "служба старше своих модулей" даёт
            # ложную тревогу после второго деплоя подряд.
            was_sum=$(ssh -n $SSH_OPTS root@$TARGET_HOST "sha256sum $CODE_DIR/$f 2>/dev/null | cut -d' ' -f1")
            if [ "$was_sum" = "$local_sum" ]; then
              echo "$f: уже такой ($local_sum) -- не переписан, mtime не тронут"
              continue
            fi
            ssh $SSH_OPTS root@$TARGET_HOST "cat > $CODE_DIR/$f && chown bot:bot $CODE_DIR/$f && chmod 644 $CODE_DIR/$f" < "analysis/$f"
            remote_sum=$(ssh -n $SSH_OPTS root@$TARGET_HOST "sha256sum $CODE_DIR/$f | cut -d' ' -f1")
            echo "$f: локально $local_sum, на хосте $remote_sum"
            [ "$remote_sum" != "$EMPTY_SHA" ] || { echo "СБОЙ: на хост уехал ПУСТОЙ $f (stdin не дошёл до ssh)"; exit 1; }
            [ "$local_sum" = "$remote_sum" ] || { echo "СБОЙ: суммы не совпали для $f"; exit 1; }
          done

      - name: "Путь через Jupiter: ключ обязателен и должен быть НАШЕГО кошелька"
        if: ${{ github.event.inputs.via_jupiter == '1' }}
        env:
          EXEC_WALLET_KEY: ${{ secrets.EXEC_WALLET_KEY }}
        run: |
          set -e
          # Включить путь и не положить ключ -- значит получить сторожа,
          # который каждый раз отказывается продавать по причине "нет ключа".
          # Лучше остановить деплой здесь и сказать это прямо.
          #
          # НО КЛЮЧ МОЖЕТ ЖИТЬ НА ХОСТЕ, А НЕ В СЕКРЕТЕ (слово владельца 01.10):
          # после замены на свежий ключ пустого кошелька секрет репозитория
          # удаляется, и единственная копия остаётся в /etc/bloom-executor/env.
          # Поэтому отказ только когда ключа нет НИ ТАМ, НИ ТАМ -- иначе прогон
          # падал бы при полностью рабочем стенде.
          if [ -z "$EXEC_WALLET_KEY" ]; then
            NA_HOSTE=$(ssh -n $SSH_OPTS root@$TARGET_HOST "sed -n 's/^EXEC_WALLET_KEY=//p' $ENV_DIR/env | tail -1 | wc -c" || echo 0)
            echo "секрета нет; длина строки ключа на хосте: $NA_HOSTE"
            [ "$NA_HOSTE" -gt 1 ] || {
              echo "СБОЙ: via_jupiter=1, а ключа нет ни в секрете, ни на хосте."
              echo "Ключ кладётся либо в секрет EXEC_WALLET_KEY, либо прогоном"
              echo "run_klyuchi_pochistit_nl.yml со словом svezhij_kljuch=SVEZHIJ."
              exit 1; }
            echo "ключ берётся С ХОСТА (значение не печатается)"
          else
            echo "ключ кошелька в секрете есть (значение не печатается)"
          fi
          # В систему ставить нельзя: на своём раннере python3 помечен
          # externally-managed (PEP 668), и pip отказывается -- ровно на этом
          # упал прогон 36042078292. Ставим во временное окружение прогона.
          if ! "$PY" -c "import solders, requests" 2>/dev/null; then
            python3 -m venv "$RUNNER_TEMP/key_venv"
            "$RUNNER_TEMP/key_venv/bin/pip" install -q solders requests
            PY="$RUNNER_TEMP/key_venv/bin/python"
            echo "PY=$PY" >> "$GITHUB_ENV"
          fi
          # Сверка публичного ключа ДО доставки: чужой ключ подписал бы
          # чужой кошелёк. Печатается только публичный ключ -- он публичный.
          # Отдельным файлом, а не heredoc: вложенный heredoc в "run: |" уже
          # ломался на закрывающей метке с отступом.
          "$PY" analysis/bloom_key_match.py

      - name: "Имена ключей env на хосте ДО правки (значения не печатаются)"
        run: |
          set -e
          set -o pipefail
          # Зачем это есть. Шаг записи env перезаписывает файл ЦЕЛИКОМ, а env
          # у сторожа и детектора ОДИН. Так уже терялся ключ Jupiter V2, и так
          # же потерялись бы кошелёк полосы, её ключ и ключи отправителей -- то
          # есть деньги. Ниже имена сверяются после правки, и потеря ключа
          # отменяет деплой с восстановлением из бэкапа. Печатаются только
          # ИМЕНА: значения не печатаются никогда.
          ssh -n $SSH_OPTS root@$TARGET_HOST "grep -oE '^[A-Za-z_][A-Za-z0-9_]*=' $ENV_DIR/env | tr -d = | sort -u" > "$RUNNER_TEMP/env_keys_before.txt"
          echo "ключей в env до правки: $(wc -l < "$RUNNER_TEMP/env_keys_before.txt")"
          cat "$RUNNER_TEMP/env_keys_before.txt" | tr "\n" " "
          echo ""
          # ВТОРОЙ СНИМОК: ИМЕНА КЛЮЧЕЙ, У КОТОРЫХ ЗНАЧЕНИЕ НЕ ПУСТО. Гейт ниже
          # сверял только МНОЖЕСТВО ИМЁН, и строка EXEC_WALLET_KEY= (имя есть,
          # значение пустое) прошла бы его насквозь: имя на месте, а ключа нет.
          # Для пути Jupiter и для подписи полосы это ровно та же потеря денег,
          # что и исчезнувшая строка, только незаметная. Отбирается по "=" плюс
          # ОДИН любой знак; сам знак остаётся в файле на бегунке и в вывод шага
          # не идёт -- печатается только счётчик.
          ssh -n $SSH_OPTS root@$TARGET_HOST "grep -oE '^[A-Za-z_][A-Za-z0-9_]*=.' $ENV_DIR/env | sed 's/=.\$//' | sort -u" > "$RUNNER_TEMP/env_znachenija_before.txt"
          S_ZNACHENIEM=$(wc -l < "$RUNNER_TEMP/env_znachenija_before.txt")
          echo "из них с непустым значением: $S_ZNACHENIEM"
          # ПУСТОЙ СНИМОК -- ЭТО НЕ "ВСЁ ХОРОШО", А НЕПРОЧИТАННОЕ СОСТОЯНИЕ.
          # Удалённый grep при пустой выборке отдаёт код 1, а sort после него --
          # ноль, поэтому ssh вернул бы успех с пустым файлом, и гейт ниже прошёл
          # бы, ничего не сравнив. Тихого зелёного гейта быть не должно.
          # НО СПЕРВА СПРАШИВАЕМ, ЕСТЬ ЛИ САМ ФАЙЛ, И ВОТ ПОЧЕМУ. Этот шаг идёт
          # БЕЗ if -- то есть и при keep_env=yes, когда env вообще не правится, и
          # на хосте, где env ещё не заводили. Отказ без этого вопроса валил бы
          # первый деплой нового хоста и деплой, который env не касается: там
          # терять нечего, а гейт ниже на пустых снимках честно скажет "ничего не
          # потеряно". Отказ остаётся там, где он нужен: файл ЕСТЬ, а прочитать
          # из него не удалось ничего.
          ENV_JEST=$(ssh -n $SSH_OPTS root@$TARGET_HOST "test -f $ENV_DIR/env && echo da || echo net")
          echo "файл env на хосте: $ENV_JEST"
          [ -n "$ENV_JEST" ] || {
            echo "ДЕПЛОЙ ОТМЕНЁН: хост не ответил, есть ли $ENV_DIR/env."
            echo "Состояние env неизвестно -- править его в этом состоянии нельзя."
            exit 1; }
          if [ "$ENV_JEST" = "da" ] && [ "$S_ZNACHENIEM" -eq 0 ]; then
            echo "ДЕПЛОЙ ОТМЕНЁН: env на хосте ЕСТЬ, но непустых значений в нём не прочитано."
            echo "Либо файл не читается, либо он пуст -- в обоих случаях правка env запрещена."
            exit 1
          fi

      - name: "Прежние боевые настройки с хоста (перенести, а не затереть)"
        if: ${{ inputs.keep_env != 'yes' && inputs.perepisat_env == 'PEREPISAT' }}
        run: |
          set -e
          # Читаем ТОЛЬКО перечисленные ниже имена и ничего больше. Значения в
          # журнал не идут: ключи маскируются, у флагов печатается само значение.
          # (Прежняя строка здесь говорила "только два значения" -- их давно
          # девять, и неверный комментарий хуже отсутствующего.)
          # EXEC_WALLET_KEY СТОИТ В ЭТОМ ЖЕ grep, И ЭТО НЕ УКРАШЕНИЕ. Ниже уже
          # лежал разбор EXEC_WALLET_KEY= из $PREV, но самого имени в отборе НЕ
          # БЫЛО: grep его не пропускал, EXEC_KEY_PREV выходил пустым ВСЕГДА, и
          # перезапись без секрета теряла строку ключа ровно так, как комментарий
          # ниже обещал не терять. Проверка на это -- в самопроверке
          # deploy/hostovye_tajmery.py, и она падает именно на пустом отборе.
          PREV=$(ssh -n $SSH_OPTS root@$TARGET_HOST "grep -E '^(BLOOM_LIVE_BUY|BLOOM_BUY_SOL|TELEGRAM_LOG_CHAT_ID|JUPITER_API_KEY|EXEC_WALLET_KEY|BLOOM_OWN_SEND|BLOOM_OWN_SEND_LIVE|BLOOM_OWN_SEND_SOL|BLOOM_SENDER_REGION)=' $ENV_DIR/env || true")
          LB=$(echo "$PREV" | sed -n 's/^BLOOM_LIVE_BUY=//p' | tail -1)
          BS=$(echo "$PREV" | sed -n 's/^BLOOM_BUY_SOL=//p' | tail -1)
          LG=$(echo "$PREV" | sed -n 's/^TELEGRAM_LOG_CHAT_ID=//p' | tail -1)
          # Ключ Jupiter V2: этот шаг перезаписывает env ЦЕЛИКОМ, и ключ,
          # положенный отдельным прогоном, стирался молча -- путь продажи
          # возвращался на Ultra, и признак жизни об этом не говорил.
          # Длина, не значение: значение в журнал не идёт.
          JK=$(echo "$PREV" | sed -n 's/^JUPITER_API_KEY=//p' | tail -1)
          echo "прежний JUPITER_API_KEY: длина ${#JK}"
          echo "::add-mask::$JK"
          echo "JUP_KEY_PREV=$JK" >> $GITHUB_ENV
          # ПОЛОСА СВОЕЙ ОТПРАВКИ. Её настройки ставит деплой детектора, а
          # этот шаг перезаписывает env ЦЕЛИКОМ: без переноса любой деплой
          # сторожа молча выключал бы полосу -- то есть менял поведение денег
          # на ровном месте. Та же ошибка уже стоила ключа Jupiter V2.
          OS_ON=$(echo "$PREV" | sed -n 's/^BLOOM_OWN_SEND=//p' | tail -1)
          OS_LIVE=$(echo "$PREV" | sed -n 's/^BLOOM_OWN_SEND_LIVE=//p' | tail -1)
          OS_SOL=$(echo "$PREV" | sed -n 's/^BLOOM_OWN_SEND_SOL=//p' | tail -1)
          OS_REG=$(echo "$PREV" | sed -n 's/^BLOOM_SENDER_REGION=//p' | tail -1)
          echo "прежняя полоса: BLOOM_OWN_SEND=[$OS_ON], LIVE=[$OS_LIVE], размер=[$OS_SOL], регион=[$OS_REG]"
          echo "OWN_SEND_PREV=$OS_ON" >> $GITHUB_ENV
          echo "OWN_SEND_LIVE_PREV=$OS_LIVE" >> $GITHUB_ENV
          echo "OWN_SEND_SOL_PREV=$OS_SOL" >> $GITHUB_ENV
          echo "SENDER_REGION_PREV=$OS_REG" >> $GITHUB_ENV
          echo "прежний BLOOM_LIVE_BUY=[$LB], BLOOM_BUY_SOL=[$BS], журнальный чат=[$LG]"
          echo "LIVE_BUY_PREV=$LB" >> $GITHUB_ENV
          echo "BUY_SOL_PREV=$BS" >> $GITHUB_ENV
          echo "LOG_CHAT_PREV=$LG" >> $GITHUB_ENV
          # КЛЮЧ КОШЕЛЬКА: ПРЕЖНЮЮ СТРОКУ С ХОСТА СОХРАНЯЕМ (слово владельца
          # 01.10, вечер). Причина: 01.10 EXEC_WALLET_KEY заменён свежим ключом
          # НОВОГО кошелька, который никогда не пополняется, а секрет
          # репозитория владелец удаляет -- значит хост остаётся ЕДИНСТВЕННЫМ
          # местом, где этот ключ есть. Перезапись env без переноса стёрла бы
          # его молча, как уже стирала ключ Jupiter V2.
          #
          # ПЕЧАТАЕТСЯ ТОЛЬКО ИМЯ И ФАКТ. Даже длина теперь не печатается
          # (слово владельца 02.10): длина base58-ключа -- это подсказка о его
          # виде, а знать её прогону незачем. Маскировка стоит ДО всякого вывода:
          # если значение случайно попадёт в строку шага, GitHub его затрёт.
          EK=$(echo "$PREV" | sed -n 's/^EXEC_WALLET_KEY=//p' | tail -1)
          if [ -n "$EK" ]; then
            echo "::add-mask::$EK"
            echo "EXEC_WALLET_KEY: строка на хосте есть и будет ПЕРЕНЕСЕНА, если секрета в прогоне нет"
          else
            echo "EXEC_WALLET_KEY: строки на хосте нет -- переносить нечего"
          fi
          echo "EXEC_KEY_PREV=$EK" >> $GITHUB_ENV

      - name: "env: бэкап перед правкой, затем запись 600 root:root"
        if: ${{ inputs.keep_env != 'yes' && inputs.perepisat_env == 'PEREPISAT' }}
        env:
          BLOOM_API_KEY: ${{ secrets.BLOOM_API_KEY }}
          HELIUS_API_KEY: ${{ secrets.HELIUS_API }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_LOG_CHAT_ID: ${{ github.event.inputs.telegram_log_chat_id || env.LOG_CHAT_PREV }}
          JUPITER_API_KEY: ${{ secrets.JUPITER_API_KEY || env.JUP_KEY_PREV }}
          LIVE_SELL: ${{ github.event.inputs.live_sell || '0' }}
          SELL_AFTER_S: ${{ github.event.inputs.sell_after_s || '28.8' }}
          MAX_ATTEMPTS: ${{ github.event.inputs.max_attempts || '2' }}
          TELEGRAM_LIVE_TEST: ${{ github.event.inputs.telegram_live_test || '1' }}
          VIA_JUPITER: ${{ github.event.inputs.via_jupiter || '0' }}
          EXEC_WALLET_KEY: ${{ secrets.EXEC_WALLET_KEY || env.EXEC_KEY_PREV }}
          # НЕ ЗНАЧЕНИЕ, А ОТВЕТ ДА/НЕТ: по нему шаг говорит, откуда взялся ключ.
          # Без этого в журнале не отличить "ключ из секрета" от "ключ перенесён
          # с хоста", а это два разных состояния стенда.
          EXEC_KEY_IZ_SEKRETA: ${{ secrets.EXEC_WALLET_KEY != '' }}
        run: |
          set -e
          # ОТКУДА ВЗЯЛСЯ EXEC_WALLET_KEY -- ИМЯ И ФАКТ, значение не печатается.
          if [ -z "$EXEC_WALLET_KEY" ]; then
            echo "EXEC_WALLET_KEY: нет ни в секрете, ни на хосте -- строка не будет записана"
          elif [ "$EXEC_KEY_IZ_SEKRETA" = "true" ]; then
            echo "EXEC_WALLET_KEY: взят из секрета прогона"
          else
            echo "EXEC_WALLET_KEY: секрета в прогоне нет -- прежняя строка ПЕРЕНЕСЕНА с хоста как есть"
          fi
          ssh -n $SSH_OPTS root@$TARGET_HOST "
            f=$ENV_DIR/env
            if [ -f \"\$f\" ]; then cp -a \"\$f\" \"\$f.bak.\$(date +%s)\"; echo 'бэкап env сделан'; fi
          "
          umask 077
          {
            echo "BLOOM_API_KEY=$BLOOM_API_KEY"
            echo "HELIUS_API_KEY=$HELIUS_API_KEY"
            echo "HELIUS_API=$HELIUS_API_KEY"
            echo "TELEGRAM_BOT_TOKEN=$TELEGRAM_BOT_TOKEN"
            echo "TELEGRAM_CHAT_ID=$TELEGRAM_CHAT_ID"
            # Журнальный чат: построчные решения детектора. Пусто -- строки
            # не идут НИКУДА (слово владельца), в основной чат они не
            # подмешиваются. Прежнее значение с хоста не затирается.
            if [ -n "$TELEGRAM_LOG_CHAT_ID" ]; then
              echo "TELEGRAM_LOG_CHAT_ID=$TELEGRAM_LOG_CHAT_ID"
            fi
            echo "BLOOM_STATE_DIR=$STATE_DIR"
            echo "BLOOM_KILL_FILE=$ENV_DIR/KILL"
            echo "BLOOM_KILL_SELL_FILE=$ENV_DIR/KILL_SELL"
            # Строки о событиях стенда в Telegram. Получатель -- только
            # TELEGRAM_CHAT_ID владельца, боевые источники молчат, а сбой
            # отправки живёт в признаке жизни и торговлю не останавливает.
            echo "BLOOM_TELEGRAM_LIVE_TEST=$TELEGRAM_LIVE_TEST"
            # Второй путь выхода -- Jupiter Ultra. Ключ кошелька пишется
            # ТОЛЬКО когда путь включён: лишнего ключа на хосте быть не
            # должно. В логи он не попадает -- пишется через переменную.
            echo "BLOOM_SELL_VIA_JUPITER=$VIA_JUPITER"
            # ПУСТЫМ НЕ ПИШЕМ НИКОГДА: пустая строка означала бы "ключ есть,
            # но пустой" -- это хуже отсутствия, путь продажи считал бы себя
            # готовым. И не смотрим на via_jupiter: ключ принадлежит пустому
            # кошельку, который никогда не пополняется, а потерять единственную
            # его копию нельзя -- секрета репозитория может уже не быть.
            if [ -n "$EXEC_WALLET_KEY" ]; then
              echo "EXEC_WALLET_KEY=$EXEC_WALLET_KEY"
            fi
            # Ключ Swap V2. Есть ключ -> путь swap-v2, Ultra запасной; нет
            # ключа -> Ultra. Пустым его писать нельзя: пустая строка в env
            # означала бы "ключ есть", а он пустой.
            if [ -n "$JUPITER_API_KEY" ]; then
              echo "JUPITER_API_KEY=$JUPITER_API_KEY"
            fi
            echo "BLOOM_JUP_FLOOR_PCT=70"
            echo "BLOOM_JUP_MIN_QUOTE_PCT=30"
            echo "BLOOM_LIVE_SELL=$LIVE_SELL"
            echo "BLOOM_SELL_SLIPPAGE_PCT=40"
            echo "BLOOM_SELL_GRACE_S=15"
            echo "BLOOM_SELL_RETRY_EVERY_S=45"
            echo "BLOOM_SELL_GIVE_UP_AFTER_S=600"
            # Две неудачи -- и UNSOLD: десять минут на позицию, которая не
            # продаётся, владелец тратить не хочет. Потолок 600 с остаётся
            # вторым пределом, на случай если попытки вообще не доходят.
            echo "BLOOM_SELL_MAX_ATTEMPTS=$MAX_ATTEMPTS"
            # ПЕРИОД КРУГА СТОРОЖА -- 3 с (решение владельца 28.09). При 15 с
            # закрытие позиции записывалось РОВНО через 15.0 с после отправки
            # продажи (замерено на девяти сделках ночи 27->28.09: закрытие по
            # двум нулевым остаткам подряд ждало второго круга), и удержание в
            # строке выходило 43-52 с вместо настоящих 25-37 с. Три секунды
            # оставляют тот же порядок проверок, но не добавляют круга.
            echo "BLOOM_SELLER_LOOP_S=3"
            echo "BLOOM_PRIORITY_FEE=0.001"
            echo "BLOOM_PROCESSOR_TIP=0.001"
            echo "BLOOM_SELL_AFTER_S=$SELL_AFTER_S"
            echo "BLOOM_MAX_OPEN=5"
            echo "BLOOM_DAILY_LOSS_SOL=1"
            # Боевой флаг и размер боевой покупки ПЕРЕНОСЯТСЯ из прежнего env,
            # а не задаются здесь. Этот шаг перезаписывает файл целиком, и без
            # переноса любой деплой сторожа молча выключал бы боевые покупки и
            # возвращал размер к 0.2 SOL -- то есть менял деньги на ровном
            # месте. Значения читаются с хоста ДО перезаписи (см. шаг выше).
            echo "BLOOM_BUY_SOL=${BUY_SOL_PREV:-0.05}"
            if [ "${LIVE_BUY_PREV:-}" = "1" ]; then
              echo "BLOOM_LIVE_BUY=1"
              echo "BLOOM_TELEGRAM_REAL=1"
            fi
            # Настройки полосы своей отправки -- ПЕРЕНОСОМ с хоста. Пусто --
            # значит полосы там не было, и включать её деплой сторожа не
            # вправе: её включает отдельное решение владельца в деплое
            # детектора.
            if [ "${OWN_SEND_PREV:-}" = "1" ]; then
              echo "BLOOM_OWN_SEND=1"
              [ -n "${OWN_SEND_SOL_PREV:-}" ] && echo "BLOOM_OWN_SEND_SOL=$OWN_SEND_SOL_PREV"
              [ -n "${SENDER_REGION_PREV:-}" ] && echo "BLOOM_SENDER_REGION=$SENDER_REGION_PREV"
              if [ "${OWN_SEND_LIVE_PREV:-}" = "1" ]; then
                echo "BLOOM_OWN_SEND_LIVE=1"
              fi
            fi
          } > /tmp/bloom_env
          ssh $SSH_OPTS root@$TARGET_HOST "cat > $ENV_DIR/env && chown root:root $ENV_DIR/env && chmod 600 $ENV_DIR/env && ls -l $ENV_DIR/env" < /tmp/bloom_env
          shred -u /tmp/bloom_env
          echo "строк в env на хосте:"
          ssh -n $SSH_OPTS root@$TARGET_HOST "wc -l < $ENV_DIR/env; grep -cE '^[A-Za-z_][A-Za-z0-9_]*=' $ENV_DIR/env"

      - name: "ГЕЙТ: ни один ключ env не потерян правкой"
        if: ${{ inputs.keep_env != 'yes' && inputs.perepisat_env == 'PEREPISAT' }}
        run: |
          set -e
          set -o pipefail
          ssh -n $SSH_OPTS root@$TARGET_HOST "grep -oE '^[A-Za-z_][A-Za-z0-9_]*=' $ENV_DIR/env | tr -d = | sort -u" > "$RUNNER_TEMP/env_keys_after.txt"
          # ВТОРАЯ ПОЛОВИНА ГЕЙТА: КЛЮЧ, КОТОРЫЙ ОСТАЛСЯ ИМЕНЕМ, НО ОПУСТЕЛ.
          # Сверка только имён пропускала строку вида EXEC_WALLET_KEY= насквозь:
          # имя на месте, значения нет, путь Jupiter и подпись полосы мертвы, а
          # гейт говорит "все ключи env на месте". Именно этот случай и просил
          # поймать владелец 02.10. Печатаются только ИМЕНА.
          ssh -n $SSH_OPTS root@$TARGET_HOST "grep -oE '^[A-Za-z_][A-Za-z0-9_]*=.' $ENV_DIR/env | sed 's/=.\$//' | sort -u" > "$RUNNER_TEMP/env_znachenija_after.txt"
          LOST=$(comm -23 "$RUNNER_TEMP/env_keys_before.txt" "$RUNNER_TEMP/env_keys_after.txt" | tr "\n" " ")
          comm -23 "$RUNNER_TEMP/env_znachenija_before.txt" "$RUNNER_TEMP/env_znachenija_after.txt" \
            > "$RUNNER_TEMP/env_opusteli.txt"
          # Пересечение с именами ПОСЛЕ правки: ключ, пропавший целиком, о нём
          # говорит первая ветка, и дважды его называть незачем. Здесь остаются
          # ровно те, чьё ИМЯ выжило, а ЗНАЧЕНИЕ ушло.
          OBESCENENY=$(comm -12 "$RUNNER_TEMP/env_opusteli.txt" "$RUNNER_TEMP/env_keys_after.txt" | tr "\n" " ")
          if [ -n "$(echo "$LOST" | tr -d " ")" ]; then
            echo "ДЕПЛОЙ ОТМЕНЁН: правка env потеряла ключи: $LOST"
            # Возврат к известному состоянию, а не оставить полуфайл: бэкап
            # сделан тем же шагом правки минутой раньше.
            ssh -n $SSH_OPTS root@$TARGET_HOST "
              set -e
              newest=\$(ls -1t $ENV_DIR/env.bak.* 2>/dev/null | head -1)
              [ -n \"\$newest\" ] || { echo 'бэкапа нет -- восстановить нечем'; exit 1; }
              cp -a \"\$newest\" $ENV_DIR/env
              chown root:root $ENV_DIR/env
              chmod 600 $ENV_DIR/env
              echo \"env восстановлен из \$newest\"
            "
            exit 1
          fi
          if [ -n "$(echo "$OBESCENENY" | tr -d " ")" ]; then
            echo "ДЕПЛОЙ ОТМЕНЁН: ключи ОБЕСЦЕНЕНЫ -- имя на месте, значение ушло: $OBESCENENY"
            echo "Это та же потеря, что исчезнувшая строка, только незаметная:"
            echo "EXEC_WALLET_KEY= означает 'ключ есть, но пустой', и путь продажи"
            echo "через Jupiter считал бы себя готовым."
            ssh -n $SSH_OPTS root@$TARGET_HOST "
              set -e
              newest=\$(ls -1t $ENV_DIR/env.bak.* 2>/dev/null | head -1)
              [ -n \"\$newest\" ] || { echo 'бэкапа нет -- восстановить нечем'; exit 1; }
              cp -a \"\$newest\" $ENV_DIR/env
              chown root:root $ENV_DIR/env
              chmod 600 $ENV_DIR/env
              echo \"env восстановлен из \$newest\"
            "
            exit 1
          fi
          echo "гейт пройден: все ключи env на месте ($(wc -l < "$RUNNER_TEMP/env_keys_after.txt")), из них с непустым значением $(wc -l < "$RUNNER_TEMP/env_znachenija_after.txt")"

      - name: "Зависимость solders в venv хоста (только для пути Jupiter)"
        if: ${{ github.event.inputs.via_jupiter == '1' }}
        run: |
          set -e
          ssh -n $SSH_OPTS root@$TARGET_HOST "sudo -n -u bot /home/bot/robinhood-chain-alpha/venv/bin/pip install -q solders && /home/bot/robinhood-chain-alpha/venv/bin/python -c 'import solders; print(\"solders\", solders.__doc__ is not None)'"

      - name: "ГЕЙТ: каталог состояния принадлежит службе, а не root"
        run: |
          set -e
          # Шаги деплоя идут от root, и всё, что они создают в каталоге
          # состояния, остаётся root-овым -- служба от bot потом писать
          # туда не может. Так уже потерялся весь учёт кредитов детектора:
          # каталог helius_usage создал --check-only от root.
          ssh -n $SSH_OPTS root@$TARGET_HOST "
            set -e
            chown -R bot:bot $STATE_DIR
            find $STATE_DIR ! -user bot -print | head -5
            sudo -n -u bot test -w $STATE_DIR || { echo 'СБОЙ: bot не может писать в $STATE_DIR'; exit 1; }
            echo 'каталог состояния пишется службой'
          "

      - name: "systemd-юнит с ужесточением"
        run: |
          {
            echo '[Unit]'
            echo 'Description=Bloom sell guard (dry-run by default)'
            echo 'After=network-online.target'
            echo 'Wants=network-online.target'
            echo ""
            echo '[Service]'
            echo 'Type=simple'
            echo 'User=bot'
            echo 'Group=bot'
            echo 'WorkingDirectory=/home/bot/bloom_executor'
            echo 'EnvironmentFile=/etc/bloom-executor/env'
            echo 'ExecStart=/home/bot/robinhood-chain-alpha/venv/bin/python -u /home/bot/bloom_executor/bloom_seller.py'
            echo 'Restart=always'
            echo 'RestartSec=5'
            echo 'StandardOutput=journal'
            echo 'StandardError=journal'
            echo 'NoNewPrivileges=true'
            echo 'PrivateTmp=true'
            echo 'ProtectSystem=strict'
            echo 'ProtectHome=read-only'
            echo 'ReadWritePaths=/home/bot/bloom_executor_live_data'
            echo 'ProtectKernelTunables=true'
            echo 'ProtectControlGroups=true'
            echo 'RestrictSUIDSGID=true'
            echo 'LockPersonality=true'
            echo 'MemoryMax=512M'
            echo 'TasksMax=64'
            echo ""
            echo '[Install]'
            echo 'WantedBy=multi-user.target'
          } | ssh $SSH_OPTS root@$TARGET_HOST "cat > /etc/systemd/system/$SVC.service"
          ssh -n $SSH_OPTS root@$TARGET_HOST "systemctl daemon-reload && echo 'юнит записан'"

      - name: "logrotate"
        run: |
          {
            echo '/home/bot/bloom_executor_live_data/*.jsonl {'
            echo '  daily'
            echo '  rotate 14'
            echo '  compress'
            echo '  missingok'
            echo '  notifempty'
            echo '  copytruncate'
            echo '}'
          } | ssh $SSH_OPTS root@$TARGET_HOST "cat > /etc/logrotate.d/$SVC"

      - name: "ГЕЙТ: рубильник читается ОТ ПОЛЬЗОВАТЕЛЯ СЛУЖБЫ, а не от root"
        run: |
          set -e
          # Проверка от root бесполезна: первый живой прогон детектора
          # встал на PermissionError именно потому, что деплой спрашивал
          # root-а, а служба работает от bot. Спрашиваем того, кто работает.
          OUT=$(ssh -n $SSH_OPTS root@$TARGET_HOST "
            set -a; . $ENV_DIR/env; set +a
            sudo -n -u bot env BLOOM_STATE_DIR=\"\$BLOOM_STATE_DIR\" \
                 BLOOM_KILL_FILE=\"\$BLOOM_KILL_FILE\" \
                 BLOOM_KILL_SELL_FILE=\"\$BLOOM_KILL_SELL_FILE\" \
                 PYTHONPATH=$CODE_DIR \
                 /home/bot/robinhood-chain-alpha/venv/bin/python -c 'import bloom_exec_state as S; s=S.ExecState(); d,p=s.kill_readable(); print((\"ДОСТУПЕН\" if d else \"НЕДОСТУПЕН\"), p); import sys; sys.exit(0 if d else 1)'
          ") || { echo "ГЕЙТ НЕ ПРОЙДЕН: $OUT"; exit 1; }
          echo "рубильник от имени bot: $OUT"

      - name: "ГЕЙТ: открытых позиций нет -- только тогда перезапуск"
        if: ${{ github.event.inputs.enable_service == 'yes' }}
        run: |
          set -e
          # PYTHONPATH вместо sys.path.insert: иначе внутри команды ssh
          # пришлось бы вкладывать кавычки в кавычки и гейт молча ломался бы.
          OUT=$(ssh -n $SSH_OPTS root@$TARGET_HOST "set -a; . $ENV_DIR/env; set +a; PYTHONPATH=$CODE_DIR /home/bot/robinhood-chain-alpha/venv/bin/python -c 'from bloom_exec_state import ExecState; p=ExecState().open_positions(); print(len(p), sum(1 for x in p if x.get(\"mode\")==\"live-test\"), sum(1 for x in p if x.get(\"lane\")))'" || echo "ОШИБКА ОШИБКА")
          OPEN=$(echo "$OUT" | awk "{print \$1}")
          LT=$(echo "$OUT" | awk "{print \$2}")
          LANE=$(echo "$OUT" | awk "{print \$3}")
          echo "открытых позиций: $OPEN, из них live-test: $LT, полосы: $LANE"
          # Непрочитанное состояние -- это ЗАПРЕТ, а не исключение. Без этой
          # проверки сбой ssh давал "ОШИБКА ОШИБКА", числа совпадали, и
          # исключение для стенда срабатывало на неизвестном состоянии.
          case "$OPEN" in ''|*[!0-9]*) echo "перезапуск ОТМЕНЁН: состояние позиций не прочитано ($OUT)"; exit 1;; esac
          case "$LT" in ''|*[!0-9]*) echo "перезапуск ОТМЕНЁН: состояние позиций не прочитано ($OUT)"; exit 1;; esac
          case "$LANE" in ''|*[!0-9]*) echo "перезапуск ОТМЕНЁН: состояние позиций не прочитано ($OUT)"; exit 1;; esac
          if [ "$OPEN" = "0" ]; then
            echo "гейт пройден: открытых позиций нет"
          elif [ "${{ github.event.inputs.allow_live_test_restart }}" = "yes" ] \
                && [ -n "$LT" ] && [ "$OPEN" = "$LT" ]; then
            # Исключение разрешено владельцем ПРЯМО и только для стенда:
            # позиция стенда стоит открытой именно потому, что сторож её не
            # продал, и ждать её закрытия -- значит не ставить правку,
            # которая её и закрывает. Боевая позиция таким исключением не
            # покрывается: там перезапуск ждёт закрытия.
            echo "гейт: исключение для стенда -- все $OPEN позиций в режиме live-test"
          elif [ "${{ github.event.inputs.allow_lane_restart }}" = "yes" ] \
                && [ "$LANE" != "0" ] && [ "$OPEN" = "$LANE" ]; then
            # Исключение разрешено владельцем 25.09 для ПОЛОСЫ: её позиции
            # стоят открытыми именно потому, что сторож их не продал, и ждать
            # их закрытия значит не ставить правку, которая их и продаёт.
            # Рамка та же, что у стенда: исключение работает ТОЛЬКО когда
            # открыты одни позиции полосы. Боевая покупка Bloom среди них --
            # и перезапуск снова ждёт закрытия.
            echo "гейт: исключение для полосы -- все $OPEN открытых позиций её"
          else
            echo "перезапуск ОТМЕНЁН: открытых позиций $OPEN (live-test $LT)"
            exit 1
          fi

      - name: "НУЛЬ ПОЗИЦИЙ перед перезапуском ПРОДАВЦА"
        if: ${{ github.event.inputs.enable_service == 'yes' }}
        run: |
          set -e
          set -o pipefail
          # ЗАЧЕМ, И ПОЧЕМУ ЗДЕСЬ ЭТО ВАЖНЕЕ, ЧЕМ У ДЕТЕКТОРА. bloom-seller --
          # это та служба, которая ЗАКРЫВАЕТ наши позиции. Перезапуск при
          # открытой позиции оставляет её на время перезапуска без продавца
          # вовсе: держание считается по слотам, и пропущенное окно продажи
          # стоит денег прямо, а не вероятностно. Охраны в этом прогоне не было
          # ни одной, хотя в шести других прогонах она стоит.
          #
          # ОХРАНА ТА ЖЕ САМАЯ, не своя копия: расходятся именно копии. Она
          # требует нуля открытых и нуля зависших ПО ВСЕМ группам, признак
          # жизни детектора не старше 10 минут и снятый рубильник продаж.
          #
          # ОТДЕЛЬНЫМ ШАГОМ ВПЛОТНУЮ К ПЕРЕЗАПУСКУ: между постановкой прогона в
          # очередь и перезапуском проходят минуты, за них позиция открывается.
          ssh $SSH_OPTS root@$TARGET_HOST "cat > /tmp/pered_perezapuskom_sluzhby.py" < deploy/checks/pered_perezapuskom_sluzhby.py
          ssh -n $SSH_OPTS root@$TARGET_HOST "VTOROE_MNENIE_PERVYJ_DEPLOJ='${{ inputs.vtoroe_mnenie_pervyj_deploj }}' ZAVISSHIE_FANTOMY='${{ inputs.zavisshie_fantomy }}' python3 /tmp/pered_perezapuskom_sluzhby.py"
          ssh -n $SSH_OPTS root@$TARGET_HOST "rm -f /tmp/pered_perezapuskom_sluzhby.py"

      - name: "Запуск и ЖЁСТКАЯ проверка, что поднялось"
        if: ${{ github.event.inputs.enable_service == 'yes' }}
        run: |
          set -e
          # Момент перезапуска берётся НА ХОСТЕ: часы бегунка и часы хоста --
          # разные часы. Признак жизни ниже обязан быть НОВЕЕ этого момента.
          echo "RESTART_TS=$(ssh -n $SSH_OPTS root@$TARGET_HOST 'date +%s')" >> "$GITHUB_ENV"
          ssh -n $SSH_OPTS root@$TARGET_HOST "systemctl enable $SVC && systemctl restart $SVC"
          sleep 8
          ssh -n $SSH_OPTS root@$TARGET_HOST "systemctl is-active --quiet $SVC" || {
            echo "СБОЙ: служба не активна"; ssh -n $SSH_OPTS root@$TARGET_HOST "journalctl -u $SVC -n 60 --no-pager"; exit 1; }
          RESTARTS=$(ssh -n $SSH_OPTS root@$TARGET_HOST "systemctl show -p NRestarts --value $SVC")
          echo "NRestarts=$RESTARTS"
          ssh -n $SSH_OPTS root@$TARGET_HOST "journalctl -u $SVC -n 30 --no-pager"

      - name: "Проверка признака жизни и --check-only (ничего не продаёт)"
        if: ${{ github.event.inputs.enable_service == 'yes' }}
        run: |
          set -e
          sleep 20
          # Отсутствующий или старый признак жизни -- это СБОЙ, а не заметка.
          # Раньше шаг печатал "признака жизни ещё нет" и шёл дальше: деплой
          # считался удачным, хотя служба могла не подняться.
          ssh -n $SSH_OPTS root@$TARGET_HOST "test -s $STATE_DIR/seller_heartbeat.json" || {
            echo "СБОЙ: признака жизни продавца нет"
            ssh -n $SSH_OPTS root@$TARGET_HOST "journalctl -u $SVC -n 80 --no-pager"
            exit 1; }
          HEARTBEAT_TS=$(ssh -n $SSH_OPTS root@$TARGET_HOST "stat -c %Y $STATE_DIR/seller_heartbeat.json")
          if [ "$HEARTBEAT_TS" -lt "$RESTART_TS" ]; then
            echo "СБОЙ: признак жизни продавца старше перезапуска -- служба его не обновила"
            ssh -n $SSH_OPTS root@$TARGET_HOST "journalctl -u $SVC -n 80 --no-pager"
            exit 1
          fi
          echo "признак жизни новее перезапуска на $((HEARTBEAT_TS - RESTART_TS)) с"
          ssh -n $SSH_OPTS root@$TARGET_HOST "
            set -a; . $ENV_DIR/env; set +a
            cat $STATE_DIR/seller_heartbeat.json
            /home/bot/robinhood-chain-alpha/venv/bin/python $CODE_DIR/bloom_seller.py --check-only
          " 2>&1 | tail -40 | tee -a data/bloom_seller_deploy.txt

      - name: "Коммит отчёта"
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -f data/bloom_seller_deploy.txt ] && git add data/bloom_seller_deploy.txt
          git diff --cached --quiet && { echo "нечего коммитить"; exit 0; }
          git commit -m "Bloom: деплой сторожа продаж, отчёт [automated]"
          for i in 1 2 3 4 5; do
            git push origin HEAD:claude/nifty-sagan-r0polg && exit 0
            git pull --rebase -X theirs origin claude/nifty-sagan-r0polg
            sleep 3
          done
          exit 1
