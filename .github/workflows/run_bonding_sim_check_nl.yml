name: "Кривая pump.fun: примет ли программа нашу сборку (симуляция, без отправки)"

# ЗАЧЕМ. Сборщик кривой (I.2б) сверен на настоящих транзакциях байт в байт, но
# это проверка нашей арифметики. Ответ на вопрос "примет ли САМА ПРОГРАММА нашу
# покупку" даёт только цепь -- simulateTransaction: та же транзакция, тот же
# кошелёк, подпись не проверяется, ничего не отправляется.
#
# Свежие сигналы кривой берём потоком из живого журнала решений на хосте (там
# детектор отказывается по типу пула и пишет подпись источника, минт и адрес).
# Журнал в память не читается: grep -F под nice, наружу только хвост.
#
# ЗАДАЧА pump_sborka (слово владельца 09.10, п.2). Оснастка Code-3
# (deploy/checks/pump_sborka_simulyaciya.py) судит сборку ТЕМ ЖЕ способом, что
# и этот прогон -- simulateTransaction без отправки, -- только по девяти
# разновидностям IDL сразу. Она живёт на ветке claude/stroiteli вместе со
# сборщиком, закреплённым IDL и образцами, и доезжает сюда git-ом из той ветки.
#
# ПОЧЕМУ ЗДЕСЬ, А НЕ run_razovyj_shablon_nl.yml, КАК БЫЛО ЗАДУМАНО. Тот файл
# лежит ТОЛЬКО на claude/stroiteli, на ветке по умолчанию его нет, поэтому
# GitHub не регистрирует прогон вовсе: dispatch по имени отвечает 404 (проверено
# 09.10). Положить его на ветку по умолчанию я не могу -- правка общей ветки
# закрыта. Этот прогон на ветке по умолчанию есть, значит запускается с
# ref=claude/nifty-sagan-r0polg и берёт МОЮ версию файла.
#
# УЗЕЛ -- НЕ ХОСТОВЫЙ, И ЭТО НЕ ОБХОД. Цепь здесь и так открыта ключом
# secrets.HELIUS_API: прогон всегда считал симуляцию на облачном бегунке, а к
# хосту ходил только за журналом. Оснастка Code-3 берёт узел ТОЛЬКО из
# BLOOM_TREKKER_RPC (в argv узла нет вовсе -- ключ в списке процессов виден
# всем), поэтому URL собирается в окружении шага.
on:
  workflow_dispatch:
    inputs:
      zadacha:
        description: "'bonding' | 'pump_sborka' | 'pereezdy' | 'krug_sborki' | 'otkazy_puti' -- отказанные сигналы денежным путём | 'chem_sobrana' -- чем собраны НАШИ транзакции | 'versii_razbora' -- ОДНИ сигналы ДВУМЯ версиями разбора (только чтение)"
        required: false
        default: "bonding"
      sravnit:
        description: "versii_razbora: подписи СИГНАЛОВ источника через запятую -- прогнать разбор двумя версиями"
        required: false
        default: ""
      ref_staryj:
        description: "versii_razbora: коммит СТАРОЙ версии c2_swap_build (по умолчанию ночная, до правок под запуски)"
        required: false
        default: "e222b934^"
      chitat:
        description: "chem_sobrana: подписи НАШИХ транзакций через запятую -- чем они собраны (только чтение, без симуляции)"
        required: false
        default: ""
      istochnik:
        description: "otkazy_puti: адрес источника, чьи отказанные сигналы прогнать"
        required: false
        default: "4vw54BmAogeRV3vPKWyFet5yf8DTLcREzdSzx4rw9Ud9"
      chasov:
        description: "otkazy_puti: окно в часах"
        required: false
        default: "24"
      podpisi:
        description: "otkazy_puti: подписи из журнала решений, через запятую (добавляются к найденным с цепи)"
        required: false
        default: ""
      cel:
        description: "pump_sborka: сколько образцов на вариант считать целью"
        required: false
        default: "20"
      cel_t2022:
        description: "pump_sborka: сколько образцов Token-2022 ждать у buy_exact_quote_in_v3 и sell_v3"
        required: false
        default: "10"
      predel_tx:
        description: "pump_sborka: предел прочитанных транзакций"
        required: false
        default: "150"
      pauza:
        description: "pump_sborka: пауза между вызовами узла, с"
        required: false
        default: "0.4"
      limit:
        description: "сколько последних сигналов кривой проверить"
        required: false
        default: "10"
      sol:
        description: "трата на нашу покупку, SOL"
        required: false
        default: "0.01"
      wallet:
        description: "кошелёк (пусто -- исполнитель)"
        required: false
        default: ""
      rotated:
        description: "'yes' -- искать и в ротированных .gz"
        required: false
        default: "no"

concurrency:
  group: bonding-sim-check
  cancel-in-progress: false

env:
  HOST: 45.59.170.76
  STATE_DIR: /home/bot/bloom_executor_live_data
  CURVE: 6EF8rrecthR5Dkzon8Nwu78hRvfCKubJ14M5uBEwF6P

jobs:
  sim:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/nifty-sagan-r0polg

      - name: "Самопроверки сборки (без них проверять нечего)"
        run: |
          set -e
          python3 -m venv "$RUNNER_TEMP/bs_venv"
          "$RUNNER_TEMP/bs_venv/bin/pip" install -q requests solders
          echo "PY=$RUNNER_TEMP/bs_venv/bin/python" >> "$GITHUB_ENV"
          case "${{ inputs.zadacha }}" in
            pump_sborka|pereezdy|krug_sborki|otkazy_puti|chem_sobrana|versii_razbora)
              echo "задача ${{ inputs.zadacha }}: свои самопроверки ниже, после доставки"
              exit 0 ;;
          esac
          "$RUNNER_TEMP/bs_venv/bin/python" analysis/c2_swap_build.py --self-test | tail -6

      # ОСНАСТКА CODE-3 -- ИЗ ЕГО ВЕТКИ, А НЕ КОПИЕЙ В МОЮ. Копия разошлась бы
      # со сборщиком при первой же его правке; git-ом видно, какой именно
      # коммит проверялся, и он печатается в отчёт.
      - name: "pump_sborka: привезти оснастку Code-3 из claude/stroiteli"
        if: ${{ inputs.zadacha == 'pump_sborka' }}
        run: |
          set -e
          set -o pipefail
          git fetch --depth=1 origin claude/stroiteli
          echo "ветка оснастки Code-3: $(git rev-parse --short FETCH_HEAD)"
          # СБОРЩИК, ОСНАСТКА И IDL -- УЖЕ МОИ, И ИХ НЕЛЬЗЯ ЗАТИРАТЬ ВЕТКОЙ
          # CODE-3 (правка 09.10, п.1 владельца: "Token-2022 правь сам при
          # врезке"). В моих копиях снято значение по умолчанию у
          # base_token_program и добавлен счёт образцов Token-2022; выкачка из
          # claude/stroiteli вернула бы молчаливый классический Token.
          # Оттуда берутся ТОЛЬКО образцы и трекер, которых у меня нет.
          git checkout FETCH_HEAD -- \
            analysis/c3_kapital_trekker.py \
            data/c2_pool_samples data/c3_usdc_noga data/samples \
            data/bloom_regression_txs.json data/bloom_tx_raw.json \
            data/c2_curve_variant_samples.json data/nogi_shablony.json \
            data/obrazcy_vidov_instrukciy.json data/solana_raw_tx_dump_vyvod.json
          echo "сборщик и оснастка -- из моей ветки, с правкой Token-2022"
          ls -1 data/idl | sed 's/^/  idl: /'
          # САМОПРОВЕРКИ ОБЕИХ ЧАСТЕЙ -- ДО ЛЮБОГО ВЫЗОВА УЗЛА. Объявлено
          # Code-3: сборщик 24 из 24, оснастка 23 из 23.
          PYTHONPATH=analysis $PY analysis/c3_pump_sborka.py --self-test | tail -2
          PYTHONPATH=analysis $PY deploy/checks/pump_sborka_simulyaciya.py --self-test | tail -2
          # СУХОЙ ПРОГОН: ноль сетевых вызовов, сверяет число образцов.
          PYTHONPATH=analysis $PY deploy/checks/pump_sborka_simulyaciya.py --dry-run | tail -20

      - name: "pump_sborka: живой прогон симуляции узлом"
        if: ${{ inputs.zadacha == 'pump_sborka' }}
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API }}
        run: |
          set -e
          set -o pipefail
          [ -n "$HELIUS_API_KEY" ] || { echo "СБОЙ: HELIUS_API не задан"; exit 1; }
          # УЗЕЛ ТОЛЬКО ОКРУЖЕНИЕМ, в argv его нет: так велит оснастка, и у неё
          # на это своя проверка. Ключ в вывод не попадает -- оснастка затирает.
          export BLOOM_TREKKER_RPC="https://mainnet.helius-rpc.com/?api-key=$HELIUS_API_KEY"
          # ВЫХОД 1 У ОСНАСТКИ -- ЭТО ОТВЕТ, А НЕ ПОЛОМКА ПРОГОНА: так она
          # говорит "недобор образцов" или "близнецы разошлись", и ровно эту
          # таблицу надо увидеть. Поэтому код ловится, а не роняет шаг.
          set +e
          PYTHONPATH=analysis $PY deploy/checks/pump_sborka_simulyaciya.py --live \
            --cel "${{ inputs.cel }}" --predel-tx "${{ inputs.predel_tx }}" \
            --pauza "${{ inputs.pauza }}" --cel-t2022 "${{ inputs.cel_t2022 }}" \
            > /tmp/pump_sborka.txt 2>&1
          RC=$?
          set -e
          tail -80 /tmp/pump_sborka.txt
          echo "код выхода оснастки: $RC (0 -- все девять вариантов набрали цель и сошлись)"

      # ПЕРЕЕЗДЫ: КТО ИХ ПОДПИСЫВАЕТ (слово владельца 09.10, п.1, "да на твоё
      # измерение"). Подписка детектора должна идти на ОДИН счёт -- авторитет, --
      # а его адрес в репозитории нигде не записан. Здесь он берётся по цепи, из
      # настоящих транзакций переезда. Кандидаты -- минты, у которых в сутках
      # архива Code-2 есть и кривая, и Pump AMM: другого пути между программами
      # у токена нет. Только чтение.
      # КРУГ НАШЕЙ СБОРКИ (слово штаба 09.10, п.2). Близнецы говорят "наша
      # сборка неотличима от чужой", и этого мало: часть "прошедших" v3 -- это
      # ОБА близнеца, упавшие Custom 1 у программы токена. Здесь проверка
      # прямая: от НАШЕГО адреса, нашими деньгами в симуляции, три инструкции
      # одной транзакцией, и успех -- это err=null И баланс токена после
      # покупки строго больше нуля.
      - name: "krug_sborki: круг нашей сборки узлом"
        if: ${{ inputs.zadacha == 'krug_sborki' }}
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API }}
        run: |
          set -e
          set -o pipefail
          [ -n "$HELIUS_API_KEY" ] || { echo "СБОЙ: HELIUS_API не задан"; exit 1; }
          PYTHONPATH=analysis $PY analysis/c3_pump_sborka.py --self-test | tail -2
          PYTHONPATH=analysis $PY deploy/checks/krug_sborki_simulyaciya.py --self-test | tail -2
          export BLOOM_TREKKER_RPC="https://mainnet.helius-rpc.com/?api-key=$HELIUS_API_KEY"
          set +e
          PYTHONPATH=analysis $PY deploy/checks/krug_sborki_simulyaciya.py --live \
            --skolko 5 --out /tmp/krug.json > /tmp/krug.txt 2>&1
          RC=$?
          set -e
          tail -60 /tmp/krug.txt
          echo "код выхода: $RC (0 -- круг прошёл хотя бы на части минтов и без красных)"

      - name: "otkazy_puti: отказанные сигналы -- денежным путём до симуляции"
        if: ${{ inputs.zadacha == 'otkazy_puti' }}
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API }}
        run: |
          set -e
          set -o pipefail
          [ -n "$HELIUS_API_KEY" ] || { echo "СБОЙ: HELIUS_API не задан"; exit 1; }
          PYTHONPATH=analysis $PY analysis/c3_pump_sborka.py --self-test | tail -2
          PYTHONPATH=analysis $PY deploy/checks/krug_sborki_simulyaciya.py --self-test | tail -2
          export BLOOM_TREKKER_RPC="https://mainnet.helius-rpc.com/?api-key=$HELIUS_API_KEY"
          set +e
          PYTHONPATH=analysis $PY deploy/checks/krug_sborki_simulyaciya.py \
            --istochnik "${{ inputs.istochnik }}" --chasov "${{ inputs.chasov }}" \
            --podpisi "${{ inputs.podpisi }}" \
            --out /tmp/otkazy.json > /tmp/otkazy.txt 2>&1
          RC=$?
          set -e
          tail -80 /tmp/otkazy.txt
          echo "код выхода: $RC (0 -- все отказанные сигналы прошли денежным путём)"
          # КОД ЗАПОМИНАЕТСЯ, А НЕ ТЕРЯЕТСЯ. Прогон 37957981526 был зелёным при
          # коде 2 "нужен --live" и нуле вызовов узла -- ровно тихая зелень.
          # Отчёт коммитится шагом ниже, а красным прогон помечается ПОСЛЕ него.
          echo "OTKAZY_RC=$RC" >> "$GITHUB_ENV"

      - name: "chem_sobrana: чем собраны НАШИ транзакции (только чтение)"
        if: ${{ inputs.zadacha == 'chem_sobrana' }}
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API }}
        run: |
          set -e
          set -o pipefail
          [ -n "$HELIUS_API_KEY" ] || { echo "СБОЙ: HELIUS_API не задан"; exit 1; }
          [ -n "${{ inputs.chitat }}" ] || { echo "СБОЙ: нужны подписи во входе chitat"; exit 1; }
          PYTHONPATH=analysis $PY deploy/checks/krug_sborki_simulyaciya.py --self-test | tail -2
          export BLOOM_TREKKER_RPC="https://mainnet.helius-rpc.com/?api-key=$HELIUS_API_KEY"
          PYTHONPATH=analysis $PY deploy/checks/krug_sborki_simulyaciya.py \
            --chitat "${{ inputs.chitat }}" --out /tmp/chem.json | tail -80

      - name: "versii_razbora: одни сигналы -- двумя версиями разбора (только чтение)"
        if: ${{ inputs.zadacha == 'versii_razbora' }}
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API }}
        run: |
          set -e
          set -o pipefail
          [ -n "$HELIUS_API_KEY" ] || { echo "СБОЙ: HELIUS_API не задан"; exit 1; }
          [ -n "${{ inputs.sravnit }}" ] || { echo "СБОЙ: нужны подписи во входе sravnit"; exit 1; }
          # САМОПРОВЕРКА ДО УЗЛА: падает она -- сравнивать нечем.
          PYTHONPATH=analysis $PY deploy/checks/krug_sborki_simulyaciya.py --self-test | tail -2
          export BLOOM_TREKKER_RPC="https://mainnet.helius-rpc.com/?api-key=$HELIUS_API_KEY"
          PYTHONPATH=analysis $PY deploy/checks/krug_sborki_simulyaciya.py \
            --sravnit-versii "${{ inputs.sravnit }}" \
            --ref-staryj "${{ inputs.ref_staryj }}" \
            --out data/versii_razbora.json | tail -120

      - name: "pereezdy: архив Code-2 и сборщик Code-3"
        if: ${{ inputs.zadacha == 'pereezdy' }}
        run: |
          set -e
          set -o pipefail
          git fetch --depth=1 origin claude/stroiteli
          echo "оснастка сборки: $(git rev-parse --short FETCH_HEAD)"
          git checkout FETCH_HEAD -- analysis/c3_pump_sborka.py data/idl
          git fetch --depth=1 origin claude/podbivka
          echo "архив Code-2: $(git rev-parse --short FETCH_HEAD)"
          # СУТОЧНЫЙ ФАЙЛ -- САМЫЙ СВЕЖИЙ ИЗ ЕСТЬ, и его имя печатается: по
          # другому файлу числа были бы другими, и молчать об этом нельзя.
          FAJL=$(git ls-tree --name-only FETCH_HEAD data/podbivka/arhiv_den/ \
                 | grep -E 'konv_.*json\.gz$' | sort | tail -1)
          [ -n "$FAJL" ] || { echo "СБОЙ: в архиве нет konv_*.json.gz"; exit 1; }
          echo "беру сутки: $FAJL"
          git checkout FETCH_HEAD -- "$FAJL"
          echo "ARHIV=$FAJL" >> "$GITHUB_ENV"
          PYTHONPATH=analysis $PY deploy/checks/pereezdy_po_cepi.py --self-test | tail -2

      - name: "pereezdy: по цепи -- подписант, байты, create_pool"
        if: ${{ inputs.zadacha == 'pereezdy' }}
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API }}
        run: |
          set -e
          [ -n "$HELIUS_API_KEY" ] || { echo "СБОЙ: HELIUS_API не задан"; exit 1; }
          export BLOOM_TREKKER_RPC="https://mainnet.helius-rpc.com/?api-key=$HELIUS_API_KEY"
          set +e
          PYTHONPATH=analysis $PY deploy/checks/pereezdy_po_cepi.py --live \
            --arhiv "$ARHIV" --skolko 30 --podpisey 15 --pauza 0.12 \
            --out /tmp/pereezdy.json > /tmp/pereezdy.txt 2>&1
          RC=$?
          set -e
          tail -40 /tmp/pereezdy.txt
          echo "код выхода: $RC"

      - name: "SSH key"
        if: ${{ inputs.zadacha != 'pump_sborka' && inputs.zadacha != 'pereezdy' && inputs.zadacha != 'krug_sborki' && inputs.zadacha != 'otkazy_puti' && inputs.zadacha != 'chem_sobrana' && inputs.zadacha != 'versii_razbora' }}
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -e
          [ -n "$VPS_SSH_KEY" ] || { echo "СБОЙ: VPS_SSH_KEY не задан"; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          echo "SSH_OPTS=-i $HOME/.ssh/vps_key -o ConnectTimeout=20 -o BatchMode=yes -o StrictHostKeyChecking=accept-new" >> "$GITHUB_ENV"

      - name: "Свежие сигналы кривой из живого журнала (потоком)"
        if: ${{ inputs.zadacha != 'pump_sborka' && inputs.zadacha != 'pereezdy' && inputs.zadacha != 'krug_sborki' && inputs.zadacha != 'otkazy_puti' && inputs.zadacha != 'chem_sobrana' && inputs.zadacha != 'versii_razbora' }}
        run: |
          set -e
          set -o pipefail
          mkdir -p /tmp/bsim
          ROT=""
          [ "${{ inputs.rotated }}" = "yes" ] && ROT="yes"
          ssh -n $SSH_OPTS root@"$HOST" \
            "ION=\$(command -v ionice >/dev/null 2>&1 && echo 'ionice -c3' || true); \
             { nice -n 15 \$ION grep -F -e $CURVE $STATE_DIR/decisions.jsonl; \
               if [ -n \"$ROT\" ]; then \
                 for G in $STATE_DIR/decisions.jsonl.*.gz; do [ -e \"\$G\" ] || continue; \
                   nice -n 15 \$ION zgrep -F -e $CURVE \"\$G\" || true; done; \
               fi; } | tail -n 400" \
            > /tmp/bsim/curve.jsonl && RC=0 || RC=$?
          echo "выборка завершилась кодом $RC"
          wc -l < /tmp/bsim/curve.jsonl

      - name: "Симуляция нашей покупки на кривой"
        if: ${{ inputs.zadacha != 'pump_sborka' && inputs.zadacha != 'pereezdy' && inputs.zadacha != 'krug_sborki' && inputs.zadacha != 'otkazy_puti' && inputs.zadacha != 'chem_sobrana' && inputs.zadacha != 'versii_razbora' }}
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API }}
        run: |
          set -e
          [ -n "$HELIUS_API_KEY" ] || { echo "СБОЙ: HELIUS_API не задан"; exit 1; }
          WALLET_ARG=""
          if [ -n "${{ inputs.wallet }}" ]; then WALLET_ARG="--wallet ${{ inputs.wallet }}"; fi
          $PY analysis/bonding_sim_check.py \
            --decisions /tmp/bsim/curve.jsonl \
            --limit "${{ inputs.limit }}" \
            --sol "${{ inputs.sol }}" $WALLET_ARG \
            --save-samples data/c2_curve_variant_samples.json

      - name: "Коммит"
        if: always()
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ "${{ inputs.zadacha }}" = "pump_sborka" ]; then
            # ОТЧЁТ ОСНАСТКИ -- В ВЕТКУ, а привезённые из claude/stroiteli
            # файлы НЕ коммитим: их хозяин Code-3, копия тут же разошлась бы.
            mkdir -p data
            cp /tmp/pump_sborka.txt data/pump_sborka_simulyaciya.txt || true
            git checkout -- analysis data 2>/dev/null || true
            git clean -fd analysis data 2>/dev/null || true
            cp /tmp/pump_sborka.txt data/pump_sborka_simulyaciya.txt || true
            git add data/pump_sborka_simulyaciya.txt || true
          fi
          if [ "${{ inputs.zadacha }}" = "pereezdy" ]; then
            git checkout -- analysis data 2>/dev/null || true
