name: "Кривая pump.fun: примет ли программа нашу сборку (симуляция, без отправки)"

# ЗАЧЕМ. Сборщик кривой (I.2б) сверен на настоящих транзакциях байт в байт, но
# это проверка нашей арифметики. Ответ на вопрос "примет ли САМА ПРОГРАММА нашу
# покупку" даёт только цепь -- simulateTransaction: та же транзакция, тот же
# кошелёк, подпись не проверяется, ничего не отправляется.
#
# Свежие сигналы кривой берём потоком из живого журнала решений на хосте (там
# детектор отказывается по типу пула и пишет подпись источника, минт и адрес).
# Журнал в память не читается: grep -F под nice, наружу только хвост.
#
# ЗАДАЧА pump_sborka (слово владельца 09.10, п.2). Оснастка Code-3
# (deploy/checks/pump_sborka_simulyaciya.py) судит сборку ТЕМ ЖЕ способом, что
# и этот прогон -- simulateTransaction без отправки, -- только по девяти
# разновидностям IDL сразу. Она живёт на ветке claude/stroiteli вместе со
# сборщиком, закреплённым IDL и образцами, и доезжает сюда git-ом из той ветки.
#
# ПОЧЕМУ ЗДЕСЬ, А НЕ run_razovyj_shablon_nl.yml, КАК БЫЛО ЗАДУМАНО. Тот файл
# лежит ТОЛЬКО на claude/stroiteli, на ветке по умолчанию его нет, поэтому
# GitHub не регистрирует прогон вовсе: dispatch по имени отвечает 404 (проверено
# 09.10). Положить его на ветку по умолчанию я не могу -- правка общей ветки
# закрыта. Этот прогон на ветке по умолчанию есть, значит запускается с
# ref=claude/nifty-sagan-r0polg и берёт МОЮ версию файла.
#
# УЗЕЛ -- НЕ ХОСТОВЫЙ, И ЭТО НЕ ОБХОД. Цепь здесь и так открыта ключом
# secrets.HELIUS_API: прогон всегда считал симуляцию на облачном бегунке, а к
# хосту ходил только за журналом. Оснастка Code-3 берёт узел ТОЛЬКО из
# BLOOM_TREKKER_RPC (в argv узла нет вовсе -- ключ в списке процессов виден
# всем), поэтому URL собирается в окружении шага.
# ВХОДОВ НЕ БОЛЬШЕ 25. Это предел GitHub на workflow_dispatch, и файл уже на
# нём: 26-й вход не ломается при разборе YAML, но прогон перестаёт запускаться
# целиком с ошибкой "you may only define up to 25 inputs". Новой задаче входы
# либо переиспользуются, либо её число пишется в шаге.
on:
  workflow_dispatch:
    inputs:
      zadacha:
        description: "'bonding' | 'pump_sborka' | 'pereezdy' | 'krug_sborki' | 'otkazy_puti' -- отказанные сигналы денежным путём | 'chem_sobrana' -- чем собраны НАШИ транзакции | 'versii_razbora' -- ОДНИ сигналы ДВУМЯ версиями разбора и ВРЕМЯ разбора | 'mayhem_krivoj' -- is_mayhem_mode и котировка по счёту кривой | 'mesta_v_bloke' -- места в блоках источника и наших по АРХИВНОМУ узлу (только чтение) | 'chaevye_zhivy' -- идут ли чужие чаевые на счета отправителя и когда шли последний раз (только чтение) | 'blocksubscribe' -- даёт ли наш план Helius подписку на блоки (только чтение) | 'golova' -- первые N покупок того же минта ПОСЛЕ источника в его блоке: плательщик, площадка, чаевые, размер (только чтение) | 'platelshchiki' -- одна таблица по верхним плательщикам головы: доля в блоке источника, цена CU с цепи, в скольких сделках раньше 100-й позиции (только чтение) | 'skorost_sborki' -- ТА ЖЕ полная сборка на четырёх машинах рядом (контейнер, NL-хост, AMS, Miami) + железо и соседи по ядрам (только чтение) | 'potoki' -- КТО из потоков процесса полосы жжёт процессор: имена и CPU за окно, чтением /proc на хосте (только чтение) | 'preprocessed' -- зонд «видеть раньше»: preprocessedSubscribe против обычного transactionSubscribe по адресу источника, рядом с торговлей; задача идемпотентна -- первый запуск поднимает зонд, следующие собирают его отчёт (денежный путь не трогается). Адрес берётся из входа istochnik, предел по времени -- из chasov"
        required: false
        default: "bonding"
      sravnit:
        description: "versii_razbora: подписи СИГНАЛОВ источника через запятую -- прогнать разбор двумя версиями"
        required: false
        default: ""
      ref_staryj:
        description: "versii_razbora: ПОЛНЫЙ sha (40 знаков) коммита СТАРОЙ версии c2_swap_build -- копия бегунка глубиной 1, sha^ и имена ветвей в ней не разворачиваются"
        required: false
        # НОЧНАЯ ВЕРСИЯ РАЗБОРА: родитель e222b934, то есть та, на которой
        # vol_4vw торговал 09.10 16:29Z -- 10.10 01:59Z. Полным sha, а не
        # "e222b934^": в копии глубиной 1 такой ref не разворачивается.
        default: "540a998b15b252b4efe1eb4636218cd782f60867"
      vygruzka:
        description: "mesta_v_bloke: путь к выгрузке сделок в data/ -- места в блоках берутся по её рядам"
        required: false
        default: "data/sdelki_polosy_2026-10-10_urs_1010.json"
      minty:
        description: "mayhem_krivoj: минты через запятую -- is_mayhem_mode и котировка по счёту кривой"
        required: false
        default: ""
      golov_skolko:
        description: "golova: сколько покупок головы брать на сделку (по умолчанию 30)"
        required: false
        default: "30"
      zamer_mashiny:
        description: "skorost_sborki: 'vse' или через запятую kontejner,nl,ams,miami"
        required: false
        default: "vse"
      zamer_povtorov:
        description: "skorost_sborki: сколько повторов сборки на машину (медиана из них)"
        required: false
        default: "31"
      verhnih:
        description: "platelshchiki: сколько верхних плательщиков по объёму"
        required: false
        default: "10"
      podpisej_pl:
        description: "platelshchiki: сколько их транзакций читать на цену CU (0 -- узел не читать)"
        required: false
        default: "4"
      golov_sdelok:
        description: "golova: взять только последние N сделок выгрузки (0 -- все)"
        required: false
        default: "0"
      otpravitel:
        description: "chaevye_zhivy: имя отправителя из реестра -- его счета чаевых берутся ИЗ РЕЕСТРА, а не из рук"
        required: false
        default: "blockrazor"
      rubezh_utc:
        description: "chaevye_zhivy: рубеж вида 2026-10-10T13:49:37Z -- сколько подписей счёта свежее него"
        required: false
        default: "2026-10-10T13:49:37Z"
      chitat:
        description: "chem_sobrana: подписи НАШИХ транзакций через запятую -- чем они собраны (только чтение, без симуляции)"
        required: false
        default: ""
      istochnik:
        description: "otkazy_puti: адрес источника, чьи отказанные сигналы прогнать"
        required: false
        default: "4vw54BmAogeRV3vPKWyFet5yf8DTLcREzdSzx4rw9Ud9"
      chasov:
        description: "otkazy_puti: окно в часах"
        required: false
        default: "24"
      podpisi:
        description: "otkazy_puti: подписи из журнала решений, через запятую (добавляются к найденным с цепи)"
        required: false
        default: ""
      cel:
        description: "pump_sborka: сколько образцов на вариант считать целью"
        required: false
        default: "20"
      cel_t2022:
        description: "pump_sborka: сколько образцов Token-2022 ждать у buy_exact_quote_in_v3 и sell_v3"
        required: false
        default: "10"
      predel_tx:
        description: "pump_sborka: предел прочитанных транзакций"
        required: false
        default: "150"
      pauza:
        description: "pump_sborka: пауза между вызовами узла, с"
        required: false
        default: "0.4"
      limit:
        description: "сколько последних сигналов кривой проверить"
        required: false
        default: "10"
      sol:
        description: "трата на нашу покупку, SOL"
        required: false
        default: "0.01"
      wallet:
        description: "кошелёк (пусто -- исполнитель)"
        required: false
        default: ""
      rotated:
        description: "'yes' -- искать и в ротированных .gz"
        required: false
        default: "no"

concurrency:
  group: bonding-sim-check
  cancel-in-progress: false

env:
  HOST: 45.59.170.76
  STATE_DIR: /home/bot/bloom_executor_live_data
  CURVE: 6EF8rrecthR5Dkzon8Nwu78hRvfCKubJ14M5uBEwF6P

jobs:
  sim:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/nifty-sagan-r0polg

      - name: "Самопроверки сборки (без них проверять нечего)"
        run: |
          set -e
          # set -o pipefail ОБЯЗАТЕЛЕН, А НЕ УКРАШЕНИЕ. Самопроверка идёт
          # через `| tail -N`, и без pipefail код возврата шага берётся у
          # tail, то есть ВСЕГДА 0: красная самопроверка не валила CI вовсе
          # (найдено проходом по откату 10.10). Проверено прогоном: при
          # нарочно сломанной проверке шаг теперь падает.
          set -o pipefail
          python3 -m venv "$RUNNER_TEMP/bs_venv"
          "$RUNNER_TEMP/bs_venv/bin/pip" install -q requests solders
          echo "PY=$RUNNER_TEMP/bs_venv/bin/python" >> "$GITHUB_ENV"
          case "${{ inputs.zadacha }}" in
            pump_sborka|pereezdy|krug_sborki|otkazy_puti|chem_sobrana|versii_razbora|mayhem_krivoj|mesta_v_bloke|chaevye_zhivy|blocksubscribe|golova|platelshchiki|skorost_sborki|potoki|preprocessed)
              echo "задача ${{ inputs.zadacha }}: свои самопроверки ниже, после доставки"
              exit 0 ;;
          esac
          "$RUNNER_TEMP/bs_venv/bin/python" analysis/c2_swap_build.py --self-test | tail -6

      # ОСНАСТКА CODE-3 -- ИЗ ЕГО ВЕТКИ, А НЕ КОПИЕЙ В МОЮ. Копия разошлась бы
      # со сборщиком при первой же его правке; git-ом видно, какой именно
      # коммит проверялся, и он печатается в отчёт.
      - name: "pump_sborka: привезти оснастку Code-3 из claude/stroiteli"
        if: ${{ inputs.zadacha == 'pump_sborka' }}
        run: |
          set -e
          set -o pipefail
          git fetch --depth=1 origin claude/stroiteli
          echo "ветка оснастки Code-3: $(git rev-parse --short FETCH_HEAD)"
          # СБОРЩИК, ОСНАСТКА И IDL -- УЖЕ МОИ, И ИХ НЕЛЬЗЯ ЗАТИРАТЬ ВЕТКОЙ
          # CODE-3 (правка 09.10, п.1 владельца: "Token-2022 правь сам при
          # врезке"). В моих копиях снято значение по умолчанию у
          # base_token_program и добавлен счёт образцов Token-2022; выкачка из
          # claude/stroiteli вернула бы молчаливый классический Token.
          # Оттуда берутся ТОЛЬКО образцы и трекер, которых у меня нет.
          git checkout FETCH_HEAD -- \
            analysis/c3_kapital_trekker.py \
            data/c2_pool_samples data/c3_usdc_noga data/samples \
            data/bloom_regression_txs.json data/bloom_tx_raw.json \
            data/c2_curve_variant_samples.json data/nogi_shablony.json \
            data/obrazcy_vidov_instrukciy.json data/solana_raw_tx_dump_vyvod.json
          echo "сборщик и оснастка -- из моей ветки, с правкой Token-2022"
          ls -1 data/idl | sed 's/^/  idl: /'
          # САМОПРОВЕРКИ ОБЕИХ ЧАСТЕЙ -- ДО ЛЮБОГО ВЫЗОВА УЗЛА. Объявлено
          # Code-3: сборщик 24 из 24, оснастка 23 из 23.
          PYTHONPATH=analysis $PY analysis/c3_pump_sborka.py --self-test | tail -2
          PYTHONPATH=analysis $PY deploy/checks/pump_sborka_simulyaciya.py --self-test | tail -2
          # СУХОЙ ПРОГОН: ноль сетевых вызовов, сверяет число образцов.
          PYTHONPATH=analysis $PY deploy/checks/pump_sborka_simulyaciya.py --dry-run | tail -20

      - name: "pump_sborka: живой прогон симуляции узлом"
        if: ${{ inputs.zadacha == 'pump_sborka' }}
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API }}
        run: |
          set -e
          set -o pipefail
          [ -n "$HELIUS_API_KEY" ] || { echo "СБОЙ: HELIUS_API не задан"; exit 1; }
          # УЗЕЛ ТОЛЬКО ОКРУЖЕНИЕМ, в argv его нет: так велит оснастка, и у неё
          # на это своя проверка. Ключ в вывод не попадает -- оснастка затирает.
          export BLOOM_TREKKER_RPC="https://mainnet.helius-rpc.com/?api-key=$HELIUS_API_KEY"
          # ВЫХОД 1 У ОСНАСТКИ -- ЭТО ОТВЕТ, А НЕ ПОЛОМКА ПРОГОНА: так она
          # говорит "недобор образцов" или "близнецы разошлись", и ровно эту
          # таблицу надо увидеть. Поэтому код ловится, а не роняет шаг.
          set +e
          PYTHONPATH=analysis $PY deploy/checks/pump_sborka_simulyaciya.py --live \
            --cel "${{ inputs.cel }}" --predel-tx "${{ inputs.predel_tx }}" \
            --pauza "${{ inputs.pauza }}" --cel-t2022 "${{ inputs.cel_t2022 }}" \
            > /tmp/pump_sborka.txt 2>&1
          RC=$?
          set -e
          tail -80 /tmp/pump_sborka.txt
          echo "код выхода оснастки: $RC (0 -- все девять вариантов набрали цель и сошлись)"

      # ПЕРЕЕЗДЫ: КТО ИХ ПОДПИСЫВАЕТ (слово владельца 09.10, п.1, "да на твоё
      # измерение"). Подписка детектора должна идти на ОДИН счёт -- авторитет, --
      # а его адрес в репозитории нигде не записан. Здесь он берётся по цепи, из
      # настоящих транзакций переезда. Кандидаты -- минты, у которых в сутках
      # архива Code-2 есть и кривая, и Pump AMM: другого пути между программами
      # у токена нет. Только чтение.
      # КРУГ НАШЕЙ СБОРКИ (слово штаба 09.10, п.2). Близнецы говорят "наша
      # сборка неотличима от чужой", и этого мало: часть "прошедших" v3 -- это
      # ОБА близнеца, упавшие Custom 1 у программы токена. Здесь проверка
      # прямая: от НАШЕГО адреса, нашими деньгами в симуляции, три инструкции
      # одной транзакцией, и успех -- это err=null И баланс токена после
      # покупки строго больше нуля.
      - name: "krug_sborki: круг нашей сборки узлом"
        if: ${{ inputs.zadacha == 'krug_sborki' }}
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API }}
        run: |
          set -e
          set -o pipefail
          [ -n "$HELIUS_API_KEY" ] || { echo "СБОЙ: HELIUS_API не задан"; exit 1; }
          PYTHONPATH=analysis $PY analysis/c3_pump_sborka.py --self-test | tail -2
          PYTHONPATH=analysis $PY deploy/checks/krug_sborki_simulyaciya.py --self-test | tail -2
          export BLOOM_TREKKER_RPC="https://mainnet.helius-rpc.com/?api-key=$HELIUS_API_KEY"
          set +e
          PYTHONPATH=analysis $PY deploy/checks/krug_sborki_simulyaciya.py --live \
            --skolko 5 --out /tmp/krug.json > /tmp/krug.txt 2>&1
          RC=$?
          set -e
          tail -60 /tmp/krug.txt
          echo "код выхода: $RC (0 -- круг прошёл хотя бы на части минтов и без красных)"

      - name: "otkazy_puti: отказанные сигналы -- денежным путём до симуляции"
        if: ${{ inputs.zadacha == 'otkazy_puti' }}
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API }}
        run: |
          set -e
          set -o pipefail
          [ -n "$HELIUS_API_KEY" ] || { echo "СБОЙ: HELIUS_API не задан"; exit 1; }
          PYTHONPATH=analysis $PY analysis/c3_pump_sborka.py --self-test | tail -2
          PYTHONPATH=analysis $PY deploy/checks/krug_sborki_simulyaciya.py --self-test | tail -2
          export BLOOM_TREKKER_RPC="https://mainnet.helius-rpc.com/?api-key=$HELIUS_API_KEY"
          set +e
          PYTHONPATH=analysis $PY deploy/checks/krug_sborki_simulyaciya.py \
            --istochnik "${{ inputs.istochnik }}" --chasov "${{ inputs.chasov }}" \
            --podpisi "${{ inputs.podpisi }}" \
            --out /tmp/otkazy.json > /tmp/otkazy.txt 2>&1
          RC=$?
          set -e
          tail -80 /tmp/otkazy.txt
          echo "код выхода: $RC (0 -- все отказанные сигналы прошли денежным путём)"
          # КОД ЗАПОМИНАЕТСЯ, А НЕ ТЕРЯЕТСЯ. Прогон 37957981526 был зелёным при
          # коде 2 "нужен --live" и нуле вызовов узла -- ровно тихая зелень.
          # Отчёт коммитится шагом ниже, а красным прогон помечается ПОСЛЕ него.
          echo "OTKAZY_RC=$RC" >> "$GITHUB_ENV"

      - name: "chem_sobrana: чем собраны НАШИ транзакции (только чтение)"
        if: ${{ inputs.zadacha == 'chem_sobrana' }}
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API }}
        run: |
          set -e
          set -o pipefail
          [ -n "$HELIUS_API_KEY" ] || { echo "СБОЙ: HELIUS_API не задан"; exit 1; }
          [ -n "${{ inputs.chitat }}" ] || { echo "СБОЙ: нужны подписи во входе chitat"; exit 1; }
          PYTHONPATH=analysis $PY deploy/checks/krug_sborki_simulyaciya.py --self-test | tail -2
          export BLOOM_TREKKER_RPC="https://mainnet.helius-rpc.com/?api-key=$HELIUS_API_KEY"
          PYTHONPATH=analysis $PY deploy/checks/krug_sborki_simulyaciya.py \
            --chitat "${{ inputs.chitat }}" --out /tmp/chem.json | tail -80

      - name: "versii_razbora: одни сигналы -- двумя версиями разбора (только чтение)"
        if: ${{ inputs.zadacha == 'versii_razbora' }}
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API }}
          REF_STARYJ: ${{ inputs.ref_staryj }}
        run: |
          set -e
          set -o pipefail
          [ -n "$HELIUS_API_KEY" ] || { echo "СБОЙ: HELIUS_API не задан"; exit 1; }
          [ -n "${{ inputs.sravnit }}" ] || { echo "СБОЙ: нужны подписи во входе sravnit"; exit 1; }
          # ИСТОРИЯ: ПРИВОЗИМ РОВНО ОДИН КОММИТ, И ВОТ ПОЧЕМУ ИМЕННО ТАК.
          # checkout@v4 без fetch-depth приносит ОДИН (верхний) коммит, и
          # `git show <старый коммит>:файл` в такой копии невозможен -- прогон
          # 38060569408 упал ровно этим: "invalid object name 'e222b934^'".
          # Первая попытка лечить это --unshallow не доехала за 10 минут
          # (прогон 38060904774 снят): в истории этой ветки лежат суточные
          # выгрузки и журналы, полная история тянется десятками минут.
          # Поэтому ref_staryj -- ПОЛНЫЙ sha, и он привозится по одному,
          # глубиной 1: GitHub отдаёт коммит по sha.
          git fetch --depth=1 --quiet origin "$REF_STARYJ" 2>/dev/null || true
          git rev-parse --verify --quiet "$REF_STARYJ^{commit}" >/dev/null \
            || { echo "СБОЙ: коммита $REF_STARYJ в копии нет. Нужен ПОЛНЫЙ sha (40 знаков), ref вида sha^ или имя ветки не привезти глубиной 1."; exit 1; }
          git cat-file -e "$REF_STARYJ:analysis/c2_swap_build.py" \
            || { echo "СБОЙ: в коммите $REF_STARYJ нет analysis/c2_swap_build.py"; exit 1; }
          echo "старая версия: $REF_STARYJ"
          # САМОПРОВЕРКА ДО УЗЛА: падает она -- сравнивать нечем.
          PYTHONPATH=analysis $PY deploy/checks/krug_sborki_simulyaciya.py --self-test | tail -2
          export BLOOM_TREKKER_RPC="https://mainnet.helius-rpc.com/?api-key=$HELIUS_API_KEY"
          PYTHONPATH=analysis $PY deploy/checks/krug_sborki_simulyaciya.py \
            --sravnit-versii "${{ inputs.sravnit }}" \
            --ref-staryj "${{ inputs.ref_staryj }}" \
            --out data/versii_razbora.json | tail -120

      - name: "mayhem_krivoj: is_mayhem_mode и котировка по счёту кривой (только чтение)"
        if: ${{ inputs.zadacha == 'mayhem_krivoj' }}
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API }}
        run: |
          set -e
          set -o pipefail
          [ -n "$HELIUS_API_KEY" ] || { echo "СБОЙ: HELIUS_API не задан"; exit 1; }
          [ -n "${{ inputs.minty }}" ] || { echo "СБОЙ: нужны минты во входе minty"; exit 1; }
          # САМОПРОВЕРКА ДО УЗЛА: смещения в счёте кривой складываются по IDL,
          # и ошибка на один байт читалась бы как настоящий ответ "mayhem".
          PYTHONPATH=analysis $PY deploy/checks/krug_sborki_simulyaciya.py --self-test | tail -2
          export BLOOM_TREKKER_RPC="https://mainnet.helius-rpc.com/?api-key=$HELIUS_API_KEY"
          PYTHONPATH=analysis $PY deploy/checks/krug_sborki_simulyaciya.py \
            --mayhem "${{ inputs.minty }}" \
            --pauza "${{ inputs.pauza }}" \
            --out data/mayhem_krivoj.json | tail -60

      - name: "mesta_v_bloke: места в блоках по АРХИВНОМУ узлу (только чтение)"
        if: ${{ inputs.zadacha == 'mesta_v_bloke' }}
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API }}
          VYGRUZKA: ${{ inputs.vygruzka }}
        run: |
          set -e
          set -o pipefail
          [ -n "$HELIUS_API_KEY" ] || { echo "СБОЙ: HELIUS_API не задан"; exit 1; }
          [ -f "$VYGRUZKA" ] || { echo "СБОЙ: нет файла выгрузки $VYGRUZKA"; exit 1; }
          PYTHONPATH=analysis $PY deploy/checks/krug_sborki_simulyaciya.py --self-test | tail -2
          export BLOOM_TREKKER_RPC="https://mainnet.helius-rpc.com/?api-key=$HELIUS_API_KEY"
          PYTHONPATH=analysis $PY deploy/checks/krug_sborki_simulyaciya.py \
            --mesta-v-bloke "$VYGRUZKA" \
            --pauza "${{ inputs.pauza }}" \
            --out data/mesta_v_bloke.json | tail -40

      - name: "chaevye_zhivy: живы ли счета чаевых отправителя (только чтение)"
        if: ${{ inputs.zadacha == 'chaevye_zhivy' }}
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API }}
          OTPRAVITEL: ${{ inputs.otpravitel }}
          RUBEZH: ${{ inputs.rubezh_utc }}
        run: |
          set -e
          set -o pipefail
          [ -n "$HELIUS_API_KEY" ] || { echo "СБОЙ: HELIUS_API не задан"; exit 1; }
          [ -n "$OTPRAVITEL" ] || { echo "СБОЙ: нужно имя отправителя во входе otpravitel"; exit 1; }
          PYTHONPATH=analysis $PY deploy/checks/krug_sborki_simulyaciya.py --self-test | tail -2
          export BLOOM_TREKKER_RPC="https://mainnet.helius-rpc.com/?api-key=$HELIUS_API_KEY"
          PYTHONPATH=analysis $PY deploy/checks/krug_sborki_simulyaciya.py \
            --chaevye-zhivy "$OTPRAVITEL" \
            --rubezh-utc "$RUBEZH" \
            --pauza "${{ inputs.pauza }}" \
            --out data/chaevye_zhivy.json | tail -80

      - name: "golova: первые N покупок того же минта после источника (только чтение)"
        if: ${{ inputs.zadacha == 'golova' }}
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API }}
          VYGRUZKA: ${{ inputs.vygruzka }}
          GOLOV: ${{ inputs.golov_skolko }}
          GOLOV_SDELOK: ${{ inputs.golov_sdelok }}
        run: |
          set -e
          set -o pipefail
          [ -n "$HELIUS_API_KEY" ] || { echo "СБОЙ: HELIUS_API не задан"; exit 1; }
          [ -f "$VYGRUZKA" ] || { echo "СБОЙ: нет файла выгрузки $VYGRUZKA"; exit 1; }
          case "${GOLOV:-30}" in ''|*[!0-9]*) echo "SBOY: golov_skolko ne celoe"; exit 1;; esac
          case "${GOLOV_SDELOK:-0}" in ''|*[!0-9]*) echo "SBOY: golov_sdelok ne celoe"; exit 1;; esac
          PYTHONPATH=analysis $PY deploy/checks/krug_sborki_simulyaciya.py --self-test | tail -2
          export BLOOM_TREKKER_RPC="https://mainnet.helius-rpc.com/?api-key=$HELIUS_API_KEY"
          PYTHONPATH=analysis $PY deploy/checks/krug_sborki_simulyaciya.py \
            --golova "$VYGRUZKA" \
            --golov-skolko "${GOLOV:-30}" \
            --golov-sdelok "${GOLOV_SDELOK:-0}" \
            --pauza "${{ inputs.pauza }}" \
            --out data/golova_ocheredi.json | tail -40

      - name: "platelshchiki: одна таблица по верхним плательщикам головы (только чтение)"
        if: ${{ inputs.zadacha == 'platelshchiki' }}
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API }}
          GOLOVA_FAJL: data/golova_ocheredi.json
          VERHNIH: ${{ inputs.verhnih }}
          PODPISEJ: ${{ inputs.podpisej_pl }}
        run: |
          set -e
          set -o pipefail
          [ -f "$GOLOVA_FAJL" ] || { echo "SBOY: net vygruzki golovy $GOLOVA_FAJL -- snachala zadacha golova"; exit 1; }
          case "${VERHNIH:-10}" in ''|*[!0-9]*) echo "SBOY: verhnih ne celoe"; exit 1;; esac
          case "${PODPISEJ:-4}" in ''|*[!0-9]*) echo "SBOY: podpisej_pl ne celoe"; exit 1;; esac
          # ЦЕНА CU ЧИТАЕТСЯ С ЦЕПИ, И ТОЛЬКО ДЛЯ ЭТОГО НУЖЕН УЗЕЛ. Без ключа
          # таблица всё равно считается -- просто без цены, и это сказано.
          PYTHONPATH=analysis $PY deploy/checks/krug_sborki_simulyaciya.py --self-test | tail -2
          CHITAT="${PODPISEJ:-4}"
          if [ -z "$HELIUS_API_KEY" ]; then
            echo "HELIUS_API ne zadan -- tablica bez ceny CU"
            CHITAT=0
          else
            export BLOOM_TREKKER_RPC="https://mainnet.helius-rpc.com/?api-key=$HELIUS_API_KEY"
          fi
          PYTHONPATH=analysis $PY deploy/checks/krug_sborki_simulyaciya.py \
            --platelshchiki "$GOLOVA_FAJL" \
            --verhnih "${VERHNIH:-10}" \
            --podpisej-na-platelshchika "$CHITAT" \
            --pauza "${{ inputs.pauza }}" \
            --out data/golova_platelshchiki.json | tail -60

      - name: "skorost_sborki: та же сборка на четырёх машинах рядом (только чтение)"
        if: ${{ inputs.zadacha == 'skorost_sborki' }}
        env:
          KLJUCH_NL: ${{ secrets.VPS_SSH_KEY }}
          KLJUCH_AMS: ${{ secrets.VPS_SSH_KEY_AMS }}
          KLJUCH_MIAMI: ${{ secrets.VPS_SSH_KEY_MIAMI }}
          MASHINY: ${{ inputs.zamer_mashiny }}
          POVTOROV: ${{ inputs.zamer_povtorov }}
          NL_HOST: 45.59.170.76
          AMS_HOST: 216.73.157.61
          MIAMI_HOST: 169.128.191.158
          RABOTA: /tmp/skorost_sborki_zamer
        run: |
          set -e
          set -o pipefail
          # ЗАЧЕМ ИМЕННО ЗДЕСЬ. Прогон dispatch по имени файла работает только
          # для прогонов, зарегистрированных на ветви по умолчанию, а новый файл
          # прогона в рабочей ветви GitHub не видит (404). Поэтому замер живёт
          # задачей уже зарегистрированного прогона, а не своим файлом.
          # КЛЮЧИ ЛАБОРАТОРИЙ -- ТОЛЬКО НА ОБЛАЧНОМ БЕГУНКЕ: на торговый хост
          # чужие закрытые ключи не кладём.
          [ "$MASHINY" = "vse" ] && MASHINY="kontejner,nl,ams,miami"
          case "${POVTOROV:-31}" in ''|*[!0-9]*) echo "SBOY: zamer_povtorov ne celoe"; exit 1;; esac
          for M in $(echo "$MASHINY" | tr ',' ' '); do
            case "$M" in kontejner|nl|ams|miami) ;; *) echo "OTKAZ: mashina $M neizvestna"; exit 1 ;; esac
          done
          echo "mashiny: $MASHINY, povtorov: ${POVTOROV:-31}"
          PYTHONPATH=analysis $PY deploy/checks/skorost_sborki.py --self-test | tail -2
          python3 deploy/checks/skorost_sborki_stroka.py --self-test | tail -1

          if echo "$MASHINY" | tr ',' '\n' | grep -qx kontejner; then
            $PY deploy/checks/skorost_sborki.py --povtorov "${POVTOROV:-31}" \
              --sekund 10 --out /tmp/sk_kontejner.json > /dev/null
            python3 deploy/checks/skorost_sborki_stroka.py /tmp/sk_kontejner.json kontejner
          fi

          install -d -m 700 ~/.ssh
          ulozhit() {
            IMJA="$1"; TELO="$2"
            echo "$MASHINY" | tr ',' '\n' | grep -qx "$IMJA" || return 0
            [ -n "$TELO" ] || { echo "NET KLJUCHA dlja $IMJA -- propushcheno"; return 0; }
            printf '%s\n' "$TELO" > ~/.ssh/"$IMJA"_key
            chmod 600 ~/.ssh/"$IMJA"_key
          }
          ulozhit nl "$KLJUCH_NL"
          ulozhit ams "$KLJUCH_AMS"
          ulozhit miami "$KLJUCH_MIAMI"
          SSH_BASE="-o ConnectTimeout=15 -o BatchMode=yes -o StrictHostKeyChecking=accept-new"

          # ПОСЫЛКА: модуль, analysis целиком и ОДИН образец. На всех машинах
          # считается один и тот же код и один и тот же образец -- иначе числа
          # рядом ничего не значат.
          rm -rf /tmp/posylka && mkdir -p /tmp/posylka/deploy/checks /tmp/posylka/analysis /tmp/posylka/data/c2_pool_samples
          cp deploy/checks/skorost_sborki.py /tmp/posylka/deploy/checks/
          cp analysis/*.py /tmp/posylka/analysis/
          cp data/c2_pool_samples/pAMMBay6oceH9fJKBRHGP5D4bD4sWpmSwMn52FMfXEA.json /tmp/posylka/data/c2_pool_samples/
          # МЕТКИ ПЛОЩАДОК -- 6 КБ, БЕЗ КОТОРЫХ СБОРКА НЕ ИДЁТ. Прогон 23:25Z
          # потерял на этом три машины из четырёх: c2_pool_programs читает этот
          # файл при импорте, и без него собрать() отказывает FileNotFoundError.
          mkdir -p /tmp/posylka/data/solana_buyer_200/prior/current/buyer_100
          cp data/solana_buyer_200/prior/current/buyer_100/dex_labels.json \
             /tmp/posylka/data/solana_buyer_200/prior/current/buyer_100/
          tar -C /tmp/posylka -czf /tmp/posylka.tgz .

          for IMJA in nl ams miami; do
            echo "$MASHINY" | tr ',' '\n' | grep -qx "$IMJA" || continue
            [ -f ~/.ssh/"$IMJA"_key ] || continue
            case "$IMJA" in
              nl) HOST="$NL_HOST"; PYT=/home/bot/robinhood-chain-alpha/venv/bin/python; SVOJ_VENV=0 ;;
              ams) HOST="$AMS_HOST"; PYT="$RABOTA/venv/bin/python"; SVOJ_VENV=1 ;;
              miami) HOST="$MIAMI_HOST"; PYT="$RABOTA/venv/bin/python"; SVOJ_VENV=1 ;;
            esac
            OPTS="-i $HOME/.ssh/${IMJA}_key $SSH_BASE"
            echo "=== $IMJA ($HOST) ==="
            ssh -n $OPTS root@"$HOST" "rm -rf $RABOTA; install -d -m 755 $RABOTA" || { echo "$IMJA ne otvetil"; continue; }
            ssh $OPTS root@"$HOST" "tar -C $RABOTA -xzf -" < /tmp/posylka.tgz
            if [ "$SVOJ_VENV" = "1" ]; then
              ssh -n $OPTS root@"$HOST" "python3 -m venv $RABOTA/venv && $RABOTA/venv/bin/pip install -q requests solders" || echo "$IMJA: venv ne sobralsja"
            fi
            ssh -n $OPTS root@"$HOST" "$PYT $RABOTA/deploy/checks/skorost_sborki.py --koren $RABOTA --povtorov ${POVTOROV:-31} --sekund 10 --out $RABOTA/out.json > /dev/null" || echo "$IMJA: zamer upal"
            ssh -n $OPTS root@"$HOST" "cat $RABOTA/out.json 2>/dev/null || true" > /tmp/sk_"$IMJA".json || true
            ssh -n $OPTS root@"$HOST" "rm -rf $RABOTA"
            python3 deploy/checks/skorost_sborki_stroka.py /tmp/sk_"$IMJA".json "$IMJA" || true
          done
          shred -u ~/.ssh/nl_key ~/.ssh/ams_key ~/.ssh/miami_key 2>/dev/null || true

          ARGI=""
          mkdir -p data/skorost_sborki
          for IMJA in kontejner nl ams miami; do
            if [ -s /tmp/sk_"$IMJA".json ]; then
              ARGI="$ARGI --svod $IMJA=/tmp/sk_$IMJA.json"
              cp /tmp/sk_"$IMJA".json data/skorost_sborki/"$IMJA".json
            fi
          done
          [ -n "$ARGI" ] || { echo "SBOY: ni odnoj mashiny ne izmereno"; exit 1; }
          python3 deploy/checks/skorost_sborki.py $ARGI --out data/skorost_sborki_4_mashiny.json | tail -90

      - name: "preprocessed: зонд «видеть раньше» рядом с торговлей (денежный путь не трогается)"
        if: ${{ inputs.zadacha == 'preprocessed' }}
        env:
          KLJUCH_NL: ${{ secrets.VPS_SSH_KEY }}
          HELIUS_API_KEY: ${{ secrets.HELIUS_API }}
          NL_HOST: 45.59.170.76
          ZOND_DIR: /home/bot/preprocessed_zond
          VENV: /home/bot/robinhood-chain-alpha/venv
          ADRES: ${{ inputs.istochnik }}
          CHASOV: ${{ inputs.chasov }}
          # ЦЕЛЬ -- 30 ПОКУПОК, как сказал владелец. Входом не делаем: у
          # прогона уже 25 входов, это предел GitHub.
          POKUPOK: "30"
          UNIT: preprocessed-zond
        run: |
          set -e
          set -o pipefail
          [ -n "$KLJUCH_NL" ] || { echo "SBOY: VPS_SSH_KEY ne zadan"; exit 1; }
          [ -n "$HELIUS_API_KEY" ] || { echo "SBOY: HELIUS_API ne zadan"; exit 1; }
          case "$ADRES" in *[!1-9A-HJ-NP-Za-km-z]*|"") echo "SBOY: adres ne base58"; exit 1;; esac
          case "${CHASOV:-24}" in ''|*[!0-9]*) echo "SBOY: chasov ne celoe"; exit 1;; esac
          python3 analysis/preprocessed_ab_zond.py --self-test | tail -2
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KLJUCH_NL" > ~/.ssh/nl_key
          chmod 600 ~/.ssh/nl_key
          OPTS="-i $HOME/.ssh/nl_key -o ConnectTimeout=15 -o BatchMode=yes -o StrictHostKeyChecking=accept-new"
          ZHIV=$(ssh -n $OPTS root@"$NL_HOST" "systemctl is-active $UNIT.service 2>/dev/null || true")
          echo "sostojanie zonda: ${ZHIV:-net}"
          # ЗОНД ОБЯЗАН ЕХАТЬ НА ТОМ КОДЕ, ЧТО В ВЕТВИ. Иначе живой зонд
          # остаётся на прежней версии молча: 01:20Z он уже работал, а правку
          # журнала всех приходов не получил бы вовсе. Сверка по sha256.
          SHA_VETKI=$(sha256sum analysis/preprocessed_ab_zond.py | cut -c1-16)
          SHA_HOSTA=$(ssh -n $OPTS root@"$NL_HOST" "sha256sum $ZOND_DIR/preprocessed_ab_zond.py 2>/dev/null | cut -c1-16" || true)
          echo "sha zonda: vetka $SHA_VETKI, host ${SHA_HOSTA:-net}"
          if [ "$ZHIV" = "active" ] && [ "$SHA_VETKI" != "${SHA_HOSTA:-net}" ]; then
            echo "zond rabotaet na DRUGOM kode -- ostanavlivaju i podnimaju zanovo"
            ssh -n $OPTS root@"$NL_HOST" "systemctl stop $UNIT.service 2>/dev/null || true; systemctl reset-failed $UNIT.service 2>/dev/null || true"
            ZHIV="net"
          fi
          if [ "$ZHIV" != "active" ]; then
            # ЗАПУСК. Зонд живёт часами, поэтому он уходит под systemd-run, а
            # прогон выходит сразу -- так же, как зонд преконфов.
            ssh -n $OPTS root@"$NL_HOST" "systemctl stop $UNIT.service 2>/dev/null || true; systemctl reset-failed $UNIT.service 2>/dev/null || true; install -d -m 755 $ZOND_DIR"
            ssh $OPTS root@"$NL_HOST" "cat > $ZOND_DIR/preprocessed_ab_zond.py" < analysis/preprocessed_ab_zond.py
            # КЛЮЧ -- ФАЙЛОМ 600 И ТОЛЬКО ЧЕРЕЗ stdin: в argv и в журнал он не попадает.
            printf '%s' "$HELIUS_API_KEY" | ssh $OPTS root@"$NL_HOST" "umask 077; cat > $ZOND_DIR/helius_key; chmod 600 $ZOND_DIR/helius_key; wc -c < $ZOND_DIR/helius_key"
            ssh -n $OPTS root@"$NL_HOST" "set -o pipefail; $VENV/bin/python $ZOND_DIR/preprocessed_ab_zond.py --self-test | tail -1"
            STAMP=$(date -u +%Y%m%dT%H%M%SZ)
            ssh -n $OPTS root@"$NL_HOST" "systemd-run --unit=$UNIT --description='Zond preprocessed protiv WS' --setenv=HELIUS_API_KEY_FILE=$ZOND_DIR/helius_key --working-directory=$ZOND_DIR $VENV/bin/python $ZOND_DIR/preprocessed_ab_zond.py --adres '$ADRES' --pokupok ${POKUPOK:-30} --sekund $(( ${CHASOV:-24} * 3600 )) --out $ZOND_DIR/vstrechi_$STAMP.jsonl --status $ZOND_DIR/status.json"
            sleep 20
            echo "zond podnjat, pervyj priznak zhizni:"
          else
            echo "zond uzhe rabotaet -- sobiraju otchjot, ne trogaja ego"
          fi
          ssh -n $OPTS root@"$NL_HOST" "cat $ZOND_DIR/status.json 2>/dev/null || echo '{\"why_not\": \"priznaka poka net\"}'" > /tmp/preprocessed_status.json
          mkdir -p data/preprocessed
          cp /tmp/preprocessed_status.json data/preprocessed/status.json
          ssh -n $OPTS root@"$NL_HOST" "cat \$(ls -1t $ZOND_DIR/vstrechi_*.jsonl 2>/dev/null | head -1) 2>/dev/null || true" > /tmp/preprocessed_vstrechi.jsonl || true
          [ -s /tmp/preprocessed_vstrechi.jsonl ] && cp /tmp/preprocessed_vstrechi.jsonl data/preprocessed/vstrechi.jsonl || true
          python3 deploy/checks/preprocessed_stroka.py /tmp/preprocessed_status.json || true
          # ЦЕЛЬ НАБРАНА -- ВЫКЛЮЧАЕМ, как просил владелец: дальше платить за
          # сообщения незачем. Зонд и сам выходит, это лишь страховка.
          if python3 deploy/checks/preprocessed_stroka.py --dostignuto /tmp/preprocessed_status.json; then
            echo "cel nabrana -- zond ostanovlen"
            ssh -n $OPTS root@"$NL_HOST" "systemctl stop $UNIT.service 2>/dev/null || true; systemctl reset-failed $UNIT.service 2>/dev/null || true; shred -u $ZOND_DIR/helius_key 2>/dev/null || rm -f $ZOND_DIR/helius_key"
          fi
          shred -u ~/.ssh/nl_key 2>/dev/null || true

      - name: "potoki: кто из потоков процесса полосы жжёт процессор (только чтение /proc)"
        if: ${{ inputs.zadacha == 'potoki' }}
        env:
          KLJUCH_NL: ${{ secrets.VPS_SSH_KEY }}
          NL_HOST: 45.59.170.76
          RABOTA: /tmp/potoki_zamer
          # ОКНО ЗАМЕРА -- ЗДЕСЬ, А НЕ ВХОДОМ. GitHub даёт прогону не больше
          # 25 входов на workflow_dispatch, и этот файл уже на пределе: 26-й
          # вход ломает разбор прогона целиком ("you may only define up to 25
          # inputs"). Крутить это число из рук не нужно: 15 с хватает, чтобы
          # поток с расходом 1 % одного ядра был виден.
          SEKUND: "15"
        run: |
          set -e
          set -o pipefail
          case "${SEKUND:-10}" in ''|*[!0-9]*) echo "SBOY: potoki_sekund ne celoe"; exit 1;; esac
          [ -n "$KLJUCH_NL" ] || { echo "SBOY: VPS_SSH_KEY ne zadan"; exit 1; }
          python3 deploy/checks/potoki_processa.py --self-test | tail -2
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KLJUCH_NL" > ~/.ssh/nl_key
          chmod 600 ~/.ssh/nl_key
          OPTS="-i $HOME/.ssh/nl_key -o ConnectTimeout=15 -o BatchMode=yes -o StrictHostKeyChecking=accept-new"
          # ТОЛЬКО ЧТЕНИЕ /proc: ни одной записи на хост, кроме временного
          # каталога с самим модулем, и он удаляется в конце.
          ssh -n $OPTS root@"$NL_HOST" "rm -rf $RABOTA; install -d -m 755 $RABOTA"
          ssh $OPTS root@"$NL_HOST" "cat > $RABOTA/potoki_processa.py" < deploy/checks/potoki_processa.py
          ssh -n $OPTS root@"$NL_HOST" "set -o pipefail; python3 $RABOTA/potoki_processa.py --self-test | tail -1"
          for SLUZHBA in bloom_detector bloom_seller; do
            echo "=== $SLUZHBA ==="
            ssh -n $OPTS root@"$NL_HOST" "python3 $RABOTA/potoki_processa.py --iskat $SLUZHBA --sekund ${SEKUND:-10} --out $RABOTA/out_$SLUZHBA.json > /dev/null"
            ssh -n $OPTS root@"$NL_HOST" "cat $RABOTA/out_$SLUZHBA.json" > /tmp/potoki_"$SLUZHBA".json
            python3 deploy/checks/potoki_stroka.py /tmp/potoki_"$SLUZHBA".json "$SLUZHBA" || true
          done
          ssh -n $OPTS root@"$NL_HOST" "rm -rf $RABOTA"
          shred -u ~/.ssh/nl_key 2>/dev/null || true
          mkdir -p data/potoki
          cp /tmp/potoki_bloom_detector.json data/potoki/bloom_detector.json 2>/dev/null || true
          cp /tmp/potoki_bloom_seller.json data/potoki/bloom_seller.json 2>/dev/null || true

      - name: "blocksubscribe: даёт ли наш план Helius подписку на блоки (только чтение)"
        if: ${{ inputs.zadacha == 'blocksubscribe' }}
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API }}
        run: |
          set -e
          set -o pipefail
          [ -n "$HELIUS_API_KEY" ] || { echo "СБОЙ: HELIUS_API не задан"; exit 1; }
          "$RUNNER_TEMP/bs_venv/bin/pip" install -q websockets
          $PY deploy/checks/blocksubscribe_proba.py --self-test | tail -2
          $PY deploy/checks/blocksubscribe_proba.py \
            --sekund 12 \
            --out data/blocksubscribe_proba.json | tail -60

      - name: "pereezdy: архив Code-2 и сборщик Code-3"
        if: ${{ inputs.zadacha == 'pereezdy' }}
        run: |
          set -e
          set -o pipefail
          git fetch --depth=1 origin claude/stroiteli
          echo "оснастка сборки: $(git rev-parse --short FETCH_HEAD)"
          git checkout FETCH_HEAD -- analysis/c3_pump_sborka.py data/idl
          git fetch --depth=1 origin claude/podbivka
          echo "архив Code-2: $(git rev-parse --short FETCH_HEAD)"
          # СУТОЧНЫЙ ФАЙЛ -- САМЫЙ СВЕЖИЙ ИЗ ЕСТЬ, и его имя печатается: по
          # другому файлу числа были бы другими, и молчать об этом нельзя.
          FAJL=$(git ls-tree --name-only FETCH_HEAD data/podbivka/arhiv_den/ \
                 | grep -E 'konv_.*json\.gz$' | sort | tail -1)
          [ -n "$FAJL" ] || { echo "СБОЙ: в архиве нет konv_*.json.gz"; exit 1; }
          echo "беру сутки: $FAJL"
          git checkout FETCH_HEAD -- "$FAJL"
          echo "ARHIV=$FAJL" >> "$GITHUB_ENV"
          PYTHONPATH=analysis $PY deploy/checks/pereezdy_po_cepi.py --self-test | tail -2

      - name: "pereezdy: по цепи -- подписант, байты, create_pool"
        if: ${{ inputs.zadacha == 'pereezdy' }}
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API }}
        run: |
          set -e
          [ -n "$HELIUS_API_KEY" ] || { echo "СБОЙ: HELIUS_API не задан"; exit 1; }
          export BLOOM_TREKKER_RPC="https://mainnet.helius-rpc.com/?api-key=$HELIUS_API_KEY"
          set +e
          PYTHONPATH=analysis $PY deploy/checks/pereezdy_po_cepi.py --live \
            --arhiv "$ARHIV" --skolko 30 --podpisey 15 --pauza 0.12 \
            --out /tmp/pereezdy.json > /tmp/pereezdy.txt 2>&1
          RC=$?
          set -e
          tail -40 /tmp/pereezdy.txt
          echo "код выхода: $RC"

      - name: "SSH key"
        if: ${{ inputs.zadacha != 'pump_sborka' && inputs.zadacha != 'pereezdy' && inputs.zadacha != 'krug_sborki' && inputs.zadacha != 'otkazy_puti' && inputs.zadacha != 'chem_sobrana' && inputs.zadacha != 'versii_razbora' && inputs.zadacha != 'mayhem_krivoj' && inputs.zadacha != 'mesta_v_bloke' }}
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -e
          [ -n "$VPS_SSH_KEY" ] || { echo "СБОЙ: VPS_SSH_KEY не задан"; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          echo "SSH_OPTS=-i $HOME/.ssh/vps_key -o ConnectTimeout=20 -o BatchMode=yes -o StrictHostKeyChecking=accept-new" >> "$GITHUB_ENV"

      - name: "Свежие сигналы кривой из живого журнала (потоком)"
        if: ${{ inputs.zadacha != 'pump_sborka' && inputs.zadacha != 'pereezdy' && inputs.zadacha != 'krug_sborki' && inputs.zadacha != 'otkazy_puti' && inputs.zadacha != 'chem_sobrana' && inputs.zadacha != 'versii_razbora' && inputs.zadacha != 'mayhem_krivoj' && inputs.zadacha != 'mesta_v_bloke' }}
        run: |
          set -e
          set -o pipefail
          mkdir -p /tmp/bsim
          ROT=""
          [ "${{ inputs.rotated }}" = "yes" ] && ROT="yes"
          ssh -n $SSH_OPTS root@"$HOST" \
            "ION=\$(command -v ionice >/dev/null 2>&1 && echo 'ionice -c3' || true); \
             { nice -n 15 \$ION grep -F -e $CURVE $STATE_DIR/decisions.jsonl; \
               if [ -n \"$ROT\" ]; then \
                 for G in $STATE_DIR/decisions.jsonl.*.gz; do [ -e \"\$G\" ] || continue; \
                   nice -n 15 \$ION zgrep -F -e $CURVE \"\$G\" || true; done; \
               fi; } | tail -n 400" \
            > /tmp/bsim/curve.jsonl && RC=0 || RC=$?
          echo "выборка завершилась кодом $RC"
          wc -l < /tmp/bsim/curve.jsonl

      - name: "Симуляция нашей покупки на кривой"
        if: ${{ inputs.zadacha != 'pump_sborka' && inputs.zadacha != 'pereezdy' && inputs.zadacha != 'krug_sborki' && inputs.zadacha != 'otkazy_puti' && inputs.zadacha != 'chem_sobrana' && inputs.zadacha != 'versii_razbora' && inputs.zadacha != 'mayhem_krivoj' && inputs.zadacha != 'mesta_v_bloke' }}
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API }}
        run: |
          set -e
          [ -n "$HELIUS_API_KEY" ] || { echo "СБОЙ: HELIUS_API не задан"; exit 1; }
          WALLET_ARG=""
          if [ -n "${{ inputs.wallet }}" ]; then WALLET_ARG="--wallet ${{ inputs.wallet }}"; fi
          $PY analysis/bonding_sim_check.py \
            --decisions /tmp/bsim/curve.jsonl \
            --limit "${{ inputs.limit }}" \
            --sol "${{ inputs.sol }}" $WALLET_ARG \
            --save-samples data/c2_curve_variant_samples.json

      - name: "Коммит"
        if: always()
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ "${{ inputs.zadacha }}" = "pump_sborka" ]; then
            # ОТЧЁТ ОСНАСТКИ -- В ВЕТКУ, а привезённые из claude/stroiteli
            # файлы НЕ коммитим: их хозяин Code-3, копия тут же разошлась бы.
            mkdir -p data
            cp /tmp/pump_sborka.txt data/pump_sborka_simulyaciya.txt || true
            git checkout -- analysis data 2>/dev/null || true
            git clean -fd analysis data 2>/dev/null || true
            cp /tmp/pump_sborka.txt data/pump_sborka_simulyaciya.txt || true
            git add data/pump_sborka_simulyaciya.txt || true
          fi
          if [ "${{ inputs.zadacha }}" = "pereezdy" ]; then
            git checkout -- analysis data 2>/dev/null || true
            git clean -fd analysis data 2>/dev/null || true
            mkdir -p data
            cp /tmp/pereezdy.json data/pereezdy_po_cepi.json 2>/dev/null || true
            git add data/pereezdy_po_cepi.json || true
          fi
          if [ "${{ inputs.zadacha }}" = "chem_sobrana" ]; then
            git checkout -- analysis data 2>/dev/null || true
            git clean -fd analysis data 2>/dev/null || true
            mkdir -p data
            cp /tmp/chem.json data/chem_sobrana_nashi_tx.json 2>/dev/null || true
            git add data/chem_sobrana_nashi_tx.json || true
          fi
          if [ "${{ inputs.zadacha }}" = "otkazy_puti" ]; then
            git checkout -- analysis data 2>/dev/null || true
            git clean -fd analysis data 2>/dev/null || true
            mkdir -p data
            cp /tmp/otkazy.json data/otkazy_denezhnogo_puti.json 2>/dev/null || true
            git add data/otkazy_denezhnogo_puti.json || true
          fi
          if [ "${{ inputs.zadacha }}" = "krug_sborki" ]; then
            git checkout -- analysis data 2>/dev/null || true
            git clean -fd analysis data 2>/dev/null || true
            mkdir -p data
            cp /tmp/krug.json data/krug_sborki_simulyaciya.json 2>/dev/null || true
            git add data/krug_sborki_simulyaciya.json || true
          fi
          for F in data/bonding_sim_check.json data/c2_curve_variant_samples.json data/versii_razbora.json data/mayhem_krivoj.json data/mesta_v_bloke.json data/chaevye_zhivy.json data/blocksubscribe_proba.json data/golova_ocheredi.json data/golova_platelshchiki.json data/skorost_sborki_4_mashiny.json; do
            [ -f "$F" ] && git add "$F"
          done
          # СВОДЫ ПО МАШИНАМ -- КАТАЛОГОМ: четыре файла рядом с таблицей, чтобы
          # можно было перепроверить любое число из неё по его машине.
          [ -d data/skorost_sborki ] && git add data/skorost_sborki || true
          [ -d data/potoki ] && git add data/potoki || true
          [ -d data/preprocessed ] && git add data/preprocessed || true
          git diff --cached --quiet && { echo "нечего коммитить"; exit 0; }
          git commit -m "Krivaya pump.fun: simulyatsiya nashey sborki [automated]"
          for i in 1 2 3 4 5; do
            git push origin HEAD:claude/nifty-sagan-r0polg && exit 0
            git pull --rebase -X theirs origin claude/nifty-sagan-r0polg
            sleep 3
          done
          exit 1

      - name: "otkazy_puti: красное -- красным (отчёт выше уже закоммичен)"
        if: ${{ always() && inputs.zadacha == 'otkazy_puti' }}
        run: |
          [ "${OTKAZY_RC:-pusto}" = "0" ] || {
            echo "СБОЙ: денежный путь на отказанных сигналах дал код ${OTKAZY_RC:-pusto}"
            exit 1; }
          echo "денежный путь на отказанных сигналах: код 0"
