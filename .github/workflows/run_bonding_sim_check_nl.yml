            mkdir -p data
            cp /tmp/chem.json data/chem_sobrana_nashi_tx.json 2>/dev/null || true
            git add data/chem_sobrana_nashi_tx.json || true
          fi
          if [ "${{ inputs.zadacha }}" = "otkazy_puti" ]; then
