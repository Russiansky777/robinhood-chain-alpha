name: "Полоса своей отправки: поставить KILL_OWN_SEND (status/set)"

# Рубильник ТОЛЬКО полосы своей отправки. Bloom, сторож продаж и тень
# продолжают работать: останавливать боевое из-за замера нельзя.
#
# Зачем отдельный прогон: файл KILL_OWN_SEND лежит в каталоге состояния на
# хосте, и до сих пор его умела ставить только сама служба (при денежной
# странности). Тот же рычаг нужен снаружи -- иначе единственным способом
# остановить полосу был деплой с own_send_live=0, а он молча отменяется
# следующим деплоем с own_send_live=1.
#
# СНЯТИЕ (mode=clear) ДОБАВЛЕНО 25.09 ПО ПРЯМОМУ РАЗРЕШЕНИЮ ВЛАДЕЛЬЦА: "снять
# KILL_OWN_SEND -- причина 571aBZbC по новому правилу это итог несчитаем, не
# утечка". Полоса по-прежнему сама себя не разблокирует. Снятие требует трёх
# вещей сразу, и каждую проверяет сам прогон:
#   * подтверждения словом (confirm = SNYAT) -- чтобы снятие не случилось
#     "заодно" с просмотром;
#   * ПРОЙДЕННЫХ самопроверок полосы и сторожа НА ХОСТЕ и согласованного
#     кошелька полосы (ключ даёт именно тот адрес) -- в том же прогоне, до
#     снятия;
#   * причины словами, которая уходит в журнал прогона.
# Не прошла хоть одна -- файл не трогается. Прежняя причина не исчезает: она
# уезжает в файл рядом с отметкой времени, иначе разбор потом не найдёт, из-за
# чего вставали.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "status -- посмотреть; set -- остановить полосу; clear -- снять (после самопроверок)"
        required: true
        default: "status"
      reason:
        description: "почему остановлена или почему снимаем (попадёт в файл и в журнал прогона)"
        required: false
        default: ""
      telegram:
        description: "'yes' -- отправить строку владельцу в основной чат (для mode=set)"
        required: false
        default: "no"
      confirm:
        description: "для mode=clear: ровно SNYAT -- иначе снятие не делается"
        required: false
        default: ""
      sbros_otschota:
        description: "'yes' -- ПЕРЕД снятием перенести начало суточного отсчёта рубильника (lane_day.json) на сейчас"
        required: false
        default: "no"

concurrency:
  group: lane-kill-nl
  cancel-in-progress: false

env:
  HOST: 45.59.170.76
  STATE_DIR: /home/bot/bloom_executor_live_data
  CODE_DIR: /home/bot/bloom_executor
  VENV: /home/bot/robinhood-chain-alpha/venv/bin/python

jobs:
  lane_kill:
    runs-on: ${{ fromJSON('["self-hosted","nl-host"]') }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/nifty-sagan-r0polg

      - name: "SSH key"
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -e
          [ -n "$VPS_SSH_KEY" ] || { echo "VPS_SSH_KEY не задан"; exit 1; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          echo "SSH_OPTS=-i $HOME/.ssh/vps_key -o ConnectTimeout=15 -o BatchMode=yes -o StrictHostKeyChecking=accept-new" >> $GITHUB_ENV

      - name: "Что сейчас с рубильником"
        run: |
          set -e
          ssh -n $SSH_OPTS root@127.0.0.1 "
            F=$STATE_DIR/KILL_OWN_SEND
            if [ -f \"\$F\" ]; then
              printf 'рубильник СТОИТ, содержимое: '; head -c 400 \"\$F\"; echo
            else
              echo 'рубильника нет: полоса не остановлена этим файлом'
            fi"

      - name: "set: остановить полосу"
        if: ${{ inputs.mode == 'set' }}
        run: |
          set -e
          # Причина обязательна: файл без пояснения не даст утром понять, из-за
          # чего встали. Имена переменных только латиницей -- bash иначе
          # разбирает присваивание как команду (проверено 11:24Z).
          reason_text='${{ inputs.reason }}'
          [ -n "$reason_text" ] || { echo "СБОЙ: для mode=set нужна причина"; exit 1; }
          # Первая причина НЕ затирается -- ровно как в set_lane_kill службы:
          # важна та, из-за которой остановились в первый раз.
          ssh -n $SSH_OPTS root@127.0.0.1 "
            F=$STATE_DIR/KILL_OWN_SEND
            if [ -f \"\$F\" ]; then
              printf 'рубильник уже стоял, первую причину не трогаем: '; head -c 400 \"\$F\"; echo
            else
              printf '%s %s\n' \"\$(date -u +%Y-%m-%dT%H:%M:%SZ)\" \"$reason_text\" > \"\$F\"
              printf 'поставлен: '; head -c 400 \"\$F\"; echo
            fi"

      - name: "clear: гейт 1 -- подтверждение словом и причина"
        if: ${{ inputs.mode == 'clear' }}
        run: |
          set -e
          confirm_word='${{ inputs.confirm }}'
          reason_text='${{ inputs.reason }}'
          [ "$confirm_word" = "SNYAT" ] || { echo "СБОЙ: для mode=clear нужно confirm=SNYAT"; exit 1; }
          [ -n "$reason_text" ] || { echo "СБОЙ: для mode=clear нужна причина"; exit 1; }
          echo "подтверждение принято, причина: $reason_text"

      - name: "clear: гейт 2 -- самопроверки полосы и сторожа НА ХОСТЕ"
        if: ${{ inputs.mode == 'clear' }}
        run: |
          set -e
          # Самопроверки ТОГО кода, что лежит на хосте, а не того, что в
          # репозитории: снимаем рубильник с работающей службы, и проверять
          # надо её. `set -e` внутри удалённой оболочки роняет шаг, если
          # самопроверка вернула не ноль.
          # pipefail НА УДАЛЁННОЙ СТОРОНЕ, И ЭТО НЕ АККУРАТНОСТЬ. ЖИВОЙ СЛУЧАЙ
          # 06.10 17:18Z: обе самопроверки на хосте УПАЛИ
          # (ModuleNotFoundError: selftest_guard -- модуля не было в списке
          # доставки деплоя), в журнале стояли два Traceback, а шаг
          # отчитался УСПЕХОМ: без pipefail код берётся от `tail`, а он всегда
          # 0. Гейт, который не умеет не пройти, гейтом не является.
          # ИМЕНА УПАВШИХ ПРОВЕРОК ВИДНЫ, А КОД ВОЗВРАТА -- ОТ PYTHON, НЕ ОТ
          # ФИЛЬТРА. `--self-test | tail -1` показывал только итоговую строку:
          # что именно упало, приходилось искать в журнале прогона, которого
          # нет. Теперь вывод держится в переменной, фильтр печатает СБОЙ-строки
          # и итог, а наружу уходит код самого python.
          # САМОПРОВЕРКА ИДЁТ ИЗ ВРЕМЕННОГО КАТАЛОГА И БЕЗ ЗАПИСИ БАЙТКОДА.
          # Страж самопроверок (selftest_guard) падает на ЛЮБОЙ ЗАПИСИ в
          # /home/bot, /etc/bloom-executor, /var/lib/bloom -- он для этого и
          # сделан. При cwd = $CODE_DIR любая запись относительным путём (и
          # __pycache__ заодно) упирается в этот запрет, и самопроверка падает
          # не из-за кода, а из-за места запуска. Поэтому cwd -- временный
          # каталог в /tmp, модули ищутся через PYTHONPATH, байткод не пишется.
          # В журнал печатаются последние строки вывода: по одному слову
          # "Traceback" причину не узнать.
          # ОКРУЖЕНИЕ САМОПРОВЕРКИ -- ЧИСТОЕ, ПОТОМУ ЧТО ОНА ПРОВЕРЯЕТ КОД, А НЕ
          # НАСТРОЙКИ. Разрешено явным словом владельца 06.10 ("разрешаю правку
          # гейта"), после того как гейт был доложен ему как блокирующий.
          # ЖИВОЙ СЛУЧАЙ 06.10 17:42Z: с боевым env сторож продаж дал 482/485, и
          # все три упавшие проверки -- одна ветка ("нет количества и нет своего
          # кошелька -- UNSOLD, а не продажа остатка" и её счётчик): в боевом
          # окружении есть ключ полосы и включён путь Jupiter, поэтому код
          # уходит в ПРОДАЖУ, а тест ждёт UNSOLD. Тот же код с чистым
          # окружением -- 485/485 (проверено на этой же ревизии). То есть гейт
          # мерил env, а не код, и при живых настройках не дал бы снять
          # рубильник никогда. Проверки НЕ ослаблены: обе самопроверки
          # по-прежнему обязаны пройти целиком, иначе шаг падает и рубильник
          # остаётся; страж самопроверок держит тест вне боевых путей, сети и
          # Telegram -- боевой env ему для этого не нужен.
          # ОДНА ПЕРЕМЕННАЯ ВСЁ ЖЕ НУЖНА, И ЭТО ПУТЬ, А НЕ НАСТРОЙКА ДЕНЕГ.
          # С полностью чистым окружением (06.10 18:01Z) осталась РОВНО ОДНА
          # упавшая проверка -- "признак после проверок вернулся на место: у
          # групп его по-прежнему нет": она ЧИТАЕТ файл групп, а без
          # BLOOM_SOURCE_GROUPS модуль берёт умолчание data/sources_live.json,
          # которого на хосте нет. Поэтому пробрасывается ровно эта строка из
          # боевого env (путь к файлу групп, чтение страж разрешает), и ничего
          # больше: ни ключа полосы, ни флагов продажи, ни Telegram.
          ssh -n $SSH_OPTS root@127.0.0.1 "
            export PATH=/usr/local/bin:/usr/bin:/bin
            export LANG=C.UTF-8
            export PYTHONPATH=$CODE_DIR
            export PYTHONDONTWRITEBYTECODE=1
            export BLOOM_SOURCE_GROUPS=\$(grep -m1 '^BLOOM_SOURCE_GROUPS=' /etc/bloom-executor/env | cut -d= -f2-)
            rab=\$(mktemp -d /tmp/st.XXXXXX)
            cd \$rab
            rc=0
            for m in bloom_own_send.py bloom_seller.py; do
              out=\$($VENV $CODE_DIR/\$m --self-test 2>&1) || rc=1
              echo \"--- \$m\"
              printf '%s\n' \"\$out\" | grep -vE '\\[ok  \\]' | tail -25
            done
            cd /tmp; rm -rf \$rab
            exit \$rc"

      - name: "clear: гейт 3 -- ключ полосы даёт именно её адрес"
        if: ${{ inputs.mode == 'clear' }}
        run: |
          set -e
          # Значение ключа наружу не выходит: печатается адрес и слово да/нет.
          LANE_READY=$(ssh -n $SSH_OPTS root@127.0.0.1 "
            set -a; . /etc/bloom-executor/env; set +a
            cd $CODE_DIR
            $VENV -c 'import json, bloom_own_send as O; g=O.кошелёк_готов(); print(json.dumps({\"wallet\": g.get(\"wallet\"), \"own\": g.get(\"own_wallet\"), \"ok\": g.get(\"ok\"), \"why_not\": g.get(\"why_not\")}, ensure_ascii=False))'")
          echo "кошелёк полосы: $LANE_READY"
          case "$LANE_READY" in
            *'"own": true'*'"ok": true'*) echo "адрес и ключ полосы согласованы" ;;
            *) echo "СБОЙ: кошелёк полосы не готов -- рубильник не снимаю"; exit 1 ;;
          esac

      # ПЕРЕНОС НАЧАЛА ОТСЧЁТА -- ДО СНЯТИЯ, И ЭТО НЕ ПОРЯДОК РАДИ ПОРЯДКА.
      # Суточный рубильник считает просадку от баланса на 00:00 Мадрида и
      # ставится САМОЙ СЛУЖБОЙ при каждом обновлении баланса. Снять файл, не
      # перенеся отсчёт, значит получить его обратно через пульс: 06.10 в
      # 17:01:31Z просадка была 2.276795 SOL при пороге 2.0.
      - name: "sbros: самопроверка скрипта переноса отсчёта (без хоста)"
        if: ${{ inputs.sbros_otschota == 'yes' }}
        run: |
          set -e
          set -o pipefail
          python3 -m py_compile deploy/checks/lane_day_sbros.py
          # 8/8: до переноса порог рубит, после -- просадка ноль, порог ОСТАЛСЯ
          # порогом (новая просадка 2.1 снова рубит), и возврат из копии, если
          # перечитанный файл не сошёлся.
          python3 deploy/checks/lane_day_sbros.py --self-test | tail -2

      - name: "sbros: перенести начало отсчёта на сейчас (баланс берётся ПО ЦЕПИ)"
        if: ${{ inputs.sbros_otschota == 'yes' }}
        env:
          PRICHINA: ${{ inputs.reason }}
        run: |
          set -e
          set -o pipefail
          [ -n "$PRICHINA" ] || { echo "СБОЙ: для переноса отсчёта нужна причина"; exit 1; }
          # ТЕКСТ ПРИЧИНЫ УЕЗЖАЕТ ФАЙЛОМ, а не знаками в команде root: так уже
          # ломалась правка групп 04.10 (апостроф в свободном тексте).
          printf '%s\n' "$PRICHINA" > /tmp/lane_day_prichina.txt
          ssh $SSH_OPTS root@127.0.0.1 "cat > /tmp/lane_day_sbros.py" < deploy/checks/lane_day_sbros.py
          ssh $SSH_OPTS root@127.0.0.1 "cat > /tmp/lane_day_prichina.txt" < /tmp/lane_day_prichina.txt
          ssh -n $SSH_OPTS root@127.0.0.1 "
            set -e
            set -a; . /etc/bloom-executor/env; set +a
            cd $CODE_DIR
            $VENV /tmp/lane_day_sbros.py --sbros --prichina-fajl /tmp/lane_day_prichina.txt
            chown bot:bot $STATE_DIR/lane_day.json 2>/dev/null || true
            ls -l $STATE_DIR/lane_day.json*
            rm -f /tmp/lane_day_sbros.py /tmp/lane_day_prichina.txt"

      - name: "clear: снять рубильник (прежняя причина сохраняется)"
        if: ${{ inputs.mode == 'clear' }}
        run: |
          set -e
          reason_text='${{ inputs.reason }}'
          ssh -n $SSH_OPTS root@127.0.0.1 "
            F=$STATE_DIR/KILL_OWN_SEND
            if [ ! -f \"\$F\" ]; then echo 'рубильника и не было -- снимать нечего'; exit 0; fi
            cp -a \"\$F\" \"\$F.snyat.\$(date -u +%Y%m%dT%H%M%SZ)\"
            printf 'снимаю, прежняя причина: '; head -c 400 \"\$F\"; echo
            rm -f \"\$F\"
            echo 'рубильник снят, причина снятия: $reason_text'
            ls -l \$(dirname \"\$F\")/KILL_OWN_SEND* 2>/dev/null || echo 'файла KILL_OWN_SEND больше нет'"

      - name: "Строка владельцу в Telegram (по запросу)"
        if: ${{ inputs.mode == 'set' && inputs.telegram == 'yes' }}
        run: |
          set -e
          # ТОКЕН ОСТАЁТСЯ НА ХОСТЕ. Он берётся из /etc/bloom-executor/env уже
          # внутри удалённой оболочки, поэтому в журнал прогона попадает только
          # имя переменной, а не значение. В ответе API токена нет.
          # Правило владельца: денежная странность -- строка в Telegram, а не
          # молчание; когда рубильник ставит сама служба, строку посылает она,
          # а когда снаружи -- вот этот шаг.
          reason_text='${{ inputs.reason }}'
          ssh -n $SSH_OPTS root@127.0.0.1 "
            set -a; . /etc/bloom-executor/env; set +a
            if [ -z \"\$TELEGRAM_BOT_TOKEN\" ] || [ -z \"\$TELEGRAM_CHAT_ID\" ]; then
              echo 'Telegram не настроен на хосте -- строка не ушла'; exit 0
            fi
            code=\$(curl -s -o /tmp/tg_lane_kill.out -w '%{http_code}' \
              -X POST \"https://api.telegram.org/bot\$TELEGRAM_BOT_TOKEN/sendMessage\" \
              --data-urlencode chat_id=\"\$TELEGRAM_CHAT_ID\" \
              --data-urlencode text='ТРЕВОГА: полоса своей отправки ОСТАНОВЛЕНА. Причина: $reason_text Снимать только владельцу.')
            echo \"telegram http \$code\"
            head -c 200 /tmp/tg_lane_kill.out; echo
            rm -f /tmp/tg_lane_kill.out"

      - name: "Служба видит рубильник (признак жизни)"
        if: ${{ always() }}
        run: |
          set -e
          # Признак жизни пишется раз в пульс: ждём до 40 с и печатаем lane_kill
          # так, как его видит САМА служба. Файл на диске и мнение службы
          # обязаны совпадать, иначе рубильник не рубильник.
          # ЖДЁМ РАЗНОГО В ЗАВИСИМОСТИ ОТ РЕЖИМА: после set служба обязана
          # увидеть рубильник (true), после clear -- перестать его видеть
          # (false). Одинаковое ожидание врало бы в одном из двух случаев.
          mode_now='${{ inputs.mode }}'
          # ЖДЁМ ДО ПОДТВЕРЖДЕНИЯ СЛУЖБЫ, А НЕ 40 СЕКУНД (слово владельца
          # 29.09). Прежний цикл ждал 8 раз по 5 с и молча заканчивался: 15:30Z
          # он восемь раз напечатал lane_kill false, тогда как файл уже лежал, и
          # прогон завершился "успехом" -- ложноотрицательная проверка на
          # рубильнике недопустима. Теперь: ждём до PREDEL_S секунд, и если
          # служба так и не подтвердила -- job ПАДАЕТ.
          podtverzhdeno=net
          PREDEL_S=180
          SHAG_S=5
          proshlo=0
          # ПЕЧАТАЕМ ТОЛЬКО ИЗМЕНЕНИЯ. Прежний цикл выводил пять строк признака
          # жизни каждые пять секунд -- за 180 с это 180 строк, в которых
          # тонули сообщения предыдущих шагов (06.10 именно так потерялась
          # причина падения гейта самопроверок).
          proshloe=""
          while [ "$proshlo" -lt "$PREDEL_S" ]; do
            out=$(ssh -n $SSH_OPTS root@127.0.0.1 "grep -A4 '\"lane_kill\"' $STATE_DIR/detector_status.json || true")
            if [ "$out" != "$proshloe" ]; then echo "$out"; proshloe="$out"; fi
            case "$mode_now" in
              clear) case "$out" in *false*) echo "служба больше не видит рубильник"; podtverzhdeno=da ;; esac ;;
              status) podtverzhdeno=da ;;
              *) case "$out" in *true*) echo "служба видит рубильник"; podtverzhdeno=da ;; esac ;;
            esac
            [ "$podtverzhdeno" = da ] && break
            sleep "$SHAG_S"
            proshlo=$((proshlo + SHAG_S))
          done
          if [ "$podtverzhdeno" != da ]; then
            echo "SBOY: sluzhba ne podtverdila sostojanie rubilnika za $PREDEL_S s (rezhim $mode_now)"
            exit 1
          fi
          echo "podtverzhdeno sluzhboj za $proshlo s"
