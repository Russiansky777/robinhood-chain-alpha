name: "Solana crowd_night -- самоходный процесс п.2 (толпа за 90 кошельками)"

# Владелец: п.2 не должен зависеть от внешних пробуждений. Cron-триггеры
# GitHub Actions запускаются ТОЛЬКО с версии workflow-файла на branch по
# умолчанию (main) -- это ограничение платформы, не выбор. Поэтому этот
# файл лежит и на main (только он, без остального кода/данных этой
# ветки), и checkout здесь явно указывает на claude/nifty-sagan-r0polg --
# вся работа и все коммиты идут именно в неё, main используется только
# как носитель расписания.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

concurrency:
  group: crowd_night
  cancel-in-progress: false

jobs:
  night:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/nifty-sagan-r0polg
      - name: Git identity + нормализация ветки
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B claude/nifty-sagan-r0polg origin/claude/nifty-sagan-r0polg
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests
      - name: "Шаг п.2 (control/scan, бюджет 20 мин из отведённых 25)"
        env:
          ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
        run: python -u analysis/solana_crowd_night.py
      - name: Commit results
        if: always()
        run: |
          [ -e data/night_status.json ] && git add data/night_status.json
          [ -e data/solana_fomo_crowd.json ] && git add data/solana_fomo_crowd.json
          git diff --cached --quiet && exit 0
          git commit -m "Solana crowd_night: шаг [automated]"
          for i in 1 2 3 4 5; do
            git push origin HEAD:claude/nifty-sagan-r0polg && exit 0
            echo "push rejected, попытка $i/5 -- git pull --rebase и повтор"
            git pull --rebase origin claude/nifty-sagan-r0polg
            sleep 3
          done
          echo "не удалось запушить после 5 попыток" >&2
          exit 1
