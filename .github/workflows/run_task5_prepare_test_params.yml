name: "Задача 5, $5-тест -- подготовка CycleParams для реальной пары пулов (read-only, без подписи)"

# Готовит data/task5_test_params.json: реальная пара V3-пулов WETH/USDG,
# СВЕЖИЕ текущие цены (eth_call slot0/liquidity через Ohio), minProfit
# заведомо недостижим -- ожидается revert InsufficientProfit ПОСЛЕ
# реального исполнения flash-swap+встречного свопа. Только read-only
# RPC, НИКАКОЙ подписи/отправки -- сборку и отправку делает владелец
# своим скриптом.

on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/nifty-sagan-r0polg
    paths:
      - "data/p3_guard_cache/TASK5_PREPARE_TEST_PARAMS_REQUEST"

jobs:
  prepare_test_params:
    name: "CycleParams для $5-теста (Ohio VPS)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: SSH key + known_hosts
        env:
          VPS_SSH_KEY_OHIO: ${{ secrets.VPS_SSH_KEY_OHIO }}
        run: |
          set -e
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY_OHIO" > ~/.ssh/vps_key_ohio
          chmod 600 ~/.ssh/vps_key_ohio
          ssh-keyscan -T 10 3.151.160.108 >> ~/.ssh/known_hosts 2>/dev/null
          echo "SSH_OPTS=-i $HOME/.ssh/vps_key_ohio -o ConnectTimeout=15 -o BatchMode=yes -o StrictHostKeyChecking=accept-new" >> "$GITHUB_ENV"

      - name: Подтянуть код и посчитать CycleParams на реальных текущих ценах
        run: |
          ssh $SSH_OPTS ubuntu@3.151.160.108 '
            set -e
            sudo -u bot git -C /home/bot/robinhood-chain-alpha fetch origin claude/nifty-sagan-r0polg
            sudo -u bot git -C /home/bot/robinhood-chain-alpha checkout claude/nifty-sagan-r0polg
            sudo -u bot git -C /home/bot/robinhood-chain-alpha reset --hard origin/claude/nifty-sagan-r0polg
            sudo -u bot bash -c "
              set -e
              cd /home/bot/robinhood-chain-alpha/analysis
              /home/bot/robinhood-chain-alpha/venv/bin/python3 task5_prepare_test_params.py
              cat /home/bot/robinhood-chain-alpha/data/task5_test_params.json
            "
          ' > /tmp/prepare_test_params_stdout.log 2> /tmp/prepare_test_params_stderr.log
          echo "--- stdout ---"; cat /tmp/prepare_test_params_stdout.log
          echo "--- stderr ---"; cat /tmp/prepare_test_params_stderr.log

      - name: Забрать data/task5_test_params.json
        if: always()
        run: |
          ssh $SSH_OPTS ubuntu@3.151.160.108 'sudo -u bot cat /home/bot/robinhood-chain-alpha/data/task5_test_params.json' > /tmp/task5_test_params.json || true

      - name: Commit results
        if: always()
        run: |
          git rm -f --ignore-unmatch data/p3_guard_cache/TASK5_PREPARE_TEST_PARAMS_REQUEST
          if [ -s /tmp/task5_test_params.json ] && python3 -c "import json; json.load(open('/tmp/task5_test_params.json'))" 2>/dev/null; then
            mkdir -p data
            cp /tmp/task5_test_params.json data/task5_test_params.json
            git add data/task5_test_params.json
          fi
          git diff --cached --quiet && exit 0
          git commit -m "Задача 5: CycleParams для $5-теста (InsufficientProfit, реальные текущие цены) [automated]"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected, попытка $i/5 -- git pull --rebase и повтор"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep 3
          done
          echo "не удалось запушить после 5 попыток" >&2
          exit 1
