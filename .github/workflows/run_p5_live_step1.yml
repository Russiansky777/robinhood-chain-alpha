name: P5 LIVE Step 1 -- открыть LP + захеджировать (ETH/USDG)

# По умолчанию (маркер DRYRUN) -- НИЧЕГО не отправляет, только считает и
# печатает план. Реальная отправка -- ТОЛЬКО через отдельный маркер
# CONFIRM, который создаётся отдельным явным коммитом после проверки
# dry-run отчёта. См. docstring analysis/p5_live_step1.py.
on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/sc1-pons-v2-launcher-efdbyt
    paths:
      - "data/p3_guard_cache/P5_LIVE_STEP1_DRYRUN_REQUEST"
      - "data/p3_guard_cache/P5_LIVE_STEP1_CONFIRM_REQUEST"

jobs:
  step1:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r analysis/requirements.txt
          pip install git+https://github.com/elliottech/lighter-python.git

      - name: Определить режим (dry-run по умолчанию, real только если есть CONFIRM-маркер)
        id: mode
        run: |
          # НЕ полагаемся на "маркер в ПОСЛЕДНЕМ коммите" через git log --
          # ненадёжно на shallow-clone (checkout@v4 default fetch-depth=1,
          # см. run_p5_live_step1_vps.yml для полного разбора реального
          # инцидента 2026-09-03: shallow-клон без родителя коммита
          # заставляет git log -1 --name-only печатать ВСЕ файлы в дереве).
          # Только существование файла + удаление сразу после
          # использования (шаг Commit results).
          if [ -e data/p3_guard_cache/P5_LIVE_STEP1_CONFIRM_REQUEST ]; then
            echo "flag=--confirm-mainnet" >> "$GITHUB_OUTPUT"
            echo "РЕЖИМ: РЕАЛЬНАЯ ОТПРАВКА"
          else
            echo "flag=" >> "$GITHUB_OUTPUT"
            echo "РЕЖИМ: DRY-RUN"
          fi

      - name: Step 1 (mint + hedge)
        env:
          PRIVATE_KEY_NOX: ${{ secrets.PRIVATE_KEY_NOX }}
          LIGHTER_API_KEY_PUBLIC: ${{ secrets.LIGHTER_API_KEY_PUBLIC }}
          LIGHTER_API_KEY_PRIVATE: ${{ secrets.LIGHTER_API_KEY_PRIVATE }}
          ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
        run: python -u analysis/p5_live_step1.py ${{ steps.mode.outputs.flag }}

      - name: Commit results
        if: always()
        run: |
          git rm -f --ignore-unmatch data/p3_guard_cache/P5_LIVE_STEP1_CONFIRM_REQUEST data/p3_guard_cache/P5_LIVE_STEP1_DRYRUN_REQUEST
          [ -e data/p3_guard_cache/p5_live_step1_result.json ] && git add data/p3_guard_cache/p5_live_step1_result.json
          [ -e data/p5_live_log.jsonl ] && git add data/p5_live_log.jsonl
          git diff --cached --quiet && exit 0
          git commit -m "P5 LIVE Step 1: результат (mode=${{ steps.mode.outputs.flag }}) [automated]"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected, попытка $i/5 -- git pull --rebase и повтор"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep 3
          done
          echo "не удалось запушить после 5 попыток" >&2
          exit 1
