name: "Bloom: раскладка покупок по времени и месту в блоке (только чтение)"

# Отвечает на два вопроса владельца фактами: сколько мс съедает площадка и в
# какой части блока садится наша транзакция. Журналы копируются с хоста
# только на чтение, в цепь идут getTransaction и getBlock.
on:
  workflow_dispatch:
    inputs:
      only:
        description: "подписи или client_order_id через запятую (пусто -- все покупки)"
        required: false
        default: ""

concurrency:
  group: bloom-timing
  cancel-in-progress: false

env:
  HOST: 45.59.170.76
  STATE_DIR: /home/bot/bloom_executor_live_data

jobs:
  timing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/nifty-sagan-r0polg

      - name: "Самопроверка до сети"
        run: |
          set -e
          python3 analysis/bloom_timing_breakdown.py --self-test

      - name: "SSH key"
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -e
          [ -n "$VPS_SSH_KEY" ] || { echo "VPS_SSH_KEY не задан"; exit 1; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          echo "SSH_OPTS=-i $HOME/.ssh/vps_key -o ConnectTimeout=15 -o BatchMode=yes -o StrictHostKeyChecking=accept-new" >> $GITHUB_ENV

      - name: "Копия журналов и раскладка"
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API }}
          BLOOM_STATE_DIR: /tmp/bloom_state
        run: |
          set -e
          pip install -q requests
          mkdir -p /tmp/bloom_state
          for f in decisions.jsonl positions.jsonl; do
            ssh -n $SSH_OPTS root@$HOST "cat $STATE_DIR/$f" > "/tmp/bloom_state/$f"
            echo "$f: $(wc -c < /tmp/bloom_state/$f) байт"
          done
          ARGS=""
          if [ -n "${{ inputs.only }}" ]; then
            for X in $(echo "${{ inputs.only }}" | tr ',' ' '); do
              ARGS="$ARGS --only $X"
            done
          fi
          python3 analysis/bloom_timing_breakdown.py $ARGS

      - name: "Коммит раскладки"
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in data/bloom_timing_breakdown.json data/bloom_timing_breakdown.txt; do
            [ -f "$f" ] && git add "$f"
          done
          git diff --cached --quiet && { echo "нечего коммитить"; exit 0; }
          git commit -m "Bloom: раскладка покупок по времени и месту в блоке [automated]"
          for i in 1 2 3 4 5; do
            git push origin HEAD:claude/nifty-sagan-r0polg && exit 0
            git pull --rebase -X theirs origin claude/nifty-sagan-r0polg
            sleep 3
          done
          exit 1
