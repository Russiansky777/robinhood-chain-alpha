name: "Консолидация активов -- проверка адреса Uniswap V3 SwapRouter02 на Base (только чтение)"

on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/sc1-pons-v2-launcher-efdbyt
    paths:
      - "data/p3_guard_cache/ASSET_CONSOLIDATION_ROUTER_PROBE_REQUEST"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r analysis/requirements.txt
      - name: "Проверка SwapRouter02 (только чтение)"
        run: python -u analysis/asset_consolidation_router_probe.py
      - name: Commit results
        if: always()
        run: |
          git rm -f --ignore-unmatch data/p3_guard_cache/ASSET_CONSOLIDATION_ROUTER_PROBE_REQUEST
          [ -e data/p3_guard_cache/asset_consolidation_router_probe_result.json ] && git add data/p3_guard_cache/asset_consolidation_router_probe_result.json
          git diff --cached --quiet && exit 0
          git commit -m "Консолидация активов: проверка SwapRouter02, результат [automated]"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected, попытка $i/5 -- git pull --rebase и повтор"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep 3
          done
          echo "не удалось запушить после 5 попыток" >&2
          exit 1
