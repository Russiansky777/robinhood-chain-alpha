name: "Робинхуд -- детектор настоящих замкнутых циклов (метод с Arc, n_legs/треугольные)"

on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/nifty-sagan-r0polg
    paths:
      - "data/p3_guard_cache/RH_CLOSED_CYCLE_DETECTOR_REQUEST"

jobs:
  closed_cycles:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r analysis/requirements.txt
      - name: "Скан пулов (полная история) + свопы (выборка блоков) + верификация циклов + живучесть"
        env:
          ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
          ALCHEMY_ROBINHOOD_RPC_URL: ${{ secrets.ALCHEMY_ROBINHOOD_RPC_URL }}
        run: python -u analysis/task_rh_closed_cycle_detector.py
      - name: Commit results
        if: always()
        run: |
          git rm -f --ignore-unmatch data/p3_guard_cache/RH_CLOSED_CYCLE_DETECTOR_REQUEST
          [ -e data/task_rh_closed_cycles_result.json ] && git add data/task_rh_closed_cycles_result.json
          [ -e data/task_rh_pool_map_cache.json ] && git add data/task_rh_pool_map_cache.json
          git diff --cached --quiet && exit 0
          git commit -m "Робинхуд замкнутые циклы (n_legs/треугольные): результат [automated]"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected, попытка $i/5 -- git pull --rebase и повтор"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep 3
          done
          echo "не удалось запушить после 5 попыток" >&2
          exit 1
