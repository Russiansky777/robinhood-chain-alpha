name: "GMGN через Apify: выгрузка лидербордов"

# ЗАЧЕМ. Ширина кошельков для сита Code-2: GMGN отдаёт не больше 100 строк на
# запрос, поэтому охват берётся КОМБИНАЦИЯМИ (тип трейдера x сортировка).
# Актор maximedupre/gmgn-copytrade-wallet-scraper, оплата за результат --
# 0.00375 $ за кошелёк; первый проход это 12 запусков, около 4.5 $.
#
# ДЕНЬГИ. Потолок прохода стоит В СКРИПТЕ и проверяется ДО каждого запроса по
# худшему случаю: не больше 20 запросов и не дороже 8 $. Поднять его можно только
# входами этого прогона, то есть руками и сознательно.
#
# СЕКРЕТЫ. Нужен РОВНО ОДИН -- APIFY_TOKEN, и он идёт в окружение шага, а не в
# командную строку: аргументы видны и в журнале прогона, и в списке процессов.
# Ключей кошельков здесь нет и быть не должно: скрипт только читает лидерборды.
#
# ПРОБНЫЙ ЗАПУСК ПЕРЕД ПРОХОДОМ -- 5 кошельков (около 0.02 $). Он проверяет, что
# столбцы walletAddress, followCount, buys7d, winRate7d, pnl7d и tags заполнены:
# имена полей у актора могут поменяться со сборкой, и платить 4.5 $ за пустые
# столбцы незачем. Пробный запуск упал -- проход не идёт.
on:
  workflow_dispatch:
    inputs:
      rezhim:
        description: "proba (5 кошельков) или prohod (12 комбинаций по 100)"
        required: false
        default: "prohod"
      max_wallets:
        description: "строк на запрос (GMGN отдаёт не больше 100)"
        required: false
        default: "100"
      predel_zaprosov:
        description: "потолок запросов на проход"
        required: false
        default: "20"
      predel_rashoda:
        description: "потолок расхода на проход, $"
        required: false
        default: "8"
  schedule:
    # Раз в неделю, понедельник 06:00 UTC.
    - cron: "0 6 * * 1"

concurrency:
  group: gmgn-apify
  cancel-in-progress: false

jobs:
  vygruzka:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/stroiteli

      - name: "Самопроверка скрипта (без сети и без токена)"
        run: python3 analysis/c3_gmgn_apify.py --self-test

      - name: "Пробный запуск: 5 кошельков, проверка столбцов"
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          set -e
          if [ -z "$APIFY_TOKEN" ]; then
            echo "СБОЙ: секрет APIFY_TOKEN не задан"
            exit 1
          fi
          python3 analysis/c3_gmgn_apify.py --proba

      - name: "Проход по комбинациям"
        if: ${{ github.event_name == 'schedule' || inputs.rezhim == 'prohod' }}
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          set -e
          python3 analysis/c3_gmgn_apify.py --prohod \
            --max-wallets "${{ inputs.max_wallets || '100' }}" \
            --predel-zaprosov "${{ inputs.predel_zaprosov || '20' }}" \
            --predel-rashoda "${{ inputs.predel_rashoda || '8' }}"

      - name: "Коммит выгрузки, сырых строк и страницы"
        if: always()
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/gmgn docs/gmgn_*.md 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "менять нечего -- коммита нет"
            exit 0
          fi
          git commit -m "GMGN через Apify: выгрузка лидербордов [automated]"
          for N in 1 2 3 4; do
            if git push origin HEAD:claude/stroiteli; then
              exit 0
            fi
            git pull --rebase origin claude/stroiteli || true
            sleep $((2 ** N))
          done
          echo "СБОЙ: push не прошёл"
          exit 1
