name: "Тренд по цепи -- этап Б: почасовой backfill (feeGrowthGlobal/liquidity/price), резюмируемый"

on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/nifty-sagan-r0polg
    paths:
      - "data/p3_guard_cache/RH_VOLUME_TREND_HOURLY_BACKFILL_REQUEST"

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r analysis/requirements.txt
      - name: "почасовой backfill -- round-robin по 23 реальным пулам, чекпоинт, резюмируется"
        env:
          ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
          ALCHEMY_ROBINHOOD_RPC_URL: ${{ secrets.ALCHEMY_ROBINHOOD_RPC_URL }}
        run: python -u analysis/rh_volume_trend_hourly_backfill.py
      - name: Commit results
        if: always()
        run: |
          git rm -f --ignore-unmatch data/p3_guard_cache/RH_VOLUME_TREND_HOURLY_BACKFILL_REQUEST
          [ -e data/rh_volume_trend_hourly_state.json ] && git add data/rh_volume_trend_hourly_state.json
          git diff --cached --quiet && exit 0
          git commit -m "Тренд по цепи: почасовой backfill, прогресс [automated]"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected, попытка $i/5 -- git pull --rebase и повтор"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep 3
          done
          echo "не удалось запушить после 5 попыток" >&2
          exit 1
