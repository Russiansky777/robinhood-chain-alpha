name: "Solana buyer_200 -- проверка ключа DUNE_JANA_API"

on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/nifty-sagan-r0polg
    paths:
      - "data/p3_guard_cache/SOLANA_DUNE_JANA_KEY_CHECK_REQUEST"

jobs:
  jana_key_check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests
      - name: "Проверка ключа DUNE_JANA_API"
        env:
          DUNE_JANA_API: ${{ secrets.DUNE_JANA_API }}
        run: python -u analysis/solana_dune_jana_key_check.py
      - name: Commit results
        if: always()
        run: |
          git rm -f --ignore-unmatch data/p3_guard_cache/SOLANA_DUNE_JANA_KEY_CHECK_REQUEST
          [ -e data/solana_dune_jana_key_check.json ] && git add data/solana_dune_jana_key_check.json
          git diff --cached --quiet && exit 0
          git commit -m "Solana buyer_200: проверка ключа DUNE_JANA_API -- результат [automated]"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected, попытка $i/5 -- git pull --rebase и повтор"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep 3
          done
          echo "не удалось запушить после 5 попыток" >&2
          exit 1
