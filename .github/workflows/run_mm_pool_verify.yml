name: MM -- проверка пулов от владельца (GeckoTerminal) + аномалия цены DELL/USO

# Владелец, 2026-09-03: адреса пулов найдены вручную через GeckoTerminal,
# нужна проверка одним вызовом на кандидата + разбор цены DELL/USO.
# Только чтение, ключ не используется, транзакций нет. Дёшево (~15-25
# вызовов) -- без лимита времени, ожидаемо секунды-минуты.
on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/sc1-pons-v2-launcher-efdbyt
    paths:
      - "data/p3_guard_cache/MM_POOL_VERIFY_REQUEST"

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r analysis/requirements.txt

      - name: Verify pools + DELL/USO price anomaly
        run: python -u analysis/mm_pool_verify.py

      - name: Commit results
        if: always()
        run: |
          [ -e data/p3_guard_cache/mm_pool_verify_result.json ] && git add data/p3_guard_cache/mm_pool_verify_result.json
          git diff --cached --quiet && exit 0
          git commit -m "MM: проверка пулов владельца + DELL/USO price anomaly [automated]"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected, попытка $i/5 -- git pull --rebase и повтор"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep 3
          done
          echo "не удалось запушить после 5 попыток" >&2
          exit 1
