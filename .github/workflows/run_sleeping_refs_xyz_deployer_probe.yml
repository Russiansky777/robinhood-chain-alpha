name: "Спящие референсы -- кто такой xyz (деплойер/оракул/комиссии/делистинг HL), 0 кредитов"

on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/sc1-pons-v2-launcher-efdbyt
    paths:
      - "data/p3_guard_cache/SLEEPING_REFS_XYZ_DEPLOYER_PROBE_REQUEST"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r analysis/requirements.txt
          pip install playwright
          playwright install --with-deps chromium
      - name: "Кто такой xyz -- деплойер/оракул/комиссии/делистинг (только чтение, 0 кредитов)"
        run: python -u analysis/sleeping_refs_xyz_deployer_probe.py
      - name: Commit results
        if: always()
        run: |
          git rm -f --ignore-unmatch data/p3_guard_cache/SLEEPING_REFS_XYZ_DEPLOYER_PROBE_REQUEST
          [ -e data/p3_guard_cache/sleeping_refs_xyz_deployer_probe_result.json ] && git add data/p3_guard_cache/sleeping_refs_xyz_deployer_probe_result.json
          git diff --cached --quiet && exit 0
          git commit -m "Спящие референсы: кто такой xyz, результат [automated]"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected, попытка $i/5 -- git pull --rebase и повтор"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep 3
          done
          echo "не удалось запушить после 5 попыток" >&2
          exit 1
