name: "Podbivka-2: TG-kanaly kollov (tolko chtenie)"

# ZACHEM. Punkt 2 zadachi vladelca 09.10: publichnye TG-kanaly kollov memkoinov Solana.
# Set kontejnera sessii zapreschaet t.me, tgstat.ru i telemetr.me (403 na CONNECT), a u
# oblachnogo beguneka internet otkryt. Otdelnyy progon, a ne marker zadachi: u zadachi
# ochered zanyata tyazhyolym prohodom zapuskov na 17 sutok, a vladelec prosil TG "srazu,
# parallelno V". Odno zadanie, tolko set, bez Shyft i Helius -- beguneki Code-1 ne zadevaet.
#
# Marker: data/podbivka/zapusk/tg_sbor.json -- {"rezhimy": ["katalog", "istoriya"], "s": "..."}.
# Oba rezhima idut PODRYAD v odnom zadanii, poetomu istoriya vidit spisok kanalov, kotoryy
# tolko chto zapisal katalog.
on:
  push:
    branches:
      - claude/podbivka
    paths:
      - "data/podbivka/zapusk/tg_sbor.json"
  workflow_dispatch:

concurrency:
  group: podbivka2-tg
  cancel-in-progress: false

jobs:
  sbor:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/podbivka

      - name: "Python venv with requests and solders"
        run: |
          set -e
          python3 -m venv "$RUNNER_TEMP/pod_venv"
          "$RUNNER_TEMP/pod_venv/bin/pip" install -q requests solders
          echo "PY=$RUNNER_TEMP/pod_venv/bin/python" >> "$GITHUB_ENV"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: "Run collector"
        env:
          PODB_MANIFEST: ${{ runner.temp }}/manifest.txt
        run: |
          set -e
          M=data/podbivka/zapusk/tg_sbor.json
          REZH=$($PY -c "import json;print(' '.join(json.load(open('$M')).get('rezhimy') or ['katalog']))")
          S=$($PY -c "import json;print(json.load(open('$M')).get('s') or '2026-09-21T00:00:00Z')")
          K=$($PY -c "import json;print(json.load(open('$M')).get('kanaly') or '')")
          for r in $REZH; do
            echo "--- rezhim $r"
            if [ "$r" = "istoriya" ]; then
              $PY analysis/podbivka_tg_sbor.py --rezhim istoriya --s "$S" --kanaly "$K"
            else
              $PY analysis/podbivka_tg_sbor.py --rezhim "$r"
            fi
          done

      - name: "Final commit"
        if: always()
        env:
          PODB_MANIFEST: ${{ runner.temp }}/manifest.txt
        run: |
          set -e
          if [ -s "$PODB_MANIFEST" ]; then
            sort -u "$PODB_MANIFEST" > "$RUNNER_TEMP/mine.txt"
            for i in 1 2 3 4 5 6 7 8; do
              git fetch -q --depth=1 origin claude/podbivka
              git reset -q FETCH_HEAD
              xargs -a "$RUNNER_TEMP/mine.txt" -d '\n' git add -- || true
              git diff --cached --quiet && { echo "already on branch"; exit 0; }
              git commit -q -m "Podbivka-2: tg_sbor [automated]"
              git push -q origin HEAD:claude/podbivka && exit 0
              sleep 4
            done
            exit 1
          fi
          echo "nothing in manifest"
