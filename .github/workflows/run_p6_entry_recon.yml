name: "P6 -- разведка перед входом (реальный NFPM/Router/токены/балансы, только чтение)"

on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/sc1-pons-v2-launcher-efdbyt
    paths:
      - "data/p3_guard_cache/P6_ENTRY_RECON_REQUEST"

jobs:
  recon:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r analysis/requirements.txt
      - name: Разведка -- реальный NFPM/Router (по совпадению factory()), токены, балансы
        run: python -u analysis/p6_entry_recon.py
      - name: Commit results
        if: always()
        run: |
          [ -e data/p3_guard_cache/p6_entry_recon_result.json ] && git add data/p3_guard_cache/p6_entry_recon_result.json
          git diff --cached --quiet && exit 0
          git commit -m "P6: разведка перед входом (NFPM/Router/токены/балансы) [automated]"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected, попытка $i/5 -- git pull --rebase и повтор"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep 3
          done
          echo "не удалось запушить после 5 попыток" >&2
          exit 1
