name: "Solana buyer_200 -- калибровка лидера на исходном окне (classify vs сырое)"

# Резюмируемо (кэш сырых транзакций сохраняется до завершения скана,
# затем убирается из финального файла).

on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/nifty-sagan-r0polg
    paths:
      - "data/p3_guard_cache/SOLANA_LEADER_CALIBRATION_SAME_WINDOW_REQUEST"

jobs:
  leader_calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests
      - name: "Калибровка на исходном окне"
        env:
          ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
        run: python -u analysis/solana_leader_calibration_same_window.py
      - name: Commit results
        if: always()
        run: |
          git rm -f --ignore-unmatch data/p3_guard_cache/SOLANA_LEADER_CALIBRATION_SAME_WINDOW_REQUEST
          [ -e data/solana_leader_calibration_same_window.json ] && git add data/solana_leader_calibration_same_window.json
          git diff --cached --quiet && exit 0
          git commit -m "Solana buyer_200: калибровка лидера на исходном окне -- прогресс [automated]"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected, попытка $i/5 -- git pull --rebase и повтор"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep 3
          done
          echo "не удалось запушить после 5 попыток" >&2
          exit 1
