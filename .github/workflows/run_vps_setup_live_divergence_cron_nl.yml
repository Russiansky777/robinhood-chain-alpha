name: "Расхождение площадок -- VPS Нидерланды: автономный ежеминутный cron (только приложение, SSH/ufw/firewall/ключи не трогает)"

# Владелец, 2026-09-06, проверка 3: "Cron на NL-хосте, каждую минуту,
# пять тикеров: лучшие bid/ask на обеих площадках, глубина на $5000 в
# обе стороны... Строка cron для п.3 -- новая, :*/1, отдельный файл."
# По образцу run_vps_setup_turnover_watch_cron_nl.yml -- собранный ряд
# живёт ВНЕ git-репозитория (/home/bot/sleeping_refs_live_data/
# live_divergence.jsonl), git на VPS не используется. ЧИТАЕТ текущий
# crontab и ДОПИСЫВАЕТ новую строку (*/1 * * * *), не заменяет его.
# Существующая строка ":51" (turnover_watch) -- ПРОВЕРЯЕТСЯ ДО и ПОСЛЕ,
# не трогается.
on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/sc1-pons-v2-launcher-efdbyt
    paths:
      - "data/p3_guard_cache/VPS_SETUP_LIVE_DIVERGENCE_CRON_NL_REQUEST"

jobs:
  setup_cron:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: SSH key + known_hosts
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -e
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -T 10 45.59.170.76 >> ~/.ssh/known_hosts 2>/dev/null
          echo "SSH_OPTS=-i $HOME/.ssh/vps_key -o ConnectTimeout=15 -o BatchMode=yes -o StrictHostKeyChecking=accept-new" >> "$GITHUB_ENV"

      - name: "0. ПРОВЕРКА ПЕРЕД ИЗМЕНЕНИЕМ: текущий crontab bot -- убедиться, что строка :51 (turnover_watch) на месте"
        run: |
          ssh $SSH_OPTS root@45.59.170.76 '
            echo "=== текущий crontab bot ДО изменений ==="
            sudo -u bot crontab -l || echo "(crontab пуст или не существует)"
          '

      - name: "1. Обновить код репозитория у bot (reset --hard -- безопасно, накопленные ряды живут вне репо)"
        run: |
          ssh $SSH_OPTS root@45.59.170.76 '
            set -e
            sudo -u bot git -C /home/bot/robinhood-chain-alpha fetch origin claude/sc1-pons-v2-launcher-efdbyt
            sudo -u bot git -C /home/bot/robinhood-chain-alpha checkout claude/sc1-pons-v2-launcher-efdbyt
            sudo -u bot git -C /home/bot/robinhood-chain-alpha reset --hard origin/claude/sc1-pons-v2-launcher-efdbyt
            sudo -u bot /home/bot/robinhood-chain-alpha/venv/bin/pip install -q -r /home/bot/robinhood-chain-alpha/analysis/requirements.txt
            sudo -u bot git -C /home/bot/robinhood-chain-alpha log -1 --oneline
          '

      - name: "2. Внешняя директория для живого файла (вне git, LIVE_DIVERGENCE_OUT указывает прямо туда -- копирования туда-обратно не нужно)"
        run: |
          ssh $SSH_OPTS root@45.59.170.76 '
            set -e
            sudo -u bot mkdir -p /home/bot/sleeping_refs_live_data
            sudo -u bot touch /home/bot/sleeping_refs_live_data/live_divergence.jsonl
            echo "текущих строк: $(wc -l < /home/bot/sleeping_refs_live_data/live_divergence.jsonl)"
          '

      - name: "3. Обёрточный скрипт cron'а (идемпотентно перезаписывается)"
        run: |
          ssh $SSH_OPTS root@45.59.170.76 'mkdir -p /home/bot/bin && cat > /home/bot/bin/sleeping_refs_live_divergence_minute.sh && chown bot:bot /home/bot/bin/sleeping_refs_live_divergence_minute.sh && chmod +x /home/bot/bin/sleeping_refs_live_divergence_minute.sh' <<'EOF'
          #!/bin/bash
          # Ежеминутный сбор исполнимого расхождения (bid/ask + глубина
          # $5000, обе площадки, 5 тикеров) -- ТОЛЬКО чтение публичных API,
          # без git push. Живой ряд -- ВНЕ git-репозитория
          # (/home/bot/sleeping_refs_live_data/live_divergence.jsonl),
          # путь передаётся скрипту напрямую через LIVE_DIVERGENCE_OUT --
          # копирования файла туда-обратно не требуется (в отличие от
          # p5/funding/turnover_watch, у которых путь жёстко в репозитории).
          set -euo pipefail

          REPO=/home/bot/robinhood-chain-alpha
          export LIVE_DIVERGENCE_OUT=/home/bot/sleeping_refs_live_data/live_divergence.jsonl

          cd "$REPO"
          "$REPO/venv/bin/python" -u analysis/sleeping_refs_live_divergence_collector.py
          EOF

      - name: "4. Crontab bot -- ДОПИСАТЬ новую строку (*/1 * * * *) к существующим, НЕ заменить (через файл, не stdin-pipe)"
        run: |
          ssh $SSH_OPTS root@45.59.170.76 '
            set -e
            sudo -u bot mkdir -p /home/bot/robinhood-chain-alpha/logs
            EXISTING=$(sudo -u bot crontab -l 2>/dev/null || true)
            echo "=== существующий crontab (до) ==="
            echo "$EXISTING"
            if ! echo "$EXISTING" | grep -q "turnover_watch_daily.sh"; then
              echo "СТОП: строка turnover_watch (:51) НЕ найдена в текущем crontab -- не продолжаю, чтобы не работать вслепую поверх неожиданного состояния." >&2
              exit 1
            fi
            FILTERED=$(echo "$EXISTING" | grep -vF "sleeping_refs_live_divergence_minute.sh" || true)
            {
              echo "$FILTERED"
              echo "*/1 * * * * /home/bot/bin/sleeping_refs_live_divergence_minute.sh >> /home/bot/robinhood-chain-alpha/logs/sleeping_refs_live_divergence.log 2>&1"
            } > /tmp/bot_cron.txt
            chown bot:bot /tmp/bot_cron.txt
            sudo -u bot crontab /tmp/bot_cron.txt
            rm -f /tmp/bot_cron.txt
            echo "=== raw crontab файл (после) ==="; cat /var/spool/cron/crontabs/bot
            echo "=== crontab -l bot (после) ==="; sudo -u bot crontab -l
            echo "=== проверка: строка turnover_watch (:51) на месте? ==="
            sudo -u bot crontab -l | grep -q "51 9 \* \* \* /home/bot/bin/turnover_watch_daily.sh" && echo "OK: turnover_watch-строка сохранена" || { echo "ОШИБКА: turnover_watch-строка пропала!" >&2; exit 1; }
          '

      - name: "5. Разовый тестовый прогон вручную (подтвердить механизм сразу, не ждать первого тика)"
        run: |
          ssh $SSH_OPTS root@45.59.170.76 '
            set -e
            sudo -u bot /home/bot/bin/sleeping_refs_live_divergence_minute.sh
            echo "=== хвост внешнего живого файла ==="
            tail -5 /home/bot/sleeping_refs_live_data/live_divergence.jsonl
            echo "=== число строк ==="
            wc -l /home/bot/sleeping_refs_live_data/live_divergence.jsonl
          '

      - name: Итог
        run: |
          echo "cron сбора расхождения установлен (каждую минуту), turnover_watch (:51) не тронут, первый тестовый прогон прошёл."
          echo "Git на VPS не используется нигде в этом механизме (тот же принцип, что funding/P5/turnover_watch)."
