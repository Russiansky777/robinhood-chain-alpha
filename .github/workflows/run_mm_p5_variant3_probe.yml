name: P5 -- вариант 3 (DefiLlama детальный объём + архивный eth_call)

# Владелец, 2026-09-03: "P5 — продолжать как приоритет №1". Из
# предложенных 4 вариантов начинаем с дешёвого (вариант 3, ~10
# запросов, секунды) -- может удешевить варианты 1/2. Только чтение,
# ключ не используется, транзакций нет.
on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/sc1-pons-v2-launcher-efdbyt
    paths:
      - "data/p3_guard_cache/MM_P5_VARIANT3_PROBE_REQUEST"

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r analysis/requirements.txt

      - name: DefiLlama детальный объём + архивный eth_call
        run: python -u analysis/mm_p5_variant3_probe.py

      - name: Commit results
        if: always()
        run: |
          [ -e data/p3_guard_cache/mm_p5_variant3_probe_result.json ] && git add data/p3_guard_cache/mm_p5_variant3_probe_result.json
          git diff --cached --quiet && exit 0
          git commit -m "P5: DefiLlama детальный объём + архивный eth_call [automated]"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected, попытка $i/5 -- git pull --rebase и повтор"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep 3
          done
          echo "не удалось запушить после 5 попыток" >&2
          exit 1
