name: "Задача 1, п.3 доп. -- тёмное vs светлое, выборка 1ч/4 пула (не full scan), 0 кредитов Dune"

on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/sc1-pons-v2-launcher-efdbyt
    paths:
      - "data/p3_guard_cache/TASK1_DARKWINDOW_VS_LIGHT_SAMPLE_REQUEST"

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r analysis/requirements.txt
      - name: "Тёмное vs светлое -- выборка 1 час x 4 пула на выходные (0 кредитов Dune)"
        run: python -u analysis/task1_darkwindow_vs_light_sample.py
      - name: Commit results
        if: always()
        run: |
          git rm -f --ignore-unmatch data/p3_guard_cache/TASK1_DARKWINDOW_VS_LIGHT_SAMPLE_REQUEST
          [ -e data/p3_guard_cache/task1_darkwindow_vs_light_sample_result.json ] && git add data/p3_guard_cache/task1_darkwindow_vs_light_sample_result.json
          git diff --cached --quiet && exit 0
          git commit -m "Задача 1 п.3: тёмное vs светлое, выборка, результат [automated]"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected, попытка $i/5 -- git pull --rebase и повтор"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep 3
          done
          echo "не удалось запушить после 5 попыток" >&2
          exit 1
