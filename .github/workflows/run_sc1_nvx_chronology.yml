name: SC1 -- поблочная хронология событий NVX (только чтение, публичный RPC)

# Только чтение (CurveBuy/CurveSell логи + getReserves() по историческим
# блокам) -- никаких транзакций, ключ не требуется и не читается.
on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/sc1-pons-v2-launcher-efdbyt
    paths:
      - "data/p3_guard_cache/SC1_NVX_CHRONOLOGY_REQUEST"

jobs:
  chronology:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r analysis/requirements.txt

      - name: Chronology
        run: python analysis/sc1_nvx_chronology.py

      - name: Commit results
        if: always()
        run: |
          for f in data/p3_guard_cache/sc1_nvx_chronology.json docs/SC1_NVX_CHRONOLOGY.md; do
            [ -e "$f" ] && git add "$f"
          done
          git diff --cached --quiet && exit 0
          git commit -m "SC1: поблочная хронология NVX [automated]"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected, попытка $i/5 -- git pull --rebase и повтор"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep 3
          done
          echo "не удалось запушить после 5 попыток" >&2
          exit 1
