name: "Ответ Bloom: распределение с метки (только чтение)"

# ЗАЧЕМ (пункт 4 ночного плана владельца 26.09): "распределение времени ответа
# Bloom с 11:33Z -- медиана, p90, > 1 с". Число берётся из поля bloom_ms, которое
# ставит сама площадка (bloom_api), а не пересчитывается по меткам времени:
# пересчёт включил бы в отрезок нашу сборку и врал бы в нашу пользу.
#
# Журналы читаются ПОТОКОМ на хосте, включая ротированные .gz. Только чтение.
on:
  workflow_dispatch:
    inputs:
      s:
        description: "метка UTC, с которой считать (2026-09-26T11:33:00Z)"
        required: false
        default: "2026-09-26T11:33:00Z"

concurrency:
  group: otvet-bloom-nl
  cancel-in-progress: false

env:
  HOST: 45.59.170.76
  STATE_DIR: /home/bot/bloom_executor_live_data
  OUT: data/otvet_bloom_raspredelenie.json

jobs:
  raspredelenie:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/nifty-sagan-r0polg

      - name: "SSH key"
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -e
          [ -n "$VPS_SSH_KEY" ] || { echo "СБОЙ: VPS_SSH_KEY не задан"; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -T 10 "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          echo "SSH_OPTS=-i $HOME/.ssh/vps_key -o ConnectTimeout=20 -o BatchMode=yes -o StrictHostKeyChecking=accept-new" >> "$GITHUB_ENV"

      - name: "Распределение ответа Bloom (хост, потоком)"
        run: |
          set -e
          set -o pipefail
          ssh $SSH_OPTS root@"$HOST" "cat > /tmp/otvet_bloom_raspredelenie.py" < deploy/checks/otvet_bloom_raspredelenie.py
          ssh -n $SSH_OPTS root@"$HOST" "
            set -e
            set -o pipefail
            nice -n 15 python3 /tmp/otvet_bloom_raspredelenie.py --state-dir '$STATE_DIR' \
              --s '${{ inputs.s }}'
            rc=\$?; rm -f /tmp/otvet_bloom_raspredelenie.py; exit \$rc" | tee "$OUT"

      - name: "Ключей в отчёте быть не должно"
        if: always()
        run: python3 deploy/checks/bez_klyuchey_v_otchete.py "$OUT"

      - name: "Коммит"
        if: always()
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -f "$OUT" ] && git add "$OUT"
          git diff --cached --quiet && { echo "нечего коммитить"; exit 0; }
          git commit -m "Otvet Bloom: raspredelenie s metki [automated]"
          for i in 1 2 3 4 5; do
            git push origin HEAD:claude/nifty-sagan-r0polg && exit 0
            git pull --rebase -X theirs origin claude/nifty-sagan-r0polg
            sleep 3
          done
          exit 1
