name: "Р по часам: медиана, p90, n и подшаги решения (только чтение)"

# ЗАЧЕМ (слово владельца 01.10, п.1). Р выросло с 10-22 мс ночью до 144 мс к
# 15:21. Нужна таблица по часам с 22:00Z 30.09, до и после перезапуска
# 10:14:25Z, и разложение по подшагам на 5 последних сделках против 5 ночных.
#
# Р НЕ СЧИТАЕТСЯ ЗАНОВО: берётся поле путь_решили у того же переводчика записи,
# что печатает BUY и часовую. Подшаги -- поле podshagi_ms самой полосы.
#
# ТОЛЬКО ЧТЕНИЕ: ни сети, ни подписей, ни правок журналов.
on:
  workflow_dispatch:
    inputs:
      s:
        description: "с какого времени UTC"
        required: false
        default: "2026-09-30T22:00:00Z"
      perezapusk:
        description: "момент перезапуска службы UTC"
        required: false
        default: "2026-10-01T10:14:25Z"
      noch_do:
        description: "что считать ночью: записи раньше этого времени"
        required: false
        default: "2026-10-01T06:00:00Z"
      skolko:
        description: "по сколько сделок раскладывать по подшагам"
        required: false
        default: "5"

concurrency:
  group: r-po-chasam
  cancel-in-progress: false

env:
  CODE_DIR: /home/bot/bloom_executor
  ENV_DIR: /etc/bloom-executor
  TARGET_HOST: 127.0.0.1
  RABOTA: /tmp/r_po_chasam
  PY_HOSTA: /home/bot/robinhood-chain-alpha/venv/bin/python
  OUT_FILE: data/r_po_chasam.json

jobs:
  zamer:
    runs-on: ${{ fromJSON('["self-hosted","nl-host"]') }}
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/nifty-sagan-r0polg

      - name: "Модуль разбирается"
        run: python3 -m py_compile deploy/checks/r_po_chasam.py && echo "razbor ok"

      - name: "SSH key"
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -e
          [ -n "$VPS_SSH_KEY" ] || { echo "SBOY: VPS_SSH_KEY ne zadan"; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          echo "SSH_OPTS=-i $HOME/.ssh/vps_key -o ConnectTimeout=15 -o BatchMode=yes -o StrictHostKeyChecking=accept-new" >> "$GITHUB_ENV"

      - name: "Самопроверка на хосте ДО замера"
        run: |
          set -e
          set -o pipefail
          ssh -n $SSH_OPTS root@$TARGET_HOST "rm -rf $RABOTA; install -d -m 755 $RABOTA"
          ssh $SSH_OPTS root@$TARGET_HOST "cat > $RABOTA/r_po_chasam.py" < deploy/checks/r_po_chasam.py
          ssh -n $SSH_OPTS root@$TARGET_HOST "
            cd $CODE_DIR && PYTHONPATH=$CODE_DIR $PY_HOSTA $RABOTA/r_po_chasam.py --self-test | tail -3"

      - name: "Замер по записям"
        run: |
          set -e
          set -o pipefail
          ssh -n $SSH_OPTS root@$TARGET_HOST "
            set -a; . $ENV_DIR/env; set +a
            cd $CODE_DIR
            env BLOOM_STATE_DIR=\$BLOOM_STATE_DIR PYTHONPATH=$CODE_DIR \
              $PY_HOSTA $RABOTA/r_po_chasam.py \
                --s '${{ inputs.s }}' --perezapusk '${{ inputs.perezapusk }}' \
                --noch-do '${{ inputs.noch_do }}' --skolko '${{ inputs.skolko }}' \
                --out $RABOTA/out.json >/dev/null
            cat $RABOTA/out.json
          " > /tmp/r.json
          if python3 -c "import json; json.load(open('/tmp/r.json'))" 2>/dev/null; then
            cp /tmp/r.json "$OUT_FILE"; echo "obnovlen $OUT_FILE"
          else
            echo "SBOY: svodka ne sobralas"; head -40 /tmp/r.json; exit 1
          fi
          ssh -n $SSH_OPTS root@$TARGET_HOST "rm -rf $RABOTA"

      - name: "Коммит"
        if: always()
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f "$OUT_FILE" ]; then git add "$OUT_FILE"; fi
          git diff --cached --quiet && { echo "nechego kommitit"; exit 0; }
          git commit -m "R po chasam: mediana, p90, n i podshagi [automated]"
          for i in 1 2 3 4 5; do
            git push origin HEAD:claude/nifty-sagan-r0polg && exit 0
            git pull --rebase -X theirs origin claude/nifty-sagan-r0polg
            sleep 3
          done
          exit 1
