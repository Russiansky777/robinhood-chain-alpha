name: "Логгер фандинга -- тестовый прогон сборщика (перед выкладкой на VPS-cron)"

# Разовая проверка analysis/funding_spread_hourly_snapshot.py на реальных
# API (Lighter api.rh.lighter.xyz + Hyperliquid) через GH Actions --
# площадка без сетевых ограничений интерактивной песочницы. Не
# устанавливает cron -- это отдельный шаг (run_vps_setup_funding_cron_nl.yml).
on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/sc1-pons-v2-launcher-efdbyt
    paths:
      - "data/p3_guard_cache/FUNDING_SPREAD_TEST_REQUEST"

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r analysis/requirements.txt

      - name: Тестовый прогон сборщика спреда фандинга
        run: python -u analysis/funding_spread_hourly_snapshot.py

      - name: Commit results
        if: always()
        run: |
          [ -e data/funding_spread.jsonl ] && git add data/funding_spread.jsonl
          git diff --cached --quiet && exit 0
          git commit -m "Логгер фандинга: тестовый прогон сборщика [automated]"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected, попытка $i/5 -- git pull --rebase и повтор"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep 3
          done
          echo "не удалось запушить после 5 попыток" >&2
          exit 1
