name: "Dune (новый аккаунт Mozila) -- разведка схемы Robinhood Chain, до трат"

# Владелец, 2026-09-04: новый Dune-аккаунт (2000+ кредитов заявлено),
# ключ в secrets.DUNE_API_KEY_MOZILA -- ОТДЕЛЬНЫЙ от старого
# secrets.DUNE_API_KEY (2500/цикл, data/credits_spent.json). Разведка:
# какие таблицы по Robinhood Chain есть, декодированы ли Swap-события
# v3, с какой даты покрытие, реальный остаток кредитов. Отдельный
# леджер data/credits_spent_mozila.json (CREDIT_GUARD_FILE/NAMESPACE
# env ниже) -- бюджеты старого/нового аккаунта не смешиваются.
#
# Кредиты сверх разведки (RECON_BUDGET=50 в analysis/dune_mozila_recon.py)
# -- только по отдельному решению владельца, не этим workflow.
on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/sc1-pons-v2-launcher-efdbyt
    paths:
      - "data/p3_guard_cache/DUNE_MOZILA_RECON_REQUEST"

jobs:
  recon:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r analysis/requirements.txt

      - name: Разведка схемы Dune (новый аккаунт) -- LIMIT 100, отдельный леджер
        env:
          DUNE_API_KEY: ${{ secrets.DUNE_API_KEY_MOZILA }}
          CREDIT_GUARD_NAMESPACE: funding_mozila
          CREDIT_GUARD_FILE: data/credits_spent_mozila.json
        run: python -u analysis/dune_mozila_recon.py

      - name: Commit results
        if: always()
        run: |
          [ -e data/p3_guard_cache/dune_mozila_schema_recon_result.json ] && git add data/p3_guard_cache/dune_mozila_schema_recon_result.json
          [ -e data/credits_spent_mozila.json ] && git add data/credits_spent_mozila.json
          git diff --cached --quiet && exit 0
          git commit -m "Dune (Mozila): разведка схемы Robinhood Chain [automated]"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected, попытка $i/5 -- git pull --rebase и повтор"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep 3
          done
          echo "не удалось запушить после 5 попыток" >&2
          exit 1
