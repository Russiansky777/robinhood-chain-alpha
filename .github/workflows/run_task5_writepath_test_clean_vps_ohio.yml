name: "Задача 5, живой бот -- чистый замер включения (фид, не Cloudflare-рецепт) с Ohio VPS, LOCATION_LABEL=ohio"

# Владелец, 2026-09-13, п.2: "Первым делом -- замер, ради которого машина
# и поднята." Использует scripts/writepath_test_clean.sh (см.
# docs/TASK5_WRITEPATH_CLEAN_SPEC.md) -- НЕ старый writepath_test.sh:
# таймер по фиду секвенсера, не по поллингу рецепта через Cloudflare-RPC,
# строго одна транзакция в полёте. Требует, чтобы run_vps_bootstrap_ohio.yml
# уже отработал (пользователь bot, /etc/bot/env с PRIVATE_KEY_NOX).

on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/nifty-sagan-r0polg
    paths:
      - "data/p3_guard_cache/TASK5_WRITEPATH_TEST_CLEAN_VPS_OHIO_REQUEST"

jobs:
  writepath_test_clean_vps_ohio:
    name: "Чистый замер с Ohio VPS (3.151.160.108)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: SSH key + known_hosts
        env:
          VPS_SSH_KEY_OHIO: ${{ secrets.VPS_SSH_KEY_OHIO }}
        run: |
          set -e
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY_OHIO" > ~/.ssh/vps_key_ohio
          chmod 600 ~/.ssh/vps_key_ohio
          ssh-keyscan -T 10 3.151.160.108 >> ~/.ssh/known_hosts 2>/dev/null
          echo "SSH_OPTS=-i $HOME/.ssh/vps_key_ohio -o ConnectTimeout=15 -o BatchMode=yes -o StrictHostKeyChecking=accept-new" >> "$GITHUB_ENV"

      - name: Запустить scripts/writepath_test_clean.sh как bot на Ohio VPS, LOCATION_LABEL=ohio
        run: |
          (printf 'export LOCATION_LABEL=ohio\n'; cat scripts/writepath_test_clean.sh) \
            | ssh $SSH_OPTS ubuntu@3.151.160.108 'sudo -u bot -H bash -s' \
            > /tmp/writepath_test_clean_ohio_result.json 2> /tmp/writepath_test_clean_ohio_stderr.log
          echo "--- stderr (диагностика фида/старта) ---"
          cat /tmp/writepath_test_clean_ohio_stderr.log || true
          echo "--- stdout (результат) ---"
          cat /tmp/writepath_test_clean_ohio_result.json

      - name: Commit results
        if: always()
        run: |
          mkdir -p data/p3_guard_cache
          git rm -f --ignore-unmatch data/p3_guard_cache/TASK5_WRITEPATH_TEST_CLEAN_VPS_OHIO_REQUEST
          [ -e /tmp/writepath_test_clean_ohio_result.json ] && cp /tmp/writepath_test_clean_ohio_result.json data/p3_guard_cache/task5_writepath_test_clean_ohio_result.json
          [ -e data/p3_guard_cache/task5_writepath_test_clean_ohio_result.json ] && git add data/p3_guard_cache/task5_writepath_test_clean_ohio_result.json
          git diff --cached --quiet && exit 0
          git commit -m "Задача 5, живой бот: результат чистого замера включения (фид) с Ohio VPS [automated]"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected, попытка $i/5 -- git pull --rebase и повтор"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep 3
          done
          echo "не удалось запушить после 5 попыток" >&2
          exit 1
