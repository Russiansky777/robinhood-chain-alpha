name: "Podbivka-2: konveyer (Pravilo 18) -- po taymeru, bez shtaba"

# ZACHEM (Pravilo 18, slovo vladelca 03.10). Konveyer: kazhdye sutki posle progona
# 06:30Z -- pravilo kandidatov po VSEY vselennoy arhiva (kazhdyy adres s >= 20
# pervymi pokupkami ot 2 SOL-ekv za okno), vhod "konec slota", vyhod +108, bilet
# 0.1; porogi ne podgonyayutsya. Vyhod: docs/konveyer_<data>.md i
# data/konveyer/<data>.json s razdelami "dobavit" (<= 5), "zapas", "snova
# prohodit" (log_only -- tolko stroka), "deystvuyuschie ne derzhatsya".
#
# POCHEMU ODIN PROHOD ARHIVA ZA NOCH, A NE 11. Yacheyki proshlyh sutok ne
# menyayutsya, poetomu kazhduyu noch dochityvayutsya TOLKO proshedshie sutki
# (metka konv_<data>), a pravilo schitaetsya oflayn po poslednim 11 sutochnym
# faylam (konv_* i cand2_*: v nih signaly vsey vselennoy s porogom 2 SOL).
# Poslednie sutki -- VNE VYBORKI i tozhe dolzhny byt v plyuse.
#
# Svoya gruppa concurrency: ne vstayot poverh ocheredi zadach (podbivka2-zadacha)
# i ne otmenyaet eyo. Helius ne nuzhen: tolko arhiv PumpApi.
# DVE BEDY, NAYDENNYE 04.10 (ispravleno zdes zhe).
# 1. FLAG --bez-adresov BYL OSHIBKOY. On znachit "tolko celi (--celi) i ryady ih
#    pulov": adresa obnulyayutsya (adr = {}), signalov ne poyavlyaetsya vovse.
#    Nochnye prohody konv_2026-10-02T17 i konv_2026-10-03T17 vyshli pustymi
#    (317 i 357 bayt, 46.7 mln strok prochitano, signalov 0), poetomu v
#    docs/konveyer_2026-10-04.md u vseh 45 deystvuyuschih "net dannyh za
#    poslednie sutki", a proverka "vne vyborki" byla pustoy. Vselennaya
#    kandidatov beryotsya iz spiskov "pered" u NASHIH signalov, poetomu adresa
#    iz arhiv_adresa.json nuzhny -- kak v prohodah cand2_*.
# 2. Cron 17 7 * * * 04.10 ne srabotal (sobytiya schedule u etogo progona net,
#    byl tolko workflow_dispatch). Fayl na vetke po umolchaniyu lezhit s 03.10
#    18:31Z, tak chto raspisanie imeet pravo rabotat; propusk pervogo
#    sutochnogo srabatyvaniya -- izvestnoe povedenie Actions. Podstrahovka:
#    routine Code-2 "CODE-2: konveyer (Pravilo 18) -- nochnoy prohod" (22 7 * * *)
#    stavit tot zhe prohod markerom v ochered podbivka2-zadacha, esli stranicy
#    za sutki net.
on:
  schedule:
    - cron: "17 7 * * *"      # posle sutochnogo progona 06:30Z
    - cron: "47 8 * * 1"      # ponedelnik: nedelnaya chast (p.4g)
  workflow_dispatch:
    inputs:
      sutok:
        description: "sutok v okne otbora (bez poslednih)"
        required: false
        default: "11"
      bez_arhiva:
        description: "da -- ne chitat arhiv, tolko peresobrat stranicu po gotovym faylam"
        required: false
        default: "net"
      nedelya:
        description: "da -- dobavit nedelnuyu chast (pokupateli za posrednikami)"
        required: false
        default: "net"

concurrency:
  group: podbivka2-konveyer
  cancel-in-progress: false

jobs:
  konveyer:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/podbivka
          fetch-depth: 2

      - name: "Python venv"
        run: |
          set -e
          python3 -m venv "$RUNNER_TEMP/pod_venv"
          "$RUNNER_TEMP/pod_venv/bin/pip" install -q requests solders zstandard
          echo "PY=$RUNNER_TEMP/pod_venv/bin/python" >> "$GITHUB_ENV"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: "Sutki arhiva za proshedshiy den"
        if: ${{ github.event.inputs.bez_arhiva != 'da' }}
        env:
          SHYFT_API_KEY: ${{ secrets.SHYFT_API_KEY }}
          PODB_MANIFEST: ${{ runner.temp }}/manifest.txt
        run: |
          set -e
          DEN=$(date -u -d "yesterday" +%Y-%m-%d)
          echo "sutki: ${DEN}T17 -> +25 chasov, metka konv_${DEN}T17"
          $PY analysis/podbivka_arhiv_den.py \
            --s "${DEN}T17" --chasov 25 --porog 2 --okno 160 --ne-sol --okno-vsem \
            --okno-dokupki 1800 --bilety 0.1,0.3 --pered 10 --bez-sobytij \
            --metka "konv_${DEN}T17"

      - name: "Nedelnaya chast (ponedelnik)"
        if: ${{ github.event.schedule == '47 8 * * 1' || github.event.inputs.nedelya == 'da' }}
        env:
          SHYFT_API_KEY: ${{ secrets.SHYFT_API_KEY }}
          HELIUS_API_KEY: ${{ secrets.HELIUS_API }}
          PODB_HELIUS_RPS: "3"
          PODB_MANIFEST: ${{ runner.temp }}/manifest.txt
        run: |
          set -e
          # Pokupateli za posrednikami: verhnie posredniki iz razdela "za kem idut nashi".
          # Adresa posrednikov berutsya IZ FAYLA (data/podbivka/poisk_svod.json, razdel
          # "zakem": kto chasche vsego stoit vperedi nashih istochnikov) -- ne iz pamyati.
          POSR=$($PY -c "import json; d=json.load(open('data/podbivka/poisk_svod.json'))['закем']['ряды']; print(' '.join(a for a, _ in sorted(d.items(), key=lambda kv: -(kv[1].get('раз') or 0))[:3]))")
          echo "posredniki: $POSR"
          for A in $POSR; do
            $PY analysis/podbivka_posrednik.py --adres "$A" \
              --s "$(date -u -d '7 days ago' +%Y-%m-%dT%H:00:00Z)" --stranic 30 \
              --iskat Beqv6dzTcjV2eodo8RRXCiCcnSYrS1vkQKhfqwHXqeit \
              --metka "$(date -u +%Y-%m-%d)" || echo "posrednik $A: progon ne doshel"
          done

      - name: "Pravilo po vselennoy i stranica"
        env:
          PODB_MANIFEST: ${{ runner.temp }}/manifest.txt
        run: |
          set -e
          SUTOK="${{ github.event.inputs.sutok }}"
          [ -n "$SUTOK" ] || SUTOK=11
          $PY analysis/podbivka_konveyer.py --sutok "$SUTOK" --data "$(date -u +%Y-%m-%d)"

      - name: "Final commit"
        if: always()
        env:
          PODB_MANIFEST: ${{ runner.temp }}/manifest.txt
        run: |
          set -e
          [ -s "$PODB_MANIFEST" ] || { echo "nothing written"; exit 0; }
          sort -u "$PODB_MANIFEST" > "$RUNNER_TEMP/mine.txt"
          for i in 1 2 3 4 5 6 7 8; do
            git fetch -q --depth=1 origin claude/podbivka
            git reset -q FETCH_HEAD
            xargs -a "$RUNNER_TEMP/mine.txt" -d '\n' git add -- || true
            git diff --cached --quiet && { echo "already on branch"; exit 0; }
            git commit -q -m "Konveyer: $(date -u +%Y-%m-%d) [automated]"
            git push -q origin HEAD:claude/podbivka && exit 0
            sleep 4
          done
          exit 1
