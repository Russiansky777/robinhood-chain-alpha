name: "Polymarket Code-3: установка на lab-ams (юниты и таймеры) + первый доклад"

# ЗАЧЕМ (пункт 5 владельца 16.10): поставить регистратор Polymarket на
# ЛАБОРАТОРНЫЙ хост lab-ams по docs/polymarket_ustanovka.md из ветки Code-3.
# Единицы: минутный, пятиминутный, производные 03:23Z, ротация 05:11Z.
# Retention суточного артефакта сырого -- 30, не 90 (слово владельца; в версии
# ветки claude/stroiteli это уже так и записано).
#
# НА ТОРГОВЫЙ ХОСТ ЭТО НЕ СТАВИТСЯ: адрес лаборатории зашит как HOST_LAB
# (216.73.157.61), и шаг-предохранитель отказывается работать при совпадении с
# торговым 45.59.170.76.
#
# КЛЮЧЕЙ НЕ НУЖНО НИ ОДНОГО, и это проверяется, а не обещается: самопроверка
# скрипта Code-3 среди прочего доказывает, что он не читает ни одной переменной
# окружения. Значит EnvironmentFile юнитам не нужен и секретов на машину не
# ложится.
#
# СТРОКА ExecStartPost ИЗ ДОКУМЕНТА НЕ СТАВИТСЯ, И ЭТО НАЗВАНО. В документе
# юнит производных сразу пушит в ветку (--push), а для пуша с машины нужен
# токен записи -- новый секрет на хосте, а слово владельца -- "ключи и секреты
# никогда". Документ сам предлагает два пути и советует этот: производные
# считаются на машине, а последняя миля до ветки едет прогоном на бегунке, где
# токен выдаёт сам GitHub на время прогона и на диске не остаётся. Ровно так
# сделано с трендингами на lab-miami.
#
# ВЕРСИЯ КОДА. Владелец назвал b371d350 -- это голова ЧЕРНОВОЙ ветки
# claude/stroiteli-draft. На самой claude/stroiteli лежит более поздний
# коммит 57653e0d (Code-4): retention 30, самопроверка 35/35 прогнана, ruff
# зелёный. Ставим с claude/stroiteli -- ветки, которую владелец назвал в
# первом поручении.
on:
  push:
    # ЗАПУСК ФАЙЛОМ-МЕТКОЙ, А НЕ КНОПКОЙ: workflow_dispatch GitHub
    # регистрирует только для файлов на ветке по умолчанию, а этого прогона
    # там нет -- dispatch ответил бы 404. Событие push берёт файл прогона из
    # того коммита, которым он пришёл.
    branches:
      - claude/nifty-sagan-r0polg
    paths:
      - "data/konservaciya/zapusk/polymarket_ams_*.json"
  workflow_dispatch:
    inputs:
      vetka_koda:
        description: "ветка Code-3 с регистратором"
        required: false
        default: "claude/stroiteli"
      koren_pm:
        description: "куда ставить клон на lab-ams"
        required: false
        default: "/opt/polymarket-put"
      tolko_diagnoz:
        description: "'yes' -- только читающие шаги, ничего не ставить"
        required: false
        default: "no"

concurrency:
  group: polymarket-ams
  cancel-in-progress: false

env:
  TOLKO_DIAGNOZ: "no"
  VETKA_KODA: "claude/stroiteli"
  KOREN_PM: "/opt/polymarket-put"
  RYNKOV: "100"
  # ДВА МИНУТНЫХ КРУГА И ГЛУБИНА КНИГ -- ПО УМОЛЧАНИЮ ВЫКЛЮЧЕНО. Пункт 1
  # владельца 17.10: это делается ПОСЛЕ правки order=volume24hr от Code-4,
  # когда состав рынков наконец ложится. До того круги мерить нечего:
  # /events отдаёт 422, и семь списков стоят с причиной "нет выбора рынков".
  # Включается меткой запуска (krugi: yes) или входом прогона.
  KRUGI: "no"
  # ОТБОР СОСТАВА РУКАМИ -- ВЫКЛЮЧАЕМЫЙ, и это не удобство. Отбор уже прошёл
  # руками в прогоне 38973828932 (выбрано 100 рынков), а таймер отбора стоит
  # на 00:02Z. Повторный отбор в середине суток переписал бы суточный состав
  # и добавил в суточные производные ТРЕТИЙ набор токенов -- то есть испортил
  # бы ровно то число, за которым прогон и перезапускают. Метка: otbor: no.
  OTBOR: "yes"
  # РОТАЦИЯ -- 25 СУТОК, А RETENTION АРТЕФАКТА ОСТАЁТСЯ 30. Слово владельца
  # 17.10: "пять суток форы". Было 30 на 30, и окна не оставалось вовсе:
  # артефакт за сутки X истекал примерно в то же утро, когда ротация снимала
  # сырое за X, то есть скачать и пересчитать можно было только ДО этого утра.
  # При 25 сырое уходит на пять суток раньше артефакта -- пока он ещё жив и
  # данные восстановимы. Это число идёт ТОЛЬКО в --dnej юнита ротации;
  # retention-days: 30 стоит в прогоне артефакта и не меняется.
  SUTOK_SYROGO: "25"
  HOST_LAB: 216.73.157.61
  TORGOVYJ_ZAPRESHCHEN: 45.59.170.76

jobs:
  ustanovka:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/nifty-sagan-r0polg
          fetch-depth: 1

      - name: "ПРЕДОХРАНИТЕЛЬ: это не торговый хост"
        run: |
          set -e
          if [ "$HOST_LAB" = "$TORGOVYJ_ZAPRESHCHEN" ]; then
            echo "STOP: adres sovpal s torgovym hostom. Registrator na torgovuju mashinu ne stavitsja."
            exit 1
          fi
          echo "stavim na lab-ams $HOST_LAB; torgovyj $TORGOVYJ_ZAPRESHCHEN ne tragaetsja"

      - name: "SSH key lab-ams"
        env:
          KLJUCH_AMS: ${{ secrets.VPS_SSH_KEY_AMS }}
        run: |
          set -e
          [ -n "$KLJUCH_AMS" ] || { echo "SBOJ: sekreta VPS_SSH_KEY_AMS net"; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KLJUCH_AMS" > ~/.ssh/ams_key
          chmod 600 ~/.ssh/ams_key
          ssh-keyscan -T 10 "$HOST_LAB" >> ~/.ssh/known_hosts 2>/dev/null
          echo "SSH_OPTS=-i $HOME/.ssh/ams_key -o ConnectTimeout=20 -o BatchMode=yes -o StrictHostKeyChecking=accept-new" >> "$GITHUB_ENV"

      - name: "Параметры: вход прогона сильнее метки, метка сильнее умолчания"
        env:
          VHODY: ${{ toJSON(inputs) }}
        run: |
          set -e
          # СВЕЖЕСТЬ МЕТКИ -- ПО ИМЕНИ, А НЕ ПО ВРЕМЕНИ ФАЙЛА: в свежем
          # чекауте время правки у всех файлов одно (момент выкладки), и
          # 'ls -1t' выбрал бы не самую позднюю метку, а первую по алфавиту.
          METKA_FAJL=$(ls -1 data/konservaciya/zapusk/polymarket_ams_*.json 2>/dev/null | sort | tail -1 || true)
          echo "fajl-metka: ${METKA_FAJL:-net}"
          for IMJA in VETKA_KODA KOREN_PM TOLKO_DIAGNOZ KRUGI OTBOR; do
            KLJUCH=$(printf '%s' "$IMJA" | tr 'A-Z' 'a-z')
            NOVO=$(printf '%s' "$VHODY" | jq -r --arg k "$KLJUCH" '((. // {})[$k] // "") | tostring' 2>/dev/null || true)
            if [ -z "$NOVO" ] && [ -n "$METKA_FAJL" ]; then
              NOVO=$(jq -r --arg k "$KLJUCH" '((. // {})[$k] // "") | tostring' "$METKA_FAJL" 2>/dev/null || true)
            fi
            if [ -n "$NOVO" ] && [ "$NOVO" != "null" ]; then
              echo "$IMJA=$NOVO" >> "$GITHUB_ENV"
              echo "  $IMJA: bylo '${!IMJA}', stalo '$NOVO'"
            else
              echo "  $IMJA: '${!IMJA}' (po umolchaniju)"
            fi
          done

      - name: "ДИАГНОЗ МАШИНЫ lab-ams (только чтение, до любых правок)"
        run: |
          set -e
          set -o pipefail
          ssh $SSH_OPTS root@"$HOST_LAB" 'bash -s' <<'DIAGNOZ' 2>&1 | tee diagnoz_ams.txt
            echo "--- kto my ---"
            hostname; echo "jader: $(nproc)"
            echo "--- mesto ---"
            df -h / | tail -1
            echo "--- pamjat ---"
            free -h | head -2
            echo "--- python i systemd ---"
            python3 -V 2>&1
            systemctl --version 2>/dev/null | head -1
            echo "ruff: $(command -v ruff 2>/dev/null || echo net)"
            echo "sudo: $(command -v sudo 2>/dev/null || echo net)"
            echo "runuser: $(command -v runuser 2>/dev/null || echo net)"
            echo "--- EST LI BEGUNOK GitHub NA ETOJ MASHINE ---"
            # ЭТО НЕ ЛЮБОПЫТСТВО: пуш производных и суточный артефакт идут
            # ПРОГОНОМ НА БЕГУНКЕ (иначе на машину пришлось бы положить токен).
            # Если бегунка на lab-ams нет -- это и есть ответ, почему последняя
            # миля пока не поставлена, и его надо сказать вслух, а не умолчать.
            systemctl list-units 'actions.runner.*' --all --no-legend --plain 2>/dev/null | head -5 \
              || echo "sluzhb actions.runner.* net"
            BEG=$(systemctl list-units 'actions.runner.*' --all --no-legend --plain 2>/dev/null | wc -l)
            echo "BEGUNKOV=$BEG"
            echo "--- uzhe stojashchie juniti polymarket ---"
            systemctl list-timers 'polymarket*' --all --no-pager 2>/dev/null | head -8 || true
            ls -l /etc/systemd/system/polymarket-* 2>/dev/null || echo "junitov polymarket poka net"
          DIAGNOZ

      - name: "Пользователь polymarket и клон ветки Code-3"
        if: ${{ env.TOLKO_DIAGNOZ != 'yes' }}
        run: |
          set -e
          set -o pipefail
          ssh $SSH_OPTS root@"$HOST_LAB" "VETKA='$VETKA_KODA' KOREN='$KOREN_PM' bash -s" <<'STAVIM'
            set -e
            id polymarket >/dev/null 2>&1 \
              || useradd -r -s /usr/sbin/nologin -m polymarket
            id polymarket
            if [ -d "$KOREN/.git" ]; then
              echo "klon uzhe est, obnovljaju"
              cd "$KOREN"
              # Отметка safe.directory ставится РОВНО ОДИН РАЗ: --add без
              # проверки копит повторы при каждой перепостановке. Нужна она
              # потому, что клон отдан пользователю polymarket, а сессия -- root.
              git config --global --get-all safe.directory 2>/dev/null \
                | grep -qxF "$KOREN" \
                || git config --global --add safe.directory "$KOREN"
              # СЕТЬ С ЯЩИКА БЫВАЕТ НЕДОСТУПНА, И ЭТО НЕ ДОГАДКА: прогон
              # 38975558290 упал ровно здесь -- "fatal: unable to access ...
              # Failed to connect to github.com port 443 after 133597 ms".
              # Не права, не диск и не ssh: ssh доехал, удалённый bash
              # отработал, упёрся исходящий HTTPS с ящика. Три попытки с
              # паузой; если сеть не вернулась -- отказ громкий, а не
              # установка на непроверенном коде.
              POPYTKA=1
              until git fetch -q --depth=1 origin "$VETKA"; do
                if [ "$POPYTKA" -ge 3 ]; then
                  echo "SBOJ: git fetch ne proshjol s treh popytok -- set s jashchika do github.com nedostupna"
                  exit 1
                fi
                echo "fetch ne proshjol (popytka $POPYTKA) -- zhdu 15 s i probuju snova"
                POPYTKA=$((POPYTKA + 1))
                sleep 15
              done
              # ВЕТКУ ДОГОНЯЕМ reset-ом, А КОД БЕРЁМ checkout-ом ПО ПУТЯМ:
              # прямой checkout -B отказал бы, как только таймер начнёт
              # дописывать data/polymarket -- для git это локальные изменения
              # отслеживаемых файлов, и шаг упал бы, а снимки мог бы затереть.
              git reset -q FETCH_HEAD
              git checkout -q -- analysis docs
            else
              echo "kloniruju $VETKA v $KOREN (melkij, odnovetochnyj)"
              rm -rf "$KOREN"
              git clone -q --depth 1 --single-branch -b "$VETKA" \
                https://github.com/Russiansky777/robinhood-chain-alpha.git "$KOREN"
              cd "$KOREN"
            fi
            git rev-parse --abbrev-ref HEAD
            git log --oneline -1
            mkdir -p "$KOREN/data/polymarket"
            chown -R polymarket:polymarket "$KOREN"
            # ГРУППА БЕГУНКА ПОЛУЧАЕТ ЗАПИСЬ НА КАТАЛОГ ДАННЫХ, и это нужно
            # именно прогону, а не таймерам. Суточный артефакт сырого и пуш
            # производных идут ПРОГОНОМ НА БЕГУНКЕ (токен на ящик не кладём),
            # то есть под пользователем бегунка. Читать ему хватило бы и так,
            # но отметку об артефакте (--otmetit-artefakt) он ПИШЕТ в
            # data/polymarket/artefakty, а без права на каталог это
            # "Permission denied". Ровно это уже ловилось на lab-miami.
            # Бит setgid на каталогах -- отдельно: без него каталог, созданный
            # завтра таймером от polymarket, лёг бы с группой polymarket, и
            # отметка опять упёрлась бы в права. UMask=0002 в юнитах уже стоит,
            # поэтому новые каталоги выходят 2775, а файлы 664.
            # Имя пользователя бегунка НЕ УГАДЫВАЕМ: берём владельца его
            # рабочего каталога.
            RAB_BEGUNKA=$(ls -d /home/*/actions-runner/_work 2>/dev/null | head -1)
            if [ -n "$RAB_BEGUNKA" ]; then
              BEGUNOK=$(stat -c %U "$RAB_BEGUNKA")
            else
              BEGUNOK=""
            fi
            echo "polzovatel begunka: ${BEGUNOK:-ne najden} (po ${RAB_BEGUNKA:-net})"
            if [ -n "$BEGUNOK" ] && id "$BEGUNOK" >/dev/null 2>&1; then
              chgrp -R "$BEGUNOK" "$KOREN/data/polymarket"
              find "$KOREN/data/polymarket" -type d -exec chmod 2775 {} +
              find "$KOREN/data/polymarket" -type f -exec chmod 664 {} + 2>/dev/null || true
              echo "prava na katalog dannyh:"
              ls -ld "$KOREN/data/polymarket"
            else
              echo "VNIMANIE: polzovatelja begunka na mashine net -- otmetka ob"
              echo "artefakte iz progona upadjot na Permission denied."
            fi
            test -f "$KOREN/analysis/polymarket_put.py" \
              || { echo "SBOJ: v klone net analysis/polymarket_put.py"; exit 1; }
            # БИТ ВЫПОЛНЕНИЯ ПРОВЕРЯЕМ ОТДЕЛЬНО: в ветке файл лежит как 100755,
            # и ruff опирается на это -- при 644 он даёт EXE001 "shebang is
            # present but file is not executable". Замерено у себя: копия без
            # бита -- 1 замечание, с битом -- "All checks passed".
            ls -l "$KOREN/analysis/polymarket_put.py"
            test -x "$KOREN/analysis/polymarket_put.py" \
              || chmod +x "$KOREN/analysis/polymarket_put.py"
            echo "klon gotov, vladelec polymarket"
          STAVIM

      - name: "САМОПРОВЕРКА и ruff ДО УСТАНОВКИ: красное -- не ставим"
        if: ${{ env.TOLKO_DIAGNOZ != 'yes' }}
        run: |
          set -e
          set -o pipefail
          KOREN="$KOREN_PM"
          # СЛОВО ВЛАДЕЛЬЦА: "самопроверка -- пройти заново на месте, ruff".
          # На месте, а не на слово: у ящика своя версия Python и свой набор
          # правил ruff. Сети самопроверка не просит.
          # ОТ ПОЛЬЗОВАТЕЛЯ polymarket, НО НЕ ЧЕРЕЗ ОДИН ТОЛЬКО sudo: на
          # лабораторной машине sudo может не стоять вовсе, и шаг упал бы на
          # "sudo: command not found", ничего не поставив и ничего не измерив.
          # runuser входит в util-linux и есть всюду, где есть systemd.
          ssh -n $SSH_OPTS root@"$HOST_LAB" \
            "cd $KOREN && if command -v sudo >/dev/null 2>&1; then sudo -u polymarket /usr/bin/python3 analysis/polymarket_put.py --self-test; else runuser -u polymarket -- /usr/bin/python3 analysis/polymarket_put.py --self-test; fi" \
            2>&1 | tee samoproverka_ams.txt
          # ЧИСЛО ПРОВЕРОК НЕ ЗАШИТО, И ЭТО ИСПРАВЛЕНИЕ ПО ЗАМЕРУ. Было
          # зашито "проверок 35, ждали 35": владелец назвал 35, и столько
          # объявлял скрипт на коммите 57653e0d. Code-4 коммитом 93997cdd
          # поднял объявленное число до 42 -- он нашёл, что прежняя
          # самопроверка сверяла запрос С ТЕМ ЖЕ неверным именем поля
          # (order=volume_24hr), то есть была зелёной, ничего не проверяя, и
          # добавил проверки на неверные написания. Зашитое 35 после этого
          # отбивало установку при ЗЕЛЁНОЙ самопроверке -- прогон 38941978050
          # так и упал.
          #
          # Теперь ворота строже и не зависят от версии: берём итоговую строку
          # самопроверки, требуем, чтобы СДЕЛАННЫХ проверок было ровно столько,
          # сколько ОБЪЯВЛЕНО, упавших -- ноль, и чтобы в выводе не было ни
          # "ПЛОХО", ни "СБОЙ". Число печатаем в доклад, а не прячем.
          STROKA=$(grep -oE 'проверок [0-9]+, ждали [0-9]+, не прошло [0-9]+' \
                   samoproverka_ams.txt | tail -1)
          [ -n "$STROKA" ] || { echo "SBOJ: v vyvode net itogovoj stroki samoproverki"; exit 1; }
          echo "itog samoproverki: $STROKA"
          BYLO=$(printf '%s' "$STROKA" | sed -E 's/^проверок ([0-9]+).*/\1/')
          ZHDALI=$(printf '%s' "$STROKA" | sed -E 's/.*ждали ([0-9]+).*/\1/')
          PLOHO=$(printf '%s' "$STROKA" | sed -E 's/.*не прошло ([0-9]+).*/\1/')
          echo "SAMOPROVERKA=$BYLO/$ZHDALI ne_proshlo=$PLOHO"
          [ "$BYLO" = "$ZHDALI" ] \
            || { echo "SBOJ: sdelano proverok $BYLO, a objavleno $ZHDALI"; exit 1; }
          [ "$PLOHO" = "0" ] || { echo "SBOJ: ne proshlo $PLOHO proverok"; exit 1; }
          # НЕ МЕНЬШЕ 57 ОБЪЯВЛЕННЫХ -- ПОРОГ СНИЗУ, А НЕ РАВЕНСТВО. Слово
          # владельца 17.10 к правке d350b3e: "ждём 57/57, ворота >= 57"; в
          # самом скрипте стоит ZHDEM_PROVEROK = 57. Порог поднимается вместе
          # с версией (было 55 при 1b9c8b0e), а не заменяется равенством:
          # одного согласия сделанного с объявленным мало -- доправочный
          # скрипт самосогласован и дал бы зелёные ворота на 35/35, после чего
          # таймеры включились бы на коде, который час за часом пишет 422 на
          # order=volume_24hr либо пустые книги. Зашитое РАВЕНСТВО при этом
          # уже однажды отбило ЗЕЛЁНУЮ самопроверку (прогон 38941978050, когда
          # Code-4 поднял число с 35 до 42), поэтому здесь именно порог снизу:
          # числу разрешено расти, но не падать.
          [ "$ZHDALI" -ge 57 ] 2>/dev/null \
            || { echo "SBOJ: objavleno proverok $ZHDALI, a zhdjom ne menshe 57 -- na jashchike staryj fajl"; exit 1; }
          if grep -qE 'ПЛОХО|СБОЙ' samoproverka_ams.txt; then
            echo "SBOJ: v vyvode samoproverki est ПЛОХО libo СБОЙ"
            exit 1
          fi
          echo "--- ruff ---"
          ssh -n $SSH_OPTS root@"$HOST_LAB" \
            "cd $KOREN && if command -v ruff >/dev/null 2>&1; then ruff check analysis/polymarket_put.py; else echo 'ruff na jashchike NET -- proverka propushchena, i eto skazano vsluh'; fi" \
            2>&1 | tee ruff_ams.txt
          if grep -qE '^(error|[A-Z][0-9]{3})' ruff_ams.txt; then
            echo "SBOJ: ruff nashjol zamechanija -- tajmery ne stavlju"
            exit 1
          fi
          tail -2 samoproverka_ams.txt

      - name: "Шесть юнитов systemd (без строки пуша с машины)"
        if: ${{ env.TOLKO_DIAGNOZ != 'yes' }}
        run: |
          set -e
          set -o pipefail
          KOREN="$KOREN_PM"
          mkdir -p junity_pm
          # ЮНИТЫ ПИШУТСЯ ЗДЕСЬ И УЕЗЖАЮТ ФАЙЛАМИ, а не heredoc-ом внутри
          # heredoc-а ssh: внутренний ограничитель ушёл бы на хост С ОТСТУПОМ,
          # bash ждёт его в нулевой колонке, и юниты вышли бы пустыми при
          # зелёном прогоне.
          # UMask=0002 -- из-за часового раскроя: каждые сутки таймер создаёт
          # новый каталог <список>/<дата>/, и при umask 022 он вышел бы 2755,
          # то есть уборка и упаковка под другим пользователем упёрлись бы в
          # Permission denied (ровно это уже ловили на трендингах).
          OBSHCHEE=$(printf '%s\n' \
            "Type=oneshot" "User=polymarket" "WorkingDirectory=$KOREN" \
            "Nice=10" "UMask=0002" "PrivateTmp=yes" "NoNewPrivileges=yes" \
            "ProtectSystem=strict" "ReadWritePaths=$KOREN")

          # --- СУТОЧНЫЙ ОТБОР СОСТАВА (пятый юнит, добавлен 16.10 коммитом
          # 1b9c8b0e). БЕЗ НЕГО МИНУТНОМУ КРУГУ НЕ НА ЧЕМ РАБОТАТЬ: состав
          # лежит в data/polymarket/vybor.json, и раньше его писал
          # пятиминутный снимок /events -- он разворачивал сто самых объёмных
          # СОБЫТИЙ в 4086 рынков и брал первые сто токенов, то есть хвост
          # многоисходных событий. Замер с ящика: запрошено 200 токенов, книг
          # пришло 10, и ВСЕ пустые. Теперь состав -- свой суточный отбор:
          # 100 рынков по volume24hr среди тех, У КОГО КНИГА НЕ ПУСТА.
          # 00:02Z, а не 00:00Z: суточные файлы режутся по метке снимка, и
          # отбор должен лечь в новые сутки, а не в стык.
          {
            printf '%s\n' "[Unit]" \
              "Description=Polymarket: sutochnyj otbor 100 rynkov po volume24hr s nepustoj knigoj" \
              "After=network-online.target" "" "[Service]"
            printf '%s\n' "$OBSHCHEE"
            printf '%s\n' \
              "ExecStart=/usr/bin/python3 analysis/polymarket_put.py --otbor --rynkov $RYNKOV --pauza 0.4" \
              "TimeoutStartSec=600"
          } > junity_pm/polymarket-otbor.service
          printf '%s\n' "[Unit]" "Description=Polymarket: otbor sostava v 00:02 UTC" "" \
            "[Timer]" "OnCalendar=*-*-* 00:02:00 UTC" "Persistent=true" "" \
            "[Install]" "WantedBy=timers.target" \
            > junity_pm/polymarket-otbor.timer

          {
            printf '%s\n' "[Unit]" \
              "Description=Polymarket: minutnye spiski (knigi, ceny, spredy, sdelki)" \
              "After=network-online.target" "" "[Service]"
            printf '%s\n' "$OBSHCHEE"
            printf '%s\n' \
              "ExecStart=/usr/bin/python3 analysis/polymarket_put.py --kazhdye минута --rynkov $RYNKOV --pauza 0.4" \
              "TimeoutStartSec=50"
          } > junity_pm/polymarket-min.service
          printf '%s\n' "[Unit]" "Description=Polymarket kazhduju minutu" "" \
            "[Timer]" "OnCalendar=*:0/1" "AccuracySec=1s" "Persistent=false" "" \
            "[Install]" "WantedBy=timers.target" \
            > junity_pm/polymarket-min.timer

          # СОБЫТИЯ ОТДЕЛЕНЫ ОТ ОСТАЛЬНОЙ ПЯТИМИНУТКИ -- СЛОВО ВЛАДЕЛЬЦА
          # 17.10: "снимок событий 15 минут вместо 5; минутные книги и 5-мин
          # остальное -- без изменений". Файл Code-4 для этого править не
          # пришлось: у скрипта есть довод --spisok ("только этот список"), а
          # отбор внутри него -- И по группе, и по имени
          # (что = [x for x in СПИСКИ if (kazhdye == "все" or x[1] ==
          # kazhdye) and (not spisok or x[0] == spisok)]). Значит группу
          # "пять" можно разложить по именам.
          #
          # В ГРУППЕ "пять" РОВНО ЧЕТЫРЕ СПИСКА -- взято из реестра СПИСКИ
          # скрипта, а не на память: gamma_events, clob_fee_rate,
          # data_holders, clob_time. Три последних остаются на пяти минутах
          # тремя строками ExecStart (oneshot выполняет их по порядку), а
          # события уходят в свой юнит с OnCalendar=*:0/15.
          #
          # ЗАЧЕМ. Замер ночи 17.10: всего 536.60 МБ за 10.2 часа, из них
          # gamma_events 349.20 МБ -- 65 %, то есть 823 МБ/сутки при 1.24
          # ГБ/сутки всего. При 30 сутках хранения это 23 суток до порога
          # сторожа, причём ротации тогда ещё нечего удалять. На 15 минутах
          # события дают около 274 МБ/сутки, и всё вместе -- около 0.71
          # ГБ/сутки.
          #
          # --kazhdye пять ОСТАЁТСЯ И В ЮНИТЕ СОБЫТИЙ: отбор идёт по И, и с
          # умолчанием --kazhdye минута фильтр не нашёл бы ни одного списка --
          # скрипт честно отказал бы кодом 2 ("по отбору не осталось ни
          # одного списка").
          {
            printf '%s\n' "[Unit]" \
              "Description=Polymarket: pjatiminutnye spiski bez sobytij (nagrady, derzhateli, vremja)" \
              "After=network-online.target" "" "[Service]"
            printf '%s\n' "$OBSHCHEE"
            printf '%s\n' \
              "ExecStart=/usr/bin/python3 analysis/polymarket_put.py --kazhdye пять --spisok clob_fee_rate --rynkov $RYNKOV --pauza 0.6" \
              "ExecStart=/usr/bin/python3 analysis/polymarket_put.py --kazhdye пять --spisok data_holders --rynkov $RYNKOV --pauza 0.6" \
              "ExecStart=/usr/bin/python3 analysis/polymarket_put.py --kazhdye пять --spisok clob_time --rynkov $RYNKOV --pauza 0.6" \
              "TimeoutStartSec=180"
          } > junity_pm/polymarket-5min.service
          printf '%s\n' "[Unit]" "Description=Polymarket kazhdye pjat minut (bez sobytij)" "" \
            "[Timer]" "OnCalendar=*:0/5" "AccuracySec=5s" "Persistent=false" "" \
            "[Install]" "WantedBy=timers.target" \
            > junity_pm/polymarket-5min.timer

          {
            printf '%s\n' "[Unit]" \
              "Description=Polymarket: snimok sostava sobytij raz v 15 minut" \
              "After=network-online.target" "" "[Service]"
            printf '%s\n' "$OBSHCHEE"
            printf '%s\n' \
              "ExecStart=/usr/bin/python3 analysis/polymarket_put.py --kazhdye пять --spisok gamma_events --rynkov $RYNKOV --pauza 0.6" \
              "TimeoutStartSec=120"
          } > junity_pm/polymarket-15min.service
          printf '%s\n' "[Unit]" "Description=Polymarket: sobytija kazhdye 15 minut" "" \
            "[Timer]" "OnCalendar=*:0/15" "AccuracySec=15s" "Persistent=false" "" \
            "[Install]" "WantedBy=timers.target" \
            > junity_pm/polymarket-15min.timer

          # ПРОИЗВОДНЫЕ БЕЗ ExecStartPost: пуш с машины требует токена на
          # диске. Документ Code-3 сам предлагает этот путь и советует его.
          #
          # --sutki ВЧЕРА, А НЕ ВСЕ СУТКИ -- СЛОВО ВЛАДЕЛЬЦА И ЗАМЕР. Без
          # --sutki скрипт обходит ВСЕ сутки, какие есть в сыром, и притом
          # от самых старых (sorted), а юнит ограничен TimeoutStartSec=1800:
          # когда сырого накопится к тридцати суткам, systemd убьёт проход ДО
          # последних суток -- ровно тех, за которыми ночная цепочка и
          # затевается. Второе: питоновский gzip-писатель штампует в заголовок
          # текущее время, поэтому полный пересчёт делал ВСЕ часовые файлы
          # побайтово новыми (замерено: два пересчёта одних данных дают разные
          # sha256) -- и каждая ночь уносила бы в ветку весь архив заново.
          # Процент удвоен: systemd читает одиночный как свой спецификатор.
          cat > junity_pm/polymarket-proizvodnye.service <<'PROIZV_GOLOVA'
          [Unit]
          Description=Polymarket: proizvodnye minutnye rjady za VCHERA (push -- progonom na begunke)

          [Service]
          PROIZV_GOLOVA
          printf '%s\n' "$OBSHCHEE" >> junity_pm/polymarket-proizvodnye.service
          # ExecStartPre -- СУТОЧНЫЙ ОБХОД СТАВОК СБОРА по каждому токену
          # выбора (/fee-rate, пакетной формы у эндпоинта нет). Он стоит в
          # юните документа, и я его переношу; ExecStartPost с --push из того
          # же юнита НЕ переношу -- он требует токена записи на машине.
          #
          # ПРОЦЕНТ УДВОЕН, И ЗДЕСЬ Я РАСХОЖУСЬ С ini-БЛОКОМ ДОКУМЕНТА.
          # В документе строка написана с одиночным +%F. systemd читает
          # процент как свой спецификатор: замерено отрицательным контролем --
          # одиночный даёт "Failed to resolve unit specifiers ... Invalid
          # slot" и fatal error, удвоенный проходит verify чисто и
          # разворачивается в +%F для /bin/sh. /bin/sh -c обязателен: systemd
          # сам подстановку $(...) не делает -- это в документе сказано верно.
          cat >> junity_pm/polymarket-proizvodnye.service <<'PROIZV_HVOST'
          ExecStartPre=/usr/bin/python3 analysis/polymarket_put.py --sbory --rynkov RYNKOV_PODSTANOVKA --pauza 0.4
          ExecStart=/bin/sh -c '/usr/bin/python3 analysis/polymarket_put.py --proizvodnye --sutki "$(date -u -d yesterday +%%F)"'
          TimeoutStartSec=1800
          PROIZV_HVOST
          # Подстановка числа рынков -- отдельной строкой: внутри закрытого
          # heredoc переменные нарочно не раскрываются (там живёт $(date)).
          sed -i "s/RYNKOV_PODSTANOVKA/$RYNKOV/" junity_pm/polymarket-proizvodnye.service
          printf '%s\n' "[Unit]" "Description=Polymarket: proizvodnye v 03:23 UTC" "" \
            "[Timer]" "OnCalendar=*-*-* 03:23:00 UTC" "Persistent=true" "" \
            "[Install]" "WantedBy=timers.target" \
            > junity_pm/polymarket-proizvodnye.timer

          # РОТАЦИЯ БЕЗОПАСНА И БЕЗ АРТЕФАКТОВ: скрипт удаляет сырое ТОЛЬКО
          # там, где стоит отметка об артефакте, а отметок пока нет -- значит
          # он не удалит ничего и назовёт сутки вслух ("ЖДУТ АРТЕФАКТА").
          {
            printf '%s\n' "[Unit]" \
              "Description=Polymarket: chistka syrogo starshe $SUTOK_SYROGO sutok (tolko posle artefakta)" \
              "" "[Service]"
            printf '%s\n' "$OBSHCHEE"
            printf '%s\n' \
              "ExecStart=/usr/bin/python3 analysis/polymarket_put.py --rotacija --dnej $SUTOK_SYROGO" \
              "TimeoutStartSec=600"
          } > junity_pm/polymarket-rotacija.service
          printf '%s\n' "[Unit]" "Description=Polymarket: rotacija v 05:11 UTC" "" \
            "[Timer]" "OnCalendar=*-*-* 05:11:00 UTC" "Persistent=true" "" \
            "[Install]" "WantedBy=timers.target" \
            > junity_pm/polymarket-rotacija.timer

          echo "--- chto napisali ---"
          for F in junity_pm/*; do
            echo "=== $F ==="; cat "$F"
            [ -s "$F" ] || { echo "SBOJ: $F pust"; exit 1; }
            grep -q '^\[Unit\]' "$F" || { echo "SBOJ: v $F net sekcii [Unit]"; exit 1; }
          done
          # СТРОКИ ПУША В ЮНИТАХ БЫТЬ НЕ ДОЛЖНО -- проверяем, а не надеемся.
          if grep -l -- '--push' junity_pm/* 2>/dev/null; then
            echo "SBOJ: v junite ostalas stroka pusha s mashiny -- eto token na hoste"
            exit 1
          fi
          echo "stroki pusha s mashiny net ni v odnom junite"
          # ПЕРЕЧИСЛЕНИЕ ИМЁН РУКАМИ -- ИМЕННО ОНО СЛОМАЛО ПРОГОН 39030264557.
          # Новый юнит polymarket-15min.* был собран и проверен локально, но в
          # списке scp его имени не было: на ящик он не уехал, и дальше
          # `systemctl enable --now polymarket-15min.timer` отказал ("Unit
          # ... does not exist"), а шаг упал. Цена ошибки оказалась выше
          # красного прогона: новая пятиминутка БЕЗ событий уже уехала и
          # перечиталась, а юнита событий не было -- то есть события не
          # собирались вовсе, пока это не исправили.
          #
          # Теперь едет вся папка, а список имён проверяется ровно по тому
          # набору, который ниже включается на машине: не собран хоть один --
          # отказ ЗДЕСЬ, до единой правки на ящике.
          for U in otbor min 5min 15min proizvodnye rotacija; do
            for E in service timer; do
              [ -s "junity_pm/polymarket-$U.$E" ] \
                || { echo "SBOJ: ne sobran junity_pm/polymarket-$U.$E"; exit 1; }
            done
          done
          echo "junitov sobrano: $(ls -1 junity_pm | wc -l) fajlov, vse shest par na meste"
          scp -i ~/.ssh/ams_key -o StrictHostKeyChecking=accept-new \
            junity_pm/* root@"$HOST_LAB":/etc/systemd/system/
          echo "juniti dostavleny"
          # ЧТО ЛЕГЛО НА ЯЩИК -- СВЕРЯЕМ СРАЗУ, а не на следующем шаге: scp
          # молчит про недосланное, если его имя просто не назвали.
          ssh -n $SSH_OPTS root@"$HOST_LAB" \
            "ls -1 /etc/systemd/system/polymarket-*.service /etc/systemd/system/polymarket-*.timer | sed 's#.*/##' | sort | tr '\n' ' '"

      - name: "ОТБОР СОСТАВА РУКАМИ -- один раз ДО включения таймеров"
        if: ${{ env.TOLKO_DIAGNOZ != 'yes' && env.OTBOR != 'no' }}
        run: |
          set -e
          set -o pipefail
          KOREN="$KOREN_PM"
          # СЛОВО ВЛАДЕЛЬЦА И ДОКУМЕНТА: отбор прогнать руками один раз ДО
          # включения таймеров -- без него data/polymarket/vybor.json пуст, и
          # минутный круг запрашивает нечего. Таймер отбора стоит на 00:02Z,
          # то есть сам он сработает только в полночь.
          ssh -n $SSH_OPTS root@"$HOST_LAB" \
            "cd $KOREN && if command -v sudo >/dev/null 2>&1; then sudo -u polymarket /usr/bin/python3 analysis/polymarket_put.py --otbor --rynkov $RYNKOV --pauza 0.4; else runuser -u polymarket -- /usr/bin/python3 analysis/polymarket_put.py --otbor --rynkov $RYNKOV --pauza 0.4; fi" \
            2>&1 | tee otbor_ams.txt
          echo "--- glavnye stroki otbora ---"
          grep -E '^(отбор за|выбрано рынков|суточный список|НЕ НАБРАЛОСЬ)' otbor_ams.txt || true
          # ПУСТОЙ СОСТАВ -- ОТКАЗ. Скрипт возвращает ненулевой код только
          # если не выбрал ВООБЩЕ ничего, но ноль в составе ловим и сами:
          # включать таймеры на пустом выборе значит писать час отказов.
          # Меньше ста рынков отказом НЕ считаем -- документ прямо говорит,
          # что это сам по себе результат, и он уедет в доклад числом.
          VYBRANO=$(grep -oE '^выбрано рынков [0-9]+' otbor_ams.txt | tail -1 | grep -oE '[0-9]+' || true)
          echo "VYBRANO_RYNKOV=${VYBRANO:-net}"
          if [ -z "$VYBRANO" ] || [ "$VYBRANO" -eq 0 ]; then
            echo "SBOJ: otbor ne vybral ni odnogo rynka -- tajmery ne vkljuchaju."
            exit 1
          fi
          echo "--- vybor.json na mashine ---"
          ssh -n $SSH_OPTS root@"$HOST_LAB" \
            "python3 -c \"import json,sys; d=json.load(open('$KOREN/data/polymarket/vybor.json',encoding='utf-8')); print('rynkov', len(d.get('markets') or []), 'tokenov', len(d.get('tokens') or []))\"" \
            2>&1 | tee -a otbor_ams.txt

      - name: "Включить таймеры (все пять)"
        id: tajmery
        if: ${{ env.TOLKO_DIAGNOZ != 'yes' }}
        run: |
          set -e
          set -o pipefail
          KOREN="$KOREN_PM"
          # СОСТАВ ПРОВЕРЯЕМ ПЕРЕД ВКЛЮЧЕНИЕМ, И ПРИ ЛЮБОМ OTBOR. Отбить
          # включение на пустом выборе умел только шаг ручного отбора, а с
          # OTBOR=no он пропускается -- и тогда слово владельца "прогнать
          # отбор ДО включения таймеров" держалось бы лишь памятью о прошлом
          # прогоне. Пустой либо отсутствующий vybor.json означает сутки
          # отказов "нет выбора рынков" до 00:02Z, поэтому это отказ, а не
          # предупреждение. Проверка только читает файл на машине.
          ssh -n $SSH_OPTS root@"$HOST_LAB" \
            "python3 -c \"import json,sys,os; p='$KOREN/data/polymarket/vybor.json'; d=(json.load(open(p,encoding='utf-8')) if os.path.exists(p) else {}); print('SOSTAV rynkov', len(d.get('markets') or []), 'tokenov', len(d.get('tokens') or []))\"" \
            2>&1 | tee sostav_ams.txt
          SOSTAV=$(grep -oE '^SOSTAV rynkov [0-9]+' sostav_ams.txt | grep -oE '[0-9]+' || true)
          if [ -z "$SOSTAV" ] || [ "$SOSTAV" -eq 0 ]; then
            echo "SBOJ: vybor.json pust libo nechitaem (rynkov ${SOSTAV:-net}) -- tajmery ne vkljuchaju"
            exit 1
          fi
          echo "sostav na mashine: rynkov $SOSTAV -- vkljuchaju tajmery"
          ssh $SSH_OPTS root@"$HOST_LAB" 'bash -s' <<'VKLJUCHAEM' 2>&1 | tee tajmery_ams.txt
            set -e
            chmod 644 /etc/systemd/system/polymarket-*.service \
                      /etc/systemd/system/polymarket-*.timer
            systemctl daemon-reload
            # VERIFY ПО ВСЕМ ШЕСТИ СЛУЖБАМ, и смотрим на слова "fatal error",
            # а не на код возврата: verify ворчит и на безвредное.
            # 15min -- юнит снимка событий, отделённый от пятиминутки
            # словом владельца 17.10.
            PLOHIH=0
            for U in otbor min 5min 15min proizvodnye rotacija; do
              F="/etc/systemd/system/polymarket-$U.service"
              echo "--- verify $U ---"
              VYVOD=$(systemd-analyze verify "$F" 2>&1 || true)
              printf '%s\n' "${VYVOD:-(bez zamechanij)}" | head -6
              case "$VYVOD" in
                *"fatal error"*) echo "SBOJ: $F ne razbiraetsja"; PLOHIH=$((PLOHIH + 1)) ;;
              esac
            done
            [ "$PLOHIH" -eq 0 ] || { echo "SBOJ: plohih junitov $PLOHIH -- tajmery ne vkljuchaju"; exit 1; }
            systemctl enable --now polymarket-otbor.timer polymarket-min.timer \
                                   polymarket-5min.timer polymarket-15min.timer \
                                   polymarket-proizvodnye.timer \
                                   polymarket-rotacija.timer
            # РЕЖИМ СНИМКОВ И РОТАЦИИ -- ПЕЧАТАЕМ ИЗ САМИХ ЮНИТОВ НА ЯЩИКЕ.
            # Владелец просил доложить OnCalendar таймера событий и --dnej
            # ротации; доклад должен опираться на то, что лежит на машине, а
            # не на то, что я собирался записать.
            echo "--- REZHIM: chto na samom dele stoit v junitah ---"
            # ВСЕ ШЕСТЬ, А НЕ ПЯТЬ: в прогоне 39034546060 в этой печати не
            # хватало polymarket-proizvodnye.timer -- таймер есть и включён, а
            # в доклад его расписание не попадало.
            grep -H 'OnCalendar' /etc/systemd/system/polymarket-min.timer \
                 /etc/systemd/system/polymarket-5min.timer \
                 /etc/systemd/system/polymarket-15min.timer \
                 /etc/systemd/system/polymarket-otbor.timer \
                 /etc/systemd/system/polymarket-proizvodnye.timer \
                 /etc/systemd/system/polymarket-rotacija.timer \
              | sed 's#/etc/systemd/system/##'
            grep -H -- '--dnej' /etc/systemd/system/polymarket-rotacija.service \
              | sed 's#/etc/systemd/system/##'
            grep -H -- '--spisok' /etc/systemd/system/polymarket-15min.service \
                 /etc/systemd/system/polymarket-5min.service \
              | sed 's#/etc/systemd/system/##'
            # СОБЫТИЙ В ПЯТИМИНУТКЕ БЫТЬ НЕ ДОЛЖНО -- проверяем, а не верим.
            if grep -q 'gamma_events' /etc/systemd/system/polymarket-5min.service; then
              echo "SBOJ: gamma_events ostalsja v pjatiminutnom junite -- snimok sobytij shjol by kazhdye 5 minut"
              exit 1
            fi
            grep -q 'gamma_events' /etc/systemd/system/polymarket-15min.service \
              || { echo "SBOJ: v junite 15min net gamma_events"; exit 1; }
            echo "sobytija tolko v 15min, pjatiminutka ih ne sobiraet"
            # ЧТО СКАЗАЛА РОТАЦИЯ В ПОСЛЕДНИЙ РАЗ -- ТОЛЬКО ЧТЕНИЕ ЖУРНАЛА.
            # С правки d350b3e она удаляет сырое лишь при двух условиях сразу
            # (артефакт И посчитанные ряды), и единственное место, где видно,
            # какие сутки она отложила и почему, -- её собственный вывод.
            # Сами её не запускаем: у неё свой таймер в 05:11Z, а лишний
            # прогон тронул бы данные.
            echo "--- ROTACIJA: poslednij zapusk i chto skazala ---"
            # ВРЕМЯ БЕРЁМ ИЗ InactiveEnterTimestamp, А НЕ Active: у юнита типа
            # oneshot после отработки ActiveEnterTimestamp ПУСТ -- в прогоне
            # 39118035065 строка так и вышла "zapusk=" без значения, хотя
            # ротация прошла (журнал это показал).
            printf 'rotacija: kod=%s zakonchila=%s\n' \
              "$(systemctl show polymarket-rotacija.service -p ExecMainStatus --value 2>&1)" \
              "$(systemctl show polymarket-rotacija.service -p InactiveEnterTimestamp --value 2>&1)"
            journalctl -u polymarket-rotacija.service --no-pager -n 30 2>/dev/null \
              | grep -vE 'Starting|Started|Deactivated|Finished|Consumed' | tail -14 \
              || echo "(zhurnala rotacii net -- ni razu ne shla)"
            echo "--- tajmery ---"
            systemctl list-timers 'polymarket*' --all --no-pager
            echo "--- sostojanie ---"
            for T in polymarket-otbor.timer polymarket-min.timer polymarket-5min.timer \
                     polymarket-15min.timer polymarket-proizvodnye.timer \
                     polymarket-rotacija.timer; do
              printf '%s: enabled=%s active=%s\n' "$T" \
                "$(systemctl is-enabled "$T" 2>&1)" "$(systemctl is-active "$T" 2>&1)"
            done
          VKLJUCHAEM

      - name: "ПЕРВЫЙ ДОКЛАД: --probno (кто отвечает с ящика)"
        if: ${{ env.TOLKO_DIAGNOZ != 'yes' }}
        run: |
          set -e
          set -o pipefail
          KOREN="$KOREN_PM"
          # Запуск от того же пользователя, что и таймер: иначе проверили бы
          # доступ не того, кто ходит в сеть по-настоящему.
          ssh -n $SSH_OPTS root@"$HOST_LAB" \
            "cd $KOREN && if command -v sudo >/dev/null 2>&1; then sudo -u polymarket /usr/bin/python3 analysis/polymarket_put.py --kazhdye все --rynkov $RYNKOV --probno; else runuser -u polymarket -- /usr/bin/python3 analysis/polymarket_put.py --kazhdye все --rynkov $RYNKOV --probno; fi" \
            2>&1 | tee probno_ams.txt
          echo "--- itog proby ---"
          tail -3 probno_ams.txt

      - name: "Первый прогон таймеров и --svodka (снимки на диске)"
        if: ${{ env.TOLKO_DIAGNOZ != 'yes' }}
        run: |
          set -e
          set -o pipefail
          ssh $SSH_OPTS root@"$HOST_LAB" "KOREN='$KOREN_PM' bash -s" <<'PROBA' 2>&1 | tee svodka_ams.txt
            set -e
            systemctl start polymarket-5min.service || true
            systemctl start polymarket-15min.service || true
            systemctl start polymarket-min.service || true
            sleep 3
            echo "--- sostojanie sluzhb posle pervogo zapuska ---"
            for U in polymarket-min polymarket-5min polymarket-15min; do
              printf '%s: %s\n' "$U" "$(systemctl show "$U" -p ExecMainStatus --value 2>&1)"
              journalctl -u "$U" --no-pager -n 4 2>/dev/null | tail -3 || true
            done
            echo "--- chto leglo na disk ---"
            find "$KOREN/data/polymarket" -type f -printf '%10s B  %p\n' 2>/dev/null \
              | sort -k3 | head -20
            echo "fajlov: $(find "$KOREN/data/polymarket" -type f 2>/dev/null | wc -l)"
            du -sh "$KOREN/data/polymarket" 2>/dev/null || true
            echo "--- vybor rynkov ---"
            # ВНУТРИ heredoc-а ssh ВЛОЖЕННОГО heredoc-а БЫТЬ НЕ МОЖЕТ, и это
            # не придирка: тело уезжает на хост С ОТСТУПОМ, а bash ждёт
            # ограничитель в нулевой колонке -- поймано своей же проверкой
            # разбора ("here-document delimited by end-of-file (wanted PY)").
            # Поэтому питон одной строкой через -c, без heredoc.
            if [ -f "$KOREN/data/polymarket/vybor.json" ]; then
              python3 -c "import json,sys; d=json.load(open(sys.argv[1],encoding='utf-8')); print('rynkov:', len(d.get('markets') or []), 'tokenov:', len(d.get('tokens') or []))" \
                "$KOREN/data/polymarket/vybor.json"
            else
              echo "vybor.json ne polozhen -- znachit zapros /events ne udalsja"
            fi
            echo "--- svodka ---"
            cd "$KOREN"
            if command -v sudo >/dev/null 2>&1; then
              sudo -u polymarket /usr/bin/python3 analysis/polymarket_put.py --svodka || true
            else
              runuser -u polymarket -- /usr/bin/python3 analysis/polymarket_put.py --svodka || true
            fi
          PROBA

      - name: "СТОРОЖ ДИСКА lab-ams: тот же скрипт, что на miami (пункт 2)"
        if: ${{ env.TOLKO_DIAGNOZ != 'yes' }}
        run: |
          set -e
          set -o pipefail
          KOREN="$KOREN_PM"
          # СЛОВО ВЛАДЕЛЬЦА: тот же скрипт, что на miami, порог 10 ГБ, раз в
          # час. Повод назван замером: сырое Polymarket идёт 26.8 МБ/час
          # (643 МБ/сутки, из них 74 % -- снимок событий), диск ящика 43 ГБ,
          # хранение сырого 30 суток. Без места регистратор молча теряет
          # снимки -- ровно тот отказ, за который уже заплатили на miami.
          #
          # СКРИПТ ОДИН НА ДВА ЯЩИКА: разное у них только корень клона,
          # список таймеров и путь маркера -- всё три приходят переменными
          # окружения, а умолчания остались миамскими, чтобы прежняя
          # установка не поменялась ни на букву.
          scp -i ~/.ssh/ams_key -o StrictHostKeyChecking=accept-new \
            deploy/lab_storozh_diska.sh \
            root@"$HOST_LAB":/usr/local/sbin/lab_storozh_diska.sh
          mkdir -p junity_st
          # ОСТАНАВЛИВАЕМ ТОЛЬКО СОБИРАТЕЛЕЙ -- ОТБОР, МИНУТНЫЙ И ПЯТИМИНУТНЫЙ.
          # Сначала в списке стояли все пять, и это была ловушка, из которой
          # ящик не вышел бы сам:
          #   -- polymarket-rotacija -- ЕДИНСТВЕННОЕ, что освобождает место
          #      (удаляет сырое старше 30 суток с подтверждённой отметкой).
          #      Остановив её вместе с остальными, сторож замораживал
          #      свободное место ровно на том значении, при котором маркер не
          #      снимается: собирать нечего, удалять нечем, возврата не будет
          #      НИКОГДА -- при обещании скрипта "маркер снимется сам";
          #   -- polymarket-proizvodnye считает производные, которые суточный
          #      прогон и везёт в ветку. Без них шаг переноса видит ноль
          #      файлов за сутки и отказывает, а вместе с ним пропускается
          #      пуш -- то есть МАРКЕР НЕ УЕЗЖАЕТ именно в ту ночь, для
          #      которой он придуман. Слово владельца -- "кладёт маркер,
          #      который уезжает твоим пушем", значит путь пуша глушить нельзя.
          # Рост диска дают собиратели (gamma_events 1.2 МБ на снимок каждые
          # 5 минут, книги и сделки -- каждую минуту); производные за сутки --
          # 0.19 МБ, одна сборка --sbory перед ними около 2 МБ. Останавливаем
          # то, что пишет много, и оставляем то, что убирает и докладывает.
          #
          # ЗНАЧЕНИЕ С ПРОБЕЛАМИ В Environment= ОБЯЗАНО БЫТЬ В КАВЫЧКАХ, и это
          # замер, а не вкус. Без кавычек systemd разбивает строку по пробелам
          # и ругается "Invalid environment assignment, ignoring: b.timer",
          # оставляя переменной ТОЛЬКО первое слово -- то есть сторож
          # остановил бы один таймер из пяти и ушёл молча, потому что
          # systemd-analyze verify при этом всё равно отдаёт код 0. Проверено
          # обоими вариантами на этой же машине.
          printf '%s\n' "[Unit]" \
            "Description=Storozh diska: malo mesta -- ostanovit registrator Polymarket" "" \
            "[Service]" "Type=oneshot" \
            "Environment=PODB_KOREN=$KOREN" \
            "Environment=STOROZH_POROG_GB=10" \
            "Environment=STOROZH_METKA=$KOREN/data/polymarket/DISK_STOP" \
            'Environment="STOROZH_TAJMERY=polymarket-otbor.timer polymarket-min.timer polymarket-5min.timer polymarket-15min.timer"' \
            "ExecStart=/usr/local/sbin/lab_storozh_diska.sh" \
            "TimeoutStartSec=120" "Nice=10" \
            > junity_st/polymarket-storozh-diska.service
          # :37, А НЕ :47 -- на :47 стоит сторож на miami; разводим минуты,
          # чтобы два ящика не ходили в один и тот же момент (им это ничем не
          # мешает, но в журналах так разборчивее).
          printf '%s\n' "[Unit]" "Description=Storozh diska Polymarket raz v chas" "" \
            "[Timer]" "OnCalendar=*-*-* *:37:00 UTC" "AccuracySec=30s" "Persistent=true" "" \
            "[Install]" "WantedBy=timers.target" \
            > junity_st/polymarket-storozh-diska.timer
          for F in junity_st/*; do
            echo "=== $F ==="; cat "$F"
            [ -s "$F" ] || { echo "SBOJ: $F pust"; exit 1; }
          done
          scp -i ~/.ssh/ams_key -o StrictHostKeyChecking=accept-new \
            junity_st/polymarket-storozh-diska.service \
            junity_st/polymarket-storozh-diska.timer \
            root@"$HOST_LAB":/etc/systemd/system/
          # КОРЕНЬ ПЕРЕДАЁМ ЯВНО: внутри ssh-пятки своё окружение, и проверка
          # маркера должна смотреть на ТОТ путь, который записан в юните.
          ssh $SSH_OPTS root@"$HOST_LAB" "KOREN='$KOREN' bash -s" <<'STOROZH' 2>&1 | tee storozh_ams.txt
            set -e
            chmod 755 /usr/local/sbin/lab_storozh_diska.sh
            chmod 644 /etc/systemd/system/polymarket-storozh-diska.service \
                      /etc/systemd/system/polymarket-storozh-diska.timer
            systemctl daemon-reload
            # ЗАПАСНАЯ ТОЧКА ОТСЧЁТА для журнала, если InvocationID пуст.
            TOCHKA=$(date '+%Y-%m-%d %H:%M:%S')
            VYVOD=$(systemd-analyze verify /etc/systemd/system/polymarket-storozh-diska.service 2>&1 || true)
            printf '%s\n' "${VYVOD:-(bez zamechanij)}" | head -6
            case "$VYVOD" in
              *"fatal error"*) echo "SBOJ: junit storozha ne razbiraetsja"; exit 1 ;;
            esac
            systemctl enable --now polymarket-storozh-diska.timer
            echo "--- stroka Environment v postavlennom junite ---"
            grep -n 'Environment=' /etc/systemd/system/polymarket-storozh-diska.service
            echo "--- proba storozha pri zhivom diske (dolzhen tolko napechatat svobodu) ---"
            systemctl start polymarket-storozh-diska.service
            journalctl -u polymarket-storozh-diska.service --no-pager -n 12 | tail -8
            printf 'tajmer: enabled=%s active=%s\n' \
              "$(systemctl is-enabled polymarket-storozh-diska.timer 2>&1)" \
              "$(systemctl is-active polymarket-storozh-diska.timer 2>&1)"
            # ЖУРНАЛ ЧИТАЕМ ПО InvocationID, А НЕ ПОСЛЕДНИЕ N СТРОК -- ЭТО
            # ЗАМЕР, А НЕ ВКУС. Прогон 38974890550 (мой же) покраснел именно
            # здесь: в последних сорока строках журнала лежал ЕЩЁ И ЗАПУСК
            # 22:08 со старым, незакавыченным юнитом, поэтому 'grep -m1'
            # выхватывал его строку с одним таймером, а поиск жалобы
            # "Invalid environment assignment" находил прошлую жалобу. Контроль
            # ругался на уже исправленный юнит. InvocationID однозначно
            # указывает на ТОТ запуск, который мы только что сделали.
            INV=$(systemctl show -p InvocationID --value polymarket-storozh-diska.service 2>/dev/null || true)
            ZHURNAL=""
            if [ -n "$INV" ]; then
              echo "invocation: $INV"
              ZHURNAL=$(journalctl _SYSTEMD_INVOCATION_ID="$INV" --no-pager 2>/dev/null || true)
            fi
            # ПУСТОЙ ЖУРНАЛ ПО InvocationID -- ТОЖЕ ПОВОД К ЗАПАСНОМУ ПУТИ, и
            # замечание не моё: разбор указал, что у завершившейся службы
            # Type=oneshot show -p InvocationID может отдать не пустую строку,
            # а нули. Тогда [ -n "$INV" ] истинно, журнал по такому ID пуст,
            # список таймеров пуст -- и утверждение ниже дало бы ЛОЖНЫЙ отказ
            # на исправном юните, то есть ровно ту беду, от которой чинили.
            # Проверяем не вид строки, а результат: нет строк -- читаем по
            # времени.
            if [ -z "$ZHURNAL" ]; then
              echo "zhurnal po invocation pust -- chitaju po vremeni s $TOCHKA"
              ZHURNAL=$(journalctl -u polymarket-storozh-diska.service --since "$TOCHKA" --no-pager 2>/dev/null || true)
            fi
            # ПЕРЕМЕННАЯ ДОШЛА ЦЕЛИКОМ -- ПРОВЕРЯЕМ, А НЕ НАДЕЕМСЯ. Скрипт
            # печатает свой список таймеров первой же строкой; если Environment
            # разобрался неверно, в журнале будет один таймер вместо пяти.
            # tail -1, А НЕ grep -m1: окно уже сужено до одного запуска, но
            # последняя строка верна и в том случае, если в окно всё же
            # попало больше одного -- а первая была бы самой старой.
            SPISOK=$(printf '%s\n' "$ZHURNAL" | grep 'tajmery:' | tail -1 || true)
            echo "chto uvidel skript -> ${SPISOK:-stroki tajmerov v zhurnale net}"
            NET=0
            for T in polymarket-otbor polymarket-min polymarket-5min polymarket-15min; do
              case "$SPISOK" in
                *"$T.timer"*) : ;;
                *) echo "SBOJ: v spiske storozha net $T.timer"; NET=$((NET + 1)) ;;
              esac
            done
            [ "$NET" -eq 0 ] || { echo "SBOJ: storozh poluchil ne vse tajmery ($NET ne hvataet)"; exit 1; }
            # РОТАЦИИ И ПРОИЗВОДНЫХ В СПИСКЕ БЫТЬ НЕ ДОЛЖНО -- см. объяснение
            # выше. Проверяем это, а не держим в голове.
            case "$SPISOK" in
              *polymarket-rotacija*|*polymarket-proizvodnye*)
                echo "SBOJ: v spiske storozha est rotacija libo proizvodnye -- togda vozvrat mesta i push markera nevozmozhny"
                exit 1 ;;
            esac
            echo "storozh vidit vse chetyre tajmera sobiratelej i ne vidit rotacii"
            echo "--- zhalovalsja li systemd na razbor Environment v ETOM zapuske ---"
            printf '%s\n' "$ZHURNAL" \
              | grep -i 'Invalid environment assignment' && { echo "SBOJ: systemd razbil Environment"; exit 1; } || echo "zhalob na Environment net"
            echo "--- svobodno sejchas ---"
            df -h / | tail -1
            echo "--- marker (dolzhen otsutstvovat pri svobodnom diske) ---"
            ls -l "$KOREN/data/polymarket/DISK_STOP" 2>&1 || echo "markera net -- tak i dolzhno byt"
          STOROZH

      - name: "ПОЧЕМУ НЕ ЛЁГ ВЫБОР РЫНКОВ: код и причина из самого снимка"
        if: ${{ always() && env.TOLKO_DIAGNOZ != 'yes' }}
        run: |
          set -e
          set -o pipefail
          # ЗАЧЕМ. Прогон 38932243665: таймеры включены, самопроверка зелёная,
          # но data/polymarket/vybor.json не лёг -- значит запрос /events не
          # удался, и минутному кругу читать нечего. Состав рынков -- корень
          # всего сбора, поэтому код и причину берём ИЗ САМОГО СНИМКА, а не из
          # догадки: снимок отказа хранится такой же строкой, с кодом.
          #
          # ПИТОН ОДНОЙ СТРОКОЙ, И ЭТО НЕ СТИЛЬ. Многострочная строка в
          # двойных кавычках внутри блока run начинается с меньшим отступом и
          # ЗАКРЫВАЕТ блок YAML -- поймано своей же проверкой разбора
          # ("could not find expected ':'"), на этом же месте, второй раз за
          # день. Поэтому списковое включение в одну строку, без переносов.
          ssh $SSH_OPTS root@"$HOST_LAB" "KOREN='$KOREN_PM' bash -s" \
            <<'PRICHINA' 2>&1 | tee prichina_ams.txt
            set -e
            SV=$(find "$KOREN/data/polymarket/gamma_events" -type f -name '*.jsonl.gz' 2>/dev/null | sort | tail -1)
            echo "svezhij snimok sostava: ${SV:-net}"
            if [ -n "$SV" ]; then
              zcat "$SV" | python3 -c "import json,sys; [print('utc', s.get('utc'), '| kod', s.get('код'), '| bajt', s.get('байт'), '| oshibka', s.get('ошибка'), '| telo', str(s.get('тело'))[:200]) for s in (json.loads(l) for l in sys.stdin if l.strip())]" 2>&1 | head -8
            fi
            # КНИГИ ОТДЕЛЬНО: ПУСТАЯ КНИГА -- ЭТО НЕ ОТКАЗ, И ПОТОМУ ОПАСНЕЕ.
            # Замер прогона 38942288866: состав рынков лёг (3789 рынков,
            # 7578 токенов), снимки книг идут с кодом 200, а уровней в них
            # НОЛЬ -- "книг 30 уровней 0", медиана глубины 0.0. Код 200 это
            # молчанием не покажет, поэтому смотрим САМО ТЕЛО свежего снимка:
            # сколько книг пришло на сколько запрошенных токенов и что в
            # первой книге. Только чтение; скрипт Code-3/Code-4 не правим.
            KN=$(find "$KOREN/data/polymarket/clob_books" -type f -name '*.jsonl.gz' 2>/dev/null | sort | tail -1)
            echo "svezhij snimok knig: ${KN:-net}"
            if [ -n "$KN" ]; then
              zcat "$KN" | tail -1 | python3 -c "import json,sys; s=json.loads(sys.stdin.read() or '{}'); t=s.get('тело'); z=s.get('запрос') or {}; print('kod', s.get('код'), '| bajt', s.get('байт'), '| oshibka', s.get('ошибка')); print('zaprosheno tokenov:', (z.get('tokenov') if isinstance(z, dict) and 'tokenov' in z else ('podpis: ' + json.dumps(z, ensure_ascii=False)[:120]))); print('tip tela:', type(t).__name__, '| knig v otvete:', (len(t) if isinstance(t, list) else 'ne spisok')); print('pervaja kniga:', json.dumps((t[0] if isinstance(t, list) and t else t), ensure_ascii=False)[:400]); print('razbor:', json.dumps(s.get('разбор'), ensure_ascii=False)[:300])" 2>&1 | head -12
            fi
            echo "--- kody prochih spiskov ---"
            for SP in clob_books clob_prices clob_time data_trades clob_midpoints; do
              F=$(find "$KOREN/data/polymarket/$SP" -type f -name '*.jsonl.gz' 2>/dev/null | sort | tail -1)
              [ -n "$F" ] || { echo "$SP: fajlov net"; continue; }
              echo "$SP: $(zcat "$F" | python3 -c "import json,sys; print(','.join(str(json.loads(l).get('код')) + '/' + str(json.loads(l).get('ошибка'))[:40] for l in sys.stdin if l.strip())[:200])" 2>&1)"
            done
          PRICHINA

      - name: "ПРОБА ПОЛЯ СОРТИРОВКИ /events (только чтение, ни одной заявки)"
        if: ${{ always() && env.TOLKO_DIAGNOZ != 'yes' }}
        run: |
          set -e
          set -o pipefail
          # ЗАЧЕМ ЭТОТ ШАГ, А НЕ ПРАВКА ПО ДОГАДКЕ. Прогон 38933292283 назвал
          # причину молчания регистратора: /events отдаёт 422 с телом
          # {'type': 'validation error', 'error': 'order fields are not
          # valid'} -- то есть сервер отвергает ИМЯ ПОЛЯ сортировки
          # (order=volume_24hr) из документа Code-3. Без состава рынков
          # минутный круг пуст, и это корень всего сбора.
          #
          # Поэтому меряем, а не угадываем: шесть кандидатов, первый и
          # последний -- контрольные (документ, ждём 422; совсем без order,
          # ждём 200). Тот же приём, каким ловился живой путь KOTH у
          # трендингов. ТОЛЬКО ЧТЕНИЕ: GET без подписи, ни одной заявки,
          # ключей нет; скрипт Code-3 этим шагом НЕ правится.
          ssh $SSH_OPTS root@"$HOST_LAB" 'bash -s' <<'PROBA_ORDER' 2>&1 | tee order_ams.txt
            set -e
            BAZA="https://gamma-api.polymarket.com/events?active=true&closed=false&limit=5"
            # Имя кандидата и хвост запроса разделены двоеточием.
            KANDIDATY="dokument:&order=volume_24hr&ascending=false
            bez_podchjorkivanija:&order=volume24hr&ascending=false
            volume:&order=volume&ascending=false
            liquidity:&order=liquidity&ascending=false
            camel:&order=volume24Hr&ascending=false
            bez_order_kontrol:"
            printf '%s\n' "$KANDIDATY" | while IFS= read -r STROKA; do
              IMJA=${STROKA%%:*}
              HVOST=${STROKA#*:}
              IMJA=$(printf '%s' "$IMJA" | tr -d ' ')
              URL="$BAZA$HVOST"
              OTVET=$(curl -sS -o /tmp/.ev_telo -w '%{http_code} %{size_download}' \
                      --max-time 20 -A 'polymarket-put/1.0 (+read-only)' "$URL" 2>&1 || echo "sboj svjazi")
              NACH=$(head -c 120 /tmp/.ev_telo 2>/dev/null | tr -d '\n')
              printf 'KANDIDAT %-22s %s | telo: %s\n' "$IMJA" "$OTVET" "$NACH"
            done
            rm -f /tmp/.ev_telo
          PROBA_ORDER
          echo "--- kto otvetil 200 ---"
          grep -E 'KANDIDAT .* 200 ' order_ams.txt || echo "ni odin kandidat ne otdal 200"

      # ЗАМЕР ВЛАДЕЛЬЦА НЕ ЗАЛОЖНИК СТОРОЖА. В прогоне 38974890550 шаг
      # сторожа упал на моём же контроле, и круги были ПРОПУЩЕНЫ -- то есть
      # главные числа пункта 1 пропали из-за постороннего шага. Условие
      # привязано к шагу включения таймеров: нет установки -- нет и замера,
      # а падение сторожа замеру не мешает.
      - name: "ДВА МИНУТНЫХ КРУГА И ГЛУБИНА КНИГ (пункт 1 владельца)"
        if: ${{ !cancelled() && steps.tajmery.outcome == 'success' && env.TOLKO_DIAGNOZ != 'yes' && env.KRUGI == 'yes' }}
        run: |
          set -e
          set -o pipefail
          KOREN="$KOREN_PM"
          # КРУГИ ЗАПУСКАЕМ САМИ, А НЕ ЖДЁМ ТАЙМЕРА, и это не нетерпение:
          # ждать минутный таймер значит ждать случайную долю минуты плюс
          # AccuracySec, а доклад просили по ДВУМ кругам. Юнит oneshot, два
          # запуска с паузой дают ровно два круга и ничего не ломают.
          ssh $SSH_OPTS root@"$HOST_LAB" "KOREN='$KOREN' bash -s" <<'KRUGI_SH' 2>&1 | tee krugi_ams.txt
            set -e
            SEGODNJA=$(date -u +%F)
            CHAS=$(date -u +%H)
            echo "--- krug 1 ---"
            systemctl start polymarket-min.service || true
            systemctl show polymarket-min.service -p ExecMainStatus --value
            sleep 60
            echo "--- krug 2 ---"
            systemctl start polymarket-min.service || true
            systemctl show polymarket-min.service -p ExecMainStatus --value
            sleep 5
            echo "--- sostav rynkov ---"
            if [ -f "$KOREN/data/polymarket/vybor.json" ]; then
              python3 -c "import json,sys; d=json.load(open(sys.argv[1],encoding='utf-8')); print('RYNKOV=', len(d.get('markets') or []), 'TOKENOV=', len(d.get('tokens') or []))" \
                "$KOREN/data/polymarket/vybor.json"
            else
              echo "RYNKOV= 0 TOKENOV= 0 (vybor.json ne polozhen -- /events vsjo eshchjo otkazyvaet)"
            fi
            # МБ ПО СУТКАМ -- ПРЯМЫМ ЗАМЕРОМ, А НЕ ВЫЧИТАНИЕМ. Раздел
            # "--svodka" скрипта Code-4 печатает НАКОПЛЕННОЕ ПО ВСЕМ СУТКАМ на
            # диске, а не за сутки: его "снимков" и "МБ" складывают все даты.
            # Я принял эти числа за суточные и доложил владельцу 1.24 ГБ/сутки
            # вместо настоящих ~0.76 -- ошибка в 1.6 раза, и она касалась
            # решения о частоте снимка событий. Поэтому суточные числа теперь
            # берутся отдельно и по датам: сколько МБ лёг КАЖДЫЙ день по
            # каждому списку. Только чтение.
            echo "--- MB PO SUTKAM po spiskam (prjamoj zamer, ne vychitanie) ---"
            for D in $(date -u +%F) $(date -u -d yesterday +%F) $(date -u -d '2 days ago' +%F); do
              ITOGO=0
              STROKA=""
              for SP in "$KOREN"/data/polymarket/*/; do
                IMJA=$(basename "$SP")
                case "$IMJA" in proizvodnye|artefakty) continue ;; esac
                [ -d "$SP$D" ] || continue
                BAJT=$(find "$SP$D" -type f -name '*.jsonl.gz' -printf '%s\n' 2>/dev/null \
                       | awk '{s += $1} END {printf "%d", s + 0}')
                [ "$BAJT" -gt 0 ] || continue
                ITOGO=$((ITOGO + BAJT))
                STROKA="$STROKA $IMJA=$(awk -v b="$BAJT" 'BEGIN{printf "%.2f", b/1048576}')"
              done
              printf 'SUTKI %s vsego %.2f MB:%s\n' "$D" \
                "$(awk -v b="$ITOGO" 'BEGIN{print b/1048576}')" "$STROKA"
            done
            echo "--- MB za chas $CHAS po spiskam ---"
            for D in "$KOREN"/data/polymarket/*/"$SEGODNJA"; do
              [ -d "$D" ] || continue
              SP=$(basename "$(dirname "$D")")
              case "$SP" in proizvodnye|artefakty) continue ;; esac
              BAJT=$(find "$D" -maxdepth 1 -type f -name "$CHAS*.jsonl.gz" -printf '%s\n' 2>/dev/null \
                     | awk '{s+=$1} END {printf "%d", s+0}')
              STROK=$(find "$D" -maxdepth 1 -type f -name "$CHAS*.jsonl.gz" -exec zcat {} + 2>/dev/null | wc -l)
              printf '  %-16s %8.2f MB  snimkov %5s\n' "$SP" "$(awk -v b="$BAJT" 'BEGIN{print b/1048576}')" "$STROK"
            done
            echo "--- proizvodnye za segodnja (dlja glubiny knig) ---"
            if command -v sudo >/dev/null 2>&1; then
              (cd "$KOREN" && sudo -u polymarket /usr/bin/python3 analysis/polymarket_put.py --proizvodnye --sutki "$SEGODNJA") || echo "proizvodnye otkazali -- prichina vyshe"
            else
              (cd "$KOREN" && runuser -u polymarket -- /usr/bin/python3 analysis/polymarket_put.py --proizvodnye --sutki "$SEGODNJA") || echo "proizvodnye otkazali -- prichina vyshe"
            fi
            PR="$KOREN/data/polymarket/proizvodnye/$SEGODNJA"
            if [ -d "$PR" ]; then
              echo "--- GLUBINA KNIG: mediana urovnej bid/ask ---"
              # ЧИСЛА РОВНО ТЕ, ЧТО ПРОСИЛ ВЛАДЕЛЕЦ: сколько строк, у скольких
              # книга НЕПУСТА, медианы уровней bid/ask и медиана спреда В
              # ТИКАХ. tick_size и spred в производных уже числа (скрипт
              # Code-4 проводит их через _чис), поэтому хватает isinstance.
              # Тики, а не центы: максимальный спред награды считается от
              # середины и у рынков разный tick_size, так что спред в тиках --
              # единственная сравнимая мера.
              #
              # СТРОКА -- ЭТО СНИМОК, А НЕ КНИГА, и потому число названо
              # strok_nepustyh, а не knig_nepustyh. В суточных производных на
              # каждый токен приходится по строке на каждый минутный круг,
              # поэтому прежнее имя отвечало на другой вопрос: при 200 токенах
              # выбора оно выдало 1000 -- впятеро больше, чем книг. На вопрос
              # владельца "у скольких книга непуста" отвечает
              # tokenov_s_nepustoj_knigoj во второй строке.
              #
              # ВТОРАЯ СТРОКА, ПО НЕПУСТЫМ КНИГАМ -- НЕ УКРАШЕНИЕ. Прогон
              # 38973828932 отдал медианы 0.0 при 1000 непустых книгах из
              # 3710 строк: в суточных производных лежат И строки ДО правки
              # Code-4 (10 токенов, книги пустые, уровней ноль), и они в
              # большинстве, поэтому медиана по всем строкам показывает
              # прошлое, а не нынешний сбор. Считаем оба числа и печатаем
              # оба -- иначе доклад соврёт в обе стороны сразу.
              find "$PR" -type f -name '*.jsonl.gz' -exec zcat {} + 2>/dev/null \
                | python3 -c "import json,sys,statistics as st; r=[json.loads(l) for l in sys.stdin if l.strip()]; chis=lambda v: isinstance(v, (int, float)) and not isinstance(v, bool); nz=[x for x in r if (x.get('urovnej_bid') or 0) + (x.get('urovnej_ask') or 0) > 0]; med=lambda s: (round(st.median(s), 2) if s else 'net'); ur=lambda s, k: med([x.get(k) for x in s if chis(x.get(k))]); tiki=lambda s: [x['spred'] / x['tick_size'] for x in s if chis(x.get('spred')) and chis(x.get('tick_size')) and x['tick_size'] > 0]; print('GLUBINA strok', len(r), 'tokenov', len({x.get('token_id') for x in r}), 'strok_nepustyh', len(nz), 'strok_pustyh', len(r) - len(nz), 'mediana_bid', ur(r, 'urovnej_bid'), 'mediana_ask', ur(r, 'urovnej_ask'), 'mediana_spreda_v_tikah', med(tiki(r))); print('GLUBINA_NEPUSTYE strok', len(nz), 'tokenov_s_nepustoj_knigoj', len({x.get('token_id') for x in nz}), 'mediana_bid', ur(nz, 'urovnej_bid'), 'mediana_ask', ur(nz, 'urovnej_ask'), 'mediana_spreda_v_tikah', med(tiki(nz)))"
            else
              echo "GLUBINA: proizvodnyh za $SEGODNJA net -- schitat ne iz chego"
            fi
          KRUGI_SH

      - name: "Выложить первый доклад артефактом"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: polymarket-ams-pervyj-doklad
          path: |
            diagnoz_ams.txt
            samoproverka_ams.txt
            ruff_ams.txt
            tajmery_ams.txt
            probno_ams.txt
            svodka_ams.txt
            prichina_ams.txt
            order_ams.txt
            krugi_ams.txt
            otbor_ams.txt
            storozh_ams.txt
          retention-days: 30
          if-no-files-found: warn

      - name: "СВОДКА ПРОГОНА: всё главное одним куском в конце"
        # Архив журналов и артефакты из этого контейнера недоступны (прокси
        # отвечает Forbidden и на results-receiver, и на хранилище артефактов),
        # читается ТОЛЬКО ХВОСТ журнала задания -- значит главное должно лежать
        # в хвосте, иначе замеры середины прогона нечем прочесть.
        if: ${{ always() }}
        run: |
          set -e
          echo "=== 1. MASHINA I BEGUNOK ==="
          if [ -f diagnoz_ams.txt ]; then
            grep -E '^(BEGUNKOV=|ruff:|sudo:|runuser:|Python|/dev/|jader:)' diagnoz_ams.txt || true
            head -2 diagnoz_ams.txt
          else
            echo "(shag ne shjol)"
          fi
          echo "=== 2. SAMOPROVERKA I RUFF ==="
          if [ -f samoproverka_ams.txt ]; then
            grep -E 'проверок .*ждали' samoproverka_ams.txt || tail -1 samoproverka_ams.txt
            grep -E '^SAMOPROVERKA=' samoproverka_ams.txt || true
          else
            echo "(shag ne shjol)"
          fi
          if [ -f ruff_ams.txt ]; then tail -2 ruff_ams.txt; fi
          echo "=== 2a. OTBOR SOSTAVA ==="
          if [ -f otbor_ams.txt ]; then
            grep -E '^(отбор за|выбрано рынков|суточный список|НЕ НАБРАЛОСЬ|VYBRANO_RYNKOV=|rynkov )' otbor_ams.txt || tail -3 otbor_ams.txt
          else
            echo "(otbor ne gonjali namerenno: OTBOR=${OTBOR:-yes})"
          fi
          if [ -f sostav_ams.txt ]; then grep -E '^SOSTAV ' sostav_ams.txt || true; fi
          echo "=== 3. TAJMERY I REZHIM ==="
          if [ -f tajmery_ams.txt ]; then
            grep -E 'enabled=' tajmery_ams.txt || true
            # РЕЖИМ -- В СВОД, А НЕ ТОЛЬКО В СЕРЕДИНУ ЖУРНАЛА: из контейнера
            # читается лишь хвост задания, а владельцу нужны ровно эти строки.
            grep -E '(OnCalendar=|--dnej|--spisok|sobytija tolko v 15min)' tajmery_ams.txt || true
            # РОТАЦИЯ В СВОД: её строки приходят из journalctl с префиксом, и
            # узор нарочно без привязки к началу строки. Слова русские -- так
            # их печатает скрипт Code-4.
            echo "--- rotacija ---"
            grep -E '(rotacija: kod=|порог |удал|ЖДУТ|ждут|сутки|снято|zhurnala rotacii net)' tajmery_ams.txt \
              | tail -14 || echo "(strok rotacii net)"
          else
            echo "(shag ne shjol)"
          fi
          echo "=== 4. PROBA ENDPOINTOV (vse spiski, s kodami) ==="
          # ЦЕЛИКОМ, А НЕ ХВОСТОМ: владелец просил "ошибки", а хвост из
          # четырёх строк их прячет. Списков всего девять -- печатаем все.
          # Прогон 38932243665 на этом и попался: итог "ответили 2 из 9" был
          # виден, а ПРИЧИНА каждого отказа -- нет.
          if [ -f probno_ams.txt ]; then
            grep -E '^[a-z_]+:' probno_ams.txt || cat probno_ams.txt
            grep -E 'итого' probno_ams.txt || true
          else
            echo "(shag ne shjol)"
          fi
          echo "=== 5. POCHEMU NET VYBORA RYNKOV ==="
          if [ -f prichina_ams.txt ]; then
            # УЗОР ЛОВИТ И СТРОКИ ПРО КНИГИ. Прогон 38942828252 напечатал их
            # в середине журнала, а в свод они не попали -- узор их не
            # покрывал, и главное число (сколько книг пришло и что в первой)
            # осталось нечитаемым: из контейнера доступен только хвост.
            grep -E '^(svezhij snimok|utc |  telo|clob_|data_|kod |zaprosheno|tip tela|pervaja kniga|razbor:)' \
              prichina_ams.txt | head -22
          else
            echo "(shag ne shjol)"
          fi
          echo "=== 6. PROBA POLJA SORTIROVKI /events ==="
          if [ -f order_ams.txt ]; then
            grep -E '^KANDIDAT' order_ams.txt || cat order_ams.txt
          else
            echo "(shag ne shjol)"
          fi
          echo "=== 7. SNIMKI I SVODKA ==="
          if [ -f svodka_ams.txt ]; then
            grep -E '^(rynkov:|fajlov:|vybor.json)' svodka_ams.txt || true
            sed -n '/--- svodka ---/,$p' svodka_ams.txt | tail -14
          else
            echo "(shag ne shjol)"
          fi
          # ИМЯ СЛУЖБЫ БЕГУНКА -- ПОСЛЕДНЕЙ СТРОКОЙ, И ЭТО НЕ ПОРЯДОК РАДИ
          # ПОРЯДКА. Архив журнала прогона из моего контейнера прокси не
          # отдаёт (Forbidden и на results-receiver, и на хранилище
          # артефактов), читается ТОЛЬКО ХВОСТ журнала задания -- и в
          # предыдущих трёх прогонах имя оставалось выше окна хвоста. Метка
          # нужна для runs-on последней мили, а угадывать её нельзя: прогон с
          # несуществующей меткой не краснеет, а молча висит в очереди.
          echo "=== 8. DVA MINUTNYH KRUGA I GLUBINA KNIG ==="
          if [ -f krugi_ams.txt ]; then
            grep -E '^(RYNKOV=|SUTKI |GLUBINA|  [a-z_]+ +[0-9])' krugi_ams.txt || tail -6 krugi_ams.txt
            # clob_books ОТДЕЛЬНОЙ СТРОКОЙ -- слово владельца: по нему видно,
            # наполнились ли книги, а в общем списке он теряется.
            echo "-- clob_books otdelno --"
            grep -E '^  clob_books ' krugi_ams.txt || echo "   (stroki clob_books net)"
          else
            echo "(shag ne shjol -- KRUGI=${KRUGI:-no})"
          fi
          echo "=== 8a. STOROZH DISKA lab-ams ==="
          if [ -f storozh_ams.txt ]; then
            # БЕЗ ПРИВЯЗКИ К НАЧАЛУ СТРОКИ: строки самого сторожа приходят из
            # journalctl с префиксом "Oct 16 22:37:00 nl-reserve
            # lab_storozh_diska.sh[123]:", поэтому узоры с ^ не совпадали бы
            # никогда -- ни порог, ни свободное место глазами сторожа, ни
            # список таймеров в свод не попадали.
            grep -E '(Environment=|^tajmer:|^invocation:|chto uvidel skript|storozh vidit|zhalob na Environment|SBOJ|storozh diska:|MALO MESTA|marker polozhen|markera net|^/dev/)' storozh_ams.txt || tail -5 storozh_ams.txt
          else
            echo "(shag ne shjol)"
          fi
          echo "=== 9. METKA BEGUNKA (poslednej strokoj) ==="
          if [ -f diagnoz_ams.txt ]; then
            grep -oE 'actions\.runner\.[A-Za-z0-9_.-]+' diagnoz_ams.txt \
              | sed 's/\.service$//' | awk -F. '{print "METKA_BEGUNKA=" $NF}' | head -1 \
              || echo "METKA_BEGUNKA=ne najdena"
          else
            echo "METKA_BEGUNKA=shag diagnoza ne shjol"
          fi
