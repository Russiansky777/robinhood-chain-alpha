name: P5 LIVE -- проверка схемы подписи Lighter (без ордеров)

on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/sc1-pons-v2-launcher-efdbyt
    paths:
      - "data/p3_guard_cache/P5_LIVE_LIGHTER_SIGNCHECK_REQUEST"

jobs:
  signcheck:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r analysis/requirements.txt
          pip install git+https://github.com/elliottech/lighter-python.git

      - name: Проверка схемы подписи (без ордеров)
        env:
          LIGHTER_API_KEY_PUBLIC: ${{ secrets.LIGHTER_API_KEY_PUBLIC }}
          LIGHTER_API_KEY_PRIVATE: ${{ secrets.LIGHTER_API_KEY_PRIVATE }}
        run: python -u analysis/p5_live_lighter_signcheck.py

      - name: Commit results
        if: always()
        run: |
          [ -e data/p3_guard_cache/p5_live_lighter_signcheck_result.json ] && git add data/p3_guard_cache/p5_live_lighter_signcheck_result.json
          git diff --cached --quiet && exit 0
          git commit -m "P5 LIVE: проверка схемы подписи Lighter (без ордеров) [automated]"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected, попытка $i/5 -- git pull --rebase и повтор"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep 3
          done
          echo "не удалось запушить после 5 попыток" >&2
          exit 1
