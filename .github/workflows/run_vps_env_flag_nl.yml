name: "Одна строка окружения службы: поставить по белому списку и перезапустить одну службу"

# ЗАЧЕМ (найдено 27.09 на пункте 2 владельца). Путь закрытия токен-счёта при
# продаже включён (BLOOM_CLOSE_ON_SELL=1), доходит до отправки и честно
# отказывается своим кодом: closing-модуль требует ВТОРОГО флага,
# CLOSE_ACCOUNTS_LIVE=1, которого в окружении службы нет. Чтобы поставить одну
# строку, не прогоняя весь деплой (он переписывает десяток значений из входов и
# перезапускает обе службы), нужен маленький точный инструмент. Это он.
#
# ЧТО МОЖНО. Только имена из белого списка ниже -- и ни одного ключа: имена с
# KEY, TOKEN, SECRET, AUTH, PASS отвергаются второй, независимой проверкой.
# Значение -- только безопасные знаки.
#
# ПЕРЕЗАПУСК. Окружение служба читает при старте, поэтому без перезапуска новая
# строка не действует. Перезапуск делается только при НУЛЕ открытых позиций --
# это проверяет тот же скрипт, что и остальные прогоны
# (deploy/checks/pered_perezapuskom_sluzhby.py), и он же требует, чтобы
# рубильник продаж не стоял.
on:
  workflow_dispatch:
    inputs:
      imya:
        description: "имя переменной из белого списка"
        required: true
        default: "CLOSE_ACCOUNTS_LIVE"
      znachenie:
        description: "значение"
        required: true
        default: "1"
      sluzhba:
        description: "какую службу перезапустить: bloom-seller, bloom-detector или none"
        required: false
        default: "none"

concurrency:
  group: env-flag
  cancel-in-progress: false

env:
  HOST: 45.59.170.76
  ENV_DIR: /etc/bloom-executor
  STATE_DIR: /home/bot/bloom_executor_live_data
  CODE_DIR: /home/bot/bloom_executor
  OUT: data/env_flag.txt

jobs:
  flag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/nifty-sagan-r0polg

      - name: "Белый список имён и проверка значения"
        env:
          IMYA: ${{ inputs.imya }}
          ZNACHENIE: ${{ inputs.znachenie }}
          SLUZHBA: ${{ inputs.sluzhba }}
        run: |
          set -e
          case "$IMYA" in
            CLOSE_ACCOUNTS_LIVE|BLOOM_CLOSE_ON_SELL|BLOOM_TG_FORMAT|BLOOM_REGION_SEND|BLOOM_LANE_MAX_POOL_FEE|BLOOM_COPIERS_FILE|LANE_BONDING_CURVE_GROUPS|BLOOM_DAILY_LOSS_SOL|BLOOM_MAX_OPEN|BLOOM_LANE_CONTROL|LANE_DAILY_LOSS_SOL|LANE_KILL_DROP_SOL|BLOOM_SHADOW_LEGS_OFF|BLOOM_SHADOW_LEGS|BLOOM_SHADOW_LEGS_CREDITS|LANE_SELL_TWO_STEP|BLOOM_STALE_SLOTS|BLOOM_SELLER_LOOP_S|BLOOM_LANE_CU_LIMIT) ;;
            *) echo "СБОЙ: имя $IMYA не из белого списка"; exit 1 ;;
          esac
          case "$IMYA" in
            *KEY*|*TOKEN*|*SECRET*|*AUTH*|*PASS*) echo "СБОЙ: имя похоже на ключ"; exit 1 ;;
          esac
          case "$ZNACHENIE" in
            "") echo "СБОЙ: пустое значение"; exit 1 ;;
            *[!A-Za-z0-9._/,-]*) echo "СБОЙ: в значении недопустимый знак"; exit 1 ;;
          esac
          case "$SLUZHBA" in
            bloom-seller|bloom-detector|none) ;;
            *) echo "СБОЙ: служба $SLUZHBA не из списка"; exit 1 ;;
          esac
          echo "имя и значение приняты: $IMYA"

      - name: "SSH key"
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -e
          [ -n "$VPS_SSH_KEY" ] || { echo "СБОЙ: VPS_SSH_KEY не задан"; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -T 10 "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          echo "SSH_OPTS=-i $HOME/.ssh/vps_key -o ConnectTimeout=20 -o BatchMode=yes -o StrictHostKeyChecking=accept-new" >> "$GITHUB_ENV"

      - name: "Строка в окружение, с копией и проверкой, что ключи не потерялись"
        env:
          IMYA: ${{ inputs.imya }}
          ZNACHENIE: ${{ inputs.znachenie }}
        run: |
          set -e
          set -o pipefail
          ssh -n $SSH_OPTS root@"$HOST" "grep -oE '^[A-Za-z_][A-Za-z0-9_]*=' $ENV_DIR/env | tr -d = | sort" > /tmp/do.txt
          echo "имён в окружении до правки: $(wc -l < /tmp/do.txt)"
          ssh -n $SSH_OPTS root@"$HOST" "
            set -e
            cp -a $ENV_DIR/env $ENV_DIR/env.bak.\$(date -u +%Y%m%dT%H%M%SZ)
            sed -i '/^$IMYA=/d' $ENV_DIR/env
            echo $IMYA=$ZNACHENIE >> $ENV_DIR/env
            chown root:root $ENV_DIR/env
            chmod 600 $ENV_DIR/env
            grep -c '^$IMYA=' $ENV_DIR/env" | tee "$OUT"
          ssh -n $SSH_OPTS root@"$HOST" "grep -oE '^[A-Za-z_][A-Za-z0-9_]*=' $ENV_DIR/env | tr -d = | sort" > /tmp/posle.txt
          echo "имён в окружении после правки: $(wc -l < /tmp/posle.txt)"
          POTERYANO=$(comm -23 /tmp/do.txt /tmp/posle.txt | tr "\n" " ")
          if [ -n "$(echo "$POTERYANO" | tr -d " ")" ]; then
            echo "СБОЙ: правка потеряла имена: $POTERYANO"
            ssh -n $SSH_OPTS root@"$HOST" "
              set -e
              newest=\$(ls -1t $ENV_DIR/env.bak.* | head -1)
              cp -a \"\$newest\" $ENV_DIR/env
              chown root:root $ENV_DIR/env
              chmod 600 $ENV_DIR/env
              echo vosstanovleno"
            exit 1
          fi
          echo "имена целы, строка на месте" | tee -a "$OUT"

      - name: "Перезапуск ОДНОЙ службы при нуле открытых позиций"
        if: ${{ inputs.sluzhba != 'none' }}
        env:
          SLUZHBA: ${{ inputs.sluzhba }}
        run: |
          set -e
          set -o pipefail
          ssh $SSH_OPTS root@"$HOST" "cat > /tmp/pered_perezapuskom_sluzhby.py" < deploy/checks/pered_perezapuskom_sluzhby.py
          ssh -n $SSH_OPTS root@"$HOST" "python3 /tmp/pered_perezapuskom_sluzhby.py" | tee -a "$OUT"
          ssh -n $SSH_OPTS root@"$HOST" "rm -f /tmp/pered_perezapuskom_sluzhby.py"
          TS=$(ssh -n $SSH_OPTS root@"$HOST" "date +%s")
          ssh -n $SSH_OPTS root@"$HOST" "systemctl restart $SLUZHBA"
          sleep 8
          ssh -n $SSH_OPTS root@"$HOST" "systemctl is-active $SLUZHBA" | tee -a "$OUT"
          echo "перезапуск в $TS" | tee -a "$OUT"

      - name: "Ключей в отчёте быть не должно"
        if: always()
        run: python3 deploy/checks/bez_klyuchey_v_otchete.py "$OUT" || true

      - name: "Коммит"
        if: always()
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -f "$OUT" ] && git add "$OUT"
          git diff --cached --quiet && { echo "нечего коммитить"; exit 0; }
          git commit -m "Okruzhenie: odna stroka po belomu spisku [automated]"
          for i in 1 2 3 4 5; do
            git push origin HEAD:claude/nifty-sagan-r0polg && exit 0
            git pull --rebase -X theirs origin claude/nifty-sagan-r0polg
            sleep 3
          done
          exit 1
