name: "Скринер пулов -- шаг 3: sigma (30д, GT hourly) и LVR/apyBase по резолвленным пулам"

on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/sc1-pons-v2-launcher-efdbyt
    paths:
      - "data/p3_guard_cache/POOL_SCREENER_SIGMA_LVR_REQUEST"

jobs:
  sigma_lvr:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r analysis/requirements.txt

      - name: sigma (30д, часовые свечи GT) + LVR_full_range + apyBase/LVR по резолвленным пулам
        run: python -u analysis/pool_screener_sigma_lvr.py

      - name: Commit results
        if: always()
        run: |
          [ -e data/p3_guard_cache/pool_screener_sigma_lvr_result.json ] && git add data/p3_guard_cache/pool_screener_sigma_lvr_result.json
          git diff --cached --quiet && exit 0
          git commit -m "Скринер пулов: sigma/LVR/apyBase по резолвленным пулам [automated]"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected, попытка $i/5 -- git pull --rebase и повтор"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep 3
          done
          echo "не удалось запушить после 5 попыток" >&2
          exit 1
