name: "Форензика fomo -- последний запрос, uniswap_v4_robinhood.swaps taker/maker (аккаунт Mozila, потолок 15)"

on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/sc1-pons-v2-launcher-efdbyt
    paths:
      - "data/p3_guard_cache/FOMO_FORENSICS_WALLETS_V4SWAPS_PROBE_REQUEST"

jobs:
  v4swaps_probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r analysis/requirements.txt
      - name: "uniswap_v4_robinhood.swaps: 1 день, потом 30 если в пределах потолка"
        env:
          DUNE_API_KEY: ${{ secrets.DUNE_API_KEY_MOZILA }}
        run: python -u analysis/fomo_forensics_wallets_v4swaps_probe.py
      - name: Commit results
        if: always()
        run: |
          git rm -f --ignore-unmatch data/p3_guard_cache/FOMO_FORENSICS_WALLETS_V4SWAPS_PROBE_REQUEST
          [ -e data/p3_guard_cache/fomo_forensics_wallets_v4swaps_probe_result.json ] && git add data/p3_guard_cache/fomo_forensics_wallets_v4swaps_probe_result.json
          [ -e data/credits_spent_mozila.json ] && git add data/credits_spent_mozila.json
          git diff --cached --quiet && exit 0
          git commit -m "Форензика fomo: uniswap_v4_robinhood.swaps taker/maker, результат [automated]"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected, попытка $i/5 -- git pull --rebase и повтор"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep 3
          done
          echo "не удалось запушить после 5 попыток" >&2
          exit 1
