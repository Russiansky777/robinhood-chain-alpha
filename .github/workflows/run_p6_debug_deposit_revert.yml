name: "P6 -- диагностика revert depositV3 (только чтение, реальный custom error 0x356680b7)"

on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/sc1-pons-v2-launcher-efdbyt
    paths:
      - "data/p3_guard_cache/P6_DEBUG_DEPOSIT_REVERT_REQUEST"

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r analysis/requirements.txt
      - name: Диагностика revert (4byte/openchain/blockscout/повторный eth_call)
        run: python -u analysis/p6_debug_deposit_revert.py
      - name: Commit results
        if: always()
        run: |
          [ -e data/p3_guard_cache/p6_debug_deposit_revert_result.json ] && git add data/p3_guard_cache/p6_debug_deposit_revert_result.json
          git diff --cached --quiet && exit 0
          git commit -m "P6: диагностика revert depositV3 [automated]"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected, попытка $i/5 -- git pull --rebase и повтор"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep 3
          done
          echo "не удалось запушить после 5 попыток" >&2
          exit 1
