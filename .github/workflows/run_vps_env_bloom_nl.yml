name: "Окружение служб: безопасные значения BLOOM_* (только чтение)"

# ЗАЧЕМ. Деплой детектора переписывает часть окружения ИЗ ВХОДОВ прогона, и
# вход, оставленный по умолчанию, молча меняет деньги: у прогона buy_sol по
# умолчанию 0.05, а на хосте живёт 0.2; own_send по умолчанию 0, а полоса
# работает. Значит перед любым перезапуском надо ЗНАТЬ, что стоит сейчас.
#
# ЧТО ПЕЧАТАЕТСЯ. Только имена из белого списка ниже -- настройки поведения, не
# ключи. Любая строка, чьё ИМЯ похоже на секрет (KEY, TOKEN, SECRET, AUTH,
# PASS, WALLET_KEY), отбрасывается второй, независимой проверкой -- даже если
# кто-то однажды впишет такое имя в белый список.
on:
  workflow_dispatch: {}

concurrency:
  group: env-bloom-read
  cancel-in-progress: false

env:
  HOST: 45.59.170.76
  ENV_DIR: /etc/bloom-executor
  OUT: data/env_bloom_safe.txt

jobs:
  chtenie:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/nifty-sagan-r0polg

      - name: "SSH key"
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -e
          [ -n "$VPS_SSH_KEY" ] || { echo "СБОЙ: VPS_SSH_KEY не задан"; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -T 10 "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          echo "SSH_OPTS=-i $HOME/.ssh/vps_key -o ConnectTimeout=20 -o BatchMode=yes -o StrictHostKeyChecking=accept-new" >> "$GITHUB_ENV"

      - name: "Безопасные значения окружения"
        run: |
          set -e
          set -o pipefail
          SAFE='^(BLOOM_MODE|BLOOM_TASKS|BLOOM_EXEC|BLOOM_LIVE_BUY|BLOOM_BUY_SOL|BLOOM_OWN_SEND|BLOOM_OWN_SEND_LIVE|BLOOM_OWN_SEND_SOL|BLOOM_SENDER_REGION|BLOOM_LANE_CONTROL|BLOOM_POOL_SEND|BLOOM_POOL_NONCE|BLOOM_POOL_NONCE_ACCOUNT|BLOOM_SHADOW_LEGS|BLOOM_SHADOW_LEGS_CREDITS|BLOOM_LIVE_TEST|BLOOM_TELEGRAM_LIVE_TEST|BLOOM_TELEGRAM_REAL|BLOOM_MIN_START_BALANCE|BLOOM_CLOSE_ON_SELL|BLOOM_TG_FORMAT|BLOOM_REGION_SEND|BLOOM_LANE_MAX_POOL_FEE|BLOOM_COPIERS_FILE|BLOOM_SOURCE_GROUPS|BLOOM_STATE_DIR|BLOOM_KILL_FILE|BLOOM_KILL_SELL_FILE|BLOOM_LIVE_SELL|BLOOM_SELL_AFTER_S|BLOOM_SELL_MAX_ATTEMPTS|BLOOM_SELL_SLIPPAGE_PCT|BLOOM_SELL_GRACE_S|BLOOM_SELL_RETRY_EVERY_S|BLOOM_SELL_GIVE_UP_AFTER_S|BLOOM_SELLER_LOOP_S|BLOOM_SELL_VIA_JUPITER|BLOOM_JUP_FLOOR_PCT|BLOOM_JUP_MIN_QUOTE_PCT|BLOOM_MAX_OPEN|BLOOM_DAILY_LOSS_SOL|BLOOM_PRIORITY_FEE|BLOOM_PROCESSOR_TIP|LANE_BONDING_CURVE|LANE_BONDING_CURVE_GROUPS|LANE_DAMM2|LANE_DAMM2_GROUPS|LANE_DBC|LANE_DBC_GROUPS|LANE_DLMM|LANE_DLMM_GROUPS|BLOOM_MIN_TARGET_SOL|LANE_DAILY_LOSS_SOL|LANE_KILL_DROP_SOL|LANE_GROUP_DAILY_STOP|LANE_STOP_CHAIN|LANE_CLMM|LANE_CLMM_GROUPS|LANE_LAUNCHLAB|LANE_LAUNCHLAB_GROUPS|LANE_WHIRLPOOL|LANE_WHIRLPOOL_GROUPS|LANE_TWO_STEP|LANE_TWO_STEP_GROUPS|LANE_AMM_V4|LANE_AMM_V4_GROUPS|LANE_PUMP_AMM|LANE_PUMP_AMM_GROUPS|LANE_CPMM|LANE_CPMM_GROUPS|BLOOM_USDC_NOGA|BLOOM_USDC_NOGA_GROUPS|BLOOM_USDC_NOGA_POTOLOK_SOL|BLOOM_USDC_NOGA_CU|BLOOM_LANE_DAY_LIMIT|BLOOM_LANE_ROUTE_OFF|BLOOM_LANE_TAX_FALLBACK_BPS|LANE_CHAIN_MAX_AGE_S|LANE_CHAIN_VS_LEDGER_SOL)='
          ssh -n $SSH_OPTS root@"$HOST" "grep -E '$SAFE' $ENV_DIR/env || true" \
            | grep -vEi '(KEY|TOKEN|SECRET|AUTH|PASS)=' \
            | sort | tee "$OUT"
          echo "--- имена всех ключей окружения (без значений) ---"
          ssh -n $SSH_OPTS root@"$HOST" "grep -oE '^[A-Za-z_][A-Za-z0-9_]*=' $ENV_DIR/env | tr -d = | sort" | tee -a "$OUT"

      - name: "Диагностика файла окружения: строки, копии, целостность (только чтение)"
        run: |
          set -e
          set -o pipefail
          # ЗАЧЕМ. 27.09 после деплоя число имён в окружении упало с 39 до 22.
          # Чтобы не гадать, здесь печатаются только счётные признаки: сколько
          # строк, сколько пар имя=значение, есть ли перевод строки в конце
          # файла (без него следующая дописанная строка склеится с последней),
          # и какие копии лежат рядом с их временем и размером. Значений нет.
          ssh -n $SSH_OPTS root@"$HOST" "
            echo strok: \$(wc -l < $ENV_DIR/env)
            echo par: \$(grep -cE '^[A-Za-z_][A-Za-z0-9_]*=' $ENV_DIR/env)
            echo bajt: \$(wc -c < $ENV_DIR/env)
            if [ -n \"\$(tail -c 1 $ENV_DIR/env)\" ]; then echo 'perevoda stroki v konce NET'; else echo 'perevod stroki v konce est'; fi
            echo '--- kopii ---'
            ls -1t --time-style=+%Y-%m-%dT%H:%M:%SZ $ENV_DIR/env.bak.* 2>/dev/null | head -8
            for b in \$(ls -1t $ENV_DIR/env.bak.* 2>/dev/null | head -8); do
              echo \"\$b par=\$(grep -cE '^[A-Za-z_][A-Za-z0-9_]*=' \$b) bajt=\$(wc -c < \$b)\"
            done
            # КОГДА ИМЯ ПРОПАЛО -- ПО КОПИЯМ, ТОЛЬКО ФАКТ ЕСТЬ/НЕТ.
            # Найдено 03.10 в 20:2xZ: детектор работал БЕЗ BLOOM_SOURCE_GROUPS,
            # то есть читал умолчание модуля (data/sources_live.json -- имя
            # копии в ветке, а не файла на хосте), не находил его и ставил
            # политику off ВСЕМ адресам. Покупки встали. Чтобы не гадать, какая
            # правка его унесла, здесь печатается ряд копий с ответом да/нет по
            # каждому следящему имени. Значения не печатаются никогда.
            echo '--- sledim za imenami po kopijam (est/net, bez znachenij) ---'
            for b in $ENV_DIR/env \$(ls -1t $ENV_DIR/env.bak.* 2>/dev/null | head -40); do
              stroka=\"\$b\"
              for n in BLOOM_SOURCE_GROUPS BLOOM_COPIERS_FILE CLOSE_ACCOUNTS_LIVE BLOOM_CLOSE_ON_SELL BLOOM_DLMM_ODNO_CHTENIE BLOOM_USDC_NOGA LANE_DAILY_LOSS_SOL; do
                if grep -q \"^\$n=\" \"\$b\" 2>/dev/null; then stroka=\"\$stroka \$n:est\"; else stroka=\"\$stroka \$n:NET\"; fi
              done
              echo \"\$stroka\"
            done
            # ОТКУДА СЛУЖБА БЕРЁТ ПЕРЕМЕННЫЕ, КРОМЕ ФАЙЛА ОКРУЖЕНИЯ. Найдено
            # 03.10: BLOOM_SOURCE_GROUPS нет ни в одной копии env назад до
            # 02.10, а политики у детектора весь день были -- значит путь
            # приходил не из этого файла. Юнит systemd может нести свои строки
            # Environment=, и тогда правка env их не видит вовсе. Печатаются
            # ТОЛЬКО имена и имена файлов окружения, без значений.
            echo '--- otkuda sluzhby berut peremennye (imena, bez znachenij) ---'
            for u in bloom-detector bloom-seller; do
              f=/etc/systemd/system/\$u.service
              [ -f \"\$f\" ] || { echo \"\$u: junita net po puti \$f\"; continue; }
              echo \"\$u EnvironmentFile: \$(grep -c '^EnvironmentFile=' \"\$f\")\"
              grep -o '^EnvironmentFile=.*' \"\$f\" || true
              echo \"\$u strok Environment=: \$(grep -c '^Environment=' \"\$f\")\"
              grep -oE '^Environment=\"?[A-Za-z_][A-Za-z0-9_]*' \"\$f\" | sed 's/^Environment=\"\?//' | sort || true
              echo \"\$u WorkingDirectory: \$(grep -o '^WorkingDirectory=.*' \"\$f\" || echo net)\"
            done
            echo '--- fajl grupp na hoste: chto lezhit rjadom ---'
            ls -la /home/bot/data/ 2>/dev/null | grep -iE 'sources|groups' || echo 'katalog /home/bot/data ne prochitan'
            ls -la /home/bot/bloom_executor/data/ 2>/dev/null | grep -iE 'sources|groups' || echo 'kataloga /home/bot/bloom_executor/data net'" | tee -a "$OUT"

      - name: "Ключей в отчёте быть не должно"
        if: always()
        run: python3 deploy/checks/bez_klyuchey_v_otchete.py "$OUT"

      - name: "Коммит"
        if: always()
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -f "$OUT" ] && git add "$OUT"
          git diff --cached --quiet && { echo "нечего коммитить"; exit 0; }
          git commit -m "Okruzhenie sluzhb: bezopasnye znacheniya BLOOM [automated]"
          for i in 1 2 3 4 5; do
            git push origin HEAD:claude/nifty-sagan-r0polg && exit 0
            git pull --rebase -X theirs origin claude/nifty-sagan-r0polg
            sleep 3
          done
          exit 1
