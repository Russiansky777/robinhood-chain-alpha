name: "Solana buyer_200 -- диагностика аномальных средних на длинных горизонтах"

on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/nifty-sagan-r0polg
    paths:
      - "data/p3_guard_cache/SOLANA_BUYER200_HORIZON_ANOMALY_DIAG_REQUEST"

jobs:
  horizon_anomaly_diag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests
      - name: "Диагностика аномалий длинных горизонтов"
        run: python -u analysis/solana_buyer200_horizon_anomaly_diag.py
      - name: Commit results
        if: always()
        run: |
          git rm -f --ignore-unmatch data/p3_guard_cache/SOLANA_BUYER200_HORIZON_ANOMALY_DIAG_REQUEST
          [ -e data/solana_buyer_200/horizon_anomaly_diag.json ] && git add data/solana_buyer_200/horizon_anomaly_diag.json
          git diff --cached --quiet && exit 0
          git commit -m "Solana buyer_200: диагностика аномалий длинных горизонтов [automated]"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected, попытка $i/5 -- git pull --rebase и повтор"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep 3
          done
          echo "не удалось запушить после 5 попыток" >&2
          exit 1
