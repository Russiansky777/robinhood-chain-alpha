name: "Логгер фандинга -- VPS Нидерланды: автономный часовой cron сборщика спреда (только приложение, SSH/ufw/firewall/ключи не трогает)"

# По образцу run_vps_setup_hourly_cron_nl.yml (P5). Собранный ряд живёт
# ВНЕ git-репозитория (/home/bot/funding_live_data/funding_spread.jsonl),
# чтобы будущий git reset --hard на хосте его не стёр. КРИТИЧНО: crontab
# bot уже содержит строку P5 (минута :06) -- этот workflow ЧИТАЕТ текущий
# crontab и ДОПИСЫВАЕТ вторую строку (минута :21), а не заменяет его
# целиком. Не трогает SSH-порт/sshd_config/ufw/ключи -- только
# приложение через уже существующий аудируемый канал (VPS_SSH_KEY).
on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/sc1-pons-v2-launcher-efdbyt
    paths:
      - "data/p3_guard_cache/VPS_SETUP_FUNDING_CRON_NL_REQUEST"

jobs:
  setup_cron:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: SSH key + known_hosts
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -e
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -T 10 45.59.170.76 >> ~/.ssh/known_hosts 2>/dev/null
          echo "SSH_OPTS=-i $HOME/.ssh/vps_key -o ConnectTimeout=15 -o BatchMode=yes -o StrictHostKeyChecking=accept-new" >> "$GITHUB_ENV"

      - name: "0. ПРОВЕРКА ПЕРЕД ИЗМЕНЕНИЕМ: текущий crontab bot -- убедиться, что строка P5 (:06) на месте"
        run: |
          ssh $SSH_OPTS root@45.59.170.76 '
            echo "=== текущий crontab bot ДО изменений ==="
            sudo -u bot crontab -l || echo "(crontab пуст или не существует)"
          '

      - name: "1. Обновить код репозитория у bot (reset --hard -- безопасно, накопленные ряды P5 и funding живут вне репо)"
        run: |
          ssh $SSH_OPTS root@45.59.170.76 '
            set -e
            sudo -u bot git -C /home/bot/robinhood-chain-alpha fetch origin claude/sc1-pons-v2-launcher-efdbyt
            sudo -u bot git -C /home/bot/robinhood-chain-alpha checkout claude/sc1-pons-v2-launcher-efdbyt
            sudo -u bot git -C /home/bot/robinhood-chain-alpha reset --hard origin/claude/sc1-pons-v2-launcher-efdbyt
            sudo -u bot /home/bot/robinhood-chain-alpha/venv/bin/pip install -q -r /home/bot/robinhood-chain-alpha/analysis/requirements.txt
            sudo -u bot git -C /home/bot/robinhood-chain-alpha log -1 --oneline
          '

      - name: "2. Засеять внешний живой файл (вне git) текущим содержимым git -- только если ещё не создан"
        run: |
          ssh $SSH_OPTS root@45.59.170.76 '
            set -e
            sudo -u bot mkdir -p /home/bot/funding_live_data
            if [ ! -s /home/bot/funding_live_data/funding_spread.jsonl ]; then
              sudo -u bot cp /home/bot/robinhood-chain-alpha/data/funding_spread.jsonl /home/bot/funding_live_data/funding_spread.jsonl
              echo "засеяно: $(wc -l < /home/bot/funding_live_data/funding_spread.jsonl) строк из git"
            else
              echo "внешний файл уже существует ($(wc -l < /home/bot/funding_live_data/funding_spread.jsonl) строк) -- не трогаю, cron продолжает его"
            fi
          '

      - name: "3. Обёрточный скрипт cron'а (идемпотентно перезаписывается)"
        run: |
          ssh $SSH_OPTS root@45.59.170.76 'mkdir -p /home/bot/bin && cat > /home/bot/bin/funding_hourly_snapshot.sh && chown bot:bot /home/bot/bin/funding_hourly_snapshot.sh && chmod +x /home/bot/bin/funding_hourly_snapshot.sh' <<'EOF'
          #!/bin/bash
          # Автономный часовой сбор спреда фандинга Lighter x Hyperliquid НА
          # САМОМ VPS -- только чтение внешних API, без git. Накопленный ряд --
          # ВНЕ git-репозитория (/home/bot/funding_live_data/funding_spread.jsonl),
          # чтобы будущий git reset репозитория его не стёр. Перед запуском
          # рабочая копия в репо восстанавливается из внешнего файла, после --
          # копируется обратно со свежими добавленными строками (13 пар/цикл).
          set -euo pipefail

          REPO=/home/bot/robinhood-chain-alpha
          LIVE_DIR=/home/bot/funding_live_data
          LIVE_SPREAD="$LIVE_DIR/funding_spread.jsonl"

          mkdir -p "$LIVE_DIR"
          touch "$LIVE_SPREAD"

          cd "$REPO"
          cp "$LIVE_SPREAD" data/funding_spread.jsonl

          set -a
          [ -f /etc/bot/env ] && source /etc/bot/env
          set +a

          echo "=== $(date -u +%FT%TZ) -- запуск funding_spread_hourly_snapshot.py ==="
          "$REPO/venv/bin/python" -u analysis/funding_spread_hourly_snapshot.py

          cp data/funding_spread.jsonl "$LIVE_SPREAD"
          echo "=== $(date -u +%FT%TZ) -- ОК, строк в живом ряду: $(wc -l < "$LIVE_SPREAD") ==="
          EOF

      - name: "4. Crontab bot -- ДОПИСАТЬ строку funding (:21) к существующей строке P5 (:06), не заменить (через файл, не stdin-pipe)"
        run: |
          ssh $SSH_OPTS root@45.59.170.76 '
            set -e
            sudo -u bot mkdir -p /home/bot/robinhood-chain-alpha/logs
            EXISTING=$(sudo -u bot crontab -l 2>/dev/null || true)
            echo "=== существующий crontab (до) ==="
            echo "$EXISTING"
            if ! echo "$EXISTING" | grep -q "p5_hourly_snapshot.sh"; then
              echo "СТОП: строка P5 (p5_hourly_snapshot.sh) НЕ найдена в текущем crontab -- не продолжаю, чтобы не работать вслепую поверх неожиданного состояния." >&2
              exit 1
            fi
            FILTERED=$(echo "$EXISTING" | grep -vF "funding_hourly_snapshot.sh" || true)
            {
              echo "$FILTERED"
              echo "21 * * * * /home/bot/bin/funding_hourly_snapshot.sh >> /home/bot/robinhood-chain-alpha/logs/funding_hourly_snapshot.log 2>&1"
            } > /tmp/bot_cron.txt
            chown bot:bot /tmp/bot_cron.txt
            sudo -u bot crontab /tmp/bot_cron.txt
            rm -f /tmp/bot_cron.txt
            echo "=== raw crontab файл (после) ==="; cat /var/spool/cron/crontabs/bot
            echo "=== crontab -l bot (после) ==="; sudo -u bot crontab -l
            echo "=== проверка: строка P5 (:06) на месте? ==="
            sudo -u bot crontab -l | grep -q "6 \* \* \* \* /home/bot/bin/p5_hourly_snapshot.sh" && echo "OK: P5-строка сохранена" || { echo "ОШИБКА: P5-строка пропала!" >&2; exit 1; }
          '

      - name: "5. Разовый тестовый прогон вручную (подтвердить механизм сразу, не ждать первого тика)"
        run: |
          ssh $SSH_OPTS root@45.59.170.76 '
            set -e
            sudo -u bot /home/bot/bin/funding_hourly_snapshot.sh
            echo "=== хвост внешнего живого файла ==="
            tail -3 /home/bot/funding_live_data/funding_spread.jsonl
            echo "=== число строк ==="
            wc -l /home/bot/funding_live_data/funding_spread.jsonl
          '

      - name: Итог
        run: |
          echo "cron логгера фандинга установлен (раз в час, минута :21), P5 (:06) не тронут, первый тестовый прогон прошёл."
          echo "Дальше растёт автономно; забор накопленного -- отдельным маркером (по аналогии с P5_LIVE_SNAPSHOT_REQUEST), TODO."
          echo "Git на VPS не используется нигде в этом механизме."
