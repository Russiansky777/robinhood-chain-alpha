name: "Забрать внешнюю страницу документации (только чтение)"

# Контейнер этой сессии ходит наружу через egress-прокси, и часть доменов
# он не пропускает. Читать документацию по памяти нельзя -- правило
# владельца: искать настоящие источники. Поэтому страница забирается с
# бегунка и кладётся в репозиторий как есть, вместе с кодом ответа.
#
# Ни секретов, ни VPS, ни ордеров. Только GET.
on:
  workflow_dispatch:
    inputs:
      url:
        description: "адрес страницы"
        required: true
      out:
        description: "куда положить (относительно репозитория)"
        required: false
        default: "data/docs/fetched.md"

concurrency:
  group: fetch-doc
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/nifty-sagan-r0polg

      - name: "Забрать страницу"
        run: |
          set -e
          OUT="${{ inputs.out }}"
          case "$OUT" in
            data/*) ;;
            *) echo "СБОЙ: класть можно только в data/"; exit 1;;
          esac
          mkdir -p "$(dirname "$OUT")"
          CODE=$(curl -sS -L --max-time 60 -w '%{http_code}' -o "$OUT.body" "${{ inputs.url }}" || echo 000)
          echo "код ответа: $CODE, байт: $(wc -c < "$OUT.body" 2>/dev/null || echo 0)"
          {
            printf '<!-- источник: %s -->\n' "${{ inputs.url }}"
            printf '<!-- забрано: %s, код ответа: %s -->\n\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$CODE"
            cat "$OUT.body"
          } > "$OUT"
          rm -f "$OUT.body"
          head -c 3000 "$OUT"
          [ "$CODE" = "200" ] || { echo "СБОЙ: код ответа $CODE"; exit 1; }

      - name: "Коммит страницы"
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -f "${{ inputs.out }}" ] && git add "${{ inputs.out }}"
          git diff --cached --quiet && { echo "нечего коммитить"; exit 0; }
          git commit -m "Документация забрана с внешнего источника [automated]"
          for i in 1 2 3 4 5; do
            git push origin HEAD:claude/nifty-sagan-r0polg && exit 0
            git pull --rebase -X theirs origin claude/nifty-sagan-r0polg
            sleep 3
          done
          exit 1
