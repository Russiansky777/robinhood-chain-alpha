name: "Bloom: деплой детектора v2 на NL-хост (только журнал, покупок нет)"

# Детектор слушает источники, разбирает сделки, пишет решения в журнал и
# вызывает ИСПОЛНИТЕЛЯ в том же процессе. Исполнитель работает в dry-run:
# BLOOM_LIVE_BUY в env НЕ задан и явно вычищается этим деплоем, поэтому ни
# один POST в Bloom не уходит -- пишутся только намерения и позиции.
# Живые покупки включаются ОТДЕЛЬНЫМ решением владельца, не этим файлом.
#
# Своё имя юнита (bloom-detector), свой каталог состояния делится со
# сторожем (журнал решений и позиции -- общие, это одно хозяйство), свой
# env-файл общий с исполнителем (/etc/bloom-executor/env).
#
# Уроки предыдущих деплоев, учтённые здесь:
#   * тело systemd-юнита пишется блоком echo, а не heredoc: терминатор
#     heredoc обязан стоять в нулевой колонке и ломает YAML;
#   * у ssh, которому нужен stdin, НЕ ставится -n: он подменяет stdin на
#     /dev/null, и на хост уезжает пустой файл;
#   * сверка sha256 с отдельной проверкой на сумму пустого файла.
on:
  workflow_dispatch:
    inputs:
      runner:
        description: "'nl' -- свой раннер на хосте (по умолчанию), 'cloud' -- запасной облачный путь"
        required: false
        default: "nl"
      enable_service:
        description: "'yes' -- включить и перезапустить службу"
        required: false
        default: "no"
      tasks:
        description: "какие задачи DBot слушать"
        required: false
        default: "BATCH-5,BATCH-3"
      live_test:
        description: "'yes' -- режим стенда: покупки ТОЛЬКО по тестовому источнику"
        required: false
        default: "no"
      rotate_journals:
        description: "'yes' -- отложить журналы прежнего формата (ключи сменились)"
        required: false
        default: "no"
      mark_stand_start:
        description: "'yes' -- поставить метку начала стенда (ТОЛЬКО по слову владельца)"
        required: false
        default: "no"
      allow_open_live_test:
        description: "'yes' -- сверка не блокирует старт открытыми позициями стенда (боевые не покрывает)"
        required: false
        default: "no"
      telegram_live_test:
        description: "'1' -- строки о событиях стенда в Telegram (по умолчанию 1)"
        required: false
        default: "1"
      live_buy:
        description: "'1' -- ЖИВЫЕ покупки по РЕАЛЬНЫМ источникам (только по слову владельца)"
        required: false
        default: "0"
      min_start_balance:
        description: "порог баланса для старта, SOL (пусто -- 0.3; менять только по слову владельца)"
        required: false
        default: ""
      buy_sol:
        description: "размер боевой покупки в SOL"
        required: false
        default: "0.05"
      shadow_legs:
        description: "'1' -- подписка на 4 хранилища котировок для двухшаговой тени (замер, не торговля)"
        required: false
        default: "1"
      shadow_legs_credits:
        description: "бюджет замера двухшаговой тени, кредитов Helius (замер ~10 000 в час)"
        required: false
        default: "30000"
      own_send:
        description: "'1' -- полоса СВОЕЙ отправки: собирать и подписывать покупку самим (сборка и симуляция; без own_send_live не отправляет)"
        required: false
        default: "0"
      own_send_live:
        description: "'1' -- полоса ОТПРАВЛЯЕТ свои покупки в сеть (настоящие деньги, 0.01 SOL; только по слову владельца)"
        required: false
        default: "0"
      own_send_sol:
        description: "размер сделки полосы в SOL (предел в коде 0.05)"
        required: false
        default: "0.01"
      sender_region:
        description: "регион Helius Sender для полосы: ams, fra, lon, ewr, slc, sg, tyo"
        required: false
        default: "ams"
      lane_control:
        description: "'1' -- КОНТРОЛЬ ДОСТАВКИ (З2): с каждой покупкой полосы уходит пустая транзакция через КАЖДЫЙ подключённый сервис (~0.0031 SOL за сигнал на пятерых, пределы 20 сигналов и 0.1 SOL в сутки)"
        required: false
        default: "0"
      pool_nonce:
        description: "'1' -- вариант пула на долговечном nonce: по транзакции на сервис, только его чаевые (нужен созданный аккаунт nonce)"
        required: false
        default: "0"
      keep_env:
        description: "env на хосте НЕ трогать: ТОЛЬКО 'yes'. Иное значение требует perepisat_env"
        required: false
        default: "yes"
      perepisat_env:
        description: "ПЕРЕПИСАТЬ env целиком -- ровно слово PEREPISAT, иначе деплой откажется"
        required: false
        default: ""
      pool_send:
        description: "'1' -- БОЕВОЙ ПУЛ шаг 1: одна подписанная покупка уходит ВСЕМИ подключёнными сервисами, чаевые всем <= 0.005 SOL на сделку (включено по решению владельца 25.09)"
        required: false
        default: "1"
      nochnye:
        description: "пары ключ=значение через запятую: close_on_sell, tg_format, region_send, lane_max_pool_fee, copiers_file (у workflow_dispatch предел 25 входов, поэтому одной строкой)"
        required: false
        default: "close_on_sell=0,tg_format=,region_send=0,lane_max_pool_fee=0.05,copiers_file=/home/bot/bloom_executor_live_data/kopirovshchiki.json"

concurrency:
  group: bloom-detector-deploy
  cancel-in-progress: false

env:
  HOST: 45.59.170.76
  SVC: bloom-detector
  CODE_DIR: /home/bot/bloom_executor
  STATE_DIR: /home/bot/bloom_executor_live_data
  ENV_DIR: /etc/bloom-executor

jobs:
  deploy:
    # Свой раннер стоит НА хосте: файлы не едут через океан, круг
    # деплоя падает с ~95 до ~50 секунд (замерено 24.09 на зонде).
    # Облачный путь остаётся запасным входом runner=cloud.
    runs-on: ${{ inputs.runner == 'cloud' && 'ubuntu-latest' || fromJSON('["self-hosted","nl-host"]') }}
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/nifty-sagan-r0polg

      - name: "ГЕЙТ: переписывать env можно только по явному слову"
        # ЗАЧЕМ (слово владельца 28.09 ночью, п.3): "keep_env=yes сделать
        # умолчанием деплоя; вход без него невозможен. Два раза за два дня гейт
        # спасал ключи -- третьего не должно быть". Деплой с пустыми входами
        # 23:15:31Z начал переписывать env и потерял бы 34 строки, включая
        # ключи кошельков: спас только гейт сверки ключей. Теперь умолчание --
        # НЕ ТРОГАТЬ env, а перезапись требует отдельного слова.
        run: |
          set -e
          KEEP="${{ inputs.keep_env }}"
          SLOVO="${{ inputs.perepisat_env }}"
          if [ "$KEEP" = "yes" ]; then
            echo "env ne trogaem -- eto umolchanie"
            exit 0
          fi
          if [ "$SLOVO" = "PEREPISAT" ]; then
            echo "VNIMANIE: env budet perepisan celikom po yavnomu slovu vladelca"
            exit 0
          fi
          echo "DEPLOJ OTMENJON: keep_env='$KEEP' bez slova PEREPISAT v perepisat_env."
          echo "Perezapis env teryaet stroki, kotoryh net vo vhodah: 28.09 tak"
          echo "poteryalis by 34 klyucha, sredi nih klyuchi koshelkov."
          exit 1


      - name: "Адрес хоста и питон"
        run: |
          set -e
          # На своём раннере ssh идёт по петле: файлы не едут через океан.
          # На облачном -- по внешнему адресу, как раньше.
          if [ "${{ inputs.runner }}" = "cloud" ]; then
            echo "TARGET_HOST=$HOST" >> "$GITHUB_ENV"
            echo "где выполняюсь: облачный бегунок"
          else
            echo "TARGET_HOST=127.0.0.1" >> "$GITHUB_ENV"
            echo "где выполняюсь: свой раннер на NL-хосте"
          fi
          # Системный python3 на хосте может быть без requests и без solders:
          # ставим не в систему, а во временное окружение прогона. solders
          # нужен модулям тени -- без него самопроверка тени идёт мимо
          # настоящего модуля и проверяет только заглушки.
          if python3 -c "import requests, solders" 2>/dev/null; then
            echo "PY=python3" >> "$GITHUB_ENV"
          else
            python3 -m venv "$RUNNER_TEMP/selftest_venv"
            "$RUNNER_TEMP/selftest_venv/bin/pip" install -q requests
            # solders -- не обязателен: без него тень просто выключена, и
            # деплой торговли из-за замера падать не должен.
            "$RUNNER_TEMP/selftest_venv/bin/pip" install -q solders \
              || echo "ВНИМАНИЕ: solders не встал -- самопроверка тени пойдёт без модуля"
            echo "PY=$RUNNER_TEMP/selftest_venv/bin/python" >> "$GITHUB_ENV"
          fi

      - name: "Самопроверки ДО доставки (без сети)"
        run: |
          set -e
          cd analysis
          "$PY" bloom_exec_state.py --self-test
          "$PY" bloom_api.py --self-test
          "$PY" bloom_seller.py --self-test
          "$PY" bloom_detector.py --self-test
          "$PY" bloom_executor.py --self-test
          "$PY" bloom_reconcile.py --self-test
          # Имена переменных оболочки -- только ASCII. Кириллическое имя Bash
          # не принимает, и деплой падает посреди дела (проверено 11:24Z).
          "$PY" check_shell_ascii.py --self-test
          python3 check_shell_ascii.py ../.github/workflows
          # КАВЫЧКИ В УДАЛЁННЫХ КОМАНДАХ. 25.09 деплой упал ТРИЖДЫ из-за кавычек
          # в комментарии внутри ssh: они закрывали аргумент, и остаток скрипта
          # выполнялся ЛОКАЛЬНО под ghrunner, которому env читать нельзя.
          "$PY" check_workflow_quotes.py --self-test
          python3 check_workflow_quotes.py ../.github/workflows
          # А ЭТО ПРОВЕРКА СИЛЬНЕЕ И ТУПЕЕ: тело каждого шага run отдаётся самому
          # bash с ключом -n. Что bash не разберёт, то и не заработает. Прогон 63
          # она видит сразу и до траты денег.
          "$PY" check_workflow_bash.py --self-test
          python3 check_workflow_bash.py ../.github/workflows

      - name: "Секреты не пусты (значения не печатаются)"
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API }}
          DBOT_API_KEY: ${{ secrets.DBOT_API_KEY }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -e
          fail=0
          for NAME in HELIUS_API_KEY DBOT_API_KEY VPS_SSH_KEY; do
            V="${!NAME}"
            if [ -z "$V" ]; then echo "$NAME: НЕ ЗАДАН"; fail=1
            else echo "$NAME: задан, длина ${#V}"; fi
          done
          [ "$fail" = "0" ] || { echo "деплой остановлен: нет обязательных секретов"; exit 1; }

      - name: "SSH key"
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -e
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          echo "SSH_OPTS=-i $HOME/.ssh/vps_key -o ConnectTimeout=15 -o BatchMode=yes -o StrictHostKeyChecking=accept-new" >> $GITHUB_ENV

      - name: "Каталоги на месте (сторож их уже создал -- проверяем, не ломаем)"
        run: |
          set -e
          ssh -n $SSH_OPTS root@$TARGET_HOST "
            set -e
            install -d -o bot -g bot -m 755 $CODE_DIR
            install -d -o bot -g bot -m 750 $STATE_DIR
            install -d -o root -g root -m 711 $ENV_DIR   # bot должен читать рубильник
            test -s $ENV_DIR/env || { echo 'СБОЙ: нет $ENV_DIR/env -- сначала деплой сторожа'; exit 1; }
            ls -ld $CODE_DIR $STATE_DIR $ENV_DIR
          "

      - name: "Все нужные модули есть в списке доставки"
        # ЗАЧЕМ. 27.09 первый настоящий двухшаговый сигнал пропал на
        # ModuleNotFoundError: bloom_lane_two_step.py не было в списке ниже.
        # Проверка ловит весь этот класс: по объединению списков обоих
        # прогонов транзитивно ищутся импорты наших модулей.
        run: python3 analysis/check_deploy_modules.py

      - name: "Доставка кода + СВЕРКА sha256 (расхождение = падение)"
        run: |
          set -e
          EMPTY_SHA=e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
          # solana_rpc_client -- ради УЖЕ согласованной модели кредитов Helius.
          # Без него службы работают, но расход не попадает в учёт, и
          # почасовая проверка кредитов смотрит на четверть картины.
          # Модули тени (c2_*) -- замер, не торговля: отправлять транзакции
          # они не умеют. Без них на хосте тень молча выключена, и раздел
          # shadow в признаке жизни всегда пуст.
          # bloom_own_send -- полоса своей отправки; ей нужны разбор ключа
          # (dbot_rescue) и сверка кошелька с ключом (bloom_jupiter_sell).
          # Без них полоса не подписывает, а без самого модуля детектор
          # честно пишет ModuleNotFoundError в признак жизни -- ровно это и
          # случилось в прогоне 36080386872.
          for f in bloom_notify.py bloom_exec_state.py bloom_api.py bloom_seller.py bloom_detector.py bloom_telegram_cmd.py bloom_executor.py bloom_reconcile.py solana_rpc_client.py c2_common.py c2_pool_programs.py c2_swap_build.py c2_shadow_build.py bloom_own_send.py bloom_jupiter_sell.py dbot_rescue.py bloom_route_tax.py bloom_price_curve.py bloom_block_position.py bloom_senders.py bloom_source_groups.py bloom_close_on_sell.py bloom_region_send.py bloom_token_name.py bloom_slot_peers.py bloom_copiers.py c2_cl_quote.py bloom_tg_format.py bloom_tg_format3.py bloom_doklad.py bloom_entry_premium.py bloom_lane_jupiter.py bloom_lane_two_step.py bloom_queue_price.py bloom_nogi_shablony.py close_empty_token_accounts.py c2_followers_growth.py c2_dlmm_tochnaya_kotirovka.py podbivka_dlmm_quote.py c2_clmm_stroitel.py c2_whirlpool_stroitel.py c2_dbc_stroitel.py podbivka_clmm_quote.py podbivka_whirlpool_quote.py c2_dlmm_odno_chtenie.py c2_ammv4_stroitel.py c2_nalog_2022.py; do
            [ -s "analysis/$f" ] || { echo "СБОЙ: локальный analysis/$f пуст"; exit 1; }
            local_sum=$(sha256sum "analysis/$f" | cut -d' ' -f1)
            # СОВПАЛО -- НЕ ПЕРЕПИСЫВАЕМ. Переписать файл тем же содержимым
            # значит сдвинуть его mtime, а по mtime проверяется, не работает ли
            # служба со старым кодом: два деплоя подряд делали ложную тревогу,
            # потому что второй трогал файлы, которых не менял.
            was_sum=$(ssh -n $SSH_OPTS root@$TARGET_HOST "sha256sum $CODE_DIR/$f 2>/dev/null | cut -d' ' -f1")
            if [ "$was_sum" = "$local_sum" ]; then
              echo "$f: уже такой ($local_sum) -- не переписан, mtime не тронут"
              continue
            fi
            ssh $SSH_OPTS root@$TARGET_HOST "cat > $CODE_DIR/$f && chown bot:bot $CODE_DIR/$f && chmod 644 $CODE_DIR/$f" < "analysis/$f"
            remote_sum=$(ssh -n $SSH_OPTS root@$TARGET_HOST "sha256sum $CODE_DIR/$f | cut -d' ' -f1")
            echo "$f: локально $local_sum, на хосте $remote_sum"
            [ "$remote_sum" != "$EMPTY_SHA" ] || { echo "СБОЙ: на хост уехал ПУСТОЙ $f"; exit 1; }
            [ "$local_sum" = "$remote_sum" ] || { echo "СБОЙ: суммы не совпали для $f"; exit 1; }
          done

      - name: "Данные для тени: метки пулов, котировочные пулы, образцы таблиц"
        run: |
          set -e
          # Модули тени ищут данные по своему месту: REPO_ROOT это родитель
          # каталога кода, то есть на хосте /home/bot, а данные -- в
          # /home/bot/data. Без них тень собирается, но падает на метках
          # пулов на КАЖДОМ сигнале, и это выглядит как "тень не работает".
          # data/senders.json -- реестр отправителей пула (адреса чаевых и
          # минимумы ИЗ ИХ ДОКУМЕНТАЦИИ). Модуль ищет его как
          # <родитель каталога кода>/data/senders.json, то есть на хосте
          # /home/bot/data/senders.json. Без файла подключённых отправителей
          # нет вовсе, и веер контролей пуст.
          # ФАЙЛ ГРУПП ИСТОЧНИКОВ ЗДЕСЬ НЕ ЕДЕТ. 27.09 деплой перезаписал живой
          # /home/bot/data/sources_2026-09-25.json копией из репозитория, и это
          # молча вернуло деньги к исходной настройке: Bloom включился на всех
          # группах (9 живых покупок, -0.080487 SOL у исполнителя), а размер
          # полосы вырос с 0.01 до 0.05. Живой файл групп правится отдельным
          # прогоном (run_vps_pravka_grupp_nl.yml) и перечитывается службой на
          # ходу -- деплою его касаться нельзя вовсе.
          # ФАЙЛЫ ПУЛОВ НОГИ -- ВСЕ ПО МАСКЕ. Модуль тени берёт САМЫЙ СВЕЖИЙ
          # (sorted(glob)[-1]), поэтому имя с датой в списке зашивать нельзя:
          # 28.09 появился файл на 109 котировок, и с зашитым именем от 24.09
          # он на хост не попал бы вовсе.
          DATA_FILES="data/solana_buyer_200/prior/current/buyer_100/dex_labels.json $(ls -1 data/c2_leg_pools_2*.json | tr '\n' ' ') data/c2_pool_samples data/senders.json"
          [ -f data/nogi_shablony.json ] && DATA_FILES="$DATA_FILES data/nogi_shablony.json"
          # СТАВКИ КОМИССИИ ПУЛОВ CLMM. Файл -- ЗАСЕВ кэша: без него служба
          # после перезапуска отказывает на первом же сигнале CLMM, пока
          # фоновое чтение не доберёт конфиг с цепи. Деплой 28.09 в 10:07Z это
          # и показал: clmm_fee_rates в признаке жизни вышел пустым.
          [ -f data/clmm_konfigi.json ] && DATA_FILES="$DATA_FILES data/clmm_konfigi.json"
          # ШАГИ КОРЗИН ПУЛОВ DLMM -- такой же ЗАСЕВ кэша, и по той же причине:
          # без файла первый сигнал DLMM после перезапуска отказывает, пока
          # фоновое чтение не доберёт счёт пула с цепи.
          [ -f data/dlmm_shag_korziny.json ] && DATA_FILES="$DATA_FILES data/dlmm_shag_korziny.json"
          # РЕГИОНАЛЬНАЯ ОТПРАВКА: ДВА ЕЁ ФАЙЛА. Найдено 29.09 ночью, до
          # включения флага: на хосте не было НИ ОДНОГО из них, и проверка
          # живости точек честно ответила "адрес есть у 0 из 24 пар", а проверка
          # карты -- "неизвестных лидеров 664 из 664, слотов у них 432 000 из
          # 432 000". То есть с BLOOM_REGION_SEND=1 регион был бы "неизвестно"
          # у ВСЕХ слотов и ни один адрес не сменился бы: флаг не изменил бы
          # ничего, кроме лишнего getLeaderSchedule. Модуль ищет их как
          # <родитель каталога кода>/data/, то есть /home/bot/data.
          [ -f data/sender_regions.json ] && DATA_FILES="$DATA_FILES data/sender_regions.json"
          [ -f data/leader_regions.json ] && DATA_FILES="$DATA_FILES data/leader_regions.json"
          for f in $DATA_FILES; do
            [ -e "$f" ] || { echo "СБОЙ: нет локального $f"; exit 1; }
          done
          # Архив идёт трубой, без временного файла ни с одной стороны.
          # Через /tmp на хосте запись отказала ("Permission denied",
          # прогон 36040165510) -- разбираться, чей это /tmp, незачем, если
          # временный файл вообще не нужен. pipefail обязателен: без него
          # падение tar спряталось бы за успехом ssh.
          set -o pipefail
          tar -czf - $DATA_FILES | ssh $SSH_OPTS root@$TARGET_HOST "
            set -e
            install -d -o bot -g bot -m 755 /home/bot/data
            tar -xzf - -C /home/bot
            chown -R bot:bot /home/bot/data
          "
          ssh -n $SSH_OPTS root@$TARGET_HOST "
            ls -l /home/bot/data/c2_leg_pools_2*.json
            ls /home/bot/data/c2_pool_samples | wc -l
            ls -l /home/bot/data/solana_buyer_200/prior/current/buyer_100/dex_labels.json
            ls -l /home/bot/data/senders.json
            ls -l /home/bot/data/clmm_konfigi.json 2>/dev/null || echo 'clmm_konfigi.json ne dostavlen'
            ls -l /home/bot/data/dlmm_shag_korziny.json 2>/dev/null || echo 'dlmm_shag_korziny.json ne dostavlen' 
            echo 'fayl grupp deploy ne trogal, pokazyvaem ego vremya kak est:'
            ls -l /home/bot/data/sources_2026-09-25.json
          "

      - name: "Снимок задач как откат, если DBot недоступен"
        run: |
          set -e
          SNAP=data/final/20260923T145755Z/konfig.json
          [ -s "$SNAP" ] || { echo "СБОЙ: нет снимка $SNAP"; exit 1; }
          ssh $SSH_OPTS root@$TARGET_HOST "cat > $CODE_DIR/konfig_snapshot.json && chown bot:bot $CODE_DIR/konfig_snapshot.json && chmod 644 $CODE_DIR/konfig_snapshot.json" < "$SNAP"
          ssh -n $SSH_OPTS root@$TARGET_HOST "wc -c < $CODE_DIR/konfig_snapshot.json"

      - name: "ДИАГНОСТИКА env: кто мы на хосте и что с файлом (только чтение)"
        run: |
          set -e
          # 25.09 деплой упал на "sed: can't read /etc/bloom-executor/env:
          # Permission denied" -- при том что ПРЕДЫДУЩИЙ шаг тот же файл правил
          # успешно. Догадки тут бесполезны: печатаем факты -- под кем мы на
          # хосте, права каталога и файла, расширенные атрибуты и состояние
          # файловой системы. Только чтение, ни одной правки.
          ssh -n $SSH_OPTS root@$TARGET_HOST "
            echo \"кто я: \$(id -un) (uid \$(id -u))\"
            ls -ldn $ENV_DIR || true
            ls -ln $ENV_DIR/ || true
            lsattr -d $ENV_DIR 2>&1 | head -2 || true
            lsattr $ENV_DIR/env 2>&1 | head -2 || true
            findmnt -no TARGET,FSTYPE,OPTIONS --target $ENV_DIR || true
            df -h $ENV_DIR | tail -1 || true
            echo 'проба чтения:'; head -c 1 $ENV_DIR/env >/dev/null && echo 'читается' || echo 'НЕ читается'
            echo 'проба записи во временный файл того же каталога:'
            (touch $ENV_DIR/.proba_zapisi && echo 'каталог пишется' && rm -f $ENV_DIR/.proba_zapisi) || echo 'каталог НЕ пишется'
          "

      - name: "Ночные флаги: разобрать одну строку входа в пять значений"
        env:
          NOCHNYE: ${{ inputs.nochnye }}
        run: |
          set -e
          # У workflow_dispatch предел 25 входов, а нужных настроек больше,
          # поэтому пять ночных приходят одной строкой пар ключ=значение.
          # Разбор строгий: имя только из белого списка, значение только из
          # безопасных знаков. Это не косметика -- значение уезжает в env
          # службы, и пробел или кавычка в нём сломали бы строку окружения.
          CLOSE_ON_SELL=0
          TG_FORMAT=
          REGION_SEND=0
          LANE_MAX_POOL_FEE=0.05
          COPIERS_FILE=/home/bot/bloom_executor_live_data/kopirovshchiki.json
          IFS=,
          for para in $NOCHNYE; do
            imya=${para%%=*}
            znach=${para#*=}
            case "$znach" in
              *[!A-Za-z0-9._/-]*) echo "СБОЙ: в значении $imya недопустимый знак"; exit 1 ;;
            esac
            case "$imya" in
              close_on_sell)     CLOSE_ON_SELL=$znach ;;
              tg_format)         TG_FORMAT=$znach ;;
              region_send)       REGION_SEND=$znach ;;
              lane_max_pool_fee) LANE_MAX_POOL_FEE=$znach ;;
              copiers_file)      COPIERS_FILE=$znach ;;
              *) echo "СБОЙ: имя $imya не из белого списка"; exit 1 ;;
            esac
          done
          unset IFS
          for pair in CLOSE_ON_SELL=$CLOSE_ON_SELL TG_FORMAT=$TG_FORMAT REGION_SEND=$REGION_SEND LANE_MAX_POOL_FEE=$LANE_MAX_POOL_FEE COPIERS_FILE=$COPIERS_FILE; do
            echo "$pair" >> "$GITHUB_ENV"
            echo "ночной флаг: $pair"
          done

      - name: "env: ключи отправителей пула (значения только через stdin)"
        if: ${{ inputs.keep_env != 'yes' && inputs.perepisat_env == 'PEREPISAT' }}
        env:
          BLOCKRAZOR_AUTH_TOKEN: ${{ secrets.BLOCKRAZOR_AUTH_TOKEN }}
          ASTRALANE_API_KEY: ${{ secrets.ASTRALANE_API_KEY }}
          ZEROX_API: ${{ secrets.ZEROX_API }}
          NOZOMI_API_KEY: ${{ secrets.NOZOMI_API_KEY }}
        run: |
          set -e
          # ПУЛ ОТПРАВИТЕЛЕЙ (владелец 25.09). Имена секретов ровно те, что он
          # завёл: BLOCKRAZOR_AUTH_TOKEN, ASTRALANE_API_KEY, NOZOMI_API_KEY и
          # ZEROX_API (0slot, имя дал владелец 25.09). Ключ, которого нет, в env не
          # пишется вовсе: без ключа отправитель считается неподключённым и в
          # пул не идёт -- это честнее, чем пустая переменная.
          #
          # Значение уезжает ТОЛЬКО через stdin: аргументы команды видны в ps,
          # а имя переменной в журнале прогона -- нет вреда.
          for secret_name in BLOCKRAZOR_AUTH_TOKEN ASTRALANE_API_KEY ZEROX_API NOZOMI_API_KEY; do
            secret_value="${!secret_name}"
            if [ -z "$secret_value" ]; then
              echo "$secret_name: не задан -- отправитель останется неподключённым"
              ssh -n $SSH_OPTS root@$TARGET_HOST "sed -i '/^$secret_name=/d' $ENV_DIR/env"
              continue
            fi
            printf '%s=%s\n' "$secret_name" "$secret_value" | ssh $SSH_OPTS root@$TARGET_HOST "
              cat > /tmp/sender_line
              sed -i '/^$secret_name=/d' $ENV_DIR/env
              cat /tmp/sender_line >> $ENV_DIR/env
              shred -u /tmp/sender_line
              chmod 600 $ENV_DIR/env"
            echo "$secret_name: записан в окружение службы"
          done
          # Кто в итоге подключён -- по именам, без значений.
          ssh -n $SSH_OPTS root@$TARGET_HOST "
            set -a; . $ENV_DIR/env; set +a
            cd $CODE_DIR
            /home/bot/robinhood-chain-alpha/venv/bin/python -c 'import json, bloom_senders as S; print(json.dumps(S.состояние_пула(), ensure_ascii=False)[:600])'" || \
            echo "состояние пула не прочитано (модуль ещё не доставлен) -- не страшно"

      - name: "env: дописать ключ DBot, если его там нет (бэкап перед правкой)"
        if: ${{ inputs.keep_env != 'yes' && inputs.perepisat_env == 'PEREPISAT' }}
        env:
          DBOT_API_KEY: ${{ secrets.DBOT_API_KEY }}
        run: |
          set -e
          ssh -n $SSH_OPTS root@$TARGET_HOST "cp -a $ENV_DIR/env $ENV_DIR/env.bak.\$(date -u +%Y%m%dT%H%M%SZ)"
          # Ключ передаётся через stdin, а не аргументом: аргументы видны в ps.
          printf 'DBOT_API_KEY=%s\n' "$DBOT_API_KEY" | ssh $SSH_OPTS root@$TARGET_HOST "
            cat > /tmp/dbot_line
            grep -q '^DBOT_API_KEY=' $ENV_DIR/env && sed -i '/^DBOT_API_KEY=/d' $ENV_DIR/env
            cat /tmp/dbot_line >> $ENV_DIR/env
            shred -u /tmp/dbot_line
            grep -q '^BLOOM_MODE=' $ENV_DIR/env || echo 'BLOOM_MODE=dry' >> $ENV_DIR/env
            grep -q '^BLOOM_TASKS=' $ENV_DIR/env || echo 'BLOOM_TASKS=${{ inputs.tasks }}' >> $ENV_DIR/env
            # Исполнитель подключён, но dry-run: BLOOM_LIVE_BUY НЕ задан, и
            # пока его нет, ни один POST в Bloom не уходит.
            grep -q '^BLOOM_EXEC=' $ENV_DIR/env || echo 'BLOOM_EXEC=1' >> $ENV_DIR/env
            # Тестовые источники стенда и их общий порог. Их ДВА:
            #   DNJeTYni... -- обычный кошелёк владельца;
            #   8aTMUKsp... -- кошелёк владельца в Fomo. Это путь НАШИХ
            #     источников: комиссию платит Fomo, владелец второй
            #     подписант, и разбор такой сделки надо проверить отдельно.
            # Старое одиночное имя чистится, чтобы не осталось расхождения
            # между двумя переменными.
            sed -i '/^BLOOM_TEST_SOURCES=/d; /^BLOOM_TEST_SOURCE=/d; /^BLOOM_TEST_MIN_SOL=/d; /^BLOOM_TEST_BUY_SOL=/d; /^BLOOM_TEST_BUY_SOL_BUMP=/d' $ENV_DIR/env
            echo 'BLOOM_TEST_SOURCES=DNJeTYni5QQVCwNNt1SrHu1GjYR4ak5Zw7LeuFsKYmXX,8aTMUKspLnkm7jaHf21qfB1b5dzPzXgsmcjPPnJPaPtA' >> $ENV_DIR/env
            echo 'BLOOM_TEST_MIN_SOL=0.05' >> $ENV_DIR/env
            # Размер стенда по слову владельца: 0.001 SOL, при отказе
            # площадки по минимуму -- один повтор на 0.005.
            echo 'BLOOM_TEST_BUY_SOL=0.001' >> $ENV_DIR/env
            echo 'BLOOM_TEST_BUY_SOL_BUMP=0.005' >> $ENV_DIR/env
            # Строки о событиях стенда в Telegram: только тестовые источники.
            # Токен и получатель уже в этом файле -- их пишет деплой сторожа;
            # здесь только выключатель, и он переписывается на каждом деплое.
            sed -i '/^BLOOM_TELEGRAM_LIVE_TEST=/d' $ENV_DIR/env
            echo 'BLOOM_TELEGRAM_LIVE_TEST=${{ inputs.telegram_live_test }}' >> $ENV_DIR/env
            # Строки по БОЕВЫМ источникам идут вместе с боевыми покупками:
            # включать поток в 260 решений в сутки, не включая покупки,
            # смысла нет, а включать покупки без строк -- опасно.
            sed -i '/^BLOOM_TELEGRAM_REAL=/d' $ENV_DIR/env
            echo 'BLOOM_TELEGRAM_REAL=${{ inputs.live_buy }}' >> $ENV_DIR/env
            # ДВУХШАГОВАЯ ТЕНЬ -- ЗАМЕР, И У НЕГО СВОЯ ЦЕНА. Четыре
            # котировочных пула дают около 535 МБ в час: это ~10 000
            # кредитов в час против ~390 на всех двадцати источниках вместе.
            # Бюджет ограничивает именно замер: когда он исчерпан, хранилища
            # уходят из подписки, а источники, наш кошелёк, одношаговая тень
            # и торговля остаются нетронутыми.
            sed -i '/^BLOOM_SHADOW_LEGS=/d' $ENV_DIR/env
            echo 'BLOOM_SHADOW_LEGS=${{ inputs.shadow_legs }}' >> $ENV_DIR/env
            sed -i '/^BLOOM_SHADOW_LEGS_CREDITS=/d' $ENV_DIR/env
            echo 'BLOOM_SHADOW_LEGS_CREDITS=${{ inputs.shadow_legs_credits }}' >> $ENV_DIR/env
            # BLOOM_LIVE_BUY вычищается ВСЕГДА и включается ТОЛЬКО отдельным
            # входом live_buy ниже: покупка по реальному источнику -- это
            # настоящие деньги, и включаться она должна одним осознанным
            # действием, а не побочным следствием любого деплоя.
            # ПОЛОСА СВОЕЙ ОТПРАВКИ. Сборка и симуляция от BLOOM_OWN_SEND=1
            # ничего не стоят и ничего не отправляют. Отправка -- отдельный
            # рубильник BLOOM_OWN_SEND_LIVE, он вычищается ВСЕГДА и пишется
            # ниже отдельным шагом: своя покупка -- настоящие деньги.
            sed -i '/^BLOOM_OWN_SEND=/d; /^BLOOM_OWN_SEND_LIVE=/d; /^BLOOM_OWN_SEND_SOL=/d; /^BLOOM_SENDER_REGION=/d' $ENV_DIR/env
            # КОНТРОЛЬ ДОСТАВКИ (З2). Вычищается ВСЕГДА и пишется только по
            # входу: пустая транзакция стоит 0.002005 SOL за штуку, и
            # включаться она должна осознанно, а не по инерции деплоя.
            sed -i '/^BLOOM_LANE_CONTROL=/d' $ENV_DIR/env
            echo 'BLOOM_LANE_CONTROL=${{ inputs.lane_control }}' >> $ENV_DIR/env
            # БОЕВОЙ ПУЛ (шаг 1). Решение владельца 25.09: пул отправителей
            # шаг 1 ВКЛЮЧИТЬ сейчас, BLOOM_POOL_SEND=1; веер и пул идут
            # параллельно на каждом сигнале полосы. Значение переписывается
            # каждым деплоем: рубильник не должен зависеть от того, что кто-то
            # помнит, каким он был.
            # НИ КАВЫЧЕК, НИ АПОСТРОФОВ В ЭТОМ КОММЕНТАРИИ: он живёт ВНУТРИ
            # двойных кавычек ssh. Двойная кавычка здесь закрывает аргумент, и
            # остаток скрипта уезжает в ЛОКАЛЬНУЮ оболочку под ghrunner,
            # которому env читать нельзя -- так упали прогоны 61 и 62 с жалобой
            # sed на Permission denied при полностью исправном хосте. Пара
            # кавычек не лучше одной: она закрывает и снова открывает аргумент,
            # а текст между ними становится локальным -- так упал прогон 63,
            # и апостроф из того же комментария добил остаток скрипта.
            # Проверку на оба случая ставит analysis/check_workflow_quotes.py.
            sed -i '/^BLOOM_POOL_SEND=/d' $ENV_DIR/env
            echo 'BLOOM_POOL_SEND=${{ inputs.pool_send }}' >> $ENV_DIR/env
            # ВАРИАНТ НА ДОЛГОВЕЧНОМ NONCE (шаг 2). Отдельный рубильник: это
            # другой путь денег -- N подписанных транзакций вместо одной, и
            # решает, какая села, цепь. Без адреса аккаунта nonce в окружении
            # он не включается вовсе, даже если здесь стоит единица.
            sed -i '/^BLOOM_POOL_NONCE=/d' $ENV_DIR/env
            echo 'BLOOM_POOL_NONCE=${{ inputs.pool_nonce }}' >> $ENV_DIR/env
            echo 'BLOOM_OWN_SEND=${{ inputs.own_send }}' >> $ENV_DIR/env
            echo 'BLOOM_OWN_SEND_SOL=${{ inputs.own_send_sol }}' >> $ENV_DIR/env
            echo 'BLOOM_SENDER_REGION=${{ inputs.sender_region }}' >> $ENV_DIR/env
            sed -i '/^BLOOM_LIVE_BUY=/d' $ENV_DIR/env
            sed -i '/^BLOOM_BUY_SOL=/d' $ENV_DIR/env
            echo 'BLOOM_BUY_SOL=${{ inputs.buy_sol }}' >> $ENV_DIR/env
            sed -i '/^BLOOM_LIVE_TEST=/d' $ENV_DIR/env
            # НОЧНОЙ КОД 27.09, пункт 2 владельца. Пять строк окружения, все
            # переписываются каждым деплоем -- значение не должно зависеть от
            # того, что кто-то помнит, каким оно было.
            #   BLOOM_CLOSE_ON_SELL  -- закрытие токен-счёта при продаже;
            #   BLOOM_TG_FORMAT      -- формат строки в Telegram;
            #   BLOOM_REGION_SEND    -- региональная отправка, по умолчанию 0;
            #   BLOOM_LANE_MAX_POOL_FEE -- потолок комиссии пула на денежном пути;
            #   BLOOM_COPIERS_FILE   -- список копировщиков в каталоге состояния.
            # НИ КАВЫЧЕК, НИ АПОСТРОФОВ В ЭТОМ КОММЕНТАРИИ: он внутри ssh.
            sed -i '/^BLOOM_CLOSE_ON_SELL=/d; /^BLOOM_TG_FORMAT=/d; /^BLOOM_REGION_SEND=/d; /^BLOOM_LANE_MAX_POOL_FEE=/d; /^BLOOM_COPIERS_FILE=/d' $ENV_DIR/env
            echo BLOOM_CLOSE_ON_SELL=$CLOSE_ON_SELL >> $ENV_DIR/env
            echo BLOOM_TG_FORMAT=$TG_FORMAT >> $ENV_DIR/env
            echo BLOOM_REGION_SEND=$REGION_SEND >> $ENV_DIR/env
            echo BLOOM_LANE_MAX_POOL_FEE=$LANE_MAX_POOL_FEE >> $ENV_DIR/env
            echo BLOOM_COPIERS_FILE=$COPIERS_FILE >> $ENV_DIR/env
            chown root:root $ENV_DIR/env && chmod 600 $ENV_DIR/env
            ls -l $ENV_DIR/env
          "
          if [ "${{ inputs.live_buy }}" = "1" ]; then
            echo "БОЕВЫЕ ПОКУПКИ: включаю BLOOM_LIVE_BUY=1, размер ${{ inputs.buy_sol }} SOL"
            ssh -n $SSH_OPTS root@$TARGET_HOST "echo 'BLOOM_LIVE_BUY=1' >> $ENV_DIR/env && chmod 600 $ENV_DIR/env"
          else
            echo "боевые покупки ВЫКЛЮЧЕНЫ: BLOOM_LIVE_BUY не задан"
          fi
          if [ "${{ inputs.own_send_live }}" = "1" ]; then
            if [ "${{ inputs.own_send }}" != "1" ]; then
              echo "СБОЙ: own_send_live=1 при own_send=0 -- отправлять было бы нечему."
              exit 1
            fi
            echo "ПОЛОСА ОТПРАВЛЯЕТ ЖИВЬЁМ: BLOOM_OWN_SEND_LIVE=1, размер ${{ inputs.own_send_sol }} SOL"
            ssh -n $SSH_OPTS root@$TARGET_HOST "echo 'BLOOM_OWN_SEND_LIVE=1' >> $ENV_DIR/env && chmod 600 $ENV_DIR/env"
          else
            echo "полоса НЕ отправляет: BLOOM_OWN_SEND_LIVE не задан (сборка и симуляция идут)"
          fi
          if [ "${{ inputs.own_send }}" = "1" ]; then
            # Ключ кошелька нужен полосе для подписи. Он лежит в общем
            # env-файле, его пишет деплой сторожа при via_jupiter=1. Без него
            # полоса дойдёт до подписи и честно откажет, но узнать об этом
            # лучше здесь, а не в бою.
            if ssh -n $SSH_OPTS root@$TARGET_HOST "grep -qE '^(EXEC_WALLET_KEY|BLOOM_WALLET_KEY)=.' $ENV_DIR/env"; then
              echo "ключ кошелька в env есть (значение не читаем и не печатаем)"
            else
              echo "ВНИМАНИЕ: ключа кошелька в env нет -- полоса не сможет подписать."
              echo "Ставится деплоем сторожа с via_jupiter=1 (секрет EXEC_WALLET_KEY)."
              if [ "${{ inputs.own_send_live }}" = "1" ]; then
                echo "СБОЙ: живая отправка без ключа невозможна."
                exit 1
              fi
            fi
            # КОШЕЛЁК ПОЛОСЫ (решение владельца 25.09: у полосы свой кошелёк,
            # свои 0.1 SOL, отдельный учёт). Гейт живой отправки: адрес и ключ
            # обязаны быть заданы И СОГЛАСОВАНЫ между собой. Несогласованность
            # значит подпись не тем кошельком -- сеть отвергнет транзакцию,
            # потратив приоритет и чаевые, и замер выйдет ложным.
            # Проверяет сам модуль полосы на хосте: значение ключа никуда не
            # выводится, наружу идёт только адрес и слово "да/нет".
            LANE_READY=$(ssh -n $SSH_OPTS root@$TARGET_HOST "
              set -a; . $ENV_DIR/env; set +a
              PYTHONPATH=$CODE_DIR /home/bot/robinhood-chain-alpha/venv/bin/python -c \
                'import json, bloom_own_send as O; г=O.кошелёк_готов(); print(json.dumps({\"wallet\": г.get(\"wallet\"), \"own\": г.get(\"own_wallet\"), \"ok\": г.get(\"ok\"), \"why_not\": г.get(\"why_not\")}, ensure_ascii=False))'
            ") || LANE_READY=""
            echo "кошелёк полосы: $LANE_READY"
            case "$LANE_READY" in
              *'"own": true'*'"ok": true'*) echo "адрес и ключ полосы согласованы" ;;
              *)
                echo "ВНИМАНИЕ: кошелёк полосы не готов (см. строку выше)."
                echo "Создаётся прогоном run_vps_lane_wallet_nl.yml с mode=create."
                if [ "${{ inputs.own_send_live }}" = "1" ]; then
                  echo "СБОЙ: живая отправка полосы без согласованного своего кошелька запрещена."
                  exit 1
                fi
                ;;
            esac
          fi
          if [ "${{ inputs.live_test }}" = "yes" ]; then
            echo "РЕЖИМ СТЕНДА: включаю BLOOM_LIVE_TEST=1 (покупки только по тестовому источнику)"
            ssh -n $SSH_OPTS root@$TARGET_HOST "echo 'BLOOM_LIVE_TEST=1' >> $ENV_DIR/env && chmod 600 $ENV_DIR/env"
          else
            echo "режим dry-run: BLOOM_LIVE_TEST не задан"
          fi
          echo "строк в env и сколько из них -- присваивания:"
          ssh -n $SSH_OPTS root@$TARGET_HOST "wc -l < $ENV_DIR/env; grep -cE '^[A-Za-z_][A-Za-z0-9_]*=' $ENV_DIR/env"

      - name: "Зависимость websockets в venv хоста"
        run: |
          set -e
          ssh -n $SSH_OPTS root@$TARGET_HOST "/home/bot/robinhood-chain-alpha/venv/bin/python -c 'import websockets; print(\"websockets\", websockets.__version__)' || /home/bot/robinhood-chain-alpha/venv/bin/pip install -q websockets"
          ssh -n $SSH_OPTS root@$TARGET_HOST "/home/bot/robinhood-chain-alpha/venv/bin/python -c 'import websockets, requests; print(\"есть websockets\", websockets.__version__, \"и requests\", requests.__version__)'"

      - name: "Проверка --check-only ДО запуска службы (ничего не решает)"
        run: |
          set -e
          ssh -n $SSH_OPTS root@$TARGET_HOST "
            set -a; . $ENV_DIR/env; set +a
            /home/bot/robinhood-chain-alpha/venv/bin/python $CODE_DIR/bloom_detector.py --check-only --config $CODE_DIR/konfig_snapshot.json
            echo '--- исполнитель ---'
            /home/bot/robinhood-chain-alpha/venv/bin/python $CODE_DIR/bloom_executor.py --check-only
          " 2>&1 | tail -60 | tee data/bloom_detector_deploy.txt

      - name: "ГЕЙТ: рубильник читается ОТ ПОЛЬЗОВАТЕЛЯ СЛУЖБЫ, а не от root"
        run: |
          set -e
          # Проверка от root бесполезна: первый живой прогон детектора
          # встал на PermissionError именно потому, что деплой спрашивал
          # root-а, а служба работает от bot. Спрашиваем того, кто работает.
          OUT=$(ssh -n $SSH_OPTS root@$TARGET_HOST "
            set -a; . $ENV_DIR/env; set +a
            sudo -n -u bot env BLOOM_STATE_DIR=\"\$BLOOM_STATE_DIR\" \
                 BLOOM_KILL_FILE=\"\$BLOOM_KILL_FILE\" \
                 BLOOM_KILL_SELL_FILE=\"\$BLOOM_KILL_SELL_FILE\" \
                 PYTHONPATH=$CODE_DIR \
                 /home/bot/robinhood-chain-alpha/venv/bin/python -c 'import bloom_exec_state as S; s=S.ExecState(); d,p=s.kill_readable(); print((\"ДОСТУПЕН\" if d else \"НЕДОСТУПЕН\"), p); import sys; sys.exit(0 if d else 1)'
          ") || { echo "ГЕЙТ НЕ ПРОЙДЕН: $OUT"; exit 1; }
          echo "рубильник от имени bot: $OUT"

      - name: "Отложить журналы прежнего формата (по запросу)"
        if: ${{ inputs.rotate_journals == 'yes' }}
        run: |
          set -e
          # Ключи журналов переведены на ASCII (schema_version 2). Смешивать
          # записи v1 и v2 в одном файле нельзя: любая сводка по ключу
          # посчитает только половину. Поэтому старые файлы откладываются
          # ОДИН раз, с меткой времени, а не удаляются.
          stamp=$(date -u +%Y%m%dT%H%M%SZ)
          ssh -n $SSH_OPTS root@$TARGET_HOST "
            set -e
            cd $STATE_DIR
            for f in decisions.jsonl positions.jsonl; do
              if [ -s \"\$f\" ]; then
                mv \"\$f\" \"\$f.v1.$stamp\"
                echo \"отложен \$f -> \$f.v1.$stamp\"
              else
                echo \"\$f пуст или отсутствует -- откладывать нечего\"
              fi
            done
            chown -R bot:bot $STATE_DIR
            ls -l $STATE_DIR | head -20
          "

      - name: "ГЕЙТ: каталог состояния принадлежит службе, а не root"
        run: |
          set -e
          # Шаги деплоя идут от root, и всё, что они создают в каталоге
          # состояния, остаётся root-овым -- служба от bot потом писать
          # туда не может. Так уже потерялся весь учёт кредитов детектора:
          # каталог helius_usage создал --check-only от root.
          ssh -n $SSH_OPTS root@$TARGET_HOST "
            set -e
            chown -R bot:bot $STATE_DIR
            find $STATE_DIR ! -user bot -print | head -5
            sudo -n -u bot test -w $STATE_DIR || { echo 'СБОЙ: bot не может писать в $STATE_DIR'; exit 1; }
            echo 'каталог состояния пишется службой'
          "

      - name: "Метка начала стенда (только по явному входу владельца)"
        if: ${{ inputs.mark_stand_start == 'yes' }}
        run: |
          set -e
          # Метка объявляет всю ПРЕЖНЮЮ активность кошелька его прежней
          # жизнью: ручная торговля, чистка пустых токен-счетов, переводы
          # себе. Того, кто торгует СЕЙЧАС, она не прячет -- ограничивает
          # только прошлое. Ставится от имени службы, иначе файл будет
          # root-овым и служба его не перепишет.
          ssh -n $SSH_OPTS root@$TARGET_HOST "
            set -a; . $ENV_DIR/env; set +a
            sudo -n -u bot env BLOOM_STATE_DIR=\"\$BLOOM_STATE_DIR\" \
                 PYTHONPATH=$CODE_DIR \
                 /home/bot/robinhood-chain-alpha/venv/bin/python \
                 $CODE_DIR/bloom_reconcile.py --mark-start \
                 --note 'начало стенда, подтверждено владельцем' 2>&1 | head -20
          " | tee -a data/bloom_detector_deploy.txt

      - name: "Сверка при старте (bloom_reconcile): можно ли включать деньги"
        run: |
          set -e
          # Исключение для стенда -- отдельным входом и только по слову
          # владельца: позиция стенда стоит открытой именно потому, что её не
          # удалось продать, а правка, которая её закрывает, ставится этим же
          # деплоем. Боевые позиции исключение не покрывает -- это в сверке.
          RECON_ARGS=""
          if [ "${{ inputs.allow_open_live_test }}" = "yes" ]; then
            RECON_ARGS="--allow-open-live-test"
          fi
          # Порог баланса -- ДЕНЬГИ, и менять его молча нельзя. Пустой вход
          # оставляет 0.3; заданный передаётся сверке как осознанное решение
          # владельца и печатается в лог деплоя числом.
          MIN_START_BALANCE="${{ inputs.min_start_balance }}"
          if [ -n "$MIN_START_BALANCE" ]; then
            case "$MIN_START_BALANCE" in
              ''|*[!0-9.]*) echo "СБОЙ: порог баланса не число: $MIN_START_BALANCE"; exit 1;;
            esac
            echo "порог баланса для старта задан входом: $MIN_START_BALANCE SOL"
          fi
          echo "аргументы сверки: [$RECON_ARGS]"
          # В режиме стенда сверка ОБЯЗАНА быть чистой -- иначе опыт
          # начинается с неизвестного исходного состояния. В dry-run она
          # информационная: там позиции dry-run помехой не считаются.
          set +e
          OUT=$(ssh -n $SSH_OPTS root@$TARGET_HOST "
            set -a; . $ENV_DIR/env; set +a
            ${MIN_START_BALANCE:+BLOOM_MIN_START_BALANCE_SOL=$MIN_START_BALANCE} \
            PYTHONPATH=$CODE_DIR /home/bot/robinhood-chain-alpha/venv/bin/python $CODE_DIR/bloom_reconcile.py $RECON_ARGS 2>&1")
          RC=$?
          set -e
          echo "$OUT" | tail -60 | tee -a data/bloom_detector_deploy.txt
          # ПАДЕНИЕ СВЕРКИ -- НЕ ТО ЖЕ, ЧТО "СВЕРКА НЕ ЧИСТАЯ", И ГЛОТАТЬ ЕГО НЕЛЬЗЯ.
          # Не чистая сверка на живом деплое бывает по делу: открытая позиция от
          # обычной торговли -- нормальное состояние, поэтому RC != 0 здесь
          # намеренно не смертелен. Но traceback означает, что вердикта НЕТ
          # ВОВСЕ: денежный гейт старта не сказал ни "можно", ни "нельзя".
          # 30.09 в 02:27Z это случилось на живом деплое и прошло молча:
          # bloom_reconcile падал UnicodeDecodeError на СЖАТОМ отложенном
          # журнале позиций, а проверка роняла деплой только при live_test=yes.
          if printf '%s' "$OUT" | grep -q "Traceback (most recent call last)"; then
            echo "СБОЙ: сверка при старте УПАЛА -- вердикта нет вовсе, а не 'не чистая'."
            echo "Это не повод включать деньги: деплой остановлен."
            printf '%s' "$OUT" | grep -A6 "Traceback (most recent call last)" | head -40
            exit 1
          fi
          if [ "${{ inputs.live_test }}" = "yes" ] && [ "$RC" != "0" ]; then
            echo "СТЕНД НЕ ЗАПУЩЕН: сверка при старте не чистая (см. blockers выше)"
            exit 1
          fi

      - name: "systemd-юнит с ужесточением"
        run: |
          {
            echo '[Unit]'
            echo 'Description=Bloom signal detector (journal only, no buying code present)'
            echo 'After=network-online.target'
            echo 'Wants=network-online.target'
            echo ""
            echo '[Service]'
            echo 'Type=simple'
            echo 'User=bot'
            echo 'Group=bot'
            echo 'WorkingDirectory=/home/bot/bloom_executor'
            echo 'EnvironmentFile=/etc/bloom-executor/env'
            echo 'ExecStart=/home/bot/robinhood-chain-alpha/venv/bin/python -u /home/bot/bloom_executor/bloom_detector.py --serve --config /home/bot/bloom_executor/konfig_snapshot.json'
            echo 'Restart=always'
            echo 'RestartSec=5'
            echo 'StandardOutput=journal'
            echo 'StandardError=journal'
            echo 'NoNewPrivileges=true'
            echo 'PrivateTmp=true'
            echo 'ProtectSystem=strict'
            echo 'ProtectHome=read-only'
            echo 'ReadWritePaths=/home/bot/bloom_executor_live_data'
            echo 'ProtectKernelTunables=true'
            echo 'ProtectControlGroups=true'
            echo 'RestrictSUIDSGID=true'
            echo 'LockPersonality=true'
            echo 'MemoryMax=512M'
            echo 'TasksMax=64'
            echo ""
            echo '[Install]'
            echo 'WantedBy=multi-user.target'
          } | ssh $SSH_OPTS root@$TARGET_HOST "cat > /etc/systemd/system/$SVC.service"
          ssh -n $SSH_OPTS root@$TARGET_HOST "systemctl daemon-reload && echo 'юнит записан'"

      - name: "НУЛЬ ПОЗИЦИЙ перед перезапуском (та же охрана, что у остальных прогонов)"
        if: ${{ inputs.enable_service == 'yes' }}
        run: |
          set -e
          set -o pipefail
          # ЗАЧЕМ. Правило "перезапуск только при НУЛЕ открытых позиций"
          # держалось здесь на внимании человека, а не на проверке: этот прогон
          # перезапускает детектор чаще всех, и охраны в нём не было ВОВСЕ,
          # тогда как в run_vps_env_flag_nl, run_vps_group_policy_nl,
          # run_vps_lane_curve_flag_nl, run_vps_nochnaya_konfiguraciya_nl,
          # run_lane_wallet_env_nl и run_vps_autoupdate_guard_nl она стоит.
          # Позиция в воздухе на время перезапуска остаётся без своего сторожа.
          #
          # ОХРАНА ТА ЖЕ САМАЯ, а не своя копия: расходятся именно копии.
          # Она требует нуля открытых и нуля зависших ПО ВСЕМ группам, признак
          # жизни детектора не старше 10 минут (иначе числам о позициях верить
          # нельзя) и снятый рубильник продаж (иначе купленное некому продать).
          #
          # ПРОВЕРКА СТОИТ ВПЛОТНУЮ К ПЕРЕЗАПУСКУ, отдельным шагом прямо перед
          # ним: между постановкой прогона в очередь и перезапуском проходят
          # минуты, и за них позиция успевает открыться.
          ssh $SSH_OPTS root@$TARGET_HOST "cat > /tmp/pered_perezapuskom_sluzhby.py" < deploy/checks/pered_perezapuskom_sluzhby.py
          ssh -n $SSH_OPTS root@$TARGET_HOST "python3 /tmp/pered_perezapuskom_sluzhby.py" | tee -a data/bloom_detector_deploy.txt
          ssh -n $SSH_OPTS root@$TARGET_HOST "rm -f /tmp/pered_perezapuskom_sluzhby.py"

      - name: "Запуск и ЖЁСТКАЯ проверка, что поднялось"
        if: ${{ inputs.enable_service == 'yes' }}
        run: |
          set -e
          # Момент перезапуска берётся НА ХОСТЕ: часы бегунка и часы
          # хоста -- разные часы. Ниже признак жизни обязан быть НОВЕЕ
          # этого момента, иначе мы читаем файл прошлого запуска и
          # считаем его доказательством. На зонде это стоило трёх
          # деплоев в пустоту 24.09.
          echo "RESTART_TS=$(ssh -n $SSH_OPTS root@$TARGET_HOST 'date +%s')" >> "$GITHUB_ENV"
          ssh -n $SSH_OPTS root@$TARGET_HOST "systemctl enable $SVC && systemctl restart $SVC"
          sleep 10
          ssh -n $SSH_OPTS root@$TARGET_HOST "systemctl is-active --quiet $SVC" || {
            echo "СБОЙ: служба не активна"; ssh -n $SSH_OPTS root@$TARGET_HOST "journalctl -u $SVC -n 80 --no-pager"; exit 1; }
          RESTARTS=$(ssh -n $SSH_OPTS root@$TARGET_HOST "systemctl show -p NRestarts --value $SVC")
          echo "NRestarts=$RESTARTS"
          [ "$RESTARTS" -lt 3 ] || { echo "СБОЙ: служба уже перезапускалась $RESTARTS раз"; ssh -n $SSH_OPTS root@$TARGET_HOST "journalctl -u $SVC -n 80 --no-pager"; exit 1; }
          ssh -n $SSH_OPTS root@$TARGET_HOST "journalctl -u $SVC -n 40 --no-pager"

      - name: "Признак жизни детектора должен появиться"
        if: ${{ inputs.enable_service == 'yes' }}
        run: |
          set -e
          sleep 25
          ssh -n $SSH_OPTS root@$TARGET_HOST "test -s $STATE_DIR/detector_status.json" || {
            echo "СБОЙ: признака жизни нет"; ssh -n $SSH_OPTS root@$TARGET_HOST "journalctl -u $SVC -n 80 --no-pager"; exit 1; }
          HEARTBEAT_TS=$(ssh -n $SSH_OPTS root@$TARGET_HOST "stat -c %Y $STATE_DIR/detector_status.json")
          if [ "$HEARTBEAT_TS" -lt "$RESTART_TS" ]; then
            echo "СБОЙ: признак жизни детектора старше перезапуска -- служба его не обновила"
            ssh -n $SSH_OPTS root@$TARGET_HOST "journalctl -u $SVC -n 80 --no-pager"
            exit 1
          fi
          echo "признак жизни новее перезапуска на $((HEARTBEAT_TS - RESTART_TS)) с"
          ssh -n $SSH_OPTS root@$TARGET_HOST "cat $STATE_DIR/detector_status.json" | tee -a data/bloom_detector_deploy.txt
          echo "--- решений в журнале ---" | tee -a data/bloom_detector_deploy.txt
          ssh -n $SSH_OPTS root@$TARGET_HOST "wc -l < $STATE_DIR/decisions.jsonl 2>/dev/null || echo 0" | tee -a data/bloom_detector_deploy.txt
          echo "--- позиций в журнале (должно быть 0: покупать нечем) ---" | tee -a data/bloom_detector_deploy.txt
          ssh -n $SSH_OPTS root@$TARGET_HOST "wc -l < $STATE_DIR/positions.jsonl 2>/dev/null || echo 0" | tee -a data/bloom_detector_deploy.txt

      - name: "Коммит отчёта"
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -f data/bloom_detector_deploy.txt ] && git add data/bloom_detector_deploy.txt
          git diff --cached --quiet && { echo "нечего коммитить"; exit 0; }
          git commit -m "Bloom: деплой детектора v2, отчёт [automated]"
          for i in 1 2 3 4 5; do
            git push origin HEAD:claude/nifty-sagan-r0polg && exit 0
            git pull --rebase -X theirs origin claude/nifty-sagan-r0polg
            sleep 3
          done
          exit 1
