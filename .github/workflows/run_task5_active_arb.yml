name: "Задача 5 -- размер приза на активных ценовых расхождениях (Dune Mozila, только измерение)"

# Владелец, 2026-09-10: измерить реальный размер атомарного
# внутриблочного арбитража на Robinhood chain (uniswap_v3_robinhood +
# uniswap_v4_robinhood), 30 дней. Бюджет свободный в рамках остатка
# Mozila, но оценка стоимости на одном дне до полного прогона --
# ОБЯЗАТЕЛЬНА. dex.trades НЕ используется -- декодированные схемы
# напрямую, узкими предикатами (владелец, явно).

on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/sc1-pons-v2-launcher-efdbyt
    paths:
      - "data/p3_guard_cache/TASK5_STAGE0_SCHEMA_REQUEST"
      - "data/p3_guard_cache/TASK5_STAGE0B_POOLCREATED_REQUEST"
      - "data/p3_guard_cache/TASK5_STAGE0C_MINT_SCHEMA_REQUEST"
      - "data/p3_guard_cache/TASK5_STAGE1_ONEDAY_REQUEST"
      - "data/p3_guard_cache/TASK5_DIAG_SINGLE_TX_REQUEST"
      - "data/p3_guard_cache/TASK5_DIAG_FULL_LEGS_REQUEST"
      - "data/p3_guard_cache/TASK5_STAGE2_FULL_REQUEST"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r analysis/requirements.txt

      - name: "Задача 5, Шаг 0 -- реальные схемы (v3 evt_swap колонки, Factory, transactions)"
        if: hashFiles('data/p3_guard_cache/TASK5_STAGE0_SCHEMA_REQUEST') != ''
        env:
          DUNE_API_KEY: ${{ secrets.DUNE_API_KEY_MOZILA }}
          CREDIT_GUARD_NAMESPACE: task5_active_arb_mozila
          CREDIT_GUARD_FILE: data/credits_spent_mozila.json
        run: python -u analysis/task5_active_arb_stage0_schema.py

      - name: "Задача 5, Шаг 0b -- дозапрос PoolCreated (token0/token1 маппинг для v3)"
        if: hashFiles('data/p3_guard_cache/TASK5_STAGE0B_POOLCREATED_REQUEST') != ''
        env:
          DUNE_API_KEY: ${{ secrets.DUNE_API_KEY_MOZILA }}
          CREDIT_GUARD_NAMESPACE: task5_active_arb_mozila
          CREDIT_GUARD_FILE: data/credits_spent_mozila.json
        run: python -u analysis/task5_active_arb_stage0b_poolcreated.py

      - name: "Задача 5, Шаг 0c -- дозапрос Mint (LP-провайдеры для фильтра самоторговли)"
        if: hashFiles('data/p3_guard_cache/TASK5_STAGE0C_MINT_SCHEMA_REQUEST') != ''
        env:
          DUNE_API_KEY: ${{ secrets.DUNE_API_KEY_MOZILA }}
          CREDIT_GUARD_NAMESPACE: task5_active_arb_mozila
          CREDIT_GUARD_FILE: data/credits_spent_mozila.json
        run: python -u analysis/task5_active_arb_stage0c_mint_schema.py

      - name: "Задача 5, Шаг 1 -- оценка на одном дне (обязательна перед полным прогоном)"
        if: hashFiles('data/p3_guard_cache/TASK5_STAGE1_ONEDAY_REQUEST') != ''
        env:
          DUNE_API_KEY: ${{ secrets.DUNE_API_KEY_MOZILA }}
          CREDIT_GUARD_NAMESPACE: task5_active_arb_mozila
          CREDIT_GUARD_FILE: data/credits_spent_mozila.json
        run: python -u analysis/task5_active_arb_stage1_oneday.py

      - name: "Задача 5, диагностика конкретной аномалии (по уже оплаченному query_id, почти бесплатно)"
        if: hashFiles('data/p3_guard_cache/TASK5_DIAG_SINGLE_TX_REQUEST') != ''
        env:
          DUNE_API_KEY: ${{ secrets.DUNE_API_KEY_MOZILA }}
          CREDIT_GUARD_NAMESPACE: task5_active_arb_mozila
          CREDIT_GUARD_FILE: data/credits_spent_mozila.json
        run: python -u analysis/task5_active_arb_diag_single_tx.py

      - name: "Задача 5, проверка гипотезы владельца -- net-flow по каждому токену отдельно"
        if: hashFiles('data/p3_guard_cache/TASK5_DIAG_FULL_LEGS_REQUEST') != ''
        env:
          DUNE_API_KEY: ${{ secrets.DUNE_API_KEY_MOZILA }}
          CREDIT_GUARD_NAMESPACE: task5_active_arb_mozila
          CREDIT_GUARD_FILE: data/credits_spent_mozila.json
        run: python -u analysis/task5_active_arb_diag_full_legs.py

      - name: "Задача 5, Шаг 2 -- полный прогон 30 дней (только если Шаг 1 в пределах бюджета)"
        if: hashFiles('data/p3_guard_cache/TASK5_STAGE2_FULL_REQUEST') != ''
        env:
          DUNE_API_KEY: ${{ secrets.DUNE_API_KEY_MOZILA }}
          CREDIT_GUARD_NAMESPACE: task5_active_arb_mozila
          CREDIT_GUARD_FILE: data/credits_spent_mozila.json
        run: python -u analysis/task5_active_arb_stage2_full.py

      - name: Commit results
        if: always()
        run: |
          git rm -f --ignore-unmatch data/p3_guard_cache/TASK5_STAGE0_SCHEMA_REQUEST data/p3_guard_cache/TASK5_STAGE0B_POOLCREATED_REQUEST data/p3_guard_cache/TASK5_STAGE0C_MINT_SCHEMA_REQUEST data/p3_guard_cache/TASK5_STAGE1_ONEDAY_REQUEST data/p3_guard_cache/TASK5_DIAG_SINGLE_TX_REQUEST data/p3_guard_cache/TASK5_DIAG_FULL_LEGS_REQUEST data/p3_guard_cache/TASK5_STAGE2_FULL_REQUEST
          [ -e data/p3_guard_cache/task5_active_arb_diag_single_tx_result.json ] && git add data/p3_guard_cache/task5_active_arb_diag_single_tx_result.json
          [ -e data/p3_guard_cache/task5_active_arb_diag_full_legs_result.json ] && git add data/p3_guard_cache/task5_active_arb_diag_full_legs_result.json
          [ -e data/p3_guard_cache/task5_active_arb_stage0_schema_result.json ] && git add data/p3_guard_cache/task5_active_arb_stage0_schema_result.json
          [ -e data/p3_guard_cache/task5_active_arb_stage0b_poolcreated_result.json ] && git add data/p3_guard_cache/task5_active_arb_stage0b_poolcreated_result.json
          [ -e data/p3_guard_cache/task5_active_arb_stage0c_mint_schema_result.json ] && git add data/p3_guard_cache/task5_active_arb_stage0c_mint_schema_result.json
          [ -e data/p3_guard_cache/task5_active_arb_stage1_oneday_result.json ] && git add data/p3_guard_cache/task5_active_arb_stage1_oneday_result.json
          [ -e data/p3_guard_cache/task5_active_arb_stage2_full_result.json ] && git add data/p3_guard_cache/task5_active_arb_stage2_full_result.json
          [ -e data/credits_spent_mozila.json ] && git add data/credits_spent_mozila.json
          [ -d data/task5_active_arb_mozila_cache ] && git add data/task5_active_arb_mozila_cache/
          git diff --cached --quiet && exit 0
          git commit -m "Задача 5: результат [automated]"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected, попытка $i/5 -- git pull --rebase и повтор"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep 3
          done
          echo "не удалось запушить после 5 попыток" >&2
          exit 1
