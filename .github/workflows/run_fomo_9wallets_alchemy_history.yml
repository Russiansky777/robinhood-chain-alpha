name: "Fomo -- полная история 9 адресов через Alchemy (без Dune)"

on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/nifty-sagan-r0polg
    paths:
      - "data/p3_guard_cache/FOMO_9WALLETS_ALCHEMY_HISTORY_REQUEST"

jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r analysis/requirements.txt
      - name: "alchemy_getAssetTransfers, полная история, обе стороны, 0 кредитов Dune"
        env:
          ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
          ALCHEMY_ROBINHOOD_RPC_URL: ${{ secrets.ALCHEMY_ROBINHOOD_RPC_URL }}
        run: python -u analysis/fomo_9wallets_alchemy_full_history.py
      - name: Commit results
        if: always()
        run: |
          git rm -f --ignore-unmatch data/p3_guard_cache/FOMO_9WALLETS_ALCHEMY_HISTORY_REQUEST
          [ -e data/fomo_9wallets_alchemy_full_history_result.json ] && git add data/fomo_9wallets_alchemy_full_history_result.json
          [ -e data/fomo_9wallets_alchemy_raw_transfers.csv ] && git add data/fomo_9wallets_alchemy_raw_transfers.csv
          git diff --cached --quiet && exit 0
          git commit -m "Fomo (Alchemy, без Dune): полная история 9 адресов, результат [automated]"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected, попытка $i/5 -- git pull --rebase и повтор"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep 3
          done
          echo "не удалось запушить после 5 попыток" >&2
          exit 1
