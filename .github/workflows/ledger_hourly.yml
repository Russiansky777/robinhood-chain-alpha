name: "Solana ledger -- единый конвейер учёта сделок (почасовой)"

# Владелец просил положить файл в main, но у этого репозитория main НЕ
# является default-веткой (проверено через API в этой же сессии:
# default_branch = claude/robinhood-copytrading-hypothesis-awjj0g) --
# GitHub cron регистрируется только с реальной default-ветки, поэтому
# файл лежит здесь, а не на main (иначе расписание молча не сработает,
# как уже было с crowd_night.yml). Вся работа и все коммиты -- в
# claude/nifty-sagan-r0polg, эта ветка используется только как носитель
# расписания.

on:
  schedule:
    # ДВА ЗАПУСКА В ЧАС И НЕ В НОЛЬ (слово владельца 01.10, вечер, п.3).
    # ПОЧЕМУ. Минута 0 -- самая забитая у GitHub, и расписание с неё молча
    # теряется: по журналу этого самого учёта фактические срабатывания 30.09 --
    # 21:14, 22:14, 01:54, 08:34, 16:10, то есть пропуск до 7.6 часа подряд при
    # заявленном "каждый час". Два запуска со смещением дают два независимых
    # шанса в час: пропуск одного больше не оставляет учёт без прогона.
    - cron: "17 * * * *"
    - cron: "47 * * * *"
  workflow_dispatch:
    inputs:
      runner:
        description: "'cloud' -- облачный бегунок (по умолчанию, см. причину ниже), 'nl' -- свой бегунок на хосте"
        required: false
        default: "cloud"

concurrency:
  group: ledger_hourly
  cancel-in-progress: false

# ПОЧЕМУ УЧЁТ ОСТАЛСЯ НА ОБЛАЧНОМ БЕГУНКЕ (слово владельца 02.10, п.6: "если
# нельзя -- строкой почему"). Переключатель есть и работает входом runner=nl, но
# по умолчанию стоит облако, и вот причина числами:
#   * свой бегунок живёт НА ТОРГУЮЩЕМ ХОСТЕ и занимает те же два ядра, что
#     детектор и сторож продаж. Учёт -- не чтение на секунду: прогон 289 шёл
#     27 минут, и таких прогонов два в час. Это постоянная конкуренция за CPU
#     с денежным путём, а в этом хозяйстве уже был случай, когда чтение на
#     хосте съело хост (25.09, 16:23Z);
#   * шаги setup-python и pip install на своём бегунке ставят ещё один питон и
#     пакеты рядом с рабочим окружением службы -- этого на торгующем хосте
#     лучше не делать вовсе;
#   * от чужой очереди учёт защищён иначе и уже давно: два расписания в час
#     (:17 и :47) -- пропуск одного слота не оставляет учёт без прогона. В ночь
#     02->03.10 чужая раздача держала очередь с 22:41, и ручной прогон 289,
#     поставленный в 23:11:49Z, всё равно прошёл и обновил учёт на 23:38:51Z.
# Одно слово владельца -- и вход runner=nl переводит его на свой бегунок.
jobs:
  ledger:
    runs-on: ${{ inputs.runner == 'nl' && fromJSON('["self-hosted","nl-host"]') || 'ubuntu-latest' }}
    timeout-minutes: 55
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/nifty-sagan-r0polg
      - name: Git identity + нормализация ветки
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B claude/nifty-sagan-r0polg origin/claude/nifty-sagan-r0polg
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests
      - name: "Самопроверка учёта (без сети)"
        run: python -u analysis/solana_ledger_run.py --self-test
      - name: "Единый конвейер учёта (A-E)"
        env:
          HELIUS_API: ${{ secrets.HELIUS_API }}
          DBOT_API_KEY: ${{ secrets.DBOT_API_KEY }}
        run: python -u analysis/solana_ledger_run.py
      - name: Commit results
        if: always()
        run: |
          git add -A data/helius_usage 2>/dev/null || true
          for f in data/dbot_follow_orders_raw.json data/dbot_follow_trades_raw.json \
                   data/chain_tx_cache.json data/solana_trades_all.json \
                   data/solana_source_stats.json data/solana_task_stats.json data/ledger_status.json; do
            [ -e "$f" ] && git add "$f" || true
          done
          git diff --cached --quiet && exit 0
          git commit -m "Solana ledger: шаг конвейера учёта [automated]"
          for i in 1 2 3 4 5; do
            git push origin HEAD:claude/nifty-sagan-r0polg && exit 0
            echo "push rejected, попытка $i/5 -- git pull --rebase и повтор"
            git pull --rebase origin claude/nifty-sagan-r0polg
            sleep 3
          done
          echo "не удалось запушить после 5 попыток" >&2
          exit 1
