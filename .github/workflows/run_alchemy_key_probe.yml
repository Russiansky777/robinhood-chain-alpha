name: Alchemy -- проверка ключа (auth, реальный rate limit, макс. диапазон блоков)

# Владелец, 2026-09-03: дал реальный ALCHEMY_API_KEY. Требуется секрет
# GH Actions с этим именем (Settings -> Secrets and variables -> Actions
# -> New repository secret -> ALCHEMY_API_KEY) -- эта сессия не имеет
# инструмента для установки секретов сама (нет gh CLI/API-доступа для
# этого), секрет должен быть добавлен владельцем. Ключ передаётся ТОЛЬКО
# через env из secrets -- никогда не пишется в код/логи (GitHub
# автоматически маскирует значение зарегистрированного секрета в логах
# job'а). Только чтение, транзакций нет.
on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/sc1-pons-v2-launcher-efdbyt
    paths:
      - "data/p3_guard_cache/ALCHEMY_KEY_PROBE_REQUEST"

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r analysis/requirements.txt

      - name: Проверка ключа Alchemy (auth + rate limit + макс. диапазон)
        env:
          ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
        run: python -u analysis/alchemy_key_probe.py

      - name: Commit results
        if: always()
        run: |
          [ -e data/p3_guard_cache/alchemy_key_probe_result.json ] && git add data/p3_guard_cache/alchemy_key_probe_result.json
          git diff --cached --quiet && exit 0
          git commit -m "Alchemy: проверка ключа -- auth + rate limit + макс. диапазон блоков [automated]"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected, попытка $i/5 -- git pull --rebase и повтор"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep 3
          done
          echo "не удалось запушить после 5 попыток" >&2
          exit 1
