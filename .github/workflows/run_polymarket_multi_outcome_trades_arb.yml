name: "Задача 2 -- Polymarket мультиисходный арбитраж по сделкам (нижняя граница, публичный API)"

on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/sc1-pons-v2-launcher-efdbyt
    paths:
      - "data/p3_guard_cache/POLYMARKET_MULTI_OUTCOME_TRADES_ARB_REQUEST"

jobs:
  arb:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r analysis/requirements.txt
      - name: "Реальные сделки по мультиисходным событиям Polymarket за 30 дней (Data API + Gamma API, публично)"
        run: python -u analysis/polymarket_multi_outcome_trades_arb.py
      - name: Commit results
        if: always()
        run: |
          git rm -f --ignore-unmatch data/p3_guard_cache/POLYMARKET_MULTI_OUTCOME_TRADES_ARB_REQUEST
          [ -e data/p3_guard_cache/polymarket_multi_outcome_trades_arb_result.json ] && git add data/p3_guard_cache/polymarket_multi_outcome_trades_arb_result.json
          git diff --cached --quiet && exit 0
          git commit -m "Polymarket мультиисходный арбитраж: результат по сделкам за 30 дней [automated]"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected, попытка $i/5 -- git pull --rebase и повтор"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep 3
          done
          echo "не удалось запушить после 5 попыток" >&2
          exit 1
