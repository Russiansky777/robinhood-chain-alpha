name: "Файл групп: правка политики, создание группы, переносы адресов"

# ЗАЧЕМ (пункт 3 владельца 27.09). Включение -- ФАЙЛОМ, а не окружением: файл
# групп детектор перечитывает на ходу, окружение -- только при перезапуске.
# Здесь правится тот самый файл на хосте, которым служба и пользуется.
#
# ЧТО УМЕЕТ, сверх politika_gruppy.py (то умеет одно числовое поле):
#   * признаки (bloom_trades, lane_trades, fanout) и списки (lane_pools);
#   * создание группы со своей политикой;
#   * перенос адреса между группами;
#   * ВЫКЛЮЧЕНИЕ адреса -- переводом в неторгующую группу. Просто убрать адрес
#     из файла нельзя: отсутствующий адрес попадает в группу по умолчанию
#     bloom_lane, а она торгует и полосой, и площадкой.
#
# САМОПРОВЕРКА ДЕНЕЖНОГО ПУТИ внутри скрипта: после записи файл перечитывается
# тем же модулем, что у службы, и не сошлось -- файл возвращается из копии.
on:
  workflow_dispatch:
    inputs:
      pokazat:
        description: "'yes' -- только показать группы и политики, ничего не менять"
        required: false
        default: "yes"
      gruppa:
        description: "группа, у которой правим поле"
        required: false
        default: ""
      pole:
        description: "поле политики (bloom_trades, lane_trades, lane_sol, bloom_sol, min_target_sol, lane_open_max, stop_loss_sol, day_cap_sol, lane_pools)"
        required: false
        default: ""
      znachenie:
        description: "значение: 1/0 для признаков, число, список через запятую для lane_pools, пусто -- None"
        required: false
        default: ""
      sozdat:
        description: "имя НОВОЙ группы"
        required: false
        default: ""
      politika:
        description: "политика новой группы, JSON"
        required: false
        default: ""
      perenesti:
        description: "адрес, который переносим"
        required: false
        default: ""
      v:
        description: "в какую группу перенести или выключить"
        required: false
        default: ""
      pometka:
        description: "пометка адреса в файле"
        required: false
        default: ""
      plan:
        description: "'yes' -- применить СПИСОК правок из data/pravka_grupp_plan.json одним прогоном (остальные входы игнорируются)"
        required: false
        default: "no"
      otklyuchit:
        description: "адрес -- выключить переводом в НЕТОРГУЮЩУЮ группу из v"
        required: false
        default: ""
      runner:
        description: "'nl' -- свой бегунок на хосте (по умолчанию), 'cloud' -- запасной облачный"
        required: false
        default: "nl"

concurrency:
  group: pravka-grupp
  cancel-in-progress: false

# СВОЙ БЕГУНОК, А НЕ ОБЛАЧНЫЙ (слово владельца 02.10, п.6): правка файла групп
# -- служебный прогон, и чужая очередь облачных бегунков его держать не должна.
# Облачный путь остаётся запасным: вход runner=cloud.
env:
  FILE: /home/bot/data/sources_2026-09-25.json
  CODE_DIR: /home/bot/bloom_executor
  OUT: data/pravka_grupp.txt

jobs:
  pravka:
    runs-on: ${{ inputs.runner == 'cloud' && 'ubuntu-latest' || fromJSON('["self-hosted","nl-host"]') }}
    env:
      HOST: ${{ inputs.runner == 'cloud' && '45.59.170.76' || '127.0.0.1' }}
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/nifty-sagan-r0polg

      - name: "Самопроверка скрипта ДО любой правки (диф №6 и родня)"
        run: |
          set -e
          set -o pipefail
          python3 -m py_compile deploy/checks/pravka_grupp.py
          # 14/14: перенос в группу, где addresses -- СПИСОК, не теряет её
          # прежние адреса (диф №6 Code-3), а неизвестная форма -- отказ, а не
          # затирание. Падает самопроверка -- хост не трогаем вовсе.
          python3 deploy/checks/pravka_grupp.py --self-test | tail -3

      - name: "SSH key"
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -e
          [ -n "$VPS_SSH_KEY" ] || { echo "СБОЙ: VPS_SSH_KEY не задан"; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -T 10 "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          echo "SSH_OPTS=-i $HOME/.ssh/vps_key -o ConnectTimeout=20 -o BatchMode=yes -o StrictHostKeyChecking=accept-new" >> "$GITHUB_ENV"

      - name: "Правка на хосте"
        env:
          POKAZAT: ${{ inputs.pokazat }}
          GRUPPA: ${{ inputs.gruppa }}
          POLE: ${{ inputs.pole }}
          ZNACHENIE: ${{ inputs.znachenie }}
          SOZDAT: ${{ inputs.sozdat }}
          POLITIKA: ${{ inputs.politika }}
          PERENESTI: ${{ inputs.perenesti }}
          V: ${{ inputs.v }}
          POMETKA: ${{ inputs.pometka }}
          OTKLYUCHIT: ${{ inputs.otklyuchit }}
          PLAN: ${{ inputs.plan }}
        run: |
          set -e
          set -o pipefail
          ssh $SSH_OPTS root@"$HOST" "cat > /tmp/pravka_grupp.py" < deploy/checks/pravka_grupp.py
          # НИ ОДНОГО ЗНАКА ИЗ ВХОДОВ В КОМАНДЕ, ИДУЩЕЙ root-ом НА ХОСТ.
          #
          # ЧТО БЫЛО СЛОМАНО (слово владельца 04.10 вечером, п.2). Здесь строка
          # ARGS собиралась из шести входов ВООБЩЕ без кавычек, а три значения
          # уезжали в одинарных кавычках на удалённой стороне:
          #     --znachenie '$ZNACHENIE' --politika '$POLITIKA' --pometka '$POMETKA'
          # Пробел в любом из первых шести или апостроф в любом из этих трёх --
          # и это уже чужая команда от root на ТОРГОВОМ хосте. Пометка по смыслу
          # поля свободный текст, то есть апостроф там вопрос времени.
          #
          # ЧЕМ ЗАКРЫТО. Правка собирается ПЛАНОМ -- тем же файлом, которым
          # прогон уже умеет применять список правок, -- и уезжает по stdin.
          # В команде остаются только неизменяемые литералы: --file, --plan и
          # при показе --pokazat. Новой ветки в модуле не завелось: одиночная
          # правка и план сходятся там в ОДИН И ТОТ ЖЕ список операций с теми же
          # именами полей (deploy/checks/pravka_grupp.py:415-425).
          #
          # ПЛАН СОБИРАЕТ python ИЗ ОКРУЖЕНИЯ, а не оболочка из подстановок:
          # os.environ не разбирается как код ни при каком значении.
          PLAN_FAJL=""
          if [ "$PLAN" = "yes" ]; then
            [ -f data/pravka_grupp_plan.json ] || { echo "SBOY: net data/pravka_grupp_plan.json"; exit 1; }
            python3 -c "import json,sys; d=json.load(open('data/pravka_grupp_plan.json')); assert d.get('pravki'), 'net spiska pravki'; print('pravok v plane:', len(d['pravki']))"
            PLAN_FAJL=data/pravka_grupp_plan.json
          else
            # СБОРЩИК -- ФАЙЛОМ ИЗ ДЕРЕВА, А НЕ heredoc'ом, И ПРИЧИНА НЕ В ТОМ,
            # ЧТО heredoc СЛОМАН. Я сперва написал это heredoc'ом, решил, что он
            # не работает из-за отступа тела, и проверил -- оказалось, работает:
            # YAML снимает общий отступ блочного скаляра, и бегунок получает
            # тело python и терминатор в нулевой колонке. Мой первый тест был
            # построен неверно (строки с отступом руками).
            # Файл оставлен по двум настоящим поводам: у него СВОЯ самопроверка
            # (11 проверок, среди них проход апострофа и точки с запятой как
            # данных), и в этом репозитории правило прежнее -- скрипт едет
            # файлом из дерева, а не телом внутри шага.
            python3 deploy/checks/pravka_grupp_plan_iz_okruzhenija.py --self-test | tail -1
            python3 deploy/checks/pravka_grupp_plan_iz_okruzhenija.py > /tmp/pravka_odna.json
            python3 -c "import json;d=json.load(open('/tmp/pravka_odna.json'));print('pravok sobrano:', len(d['pravki']))"
            PLAN_FAJL=/tmp/pravka_odna.json
          fi
          # ПУСТОЙ ПЛАН НА ХОСТ НЕ ЕДЕТ: модуль с --plan и пустым списком
          # отказывает кодом 10, а прежнее поведение при пустых входах -- это
          # сводка групп. Поэтому пустой план превращается в простой показ.
          PUSTO=$(python3 -c "import json;print(0 if json.load(open('$PLAN_FAJL'))['pravki'] else 1)")
          ssh $SSH_OPTS root@"$HOST" "cat > /tmp/pravka_plan.json" < "$PLAN_FAJL"
          echo "plan uehal fajlom; v komande root ni odnogo znaka iz vhodov"
          if [ "$POKAZAT" = "yes" ] || [ "$PUSTO" = "1" ]; then
            ssh -n $SSH_OPTS root@"$HOST" "
              set -e
              nice -n 5 python3 /tmp/pravka_grupp.py --file $FILE --pokazat
              rm -f /tmp/pravka_grupp.py /tmp/pravka_plan.json" | tee "$OUT"
          else
            ssh -n $SSH_OPTS root@"$HOST" "
              nice -n 5 python3 /tmp/pravka_grupp.py --file $FILE --plan /tmp/pravka_plan.json
              rc=\$?
              rm -f /tmp/pravka_grupp.py /tmp/pravka_plan.json
              chown bot:bot $FILE
              chmod 644 $FILE
              ls -l $FILE
              exit \$rc" | tee "$OUT"
          fi

      - name: "Ключей в отчёте быть не должно"
        if: always()
        run: python3 deploy/checks/bez_klyuchey_v_otchete.py "$OUT" || true

      - name: "Коммит отчёта"
        if: always()
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -f "$OUT" ] && git add "$OUT"
          git diff --cached --quiet && { echo "нечего коммитить"; exit 0; }
          git commit -m "Fayl grupp: pravka [automated]"
          for i in 1 2 3 4 5; do
            git push origin HEAD:claude/nifty-sagan-r0polg && exit 0
            git pull --rebase -X theirs origin claude/nifty-sagan-r0polg
            sleep 3
          done
          exit 1
