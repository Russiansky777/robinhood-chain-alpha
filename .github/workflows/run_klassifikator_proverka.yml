name: "Классификатор: источник -- ПОКУПАТЕЛЬ или только УПОМЯНУТ (только чтение)"

# ЗАЧЕМ. Вопрос владельца 02.10: по решениям детектора назвать числом, в
# скольких случаях источник ДЕЙСТВИТЕЛЬНО покупал, а в скольких он лишь
# упомянут в чужой сделке (посредник, раздача, маршрут через его счёт).
# Судить можно только по цепи: подписанты, плательщик, владелец счёта, на
# который пришли токены, и дельта лампортов самого источника.
#
# ТОЛЬКО ЧТЕНИЕ. Ни одной записи на хост, ни одного ордера, ни покупки, ни
# продажи: берутся сырые getTransaction по заранее выбранным подписям, и
# разбор идёт офлайн тем же модулем, у которого есть своя самопроверка.
#
# СЫРОЙ ДАМП НЕ КОММИТИТСЯ: 64 транзакции -- это миллионы байт, и в репо он
# не нужен. В дерево уходит только вердикт по подписям.
on:
  workflow_dispatch:
    inputs:
      istochniki:
        description: "файл карты {подпись: адрес источника}"
        required: false
        default: "data/klassifikator_istochniki.json"
      out:
        description: "куда положить вердикт"
        required: false
        default: "data/klassifikator_proverka.json"

concurrency:
  group: klassifikator-proverka
  cancel-in-progress: false

jobs:
  proverka:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/nifty-sagan-r0polg

      - name: "Самопроверка разбора ДО сети"
        run: |
          set -e
          python3 analysis/c2_klassifikator_proverka.py --self-test

      - name: "Сырые ответы узла по подписям"
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API }}
          # КАРТА ПОДПИСЕЙ -- ОКРУЖЕНИЕМ, А НЕ СКЛЕЙКОЙ В ТЕКСТ СКРИПТА:
          # подстановки GitHub внутри heredoc не читаются, и путь, вклеенный
          # в питоновский код, молча стал бы пустой строкой.
          IST: ${{ inputs.istochniki }}
        run: |
          set -e
          set -o pipefail
          pip install -q requests
          python3 - <<'PY'
          import json, os, subprocess, sys
          карта = json.load(open(os.environ["IST"], encoding="utf-8"))
          подписи = sorted(карта)
          print(f"подписей к разбору: {len(подписи)}", flush=True)
          # ПОРЦИЯМИ: один вызов на 16 подписей -- чтобы падение одной порции
          # не стоило всех остальных, и чтобы было видно, где именно встало.
          порции = [подписи[i:i + 16] for i in range(0, len(подписи), 16)]
          общий = {}
          for n, п in enumerate(порции, 1):
              арг = []
              for s in п:
                  арг += ["--sig", s]
              путь = f"/tmp/raw_{n}.json"
              r = subprocess.run([sys.executable, "analysis/bloom_tx_dump.py",
                                  *арг, "--out", путь])
              if r.returncode != 0:
                  print(f"порция {n}: сбой дампа, код {r.returncode}", flush=True)
                  continue
              часть = json.load(open(путь, encoding="utf-8"))
              общий.update(часть)
              есть = sum(1 for v in часть.values() if (v or {}).get("ok"))
              print(f"порция {n}/{len(порции)}: {есть}/{len(п)} достали", flush=True)
          json.dump(общий, open("/tmp/raw_all.json", "w", encoding="utf-8"),
                    ensure_ascii=False)
          достали = sum(1 for v in общий.values() if (v or {}).get("ok"))
          print(f"ИТОГО достали {достали} из {len(подписи)}", flush=True)
          PY
      - name: "Вердикт по подписям"
        run: |
          set -e
          python3 analysis/c2_klassifikator_proverka.py \
            --dump /tmp/raw_all.json \
            --istochniki "${{ inputs.istochniki }}" \
            --out "${{ inputs.out }}" | tee /tmp/verdikt.txt

      - name: "Коммит вердикта"
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${{ inputs.out }}"
          git diff --cached --quiet || git commit -m "Классификатор: вердикт по подписям [automated]"
          for i in 1 2 3 4; do
            git push origin HEAD:claude/nifty-sagan-r0polg && break || sleep $((2 ** i))
          done
