name: "Задача 3 -- полный бэктест погоды, один город (условие перед 14 городами)"

on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/sc1-pons-v2-launcher-efdbyt
    paths:
      - "data/p3_guard_cache/TASK3_WEATHER_BACKTEST_ONE_CITY_REQUEST"

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r analysis/requirements.txt
      - name: "Реальный бэктест: Kalshi KXHIGHNY vs NOAA GEFS ensemble, один город, 30 дней, инкрементальный чекпоинт"
        run: python -u analysis/task3_weather_backtest_one_city.py
      - name: Commit results
        if: always()
        run: |
          git rm -f --ignore-unmatch data/p3_guard_cache/TASK3_WEATHER_BACKTEST_ONE_CITY_REQUEST
          [ -e data/p3_guard_cache/task3_weather_backtest_one_city_result.json ] && git add data/p3_guard_cache/task3_weather_backtest_one_city_result.json
          git diff --cached --quiet && exit 0
          git commit -m "Задача 3: бэктест погоды, один город, результат/чекпоинт [automated]"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected, попытка $i/5 -- git pull --rebase и повтор"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep 3
          done
          echo "не удалось запушить после 5 попыток" >&2
          exit 1
