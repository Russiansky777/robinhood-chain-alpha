name: "Solana buyer_200 -- доля пойманных сигналов пилота"

on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/nifty-sagan-r0polg
    paths:
      - "data/p3_guard_cache/SOLANA_PILOT_SIGNAL_CAPTURE_RATE_REQUEST"

jobs:
  pilot_signal_capture_rate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests
      - name: "Доля пойманных сигналов пилота"
        env:
          ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
        run: python -u analysis/solana_pilot_signal_capture_rate.py
      - name: Commit results
        if: always()
        run: |
          git rm -f --ignore-unmatch data/p3_guard_cache/SOLANA_PILOT_SIGNAL_CAPTURE_RATE_REQUEST
          [ -e data/solana_pilot_signal_capture_rate.json ] && git add data/solana_pilot_signal_capture_rate.json
          git diff --cached --quiet && exit 0
          git commit -m "Solana buyer_200: доля пойманных сигналов пилота -- результат [automated]"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected, попытка $i/5 -- git pull --rebase и повтор"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep 3
          done
          echo "не удалось запушить после 5 попыток" >&2
          exit 1
