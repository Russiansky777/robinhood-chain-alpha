name: "NL-хост: служба зонда гонки потоков (ничего не торгует)"

# Зонд сравнивает два канала: Yellowstone gRPC и наш второй Helius WS.
# Он НЕ торгует: ни клиента Bloom, ни исполнителя в нём нет, и самопроверка
# сторожит это по исходнику. Подписку детектора он не трогает -- у него своё
# соединение и свой каталог состояния.
#
# Права. Каталог состояния создаётся СРАЗУ от пользователя службы (bot), а не
# от root: ровно на этом в ночь сгорел учёт кредитов -- каталог создал root, и
# служба не могла в него писать. Здесь это проверяется отдельным шагом.
on:
  workflow_dispatch:
    inputs:
      enable_service:
        description: "'yes' -- включить и перезапустить службу"
        required: false
        default: "no"
      boosters:
        description: "сколько разгонных адресов добавить (0 -- только источники)"
        required: false
        default: "3"
      tasks:
        description: "какие задачи DBot дают список источников"
        required: false
        default: "BATCH-5,BATCH-3"
      helius_daily_limit:
        description: "потолок кредитов Helius у зонда за сутки"
        required: false
        default: "300000"
      booster_rate:
        description: "сколько транзакций в минуту должны давать разгонные суммарно (5 -- это 300 пар в час)"
        required: false
        default: "5"
      booster_max_rate:
        description: "верх полосы скорости разгонных, транзакций в минуту (0 -- десять целей)"
        required: false
        default: "0"
      runner:
        description: "'nl' -- свой раннер на хосте (по умолчанию), 'cloud' -- запасной облачный путь по ssh"
        required: false
        default: "nl"
      window_s:
        description: "окно замера на полном ходу, секунд: в нём суточный прогноз не применяется"
        required: false
        default: "3600"
      window_cap:
        description: "потолок кредитов Helius НА ОКНО замера"
        required: false
        default: "30000"
      projection_limit:
        description: "после окна: потолок суточного прогноза, выше -- разгонные снимаются"
        required: false
        default: "200000"
      helius_ws:
        description: "'1' -- вторая подписка Helius в зонде, '0' -- выключить (детектор важнее замера)"
        required: false
        default: "1"

concurrency:
  group: feed-probe-deploy
  cancel-in-progress: false

env:
  HOST: 45.59.170.76
  SVC: grpc-feed-probe
  CODE_DIR: /home/bot/feed_probe
  STATE_DIR: /home/bot/grpc_feed_probe_data
  ENV_DIR: /etc/bloom-executor

jobs:
  deploy:
    # Свой раннер стоит НА хосте, поэтому ssh идёт по петле, а файлы не едут
    # через океан. Облачный путь остаётся запасным: вход runner=cloud.
    runs-on: ${{ inputs.runner == 'cloud' && 'ubuntu-latest' || fromJSON('["self-hosted","nl-host"]') }}
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/nifty-sagan-r0polg

      - name: "Начало круга и адрес хоста"
        run: |
          set -e
          echo "CIRCLE_START=$(date +%s)" >> "$GITHUB_ENV"
          # На своём раннере ходим по петле: это и есть выигрыш, ради которого
          # раннер ставился. На облачном -- по внешнему адресу, как раньше.
          if [ "${{ inputs.runner }}" = "cloud" ]; then
            echo "TARGET_HOST=$HOST" >> "$GITHUB_ENV"
            echo "где выполняюсь: облачный бегунок, хост $HOST"
          else
            echo "TARGET_HOST=127.0.0.1" >> "$GITHUB_ENV"
            echo "где выполняюсь: свой раннер на NL-хосте, ssh по петле"
          fi
          echo "пользователь раннера: $(id -un), машина: $(uname -n)"

      - name: "Питон для самопроверок"
        run: |
          set -e
          # На своём раннере системный python3 может быть без requests: его
          # тянет solana_rpc_client в проверке пределов. Ставим не в систему,
          # а во временное окружение прогона -- хосту ничего не меняем.
          if python3 -c "import requests" 2>/dev/null; then
            echo "PY=python3" >> "$GITHUB_ENV"
            echo "requests есть в системном python3"
          else
            python3 -m venv "$RUNNER_TEMP/selftest_venv"
            "$RUNNER_TEMP/selftest_venv/bin/pip" install -q requests
            echo "PY=$RUNNER_TEMP/selftest_venv/bin/python" >> "$GITHUB_ENV"
            echo "поставлено временное окружение с requests"
          fi

      - name: "Самопроверки ДО доставки"
        run: |
          set -e
          cd analysis
          "$PY" grpc_feed_probe.py --self-test
          # Правило владельца: зонд не обгоняет детектор по расходу Helius.
          "$PY" -c "import sys; sys.path.insert(0,'.'); from solana_rpc_client import DAILY_BUDGET as B; p=B.get('grpc_feed_probe'); d=B.get('bloom_detector'); import solana_rpc_client as R; assert p and p <= R.ОБЩИЙ_ПОТОЛОК_СУТКИ, 'предел зонда выше общего потолка'; print('предел зонда', p, 'кредитов в сутки, детектор', d, ', общий потолок', R.ОБЩИЙ_ПОТОЛОК_СУТКИ)"
          "$PY" check_shell_ascii.py --self-test
          "$PY" check_shell_ascii.py ../.github/workflows

      - name: "SSH key"
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -e
          [ -n "$VPS_SSH_KEY" ] || { echo "VPS_SSH_KEY не задан"; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          echo "SSH_OPTS=-i $HOME/.ssh/vps_key -o ConnectTimeout=15 -o BatchMode=yes -o StrictHostKeyChecking=accept-new" >> "$GITHUB_ENV"

      - name: "Каталоги от пользователя службы, не от root"
        run: |
          set -e
          ssh -n $SSH_OPTS root@$TARGET_HOST "
            set -e
            install -d -o bot -g bot -m 755 $CODE_DIR
            install -d -o bot -g bot -m 755 $CODE_DIR/proto
            install -d -o bot -g bot -m 755 $STATE_DIR
            sudo -u bot test -w $STATE_DIR || { echo 'СБОЙ: служба не пишет в каталог состояния'; exit 1; }
            echo 'каталоги готовы и доступны пользователю службы'"

      - name: "Свой env зонда (общий env служб НЕ трогается)"
        env:
          GRPC_FEED_URL: ${{ secrets.GRPC_FEED_URL }}
          GRPC_FEED_TOKEN: ${{ secrets.GRPC_FEED_TOKEN }}
          GRPC_FEED2_URL: ${{ secrets.GRPC_FEED2_URL }}
          GRPC_FEED2_TOKEN: ${{ secrets.GRPC_FEED2_TOKEN }}
          GRPC_FEED3_URL: ${{ secrets.GRPC_FEED3_URL }}
          GRPC_FEED4_URL: ${{ secrets.GRPC_FEED4_URL }}
          GRPC_FEED_AUTH_HEADER: ${{ secrets.GRPC_FEED_AUTH_HEADER }}
        run: |
          set -e
          # Общий /etc/bloom-executor/env НЕ переписывается ни одной строкой:
          # в ночь деплой сторожа уже затирал его, и повторять это нельзя.
          # У зонда свой файл, и unit читает оба: общий -- только за ключом
          # Helius, свой -- за адресом и токеном потока.
          HEADER="$GRPC_FEED_AUTH_HEADER"
          [ -n "$HEADER" ] || HEADER=x-token
          LIMIT="${{ inputs.helius_daily_limit }}"
          case "$LIMIT" in ''|*[!0-9]*) echo "СБОЙ: предел кредитов не число: $LIMIT"; exit 1;; esac
          echo "потолок кредитов Helius у зонда: $LIMIT в сутки"
          WINDOW_S="${{ inputs.window_s }}"
          WINDOW_CAP="${{ inputs.window_cap }}"
          PROJ_LIMIT="${{ inputs.projection_limit }}"
          for V in "$WINDOW_S" "$WINDOW_CAP" "$PROJ_LIMIT"; do
            case "$V" in ''|*[!0-9]*) echo "СБОЙ: окно/потолок не число: $V"; exit 1;; esac
          done
          HELIUS_WS="${{ inputs.helius_ws }}"
          case "$HELIUS_WS" in 0|1) ;; *) echo "СБОЙ: helius_ws должен быть 0 или 1: $HELIUS_WS"; exit 1;; esac
          echo "вторая подписка Helius в зонде: $HELIUS_WS"
          echo "окно замера: $WINDOW_S с, потолок окна: $WINDOW_CAP кредитов,"
          echo "после окна потолок прогноза: $PROJ_LIMIT в сутки"
          if [ -z "$GRPC_FEED_URL" ]; then
            echo "GRPC_FEED_URL не задан -- второй канал не включится"
          else
            echo "GRPC_FEED_URL: задан, длина ${#GRPC_FEED_URL}"
          fi
          if [ -z "$GRPC_FEED_TOKEN" ]; then
            echo "GRPC_FEED_TOKEN: НЕ задан"
          else
            echo "GRPC_FEED_TOKEN: задан, длина ${#GRPC_FEED_TOKEN}"
          fi
          echo "заголовок авторизации: $HEADER"
          for N in 3 4; do
            eval "V=\$GRPC_FEED${N}_URL"
            if [ -z "$V" ]; then
              echo "GRPC_FEED${N}_URL не задан -- канал RabbitStream не поднимется"
            else
              echo "GRPC_FEED${N}_URL: задан, длина ${#V}"
            fi
          done
          # Значения уезжают через stdin: в аргументах ssh они были бы видны
          # в ps на хосте.
          {
            printf 'GRPC_FEED_URL=%s\n' "$GRPC_FEED_URL"
            printf 'GRPC_FEED_TOKEN=%s\n' "$GRPC_FEED_TOKEN"
            printf 'GRPC_FEED_AUTH_HEADER=%s\n' "$HEADER"
            printf 'PROBE_HELIUS_DAILY_LIMIT=%s\n' "$LIMIT"
            printf 'PROBE_WINDOW_S=%s\n' "$WINDOW_S"
            printf 'PROBE_WINDOW_CAP=%s\n' "$WINDOW_CAP"
            printf 'PROBE_PROJECTION_LIMIT=%s\n' "$PROJ_LIMIT"
            printf 'PROBE_HELIUS_WS=%s\n' "$HELIUS_WS"
            [ -n "$GRPC_FEED2_URL" ] && printf 'GRPC_FEED2_URL=%s\n' "$GRPC_FEED2_URL"
            [ -n "$GRPC_FEED2_TOKEN" ] && printf 'GRPC_FEED2_TOKEN=%s\n' "$GRPC_FEED2_TOKEN"
            # RabbitStream: свой адрес, ОБЩИЙ токен GRPC_FEED_TOKEN -- так
            # написано в документации Shyft (data/docs/shyft_rabbitstream.md):
            # "drop-in replacement ... requiring only a change of endpoint URL".
            [ -n "$GRPC_FEED3_URL" ] && printf 'GRPC_FEED3_URL=%s\n' "$GRPC_FEED3_URL"
            [ -n "$GRPC_FEED4_URL" ] && printf 'GRPC_FEED4_URL=%s\n' "$GRPC_FEED4_URL"
            true
          } | ssh $SSH_OPTS root@$TARGET_HOST "
            set -e
            umask 077
            cat > $ENV_DIR/feed_probe_env
            chown root:bot $ENV_DIR/feed_probe_env
            chmod 640 $ENV_DIR/feed_probe_env
            echo 'env зонда записан, строк:' \$(wc -l < $ENV_DIR/feed_probe_env)
            echo 'общий env не тронут, его строк:' \$(wc -l < $ENV_DIR/env)"

      - name: "Доставка кода + сверка sha256"
        run: |
          set -e
          for F in grpc_feed_probe.py bloom_detector.py bloom_exec_state.py bloom_api.py solana_rpc_client.py; do
            scp $SSH_OPTS analysis/$F root@$TARGET_HOST:$CODE_DIR/$F
          done
          for F in geyser_pb2.py geyser_pb2_grpc.py solana_storage_pb2.py solana_storage_pb2_grpc.py; do
            scp $SSH_OPTS analysis/proto/$F root@$TARGET_HOST:$CODE_DIR/proto/$F
          done
          # СНИМОК ИСТОЧНИКОВ рядом с кодом. Без него запасной путь у зонда
          # был сломан по построению: путь по умолчанию считается от каталога
          # модуля, то есть на хосте указывал в /home/bot/data/final/... --
          # такого каталога там нет. Пока ключ DBot был на месте, это не
          # всплывало; 24.09 в 15:43 ключ перестал читаться, и зонд ушёл в
          # перезапуск по кругу (счётчик 168) вместо работы по снимку.
          scp $SSH_OPTS data/final/20260923T145755Z/konfig.json \
            root@$TARGET_HOST:$CODE_DIR/konfig.json
          ssh -n $SSH_OPTS root@$TARGET_HOST "chown -R bot:bot $CODE_DIR"
          for F in grpc_feed_probe.py; do
            HERE=$(sha256sum analysis/$F | awk '{print $1}')
            THERE=$(ssh -n $SSH_OPTS root@$TARGET_HOST "sha256sum $CODE_DIR/$F | awk '{print \$1}'")
            [ -n "$THERE" ] || { echo "СБОЙ: пустая сумма для $F"; exit 1; }
            [ "$HERE" = "$THERE" ] || { echo "СБОЙ: суммы не сошлись для $F"; exit 1; }
            echo "$F: сумма сошлась"
          done

      - name: "Снимок источников на хосте читается"
        run: |
          set -e
          # Проверяем ДО запуска службы: запасной путь обязан работать, иначе
          # при недоступном ключе DBot зонд уходит в перезапуск по кругу.
          # Питон ОДНОЙ строкой: многострочный внутри ssh-кавычек ломает
          # блок YAML -- его строки встают в нулевую колонку.
          ssh -n $SSH_OPTS root@$TARGET_HOST "sudo -u bot /home/bot/robinhood-chain-alpha/venv/bin/python -c \"import sys; sys.path.insert(0, '$CODE_DIR'); from pathlib import Path; import bloom_detector as BD; ист = BD.загрузить_источники(Path('$CODE_DIR/konfig.json'), tuple('${{ inputs.tasks }}'.split(','))); print('источников в снимке на хосте:', len(ист)); assert ист, 'снимок на хосте не дал ни одного источника'\""

      - name: "Зависимости зонда в venv хоста"
        run: |
          set -e
          ssh -n $SSH_OPTS root@$TARGET_HOST "
            /home/bot/robinhood-chain-alpha/venv/bin/pip install -q grpcio protobuf websockets 2>&1 | tail -2
            /home/bot/robinhood-chain-alpha/venv/bin/python -c 'import grpc, google.protobuf, websockets; print(\"зависимости на месте\")'"

      - name: "Самопроверка зонда НА ХОСТЕ"
        run: |
          set -e
          ssh -n $SSH_OPTS root@$TARGET_HOST "
            sudo -u bot /home/bot/robinhood-chain-alpha/venv/bin/python $CODE_DIR/grpc_feed_probe.py --self-test | tail -3"

      - name: "systemd-юнит"
        if: ${{ inputs.enable_service == 'yes' }}
        run: |
          set -e
          ssh -n $SSH_OPTS root@$TARGET_HOST "
            set -e
            {
              echo '[Unit]'
              echo 'Description=Зонд гонки потоков: gRPC против Helius WS (не торгует)'
              echo 'After=network-online.target'
              echo ''
              echo '[Service]'
              echo 'Type=simple'
              echo 'User=bot'
              echo 'Group=bot'
              # Без этого стандартный вывод питона буферизуется и в журнал
              # не попадает: 24.09 в журнале были только трассировки (stderr),
              # а строки самой службы -- нет, и разбираться пришлось вслепую.
              echo 'Environment=PYTHONUNBUFFERED=1'
              echo 'EnvironmentFile=$ENV_DIR/env'
              echo 'EnvironmentFile=-$ENV_DIR/feed_probe_env'
              echo 'WorkingDirectory=$CODE_DIR'
              echo 'ExecStart=/home/bot/robinhood-chain-alpha/venv/bin/python $CODE_DIR/grpc_feed_probe.py --state-dir $STATE_DIR --config $CODE_DIR/konfig.json --boosters ${{ inputs.boosters }} --booster-rate ${{ inputs.booster_rate }} --booster-max-rate ${{ inputs.booster_max_rate }} --tasks ${{ inputs.tasks }}'
              echo 'Restart=always'
              echo 'RestartSec=5'
              echo 'NoNewPrivileges=true'
              echo 'PrivateTmp=true'
              echo 'ProtectSystem=strict'
              echo 'ProtectHome=read-only'
              echo 'ReadWritePaths=$STATE_DIR'
              echo ''
              echo '[Install]'
              echo 'WantedBy=multi-user.target'
            } > /etc/systemd/system/$SVC.service
            systemctl daemon-reload
            echo 'юнит записан'"

      - name: "Запуск и проверка признака жизни"
        if: ${{ inputs.enable_service == 'yes' }}
        run: |
          set -e
          ssh -n $SSH_OPTS root@$TARGET_HOST "
            set -e
            # ИМЕННО restart, а не 'enable --now': у работающей службы
            # 'enable --now' ничего не перезапускает, и новый код на хосте
            # лежит, но не работает. Три деплоя подряд доставляли правки в
            # пустоту, а признак жизни оставался прежним.
            systemctl enable $SVC
            systemctl restart $SVC
            # Признак жизни должен быть НОВЕЕ момента перезапуска, иначе мы
            # читаем файл, оставшийся от прошлого запуска, и считаем его
            # доказательством.
            RESTART_TS=\$(date +%s)
            sleep 25
            systemctl is-active $SVC || { journalctl -u $SVC -n 40 --no-pager; exit 1; }
            test -s $STATE_DIR/heartbeat.json || { echo 'СБОЙ: признака жизни нет'; journalctl -u $SVC -n 40 --no-pager; exit 1; }
            HEARTBEAT_TS=\$(stat -c %Y $STATE_DIR/heartbeat.json)
            if [ \"\$HEARTBEAT_TS\" -lt \"\$RESTART_TS\" ]; then
              echo 'СБОЙ: признак жизни старше перезапуска -- служба его не обновила'
              journalctl -u $SVC -n 40 --no-pager
              exit 1
            fi
            cat $STATE_DIR/heartbeat.json" | tee data/feed_probe_deploy.txt

      - name: "Хвост журнала службы"
        if: ${{ inputs.enable_service == 'yes' }}
        run: |
          set -e
          # Журнал нужен НЕ только при падении: 24.09 служба была активна,
          # признак жизни обновлялся, а по всем трём каналам стоял ноль без
          # единого отказа. Ответ на "почему" лежит только в журнале, и
          # читать его перезапуском деплоя -- дорого. Пишем в тот же отчёт,
          # его же проверяет шаг на токены.
          {
            echo ""
            echo "--- журнал службы, последние 60 строк ---"
          } >> data/feed_probe_deploy.txt
          # --since, а не только -n: в последних 60 строках может не остаться
          # НИ ОДНОЙ строки нового запуска -- их вытеснят трассировки прошлого.
          ssh -n $SSH_OPTS root@$TARGET_HOST "journalctl -u $SVC --since '-3 min' --no-pager | tail -n 80" \
            2>&1 | tee -a data/feed_probe_deploy.txt

      - name: "Токенов в отчёте быть не должно"
        if: ${{ inputs.enable_service == 'yes' }}
        run: |
          set -e
          python3 - <<'PY'
          import re, sys
          путь = "data/feed_probe_deploy.txt"
          текст = open(путь, encoding="utf-8", errors="replace").read()
          плохо = [и for и, о in (("x-token", r"x-token[\"']?\s*[:=]\s*[A-Za-z0-9\-_.]{8,}"),
                                   ("api-key", r"api-key=[A-Za-z0-9\-_]{8,}"),
                                   ("GRPC_FEED_TOKEN", r"GRPC_FEED2?_TOKEN\s*=\s*\S{8,}"))
                    if re.search(о, текст, re.I)]
          if плохо:
              print("в отчёте видны значения: " + ", ".join(плохо)); sys.exit(1)
          print("токенов в отчёте нет")
          PY

      - name: "Круг в секундах"
        if: always()
        run: |
          set -e
          CIRCLE_END=$(date +%s)
          echo "круг деплоя: $((CIRCLE_END - CIRCLE_START)) с (раннер: ${{ inputs.runner }})"

      - name: "Коммит отчёта"
        if: ${{ inputs.enable_service == 'yes' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -f data/feed_probe_deploy.txt ] && git add data/feed_probe_deploy.txt
          git diff --cached --quiet && { echo "нечего коммитить"; exit 0; }
          git commit -m "Зонд потоков: деплой и признак жизни [automated]"
          for i in 1 2 3 4 5; do
            git push origin HEAD:claude/nifty-sagan-r0polg && exit 0
            git pull --rebase -X theirs origin claude/nifty-sagan-r0polg
            sleep 3
          done
          exit 1
