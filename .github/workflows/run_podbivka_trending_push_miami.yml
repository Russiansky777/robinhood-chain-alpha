name: "Трендинги Code-2: суточный пуш снимков с lab-miami в ветку и уборка старья (без секрета на хосте)"

# ЗАЧЕМ ЭТОТ ПРОГОН ВООБЩЕ ЕСТЬ. Установщик регистратора
# (run_podbivka_trending_miami_ustanovka.yml) ставит на lab-miami три таймера, и
# третий -- podbivka-trending-push.timer, OnCalendar=*-*-* 02:17:00 UTC -- он тут
# же ВЫКЛЮЧАЕТ (строка 319: systemctl disable podbivka-trending-push.timer).
# Причина названа в самом установщике: чтобы таймер пушил сам, на машину надо
# положить токен записи в репозиторий, а слово владельца -- "Ключи и секреты --
# никогда". Этот прогон делает ту же работу в тот же час (02:17Z), но токен ему
# выдаёт сам GitHub на время прогона: на диск машины не кладётся ничего.
#
# ЧТО ДЕЛАЕТ. Снимки регистратора (/opt/robinhood-chain-alpha/data/trending,
# по файлу на источник в сутки: data/trending/<источник>/<ДАТА>.jsonl.gz)
# кладёт в ветку claude/podbivka, ДОКАЗЫВАЕТ, что они там, и только после этого
# убирает с машины то, что старше двух суток.
#
# ИДЁТ НА САМОЙ lab-miami: снимки лежат на её диске, в облачный бегунок их не
# дотащить. Торгового хоста не касается вовсе -- ни его адреса, ни входа на него
# здесь нет.
#
# ЧЕМ ОТЛИЧАЕТСЯ ОТ run_podbivka_trending_svodka_miami.yml. Тот прогон (02:19Z)
# снимает сводку и тоже кладёт снимки в ветку. Здесь --delete НЕТ НИ В КАКОМ
# ВИДЕ, и это не вкус: уборка на машине и ЗЕРКАЛЯЩИЙ перенос -- несовместимая
# пара. Что убрано с машины, --delete убрал бы и из ветки, то есть ровно тот
# архив, ради которого уборка и затевалась. Из сводки --delete-after по этой же
# причине убран коммитом 20edfc10 ("svodka bolshe ne zerkalit"); вернётся он
# туда -- и архив старше двух суток начнёт пропадать на следующем же проходе.
on:
  schedule:
    # 02:17Z -- час, выбранный владельцем и уже зашитый в выключенный таймер
    # podbivka-trending-push.timer. Расписание GitHub регистрирует ТОЛЬКО с
    # ветки по умолчанию (claude/robinhood-copytrading-hypothesis-awjj0g,
    # замерено через API: default_branch репозитория). Этому файлу место там.
    - cron: "17 2 * * *"
  # Руками -- чтобы проверить прогон, не дожидаясь ночи.
  workflow_dispatch:
    inputs:
      koren:
        description: "клон регистратора на lab-miami"
        required: false
        default: "/opt/robinhood-chain-alpha"
      udaljat:
        description: "'no' -- только пуш, ничего с машины не убирать"
        required: false
        default: "yes"

concurrency:
  # Два таких прогона на одной машине мешали бы друг другу в одном клоне.
  group: podbivka-trending-push-miami
  cancel-in-progress: false

env:
  KOREN_PODBIVKI: "/opt/robinhood-chain-alpha"
  VETKA_SNIMKOV: "claude/podbivka"
  UDALJAT: "yes"
  # ЧТО ИМЕННО ЕДЕТ В ВЕТКУ. Только суточная таблица первых появлений.
  # СЫРОЕ В GIT НЕ ПУШИТСЯ ВОВСЕ, и это не осторожность, а предел GitHub:
  # файл крупнее 100 МБ отвергается наотрез. Замерено на машине 16.10 --
  # сырой jupiter за полные сутки 12.10 весит 469 МБ, то есть пуш сырого был
  # обречён независимо от места на диске. Первый пуш 12.10 прошёл только
  # потому, что в файлах было два часа сбора (55 МБ), а не сутки (598 МБ).
  PUT_PERVYH: "data/trending/pervye"
  # 60 суток = 86400 минут. Словами владельца -- "уборка сырого не раньше
  # 60 суток". Регистратор начал 12.10, значит первое удаление возможно
  # не раньше 11.12 -- до тех пор шаг уборки честно печатает ноль.
  STARSHE_SUTOK_SYROE: "60"

jobs:
  push_snimkov:
    runs-on: ${{ fromJSON('["self-hosted","lab-miami"]') }}
    timeout-minutes: 60
    permissions:
      # Единственное право прогона -- запись в репозиторий. Секрета с токеном
      # здесь нет и быть не должно: токен приносит actions/checkout.
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Ветка снимков названа буквой, а не переменной: checkout идёт ДО
          # первого тела run, и значение ему нужно уже готовым.
          ref: claude/podbivka
          fetch-depth: 1
          # РАЗРЕЖЁННЫЙ ЧЕКАУТ, И ЭТО ПОЧИНКА ЗАБИТОГО ДИСКА, А НЕ ОПРЯТНОСТЬ.
          # Замерено 16.10 на lab-miami: диск 145 ГБ занят на 100 %, суточный
          # пуш упал три ночи (13.10 "No space left on device", 14 и 15.10
          # бегунок уже терял связь с сервером). Рабочее дерево ветки
          # claude/podbivka весит 8.77 ГБ (6401 файл, из них data/podbivka
          # 8.2 ГБ), а прогону нужен ОДИН каталог data/trending на 55 МБ.
          # Хуже веса дерева было другое: fetch --depth=1 НОВОГО коммита тащит
          # все блобы заново, и в рабочем каталоге бегунка лежали ДВА
          # pack-файла по 7.10 ГБ -- по одному на каждый ночной fetch.
          #
          # ОДИН sparse-checkout ЛЕЧИТ И ТО, И ДРУГОЕ. По исходнику действия
          # (src/git-source-provider.ts): если filter не задан, но задан
          # sparseCheckout, то fetchOptions.filter становится 'blob:none'.
          # То есть выборка blobless включается САМА, и отдельный filter не
          # нужен -- а если его задать, он лишь перебьёт значение фильтра,
          # сама разрежённость всё равно применяется.
          #
          # cone-mode ВЫКЛЮЧЕН НАМЕРЕННО, и разница замерена: в cone-режиме
          # к выборке добавляются файлы ПРЯМО в data/ -- это ещё 184 МБ
          # (data/solana_entry_log_offsets_cache.json 64 МБ и подобные), итого
          # 239 МБ вместо 55 МБ. Правила проверены сухим прогоном
          # git sparse-checkout check-rules: по '/data/trending/' попадает
          # ровно 8 путей, ни одного вне каталога.
          #
          # ОСТАЛЬНЫЕ 6393 ФАЙЛА ВЕТКИ НЕ ТЕРЯЮТСЯ: записи вне выборки
          # остаются в индексе с пометкой SKIP_WORKTREE, а шаги ниже делают
          # git add и git commit ТОЛЬКО по пути data/trending, поэтому дерево
          # коммита сохраняет всё прочее нетронутым.
          # С 16.10 в выборке ТОЛЬКО таблица первых появлений: сырое в ветку
          # больше не едет, и тянуть его в рабочее дерево незачем.
          sparse-checkout: |
            /data/trending/pervye/
          sparse-checkout-cone-mode: false

      - name: "Параметры и кто мы на машине"
        env:
          VHOD_KOREN: ${{ inputs.koren }}
          VHOD_UDALJAT: ${{ inputs.udaljat }}
        run: |
          set -e
          set -o pipefail
          # Вход прогона сильнее значения по умолчанию. Значения берём через
          # env шага, а не подстановкой внутрь кавычек: подстановка со своей
          # кавычкой разорвала бы тело шага.
          KOREN="${VHOD_KOREN:-$KOREN_PODBIVKI}"
          KOREN="${KOREN%/}"
          UDAL="${VHOD_UDALJAT:-$UDALJAT}"
          echo "KOREN_PODBIVKI=$KOREN" >> "$GITHUB_ENV"
          echo "UDALJAT=$UDAL" >> "$GITHUB_ENV"
          echo "koren registratora: $KOREN"
          echo "ubirat staroe: $UDAL"
          echo "mashina: $(hostname), yader $(nproc)"
          # ПОД КЕМ МЫ -- НЕ ПРАЗДНЫЙ ВОПРОС. Служба бегунка поставлена как
          # './svc.sh install ghrunner' (run_lab_bootstrap_nl.yml), а клон
          # регистратора установщик делает 'chown -R podbivka:podbivka'. Если
          # бегунку не дано писать в каталоги снимков, уборка упрётся в
          # Permission denied -- и пусть это будет видно в журнале словами, а
          # не догадкой.
          echo "polzovatel progona: $(id -un), gruppy: $(id -Gn)"

      - name: "СЧЁТ ПЕРВЫХ ПОЯВЛЕНИЙ: --pervye скриптом Code-2 на самой машине"
        run: |
          set -e
          set -o pipefail
          KOREN="$KOREN_PODBIVKI"
          if [ ! -d "$KOREN/data/trending" ]; then
            echo "SBOJ: $KOREN/data/trending net -- registrator ne postavlen"
            echo "Postav ego progonom run_podbivka_trending_miami_ustanovka.yml"
            exit 1
          fi
          SKRIPT="$KOREN/analysis/podbivka_trending.py"
          test -f "$SKRIPT" || { echo "SBOJ: net $SKRIPT"; exit 1; }
          # ФЛАГ ПРОВЕРЯЕТСЯ, А НЕ ПРЕДПОЛАГАЕТСЯ. --pervye считает Code-2, и
          # на 16.10 его в ветке claude/podbivka ЕЩЁ НЕТ: в разборе доводов
          # стоят только --kazhdye, --istochnik, --pauza, --probno, --svodka.
          # Пока флага нет, прогон должен ОТКАЗАТЬ С НАЗВАННОЙ ПРИЧИНОЙ, а не
          # пушить пустоту и не делать вид, что всё прошло.
          if ! /usr/bin/python3 "$SKRIPT" --help 2>&1 | grep -q -- '--pervye'; then
            echo "OTKAZ: skript Code-2 poka ne znaet --pervye."
            echo "Razbor dovodov skripta:"
            /usr/bin/python3 "$SKRIPT" --help 2>&1 | grep -oE '\-\-[a-z-]+' | sort -u | tr '\n' ' '
            echo
            echo "Sutochnaja tablica pervyh pojavlenij -- rabota Code-2;"
            echo "do ejo pojavlenija pushit nechego, i SYROE v git ne idjot."
            exit 1
          fi
          # ПОД КЕМ СЧИТАЕМ. Прогон идёт под пользователем бегунка, а клон
          # отдан podbivka. sudo у бегунка в репозитории не настроен (проверено
          # grep-ом по sudoers и NOPASSWD -- пусто), поэтому считаем от себя:
          # каталоги снимков имеют группу бегунка и бит 2775, то есть писать
          # в data/trending бегунок может. Если не может -- пусть это будет
          # видно отказом с правами, а не пустой таблицей.
          echo "schitaju pod: $(id -un), gruppy: $(id -Gn)"
          mkdir -p "$KOREN/$PUT_PERVYH"
          ( cd "$KOREN" && /usr/bin/python3 analysis/podbivka_trending.py --pervye ) 2>&1 | tail -20
          echo "--- chto poluchilos na mashine ---"
          find "$KOREN/$PUT_PERVYH" -type f -printf '%10s %p\n' 2>/dev/null | sort -k2 | tail -10
          SCHJOT=$(find "$KOREN/$PUT_PERVYH" -type f -name '*.jsonl.gz' 2>/dev/null | wc -l)
          echo "tablic pervyh pojavlenij na mashine: $SCHJOT"
          if [ "$SCHJOT" -eq 0 ]; then
            echo "SBOJ: --pervye proshjol, no ni odnoj tablicy v $PUT_PERVYH net."
            exit 1
          fi

      - name: "Таблица первых появлений -- в рабочее дерево ветки (без --delete)"
        run: |
          set -e
          set -o pipefail
          KOREN="$KOREN_PODBIVKI"
          mkdir -p "$PUT_PERVYH"
          # ПЕРЕНОС ТОЛЬКО ДОБАВЛЯЮЩИЙ: ни --delete, ни --delete-after. На
          # машине работает уборка сырого, и зеркалящий перенос стёр бы из
          # ветки то же самое. Откат на cp -r -- приём шага пуша сводки,
          # прошедший с первой попытки на прогоне 38192956775.
          rsync -a "$KOREN/$PUT_PERVYH/" "$PUT_PERVYH/" \
            || cp -r "$KOREN/$PUT_PERVYH/." "$PUT_PERVYH/"
          echo "--- chto polozheno ---"
          echo "tablic na mashine:      $(find "$KOREN/$PUT_PERVYH" -type f | wc -l)"
          echo "tablic v dereve vetki:  $(find "$PUT_PERVYH" -type f | wc -l)"
          echo "mesto v dereve:         $(du -sh "$PUT_PERVYH" | cut -f1 || echo '?')"
          # ПРЕДЕЛ GITHUB ПРОВЕРЯЕТСЯ ДО ПУША, А НЕ ПОСЛЕ ОТКАЗА. Файл крупнее
          # 100 МБ сервер отвергает наотрез, и узнать об этом из отказа пуша
          # хуже, чем из своей же проверки с названным размером. Порог 95 МБ --
          # с запасом под предел.
          PREDEL=$((95 * 1024 * 1024))
          KRUPNYE=$(find "$PUT_PERVYH" -type f -size +$((PREDEL / 1024))k -printf '%s %p\n' 2>/dev/null || true)
          if [ -n "$KRUPNYE" ]; then
            echo "OTKAZ: est fajly krupnee 95 MB -- GitHub ih ne primet:"
            echo "$KRUPNYE" | awk '{printf "  %8.1f MB  %s\n", $1/1048576, $2}'
            echo "Tablica pervyh pojavlenij ne dolzhna byt takogo razmera:"
            echo "znachit libo --pervye polozhil tuda syroe, libo pomenjalsja format."
            exit 1
          fi
          echo "fajlov krupnee 95 MB net -- predel GitHub soblyudjon"

      - name: "Пуш в ветку claude/podbivka (токен от GitHub, не с диска)"
        run: |
          set -e
          set -o pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # КЛАДЁТСЯ ТОЛЬКО таблица первых появлений: сырое в git не идёт вовсе
          # (предел 100 МБ). Все git add и git commit -- строго по этому пути,
          # поэтому остальные 6393 файла ветки остаются нетронутыми.
          git add -- "$PUT_PERVYH"
          if git diff --cached --quiet -- "$PUT_PERVYH"; then
            echo "novyh tablic net: v vetke uzhe to zhe samoe"
            # Свой коммит всё равно называем: шагу доказательства нужно, что
            # сверять с вершиной ветки, а уборке -- право работать и в этом
            # случае (файлы в ветке лежат, просто положены не нами).
            echo "NASH_KOMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
            exit 0
          fi
          FAJLOV=$(git diff --cached --numstat -- "$PUT_PERVYH" | wc -l)
          echo "fajlov k pushu: $FAJLOV"
          # Ветку догоняем fetch+reset, а не rebase: клон мелкий (depth=1),
          # rebase в нём делать нечем. Тот же приём у run_podbivka2_miami.yml
          # и у шага пуша сводки.
          for POPYTKA in 1 2 3 4 5 6 7 8; do
            git fetch -q --depth=1 origin "$VETKA_SNIMKOV"
            git reset -q FETCH_HEAD
            git add -- "$PUT_PERVYH"
            if git diff --cached --quiet -- "$PUT_PERVYH"; then
              echo "uzhe v vetke (popytka $POPYTKA)"
              echo "NASH_KOMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
              exit 0
            fi
            git commit -q -m "Trending: pervye pojavlenija za sutki ($FAJLOV fajlov) [automated]" -- "$PUT_PERVYH"
            # git push БЕЗ КОНВЕЙЕРА, и это главное. 'git push | tail' отдаёт
            # код tail, то есть 0 даже на отказе, и отчёт о пуше врёт. Здесь
            # код возврата честный -- но и ему мы верим не на слово: ниже
            # идёт отдельный шаг доказательства.
            if git push -q origin HEAD:"$VETKA_SNIMKOV"; then
              echo "push gotov s popytki $POPYTKA"
              echo "NASH_KOMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "popytka $POPYTKA: push otklonjon, dogonjaju vetku"
            sleep 4
          done
          echo "SBOJ: push ne proshel posle 8 popytok"
          exit 1

      - name: "ДОКАЗАТЕЛЬСТВО пуша: наш коммит есть в ветке на сервере"
        run: |
          set -e
          set -o pipefail
          # ЗАЧЕМ ОТДЕЛЬНЫЙ ШАГ. Код возврата шага пуша -- не доказательство:
          # на 'set -e без pipefail' плюс 'git push | tail' мы уже получали
          # зелёный отчёт при непрошедшем пуше. Доказательство только одно:
          # спросить сервер и увидеть свой коммит в истории его ветки.
          test -n "$NASH_KOMMIT" \
            || { echo "SBOJ: shag pusha ne nazval svoego kommita"; exit 1; }
          # Глубина 50, а не 1: merge-base нужно пройти от вершины вниз до
          # нашего коммита, а в клоне depth=1 истории нет и предок не
          # доказывается даже когда он есть.
          git fetch -q --depth=50 origin "$VETKA_SNIMKOV"
          VERSHINA=$(git rev-parse FETCH_HEAD)
          echo "nash kommit:    $NASH_KOMMIT"
          echo "vershina vetki: $VERSHINA"
          DOKAZAN=net
          if [ "$NASH_KOMMIT" = "$VERSHINA" ]; then
            DOKAZAN=da
            echo "nash kommit I EST vershina vetki"
          elif git merge-base --is-ancestor "$NASH_KOMMIT" "$VERSHINA"; then
            DOKAZAN=da
            echo "nash kommit -- predok vershiny: poverh nas uzhe pushili"
          fi
          if [ "$DOKAZAN" != da ]; then
            echo "SBOJ: nashego kommita v vetke $VETKA_SNIMKOV net."
            echo "S MASHINY NE UDALENO NICHEGO -- tak i dolzhno byt."
            exit 1
          fi
          # HEAD ставим на ДОКАЗАННУЮ вершину: список файлов ветки уборка
          # возьмёт именно с неё, а не с местного коммита, который сервер мог
          # и не принять.
          git reset -q "$VERSHINA"
          echo "PUSH_DOKAZAN=da" >> "$GITHUB_ENV"

      - name: "Уборка: только старше 2 суток и только то, что уже лежит в ветке"
        # ДВА ЗАМКА НА ОДНОЙ ДВЕРИ. Первый -- порядок шагов: шаг доказательства
        # падает, и до уборки дело не доходит (if: always() здесь нет
        # намеренно). Второй -- этот признак: его ставит только доказательство.
        if: ${{ env.PUSH_DOKAZAN == 'da' && env.UDALJAT != 'no' }}
        run: |
          set -e
          set -o pipefail
          KOREN="$KOREN_PODBIVKI"
          SPISOK_STARYH="$RUNNER_TEMP/staroe.txt"
          # ЧЕЙ КАТАЛОГ И ЧТО НАМ В НЁМ МОЖНО -- в журнал до первого rm:
          # клон регистратора отдан пользователю podbivka, а прогон идёт под
          # бегунком. Если удалять нельзя, пусть это будет видно замером.
          ls -ld "$KOREN/data/trending" || true
          # || true НА КОНВЕЙЕРЕ С head, и порог НАЗВАН ЗАМЕРОМ, а не на глаз.
          # При pipefail find, получивший SIGPIPE от закрывшегося head, валит
          # весь конвейер. Но head закрывает трубу НЕ на 20-й строке: пока
          # вывод find влезает в буфер трубы, find успевает закончиться сам.
          # Прогнано на настоящих каталогах: 20 -> код 0, 25 -> 0, 60 -> 0,
          # 100 -> 141. Сейчас источников 8, но || true стоит всё равно:
          # порог зависит и от длины путей, а не только от их числа.
          find "$KOREN/data/trending" -mindepth 1 -maxdepth 1 -type d \
            -printf '%M %u:%g %p\n' | head -20 || true
          #
          # СВЕРКИ СО СПИСКОМ ВЕТКИ ЗДЕСЬ БОЛЬШЕ НЕТ, И ЭТО НАДО НАЗВАТЬ, А НЕ
          # ЗАМОЛЧАТЬ. Прежняя уборка удаляла только то, что УЖЕ лежит в ветке:
          # сырое туда пушилось, и список ветки был честной страховкой. С 16.10
          # сырое в git не идёт вовсе (предел 100 МБ), значит такой страховки
          # больше не существует: ни один сырой файл в ветке не найдётся, и
          # сверка запретила бы удалять вообще всё. Поэтому замок теперь
          # ВРЕМЕННОЙ, и он один -- возраст 60 суток. Это слово владельца
          # ("уборка сырого -- не раньше 60 суток"), и оно значит, что удаляется
          # то, чего больше нигде нет. Поэтому ограничений на удаление три,
          # и все проверяются:
          #   1. только внутри $KOREN/data/trending;
          #   2. только файлы вида <источник>/<дата>.jsonl.gz на ОДНОМ уровне
          #      вложенности -- таблица первых появлений лежит в pervye/ и под
          #      образец не попадает, но для верности она исключена отдельно;
          #   3. только старше 60 суток по mtime.
          STARSHE_MINUT=$((STARSHE_SUTOK_SYROE * 1440))
          echo "porog uborki syrogo: $STARSHE_SUTOK_SYROE sutok = $STARSHE_MINUT minut"
          # -mmin, А НЕ -mtime: '-mtime +60' у find значит "старше 61 суток"
          # (целые сутки, дробь отбрасывается) -- не то, что просил владелец.
          find "$KOREN/data/trending" -mindepth 2 -maxdepth 2 -type f \
            -name '*.jsonl.gz' -not -path "$KOREN/$PUT_PERVYH/*" \
            -mmin "+$STARSHE_MINUT" > "$SPISOK_STARYH" || true
          echo "kandidatov starshe $STARSHE_SUTOK_SYROE sutok: $(wc -l < "$SPISOK_STARYH")"
          UDALENO=0
          PROPUSHCHENO=0
          NE_VYSHLO=0
          OSVOBOZHDENO=0
          # Читаем из ФАЙЛА, а не из конвейера: 'find | while' увёл бы счётчики
          # в подоболочку, и все числа ниже оказались бы нулями.
          while IFS= read -r PUT; do
            [ -n "$PUT" ] || continue
            OTN="${PUT#"$KOREN"/}"
            # ПОСЛЕДНЯЯ ПРОВЕРКА ПЕРЕД rm -- НА САМОМ ПУТИ. Если find когда-то
            # расширят или образец изменят, этот замок всё равно не пустит
            # удалять таблицу первых появлений и что-либо вне каталога сырого.
            case "$OTN" in
              "$PUT_PERVYH"/*)
                PROPUSHCHENO=$((PROPUSHCHENO + 1))
                echo "NE UDALJAJU $OTN -- eto tablica pervyh pojavlenij, ne syroe"
                continue ;;
              data/trending/*/*.jsonl.gz) : ;;
              *)
                PROPUSHCHENO=$((PROPUSHCHENO + 1))
                echo "NE UDALJAJU $OTN -- put ne pohozh na syroj snimok"
                continue ;;
            esac
            RAZMER=$(stat -c %s -- "$PUT" || echo 0)
            if rm -f -- "$PUT"; then
              UDALENO=$((UDALENO + 1))
              OSVOBOZHDENO=$((OSVOBOZHDENO + RAZMER))
              echo "udaljon $OTN ($RAZMER bajt)"
            else
              NE_VYSHLO=$((NE_VYSHLO + 1))
              echo "NE VYSHLO udalit $OTN"
            fi
          done < "$SPISOK_STARYH"
          OSTALOS=$(find "$KOREN/data/trending" -type f | wc -l)
          MESTO=$(du -sh "$KOREN/data/trending" | cut -f1 || echo "?")
          echo "--- chisla uborki ---"
          echo "udaleno fajlov:                $UDALENO"
          echo "propushcheno (ne syroe):       $PROPUSHCHENO"
          echo "ne vyshlo udalit:              $NE_VYSHLO"
          echo "ostalos fajlov na mashine:     $OSTALOS"
          echo "osvobozhdeno bajt:             $OSVOBOZHDENO"
          echo "mesto pod snimkami teper:      $MESTO"
          if [ "$NE_VYSHLO" != 0 ]; then
            echo "SBOJ: $NE_VYSHLO fajlov udalit ne poluchilos."
            echo "Dannye cely, no mesto na mashine ne osvobodilos."
            echo "Pochti navernjaka prava: klon otdan polzovatelju podbivka,"
            echo "a progon idjot pod $(id -un). Smotri vyvod ls -ld vyshe."
            exit 1
          fi
          echo "uborka proshla"

      - name: "Уборка пропущена -- сказать это словами, а не промолчать"
        if: ${{ env.PUSH_DOKAZAN == 'da' && env.UDALJAT == 'no' }}
        run: |
          set -e
          set -o pipefail
          echo "uborka ne delalas: vhod udaljat=no"
          echo "na mashine fajlov: $(find "$KOREN_PODBIVKI/data/trending" -type f | wc -l)"
