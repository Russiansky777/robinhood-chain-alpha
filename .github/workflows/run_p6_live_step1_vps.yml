name: "P6 LIVE Step 1 (с VPS Нидерланды) -- Across мост + своп + mint + шорт BTC на Lighter"

# Владелец, Гейт 2, 2026-09-04: "Да, при одном условии: сбор готов до
# входа... Вход, порядок из dry-run: Across USDG -> USDC на Base ->
# своп половины в cbBTC -> mint +-10% -> после подтверждения mint --
# шорт BTC $73 на Lighter, плечо 2.0x уже стоит." Выполняется ПО SSH НА
# САМОМ VPS (не на GH Actions runner'е) -- та же причина, что
# run_p5_live_step1_vps.yml (подпись Lighter-транзакций из юрисдикции
# GH Actions отклоняется; здесь же удобно держать ВСЮ
# последовательность в одном процессе).
on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/sc1-pons-v2-launcher-efdbyt
    paths:
      - "data/p3_guard_cache/P6_LIVE_STEP1_VPS_DRYRUN_REQUEST"
      - "data/p3_guard_cache/P6_LIVE_STEP1_VPS_CONFIRM_REQUEST"

jobs:
  step1:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: SSH key + known_hosts
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -e
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -T 10 45.59.170.76 >> ~/.ssh/known_hosts 2>/dev/null
          echo "SSH_OPTS=-i $HOME/.ssh/vps_key -o ConnectTimeout=15 -o BatchMode=yes -o StrictHostKeyChecking=accept-new" >> "$GITHUB_ENV"

      - name: Обновить репозиторий на VPS
        run: |
          ssh $SSH_OPTS root@45.59.170.76 '
            set -e
            sudo -u bot git -C /home/bot/robinhood-chain-alpha fetch origin claude/sc1-pons-v2-launcher-efdbyt
            sudo -u bot git -C /home/bot/robinhood-chain-alpha reset --hard origin/claude/sc1-pons-v2-launcher-efdbyt
            sudo -u bot git -C /home/bot/robinhood-chain-alpha log -1 --oneline
            sudo -u bot /home/bot/robinhood-chain-alpha/venv/bin/pip install -q -r /home/bot/robinhood-chain-alpha/analysis/requirements.txt
          '

      - name: Определить режим (dry-run по умолчанию, real только если есть CONFIRM-маркер)
        id: mode
        run: |
          if [ -e data/p3_guard_cache/P6_LIVE_STEP1_VPS_CONFIRM_REQUEST ]; then
            echo "flag=--confirm-mainnet" >> "$GITHUB_OUTPUT"
            echo "РЕЖИМ: РЕАЛЬНАЯ ОТПРАВКА"
          else
            echo "flag=" >> "$GITHUB_OUTPUT"
            echo "РЕЖИМ: DRY-RUN"
          fi

      - name: "P6 Step 1 на VPS: мост+своп+mint+хедж"
        run: |
          ssh $SSH_OPTS root@45.59.170.76 "
            cd /home/bot/robinhood-chain-alpha
            sudo -u bot bash -c 'set -a; source /etc/bot/env; set +a; ./venv/bin/python analysis/p6_live_step1.py ${{ steps.mode.outputs.flag }}'
          "

      - name: Забрать результат с VPS
        if: always()
        run: |
          # НАЙДЕНО (реальный прогон, dry-run): [ -s file ] && cp ... как
          # ПОСЛЕДНЯЯ команда скрипта -- классическая ловушка `set -e`:
          # если тест ложный (файла нет -- ожидаемо в dry-run, position_state.json
          # пишется только в REAL-режиме), exit-код ВСЕГО шага = exit-код теста
          # (1), хотя реально всё прошло штатно. mkdir/копирования вынесены
          # ПЕРЕД потенциально отсутствующим файлом, каждая строка -- с || true.
          mkdir -p data/p3_guard_cache
          ssh $SSH_OPTS root@45.59.170.76 'ls -la /home/bot/robinhood-chain-alpha/data/p3_guard_cache/p6_live_step1_result.json' || true
          ssh $SSH_OPTS root@45.59.170.76 'cat /home/bot/robinhood-chain-alpha/data/p3_guard_cache/p6_live_step1_result.json' > /tmp/p6_step1_result.json || true
          echo "--- диагностика /tmp/p6_step1_result.json ---"; ls -la /tmp/p6_step1_result.json || true; wc -c /tmp/p6_step1_result.json || true
          [ -s /tmp/p6_step1_result.json ] && { cp /tmp/p6_step1_result.json data/p3_guard_cache/p6_live_step1_result.json; echo "скопировано"; } || echo "ПУСТО/ОТСУТСТВУЕТ -- не копирую"
          ssh $SSH_OPTS root@45.59.170.76 'cat /home/bot/robinhood-chain-alpha/data/p6_live_position_state.json' > /tmp/p6_live_position_state.json || true
          [ -s /tmp/p6_live_position_state.json ] && cp /tmp/p6_live_position_state.json data/p6_live_position_state.json || true
          echo "--- содержимое data/p3_guard_cache после копирования ---"; ls -la data/p3_guard_cache/ | grep p6 || true
          exit 0

      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm -f --ignore-unmatch data/p3_guard_cache/P6_LIVE_STEP1_VPS_CONFIRM_REQUEST data/p3_guard_cache/P6_LIVE_STEP1_VPS_DRYRUN_REQUEST
          # НАЙДЕНО (реальный прогон, воспроизведено локально): `git add
          # fileA fileB` АТОМАРНО падает целиком, если fileB не существует
          # (dry-run не пишет p6_live_position_state.json) -- fileA НЕ
          # СТЕЙДЖИТСЯ ВООБЩЕ, даже если реально существует. `2>/dev/null
          # || true` глушил ошибку, но результат.json молча пропадал из
          # коммита на двух прошлых прогонах.Фикс: РАЗДЕЛЬНЫЕ git add.
          [ -e data/p3_guard_cache/p6_live_step1_result.json ] && git add data/p3_guard_cache/p6_live_step1_result.json || true
          [ -e data/p6_live_position_state.json ] && git add data/p6_live_position_state.json || true
          git diff --cached --quiet && exit 0
          git commit -m "P6 LIVE Step1 (VPS-NL): результат (mode=${{ steps.mode.outputs.flag }}) [automated]"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected, попытка $i/5 -- git pull --rebase и повтор"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep 3
          done
          echo "не удалось запушить после 5 попыток" >&2
          exit 1
