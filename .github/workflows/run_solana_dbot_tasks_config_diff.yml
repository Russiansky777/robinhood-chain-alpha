name: "Solana buyer_200 -- сравнить конфиг пилотной и новой copy-trade задачи DBot"

# Только чтение -- DBot GET-запросы. Не трогает основной прогон 300 покупок.

on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/nifty-sagan-r0polg
    paths:
      - "data/p3_guard_cache/SOLANA_DBOT_TASKS_CONFIG_DIFF_REQUEST"

jobs:
  solana_dbot_tasks_config_diff:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests
      - name: "Сравнить конфиг задач DBot"
        env:
          DBOT_API_KEY: ${{ secrets.DBOT_API_KEY }}
        run: python -u analysis/solana_dbot_tasks_config_diff.py
      - name: Commit results
        if: always()
        run: |
          git rm -f --ignore-unmatch data/p3_guard_cache/SOLANA_DBOT_TASKS_CONFIG_DIFF_REQUEST
          [ -e data/dbot_tasks_config_raw.json ] && git add data/dbot_tasks_config_raw.json
          [ -e data/dbot_tasks_config_diff.json ] && git add data/dbot_tasks_config_diff.json
          git diff --cached --quiet && exit 0
          git commit -m "Solana buyer_200: конфиг copy-trade задач DBot -- сырые данные + диф [automated]"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected, попытка $i/5 -- git pull --rebase и повтор"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep 3
          done
          echo "не удалось запушить после 5 попыток" >&2
          exit 1
