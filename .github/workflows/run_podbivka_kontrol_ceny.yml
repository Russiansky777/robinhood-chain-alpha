name: "Подбивка п.1: контроль цены -- симулятор против факта по цепи (только чтение)"

# ЗАЧЕМ (задание 2, пункт 1). Всем числам подбивки можно верить только если
# симулятор на НАШИХ же сделках воспроизводит факт по цепи. Поэтому первым
# делом: 64 сделки полосы и все сделки площадки с 24.09 -- симулятор по
# фактическому слоту входа и фактическому размеру против факта по цепи.
# Медиана расхождения больше 3 п.п. -- дальше не идём, ищем причину.
#
# Журнал позиций на хосте в память НЕ читается: потоком, только нужные поля,
# и выборка уходит на облачный бегунок, где и считается. Торговый путь не
# трогается вовсе: ни подписи, ни отправки, ключей кошельков в прогоне нет.
on:
  workflow_dispatch:
    inputs:
      since_utc:
        description: "с какого времени брать наши сделки"
        required: false
        default: "2026-09-24T00:00:00Z"
      limit:
        description: "сколько сделок сверить (0 -- все)"
        required: false
        default: "0"

concurrency:
  group: podbivka-kontrol-ceny
  cancel-in-progress: false

env:
  HOST: 45.59.170.76
  STATE_DIR: /home/bot/bloom_executor_live_data

jobs:
  kontrol:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/nifty-sagan-r0polg

      - name: "Питон с requests и solders"
        run: |
          set -e
          python3 -m venv "$RUNNER_TEMP/pod_venv"
          "$RUNNER_TEMP/pod_venv/bin/pip" install -q requests solders
          echo "PY=$RUNNER_TEMP/pod_venv/bin/python" >> "$GITHUB_ENV"

      - name: "SSH key"
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -e
          [ -n "$VPS_SSH_KEY" ] || { echo "СБОЙ: VPS_SSH_KEY не задан"; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -T 10 "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          echo "SSH_OPTS=-i $HOME/.ssh/vps_key -o ConnectTimeout=20 -o BatchMode=yes -o StrictHostKeyChecking=accept-new" >> "$GITHUB_ENV"

      - name: "Наши сделки из журнала потоком (nice, только чтение)"
        run: |
          set -e
          set -o pipefail
          ssh $SSH_OPTS root@"$HOST" "cat > /tmp/nashi_sdelki_iz_zhurnala.py" < deploy/checks/nashi_sdelki_iz_zhurnala.py
          ssh -n $SSH_OPTS root@"$HOST" "
            nice -n 15 python3 /tmp/nashi_sdelki_iz_zhurnala.py \
              --state-dir '$STATE_DIR' --since-utc '${{ inputs.since_utc }}' \
              --out /tmp/nashi_sdelki.json
            rm -f /tmp/nashi_sdelki_iz_zhurnala.py"
          ssh -n $SSH_OPTS root@"$HOST" "cat /tmp/nashi_sdelki.json" > /tmp/nashi_sdelki.json
          wc -c /tmp/nashi_sdelki.json

      - name: "Контроль цены: симулятор против факта"
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API }}
        run: |
          set -e
          [ -n "$HELIUS_API_KEY" ] || { echo "СБОЙ: HELIUS_API не задан"; exit 1; }
          $PY analysis/podbivka.py --sdelki /tmp/nashi_sdelki.json \
            --limit "${{ inputs.limit }}" \
            --out data/podbivka/kontrol_ceny.json

      - name: "Коммит"
        if: always()
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -f data/podbivka/kontrol_ceny.json ] && git add data/podbivka/kontrol_ceny.json
          git diff --cached --quiet && { echo "нечего коммитить"; exit 0; }
          git commit -m "Podbivka p.1: kontrol ceny [automated]"
          for i in 1 2 3 4 5; do
            git push origin HEAD:claude/nifty-sagan-r0polg && exit 0
            git pull --rebase -X theirs origin claude/nifty-sagan-r0polg
            sleep 3
          done
          exit 1
