name: "P6 LIVE -- реальное закрытие (с VPS Нидерланды) -- закрыть шорт на Lighter -> decreaseLiquidity+collect"

# Владелец, 2026-09-05: "Закрыть P6. Да. Порядок: закрыть BTC-шорт на
# Lighter (reduce_only) -> decreaseLiquidity + collect на 76445294 ->
# финальный PnL по ногам в RESULTS.md с tx-хэшами." Выполняется ПО SSH
# НА САМОМ VPS -- та же причина, что вход (подпись Lighter-транзакций
# из юрисдикции GH Actions отклоняется).
on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/sc1-pons-v2-launcher-efdbyt
    paths:
      - "data/p3_guard_cache/P6_LIVE_CLOSE_VPS_CONFIRM_REQUEST"

jobs:
  close:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: SSH key + known_hosts
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -e
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -T 10 45.59.170.76 >> ~/.ssh/known_hosts 2>/dev/null
          echo "SSH_OPTS=-i $HOME/.ssh/vps_key -o ConnectTimeout=15 -o BatchMode=yes -o StrictHostKeyChecking=accept-new" >> "$GITHUB_ENV"

      - name: Обновить репозиторий на VPS
        run: |
          ssh $SSH_OPTS root@45.59.170.76 '
            set -e
            sudo -u bot git -C /home/bot/robinhood-chain-alpha fetch origin claude/sc1-pons-v2-launcher-efdbyt
            sudo -u bot git -C /home/bot/robinhood-chain-alpha reset --hard origin/claude/sc1-pons-v2-launcher-efdbyt
            sudo -u bot git -C /home/bot/robinhood-chain-alpha log -1 --oneline
            sudo -u bot /home/bot/robinhood-chain-alpha/venv/bin/pip install -q -r /home/bot/robinhood-chain-alpha/analysis/requirements.txt
          '

      - name: "P6 реальное закрытие на VPS: хедж -> LP"
        run: |
          ssh $SSH_OPTS root@45.59.170.76 "
            cd /home/bot/robinhood-chain-alpha
            sudo -u bot bash -c 'set -a; source /etc/bot/env; set +a; ./venv/bin/python analysis/p6_live_close.py'
          "

      - name: Забрать результат с VPS
        if: always()
        run: |
          mkdir -p data/p3_guard_cache
          ssh $SSH_OPTS root@45.59.170.76 'cat /home/bot/robinhood-chain-alpha/data/p3_guard_cache/p6_live_close_result.json' > /tmp/p6_live_close_result.json || true
          echo "--- диагностика /tmp/p6_live_close_result.json ---"; ls -la /tmp/p6_live_close_result.json || true; wc -c /tmp/p6_live_close_result.json || true
          [ -s /tmp/p6_live_close_result.json ] && { cp /tmp/p6_live_close_result.json data/p3_guard_cache/p6_live_close_result.json; echo "скопировано"; } || echo "ПУСТО/ОТСУТСТВУЕТ -- не копирую"
          exit 0

      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm -f --ignore-unmatch data/p3_guard_cache/P6_LIVE_CLOSE_VPS_CONFIRM_REQUEST
          [ -e data/p3_guard_cache/p6_live_close_result.json ] && git add data/p3_guard_cache/p6_live_close_result.json || true
          git diff --cached --quiet && exit 0
          git commit -m "P6 LIVE Close (VPS-NL): результат [automated]"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected, попытка $i/5 -- git pull --rebase и повтор"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep 3
          done
          echo "не удалось запушить после 5 попыток" >&2
          exit 1
