name: "Ретро-сигнал: симуляция входа в трёх скоростях и выхода через ~35с"

# Владелец: только чтение цепочки, ни одной сделки. Guard
# (dbot-sold-guard) и зонд (dbot-detect-probe) не трогаются -- этот
# workflow вообще не ходит на VPS.
#
# КАЛИБРОВКА -- ГЕЙТ. Сначала mode=calibrate по нашим живым сделкам из
# data/solana_entry_log.json: sim_E2 против настоящего signal_pct.
# Порог: Спирмен >= 0.6 И совпадение знака >= 70%. Не прошло -- job
# падает, основной прогон не делается.
#
# Ключ: владелец просит HELIUS_API_KEY, в секретах заведён HELIUS_API --
# отдаём оба имени из одного секрета.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "calibrate (живые сделки, гейт) или full (кандидаты + источники)"
        required: false
        default: "calibrate"
      workers:
        description: "параллельных воркеров (владелец просил 3-4)"
        required: false
        default: "4"
      time_budget_s:
        description: "мягкий бюджет времени, секунд"
        required: false
        default: "18000"
      min_interval_s:
        description: "минимальный интервал между RPC-вызовами, секунд (темп подобран замером)"
        required: false
        default: "0.12"
      limit:
        description: "только N симуляций (отладка, 0 = все)"
        required: false
        default: "0"
      no_cache:
        description: "'yes' -- пересчитать всё заново"
        required: false
        default: ""
      min_buys:
        description: "порог числа покупок для КАНДИДАТА (3 обычно; 1 -- добор дыры)"
        required: false
        default: "3"
      extra_crowd:
        description: "через запятую: дополнительные сканы толпы, напр. data/solana_crowd_scan_7d.json"
        required: false
        default: ""
      checkpoint_s:
        description: "как часто сохранять промежуточный результат, секунд (900 = ~15 минут)"
        required: false
        default: "900"
      checkpoint_push:
        description: "'no' -- не выгружать чекпойнты в git (по умолчанию выгружаются: иначе при гибели раннера возобновлять не из чего)"
        required: false
        default: ""
      only_leaders:
        description: "через запятую: считать ТОЛЬКО этих лидеров -- так прогон делится на части"
        required: false
        default: ""
      seed_cache_from:
        description: "взять готовые симуляции из выгрузки прошлого прогона, напр. data/solana_retro_signal.json"
        required: false
        default: ""
      exit_deep_max_blocks:
        description: "потолок блоков глубокого добора выхода (60 = окно T+33..45с, которым мы торгуем)"
        required: false
        default: "60"

concurrency:
  group: solana-retro-signal
  cancel-in-progress: false

jobs:
  retro:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/nifty-sagan-r0polg

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Зависимости
        run: pip install -q requests

      # Шаг расчёта сам выгружает чекпойнты в git (см. push_checkpoint):
      # шаг коммита ниже выполняется только после успешного завершения, а
      # смысл чекпойнта ровно в том, чтобы пережить НЕзавершение.
      # persist-credentials у checkout@v4 включён по умолчанию, поэтому
      # push из шага работает тем же токеном.
      - name: "Ретро-сигнал (только чтение цепочки)"
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API }}
          HELIUS_API: ${{ secrets.HELIUS_API }}
        run: |
          set -o pipefail
          if [ -z "$HELIUS_API_KEY" ]; then
            echo "СТОП: секрет HELIUS_API пуст." >&2; exit 1
          fi
          python -u analysis/solana_retro_signal.py \
            --mode "${{ github.event.inputs.mode || 'calibrate' }}" \
            --workers "${{ github.event.inputs.workers || 4 }}" \
            --time-budget-s "${{ github.event.inputs.time_budget_s || 18000 }}" \
            --min-interval-s "${{ github.event.inputs.min_interval_s || '0.12' }}" \
            --limit "${{ github.event.inputs.limit || 0 }}" \
            --min-buys "${{ github.event.inputs.min_buys || 3 }}" \
            --extra-crowd "${{ github.event.inputs.extra_crowd }}" \
            --checkpoint-s "${{ github.event.inputs.checkpoint_s || 900 }}" \
            --only-leaders "${{ github.event.inputs.only_leaders }}" \
            --seed-cache-from "${{ github.event.inputs.seed_cache_from }}" \
            --exit-deep-max-blocks "${{ github.event.inputs.exit_deep_max_blocks || 60 }}" \
            ${{ github.event.inputs.checkpoint_push != 'no' && '--checkpoint-push' || '' }} \
            ${{ github.event.inputs.no_cache == 'yes' && '--no-cache' || '' }} \
            2>&1 | tail -600

      - name: "Гейт калибровки"
        if: always()
        run: |
          python - <<'PY'
          import json, pathlib, sys
          # Режимы пишут в РАЗНЫЕ файлы (калибровочный прогон раньше
          # затирал выгрузку полного), поэтому и читаем тот, что
          # соответствует режиму этого прогона.
          mode = "${{ github.event.inputs.mode || 'calibrate' }}"
          p = pathlib.Path("data/solana_retro_signal_calibration.json" if mode == "calibrate"
                            else "data/solana_retro_signal.json")
          if not p.exists():
              print(f"файла {p} нет -- скрипт не дошёл до записи"); sys.exit(0)
          d = json.loads(p.read_text())
          print("режим:", d["mode"])
          print("проба accounts:", json.dumps(d.get("проба_accounts"), ensure_ascii=False))
          print("самопроверка у двух провайдеров:", (d.get("self_check") or {}).get("ok"))
          c = d.get("calibration")
          if c:
              print("калибровка: n=%s Спирмен=%s Пирсон=%s знак=%s смещение=%s медиана|ошибки|=%s" % (
                  c.get("n"), c.get("spearman"), c.get("pearson"), c.get("sign_agreement"),
                  c.get("median_bias_pct"), c.get("median_abs_error_pct")))
              if d["mode"] == "calibrate" and not c.get("verdict_ok"):
                  print("::error::Калибровка не прошла -- основной прогон (mode=full) запускать НЕЛЬЗЯ.")
                  sys.exit(2)
          PY

      - name: "Коммит результата"
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # ПООТДЕЛЬНОСТИ: git add с несуществующим путём падает и не
          # добавляет НИЧЕГО, включая существующие соседние пути.
          for f in data/solana_retro_signal.json data/solana_retro_signal_calibration.json data/solana_retro_signal_cache.json data/solana_retro_signal_progress.json; do
            [ -f "$f" ] && git add "$f"
          done
          git diff --cached --quiet && { echo "нечего коммитить"; exit 0; }
          # Свои же чекпойнты уже в ветке -- подтягиваем, иначе итоговый
          # push будет отклонён как несинхронный.
          git pull --rebase origin claude/nifty-sagan-r0polg || true
          git commit -m "Ретро-сигнал: прогон [automated]"
          for i in 1 2 3 4 5; do
            git push origin HEAD:claude/nifty-sagan-r0polg && exit 0
            echo "push отклонён, попытка $i/5"
            git pull --rebase origin claude/nifty-sagan-r0polg
            sleep 3
          done
          echo "не удалось запушить после 5 попыток" >&2
          exit 1
