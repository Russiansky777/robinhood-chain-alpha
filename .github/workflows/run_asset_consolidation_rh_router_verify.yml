name: "Консолидация активов -- верификация реальных кандидатов в router на Robinhood Chain (только чтение)"

on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/sc1-pons-v2-launcher-efdbyt
    paths:
      - "data/p3_guard_cache/ASSET_CONSOLIDATION_RH_ROUTER_VERIFY_REQUEST"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r analysis/requirements.txt
      - name: "Верификация router-кандидатов (только чтение)"
        run: python -u analysis/asset_consolidation_rh_router_verify.py
      - name: Commit results
        if: always()
        run: |
          git rm -f --ignore-unmatch data/p3_guard_cache/ASSET_CONSOLIDATION_RH_ROUTER_VERIFY_REQUEST
          [ -e data/p3_guard_cache/asset_consolidation_rh_router_verify_result.json ] && git add data/p3_guard_cache/asset_consolidation_rh_router_verify_result.json
          git diff --cached --quiet && exit 0
          git commit -m "Консолидация активов: верификация router-кандидатов Robinhood Chain, результат [automated]"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected, попытка $i/5 -- git pull --rebase и повтор"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep 3
          done
          echo "не удалось запушить после 5 попыток" >&2
          exit 1
