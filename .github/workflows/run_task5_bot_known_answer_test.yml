name: "Задача 5, Путь А -- проверка против известного ответа (10 реальных прибыльных захватов)"

# Владелец, 2026-09-12: "Не 'прогнать и посмотреть, что видит', а
# 'проверить против известного ответа'. Взять 10 реальных прибыльных
# захватов >= $10 из данных Задачи 5 ... найти катализатор, прогнать
# через наш декодер и текущий триггер, ответ -- да/нет, если нет -- на
# каком шаге отвалился. Если 8-10 из 10 -- детекция работает, идём в
# живой запуск."
#
# Реально читает блокчейн (eth_getTransactionReceipt для реальных
# Swap-логов = ground truth пул(ы) захвата, eth_getBlockByNumber
# собственного блока захвата для поиска катализатора среди более ранних
# транзакций того же блока) -- read-only, без confirm-барьера (не
# деньги, не сигнатуры).

on:
  workflow_dispatch:
    inputs:
      script_path:
        description: 'Какой скрипт запустить на VPS (по умолчанию -- основная проверка против известного ответа; можно временно указать диагностический скрипт).'
        required: false
        default: 'analysis/task5_bot_known_answer_test.py'
        type: string

jobs:
  known_answer_test:
    name: "10 реальных захватов -- проверка декодера + триггера на Ohio VPS"
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: SSH key + known_hosts
        env:
          VPS_SSH_KEY_OHIO: ${{ secrets.VPS_SSH_KEY_OHIO }}
        run: |
          set -e
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY_OHIO" > ~/.ssh/vps_key_ohio
          chmod 600 ~/.ssh/vps_key_ohio
          ssh-keyscan -T 10 3.151.160.108 >> ~/.ssh/known_hosts 2>/dev/null
          echo "SSH_OPTS=-i $HOME/.ssh/vps_key_ohio -o ConnectTimeout=15 -o BatchMode=yes -o StrictHostKeyChecking=accept-new" >> "$GITHUB_ENV"

      - name: Подтянуть актуальный код на Ohio
        run: |
          ssh $SSH_OPTS ubuntu@3.151.160.108 '
            sudo -u bot git -C /home/bot/robinhood-chain-alpha fetch origin claude/nifty-sagan-r0polg
            sudo -u bot git -C /home/bot/robinhood-chain-alpha checkout claude/nifty-sagan-r0polg
            sudo -u bot git -C /home/bot/robinhood-chain-alpha reset --hard origin/claude/nifty-sagan-r0polg
            sudo -u bot git -C /home/bot/robinhood-chain-alpha log -1 --oneline
            sudo -u bot /home/bot/robinhood-chain-alpha/venv/bin/pip install -q -r /home/bot/robinhood-chain-alpha/analysis/requirements.txt
          '

      - name: "Проверка против известного ответа (RPC receipt+block, декодер, триггер)"
        env:
          SCRIPT_PATH: ${{ inputs.script_path }}
        run: |
          ssh $SSH_OPTS ubuntu@3.151.160.108 "
            sudo -u bot bash -c '
              set -a; . /etc/bot/env 2>/dev/null; set +a
              cd /home/bot/robinhood-chain-alpha
              ./venv/bin/python $SCRIPT_PATH
            '
          " > /tmp/known_answer_stdout.log 2> /tmp/known_answer_stderr.log
          echo "--- stdout ---"; cat /tmp/known_answer_stdout.log
          echo "--- stderr ---"; cat /tmp/known_answer_stderr.log

      - name: Забрать результат
        if: always()
        run: |
          ssh $SSH_OPTS ubuntu@3.151.160.108 'sudo -u bot cat /home/bot/robinhood-chain-alpha/data/task5_bot_known_answer_test_result.json 2>/dev/null' > /tmp/known_answer_result.json || true
          ssh $SSH_OPTS ubuntu@3.151.160.108 'sudo -u bot cat /home/bot/robinhood-chain-alpha/data/task5_bot_pool_registry_cache.json 2>/dev/null' > /tmp/pool_registry_cache.json || true
          ssh $SSH_OPTS ubuntu@3.151.160.108 'sudo -u bot cat /home/bot/robinhood-chain-alpha/data/task5_bot_known_answer_diag_block_result.json 2>/dev/null' > /tmp/diag_block_result.json || true
          ssh $SSH_OPTS ubuntu@3.151.160.108 'sudo -u bot cat /home/bot/robinhood-chain-alpha/data/task5_bot_known_answer_full_report.json 2>/dev/null' > /tmp/full_report_result.json || true
          ssh $SSH_OPTS ubuntu@3.151.160.108 'sudo -u bot cat /home/bot/robinhood-chain-alpha/data/task5_bot_known_answer_group2_resample_result.json 2>/dev/null' > /tmp/group2_resample_result.json || true
          ssh $SSH_OPTS ubuntu@3.151.160.108 'sudo -u bot cat /home/bot/robinhood-chain-alpha/data/task5_bot_profit_formula_audit_result.json 2>/dev/null' > /tmp/profit_audit_result.json || true
          ssh $SSH_OPTS ubuntu@3.151.160.108 'sudo -u bot cat /home/bot/robinhood-chain-alpha/data/task5_bot_profit_formula_audit_contract_balance_result.json 2>/dev/null' > /tmp/contract_balance_result.json || true
          ssh $SSH_OPTS ubuntu@3.151.160.108 'sudo -u bot cat /home/bot/robinhood-chain-alpha/data/task5_pool_pair_divergence_measurement_result.json 2>/dev/null' > /tmp/pool_pair_divergence_result.json || true

      - name: Commit results
        if: always()
        run: |
          mkdir -p data/p3_guard_cache
          {
            echo "# Проверка против известного ответа (10 реальных захватов) -- $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo ""
            echo "## stdout"; cat /tmp/known_answer_stdout.log 2>/dev/null || echo "(нет данных)"
            echo ""
            echo "## stderr"; cat /tmp/known_answer_stderr.log 2>/dev/null || echo "(нет данных)"
          } > data/p3_guard_cache/task5_bot_known_answer_test_log.txt
          git add data/p3_guard_cache/task5_bot_known_answer_test_log.txt
          if [ -s /tmp/known_answer_result.json ] && python3 -c "import json; json.load(open('/tmp/known_answer_result.json'))" 2>/dev/null; then
            cp /tmp/known_answer_result.json data/task5_bot_known_answer_test_result.json
            git add data/task5_bot_known_answer_test_result.json
          fi
          if [ -s /tmp/pool_registry_cache.json ] && python3 -c "import json; json.load(open('/tmp/pool_registry_cache.json'))" 2>/dev/null; then
            cp /tmp/pool_registry_cache.json data/task5_bot_pool_registry_cache.json
            git add data/task5_bot_pool_registry_cache.json
          fi
          if [ -s /tmp/diag_block_result.json ] && python3 -c "import json; json.load(open('/tmp/diag_block_result.json'))" 2>/dev/null; then
            cp /tmp/diag_block_result.json data/task5_bot_known_answer_diag_block_result.json
            git add data/task5_bot_known_answer_diag_block_result.json
          fi
          if [ -s /tmp/full_report_result.json ] && python3 -c "import json; json.load(open('/tmp/full_report_result.json'))" 2>/dev/null; then
            cp /tmp/full_report_result.json data/task5_bot_known_answer_full_report.json
            git add data/task5_bot_known_answer_full_report.json
          fi
          if [ -s /tmp/group2_resample_result.json ] && python3 -c "import json; json.load(open('/tmp/group2_resample_result.json'))" 2>/dev/null; then
            cp /tmp/group2_resample_result.json data/task5_bot_known_answer_group2_resample_result.json
            git add data/task5_bot_known_answer_group2_resample_result.json
          fi
          if [ -s /tmp/profit_audit_result.json ] && python3 -c "import json; json.load(open('/tmp/profit_audit_result.json'))" 2>/dev/null; then
            cp /tmp/profit_audit_result.json data/task5_bot_profit_formula_audit_result.json
            git add data/task5_bot_profit_formula_audit_result.json
          fi
          if [ -s /tmp/contract_balance_result.json ] && python3 -c "import json; json.load(open('/tmp/contract_balance_result.json'))" 2>/dev/null; then
            cp /tmp/contract_balance_result.json data/task5_bot_profit_formula_audit_contract_balance_result.json
            git add data/task5_bot_profit_formula_audit_contract_balance_result.json
          fi
          if [ -s /tmp/pool_pair_divergence_result.json ] && python3 -c "import json; json.load(open('/tmp/pool_pair_divergence_result.json'))" 2>/dev/null; then
            cp /tmp/pool_pair_divergence_result.json data/task5_pool_pair_divergence_measurement_result.json
            git add data/task5_pool_pair_divergence_measurement_result.json
          fi
          git diff --cached --quiet && exit 0
          git commit -m "Задача 5, Путь А: проверка против известного ответа (10 реальных захватов) [automated]"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected, попытка $i/5 -- git pull --rebase и повтор"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep 3
          done
          echo "не удалось запушить после 5 попыток" >&2
          exit 1
